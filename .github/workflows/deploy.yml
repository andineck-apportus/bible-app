# Bauen, prüfen und veröffentlichen (Cloudflare Pages).
# Bei Pull Requests: bauen und prüfen. Bei jedem Push auf main: zusätzlich veröffentlichen.
# Geheimnisse im Repo (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   Token mit Recht «Cloudflare Pages: Edit»
#   CLOUDFLARE_ACCOUNT_ID  Konto-ID aus dem Cloudflare-Dashboard
name: build-test-deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  PAGES_PROJECT: atmo-bible

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Daten prüfen
        run: python3 scripts/validate.py | tail -3
      - name: Python-Tests
        run: |
          python3 scripts/test_validate.py
          python3 scripts/test_versification.py
          python3 scripts/test_import.py
      - name: App bauen
        run: python3 scripts/build_bible.py | tail -1

      - name: Testwerkzeuge
        run: |
          npm install --no-save --no-audit --no-fund jsdom playwright
          npx playwright install --with-deps chromium
      - name: App-Tests
        run: |
          set -e
          for t in test_bible test_bible_dom test_bible_bilder test_bible_sidebar test_bible_vorlesen test_bible_lernen test_bible_navigation; do
            node scripts/$t.cjs
          done
          node scripts/test_bible_split.cjs bible

      - name: Veröffentlichung hochladen (aufgeteilte Fassung)
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: build/bible
          retention-days: 7
      - name: Einzeldatei zum Herunterladen (offline)
        uses: actions/upload-artifact@v4
        with:
          name: atmo-bible-offline
          path: app/bible/index.html
          retention-days: 30

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - name: Pages-Projekt anlegen (nur beim ersten Mal)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages project create "$PAGES_PROJECT" --production-branch=main || true
      - name: Auf Cloudflare Pages veröffentlichen
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ env.PAGES_PROJECT }} --branch=main --commit-dirty=true
