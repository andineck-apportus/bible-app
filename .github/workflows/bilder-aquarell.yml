# Bilder im Aquarellstil malen lassen (docs/BILDSTIL.md) mit dem Bildmodell von OpenAI.
# Start von Hand: Actions → «bilder-aquarell» → Run workflow. Geheimnis: OPENAI_API_KEY.
# Schritte «auto-neu» und «auto-pruefen» (scripts/authoring/bilder_aquarell_lauf.py): malen, automatisch prüfen, wählen,
# ablegen, Blasen setzen, Schlussprüfung; geänderte Daten auf Branch «bilder-auto/<Lauf>», Bericht auf «bildpilot-ausgabe».
# Schritte «felder» und «figurenblatt»: nur malen (Auswahl von Hand). Berührt main und das Deployment nicht.
name: bilder-aquarell

on:
  workflow_dispatch:
    inputs:
      schritt:
        description: "auto-neu (malen+prüfen+ablegen), auto-pruefen (abgelegte Bilder prüfen), felder, figurenblatt"
        type: choice
        options: [auto-neu, auto-pruefen, auto-kalibrieren, felder, figurenblatt]
        default: auto-neu
      szenen:
        description: "Szenen (z. B. JHN-002-K1,JHN-002-T1) oder «alle»"
        default: "alle"
      varianten:
        description: "Bilder je Szene"
        default: "2"
      hinweis:
        description: "Zusätzliche Anweisung für diesen Lauf (Englisch, optional)"
        default: ""
      runden:
        description: "auto-neu: höchstens so viele Malrunden je Szene"
        default: "3"
      pruefmodell:
        description: "Erste prüfende Instanz für diesen Lauf (Name oder Teil davon; leer = Vorgabe gpt-6.1-terra, Streitfälle entscheidet gpt-5.5)"
        default: ""
      erzwingen:
        description: "auto-pruefen: auch unveränderte Bilder neu prüfen"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: bildpilot
  cancel-in-progress: false

jobs:
  malen:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Werkzeuge
        run: |
          pip install -q pillow playwright numpy
          python -m playwright install --with-deps chromium

      - name: Bilder malen
        if: startsWith(inputs.schritt, 'auto-') == false
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL }}
          SCHRITT: ${{ inputs.schritt }}
          SZENEN: ${{ inputs.szenen }}
          VARIANTEN: ${{ inputs.varianten }}
          HINWEIS: ${{ inputs.hinweis }}
        run: python3 scripts/authoring/bilder_aquarell_gen.py "$SCHRITT" --szenen "$SZENEN" --varianten "$VARIANTEN" --hinweis "$HINWEIS"

      - name: Malen, prüfen, ablegen (automatisch)
        if: startsWith(inputs.schritt, 'auto-')
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL }}
          OPENAI_VISION_MODEL: ${{ inputs.pruefmodell || vars.OPENAI_VISION_MODEL }}
          OPENAI_VISION_MODEL_ZWEIT: ${{ vars.OPENAI_VISION_MODEL_ZWEIT }}
          SCHRITT: ${{ inputs.schritt }}
          SZENEN: ${{ inputs.szenen }}
          VARIANTEN: ${{ inputs.varianten }}
          HINWEIS: ${{ inputs.hinweis }}
          RUNDEN: ${{ inputs.runden }}
          ERZWINGEN: ${{ inputs.erzwingen }}
        run: |
          extra=""
          [ "$ERZWINGEN" = "true" ] && extra="--erzwingen"
          python3 scripts/authoring/bilder_aquarell_lauf.py "${SCHRITT#auto-}" --szenen "$SZENEN" --varianten "$VARIANTEN" --runden "$RUNDEN" --hinweis "$HINWEIS" $extra

      - name: Daten auf Branch bilder-auto/<Lauf>
        id: daten
        if: startsWith(inputs.schritt, 'auto-')
        env:
          LAUF: ${{ github.run_number }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data scripts/authoring/bilder_aquarell_daten
          git diff --cached --quiet && exit 0
          git checkout -b "bilder-auto/$LAUF"
          git commit -qm "Bilder automatisch: Lauf $LAUF (${{ inputs.schritt }} ${{ inputs.szenen }})"
          git push origin "bilder-auto/$LAUF"
          echo "branch=bilder-auto/$LAUF" >> "$GITHUB_OUTPUT"

      # Prozess PROC-FREIGABE 2.0 (Entscheid Andi Neck 2026-10-28): Lauf automatisch in main übernehmen, wenn Zusammenführen
      # und Validator bestehen; danach Bau, Tests und Veröffentlichung anstossen.
      - name: In main übernehmen
        if: steps.daten.outputs.branch != ''
        env:
          BRANCH: ${{ steps.daten.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ok=0
          for i in 1 2 3 4; do
            git fetch -q origin main
            git checkout -q -f -B uebernahme origin/main
            if python3 scripts/authoring/bilder_merge.py "$BRANCH" && git push origin HEAD:main; then ok=1; break; fi
            git merge --abort 2>/dev/null || true
            git reset -q --hard
            sleep 20
          done
          [ "$ok" = 1 ] || { echo "::error::Übernahme in main fehlgeschlagen – Lauf liegt auf $BRANCH"; exit 1; }
          gh workflow run deploy.yml --ref main

      - name: Auf Branch bildpilot-ausgabe sichern
        if: always()
        env:
          LAUF: ${{ github.run_number }}
        run: |
          set -e
          [ -d ausgabe/aquarell ] || exit 0
          mv ausgabe/aquarell "$RUNNER_TEMP/aquarell"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin bildpilot-ausgabe >/dev/null; then
            git fetch --depth 1 origin bildpilot-ausgabe
            git checkout -B bildpilot-ausgabe FETCH_HEAD
          else
            git checkout --orphan bildpilot-ausgabe
            git rm -rfq .
          fi
          mkdir -p ausgabe/aquarell
          cp -r "$RUNNER_TEMP/aquarell/." ausgabe/aquarell/
          git add ausgabe
          git commit -qm "Bilder Aquarell: Lauf $LAUF"
          git push origin bildpilot-ausgabe
