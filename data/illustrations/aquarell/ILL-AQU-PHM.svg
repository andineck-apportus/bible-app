 height="52.0" rx="7" fill="#ECEEE6" stroke="#8A9378" stroke-width="1" stroke-opacity=".55"/><text class="lw lw-de" x="300.0" y="291.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#3E413B" font-weight="400"><tspan x="300.0" dy="0.0">du schuldest mir dich selbst</tspan></text><text class="lw lw-gsw" x="300.0" y="291.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#3E413B" font-weight="400"><tspan x="300.0" dy="0.0">du bisch mir dich sälber schuldig</tspan></text><text x="500" y="309.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#7A7C73" text-anchor="end">1,19</text><line x1="300.0" y1="318.0" x2="300.0" y2="332.0" stroke="#7A7C73" stroke-width="1.8" marker-end="url(#sk-pf)"/><rect x="90" y="334.0" width="420" height="52.0" rx="7" fill="#ECEEE6" stroke="#8A9378" stroke-width="1" stroke-opacity=".55"/><text class="lw lw-de" x="300.0" y="361.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#3E413B" font-weight="400"><tspan x="300.0" dy="0.0">du wirst mehr tun, als ich sage</tspan></text><text class="lw lw-gsw" x="300.0" y="361.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#3E413B" font-weight="400"><tspan x="300.0" dy="0.0">du machsch meh, als ich säg</tspan></text><text x="500" y="379.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#7A7C73" text-anchor="end">1,21</text><rect x="0" y="400" width="600" height="46" fill="#FBF8F1"/><circle cx="24" cy="423.0" r="12" fill="none" stroke="#4A4D45" stroke-width="1.4"/><text x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4A4D45" class="pn-n">3</text><text class="lw lw-de" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">Nimm ihn auf wie mich</text><text class="lw lw-gsw" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">Nimm en uf wie mich</text><rect x="1" y="1" width="598" height="444" fill="none" stroke="#D8D0C0" stroke-width="1.2" vector-effect="non-scaling-stroke"/></svg></svg>
