<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1212 446"><svg class="ill-tile" data-span="1" data-scene="JHN-002-J1" x="0" y="0" width="600" height="446" viewBox="0 0 600 446"><image href="img/JHN-002-J1.webp" x="0" y="0" width="600" height="400" preserveAspectRatio="xMidYMid slice"/><rect x="0" y="400" width="600" height="46" fill="#FBF8F1"/><circle cx="24" cy="423.0" r="12" fill="none" stroke="#4A4D45" stroke-width="1.4"/><text x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4A4D45" class="pn-n">1</text><text class="lw lw-de" x="320.0" y="429.5" text-anchor="middle" font-family="sans-serif" font-size="18" font-style="italic" fill="#3B3D37">Jesus selbst aber vertraute sich ihnen nicht an</text><text class="lw lw-gsw" x="320.0" y="429.5" text-anchor="middle" font-family="sans-serif" font-size="18" font-style="italic" fill="#3B3D37">De Jesus sälber aber hät sich ine nöd aavertrout</text><rect x="1" y="1" width="598" height="444" fill="none" stroke="#D8D0C0" stroke-width="1.2" vector-effect="non-scaling-stroke"/></svg><svg class="ill-tile" data-span="1" data-scene="JHN-002-J2" x="612" y="0" width="600" height="446" viewBox="0 0 600 446"><image href="img/JHN-002-J2.webp" x="0" y="0" width="600" height="400" preserveAspectRatio="xMidYMid slice"/><rect x="0" y="400" width="600" height="46" fill="#FBF8F1"/><circle cx="24" cy="423.0" r="12" fill="none" stroke="#4A4D45" stroke-width="1.4"/><text x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4A4D45" class="pn-n">2</text><text class="lw lw-de" x="320.0" y="429.5" text-anchor="middle" font-family="sans-serif" font-size="18" font-style="italic" fill="#3B3D37">er selbst erkannte nämlich, was im Menschen war</text><text class="lw lw-gsw" x="320.0" y="429.5" text-anchor="middle" font-family="sans-serif" font-size="18" font-style="italic" fill="#3B3D37">er sälber hät nämli erchännt, was im Mänsch isch</text><rect x="1" y="1" width="598" height="444" fill="none" stroke="#D8D0C0" stroke-width="1.2" vector-effect="non-scaling-stroke"/></svg></svg>
