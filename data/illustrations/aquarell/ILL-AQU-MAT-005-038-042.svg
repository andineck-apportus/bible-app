7" text-anchor="middle"  font-weight="650"><tspan x="220.0" dy="0.0">Sondern:</tspan></text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-gsw" x="220.0" y="27.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle"  font-weight="650"><tspan x="220.0" dy="0.0">Sondern:</tspan></text><rect style="fill:var(--sk-karte,#FFFFFF)" x="12.0" y="41.2" width="204.0" height="162.5" rx="10"  filter="url(#sk-schatten)"/><circle style="fill:var(--sk-text,#1E2629)" cx="28.0" cy="57.2" r="9"  fill-opacity=".86"/><text style="fill:var(--sk-marke-text,#FEFEFE)" x="28.0" y="61.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" >1</text><svg x="102.4" y="50.2" width="47.2" height="56.0" viewBox="29 90 345 409" preserveAspectRatio="xMidYMid meet"><image href="figuren/FIG-ZEICHEN-OHRFEIGE.webp" x="0" y="0" width="384" height="576" style="filter:var(--sk-bild-filter,url(#sk-bild))"/></svg><text style="fill:var(--sk-text,#1E2629)" class="lw lw-de" x="126.0" y="123.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="600"><tspan x="126.0" dy="0.0">Wer dich auf</tspan><tspan x="126.0" dy="17.5">die rechte Wange</tspan><tspan x="126.0" dy="17.5">schlägt,</tspan></text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-gsw" x="126.0" y="131.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="600"><tspan x="126.0" dy="0.0">Wär dich uf de rächt</tspan><tspan x="126.0" dy="17.5">Bagge schlaat,</tspan></text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-de" x="126.0" y="175.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle"  font-weight="400"><tspan x="126.0" dy="0.0">dem halte auch</tspan><tspan x="126.0" dy="15.0">die andere hin.</tspan></text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-gsw" x="126.0" y="183.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle"  font-weight="400"><tspan x="126.0" dy="0.0">däm heb au de ander ane.</tspan></text><rect style="fill:var(--sk-karte,#FFFFFF)" x="224.0" y="41.2" width="204.0" height="162.5" rx="10"  filter="url(#sk-schatten)"/><circle style="fill:var(--sk-text,#1E2629)" cx="240.0" cy="57.2" r="9"  fill-opacity=".86"/><text style="fill:var(--sk-marke-text,#FEFEFE)" x="240.0" y="61.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" >2</text><svg x="299.4" y="59.0" width="35.6" height="56.0" viewBox="40 58 302 475" preserveAspectRatio="xMidYMid meet"><image href="figuren/FIG-OBJ-GEWAND.webp" x="0" y="0" width="384" height="576" style="filter:var(--sk-bild-filter,url(#sk-bild))"/></svg><svg x="339.0" y="59.0" width="37.5" height="56.0" viewBox="32 59 323 482" preserveAspectRatio="xMidYMid meet"><image href="figuren/FIG-OBJ-OBERGEWAND.webp" x="0" y="0" width="384" height="576" style="filter:var(--sk-bild-filter,url(#sk-bild))"/></svg><text style="fill:var(--sk-text,#1E2629)" class="lw lw-de" x="338.0" y="131.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="600"><tspan x="338.0" dy="0.0">Wer dein Hemd nehmen</tspan><tspan x="338.0" dy="17.5">will,</tspan></text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-gsw" x="338.0" y="131.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="600"><tspan x="338.0" dy="0.0">Wär dis Hemd näh</tspan><tspan x="338.0" dy="17.5">wott,</tspan></text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-de" x="338.0" y="167.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle"  font-weight="400"><tspan x="338.0" dy="0.0">dem lass auch</tspan><tspan x="338.0" dy="15.0">den Mantel.</tspan></text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-gsw" x="338.0" y="174.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle"  font-weight="400"><tspan x="338.0" dy="0.0">däm la au de Mantel.</tspan></text><rect style="fill:var(--sk-karte,#FFFFFF)" x="12.0" y="211.8" width="204.0" height="160.0" rx="10"  filter="url(#sk-schatten)"/><circle style="fill:var(--sk-text,#1E2629)" cx="28.0" cy="227.8" r="9"  fill-opacity=".86"/><text style="fill:var(--sk-marke-text,#FEFEFE)" x="28.0" y="231.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" >3</text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-de" x="126.0" y="269.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="600"><tspan x="126.0" dy="0.0">Wer dich zwingt,</tspan><tspan x="126.0" dy="17.5">eine Meile</tspan><tspan x="126.0" dy="17.5">mitzugehen,</tspan></text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-gsw" x="126.0" y="278.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="600"><tspan x="126.0" dy="0.0">Wär dich zwingt, ei</tspan><tspan x="126.0" dy="17.5">Meile mitzgaa,</tspan></text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-de" x="126.0" y="322.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle"  font-weight="400"><tspan x="126.0" dy="0.0">mit dem geh zwei.</tspan></text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-gsw" x="126.0" y="322.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle"  font-weight="400"><tspan x="126.0" dy="0.0">mit däm gang zwei.</tspan></text><rect style="fill:var(--sk-karte,#FFFFFF)" x="224.0" y="211.8" width="204.0" height="160.0" rx="10"  filter="url(#sk-schatten)"/><circle style="fill:var(--sk-text,#1E2629)" cx="240.0" cy="227.8" r="9"  fill-opacity=".86"/><text style="fill:var(--sk-marke-text,#FEFEFE)" x="240.0" y="231.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" >4</text><svg x="306.8" y="220.8" width="62.5" height="56.0" viewBox="13 161 367 329" preserveAspectRatio="xMidYMid meet"><image href="figuren/FIG-ZEICHEN-GEBEN.webp" x="0" y="0" width="384" height="576" style="filter:var(--sk-bild-filter,url(#sk-bild))"/></svg><text style="fill:var(--sk-text,#1E2629)" class="lw lw-de" x="338.0" y="293.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="600"><tspan x="338.0" dy="0.0">Gib dem, der dich</tspan><tspan x="338.0" dy="17.5">bittet,</tspan></text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-gsw" x="338.0" y="293.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="600"><tspan x="338.0" dy="0.0">Gib däm, wo dich</tspan><tspan x="338.0" dy="17.5">bittet,</tspan></text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-de" x="338.0" y="328.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle"  font-weight="400"><tspan x="338.0" dy="0.0">und wende dich nicht ab</tspan><tspan x="338.0" dy="15.0">von dem, der borgen</tspan><tspan x="338.0" dy="15.0">will.</tspan></text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-gsw" x="338.0" y="328.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle"  font-weight="400"><tspan x="338.0" dy="0.0">und cher di nöd ab vo</tspan><tspan x="338.0" dy="15.0">däm, wo öppis entlehne</tspan><tspan x="338.0" dy="15.0">wott.</tspan></text></svg><g transform="translate(0 123.29999999999995)"><circle style="stroke:var(--sk-text,#4A4D45)" cx="24" cy="423.0" r="12" fill="none"  stroke-width="1.4"/><text style="fill:var(--sk-text,#4A4D45)" x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14"  class="pn-n">2</text><text style="fill:var(--sk-text,#3B3D37)" class="lw lw-de" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" ></text><text style="fill:var(--sk-text,#3B3D37)" class="lw lw-gsw" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" ></text></g></g></svg></svg>
