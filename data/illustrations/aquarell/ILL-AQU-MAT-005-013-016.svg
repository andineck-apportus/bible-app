le="fill:var(--sk-flaeche,#F3F8FA)" width="440" height="215.2" /><text style="fill:var(--sk-text,#1E2629)" class="lw lw-de" x="220.0" y="27.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle"  font-weight="650"><tspan x="220.0" dy="0.0">Ihr seid das Salz der Erde.</tspan></text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-gsw" x="220.0" y="27.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle"  font-weight="650"><tspan x="220.0" dy="0.0">Ir sind s Salz vo de Erde.</tspan></text><rect style="fill:var(--sk-karte,#FFFFFF)" x="12.0" y="41.2" width="416.0" height="95.5" rx="10"  filter="url(#sk-schatten)"/><svg x="186.1" y="50.2" width="67.8" height="56.0" viewBox="42 184 294 243" preserveAspectRatio="xMidYMid meet"><image href="figuren/FIG-OBJ-SALZ.webp" x="0" y="0" width="384" height="576" style="filter:var(--sk-bild-filter,url(#sk-bild))"/></svg><text style="fill:var(--sk-text,#1E2629)" class="lw lw-de" x="220.0" y="123.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="400"><tspan x="220.0" dy="0.0">Wenn aber das Salz fad wird</tspan></text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-gsw" x="220.0" y="123.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="400"><tspan x="220.0" dy="0.0">Wänn aber s Salz fad wird</tspan></text><line style="stroke:var(--sk-text-leise,#76828A)" x1="220.0" y1="137.8" x2="220.0" y2="148.8"  stroke-width="1.8" stroke-linecap="round" marker-end="url(#sk-pf)"/><rect style="fill:var(--sk-a,#FFE7DE)" x="12.0" y="150.8" width="416.0" height="52.5" rx="10"  filter="url(#sk-schatten)"/><text style="fill:var(--sk-text,#1E2629)" class="lw lw-de" x="220.0" y="172.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="600"><tspan x="220.0" dy="0.0">Es taugt zu nichts mehr.</tspan></text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-gsw" x="220.0" y="172.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="600"><tspan x="220.0" dy="0.0">Es isch für nüüt meh guet.</tspan></text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-de" x="220.0" y="190.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle"  font-weight="400"><tspan x="220.0" dy="0.0">Es wird hinausgeworfen und zertreten.</tspan></text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-gsw" x="220.0" y="190.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle"  font-weight="400"><tspan x="220.0" dy="0.0">Es wird usegworfe und vertrampet.</tspan></text></svg><g transform="translate(0 -106.5)"><circle style="stroke:var(--sk-text,#4A4D45)" cx="24" cy="423.0" r="12" fill="none"  stroke-width="1.4"/><text style="fill:var(--sk-text,#4A4D45)" x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14"  class="pn-n">1</text><text style="fill:var(--sk-text,#3B3D37)" class="lw lw-de" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" ></text><text style="fill:var(--sk-text,#3B3D37)" class="lw lw-gsw" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" ></text></g></g></svg><svg class="ill-tile" data-span="1" data-scene="S-MAT-005-013-016-2" x="612" y="0" width="600" height="316.3" viewBox="0 0 600 316.3"><defs><clipPath id="kc-S-MAT-005-013-016-2"><rect width="600" height="316.3" rx="22"/></clipPath></defs><g clip-path="url(#kc-S-MAT-005-013-016-2)"><rect style="fill:var(--sk-flaeche,#F3F8FA)" width="600" height="316.3" /><svg x="0" y="0" width="600" height="270.3" viewBox="0 0 440 198.2"><defs><marker id="sk-pf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path style="fill:var(--sk-pfeil,#7A8489)" d="M0 0L10 5L0 10z" /></marker><f