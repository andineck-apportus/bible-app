er="url(#sk-schatten)"/><circle style="fill:var(--sk-text,#1E2629)" cx="28.0" cy="57.2" r="9"  fill-opacity=".86"/><text style="fill:var(--sk-marke-text,#FEFEFE)" x="28.0" y="61.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" >1</text><svg x="98.2" y="50.2" width="55.6" height="56.0" viewBox="10 121 371 374" preserveAspectRatio="xMidYMid meet"><image href="figuren/FIG-ORT-STADT.webp" x="0" y="0" width="384" height="576" style="filter:var(--sk-bild-filter,url(#sk-bild))"/></svg><text style="fill:var(--sk-text,#1E2629)" class="lw lw-de" x="126.0" y="123.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="600"><tspan x="126.0" dy="0.0">Eine Stadt auf</tspan><tspan x="126.0" dy="17.5">einem Berg</tspan></text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-gsw" x="126.0" y="131.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="600"><tspan x="126.0" dy="0.0">E Stadt uf eme Bärg</tspan></text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-de" x="126.0" y="158.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle"  font-weight="400"><tspan x="126.0" dy="0.0">kann nicht verborgen</tspan><tspan x="126.0" dy="15.0">bleiben.</tspan></text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-gsw" x="126.0" y="158.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle"  font-weight="400"><tspan x="126.0" dy="0.0">cha nöd versteckt</tspan><tspan x="126.0" dy="15.0">bliibe.</tspan></text><rect style="fill:var(--sk-karte,#FFFFFF)" x="224.0" y="41.2" width="204.0" height="145.0" rx="10"  filter="url(#sk-schatten)"/><circle style="fill:var(--sk-text,#1E2629)" cx="240.0" cy="57.2" r="9"  fill-opacity=".86"/><text style="fill:var(--sk-marke-text,#FEFEFE)" x="240.0" y="61.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-