" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" ></text><text style="fill:var(--sk-text,#3B3D37)" class="lw lw-gsw" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" ></text></g></g></svg><svg class="ill-tile" data-span="1" data-scene="S-MAT-005-013-016-3" x="306" y="351.5" width="600" height="591.1" viewBox="0 0 600 591.1"><defs><clipPath id="kc-S-MAT-005-013-016-3"><rect width="600" height="591.1" rx="22"/></clipPath></defs><g clip-path="url(#kc-S-MAT-005-013-016-3)"><rect style="fill:var(--sk-flaeche,#F3F8FA)" width="600" height="591.1" /><svg x="0" y="0" width="600" height="545.1" viewBox="0 0 440 399.8"><defs><marker id="sk-pf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path style="fill:var(--sk-pfeil,#7A8489)" d="M0 0L10 5L0 10z" /></marker><filter id="sk-schatten" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#22292C" flood-opacity=".13"/></filter><radialGradient id="sk-wash" cx="30%" cy="25%" r="80%"><stop offset="0" stop-color="#EFE6D6" stop-opacity=".9"/><stop offset="1" stop-color="#FBF8F1" stop-opacity="0"/></radialGradient><radialGradient id="sk-glorie" r="50%"><stop offset=".3" stop-color="#E9B954" stop-opacity=".95"/><stop offset="1" stop-color="#E9B954" stop-opacity="0"/></radialGradient><filter id="sk-aq" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".06" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="3.5"/><feGaussianBlur stdDeviation=".35"/></filter><filter id="sk-papier" color-interpolation-filters="sRGB"><feComponentTransfer><feFuncR type="linear" slope="1.12"/><feFuncG type="linear" slope="1.12"/><feFuncB type="linear" slope="1.14"/></feComponentTransfer></filter><filter id="sk-bild" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="1.2" stdDeviation=