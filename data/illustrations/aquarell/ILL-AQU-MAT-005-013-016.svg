" font-size="13" text-anchor="start"  font-weight="400" font-style="italic"><tspan x="230.0" dy="0.0">damit</tspan></text><text style="fill:var(--sk-a-text,#E76444)" class="lw lw-gsw" x="230.0" y="154.7" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" text-anchor="start"  font-weight="400" font-style="italic"><tspan x="230.0" dy="0.0">damit</tspan></text><rect style="fill:var(--sk-karte,#FFFFFF)" x="12.0" y="166.8" width="416.0" height="95.5" rx="10"  filter="url(#sk-schatten)"/><svg x="190.5" y="175.8" width="59.0" height="56.0" viewBox="28 138 337 320" preserveAspectRatio="xMidYMid meet"><image href="figuren/FIG-ZEICHEN-GUTE-WERKE.webp" x="0" y="0" width="384" height="576" style="filter:var(--sk-bild-filter,url(#sk-bild))"/></svg><text style="fill:var(--sk-text,#1E2629)" class="lw lw-de" x="220.0" y="248.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="400"><tspan x="220.0" dy="0.0">Sie sehen eure guten Werke</tspan></text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-gsw" x="220.0" y="248.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="400"><tspan x="220.0" dy="0.0">Si gsehnd öii guete Wärch</tspan></text><line style="stroke:var(--sk-text-leise,#76828A)" x1="220.0" y1="263.2" x2="220.0" y2="290.2"  stroke-width="1.8" stroke-linecap="round" marker-end="url(#sk-pf)"/><text style="fill:var(--sk-a-text,#E76444)" class="lw lw-de" x="230.0" y="280.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" text-anchor="start"  font-weight="400" font-style="italic"><tspan x="230.0" dy="0.0">und</tspan></text><text style="fill:var(--sk-a-text,#E76444)" class="lw lw-gsw" x="230.0" y="280.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" text-anchor="start"  font-weight="400" font-style="italic"><tspan x="230.0" dy="0.0">und</tspan></text><rect style="fill:var(--sk-betont,#F6F6BC)" x="12.0" y="292.2" width="416.0" height="95.5" rx="10"  filter="url(#sk-schatten)"/><svg x="200.3" y="301.2" width="39.4" height="56.0" viewBox="0 13 384 546" preserveAspectRatio="xMidYMid meet"><image href="figuren/FIG-ZEICHEN-PREISEN.webp" x="0" y="0" width="384" height="576" style="filter:var(--sk-bild-filter,url(#sk-bild))"/></svg><text style="fill:var(--sk-text,#1E2629)" class="lw lw-de" x="220.0" y="374.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="600"><tspan x="220.0" dy="0.0">Sie preisen euren Vater in den Himmeln.</tspan></text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-gsw" x="220.0" y="374.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="600"><tspan x="220.0" dy="0.0">Si priised öie Vatter i de Himmel.</tspan></text></svg><g transform="translate(0 145.10000000000002)"><circle style="stroke:var(--sk-text,#4A4D45)" cx="24" cy="423.0" r="12" fill="none"  stroke-width="1.4"/><text style="fill:var(--sk-text,#4A4D45)" x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14"  class="pn-n">3</text><text style="fill:var(--sk-text,#3B3D37)" class="lw lw-de" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" ></text><text style="fill:var(--sk-text,#3B3D37)" class="lw lw-gsw" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" ></text></g></g></svg></svg>
