12.0" width="204.0" height="143.5" rx="10"  filter="url(#sk-schatten)"/><circle style="fill:var(--sk-text,#1E2629)" cx="240.0" cy="28.0" r="9"  fill-opacity=".86"/><text style="fill:var(--sk-marke-text,#FEFEFE)" x="240.0" y="32.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" >2</text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-de" x="338.0" y="55.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="400"><tspan x="338.0" dy="0.0">Als es Tag wird,</tspan><tspan x="338.0" dy="17.5">wählt er zwölf aus</tspan><tspan x="338.0" dy="17.5">den Jüngern aus, die</tspan><tspan x="338.0" dy="17.5">er Apostel …</tspan></text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-gsw" x="338.0" y="55.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="400"><tspan x="338.0" dy="0.0">Wo s Tag wird, wählt</tspan><tspan x="338.0" dy="17.5">er zwölf us de</tspan><tspan x="338.0" dy="17.5">Jünger uus, won er</tspan><tspan x="338.0" dy="17.5">Apostel nännt, …</tspan></text><text style="fill:var(--sk-text-leise,#76828A)" x="419.0" y="146.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5"  text-anchor="end">6,13–16</text></svg><g transform="translate(0 -171.6)"><circle style="stroke:var(--sk-text,#4A4D45)" cx="24" cy="423.0" r="12" fill="none"  stroke-width="1.4"/><text style="fill:var(--sk-text,#4A4D45)" x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14"  class="pn-n">1</text><text style="fill:var(--sk-text,#3B3D37)" class="lw lw-de" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" ></text><text style="fill:var(--sk-text,#3B3D37)" class="lw lw-gsw" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" ></text></g></g></svg></svg>
