-weight="400"><tspan x="490.0" dy="-9.0">di reine Härzes: si</tspan><tspan x="490.0" dy="18.0">gsehnd Gott</tspan></text><text x="572.0" y="248" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#7A7C73" text-anchor="end">5,8</text><rect x="20.0" y="266" width="180.0" height="96" rx="7" fill="#ECEEE6" stroke="#8A9378" stroke-width="1" stroke-opacity=".55"/><text x="29.0" y="281" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#7A7C73">7</text><text class="lw lw-de" x="110.0" y="318.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.5" text-anchor="middle" fill="#3E413B" font-weight="400"><tspan x="110.0" dy="-18.0">die Frieden</tspan><tspan x="110.0" dy="18.0">stiften: Kinder</tspan><tspan x="110.0" dy="18.0">Gottes</tspan></text><text class="lw lw-gsw" x="110.0" y="318.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.5" text-anchor="middle" fill="#3E413B" font-weight="400"><tspan x="110.0" dy="-9.0">di Fride stifted:</tspan><tspan x="110.0" dy="18.0">Chind vo Gott</tspan></text><text x="192.0" y="354" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#7A7C73" text-anchor="end">5,9</text><rect x="210.0" y="266" width="180.0" height="96" rx="7" fill="#EDD3B4" stroke="#8A9378" stroke-width="1" stroke-opacity=".55"/><text x="219.0" y="281" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#7A7C73">8</text><text class="lw lw-de" x="300.0" y="318.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.5" text-anchor="middle" fill="#3E413B" font-weight="600"><tspan x="300.0" dy="-18.0">verfolgt um</tspan><tspan x="300.0" dy="18.0">Gerechtigkeit:</tspan><tspan x="300.0" dy="18.0">Himmelreich</tspan></text><text class="lw lw-gsw" x="300.0" y="318.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.5" text-anchor="middle" fill="#3E413B" font-weight="600"><tspan x="300.0" dy="-18.0">verfolgt wäg</tspan><tspan x="300.0" dy="1