nd Gott</tspan></text><text x="572.0" y="249" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#7A7C73" text-anchor="end">5,8</text><rect x="20.0" y="266" width="180.0" height="96" rx="7" fill="#ECEEE6" stroke="#8A9378" stroke-width="1" stroke-opacity="0.55"/><circle cx="36.0" cy="282" r="11" fill="#FBF8F1" stroke="#8A9378"/><text x="36.0" y="286.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" fill="#3E413B">7</text><text class="lw lw-de" x="110.0" y="323.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#3E413B" font-weight="400"><tspan x="110.0" dy="-21.1">die Frieden</tspan><tspan x="110.0" dy="21.1">stiften: Kinder</tspan><tspan x="110.0" dy="21.1">Gottes</tspan></text><text class="lw lw-gsw" x="110.0" y="323.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#3E413B" font-weight="400"><tspan x="110.0" dy="-10.5">di Fride stifted:</tspan><tspan x="110.0" dy="21.1">Chind vo Gott</tspan></text><text x="192.0" y="355" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#7A7C73" text-anchor="end">5,9</text><rect x="210.0" y="266" width="180.0" height="96" rx="7" fill="#EFE3D4" stroke="#A4532A" stroke-width="2.2" stroke-opacity="1"/><circle cx="226.0" cy="282" r="11" fill="#FBF8F1" stroke="#8A9378"/><text x="226.0" y="286.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" fill="#3E413B">8</text><text class="lw lw-de" x="300.0" y="323.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#3E413B" font-weight="400"><tspan x="300.0" dy="-21.1">verfolgt um</tspan><tspan x="300.0" dy="21.1">Gerechtigkeit:</tspan><tspan x="300.0" dy="21.1">Himmelreich</tspan></text><text class="lw lw-gsw" x="300.0" y="323.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#3E413B" font-weight=