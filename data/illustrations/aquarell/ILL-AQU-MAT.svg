xt><text style="fill:var(--sk-text-leise,#76828A)" x="419.0" y="189.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5"  text-anchor="end">5,6</text><rect style="fill:var(--sk-karte,#FFFFFF)" x="12.0" y="206.8" width="204.0" height="66.0" rx="10"  filter="url(#sk-schatten)"/><circle style="fill:var(--sk-text,#1E2629)" cx="28.0" cy="222.8" r="9"  fill-opacity=".86"/><text style="fill:var(--sk-marke-text,#FEFEFE)" x="28.0" y="226.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" >5</text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-de" x="126.0" y="228.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="400"><tspan x="126.0" dy="0.0">die Barmherzigen:</tspan><tspan x="126.0" dy="17.5">sie finden Erbarmen</tspan></text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-gsw" x="126.0" y="228.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="400"><tspan x="126.0" dy="0.0">di Barmhärzige: si</tspan><tspan x="126.0" dy="17.5">findet Erbarme</tspan></text><text style="fill:var(--sk-text-leise,#76828A)" x="207.0" y="263.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5"  text-anchor="end">5,7</text><rect style="fill:var(--sk-karte,#FFFFFF)" x="224.0" y="206.8" width="204.0" height="66.0" rx="10"  filter="url(#sk-schatten)"/><circle style="fill:var(--sk-text,#1E2629)" cx="240.0" cy="222.8" r="9"  fill-opacity=".86"/><text style="fill:var(--sk-marke-text,#FEFEFE)" x="240.0" y="226.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" >6</text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-de" x="338.0" y="228.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="400"><tspan x="338.0" dy="0.0">die reinen Herzens:</tspan><tspan x="338.0" dy="17.5">sie sehen Gott</tspan></text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-gsw" x="338.0" y="228.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="400"><tspan x="338.0" dy="0.0">di reine Härzes: si</tspan><tspan x="338.0" dy="17.5">gsehnd Gott</tspan></text><text style="fill:var(--sk-text-leise,#76828A)" x="419.0" y="263.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5"  text-anchor="end">5,8</text><rect style="fill:var(--sk-karte,#FFFFFF)" x="12.0" y="280.8" width="204.0" height="83.5" rx="10"  filter="url(#sk-schatten)"/><circle style="fill:var(--sk-text,#1E2629)" cx="28.0" cy="296.8" r="9"  fill-opacity=".86"/><text style="fill:var(--sk-marke-text,#FEFEFE)" x="28.0" y="300.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" >7</text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-de" x="126.0" y="311.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="400"><tspan x="126.0" dy="0.0">die Frieden stiften:</tspan><tspan x="126.0" dy="17.5">Kinder Gottes</tspan></text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-gsw" x="126.0" y="311.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="400"><tspan x="126.0" dy="0.0">di Fride stifted:</tspan><tspan x="126.0" dy="17.5">Chind vo Gott</tspan></text><text style="fill:var(--sk-text-leise,#76828A)" x="207.0" y="355.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5"  text-anchor="end">5,9</text><rect style="fill:var(--sk-betont,#F6F6BC)" x="224.0" y="280.8" width="204.0" height="83.5" rx="10"  filter="url(#sk-schatten)"/><circle style="fill:var(--sk-text,#1E2629)" cx="240.0" cy="296.8" r="9"  fill-opacity=".86"/><text style="fill:var(--sk-marke-text,#FEFEFE)" x="240.0" y="300.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" >8</text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-de" x="338.0" y="302.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="600"><tspan x="338.0" dy="0.0">verfolgt um</tspan><tspan x="338.0" dy="17.5">Gerechtigkeit:</tspan><tspan x="338.0" dy="17.5">Himmelreich</tspan></text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-gsw" x="338.0" y="302.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="600"><tspan x="338.0" dy="0.0">verfolgt wäg</tspan><tspan x="338.0" dy="17.5">Grächtigkeit:</tspan><tspan x="338.0" dy="17.5">Himmelriich</tspan></text><text style="fill:var(--sk-text-leise,#76828A)" x="419.0" y="355.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5"  text-anchor="end">5,10</text></svg><g transform="translate(0 113.10000000000002)"><circle style="stroke:var(--sk-text,#4A4D45)" cx="24" cy="423.0" r="12" fill="none"  stroke-width="1.4"/><text style="fill:var(--sk-text,#4A4D45)" x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14"  class="pn-n">2</text><text style="fill:var(--sk-text,#3B3D37)" class="lw lw-de" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" >Er lehrte sie wie einer, der Vollmacht hat</text><text style="fill:var(--sk-text,#3B3D37)" class="lw lw-gsw" x="320.0" y="429.1" text-anchor="middle" font-family="sans-serif" font-size="17" font-style="italic" >er hät si nämli glehrt wie eine, wo Vollmacht hät</text></g></g></svg><svg class="ill-tile" data-span="1" data-scene="MAT-B3" x="0" y="571.1" width="600" height="446" viewBox="0 0 600 446"><defs><clipPath id="kc-MAT-B3"><rect width="600" height="446" rx="22"/></clipPath></defs><g clip-path="url(#kc-MAT-B3)"><rect width="600" height="446" fill="#FBF8F1"/><image href="img/MAT-B3.webp" x="0" y="0" width="600" height="400" preserveAspectRatio="xMidYMid slice"/><rect x="0" y="400" 