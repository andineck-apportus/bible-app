etica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="600"><tspan x="126.0" dy="0.0">die Armen im Geist:</tspan><tspan x="126.0" dy="17.5">das Himmelreich</tspan></text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-gsw" x="126.0" y="63.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="600"><tspan x="126.0" dy="0.0">di Arme im Geischt:</tspan><tspan x="126.0" dy="17.5">s Himmelriich</tspan></text><text style="fill:var(--sk-text-leise,#76828A)" x="207.0" y="98.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5"  text-anchor="end">5,3</text><rect style="fill:var(--sk-karte,#FFFFFF)" x="224.0" y="41.2" width="204.0" height="66.0" rx="10"  filter="url(#sk-schatten)"/><circle style="fill:var(--sk-text,#1E2629)" cx="240.0" cy="57.2" r="9"  fill-opacity=".86"/><text style="fill:var(--sk-marke-text,#FEFEFE)" x="240.0" y="61.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" >2</text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-de" x="338.0" y="63.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="400"><tspan x="338.0" dy="0.0">die Trauernden: sie</tspan><tspan x="338.0" dy="17.5">werden getröstet</tspan></text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-gsw" x="338.0" y="63.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="400"><tspan x="338.0" dy="0.0">di Truurige: si</tspan><tspan x="338.0" dy="17.5">wärded tröschtet</tspan></text><text style="fill:var(--sk-text-leise,#76828A)" x="419.0" y="98.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5"  text-anchor="end">5,4</text><rect style="fill:var(--sk-karte,#FFFFFF)" x="12.0" y="115.2" width="204.0" height="83.5" rx="10"  filter="url(#sk-schatten)"/><circle style="fill:var(--sk-text,#1E2629)" cx="28.0" cy="131.2" r="9"  fill-opa