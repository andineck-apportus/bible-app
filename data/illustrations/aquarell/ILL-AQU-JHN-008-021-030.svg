xt,#FEFEFE)" x="240.0" y="32.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" >2</text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-de" x="338.0" y="72.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="400"><tspan x="338.0" dy="0.0">Ihr seid von unten,</tspan><tspan x="338.0" dy="17.5">ich bin von oben</tspan></text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-gsw" x="338.0" y="72.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="400"><tspan x="338.0" dy="0.0">Ir sind vo unde, ich</tspan><tspan x="338.0" dy="17.5">bi vo obe</tspan></text><text style="fill:var(--sk-text-leise,#76828A)" x="419.0" y="146.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5"  text-anchor="end">8,23–24</text><rect style="fill:var(--sk-karte,#FFFFFF)" x="118.0" y="163.5" width="204.0" height="83.5" rx="10"  filter="url(#sk-schatten)"/><circle style="fill:var(--sk-text,#1E2629)" cx="134.0" cy="179.5" r="9"  fill-opacity=".86"/><text style="fill:var(--sk-marke-text,#FEFEFE)" x="134.0" y="183.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" >3</text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-de" x="232.0" y="185.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="400"><tspan x="232.0" dy="0.0">dann werdet ihr</tspan><tspan x="232.0" dy="17.5">erkennen, dass ich</tspan><tspan x="232.0" dy="17.5">bin</tspan></text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-gsw" x="232.0" y="185.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="400"><tspan x="232.0" dy="0.0">dänn wärded ir</tspan><tspan x="232.0" dy="17.5">erchänne, dass ich</tspan><tspan x="232.0" dy="17.5">bi</tspan></text><text style="fill:var(--sk-text-leise,#76