filter,url(#sk-bild))"/></svg><text style="fill:var(--sk-text,#1E2629)" class="lw lw-de" x="220.0" y="123.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="400"><tspan x="220.0" dy="0.0">Wenn eure Gerechtigkeit nicht weit über</tspan><tspan x="220.0" dy="17.5">die der Schriftgelehrten und Pharisäer hinausgeht</tspan></text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-gsw" x="220.0" y="123.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="400"><tspan x="220.0" dy="0.0">Wänn öii Grächtigkeit nöd wiit über die vo</tspan><tspan x="220.0" dy="17.5">de Schriftglehrte und Pharisäer usegaat</tspan></text><line style="stroke:var(--sk-text-leise,#76828A)" x1="220.0" y1="155.2" x2="220.0" y2="166.2"  stroke-width="1.8" stroke-linecap="round" marker-end="url(#sk-pf)"/><rect style="fill:var(--sk-a,#FFE7DE)" x="12.0" y="168.2" width="416.0" height="95.5" rx="10"  filter="url(#sk-schatten)"/><svg x="188.4" y="177.2" width="63.1" height="56.0" viewBox="22 137 355 315" preserveAspectRatio="xMidYMid meet"><image href="figuren/FIG-ZEICHEN-REICH-GOTTES.webp" x="0" y="0" width="384" height="576" style="filter:var(--sk-bild-filter,url(#sk-bild))"/></svg><text style="fill:var(--sk-text,#1E2629)" class="lw lw-de" x="220.0" y="250.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="400"><tspan x="220.0" dy="0.0">kommt ihr gewiss nicht in das Reich der Himmel.</tspan></text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-gsw" x="220.0" y="250.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="400"><tspan x="220.0" dy="0.0">chömed ir sicher nöd is Riich vo de Himmel ine.</tspan></text></svg><g transform="translate(0 -24.0)"><circle style="stroke:var(--sk-text,#4A4D45)" cx="24" cy="423.0" r="12" fill="none"  stroke-width="1.4"/><text style="fill:var(--sk-text,#4A4D45)" x=