<svg x="356.7" y="21.0" width="39.5" height="56.0" viewBox="6 29 378 536" preserveAspectRatio="xMidYMid meet"><image href="figuren/FIG-OBJ-ESEL.webp" x="0" y="0" width="384" height="576" style="filter:var(--sk-bild-filter,url(#sk-bild))"/></svg><text style="fill:var(--sk-text,#1E2629)" class="lw lw-de" x="338.0" y="93.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="400"><tspan x="338.0" dy="0.0">Gesegnet sei das</tspan><tspan x="338.0" dy="17.5">kommende Reich</tspan><tspan x="338.0" dy="17.5">unseres Vaters</tspan><tspan x="338.0" dy="17.5">David!</tspan></text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-gsw" x="338.0" y="102.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="400"><tspan x="338.0" dy="0.0">Gsägnet seig s Riich</tspan><tspan x="338.0" dy="17.5">vo öisem Vatter</tspan><tspan x="338.0" dy="17.5">David, wo chunnt!</tspan></text><text style="fill:var(--sk-text-leise,#76828A)" x="419.0" y="164.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5"  text-anchor="end">11,7–10</text><rect style="fill:var(--sk-karte,#FFFFFF)" x="118.0" y="181.0" width="204.0" height="143.5" rx="10"  filter="url(#sk-schatten)"/><circle style="fill:var(--sk-text,#1E2629)" cx="134.0" cy="197.0" r="9"  fill-opacity=".86"/><text style="fill:var(--sk-marke-text,#FEFEFE)" x="134.0" y="201.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" >3</text><svg x="151.0" y="191.4" width="22.3" height="53.2" viewBox="65 19 234 557" preserveAspectRatio="xMidYMid meet"><image href="figuren/FIG-JESUS.webp" x="0" y="0" width="384" height="576" style="filter:var(--sk-bild-filter,url(#sk-bild))"/></svg><svg x="177.3" y="191.4" width="47.7" height="53.2" viewBox="0 72 384 428" preserveAspectRatio="xMidYMid meet"><image href="figuren/FIG-ORT-TEMPEL.webp" x="0" y="0" width="384" height="576" style="filter:var(--sk-bild-filter,url(#sk-bild))"/></svg><svg x="229.0" y="191.4" width="84.0" height="53.2" viewBox="18 188 349 221" preserveAspectRatio="xMidYMid meet"><image href="figuren/FIG-ZEICHEN-SEHEN.webp" x="0" y="0" width="384" height="576" style="filter:var(--sk-bild-filter,url(#sk-bild))"/></svg><text style="fill:var(--sk-text,#1E2629)" class="lw lw-de" x="232.0" y="262.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="400"><tspan x="232.0" dy="0.0">Und er zog in</tspan><tspan x="232.0" dy="17.5">Jerusalem ein, in</tspan><tspan x="232.0" dy="17.5">den Tempel</tspan></text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-gsw" x="232.0" y="262.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="400"><tspan x="232.0" dy="0.0">Und er isch uf</tspan><tspan x="232.0" dy="17.5">Jerusalem choo, in</tspan><tspan x="232.0" dy="17.5">Tempel</tspan></text><text style="fill:var(--sk-text-leise,#76828A)" x="313.0" y="315.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5"  text-anchor="end">11,11</text></svg><g transform="translate(0 58.89999999999998)"><circle style="stroke:var(--sk-text,#4A4D45)" cx="24" cy="423.0" r="12" fill="none"  stroke-width="1.4"/><text style="fill:var(--sk-text,#4A4D45)" x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14"  class="pn-n">1</text><text style="fill:var(--sk-text,#3B3D37)" class="lw lw-de" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" ></text><text style="fill:var(--sk-text,#3B3D37)" class="lw lw-gsw" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" ></text></g></g></svg></svg>
