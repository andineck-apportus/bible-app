,#1E2629)" cx="240.0" cy="28.0" r="9"  fill-opacity=".86"/><text style="fill:var(--sk-marke-text,#FEFEFE)" x="240.0" y="32.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" >2</text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-de" x="338.0" y="55.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="400"><tspan x="338.0" dy="0.0">der treue Verwalter,</tspan><tspan x="338.0" dy="17.5">der kluge</tspan></text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-gsw" x="338.0" y="55.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="400"><tspan x="338.0" dy="0.0">de tröi Verwalter,</tspan><tspan x="338.0" dy="17.5">de gschiid</tspan></text><text style="fill:var(--sk-text-leise,#76828A)" x="419.0" y="111.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5"  text-anchor="end">12,41–46</text><rect style="fill:var(--sk-karte,#FFFFFF)" x="118.0" y="128.5" width="204.0" height="101.0" rx="10"  filter="url(#sk-schatten)"/><circle style="fill:var(--sk-text,#1E2629)" cx="134.0" cy="144.5" r="9"  fill-opacity=".86"/><text style="fill:var(--sk-marke-text,#FEFEFE)" x="134.0" y="148.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" >3</text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-de" x="232.0" y="150.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="400"><tspan x="232.0" dy="0.0">Jedem aber, dem viel</tspan><tspan x="232.0" dy="17.5">gegeben wurde, von</tspan><tspan x="232.0" dy="17.5">dem wird viel</tspan><tspan x="232.0" dy="17.5">gefordert werden</tspan></text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-gsw" x="232.0" y="150.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="400"><tspan x="232.0" dy="0.0">Jedem