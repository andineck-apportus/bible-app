ans-serif" font-size="10.5"  text-anchor="end">7,37–39</text><rect style="fill:var(--sk-karte,#FFFFFF)" x="224.0" y="12.0" width="204.0" height="143.5" rx="10"  filter="url(#sk-schatten)"/><circle style="fill:var(--sk-text,#1E2629)" cx="240.0" cy="28.0" r="9"  fill-opacity=".86"/><text style="fill:var(--sk-marke-text,#FEFEFE)" x="240.0" y="32.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" >2</text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-de" x="338.0" y="55.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="400"><tspan x="338.0" dy="0.0">Ihre Sünden, die</tspan><tspan x="338.0" dy="17.5">vielen, sind</tspan><tspan x="338.0" dy="17.5">vergeben, denn sie</tspan><tspan x="338.0" dy="17.5">hat viel geliebt</tspan></text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-gsw" x="338.0" y="63.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="400"><tspan x="338.0" dy="0.0">Iri Sünde, di vile,</tspan><tspan x="338.0" dy="17.5">sind vergää, dänn si</tspan><tspan x="338.0" dy="17.5">hät vil gliebt</tspan></text><text style="fill:var(--sk-text-leise,#76828A)" x="419.0" y="146.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5"  text-anchor="end">7,40–47</text><rect style="fill:var(--sk-karte,#FFFFFF)" x="118.0" y="163.5" width="204.0" height="126.0" rx="10"  filter="url(#sk-schatten)"/><circle style="fill:var(--sk-text,#1E2629)" cx="134.0" cy="179.5" r="9"  fill-opacity=".86"/><text style="fill:var(--sk-marke-text,#FEFEFE)" x="134.0" y="183.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" >3</text><svg x="181.4" y="172.5" width="47.0" height="56.0" viewBox="0 76 384 458" preserveAspectRatio="xMidYMid meet"><image href="figuren/FIG-GRUPPE-GAESTE.webp" x="0" y="0" width="384" height="576" style="filter:var(--sk-bild-filter,u