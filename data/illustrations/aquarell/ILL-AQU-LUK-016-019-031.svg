l:var(--sk-flaeche,#F3F8FA)" width="440" height="294.0" /><rect style="fill:var(--sk-karte,#FFFFFF)" x="12.0" y="12.0" width="204.0" height="161.0" rx="10"  filter="url(#sk-schatten)"/><circle style="fill:var(--sk-text,#1E2629)" cx="28.0" cy="28.0" r="9"  fill-opacity=".86"/><text style="fill:var(--sk-marke-text,#FEFEFE)" x="28.0" y="32.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" >1</text><svg x="67.9" y="21.0" width="26.5" height="56.0" viewBox="66 14 262 553" preserveAspectRatio="xMidYMid meet"><image href="figuren/FIG-ROLLE-REICHER.webp" x="0" y="0" width="384" height="576" style="filter:var(--sk-bild-filter,url(#sk-bild))"/></svg><svg x="98.4" y="21.0" width="21.0" height="56.0" viewBox="79 8 213 568" preserveAspectRatio="xMidYMid meet"><image href="figuren/FIG-ROLLE-ARMER.webp" x="0" y="0" width="384" height="576" style="filter:var(--sk-bild-filter,url(#sk-bild))"/></svg><svg x="123.4" y="21.0" width="60.7" height="56.0" viewBox="0 121 384 354" preserveAspectRatio="xMidYMid meet"><image href="figuren/FIG-ORT-HAUS.webp" x="0" y="0" width="384" height="576" style="filter:var(--sk-bild-filter,url(#sk-bild))"/></svg><text style="fill:var(--sk-text,#1E2629)" class="lw lw-de" x="126.0" y="93.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="400"><tspan x="126.0" dy="0.0">Ein Armer aber</tspan><tspan x="126.0" dy="17.5">namens Lazarus lag</tspan><tspan x="126.0" dy="17.5">vor seinem Tor,</tspan><tspan x="126.0" dy="17.5">voller Geschwüre</tspan></text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-gsw" x="126.0" y="93.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="400"><tspan x="126.0" dy="0.0">En Arme aber mit em</tspan><tspan x="126.0" dy="17.5">Name Lazarus isch</tspan><tspan x="126.0" dy="17.5">vor sim Tor gläge,</tspan><tspan x="126.0" dy="17.5">voller Gschwüür</tspan></text><text style="fill:var(--sk-text-leise,#76828A)" x="207.0" y="164.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5"  text-anchor="end">16,19–21</text><rect style="fill:var(--sk-karte,#FFFFFF)" x="224.0" y="12.0" width="204.0" height="161.0" rx="10"  filter="url(#sk-schatten)"/><circle style="fill:var(--sk-text,#1E2629)" cx="240.0" cy="28.0" r="9"  fill-opacity=".86"/><text style="fill:var(--sk-marke-text,#FEFEFE)" x="240.0" y="32.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" >2</text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-de" x="338.0" y="72.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="400"><tspan x="338.0" dy="0.0">von den Engeln in</tspan><tspan x="338.0" dy="17.5">Abrahams Schoss</tspan><tspan x="338.0" dy="17.5">getragen</tspan></text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-gsw" x="338.0" y="72.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="400"><tspan x="338.0" dy="0.0">vo de Ängel i de</tspan><tspan x="338.0" dy="17.5">Schoss vom Abraham</tspan><tspan x="338.0" dy="17.5">treit</tspan></text><text style="fill:var(--sk-text-leise,#76828A)" x="419.0" y="164.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5"  text-anchor="end">16,22–26</text><rect style="fill:var(--sk-karte,#FFFFFF)" x="118.0" y="181.0" width="204.0" height="101.0" rx="10"  filter="url(#sk-schatten)"/><circle style="fill:var(--sk-text,#1E2629)" cx="134.0" cy="197.0" r="9"  fill-opacity=".86"/><text style="fill:var(--sk-marke-text,#FEFEFE)" x="134.0" y="201.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" >3</text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-de" x="232.0" y="202.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="400"><tspan x="232.0" dy="0.0">Sie haben Mose und</tspan><tspan x="232.0" dy="17.5">die Propheten; auf</tspan><tspan x="232.0" dy="17.5">die sollen sie</tspan><tspan x="232.0" dy="17.5">hören!</tspan></text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-gsw" x="232.0" y="211.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="400"><tspan x="232.0" dy="0.0">Si händ de Mose und</tspan><tspan x="232.0" dy="17.5">d Prophete; uf die</tspan><tspan x="232.0" dy="17.5">söled si lose!</tspan></text><text style="fill:var(--sk-text-leise,#76828A)" x="313.0" y="273.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5"  text-anchor="end">16,27–31</text></svg><g transform="translate(0 0.8999999999999773)"><circle style="stroke:var(--sk-text,#4A4D45)" cx="24" cy="423.0" r="12" fill="none"  stroke-width="1.4"/><text style="fill:var(--sk-text,#4A4D45)" x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14"  class="pn-n">1</text><text style="fill:var(--sk-text,#3B3D37)" class="lw lw-de" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" ></text><text style="fill:var(--sk-text,#3B3D37)" class="lw lw-gsw" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" ></text></g></g></svg></svg>
