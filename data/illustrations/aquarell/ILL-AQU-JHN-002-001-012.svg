<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1212 904"><svg class="ill-tile" data-span="1" data-scene="JHN-002-K1" x="0" y="0" width="600" height="446" viewBox="0 0 600 446"><image href="img/JHN-002-K1.webp" x="0" y="0" width="600" height="400" preserveAspectRatio="xMidYMid slice"/><g class="ill-bubble" data-speech="0"><polygon points="204,89 226,89 215,112" fill="#FBF8F1" stroke="#4A4D45" stroke-width="1.6" stroke-linejoin="round"/><rect x="30" y="16" width="240" height="74" rx="18" fill="#FBF8F1" fill-opacity=".96" stroke="#4A4D45" stroke-width="1.6"/><polygon points="204,89 226,89 215,112" fill="#FBF8F1" stroke="none" transform="translate(0 -2)"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2F312C"><tspan x="150.0" y="47.2">Sie haben keinen</tspan><tspan x="150.0" y="72.2">Wein mehr.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2F312C"><tspan x="150.0" y="47.2">Si händ kei</tspan><tspan x="150.0" y="72.2">Wii meh.</tspan></text></g><g class="ill-bubble" data-speech="1"><polygon points="389,83 411,83 400,98" fill="#FBF8F1" stroke="#4A4D45" stroke-width="1.6" stroke-linejoin="round"/><rect x="300" y="10" width="280" height="74" rx="18" fill="#FBF8F1" fill-opacity=".96" stroke="#4A4D45" stroke-width="1.6"/><polygon points="389,83 411,83 400,98" fill="#FBF8F1" stroke="none" transform="translate(0 -2)"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2F312C"><tspan x="440.0" y="41.2">… Meine Stunde ist</tspan><tspan x="440.0" y="66.2">noch nicht gekommen.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2F312C"><tspan x="440.0" y="41.2">… Mini Stund isch</tspan><tspan x="440.0" y="66.2">no nöd choo.</tspan></text></g><rect x="0" y="400" width="600" height="46" fill="#FBF8F1"/><circle cx="24" cy="423.0" r="12" fill="none" stroke="#4A4D45" stroke-width="1.4"/><text x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4A4D45" class="pn-n">1</text><text class="lw lw-de" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">Und als der Wein ausging</text><text class="lw lw-gsw" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">Und wo de Wii usgange isch</text><rect x=".5" y=".5" width="599" height="445" fill="none" stroke="#D8D0C0" stroke-width="1"/></svg><svg class="ill-tile" data-span="1" data-scene="JHN-002-K2" x="612" y="0" width="600" height="446" viewBox="0 0 600 446"><image href="img/JHN-002-K2.webp" x="0" y="0" width="600" height="400" preserveAspectRatio="xMidYMid slice"/><g class="ill-bubble" data-speech="0"><polygon points="37,87 59,87 48,124" fill="#FBF8F1" stroke="#4A4D45" stroke-width="1.6" stroke-linejoin="round"/><rect x="14" y="14" width="270" height="74" rx="18" fill="#FBF8F1" fill-opacity=".96" stroke="#4A4D45" stroke-width="1.6"/><polygon points="37,87 59,87 48,124" fill="#FBF8F1" stroke="none" transform="translate(0 -2)"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2F312C"><tspan x="149.0" y="45.2">Was er euch auch</tspan><tspan x="149.0" y="70.2">sagt, das tut!</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2F312C"><tspan x="149.0" y="45.2">Was er eu au</tspan><tspan x="149.0" y="70.2">seit, das mached!</tspan></text></g><g class="ill-bubble" data-speech="1"><polygon points="534,87 556,87 545,112" fill="#FBF8F1" stroke="#4A4D45" stroke-width="1.6" stroke-linejoin="round"/><rect x="330" y="14" width="260" height="74" rx="18" fill="#FBF8F1" fill-opacity=".96" stroke="#4A4D45" stroke-width="1.6"/><polygon points="534,87 556,87 545,112" fill="#FBF8F1" stroke="none" transform="translate(0 -2)"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2F312C"><tspan x="460.0" y="45.2">Füllt die Krüge</tspan><tspan x="460.0" y="70.2">mit Wasser!</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2F312C"><tspan x="460.0" y="45.2">Füllet d Chrüeg</tspan><tspan x="460.0" y="70.2">mit Wasser!</tspan></text></g><rect x="0" y="400" width="600" height="46" fill="#FBF8F1"/><circle cx="24" cy="423.0" r="12" fill="none" stroke="#4A4D45" stroke-width="1.4"/><text x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4A4D45" class="pn-n">2</text><text class="lw lw-de" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">Und sie füllten sie bis oben</text><text class="lw lw-gsw" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">Und si händ si bis obe gfüllt</text><rect x=".5" y=".5" width="599" height="445" fill="none" stroke="#D8D0C0" stroke-width="1"/></svg><svg class="ill-tile" data-span="1" data-scene="JHN-002-K3" x="306" y="458" width="600" height="446" viewBox="0 0 600 446"><image href="img/JHN-002-K3.webp" x="0" y="0" width="600" height="400" preserveAspectRatio="xMidYMid slice"/><g class="ill-bubble" data-speech="0"><polygon points="245,75 267,75 232,90" fill="#FBF8F1" stroke="#4A4D45" stroke-width="1.6" stroke-linejoin="round"/><rect x="230" y="2" width="310" height="74" rx="18" fill="#FBF8F1" fill-opacity=".96" stroke="#4A4D45" stroke-width="1.6"/><polygon points="245,75 267,75 232,90" fill="#FBF8F1" stroke="none" transform="translate(0 -2)"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2F312C"><tspan x="385.0" y="33.2">… du hast den guten Wein</tspan><tspan x="385.0" y="58.2">bis jetzt aufbewahrt.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2F312C"><tspan x="385.0" y="33.2">… du häsch de guet Wii</tspan><tspan x="385.0" y="58.2">bis jetzt ufbhalte.</tspan></text></g><rect x="0" y="400" width="600" height="46" fill="#FBF8F1"/><circle cx="24" cy="423.0" r="12" fill="none" stroke="#4A4D45" stroke-width="1.4"/><text x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4A4D45" class="pn-n">3</text><text class="lw lw-de" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">Diesen Anfang der Zeichen machte Jesus</text><text class="lw lw-gsw" x="320.0" y="429.5" text-anchor="middle" font-family="sans-serif" font-size="18" font-style="italic" fill="#3B3D37">Das hät de Jesus als Aafang vo de Zeiche gmacht</text><rect x=".5" y=".5" width="599" height="445" fill="none" stroke="#D8D0C0" stroke-width="1"/></svg></svg>
