l:var(--sk-flaeche,#F3F8FA)" width="440" height="241.5" /><rect style="fill:var(--sk-karte,#FFFFFF)" x="12.0" y="12.0" width="204.0" height="126.0" rx="10"  filter="url(#sk-schatten)"/><circle style="fill:var(--sk-text,#1E2629)" cx="28.0" cy="28.0" r="9"  fill-opacity=".86"/><text style="fill:var(--sk-marke-text,#FEFEFE)" x="28.0" y="32.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" >1</text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-de" x="126.0" y="55.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="400"><tspan x="126.0" dy="0.0">Ich habe gelernt,</tspan><tspan x="126.0" dy="17.5">mir selbst zu</tspan><tspan x="126.0" dy="17.5">genügen</tspan></text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-gsw" x="126.0" y="63.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="400"><tspan x="126.0" dy="0.0">Ich han glernt, mir</tspan><tspan x="126.0" dy="17.5">sälber z gnüege</tspan></text><text style="fill:var(--sk-text-leise,#76828A)" x="207.0" y="129.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5"  text-anchor="end">4,10–13</text><rect style="fill:var(--sk-karte,#FFFFFF)" x="224.0" y="12.0" width="204.0" height="126.0" rx="10"  filter="url(#sk-schatten)"/><circle style="fill:var(--sk-text,#1E2629)" cx="240.0" cy="28.0" r="9"  fill-opacity=".86"/><text style="fill:var(--sk-marke-text,#FEFEFE)" x="240.0" y="32.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" >2</text><svg x="298.9" y="21.0" width="24.0" height="56.0" viewBox="72 5 244 570" preserveAspectRatio="xMidYMid meet"><image href="figuren/FIG-PAULUS.webp" x="0" y="0" width="384" height="576" style="filter:var(--sk-bild-filter,url(#sk-bild))"/></svg><svg x="326.9" y="21.0" width="50.2" height="56.0" viewBox="6 81 378 422" preserveAspectRatio="xMidYMid meet"><image href="figuren/FIG-ZEICHEN-BRINGEN.webp" x="0" y="0" width="384" height="576" style="filter:var(--sk-bild-filter,url(#sk-bild))"/></svg><text style="fill:var(--sk-text,#1E2629)" class="lw lw-de" x="338.0" y="93.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="400"><tspan x="338.0" dy="0.0">Ein Opfer, angenehm,</tspan><tspan x="338.0" dy="17.5">Gott wohlgefällig</tspan></text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-gsw" x="338.0" y="93.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="400"><tspan x="338.0" dy="0.0">Es Opfer, aagnää, wo</tspan><tspan x="338.0" dy="17.5">Gott gfallt</tspan></text><text style="fill:var(--sk-text-leise,#76828A)" x="419.0" y="129.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5"  text-anchor="end">4,14–18</text><rect style="fill:var(--sk-karte,#FFFFFF)" x="118.0" y="146.0" width="204.0" height="83.5" rx="10"  filter="url(#sk-schatten)"/><circle style="fill:var(--sk-text,#1E2629)" cx="134.0" cy="162.0" r="9"  fill-opacity=".86"/><text style="fill:var(--sk-marke-text,#FEFEFE)" x="134.0" y="166.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" >3</text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-de" x="232.0" y="167.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="400"><tspan x="232.0" dy="0.0">Mein Gott aber wird</tspan><tspan x="232.0" dy="17.5">all euren Bedarf</tspan><tspan x="232.0" dy="17.5">erfüllen</tspan></text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-gsw" x="232.0" y="167.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="400"><tspan x="232.0" dy="0.0">Min Gott aber wird</tspan><tspan x="232.0" dy="17.5">jede Bedarf vo öi</tspan><tspan x="232.0" dy="17.5">decke</tspan></text><text style="fill:var(--sk-text-leise,#76828A)" x="313.0" y="220.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5"  text-anchor="end">4,18–20</text></svg><g transform="translate(0 -70.69999999999999)"><circle style="stroke:var(--sk-text,#4A4D45)" cx="24" cy="423.0" r="12" fill="none"  stroke-width="1.4"/><text style="fill:var(--sk-text,#4A4D45)" x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14"  class="pn-n">1</text><text style="fill:var(--sk-text,#3B3D37)" class="lw lw-de" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" ></text><text style="fill:var(--sk-text,#3B3D37)" class="lw lw-gsw" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" ></text></g></g></svg></svg>
