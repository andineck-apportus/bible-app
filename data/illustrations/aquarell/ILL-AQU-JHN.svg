vetica, Arial, sans-serif" font-size="10.5"  text-anchor="end">1,14</text></svg><g transform="translate(0 254.20000000000005)"><circle style="stroke:var(--sk-text,#4A4D45)" cx="24" cy="423.0" r="12" fill="none"  stroke-width="1.4"/><text style="fill:var(--sk-text,#4A4D45)" x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14"  class="pn-n">1</text><text style="fill:var(--sk-text,#3B3D37)" class="lw lw-de" x="320.0" y="429.5" text-anchor="middle" font-family="sans-serif" font-size="18" font-style="italic" >Und das Wort wurde Fleisch und wohnte unter uns</text><text style="fill:var(--sk-text,#3B3D37)" class="lw lw-gsw" x="320.0" y="428.8" text-anchor="middle" font-family="sans-serif" font-size="16" font-style="italic" >Und s Wort isch Fleisch worde und hät under öis gwohnt</text></g></g></svg><svg class="ill-tile" data-span="1" data-scene="JHN-B2" x="612" y="0" width="600" height="446" viewBox="0 0 600 446"><defs><clipPath id="kc-JHN-B2"><rect width="600" height="446" rx="22"/></clipPath></defs><g clip-path="url(#kc-JHN-B2)"><rect width="600" height="446" fill="#FBF8F1"/><image href="img/JHN-B2.webp" x="0" y="0" width="600" height="400" preserveAspectRatio="xMidYMid slice"/><rect x="0" y="400" width="600" height="46" fill="#FBF8F1"/><circle cx="24" cy="423.0" r="12" fill="none" stroke="#4A4D45" stroke-width="1.4"/><text x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4A4D45" class="pn-n">2</text><text class="lw lw-de" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">Ich bin die Auferstehung und das Leben</text><text class="lw lw-gsw" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">Ich bi d Uferstehig und s Läbe</text></g></svg><svg class="ill-tile" data-span="1" data-scene="JHN-B3" x="0" y="712.2" width="600" height="446" viewBox="0 0 600 446"><defs><clipPath id="kc-JHN-B3"><rect width="600" height="446" rx="22"/></clipPath></defs><g clip-path="url(#kc-JHN-B3)"><rect width="600" height="446" fill="#FBF8F1"/><image href="img/JHN-B3.webp" x="0" y="0" width="600" height="400" preserveAspectRatio="xMidYMid slice"/><rect x="0" y="400" width="600" height="46" fill="#FBF8F1"/><circle cx="24" cy="423.0" r="12" fill="none" stroke="#4A4D45" stroke-width="1.4"/><text x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4A4D45" class="pn-n">3</text><text class="lw lw-de" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">Es ist vollbracht</text><text class="lw lw-gsw" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">Es isch vollbracht</text></g></svg><svg class="ill-tile" data-span="1" data-scene="JHN-B4" x="612" y="712.2" width="600" height="446" viewBox="0 0 600 446"><defs><clipPath id="kc-JHN-B4"><rect width="600" height="446" rx="22"/></clipPath></defs><g clip-path="url(#kc-JHN-B4)"><rect width="600" height="446" fill="#FBF8F1"/><image href="img/JHN-B4.webp" x="0" y="0" width="600" height="400" preserveAspectRatio="xMidYMid slice"/><rect x="0" y="400" width="600" height="46" fill="#FBF8F1"/><circle cx="24" cy="423.0" r="12" fill="none" stroke="#4A4D45" stroke-width="1.4"/><text x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4A4D45" class="pn-n">4</text><text class="lw lw-de" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">damit ihr glaubt, dass Jesus der Christus ist</text><text class="lw lw-gsw" x="320.0" y="429.5" text-anchor="middle" font-family="sans-serif" font-size="18" font-style="italic" fill="#3B3D37">damit ir glaubed, dass de Jesus de Christus isch</text></g></svg></svg>
