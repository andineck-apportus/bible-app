 x="116.66666666666667" dy="21.1">Wort</tspan></text><text class="lw lw-gsw" x="116.66666666666667" y="152.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#3E413B" font-weight="400"><tspan x="116.66666666666667" dy="-10.5">im Aafang isch s</tspan><tspan x="116.66666666666667" dy="21.1">Wort gsii</tspan></text><text x="116.66666666666667" y="202.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#7A7C73" text-anchor="middle">1,1</text><rect x="213.33333333333334" y="92" width="173.33333333333334" height="117.0" rx="7" fill="#EFE3D4" stroke="#BD8067" stroke-width="1" stroke-opacity=".55"/><text class="lw lw-de" x="300.0" y="152.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#3E413B" font-weight="400"><tspan x="300.0" dy="-10.5">das Wort war bei</tspan><tspan x="300.0" dy="21.1">Gott und war Gott</tspan></text><text class="lw lw-gsw" x="300.0" y="152.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#3E413B" font-weight="400"><tspan x="300.0" dy="-10.5">s Wort isch bi Gott</tspan><tspan x="300.0" dy="21.1">und isch Gott gsii</tspan></text><text x="300.0" y="202.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#7A7C73" text-anchor="middle">1,1</text><rect x="396.6666666666667" y="92" width="173.33333333333334" height="117.0" rx="7" fill="#EFE3D4" stroke="#BD8067" stroke-width="1" stroke-opacity=".55"/><text class="lw lw-de" x="483.33333333333337" y="152.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#3E413B" font-weight="400"><tspan x="483.33333333333337" dy="-10.5">der Sohn beim Vater</tspan><tspan x="483.33333333333337" dy="21.1">macht ihn kund</tspan></text><text class="lw lw-gsw" x="483.33333333333337" y="152.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#3E413B" font-weight="400"><tspan x="483.33333333333337" dy="-10.5">de Sohn bim Vater</tspan><tspan x="483.33333333333337" dy="21.1">macht en bekannt</tspan></text><text x="483.33333333333337" y="202.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#7A7C73" text-anchor="middle">1,18</text><rect x="16" y="235.0" width="568" height="153.0" rx="9" fill="#E3EAEC" fill-opacity=".55" stroke="#6F8F9B" stroke-opacity=".4"/><text class="lw lw-de" x="30" y="260.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" fill="#6F8F9B" font-weight="600"><tspan x="30" dy="0.0">in der Welt, unter uns</tspan></text><text class="lw lw-gsw" x="30" y="260.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" fill="#6F8F9B" font-weight="600"><tspan x="30" dy="0.0">i de Wält, bi üs</tspan></text><rect x="30.0" y="273.0" width="173.33333333333334" height="105.0" rx="7" fill="#E3EAEC" stroke="#6F8F9B" stroke-width="1" stroke-opacity=".55"/><text class="lw lw-de" x="116.66666666666667" y="327.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#3E413B" font-weight="400"><tspan x="116.66666666666667" dy="-10.5">die Seinen nahmen</tspan><tspan x="116.66666666666667" dy="21.1">ihn nicht auf</tspan></text><text class="lw lw-gsw" x="116.66666666666667" y="327.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#3E413B" font-weight="400"><tspan x="116.66666666666667" dy="-10.5">di Sine händ en nöd</tspan><tspan x="116.66666666666667" dy="21.1">ufgnoo</tspan></text><text x="116.66666666666667" y="371.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#7A7C73" text-anchor="middle">1,11</text><rect x="213.33333333333334" y="273.0" width="173.33333333333334" height="105.0" rx="7" fill="#E3EAEC" stroke="#6F8F9B" stroke-width="1" stroke-opacity=".55"/><text class="lw lw-de" x="300.0" y="327.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#3E413B" font-weight="400"><tspan x="300.0" dy="-10.5">wer ihn aufnimmt:</tspan><tspan x="300.0" dy="21.1">Kind Gottes</tspan></text><text class="lw lw-gsw" x="300.0" y="327.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#3E413B" font-weight="400"><tspan x="300.0" dy="-10.5">wer en ufnimmt:</tspan><tspan x="300.0" dy="21.1">Chind vo Gott</tspan></text><text x="300.0" y="371.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#7A7C73" text-anchor="middle">1,12</text><rect x="396.6666666666667" y="273.0" width="173.33333333333334" height="105.0" rx="7" fill="#EDD3B4" stroke="#6F8F9B" stroke-width="1" stroke-opacity=".55"/><text class="lw lw-de" x="483.33333333333337" y="327.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#3E413B" font-weight="400"><tspan x="483.33333333333337" dy="-21.1">das Wort wurde</tspan><tspan x="483.33333333333337" dy="21.1">Fleisch, wohnte bei</tspan><tspan x="483.33333333333337" dy="21.1">uns</tspan></text><text class="lw lw-gsw" x="483.33333333333337" y="327.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#3E413B" font-weight="400"><tspan x="483.33333333333337" dy="-10.5">s Wort isch Fleisch</tspan><tspan x="483.33333333333337" dy="21.1">worde, wohnt bi üs</tspan></text><text x="483.33333333333337" y="371.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#7A7C73" text-anchor="middle">1,14</text><rect x="0" y="400" width="600" height="46" fill="#FBF8F1"/><circle cx="24" cy="423.0" r="12" fill="none" stroke="#4A4D45" stroke-width="1.4"/><text x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4A4D45" class="pn-n">1</text><text class="lw lw-de" x="320.0" y="429.5" text-anchor="middle" font-family="sans-serif" font-size="18" font-style="italic" fill="#3B3D37">Und das Wort wurde Fleisch und wohnte unter uns</text><text class="lw lw-gsw" x="320.0" y="428.8" text-anchor="middle" font-family="sans-serif" font-size="16" font-style="italic" fill="#3B3D37">Und s Wort isch Fleisch worde und hät under üs gwohnt</text><rect x="1" y="1" width="598" height="444" fill="none" stroke="#D8D0C0" stroke-width="1.2" vector-effect="non-scaling-stroke"/></svg><svg class="ill-tile" data-span="1" data-scene="JHN-B2" x="612" y="0" width="600" height="446" viewBox="0 0 600 446"><image href="img/JHN-B2.webp" x="0" y="0" width="600" height="400" preserveAspectRatio="xMidYMid slice"/><rect x="0" y="400" width="600" height="46" fill="#FBF8F1"/><circle cx="24" cy="423.0" r="12" fill="none" stroke="#4A4D45" stroke-width="1.4"/><text x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4A4D45" class="pn-n">2</text><text class="lw lw-de" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">Ich bin die Auferstehung und das Leben</text><text class="lw lw-gsw" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">Ich bi d Uferstehig und s Läbe</text><rect x="1" y="1" width="598" height="444" fill="none" stroke="#D8D0C0" stroke-width="1.2" vector-effect="non-scaling-stroke"/></svg><svg class="ill-tile" data-span="1" data-scene="JHN-B3" x="0" y="458" width="600" height="446" viewBox="0 0 600 446"><image href="img/JHN-B3.webp" x="0" y="0" width="600" height="400" preserveAspectRatio="xMidYMid slice"/><rect x="0" y="400" width="600" height="46" fill="#FBF8F1"/><circle cx="24" cy="423.0" r="12" fill="none" stroke="#4A4D45" stroke-width="1.4"/><text x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4A4D45" class="pn-n">3</text><text class="lw lw-de" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">Es ist vollbracht</text><text class="lw lw-gsw" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">Es isch vollbracht</text><rect x="1" y="1" width="598" height="444" fill="none" stroke="#D8D0C0" stroke-width="1.2" vector-effect="non-scaling-stroke"/></svg><svg class="ill-tile" data-span="1" data-scene="JHN-B4" x="612" y="458" width="600" height="446" viewBox="0 0 600 446"><image href="img/JHN-B4.webp" x="0" y="0" width="600" height="400" preserveAspectRatio="xMidYMid slice"/><rect x="0" y="400" width="600" height="46" fill="#FBF8F1"/><circle cx="24" cy="423.0" r="12" fill="none" stroke="#4A4D45" stroke-width="1.4"/><text x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4A4D45" class="pn-n">4</text><text class="lw lw-de" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">damit ihr glaubt, dass Jesus der Christus ist</text><text class="lw lw-gsw" x="320.0" y="429.5" text-anchor="middle" font-family="sans-serif" font-size="18" font-style="italic" fill="#3B3D37">demit ir glaubed, dass de Jesus de Christus isch</text><rect x="1" y="1" width="598" height="444" fill="none" stroke="#D8D0C0" stroke-width="1.2" vector-effect="non-scaling-stroke"/></svg></svg>
