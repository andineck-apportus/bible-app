" font-weight="600" text-anchor="middle" >2</text><svg x="283.8" y="21.0" width="47.3" height="56.0" viewBox="25 92 342 405" preserveAspectRatio="xMidYMid meet"><image href="figuren/FIG-ZEICHEN-SUENDE.webp" x="0" y="0" width="384" height="576" style="filter:var(--sk-bild-filter,url(#sk-bild))"/></svg><svg x="335.1" y="21.0" width="57.1" height="56.0" viewBox="38 134 325 319" preserveAspectRatio="xMidYMid meet"><image href="figuren/FIG-ZEICHEN-LEBEN.webp" x="0" y="0" width="384" height="576" style="filter:var(--sk-bild-filter,url(#sk-bild))"/></svg><text style="fill:var(--sk-text,#1E2629)" class="lw lw-de" x="338.0" y="93.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="400"><tspan x="338.0" dy="0.0">Es gibt Sünde,</tspan><tspan x="338.0" dy="17.5">die nicht zum Tod</tspan><tspan x="338.0" dy="17.5">führt</tspan></text><text style="fill:var(--sk-text,#1E2629)" class="lw lw-gsw" x="338.0" y="102.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle"  font-weight="400"><tspan x="338.0" dy="0.0">Es git Sünd, wo nöd</tspan><tspan x="338.0" dy="17.5">zum Tod füert</tspan></text><text style="fill:var(--sk-text-leise,#76828A)" x="419.0" y="146.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5"  text-anchor="end">5,16–17</text><rect style="fill:var(--sk-karte,#FFFFFF)" x="118.0" y="163.5" width="204.0" height="143.5" rx="10"  filter="url(#sk-schatten)"/><circle style="fill:var(--sk-text,#1E2629)" cx="134.0" cy="179.5" r="9"  fill-opacity=".86"/><text style="fill:var(--sk-marke-text,#FEFEFE)" x="134.0" y="183.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" >3</text><svg x="151.0" y="172.6" width="41.0" height="55.8" viewBox="22 70 333 453" preserveAspectRatio="xMidYMid meet"><image href="figuren/FIG-ZEICHEN-KINDER-GOTTES.webp" x="0" y="0" width="384" height="576" style="filter:var(--sk-bild-filter,url(#sk-bild))"