<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1212 904"><svg class="ill-tile" data-span="1" data-scene="LUK-015-L1" x="0" y="0" width="600" height="446" viewBox="0 0 600 446"><image href="img/LUK-015-L1.webp" x="0" y="0" width="600" height="400" preserveAspectRatio="xMidYMid slice"/><g class="ill-bubble ill-thought" data-speech="0"><circle cx="194" cy="103" r="7" fill="#FBF8F1" stroke="#4A4D45" stroke-width="1.2"/><circle cx="194" cy="119" r="5" fill="#FBF8F1" stroke="#4A4D45" stroke-width="1.2"/><circle cx="194" cy="132" r="3.5" fill="#FBF8F1" stroke="#4A4D45" stroke-width="1.2"/><rect x="38" y="16" width="310" height="74" rx="34" fill="#FBF8F1" fill-opacity=".94" stroke="#4A4D45" stroke-width="1.2" stroke-dasharray="1 0"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2F312C"><tspan x="193.0" y="47.2">Ich werde mich aufmachen,</tspan><tspan x="193.0" y="72.2">zu meinem Vater gehen …</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2F312C"><tspan x="193.0" y="47.2">Ich mach mich uf und</tspan><tspan x="193.0" y="72.2">gaa zu mim Vatter …</tspan></text></g><rect x="0" y="400" width="600" height="46" fill="#FBF8F1"/><circle cx="24" cy="423.0" r="12" fill="none" stroke="#4A4D45" stroke-width="1.4"/><text x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4A4D45" class="pn-n">1</text><text class="lw lw-de" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">Da ging er in sich</text><text class="lw lw-gsw" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">Da isch er zue sich choo</text><rect x=".5" y=".5" width="599" height="445" fill="none" stroke="#D8D0C0" stroke-width="1"/></svg><svg class="ill-tile" data-span="1" data-scene="LUK-015-L2" x="612" y="0" width="600" height="446" viewBox="0 0 600 446"><image href="img/LUK-015-L2.webp" x="0" y="0" width="600" height="400" preserveAspectRatio="xMidYMid slice"/><g class="ill-bubble" data-speech="0"><polygon points="306,102 328,102 317,142" fill="#FBF8F1" stroke="#4A4D45" stroke-width="1.2" stroke-linejoin="round"/><rect x="182" y="4" width="270" height="99" rx="18" fill="#FBF8F1" fill-opacity=".94" stroke="#4A4D45" stroke-width="1.2"/><polygon points="306,102 328,102 317,142" fill="#FBF8F1" stroke="none" transform="translate(0 -2)"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2F312C"><tspan x="317.0" y="35.2">Vater, ich habe</tspan><tspan x="317.0" y="60.2">gesündigt gegen den</tspan><tspan x="317.0" y="85.2">Himmel und vor dir …</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2F312C"><tspan x="317.0" y="35.2">Vatter, ich han</tspan><tspan x="317.0" y="60.2">gsündiget gäge de</tspan><tspan x="317.0" y="85.2">Himmel und vor dir …</tspan></text></g><rect x="0" y="400" width="600" height="46" fill="#FBF8F1"/><circle cx="24" cy="423.0" r="12" fill="none" stroke="#4A4D45" stroke-width="1.4"/><text x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4A4D45" class="pn-n">2</text><text class="lw lw-de" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">war tot und ist wieder lebendig geworden</text><text class="lw lw-gsw" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">isch tot gsii und isch wider läbig worde</text><rect x=".5" y=".5" width="599" height="445" fill="none" stroke="#D8D0C0" stroke-width="1"/></svg><svg class="ill-tile" data-span="1" data-scene="LUK-015-L3" x="306" y="458" width="600" height="446" viewBox="0 0 600 446"><image href="img/LUK-015-L3.webp" x="0" y="0" width="600" height="400" preserveAspectRatio="xMidYMid slice"/><g class="ill-bubble" data-speech="0"><polygon points="123,77 145,77 134,107" fill="#FBF8F1" stroke="#4A4D45" stroke-width="1.2" stroke-linejoin="round"/><rect x="6" y="4" width="270" height="74" rx="18" fill="#FBF8F1" fill-opacity=".94" stroke="#4A4D45" stroke-width="1.2"/><polygon points="123,77 145,77 134,107" fill="#FBF8F1" stroke="none" transform="translate(0 -2)"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2F312C"><tspan x="141.0" y="35.2">… mir hast du nie ein</tspan><tspan x="141.0" y="60.2">Zicklein gegeben …</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2F312C"><tspan x="141.0" y="35.2">… mir häsch nie</tspan><tspan x="141.0" y="60.2">es Gitzi ggää …</tspan></text></g><g class="ill-bubble" data-speech="1"><polygon points="329,102 351,102 340,138" fill="#FBF8F1" stroke="#4A4D45" stroke-width="1.2" stroke-linejoin="round"/><rect x="286" y="4" width="290" height="99" rx="18" fill="#FBF8F1" fill-opacity=".94" stroke="#4A4D45" stroke-width="1.2"/><polygon points="329,102 351,102 340,138" fill="#FBF8F1" stroke="none" transform="translate(0 -2)"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2F312C"><tspan x="431.0" y="35.2">Kind, du bist immer bei</tspan><tspan x="431.0" y="60.2">mir, und alles, was</tspan><tspan x="431.0" y="85.2">mein ist, ist dein.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2F312C"><tspan x="431.0" y="35.2">Chind, du bisch immer</tspan><tspan x="431.0" y="60.2">bi mir, und alles, was</tspan><tspan x="431.0" y="85.2">mir ghört, ghört dir.</tspan></text></g><rect x="0" y="400" width="600" height="46" fill="#FBF8F1"/><circle cx="24" cy="423.0" r="12" fill="none" stroke="#4A4D45" stroke-width="1.4"/><text x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4A4D45" class="pn-n">3</text><text class="lw lw-de" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">dein Bruder war tot und ist lebendig geworden</text><text class="lw lw-gsw" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">din Brueder isch tot gsii und isch läbig worde</text><rect x=".5" y=".5" width="599" height="445" fill="none" stroke="#D8D0C0" stroke-width="1"/></svg></svg>
