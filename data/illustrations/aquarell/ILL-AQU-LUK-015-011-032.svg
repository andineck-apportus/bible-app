<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1212 904"><svg class="ill-tile" data-span="1" data-scene="LUK-015-L1" x="0" y="0" width="600" height="446" viewBox="0 0 600 446"><image href="img/LUK-015-L1.webp" x="0" y="0" width="600" height="400" preserveAspectRatio="xMidYMid slice"/><g class="ill-bubble ill-thought" data-speech="0"><circle cx="191" cy="100" r="7" fill="#FBF8F1" stroke="#4A4D45" stroke-width="1.2"/><circle cx="191" cy="117" r="5" fill="#FBF8F1" stroke="#4A4D45" stroke-width="1.2"/><circle cx="191" cy="131" r="3.5" fill="#FBF8F1" stroke="#4A4D45" stroke-width="1.2"/><rect x="38" y="12" width="310" height="74" rx="34" fill="#FBF8F1" fill-opacity=".94" stroke="#4A4D45" stroke-width="1.2" stroke-dasharray="1 0"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2F312C"><tspan x="193.0" y="43.2">Ich werde mich aufmachen,</tspan><tspan x="193.0" y="68.2">zu meinem Vater gehen …</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2F312C"><tspan x="193.0" y="43.2">Ich mach mich uf und</tspan><tspan x="193.0" y="68.2">gaa zu mim Vatter …</tspan></text></g><rect x="0" y="400" width="600" height="46" fill="#FBF8F1"/><circle cx="24" cy="423.0" r="12" fill="none" stroke="#4A4D45" stroke-width="1.4"/><text x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4A4D45" class="pn-n">1</text><text class="lw lw-de" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">Da ging er in sich</text><text class="lw lw-gsw" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">Da isch er zue sich choo</text><rect x=".5" y=".5" width="599" height="445" fill="none" stroke="#D8D0C0" stroke-width="1"/></svg><svg class="ill-tile" data-span="1" data-scene="LUK-015-L2" x="612" y="0" width="600" height="446" viewBox="0 0 600 446"><image href="img/LUK-015-L2.webp" x="0" y="0" width="600" height="400" preserveAspectRatio="xMidYMid slice"/><g class="ill-bubble" data-speech="0"><polygon points="302,102 324,102 313,141" fill="#FBF8F1" stroke="#4A4D45" stroke-width="1.2" stroke-linejoin="round"/><rect x="178" y="4" width="270" height="99" rx="18" fill="#FBF8F1" fill-opacity=".94" stroke="#4A4D45" stroke-width="1.2"/><polygon points="302,102 324,102 313,141" fill="#FBF8F1" stroke="none" transform="translate(0 -2)"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2F312C"><tspan x="313.0" y="35.2">Vater, ich habe</tspan><tspan x="313.0" y="60.2">gesündigt gegen den</tspan><tspan x="313.0" y="85.2">Himmel und vor dir …</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2F312C"><tspan x="313.0" y="35.2">Vatter, ich han</tspan><tspan x="313.0" y="60.2">gsündiget gäge de</tspan><tspan x="313.0" y="85.2">Himmel und vor dir …</tspan></text></g><rect x="0" y="400" width="600" height="46" fill="#FBF8F1"/><circle cx="24" cy="423.0" r="12" fill="none" stroke="#4A4D45" stroke-width="1.4"/><text x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4A4D45" class="pn-n">2</text><text class="lw lw-de" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">war tot und ist wieder lebendig geworden</text><text class="lw lw-gsw" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">isch tot gsii und isch wider läbig worde</text><rect x=".5" y=".5" width="599" height="445" fill="none" stroke="#D8D0C0" stroke-width="1"/></svg><svg class="ill-tile" data-span="1" data-scene="LUK-015-L3" x="306" y="458" width="600" height="446" viewBox="0 0 600 446"><image href="img/LUK-015-L3.webp" x="0" y="0" width="600" height="400" preserveAspectRatio="xMidYMid slice"/><g class="ill-bubble" data-speech="0"><polygon points="209,77 231,77 182,105" fill="#FBF8F1" stroke="#4A4D45" stroke-width="1.2" stroke-linejoin="round"/><rect x="194" y="4" width="270" height="74" rx="18" fill="#FBF8F1" fill-opacity=".94" stroke="#4A4D45" stroke-width="1.2"/><polygon points="209,77 231,77 182,105" fill="#FBF8F1" stroke="none" transform="translate(0 -2)"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2F312C"><tspan x="329.0" y="35.2">… mir hast du nie ein</tspan><tspan x="329.0" y="60.2">Zicklein gegeben …</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2F312C"><tspan x="329.0" y="35.2">… mir häsch nie</tspan><tspan x="329.0" y="60.2">es Gitzi ggää …</tspan></text></g><g class="ill-bubble" data-speech="1"><polygon points="255,153 255,175 303,118" fill="#FBF8F1" stroke="#4A4D45" stroke-width="1.2" stroke-linejoin="round"/><rect x="26" y="144" width="230" height="124" rx="18" fill="#FBF8F1" fill-opacity=".94" stroke="#4A4D45" stroke-width="1.2"/><polygon points="255,153 255,175 303,118" fill="#FBF8F1" stroke="none" transform="translate(-2 0)"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2F312C"><tspan x="141.0" y="175.2">Kind, du bist</tspan><tspan x="141.0" y="200.2">immer bei mir, und</tspan><tspan x="141.0" y="225.2">alles, was mein</tspan><tspan x="141.0" y="250.2">ist, ist dein.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2F312C"><tspan x="141.0" y="175.2">Chind, du bisch</tspan><tspan x="141.0" y="200.2">immer bi mir, und</tspan><tspan x="141.0" y="225.2">alles, was mir</tspan><tspan x="141.0" y="250.2">ghört, ghört dir.</tspan></text></g><rect x="0" y="400" width="600" height="46" fill="#FBF8F1"/><circle cx="24" cy="423.0" r="12" fill="none" stroke="#4A4D45" stroke-width="1.4"/><text x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4A4D45" class="pn-n">3</text><text class="lw lw-de" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">dein Bruder war tot und ist lebendig geworden</text><text class="lw lw-gsw" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">din Brueder isch tot gsii und isch läbig worde</text><rect x=".5" y=".5" width="599" height="445" fill="none" stroke="#D8D0C0" stroke-width="1"/></svg></svg>
