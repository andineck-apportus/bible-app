 style="fill:var(--sk-text-leise,#76828A)" x="313.0" y="203.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10.5"  text-anchor="end">2,8–9</text></svg><g transform="translate(0 -94.5)"><circle style="stroke:var(--sk-text,#4A4D45)" cx="24" cy="423.0" r="12" fill="none"  stroke-width="1.4"/><text style="fill:var(--sk-text,#4A4D45)" x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14"  class="pn-n">1</text><text style="fill:var(--sk-text,#3B3D37)" class="lw lw-de" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" ></text><text style="fill:var(--sk-text,#3B3D37)" class="lw lw-gsw" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" ></text></g></g></svg></svg>
