<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1212 446"><svg class="ill-tile" data-span="1" data-scene="JHN-002-T1" x="0" y="0" width="600" height="446" viewBox="0 0 600 446"><image href="img/JHN-002-T1.webp" x="0" y="0" width="600" height="400" preserveAspectRatio="xMidYMid slice"/><g class="ill-bubble" data-speech="0"><polygon points="349,101 371,101 360,128" fill="#FBF8F1" stroke="#4A4D45" stroke-width="1.6" stroke-linejoin="round"/><rect x="300" y="6" width="290" height="96" rx="18" fill="#FBF8F1" fill-opacity=".96" stroke="#4A4D45" stroke-width="1.6"/><polygon points="349,101 371,101 360,128" fill="#FBF8F1" stroke="none" transform="translate(0 -2)"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#2F312C"><tspan x="445.0" y="36.4">Macht das Haus meines</tspan><tspan x="445.0" y="60.4">Vaters nicht zu einem</tspan><tspan x="445.0" y="84.4">Haus des Handels!</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#2F312C"><tspan x="445.0" y="36.4">Mached s Huus vo</tspan><tspan x="445.0" y="60.4">mim Vatter nöd zu</tspan><tspan x="445.0" y="84.4">me Handelshuus!</tspan></text></g><rect x="0" y="400" width="600" height="46" fill="#FBF8F1"/><circle cx="24" cy="423.0" r="12" fill="none" stroke="#4A4D45" stroke-width="1.4"/><text x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4A4D45" class="pn-n">1</text><text class="lw lw-de" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">Der Eifer um dein Haus wird mich verzehren</text><text class="lw lw-gsw" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">De Iifer für dis Huus wird mich uffrässe</text><rect x=".5" y=".5" width="599" height="445" fill="none" stroke="#D8D0C0" stroke-width="1"/></svg><svg class="ill-tile" data-span="1" data-scene="JHN-002-T2" x="612" y="0" width="600" height="446" viewBox="0 0 600 446"><image href="img/JHN-002-T2.webp" x="0" y="0" width="600" height="400" preserveAspectRatio="xMidYMid slice"/><g class="ill-bubble" data-speech="0"><polygon points="194,97 216,97 205,132" fill="#FBF8F1" stroke="#4A4D45" stroke-width="1.6" stroke-linejoin="round"/><rect x="20" y="24" width="250" height="74" rx="18" fill="#FBF8F1" fill-opacity=".96" stroke="#4A4D45" stroke-width="1.6"/><polygon points="194,97 216,97 205,132" fill="#FBF8F1" stroke="none" transform="translate(0 -2)"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2F312C"><tspan x="145.0" y="55.2">Was für ein Zeichen</tspan><tspan x="145.0" y="80.2">zeigst du uns …?</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2F312C"><tspan x="145.0" y="55.2">Was für es Zeiche</tspan><tspan x="145.0" y="80.2">zeigsch üs …?</tspan></text></g><g class="ill-bubble" data-speech="1"><polygon points="424,96 446,96 435,122" fill="#FBF8F1" stroke="#4A4D45" stroke-width="1.6" stroke-linejoin="round"/><rect x="300" y="4" width="292" height="93" rx="18" fill="#FBF8F1" fill-opacity=".96" stroke="#4A4D45" stroke-width="1.6"/><polygon points="424,96 446,96 435,122" fill="#FBF8F1" stroke="none" transform="translate(0 -2)"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#2F312C"><tspan x="446.0" y="33.6">Reisst diesen Tempel</tspan><tspan x="446.0" y="56.6">nieder, und in drei Tagen</tspan><tspan x="446.0" y="79.6">werde ich ihn aufrichten.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#2F312C"><tspan x="446.0" y="33.6">Riissed dä Tämpel</tspan><tspan x="446.0" y="56.6">ab, und i drüü Täg</tspan><tspan x="446.0" y="79.6">stell ich en uf.</tspan></text></g><rect x="0" y="400" width="600" height="46" fill="#FBF8F1"/><circle cx="24" cy="423.0" r="12" fill="none" stroke="#4A4D45" stroke-width="1.4"/><text x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4A4D45" class="pn-n">2</text><text class="lw lw-de" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">Er aber sprach vom Tempel seines Leibes</text><text class="lw lw-gsw" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">Er aber hät vom Tämpel vo sim Liib gredt</text><rect x=".5" y=".5" width="599" height="445" fill="none" stroke="#D8D0C0" stroke-width="1"/></svg></svg>
