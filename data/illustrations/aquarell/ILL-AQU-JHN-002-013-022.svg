aters</tspan><tspan x="339.0" y="66.2">nicht zu einem Haus des Handels!</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2F312C"><tspan x="339.0" y="41.2">Mached s Huus vo mim Vatter</tspan><tspan x="339.0" y="66.2">nöd zu me Handelshuus!</tspan></text></g><rect x="0" y="400" width="600" height="46" fill="#FBF8F1"/><circle cx="24" cy="423.0" r="12" fill="none" stroke="#4A4D45" stroke-width="1.4"/><text x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4A4D45" class="pn-n">1</text><text class="lw lw-de" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">Der Eifer um dein Haus wird mich verzehren</text><text class="lw lw-gsw" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">De Iifer für dis Huus wird mich uffrässe</text><rect x="1" y="1" width="598" height="444" fill="none" stroke="#D8D0C0" stroke-width="1.2" vector-effect="non-scaling-stroke"/></svg><svg class="ill-tile" data-span="1" data-scene="JHN-002-T2" x="612" y="0" width="600" height="446" viewBox="0 0 600 446"><image href="img/JHN-002-T2.webp" x="0" y="0" width="600" height="400" preserveAspectRatio="xMidYMid slice"/><g class="ill-bubble" data-speech="0"><path d="M18.6,40.9 L18.5,35.6 L20.2,30.9 L23.3,27.3 L26.7,24.5 L31.1,22.4 L36.1,22.1 L45.3,21.8 L53.6,21.0 L63.9,22.0 L73.2,21.4 L82.3,21.9 L91.0,22.7 L101.2,21.9 L109.7,22.3 L119.5,22.3 L128.9,22.1 L138.1,22.4 L146.6,22.7 L156.9,22.0 L166.3,21.9 L175.0,22.0 L184.3,20.9 L194.1,22.1 L203.2,21.8 L212.4,21.5 L222.4,22.2 L230.9,21.5 L240.2,21.8 L250.1,22.3 L255.3,23.1 L258.4,24.7 L262.7,28.1 L265.7,31.0 L267.7,35.1 L267.9,40.5 L268.6,49.0 L267.8,59.2 L268.0,68.5 L268.6,77.1 L268.1,82.4 L265.4,86.5 L262.9,90.5 L259.7,93.8 L254.9,95.9 L250.4,95.8 L241.3,96.4 L231.9,96.3 L222.4,95.9 L214.4,97.1 L204.5,96.0 L195.0,96.0 L193.0,105.4 L192.0,114.0 L