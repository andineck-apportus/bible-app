aters</tspan><tspan x="339.0" y="66.2">nicht zu einem Haus des Handels!</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2F312C"><tspan x="339.0" y="41.2">Mached s Huus vo mim Vatter</tspan><tspan x="339.0" y="66.2">nöd zu me Handelshuus!</tspan></text></g><rect x="0" y="400" width="600" height="46" fill="#FBF8F1"/><circle cx="24" cy="423.0" r="12" fill="none" stroke="#4A4D45" stroke-width="1.4"/><text x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4A4D45" class="pn-n">1</text><text class="lw lw-de" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">Der Eifer um dein Haus wird mich verzehren</text><text class="lw lw-gsw" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">De Iifer für dis Huus wird mich uffrässe</text><rect x=".5" y=".5" width="599" height="445" fill="none" stroke="#D8D0C0" stroke-width="1"/></svg><svg class="ill-tile" data-span="1" data-scene="JHN-002-T2" x="612" y="0" width="600" height="446" viewBox="0 0 600 446"><image href="img/JHN-002-T2.webp" x="0" y="0" width="600" height="400" preserveAspectRatio="xMidYMid slice"/><g class="ill-bubble" data-speech="0"><path d="M84.6,46.9 L84.5,41.6 L86.2,36.9 L89.3,33.3 L92.7,30.5 L97.1,28.4 L102.1,28.1 L111.3,27.8 L119.6,27.0 L129.9,28.0 L139.2,27.4 L148.3,27.9 L157.0,28.7 L167.2,27.9 L175.7,28.3 L185.5,28.3 L194.9,28.1 L204.1,28.4 L212.6,28.7 L222.9,28.0 L232.3,27.9 L241.0,28.0 L250.3,26.9 L260.1,28.1 L269.2,27.8 L278.4,27.5 L288.4,28.2 L296.9,27.5 L306.2,27.8 L316.1,28.3 L321.3,29.1 L324.4,30.7 L328.7,34.1 L331.7,37.0 L333.7,41.1 L333.9,46.5 L334.6,55.0 L333.8,65.2 L334.0,74.5 L334.6,83.1 L334.1,88.4 L331.4,92.5 L328.9,96.5 L325.7,99.8 L320.9,101.9 L316.4,101.8 L305.8,102.4 L294.9,102.3 L283.9,101.9 L283.1,112.7 L280.4,121.2 L278.0,130.8 L276.0,140.4 L274.0,150.0 L272.0,140.1 L270.4,1