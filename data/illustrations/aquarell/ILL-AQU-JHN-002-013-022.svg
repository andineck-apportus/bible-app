<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1212 446"><svg class="ill-tile" data-span="1" data-scene="JHN-002-T1" x="0" y="0" width="600" height="446" viewBox="0 0 600 446"><image href="img/JHN-002-T1.webp" x="0" y="0" width="600" height="400" preserveAspectRatio="xMidYMid slice"/><g class="ill-bubble" data-speech="0"><polygon points="328,102 350,102 339,130" fill="#FBF8F1" stroke="#4A4D45" stroke-width="1.2" stroke-linejoin="round"/><rect x="206" y="4" width="270" height="99" rx="18" fill="#FBF8F1" fill-opacity=".94" stroke="#4A4D45" stroke-width="1.2"/><polygon points="328,102 350,102 339,130" fill="#FBF8F1" stroke="none" transform="translate(0 -2)"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2F312C"><tspan x="341.0" y="35.2">Macht das Haus meines</tspan><tspan x="341.0" y="60.2">Vaters nicht zu einem</tspan><tspan x="341.0" y="85.2">Haus des Handels!</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2F312C"><tspan x="341.0" y="35.2">Mached s Huus vo</tspan><tspan x="341.0" y="60.2">mim Vatter nöd zu</tspan><tspan x="341.0" y="85.2">me Handelshuus!</tspan></text></g><rect x="0" y="400" width="600" height="46" fill="#FBF8F1"/><circle cx="24" cy="423.0" r="12" fill="none" stroke="#4A4D45" stroke-width="1.4"/><text x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4A4D45" class="pn-n">1</text><text class="lw lw-de" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">Der Eifer um dein Haus wird mich verzehren</text><text class="lw lw-gsw" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">De Iifer für dis Huus wird mich uffrässe</text><rect x=".5" y=".5" width="599" height="445" fill="none" stroke="#D8D0C0" stroke-width="1"/></svg><svg class="ill-tile" data-span="1" data-scene="JHN-002-T2" x="612" y="0" width="600" height="446" viewBox="0 0 600 446"><image href="img/JHN-002-T2.webp" x="0" y="0" width="600" height="400" preserveAspectRatio="xMidYMid slice"/><g class="ill-bubble" data-speech="0"><polygon points="259,81 281,81 270,131" fill="#FBF8F1" stroke="#4A4D45" stroke-width="1.2" stroke-linejoin="round"/><rect x="146" y="8" width="250" height="74" rx="18" fill="#FBF8F1" fill-opacity=".94" stroke="#4A4D45" stroke-width="1.2"/><polygon points="259,81 281,81 270,131" fill="#FBF8F1" stroke="none" transform="translate(0 -2)"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2F312C"><tspan x="271.0" y="39.2">Was für ein Zeichen</tspan><tspan x="271.0" y="64.2">zeigst du uns …?</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2F312C"><tspan x="271.0" y="39.2">Was für es Zeiche</tspan><tspan x="271.0" y="64.2">zeigsch üs …?</tspan></text></g><g class="ill-bubble" data-speech="1"><polygon points="227,144 227,166 407,155" fill="#FBF8F1" stroke="#4A4D45" stroke-width="1.2" stroke-linejoin="round"/><rect x="18" y="92" width="210" height="149" rx="18" fill="#FBF8F1" fill-opacity=".94" stroke="#4A4D45" stroke-width="1.2"/><polygon points="227,144 227,166 407,155" fill="#FBF8F1" stroke="none" transform="translate(-2 0)"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2F312C"><tspan x="123.0" y="123.2">Reisst diesen</tspan><tspan x="123.0" y="148.2">Tempel nieder,</tspan><tspan x="123.0" y="173.2">und in drei</tspan><tspan x="123.0" y="198.2">Tagen werde ich</tspan><tspan x="123.0" y="223.2">ihn aufrichten.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2F312C"><tspan x="123.0" y="135.7">Riissed dä</tspan><tspan x="123.0" y="160.7">Tämpel ab, und i</tspan><tspan x="123.0" y="185.7">drüü Täg stell</tspan><tspan x="123.0" y="210.7">ich en uf.</tspan></text></g><rect x="0" y="400" width="600" height="46" fill="#FBF8F1"/><circle cx="24" cy="423.0" r="12" fill="none" stroke="#4A4D45" stroke-width="1.4"/><text x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4A4D45" class="pn-n">2</text><text class="lw lw-de" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">Er aber sprach vom Tempel seines Leibes</text><text class="lw lw-gsw" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">Er aber hät vom Tämpel vo sim Liib gredt</text><rect x=".5" y=".5" width="599" height="445" fill="none" stroke="#D8D0C0" stroke-width="1"/></svg></svg>
