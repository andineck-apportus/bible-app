y="60.2">nicht zu einem Haus des Handels!</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2F312C"><tspan x="339.0" y="35.2">Mached s Huus vo mim Vatter</tspan><tspan x="339.0" y="60.2">nöd zu me Handelshuus!</tspan></text></g><rect x="0" y="400" width="600" height="46" fill="#FBF8F1"/><circle cx="24" cy="423.0" r="12" fill="none" stroke="#4A4D45" stroke-width="1.4"/><text x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4A4D45" class="pn-n">1</text><text class="lw lw-de" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">Der Eifer um dein Haus wird mich verzehren</text><text class="lw lw-gsw" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">De Iifer für dis Huus wird mich uffrässe</text><rect x=".5" y=".5" width="599" height="445" fill="none" stroke="#D8D0C0" stroke-width="1"/></svg><svg class="ill-tile" data-span="1" data-scene="JHN-002-T2" x="612" y="0" width="600" height="446" viewBox="0 0 600 446"><image href="img/JHN-002-T2.webp" x="0" y="0" width="600" height="400" preserveAspectRatio="xMidYMid slice"/><g class="ill-bubble" data-speech="0"><path d="M150.6,40.9 L150.5,35.6 L152.2,30.9 L155.3,27.3 L158.7,24.5 L163.1,22.4 L168.1,22.1 L177.3,21.8 L185.6,21.0 L195.9,22.0 L205.2,21.4 L214.3,21.9 L223.0,22.7 L233.2,21.9 L241.7,22.3 L251.5,22.3 L260.9,22.1 L270.1,22.4 L278.6,22.7 L288.9,22.0 L298.3,21.9 L307.0,22.0 L316.3,20.9 L326.1,22.1 L335.2,21.8 L344.4,21.5 L354.4,22.2 L362.9,21.5 L372.2,21.8 L382.1,22.3 L387.3,23.1 L390.4,24.7 L394.7,28.1 L397.7,31.0 L399.7,35.1 L399.9,40.5 L400.6,49.0 L399.8,59.2 L400.0,68.5 L400.6,77.1 L400.1,82.4 L397.4,86.5 L394.9,90.5 L391.7,93.8 L386.9,95.9 L382.4,95.8 L372.7,96.4 L362.7,96.3 L352.5,95.9 L343.9,97.1 L333.4,96.0 L323.2,96.0 L313.4,96.0 L304.6,95.2 L293.8,95.7 L284.4,95.9 L282.2,105.8 L280.1,115.7 L277.