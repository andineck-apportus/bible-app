 fill-opacity=".95" stroke="#8E9087" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#2F312C"><tspan x="457.0" y="39.6">Reisst diesen</tspan><tspan x="457.0" y="62.6">Tempel nieder, und</tspan><tspan x="457.0" y="85.6">in drei Tagen werde</tspan><tspan x="457.0" y="108.6">ich ihn aufrichten.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#2F312C"><tspan x="457.0" y="51.1">Riissed dä Tämpel</tspan><tspan x="457.0" y="74.1">ab, und i drüü Täg</tspan><tspan x="457.0" y="97.1">stell ich en uf.</tspan></text></g><rect x="0" y="400" width="600" height="46" fill="#FBF8F1"/><circle cx="24" cy="423.0" r="12" fill="none" stroke="#4A4D45" stroke-width="1.4"/><text x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4A4D45" class="pn-n">2</text><text class="lw lw-de" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">Er aber sprach vom Tempel seines Leibes</text><text class="lw lw-gsw" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">Er aber hät vom Tämpel vo sim Liib gredt</text><rect x=".5" y=".5" width="599" height="445" fill="none" stroke="#D8D0C0" stroke-width="1"/></svg></svg>
