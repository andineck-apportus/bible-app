<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1212 904"><svg class="ill-tile" data-span="1" data-scene="JHN-002-K3" x="0" y="0" width="600" height="446" viewBox="0 0 600 446"><image href="img/JHN-002-K3.webp" x="0" y="0" width="600" height="400" preserveAspectRatio="xMidYMid slice"/><g class="ill-bubble" data-speech="0"><polygon points="245,75 267,75 232,90" fill="#FBF8F1" stroke="#4A4D45" stroke-width="1.6" stroke-linejoin="round"/><rect x="230" y="2" width="310" height="74" rx="18" fill="#FBF8F1" fill-opacity=".96" stroke="#4A4D45" stroke-width="1.6"/><polygon points="245,75 267,75 232,90" fill="#FBF8F1" stroke="none" transform="translate(0 -2)"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2F312C"><tspan x="385.0" y="33.2">… du hast den guten Wein</tspan><tspan x="385.0" y="58.2">bis jetzt aufbewahrt.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2F312C"><tspan x="385.0" y="33.2">… du häsch de guet Wii</tspan><tspan x="385.0" y="58.2">bis jetzt ufbhalte.</tspan></text></g><rect x="0" y="400" width="600" height="46" fill="#FBF8F1"/><circle cx="24" cy="423.0" r="12" fill="none" stroke="#4A4D45" stroke-width="1.4"/><text x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4A4D45" class="pn-n">1</text><text class="lw lw-de" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">Diesen Anfang der Zeichen machte Jesus</text><text class="lw lw-gsw" x="320.0" y="429.5" text-anchor="middle" font-family="sans-serif" font-size="18" font-style="italic" fill="#3B3D37">Das hät de Jesus als Aafang vo de Zeiche gmacht</text><rect x=".5" y=".5" width="599" height="445" fill="none" stroke="#D8D0C0" stroke-width="1"/></svg><svg class="ill-tile" data-span="1" data-scene="JHN-002-T1" x="612" y="0" width="600" height="446" viewBox="0 0 600 446"><image href="img/JHN-002-T1.webp" x="0" y="0" width="600" height="400" preserveAspectRatio="xMidYMid slice"/><g class="ill-bubble" data-speech="0"><polygon points="374,75 396,75 385,114" fill="#FBF8F1" stroke="#4A4D45" stroke-width="1.6" stroke-linejoin="round"/><rect x="212" y="4" width="380" height="72" rx="18" fill="#FBF8F1" fill-opacity=".96" stroke="#4A4D45" stroke-width="1.6"/><polygon points="374,75 396,75 385,114" fill="#FBF8F1" stroke="none" transform="translate(0 -2)"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#2F312C"><tspan x="402.0" y="34.4">Macht das Haus meines Vaters</tspan><tspan x="402.0" y="58.4">nicht zu einem Haus des Handels!</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#2F312C"><tspan x="402.0" y="34.4">Mached s Huus vo mim Vatter</tspan><tspan x="402.0" y="58.4">nöd zu me Handelshuus!</tspan></text></g><rect x="0" y="400" width="600" height="46" fill="#FBF8F1"/><circle cx="24" cy="423.0" r="12" fill="none" stroke="#4A4D45" stroke-width="1.4"/><text x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4A4D45" class="pn-n">2</text><text class="lw lw-de" x="320.0" y="427.7" text-anchor="middle" font-family="sans-serif" font-size="13" font-style="italic" fill="#3B3D37">Reisst diesen Tempel nieder, und in drei Tagen werde ich ihn aufrichten</text><text class="lw lw-gsw" x="320.0" y="428.8" text-anchor="middle" font-family="sans-serif" font-size="16" font-style="italic" fill="#3B3D37">Riissed dä Tämpel ab, und i drüü Täg stell ich en uf</text><rect x=".5" y=".5" width="599" height="445" fill="none" stroke="#D8D0C0" stroke-width="1"/></svg><svg class="ill-tile" data-span="1" data-scene="JHN-002-J1" x="306" y="458" width="600" height="446" viewBox="0 0 600 446"><image href="img/JHN-002-J1.webp" x="0" y="0" width="600" height="400" preserveAspectRatio="xMidYMid slice"/><rect x="0" y="400" width="600" height="46" fill="#FBF8F1"/><circle cx="24" cy="423.0" r="12" fill="none" stroke="#4A4D45" stroke-width="1.4"/><text x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4A4D45" class="pn-n">3</text><text class="lw lw-de" x="320.0" y="429.5" text-anchor="middle" font-family="sans-serif" font-size="18" font-style="italic" fill="#3B3D37">Jesus selbst aber vertraute sich ihnen nicht an</text><text class="lw lw-gsw" x="320.0" y="429.5" text-anchor="middle" font-family="sans-serif" font-size="18" font-style="italic" fill="#3B3D37">De Jesus sälber aber hät sich ine nöd aavertrout</text><rect x=".5" y=".5" width="599" height="445" fill="none" stroke="#D8D0C0" stroke-width="1"/></svg></svg>
