<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1212 904"><svg class="ill-tile" data-span="1" data-scene="JHN-002-K3" x="0" y="0" width="600" height="446" viewBox="0 0 600 446"><image href="img/JHN-002-K3.webp" x="0" y="0" width="600" height="400" preserveAspectRatio="xMidYMid slice"/><g class="ill-bubble" data-speech="0"><polygon points="215,169 215,191 242,127" fill="#FBF8F1" stroke="#4A4D45" stroke-width="1.2" stroke-linejoin="round"/><rect x="6" y="160" width="210" height="93" rx="18" fill="#FBF8F1" fill-opacity=".94" stroke="#4A4D45" stroke-width="1.2"/><polygon points="215,169 215,191 242,127" fill="#FBF8F1" stroke="none" transform="translate(-2 0)"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#2F312C"><tspan x="111.0" y="189.6">… du hast den</tspan><tspan x="111.0" y="212.6">guten Wein bis</tspan><tspan x="111.0" y="235.6">jetzt aufbewahrt.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#2F312C"><tspan x="111.0" y="189.6">… du häsch de</tspan><tspan x="111.0" y="212.6">guet Wii bis</tspan><tspan x="111.0" y="235.6">jetzt ufbhalte.</tspan></text></g><rect x="0" y="400" width="600" height="46" fill="#FBF8F1"/><circle cx="24" cy="423.0" r="12" fill="none" stroke="#4A4D45" stroke-width="1.4"/><text x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4A4D45" class="pn-n">1</text><text class="lw lw-de" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">Diesen Anfang der Zeichen machte Jesus</text><text class="lw lw-gsw" x="320.0" y="429.5" text-anchor="middle" font-family="sans-serif" font-size="18" font-style="italic" fill="#3B3D37">Das hät de Jesus als Aafang vo de Zeiche gmacht</text><rect x=".5" y=".5" width="599" height="445" fill="none" stroke="#D8D0C0" stroke-width="1"/></svg><svg class="ill-tile" data-span="1" data-scene="JHN-002-T1" x="612" y="0" width="600" height="446" viewBox="0 0 600 446"><image href="img/JHN-002-T1.webp" x="0" y="0" width="600" height="400" preserveAspectRatio="xMidYMid slice"/><g class="ill-bubble" data-speech="0"><polygon points="331,77 353,77 342,127" fill="#FBF8F1" stroke="#4A4D45" stroke-width="1.2" stroke-linejoin="round"/><rect x="144" y="4" width="390" height="74" rx="18" fill="#FBF8F1" fill-opacity=".94" stroke="#4A4D45" stroke-width="1.2"/><polygon points="331,77 353,77 342,127" fill="#FBF8F1" stroke="none" transform="translate(0 -2)"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2F312C"><tspan x="339.0" y="35.2">Macht das Haus meines Vaters</tspan><tspan x="339.0" y="60.2">nicht zu einem Haus des Handels!</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2F312C"><tspan x="339.0" y="35.2">Mached s Huus vo mim Vatter</tspan><tspan x="339.0" y="60.2">nöd zu me Handelshuus!</tspan></text></g><rect x="0" y="400" width="600" height="46" fill="#FBF8F1"/><circle cx="24" cy="423.0" r="12" fill="none" stroke="#4A4D45" stroke-width="1.4"/><text x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4A4D45" class="pn-n">2</text><text class="lw lw-de" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">In drei Tagen werde ich ihn aufrichten</text><text class="lw lw-gsw" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">i drüü Täg stell ich en uf</text><rect x=".5" y=".5" width="599" height="445" fill="none" stroke="#D8D0C0" stroke-width="1"/></svg><svg class="ill-tile" data-span="1" data-scene="JHN-002-J1" x="306" y="458" width="600" height="446" viewBox="0 0 600 446"><image href="img/JHN-002-J1.webp" x="0" y="0" width="600" height="400" preserveAspectRatio="xMidYMid slice"/><rect x="0" y="400" width="600" height="46" fill="#FBF8F1"/><circle cx="24" cy="423.0" r="12" fill="none" stroke="#4A4D45" stroke-width="1.4"/><text x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4A4D45" class="pn-n">3</text><text class="lw lw-de" x="320.0" y="429.5" text-anchor="middle" font-family="sans-serif" font-size="18" font-style="italic" fill="#3B3D37">Jesus selbst aber vertraute sich ihnen nicht an</text><text class="lw lw-gsw" x="320.0" y="429.5" text-anchor="middle" font-family="sans-serif" font-size="18" font-style="italic" fill="#3B3D37">De Jesus sälber aber hät sich ine nöd aavertrout</text><rect x=".5" y=".5" width="599" height="445" fill="none" stroke="#D8D0C0" stroke-width="1"/></svg></svg>
