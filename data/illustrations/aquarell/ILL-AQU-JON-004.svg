<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1212 904"><svg class="ill-tile" data-span="1" data-scene="JON-004-M1" x="0" y="0" width="600" height="446" viewBox="0 0 600 446"><defs><clipPath id="kc-JON-004-M1"><rect width="600" height="446" rx="22"/></clipPath></defs><g clip-path="url(#kc-JON-004-M1)"><rect width="600" height="446" fill="#FBF8F1"/><image href="img/JON-004-M1.webp" x="0" y="0" width="600" height="400" preserveAspectRatio="xMidYMid slice"/><rect x="0" y="400" width="600" height="46" fill="#FBF8F1"/><circle cx="24" cy="423.0" r="12" fill="none" stroke="#4A4D45" stroke-width="1.4"/><text x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4A4D45" class="pn-n">1</text><text class="lw lw-de" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">Und er wurde zornig</text><text class="lw lw-gsw" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">Und er isch toub worde</text></g></svg><svg class="ill-tile" data-span="1" data-scene="JON-004-M2" x="612" y="0" width="600" height="446" viewBox="0 0 600 446"><defs><clipPath id="kc-JON-004-M2"><rect width="600" height="446" rx="22"/></clipPath></defs><g clip-path="url(#kc-JON-004-M2)"><rect width="600" height="446" fill="#FBF8F1"/><image href="img/JON-004-M2.webp" x="0" y="0" width="600" height="400" preserveAspectRatio="xMidYMid slice"/><rect x="0" y="400" width="600" height="46" fill="#FBF8F1"/><circle cx="24" cy="423.0" r="12" fill="none" stroke="#4A4D45" stroke-width="1.4"/><text x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4A4D45" class="pn-n">2</text><text class="lw lw-de" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">Besser ist mein Tod als mein Leben</text><text class="lw lw-gsw" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">Besser isch min Tod als mis Läbe</text></g></svg><svg class="ill-tile" data-span="1" data-scene="JON-004-M3" x="306" y="458" width="600" height="446" viewBox="0 0 600 446"><defs><clipPath id="kc-JON-004-M3"><rect width="600" height="446" rx="22"/></clipPath></defs><g clip-path="url(#kc-JON-004-M3)"><rect width="600" height="446" fill="#FBF8F1"/><image href="img/JON-004-M3.webp" x="0" y="0" width="600" height="400" preserveAspectRatio="xMidYMid slice"/><rect x="0" y="400" width="600" height="46" fill="#FBF8F1"/><circle cx="24" cy="423.0" r="12" fill="none" stroke="#4A4D45" stroke-width="1.4"/><text x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4A4D45" class="pn-n">3</text><text class="lw lw-de" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">Du hast Mitleid mit dem Rizinus</text><text class="lw lw-gsw" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">Du häsch Mitleid mit em Rizinus</text></g></svg></svg>
