="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">au d Hündli ässed vo de Brösmeli</text></g></svg><svg class="ill-tile" data-span="1" data-scene="MAT-015-M3" x="0" y="458" width="600" height="446" viewBox="0 0 600 446"><defs><clipPath id="kc-MAT-015-M3"><rect width="600" height="446" rx="22"/></clipPath></defs><g clip-path="url(#kc-MAT-015-M3)"><rect width="600" height="446" fill="#FBF8F1"/><image href="img/MAT-015-M3.webp" x="0" y="0" width="600" height="400" preserveAspectRatio="xMidYMid slice"/><rect x="0" y="400" width="600" height="46" fill="#FBF8F1"/><circle cx="24" cy="423.0" r="12" fill="none" stroke="#4A4D45" stroke-width="1.4"/><text x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4A4D45" class="pn-n">3</text><text class="lw lw-de" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">sie priesen den Gott Israels</text><text class="lw lw-gsw" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">si händ de Gott vo Israel prise</text></g></svg><svg class="ill-tile" data-span="1" data-scene="MAT-015-M4" x="612" y="458" width="600" height="446" viewBox="0 0 600 446"><defs><clipPath id="kc-MAT-015-M4"><rect width="600" height="446" rx="22"/></clipPath></defs><g clip-path="url(#kc-MAT-015-M4)"><rect width="600" height="446" fill="#FBF8F1"/><image href="img/MAT-015-M4.webp" x="0" y="0" width="600" height="400" preserveAspectRatio="xMidYMid slice"/><rect x="0" y="400" width="600" height="46" fill="#FBF8F1"/><circle cx="24" cy="423.0" r="12" fill="none" stroke="#4A4D45" stroke-width="1.4"/><text x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4A4D45" class="pn-n">4</text><text class="lw lw-de" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D3