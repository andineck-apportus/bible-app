<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1212 904"><svg class="ill-tile" data-span="1" data-scene="MRK-004-S1" x="0" y="0" width="600" height="446" viewBox="0 0 600 446"><image href="img/MRK-004-S1.webp" x="0" y="0" width="600" height="400" preserveAspectRatio="xMidYMid slice"/><g class="ill-bubble" data-speech="0"><polygon points="355,137 377,137 366,188" fill="#FBF8F1" stroke="#4A4D45" stroke-width="1.2" stroke-linejoin="round"/><rect x="198" y="64" width="330" height="74" rx="18" fill="#FBF8F1" fill-opacity=".94" stroke="#4A4D45" stroke-width="1.2"/><polygon points="355,137 377,137 366,188" fill="#FBF8F1" stroke="none" transform="translate(0 -2)"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2F312C"><tspan x="363.0" y="95.2">Lehrer, kümmert es dich</tspan><tspan x="363.0" y="120.2">nicht, dass wir umkommen?</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2F312C"><tspan x="363.0" y="95.2">Lehrer, isch es dir gliich,</tspan><tspan x="363.0" y="120.2">dass mir undergönd?</tspan></text></g><rect x="0" y="400" width="600" height="46" fill="#FBF8F1"/><circle cx="24" cy="423.0" r="12" fill="none" stroke="#4A4D45" stroke-width="1.4"/><text x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4A4D45" class="pn-n">1</text><text class="lw lw-de" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">ein grosser Sturmwind</text><text class="lw lw-gsw" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">en grosse Sturmwind</text><rect x=".5" y=".5" width="599" height="445" fill="none" stroke="#D8D0C0" stroke-width="1"/></svg><svg class="ill-tile" data-span="1" data-scene="MRK-004-S2" x="612" y="0" width="600" height="446" viewBox="0 0 600 446"><image href="img/MRK-004-S2.webp" x="0" y="0" width="600" height="400" preserveAspectRatio="xMidYMid slice"/><g class="ill-bubble" data-speech="0"><polygon points="325,88 347,88 336,136" fill="#FBF8F1" stroke="#4A4D45" stroke-width="1.2" stroke-linejoin="round"/><rect x="210" y="40" width="250" height="49" rx="18" fill="#FBF8F1" fill-opacity=".94" stroke="#4A4D45" stroke-width="1.2"/><polygon points="325,88 347,88 336,136" fill="#FBF8F1" stroke="none" transform="translate(0 -2)"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2F312C"><tspan x="335.0" y="71.2">Schweig! Verstumme!</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2F312C"><tspan x="335.0" y="71.2">Schwiig! Bis still!</tspan></text></g><rect x="0" y="400" width="600" height="46" fill="#FBF8F1"/><circle cx="24" cy="423.0" r="12" fill="none" stroke="#4A4D45" stroke-width="1.4"/><text x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4A4D45" class="pn-n">2</text><text class="lw lw-de" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">es wurde eine grosse Stille</text><text class="lw lw-gsw" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">es isch ganz still worde</text><rect x=".5" y=".5" width="599" height="445" fill="none" stroke="#D8D0C0" stroke-width="1"/></svg><svg class="ill-tile" data-span="1" data-scene="MRK-004-S3" x="306" y="458" width="600" height="446" viewBox="0 0 600 446"><image href="img/MRK-004-S3.webp" x="0" y="0" width="600" height="400" preserveAspectRatio="xMidYMid slice"/><g class="ill-bubble" data-speech="0"><polygon points="399,138 421,138 410,187" fill="#FBF8F1" stroke="#4A4D45" stroke-width="1.2" stroke-linejoin="round"/><rect x="306" y="40" width="270" height="99" rx="18" fill="#FBF8F1" fill-opacity=".94" stroke="#4A4D45" stroke-width="1.2"/><polygon points="399,138 421,138 410,187" fill="#FBF8F1" stroke="none" transform="translate(0 -2)"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2F312C"><tspan x="441.0" y="71.2">Warum seid ihr so</tspan><tspan x="441.0" y="96.2">furchtsam? Habt ihr</tspan><tspan x="441.0" y="121.2">noch keinen Glauben?</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2F312C"><tspan x="441.0" y="71.2">Werum sind er so</tspan><tspan x="441.0" y="96.2">ängschtlich? Händ</tspan><tspan x="441.0" y="121.2">er no kein Glaube?</tspan></text></g><g class="ill-bubble" data-speech="1"><polygon points="155,138 177,138 166,190" fill="#FBF8F1" stroke="#4A4D45" stroke-width="1.2" stroke-linejoin="round"/><rect x="6" y="40" width="290" height="99" rx="18" fill="#FBF8F1" fill-opacity=".94" stroke="#4A4D45" stroke-width="1.2"/><polygon points="155,138 177,138 166,190" fill="#FBF8F1" stroke="none" transform="translate(0 -2)"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2F312C"><tspan x="151.0" y="71.2">Wer ist denn dieser,</tspan><tspan x="151.0" y="96.2">dass auch der Wind und</tspan><tspan x="151.0" y="121.2">der See ihm gehorchen?</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#2F312C"><tspan x="151.0" y="71.2">Wär isch dänn dä, dass</tspan><tspan x="151.0" y="96.2">sogar de Wind und de</tspan><tspan x="151.0" y="121.2">See ihm folged?</tspan></text></g><rect x="0" y="400" width="600" height="46" fill="#FBF8F1"/><circle cx="24" cy="423.0" r="12" fill="none" stroke="#4A4D45" stroke-width="1.4"/><text x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4A4D45" class="pn-n">3</text><text class="lw lw-de" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">Und sie fürchteten sich sehr</text><text class="lw lw-gsw" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">Und si händ grossi Angscht übercho</text><rect x=".5" y=".5" width="599" height="445" fill="none" stroke="#D8D0C0" stroke-width="1"/></svg></svg>
