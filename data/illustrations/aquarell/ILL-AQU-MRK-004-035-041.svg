xt-anchor="middle" font-family="sans-serif" font-size="21" fill="#2F312C"><tspan x="363.0" y="95.2">Lehrer, isch es dir gliich,</tspan><tspan x="363.0" y="120.2">dass mir undergönd?</tspan></text></g><rect x="0" y="400" width="600" height="46" fill="#FBF8F1"/><circle cx="24" cy="423.0" r="12" fill="none" stroke="#4A4D45" stroke-width="1.4"/><text x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4A4D45" class="pn-n">1</text><text class="lw lw-de" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">ein grosser Sturmwind</text><text class="lw lw-gsw" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">en grosse Sturmwind</text><rect x=".5" y=".5" width="599" height="445" fill="none" stroke="#D8D0C0" stroke-width="1"/></svg><svg class="ill-tile" data-span="1" data-scene="MRK-004-S2" x="612" y="0" width="600" height="446" viewBox="0 0 600 446"><image href="img/MRK-004-S2.webp" x="0" y="0" width="600" height="400" preserveAspectRatio="xMidYMid slice"/><g class="ill-bubble" data-speech="0"><path d="M210.6,58.9 L210.5,53.6 L212.2,48.9 L215.3,45.3 L218.7,42.5 L223.1,40.4 L228.1,40.1 L237.3,39.8 L245.6,39.0 L255.9,40.0 L265.2,39.4 L274.3,39.9 L283.0,40.7 L293.2,39.9 L301.7,40.3 L311.5,40.3 L320.9,40.1 L330.1,40.4 L338.6,40.7 L348.9,40.0 L358.3,39.9 L367.0,40.0 L376.3,38.9 L386.1,40.1 L395.2,39.8 L404.4,39.5 L414.4,40.2 L422.9,39.5 L432.2,39.8 L442.1,40.3 L447.3,41.1 L450.4,42.7 L454.7,46.1 L457.7,49.0 L459.7,53.1 L459.9,58.5 L460.6,70.5 L459.2,75.9 L457.6,80.0 L455.3,82.9 L451.7,86.3 L446.4,87.9 L442.2,88.7 L433.1,89.2 L423.1,89.5 L413.6,88.8 L404.1,89.4 L394.3,89.3 L384.3,88.9 L375.9,90.1 L365.6,89.0 L355.6,89.0 L346.0,89.0 L345.0,97.6 L342.0,107.5 L340.4,117.1 L338.2,126.4 L336.0,136.0 L333.9,126.7 L332.8,116.6 L330.1,107.9 L327.5,99.1 L326.1,89.0 L316.6,90.0 L306.3,89.1 L296.3,88.8 L287.0,89.3 L276.5,88.8 L267.1