-serif" font-size="19" font-style="italic" fill="#3B3D37">Und si händ grossi Angscht übercho</text><rect x="1" y="1" width="598" height="444" fill="none" stroke="#D8D0C0" stroke-width="1.2" vector-effect="non-scaling-stroke"/></svg></svg>
