<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1212 904"><svg class="ill-tile" data-span="1" data-scene="MRK-B1" x="0" y="0" width="600" height="446" viewBox="0 0 600 446"><defs><clipPath id="kc-MRK-B1"><rect width="600" height="446" rx="22"/></clipPath></defs><g clip-path="url(#kc-MRK-B1)"><rect width="600" height="446" fill="#FBF8F1"/><image href="img/MRK-B1.webp" x="0" y="0" width="600" height="400" preserveAspectRatio="xMidYMid slice"/><rect x="0" y="400" width="600" height="46" fill="#FBF8F1"/><circle cx="24" cy="423.0" r="12" fill="none" stroke="#4A4D45" stroke-width="1.4"/><text x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4A4D45" class="pn-n">1</text><text class="lw lw-de" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">Anfang des Evangeliums von Jesus Christus</text><text class="lw lw-gsw" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">Aafang vom Evangelium vo Jesus Christus</text></g></svg><svg class="ill-tile" data-span="1" data-scene="MRK-B2" x="612" y="0" width="600" height="446" viewBox="0 0 600 446"><defs><clipPath id="kc-MRK-B2"><rect width="600" height="446" rx="22"/></clipPath></defs><g clip-path="url(#kc-MRK-B2)"><rect width="600" height="446" fill="#FBF8F1"/><image href="img/MRK-B2.webp" x="0" y="0" width="600" height="400" preserveAspectRatio="xMidYMid slice"/><rect x="0" y="400" width="600" height="46" fill="#FBF8F1"/><circle cx="24" cy="423.0" r="12" fill="none" stroke="#4A4D45" stroke-width="1.4"/><text x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4A4D45" class="pn-n">2</text><text class="lw lw-de" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">Ihr aber, wer, sagt ihr, sei ich?</text><text class="lw lw-gsw" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">Und was säged ir, wär ich bi?</text></g></svg><svg class="ill-tile" data-span="1" data-scene="MRK-B3" x="0" y="458" width="600" height="446" viewBox="0 0 600 446"><defs><clipPath id="kc-MRK-B3"><rect width="600" height="446" rx="22"/></clipPath></defs><g clip-path="url(#kc-MRK-B3)"><rect width="600" height="446" fill="#FBF8F1"/><image href="img/MRK-B3.webp" x="0" y="0" width="600" height="400" preserveAspectRatio="xMidYMid slice"/><rect x="0" y="400" width="600" height="46" fill="#FBF8F1"/><circle cx="24" cy="423.0" r="12" fill="none" stroke="#4A4D45" stroke-width="1.4"/><text x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4A4D45" class="pn-n">3</text><text class="lw lw-de" x="320.0" y="429.1" text-anchor="middle" font-family="sans-serif" font-size="17" font-style="italic" fill="#3B3D37">Mein Gott, mein Gott, wozu hast du mich verlassen?</text><text class="lw lw-gsw" x="320.0" y="429.1" text-anchor="middle" font-family="sans-serif" font-size="17" font-style="italic" fill="#3B3D37">Min Gott, min Gott, für was häsch du mich verlaa?</text></g></svg><svg class="ill-tile" data-span="1" data-scene="MRK-B4" x="612" y="458" width="600" height="446" viewBox="0 0 600 446"><defs><clipPath id="kc-MRK-B4"><rect width="600" height="446" rx="22"/></clipPath></defs><g clip-path="url(#kc-MRK-B4)"><rect width="600" height="446" fill="#FBF8F1"/><image href="img/MRK-B4.webp" x="0" y="0" width="600" height="400" preserveAspectRatio="xMidYMid slice"/><rect x="0" y="400" width="600" height="46" fill="#FBF8F1"/><circle cx="24" cy="423.0" r="12" fill="none" stroke="#4A4D45" stroke-width="1.4"/><text x="24" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4A4D45" class="pn-n">4</text><text class="lw lw-de" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">sie fürchteten sich nämlich</text><text class="lw lw-gsw" x="320.0" y="429.8" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#3B3D37">si händ sich nämli gfürchtet</text></g></svg></svg>
