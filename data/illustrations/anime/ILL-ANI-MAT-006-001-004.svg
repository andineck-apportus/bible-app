" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="96.2" y="128.8">Sie wollen von den Menschen gerühmt</tspan><tspan x="96.2" y="138.5">werden</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="96.2" y="128.8">Si wänd vo de Lüüt grüemt wärde</tspan></text></g><g class="dg-cell"><rect x="189.5" y="111.6" width="176.5" height="39.7" rx="4" fill="#FFF4D6" stroke="#3B3226" stroke-width="1.3"/><use href="#an-z-almosen" x="267.8" y="115.6" width="20.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="277.8" y="144.7">Dein Almosen bleibt im Verborgenen</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="277.8" y="144.7">Diis Almose bliibt im Verborgne</tspan></text></g><g class="dg-cell"><rect x="8.0" y="156.3" width="176.5" height="49.4" rx="4" fill="#EFE6D6" stroke="#3B3226" stroke-width="0.9"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="96.2" y="183.2">Sie haben ihren Lohn schon erhalten</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="96.2" y="183.2">Si händ ire Loon scho übercho</tspan></text></g><g class="dg-cell"><rect x="189.5" y="156.3" width="176.5" height="49.4" rx="4" fill="#FFF4D6" stroke="#3B3226" stroke-width="1.3"/><use href="#an-gott" x="267.8" y="160.3" width="20.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="277.8" y="189.3">Dein Vater, der ins Verborgene sieht,</tspan><tspan x="277.8" y="199.0">wird es dir vergelten</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-