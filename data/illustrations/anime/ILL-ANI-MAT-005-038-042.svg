<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 382 223.544"><svg class="ill-tile" data-span="1" x="0" y="0" width="194" height="171.26" viewBox="0 0 194 171.26"><g transform="translate(4 4)"><clipPath id="an-cp-mat-005-038-042-1"><polygon points="2,2 184,2 184,125.26 2,127.26"/></clipPath><g clip-path="url(#an-cp-mat-005-038-042-1)"><polygon points="2,2 184,2 184,125.26 2,127.26" fill="#F6EAD7"/><circle cx="38.0" cy="15.0" r="11.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#an-p-jesus" x="29.6" y="5.8" width="16.8" height="18.0"/><rect x="54.0" y="4" width="124.0" height="28.3" rx="7" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1"/><path d="M55.0 11L49.0 14L55.0 17" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1" stroke-linejoin="round"/><path d="M55.2 11.6V16.4" stroke="#FFFFFF" stroke-width="1.4"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="116.0" y="15.4">Ihr habt gehört … Ich</tspan><tspan x="116.0" y="25.5">aber sage euch …</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="116.0" y="15.4">Ir händ ghört … Ich aber</tspan><tspan x="116.0" y="25.5">säg eu …</tspan></text><rect x="8.0" y="38.3" width="77.5" height="23.9" rx="3" fill="#E3D4BA" stroke="#3B3226" stroke-width=".9"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="46.8" y="47.8">Ihr habt gehört</tspan><tspan x="46.8" y="56.8">…</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="46.8" y="47.8">Ir händ ghört …</tspan></text><rect x="100.5" y="38.3" width="77.5" height="23.9" rx="3" fill="#F2D9A0" stroke="#3B3226" stroke-width=".9"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="139.2" y="47.8">Ich aber sage</tspan><tspan x="139.2" y="56.8">euch …</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="139.2" y="47.8">Ich aber säg eu …</tspan></text><g class="dg-cell"><rect x="8.0" y="66.2" width="77.5" height="55.0" rx="4" fill="#EFE6D6" stroke="#3B3226" stroke-width="0.9"/><use href="#an-z-sehen" x="33.8" y="70.2" width="26.0" height="16"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="46.8" y="95.3">Auge um Auge</tspan><tspan x="46.8" y="105.0">und Zahn um</tspan><tspan x="46.8" y="114.6">Zahn.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="46.8" y="95.3">Aug um Aug und</tspan><tspan x="46.8" y="105.0">Zaa um Zaa.</tspan></text></g><g class="dg-cell"><rect x="100.5" y="66.2" width="77.5" height="55.0" rx="4" fill="#FFF4D6" stroke="#3B3226" stroke-width="1.3"/><use href="#an-z-frieden" x="125.0" y="70.2" width="28.4" height="16"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="139.2" y="95.3">Ihr sollt dem</tspan><tspan x="139.2" y="105.0">Bösen nicht</tspan><tspan x="139.2" y="114.6">widerstehen.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="139.2" y="95.3">Ir söled em</tspan><tspan x="139.2" y="105.0">Bööse nöd</tspan><tspan x="139.2" y="114.6">widerstaa.</tspan></text></g><path d="M88.0 93.7L102.0 93.7" stroke="#3B3226" stroke-width="1.4" stroke-linecap="round"/><path d="M97.6 96.1L102.0 93.7L97.6 91.3" fill="none" stroke="#3B3226" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></g><polygon points="2,2 184,2 184,125.26 2,127.26" fill="none" stroke="#2B211A" stroke-width="2.2" stroke-linejoin="round"/><circle cx="14" cy="14" r="8.5" fill="#FFFDF6" stroke="#2B211A" stroke-width="1.2"/><text x="14" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B211A">1</text><g transform="translate(0.0 131.26)"><g class="ill-words"><rect x="15.0" y="1.0" width="156.0" height="28" rx="3" fill="#FFF4D6" stroke="#3B3226" stroke-width="1"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#3B3226"><tspan x="93.0" y="11.5">Auge um Auge</tspan><tspan x="93.0" y="23.0">und Zahn um Zahn</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#3B3226"><tspan x="93.0" y="17.2">Aug um Aug und Zaa um Zaa</tspan></text></g></g></g></svg><svg class="ill-tile" data-span="1" x="188" y="0" width="194" height="223.544" viewBox="0 0 194 223.544"><g transform="translate(4 4)"><clipPath id="an-cp-mat-005-038-042-2"><polygon points="2,2 184,4 184,179.544 2,177.544"/></clipPath><g clip-path="url(#an-cp-mat-005-038-042-2)"><polygon points="2,2 184,4 184,179.544 2,177.544" fill="#F6EAD7"/><circle cx="38.0" cy="15.0" r="11.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#an-p-jesus" x="29.6" y="5.8" width="16.8" height="18.0"/><rect x="54.0" y="4" width="124.0" height="20.0" rx="7" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1"/><path d="M55.0 11L49.0 14L55.0 17" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1" stroke-linejoin="round"/><path d="M55.2 11.6V16.4" stroke="#FFFFFF" stroke-width="1.4"/><text text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="116.0" y="16.3">Sondern:</tspan></text><g class="dg-cell"><rect x="8.0" y="30.0" width="82.5" height="64.8" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="49.2" y="45.2">Wer dich auf die</tspan><tspan x="49.2" y="54.9">rechte Wange</tspan><tspan x="49.2" y="64.6">schlägt,</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="49.2" y="45.2">Wer dich uf de</tspan><tspan x="49.2" y="54.9">rächt Bagge</tspan><tspan x="49.2" y="64.6">schlaat,</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="49.2" y="75.2">dem halte auch die</tspan><tspan x="49.2" y="84.2">andere hin.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="49.2" y="75.2">däm heb au de</tspan><tspan x="49.2" y="84.2">ander ane.</tspan></text></g><g class="dg-cell"><rect x="95.5" y="30.0" width="82.5" height="64.8" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><use href="#an-mantel" x="121.5" y="34" width="30.4" height="16"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="136.8" y="59.1">Wer dein Hemd</tspan><tspan x="136.8" y="68.7">nehmen will,</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="136.8" y="59.1">Wer dis Hemd nää</tspan><tspan x="136.8" y="68.7">will,</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="136.8" y="79.4">dem lass auch den</tspan><tspan x="136.8" y="88.4">Mantel.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="136.8" y="79.4">däm la au de</tspan><tspan x="136.8" y="88.4">Mantel.</tspan></text></g><g class="dg-cell"><rect x="8.0" y="99.8" width="82.5" height="73.8" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><use href="#an-z-weg" x="37.2" y="107.9" width="24.0" height="16"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="49.2" y="133.0">Wer dich zwingt,</tspan><tspan x="49.2" y="142.6">eine Meile</tspan><tspan x="49.2" y="152.3">mitzugehen,</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="49.2" y="133.0">Wer dich zwingt,</tspan><tspan x="49.2" y="142.6">ei Meile mitzgaa,</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="49.2" y="163.0">mit dem geh zwei.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="49.2" y="163.0">mit däm gang zwei.</tspan></text></g><g class="dg-cell"><rect x="95.5" y="99.8" width="82.5" height="73.8" rx="4" fill="#EFE6D6" stroke="#3B3226" stroke-width="0.9"/><use href="#an-z-geben" x="125.5" y="103.8" width="22.4" height="16"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="136.8" y="128.8">Gib dem, der dich</tspan><tspan x="136.8" y="138.5">bittet,</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="136.8" y="128.8">Gib däm, wo dich</tspan><tspan x="136.8" y="138.5">bittet,</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#6B5E4B"><tspan x="136.8" y="149.2">und wende dich</tspan><tspan x="136.8" y="158.1">nicht ab von dem,</tspan><tspan x="136.8" y="167.1">der borgen will.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#6B5E4B"><tspan x="136.8" y="149.2">und cheer di nöd ab</tspan><tspan x="136.8" y="158.1">vo däm, wo öppis</tspan><tspan x="136.8" y="167.1">entlehne will.</tspan></text></g></g><polygon points="2,2 184,4 184,179.544 2,177.544" fill="none" stroke="#2B211A" stroke-width="2.2" stroke-linejoin="round"/><circle cx="14" cy="14" r="8.5" fill="#FFFDF6" stroke="#2B211A" stroke-width="1.2"/><text x="14" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B211A">2</text><g transform="translate(0.0 183.54399999999998)"><g class="ill-words"><rect x="32.9" y="1.0" width="120.2" height="28" rx="3" fill="#FFF4D6" stroke="#3B3226" stroke-width="1"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#3B3226"><tspan x="93.0" y="11.5">Ihr sollt dem Bösen</tspan><tspan x="93.0" y="23.0">nicht widerstehen</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#3B3226"><tspan x="93.0" y="11.5">Ir söled em Bööse</tspan><tspan x="93.0" y="23.0">nöd widerstaa</tspan></text></g></g></g></svg></svg>
