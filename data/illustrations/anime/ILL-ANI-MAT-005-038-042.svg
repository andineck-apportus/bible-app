-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="141.6" y="92.2">däm la au de Mantel.</tspan></text></g><g class="dg-cell"><rect x="189.5" y="34.0" width="85.8" height="78.5" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><use href="#an-meilenstein" x="223.6" y="42.5" width="17.6" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="232.4" y="71.5">Wer dich zwingt,</tspan><tspan x="232.4" y="81.2">eine Meile</tspan><tspan x="232.4" y="90.9">mitzugehen,</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="232.4" y="71.5">Wer dich zwingt,</tspan><tspan x="232.4" y="81.2">ei Meile mitzgaa,</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="232.4" y="101.5">mit dem geh zwei.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="232.4" y="101.5">mit däm gang zwei.</tspan></text></g><g class="dg-cell"><rect x="280.2" y="34.0" width="85.8" height="78.5" rx="4" fill="#EFE6D6" stroke="#3B3226" stroke-width="0.9"/><use href="#an-z-geben" x="309.0" y="38.4" width="28.3" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="323.1" y="67.4">Gib dem, der dich</tspan><tspan x="323.1" y="77.1">bittet,</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="323.1" y="67.4">Gib däm, wo dich</tspan><tspan x="323.1" y="77.1">bittet,</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#6B5E4B"><tspan x="323.1" y="87.7">und wende dich</tspan><tspan x="323.1" y="96.7"