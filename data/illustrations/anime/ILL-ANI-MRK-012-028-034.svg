href="#an-z-liebe" x="174.5" y="76.7" width="20.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="173.0" y="105.7">«Das erste ist: ‹Höre, Israel: Der Herr, unser Gott, der Herr ist einer;</tspan><tspan x="173.0" y="115.4">und du sollst den Herrn, deinen Gott, lieben mit deinem ganzen Herzen und</tspan><tspan x="173.0" y="125.1">mit deiner ganzen Seele und mit deinem ganzen Denken und mit deiner</tspan><tspan x="173.0" y="134.8">ganzen Kraft.›»</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="173.0" y="105.7">«S erscht isch: ‹Los, Israel: De Herr, üse Gott, de Herr isch eine; und du</tspan><tspan x="173.0" y="115.4">söllsch de Herr, din Gott, liebe mit dim ganze Härz und mit dinere ganze</tspan><tspan x="173.0" y="125.1">Seel und mit dim ganze Dänke und mit dinere ganze Chraft.›»</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#an-gott" x="118.1" y="80.3" width="53.4" height="53.4"/><use href="#an-z-liebe" x="174.5" y="80.3" width="53.4" height="53.4"/></g></g></g><path d="M337.5 103.0L343.0 107.0L337.5 111.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".9" stroke-linejoin="round"/><circle cx="19.0" cy="171.1" r="12.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#an-p-jesus" x="9.8" y="160.9" width="18.5" height="19.8"/><g class="dg-cell"><rect x="36.0" y="146.4" width="330.0" height="49.4" rx="4" fill="#FFF4D6" stroke="#3B3226" stroke-width="1.3"/><g class="dg-full"><use href="#an-p-mensch" x="182.5" y="150.4" width="14.1" height="20"/><use href="#an-z-liebe" x="199.5" y="150.4" width="20.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="201.0" y="179.4">«Das zweite ist dieses: ‹Du sollst deinen Nächsten lieben wie dich</tspan><tspan x="201.0" y="189.1">selbst.› Grösser als diese ist kein anderes Gebot.»</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="201.0" y="179.4">«S zweit isch das: ‹Du söllsch din Nächschte liebe wie di sälber.› Grösser</tspan><tspan x="201.0" y="189.1">als die isch kei anders Gebot.»</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#an-p-mensch" x="168.5" y="152.9" width="25.6" height="36.4"/><use href="#an-z-liebe" x="197.1" y="152.9" width="36.4" height="36.4"/></g></g></g><path d="M36.5 167.1L31.0 171.1L36.5 175.1" fill="#FFFDF6" stroke="#3B3226" stroke-width=".9" stroke-linejoin="round"/></g></g><polygon class="pn-frame" points="2,2 372,2 372,201.732 2,203.732" fill="none" stroke="#2B211A" stroke-width="2.2" stroke-linejoin="round"/><circle cx="14" cy="14" r="8.5" fill="#FFFDF6" stroke="#2B211A" stroke-width="1.2"/><text class="pn-n" x="14" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B211A">1</text><g transform="translate(94.0 207.732)"><g class="ill-words"><g class="dg-sw"><g class="dg-full"><rect x="6.9" y="1.0" width="172.3" height="28" rx="3" fill="#FFF4D6" stroke="#3B3226" stroke-width="1"/><use href="#an-p-mensch" x="10.9" y="9.0" width="8.4" height="12"/><use href="#an-z-liebe" x="22.3" y="9.0" width="12.0" height="12"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#3B3226"><tspan x="108.2" y="11.7">Du sollst deinen Nächsten</tspan><tspan x="108.2" y="22.6">lieben wie dich selbst</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#3B3226"><tspan x="108.2" y="11.7">Du söllsch din Nächschte</tspan><tspan x="108.2" y="22.6">liebe wie di sälber</tspan></text></g><g class="dg-nw" display="none"><rect x="6.9" y="1.0" width="172.3" height="28" rx="3" fill="#FFF4D6" stroke="#