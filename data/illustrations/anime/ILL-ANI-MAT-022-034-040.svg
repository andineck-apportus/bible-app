1. Du sollst den Herrn, deinen Gott,</tspan><tspan x="96.2" y="85.0">lieben mit deinem ganzen Herzen und</tspan><tspan x="96.2" y="94.7">mit deiner ganzen Seele und mit</tspan><tspan x="96.2" y="104.4">deinem ganzen Denken.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="96.2" y="75.3">1. Du söllsch de Herr, din Gott, liebe</tspan><tspan x="96.2" y="85.0">mit dim ganze Härz und mit dinere</tspan><tspan x="96.2" y="94.7">ganze Seel und mit dim ganze Dänke.</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="96.2" y="115.0">Das ist das grösste und erste Gebot.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="96.2" y="115.0">Das isch s gröscht und erscht Gebot.</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#an-gott" x="32.1" y="50.6" width="62.6" height="62.6"/><use href="#an-z-liebe" x="97.8" y="50.6" width="62.6" height="62.6"/></g></g></g><g class="dg-cell"><rect x="189.5" y="42.3" width="176.5" height="79.2" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#an-z-menschen" x="256.2" y="56.0" width="20.0" height="20"/><use href="#an-z-liebe" x="279.2" y="56.0" width="20.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="277.8" y="85.0">2. Du sollst deinen Nächsten lieben wie</tspan><tspan x="277.8" y="94.7">dich selbst.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="277.8" y="85.0">2. Du söllsch din Nächschte liebe wie</tspan><tspan x="277.8" y="94.7">di sälber.</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="277.8" y="105.4">Das zweite ist ihm gleich.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="277.8" y="105.4">S zweit isch ihm gliich.</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#an-z-menschen" x="213.6" y="50.6" width="62.6" height="62.6"/><use href="#an-z-liebe" x="279.2" y="50.6" width="62.6" height="62.6"/></g></g></g></g></g><polygon class="pn-frame" points="2,2 372,2 372,127.468 2,129.468" fill="none" stroke="#2B211A" stroke-width="2.2" stroke-linejoin="round"/><g transform="translate(94.0 133.468)"><g class="ill-words"><g class="dg-sw"><g class="dg-full"><rect x="26.9" y="1.0" width="132.2" height="28" rx="3" fill="#FFF4D6" stroke="#3B3226" stroke-width="1"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#3B3226"><tspan x="93.0" y="11.5">welches Gebot ist das</tspan><tspan x="93.0" y="23.0">grösste im Gesetz?</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#3B3226"><tspan x="93.0" y="11.5">weles Gebot isch s</tspan><tspan x="93.0" y="23.0">gröscht im Gsetz?</tspan></text></g><g class="dg-nw" display="none"><rect x="26.9" y="1.0" width="132.2" height="28" rx="3" fill="#FFF4D6" stroke="#3B3226" stroke-width="1"/><use href="#an-z-gebot" x="82.0" y="4.0" width="22.0" height="22"/></g></g></g></g></g></svg><svg class="ill-tile ill-narrow" data-span="1" x="402" y="0" width="194" height="260.08" viewBox="0 0 194 260.08"><g transform="translate(4 4)"><clipPath id="an-cp-mat-022-034-040-1n"><polygon points="2,2 184,2 184,214.08 2,216.08"/></clipPath><g clip-path="url(#an-cp-mat-022-034-040-1n)"><polygon points="2,2 184,2 184,214.08 2,216.08" fill="#F6EAD7"/><circle cx="38.0" cy="18.0" r="11.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><us