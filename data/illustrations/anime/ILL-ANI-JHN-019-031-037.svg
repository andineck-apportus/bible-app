6"><tspan x="96.2" y="77.1">«Kein Knochen von ihm wird</tspan><tspan x="96.2" y="86.7">zerbrochen werden.»</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="96.2" y="77.1">«Kei Chnoche vo ihm wird broche.»</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#an-schriftrolle" x="78.1" y="50.5" width="36.4" height="36.4"/></g></g></g><g class="dg-cell"><rect x="189.5" y="44.0" width="176.5" height="49.4" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#an-schriftrolle" x="256.2" y="48" width="20.0" height="20"/><use href="#an-z-sehen" x="279.2" y="48" width="20.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="277.8" y="77.1">«Sie werden auf den blicken, den sie</tspan><tspan x="277.8" y="86.7">durchbohrt haben.»</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="277.8" y="77.1">«Si wärded uf dä luege, wo si</tspan><tspan x="277.8" y="86.7">durchbohrt händ.»</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#an-schriftrolle" x="239.9" y="50.5" width="36.4" height="36.4"/><use href="#an-z-sehen" x="279.2" y="50.5" width="36.4" height="36.4"/></g></g></g><g class="dg-label"><rect x="7.5" y="102.1" width="72.2" height="8.8" rx="4.2" fill="#FFF8E8" stroke="#C9B48A" stroke-width=".5"/><text class="lw lw-de" x="10.0" y="108.4" text-anchor="start" font-family="sans-serif" font-size="7" font-weight="700" fill="#8A6A2A">Das geschah:</text><text class="lw lw-gsw" x="10.0" y="108.4" text-anchor="start" font-family="sans-serif" font-size="7" font-weight="700" fill="#8A6A2A">Das isch passiert:</text></g><g class="dg-cell"><rect x="8.0" y="111.4" width="176.5" height="50.1" rx="4" fill="#FFF4D6" stroke="#3B3226" stroke