ht="20"/><use href="#an-z-blut-wasser" x="129.9" y="147.9" width="24.6" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="136.8" y="176.9">Ein Soldat stiess</tspan><tspan x="136.8" y="186.6">ihm die Lanze in</tspan><tspan x="136.8" y="196.3">die Seite</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="136.8" y="176.9">En Soldat hät</tspan><tspan x="136.8" y="186.6">ihm d Lanze i d</tspan><tspan x="136.8" y="196.3">Siite gstoche</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#an-lanze" x="105.1" y="152.2" width="8.6" height="42.0"/><use href="#an-z-blut-wasser-d" x="116.7" y="152.2" width="51.7" height="42.0"/></g></g></g></g></g><polygon class="pn-frame" points="2,2 184,4 184,215.788 2,213.788" fill="none" stroke="#2B211A" stroke-width="2.2" stroke-linejoin="round"/><circle cx="14" cy="14" r="8.5" fill="#FFFDF6" stroke="#2B211A" stroke-width="1.2"/><text class="pn-n" x="14" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B211A">2</text></g></svg></svg>
