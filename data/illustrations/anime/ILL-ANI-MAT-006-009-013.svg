lle geschehe, wie</tspan><tspan x="308.0" y="86.7">im Himmel, so auch auf</tspan><tspan x="308.0" y="96.4">Erden</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="308.0" y="77.1">Diin Wile söll gschee, wie</tspan><tspan x="308.0" y="86.7">im Himel, eso au uf de</tspan><tspan x="308.0" y="96.4">Ärde</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#an-z-wille-gottes-d" x="281.4" y="51.1" width="53.3" height="44.9"/></g></g></g><g class="dg-label"><rect x="7.5" y="111.7" width="67.0" height="8.8" rx="4.2" fill="#FFF8E8" stroke="#C9B48A" stroke-width=".5"/><text class="lw lw-de" x="10.0" y="118.0" text-anchor="start" font-family="sans-serif" font-size="7" font-weight="700" fill="#8A6A2A">Bitten mit «uns»</text><text class="lw lw-gsw" x="10.0" y="118.0" text-anchor="start" font-family="sans-serif" font-size="7" font-weight="700" fill="#8A6A2A">Bitte mit «üs»</text></g><g class="dg-cell"><rect x="8.0" y="121.0" width="116.0" height="68.7" rx="4" fill="#FFF4D6" stroke="#3B3226" stroke-width="1.3"/><g class="dg-full"><use href="#an-brot" x="56.0" y="134.7" width="20.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="66.0" y="163.8">Unser tägliches Brot gib</tspan><tspan x="66.0" y="173.4">uns heute</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="66.0" y="163.8">Öises täglich Broot gib</tspan><tspan x="66.0" y="173.4">üs hüt</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#an-brot" x="39.3" y="128.7" width="53.4" height="53.4"/></g></g></g><g class="dg-cell"><rect x="129.0" y="121.0" width="116.0" height="68.7" rx="4" fill="#FFF4D6" stroke="#3B3226" stroke-width="1.3"/><g class="dg-full"><use href="#an-z-vergeben" x="175.0" y="125.0" width="24.