<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 382 223.732"><svg class="ill-tile" data-span="2" x="0" y="0" width="382" height="223.732" viewBox="0 0 382 223.732"><g transform="translate(4 4)"><clipPath id="an-cp-mat-006-009-013-1"><polygon points="2,2 372,2 372,189.732 2,191.732"/></clipPath><g clip-path="url(#an-cp-mat-006-009-013-1)"><polygon points="2,2 372,2 372,189.732 2,191.732" fill="#F6EAD7"/><circle cx="38.0" cy="15.0" r="11.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#an-p-jesus" x="29.6" y="5.8" width="16.8" height="18.0"/><rect x="54.0" y="4" width="312.0" height="20.0" rx="7" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1"/><path d="M55.0 11L49.0 14L55.0 17" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1" stroke-linejoin="round"/><path d="M55.2 11.6V16.4" stroke="#FFFFFF" stroke-width="1.4"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="210.0" y="16.3">So sollt ihr nun beten: Unser Vater in den Himmeln …</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="210.0" y="16.3">Eso söled ir also bätte: Öise Vatter i de Himel …</tspan></text><g class="dg-vis" data-visual="levels"><g class="dg-label"><rect x="7.5" y="30.7" width="69.5" height="8.8" rx="4.2" fill="#FFF8E8" stroke="#C9B48A" stroke-width=".5"/><text class="lw lw-de" x="10.0" y="37.0" text-anchor="start" font-family="sans-serif" font-size="7" font-weight="700" fill="#8A6A2A">Bitten mit «dein»</text><text class="lw lw-gsw" x="10.0" y="37.0" text-anchor="start" font-family="sans-serif" font-size="7" font-weight="700" fill="#8A6A2A">Bitte mit «diin»</text></g><g class="dg-cell"><rect x="8.0" y="40.0" width="116.0" height="59.0" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><use href="#an-z-name-gottes" x="54.7" y="48.8" width="22.7" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="66.0" y="77.9">Dein Name werde</tspan><tspan x="66.0" y="87.6">geheiligt</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="66.0" y="77.9">Diin Name söll gheiliget</tspan><tspan x="66.0" y="87.6">wärde</tspan></text></g><g class="dg-cell"><rect x="129.0" y="40.0" width="116.0" height="59.0" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><use href="#an-z-reich-gottes" x="176.3" y="53.7" width="21.4" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="187.0" y="82.7">Dein Reich komme</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="187.0" y="82.7">Diis Riich söll choo</tspan></text></g><g class="dg-cell"><rect x="250.0" y="40.0" width="116.0" height="59.0" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><use href="#an-z-wille-gottes" x="296.0" y="44" width="24.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="308.0" y="73.1">Dein Wille geschehe, wie</tspan><tspan x="308.0" y="82.7">im Himmel, so auch auf</tspan><tspan x="308.0" y="92.4">Erden</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="308.0" y="73.1">Diin Wile söll gschee, wie</tspan><tspan x="308.0" y="82.7">im Himel, eso au uf de</tspan><tspan x="308.0" y="92.4">Ärde</tspan></text></g><g class="dg-label"><rect x="7.5" y="107.7" width="67.0" height="8.8" rx="4.2" fill="#FFF8E8" stroke="#C9B48A" stroke-width=".5"/><text class="lw lw-de" x="10.0" y="114.0" text-anchor="start" font-family="sans-serif" font-size="7" font-weight="700" fill="#8A6A2A">Bitten mit «uns»</text><text class="lw lw-gsw" x="10.0" y="114.0" text-anchor="start" font-family="sans-serif" font-size="7" font-weight="700" fill="#8A6A2A">Bitte mit «üs»</text></g><g class="dg-cell"><rect x="8.0" y="117.0" width="116.0" height="68.7" rx="4" fill="#FFF4D6" stroke="#3B3226" stroke-width="1.3"/><use href="#an-brot" x="48.9" y="130.7" width="34.3" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="66.0" y="159.8">Unser tägliches Brot gib</tspan><tspan x="66.0" y="169.4">uns heute</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="66.0" y="159.8">Öises täglich Broot gib</tspan><tspan x="66.0" y="169.4">üs hüt</tspan></text></g><g class="dg-cell"><rect x="129.0" y="117.0" width="116.0" height="68.7" rx="4" fill="#FFF4D6" stroke="#3B3226" stroke-width="1.3"/><use href="#an-z-vergeben" x="174.9" y="121.0" width="24.3" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="187.0" y="150.1">Vergib uns unsere</tspan><tspan x="187.0" y="159.8">Schulden, wie auch wir</tspan><tspan x="187.0" y="169.4">unseren Schuldnern</tspan><tspan x="187.0" y="179.1">vergeben haben</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="187.0" y="150.1">Vergib üs öisi Schulde,</tspan><tspan x="187.0" y="159.8">wie au mir öisne</tspan><tspan x="187.0" y="169.4">Schuldner vergää händ</tspan></text></g><g class="dg-cell"><rect x="250.0" y="117.0" width="116.0" height="68.7" rx="4" fill="#FFF4D6" stroke="#3B3226" stroke-width="1.3"/><use href="#an-z-versuchung" x="287.6" y="125.9" width="14.7" height="20"/><use href="#an-z-boeses" x="305.3" y="125.9" width="23.1" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="308.0" y="154.9">Führe uns nicht in</tspan><tspan x="308.0" y="164.6">Versuchung, sondern</tspan><tspan x="308.0" y="174.3">rette uns vor dem Bösen</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="308.0" y="154.9">Füer üs nöd i d</tspan><tspan x="308.0" y="164.6">Versuechig, sondern</tspan><tspan x="308.0" y="174.3">rett üs vor em Bööse</tspan></text></g></g></g><polygon points="2,2 372,2 372,189.732 2,191.732" fill="none" stroke="#2B211A" stroke-width="2.2" stroke-linejoin="round"/><g transform="translate(94.0 195.73199999999997)"><g class="ill-words"><rect x="13.2" y="1.0" width="159.6" height="16" rx="3" fill="#FFF4D6" stroke="#3B3226" stroke-width="1"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#3B3226"><tspan x="93.0" y="11.2">Unser Vater in den Himmeln</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#3B3226"><tspan x="93.0" y="11.2">Öise Vatter i de Himel</tspan></text></g></g></g></svg><svg class="ill-tile ill-narrow" data-span="1" x="402" y="0" width="194" height="338.936" viewBox="0 0 194 338.936"><g transform="translate(4 4)"><clipPath id="an-cp-mat-006-009-013-1n"><polygon points="2,2 184,2 184,304.936 2,306.936"/></clipPath><g clip-path="url(#an-cp-mat-006-009-013-1n)"><polygon points="2,2 184,2 184,304.936 2,306.936" fill="#F6EAD7"/><circle cx="38.0" cy="15.0" r="11.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#an-p-jesus" x="29.6" y="5.8" width="16.8" height="18.0"/><rect x="54.0" y="4" width="124.0" height="38.4" rx="7" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1"/><path d="M55.0 11L49.0 14L55.0 17" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1" stroke-linejoin="round"/><path d="M55.2 11.6V16.4" stroke="#FFFFFF" stroke-widt