<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 382 179.732"><svg class="ill-tile" data-span="2" x="0" y="0" width="382" height="179.732" viewBox="0 0 382 179.732"><g transform="translate(4 4)"><clipPath id="an-cp-mat-006-009-013-1"><polygon points="2,2 372,2 372,145.732 2,147.732"/></clipPath><g clip-path="url(#an-cp-mat-006-009-013-1)"><polygon points="2,2 372,2 372,145.732 2,147.732" fill="#F6EAD7"/><circle cx="38.0" cy="15.0" r="11.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#an-p-jesus" x="29.6" y="5.8" width="16.8" height="18.0"/><rect x="54.0" y="4" width="312.0" height="20.0" rx="7" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1"/><path d="M55.0 11L49.0 14L55.0 17" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1" stroke-linejoin="round"/><path d="M55.2 11.6V16.4" stroke="#FFFFFF" stroke-width="1.4"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="210.0" y="16.3">So sollt ihr nun beten: Unser Vater in den Himmeln …</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="210.0" y="16.3">Eso söled ir also bätte: Öise Vatter i de Himel …</tspan></text><g class="dg-label"><rect x="7.5" y="30.7" width="69.5" height="8.8" rx="4.2" fill="#FFF8E8" stroke="#C9B48A" stroke-width=".5"/><text class="lw lw-de" x="10.0" y="37.0" text-anchor="start" font-family="sans-serif" font-size="7" font-weight="700" fill="#8A6A2A">Bitten mit «dein»</text><text class="lw lw-gsw" x="10.0" y="37.0" text-anchor="start" font-family="sans-serif" font-size="7" font-weight="700" fill="#8A6A2A">Bitte mit «diin»</text></g><g class="dg-cell"><rect x="8.0" y="40.0" width="116.0" height="37.0" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="66.0" y="55.9">Dein Name werde</tspan><tspan x="66.0" y="65.6">geheiligt</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="66.0" y="55.9">Diin Name söll gheiliget</tspan><tspan x="66.0" y="65.6">wärde</tspan></text></g><g class="dg-cell"><rect x="129.0" y="40.0" width="116.0" height="37.0" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="187.0" y="60.7">Dein Reich komme</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="187.0" y="60.7">Diis Riich söll choo</tspan></text></g><g class="dg-cell"><rect x="250.0" y="40.0" width="116.0" height="37.0" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="308.0" y="51.1">Dein Wille geschehe, wie</tspan><tspan x="308.0" y="60.7">im Himmel, so auch auf</tspan><tspan x="308.0" y="70.4">Erden</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="308.0" y="51.1">Diin Wile söll gschee, wie</tspan><tspan x="308.0" y="60.7">im Himel, eso au uf de</tspan><tspan x="308.0" y="70.4">Ärde</tspan></text></g><g class="dg-label"><rect x="7.5" y="85.7" width="67.0" height="8.8" rx="4.2" fill="#FFF8E8" stroke="#C9B48A" stroke-width=".5"/><text class="lw lw-de" x="10.0" y="92.0" text-anchor="start" font-family="sans-serif" font-size="7" font-weight="700" fill="#8A6A2A">Bitten mit «uns»</text><text class="lw lw-gsw" x="10.0" y="92.0" text-anchor="start" font-family="sans-serif" font-size="7" font-weight="700" fill="#8A6A2A">Bitte mit «üs»</text></g><g class="dg-cell"><rect x="8.0" y="95.0" width="116.0" height="46.7" rx="4" fill="#FFF4D6" stroke="#3B3226" stroke-width="1.3"/><use href="#an-brot" x="52.3" y="99.7" width="27.4" height="16"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="66.0" y="124.8">Unser tägliches Brot gib</tspan><tspan x="66.0" y="134.4">uns heute</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="66.0" y="124.8">Öises täglich Broot gib</tspan><tspan x="66.0" y="134.4">üs hüt</tspan></text></g><g class="dg-cell"><rect x="129.0" y="95.0" width="116.0" height="46.7" rx="4" fill="#FFF4D6" stroke="#3B3226" stroke-width="1.3"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="187.0" y="106.1">Vergib uns unsere</tspan><tspan x="187.0" y="115.8">Schulden, wie auch wir</tspan><tspan x="187.0" y="125.4">unseren Schuldnern</tspan><tspan x="187.0" y="135.1">vergeben haben</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="187.0" y="106.1">Vergib üs öisi Schulde,</tspan><tspan x="187.0" y="115.8">wie au mir öisne</tspan><tspan x="187.0" y="125.4">Schuldner vergää händ</tspan></text></g><g class="dg-cell"><rect x="250.0" y="95.0" width="116.0" height="46.7" rx="4" fill="#FFF4D6" stroke="#3B3226" stroke-width="1.3"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="308.0" y="110.9">Führe uns nicht in</tspan><tspan x="308.0" y="120.6">Versuchung, sondern</tspan><tspan x="308.0" y="130.3">rette uns vor dem Bösen</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="308.0" y="110.9">Füer üs nöd i d</tspan><tspan x="308.0" y="120.6">Versuechig, sondern</tspan><tspan x="308.0" y="130.3">rett üs vor em Bööse</tspan></text></g></g><polygon points="2,2 372,2 372,145.732 2,147.732" fill="none" stroke="#2B211A" stroke-width="2.2" stroke-linejoin="round"/><g transform="translate(94.0 151.73199999999997)"><g class="ill-words"><rect x="13.2" y="1.0" width="159.6" height="16" rx="3" fill="#FFF4D6" stroke="#3B3226" stroke-width="1"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#3B3226"><tspan x="93.0" y="11.2">Unser Vater in den Himmeln</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#3B3226"><tspan x="93.0" y="11.2">Öise Vatter i de Himel</tspan></text></g></g></g></svg><svg class="ill-tile ill-narrow" data-span="1" x="402" y="0" width="194" height="294.936" viewBox="0 0 194 294.936"><g transform="translate(4 4)"><clipPath id="an-cp-mat-006-009-013-1n"><polygon points="2,2 184,2 184,260.936 2,262.936"/></clipPath><g clip-path="url(#an-cp-mat-006-009-013-1n)"><polygon points="2,2 184,2 184,260.936 2,262.936" fill="#F6EAD7"/><circle cx="38.0" cy="15.0" r="11.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#an-p-jesus" x="29.6" y="5.8" width="16.8" height="18.0"/><rect x="54.0" y="4" width="124.0" height="38.4" rx="7" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1"/><path d="M55.0 11L49.0 14L55.0 17" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1" stroke-linejoin="round"/><path d="M55.2 11.6V16.4" stroke="#FFFFFF" stroke-width="1.4"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="116.0" y="15.4">So sollt ihr nun beten:</tspan><tspan x="116.0" y="25.5">Unser Vater in den</tspan><tspan x="116.0" y="35.7">Himmeln …</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="116.0" y="15.4">Eso söled ir also bätte:</tspan><tspan x="116.0" y="25.5">Öise