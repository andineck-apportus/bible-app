<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 382 407.144"><svg class="ill-tile" data-span="2" x="0" y="0" width="382" height="229.144" viewBox="0 0 382 229.144"><g transform="translate(4 4)"><clipPath id="an-cp-mat-018-010-014-1"><polygon points="2,2 372,2 372,183.144 2,185.144"/></clipPath><g clip-path="url(#an-cp-mat-018-010-014-1)"><polygon points="2,2 372,2 372,183.144 2,185.144" fill="#F6EAD7"/><circle cx="38.0" cy="18.0" r="11.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#an-p-jesus" x="29.6" y="8.8" width="16.8" height="18.0"/><g class="dg-sw"><rect x="54.0" y="8" width="312.0" height="28.3" rx="7" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1"/><path d="M55.0 15L49.0 18L55.0 21" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1" stroke-linejoin="round"/><path d="M55.2 15.6V20.4" stroke="#FFFFFF" stroke-width="1.4"/><g class="dg-full"><use href="#an-z-wille-gottes" x="58.0" y="15.1" width="16.6" height="14.0"/><use href="#an-p-kind" x="77.6" y="15.1" width="9.9" height="14.0"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="226.7" y="19.4">So ist es nicht der Wille eures Vaters in den Himmeln, dass</tspan><tspan x="226.7" y="29.5">eines dieser Kleinen verloren geht.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="226.7" y="19.4">Eso isch es nöd de Wile vo euem Vatter i de Himel, dass eis</tspan><tspan x="226.7" y="29.5">vo dene Chliine verlore gaat.</tspan></text></g><g class="dg-nw" display="none"><use href="#an-z-wille-gottes" x="189.3" y="12.0" width="24.1" height="20.3"/><use href="#an-p-kind" x="216.4" y="12.0" width="14.3" height="20.3"/></g></g><g class="dg-vis" data-visual="rings"><rect x="6" y="42.3" width="362.0" height="134.8" rx="10" fill="#FBEFD5" stroke="#3B3226" stroke-width="1.2"/><g class="dg-cell"><rect x="12.0" y="46.3" width="350.0" height="50.1" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#an-p-kind" x="167.7" y="50.3" width="14.1" height="20"/><use href="#an-p-g-engel-gruppe" x="184.7" y="50.3" width="21.6" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="187.0" y="79.3">Seht zu, dass ihr nicht einen dieser Kleinen verachtet!</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="187.0" y="79.3">Passed uf, dass ir nöd eine vo dene Chliine verachted!</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="187.0" y="90.0">Ihre Engel in den Himmeln sehen allezeit das Angesicht meines Vaters.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="187.0" y="90.0">Iri Ängel i de Himel gsehnd immer s Gsicht vo mim Vatter.</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#an-p-kind" x="152.4" y="52.8" width="26.1" height="37.1"/><use href="#an-p-g-engel-gruppe" x="181.5" y="52.8" width="40.1" height="37.1"/></g></g></g><g transform="translate(10 102.4)"><g class="dg-cell"><rect x="8.0" y="0.0" width="109.3" height="68.7" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#an-schaf" x="52.7" y="8.8" width="20.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="62.7" y="37.9">Ein Mensch hat</tspan><tspan x="62.7" y="47.6">hundert Schafe, und</tspan><tspan x="62.7" y="57.2">eines verirrt sich.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="62.7" y="37.9">En Mänsch hät hundert</tspan><tspan x="62.7" y="47.6">Schaf, und eis</tspan><tspan x="62.7" y="57.2">verlauft sich.</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#an-schaf" x="36.0" y="7.6" width="53.4" height="53.4"/></g></g></g><g class="dg-cell"><rect x="122.3" y="0.0" width="109.3" height="68.7" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#an-berg" x="155.5" y="4" width="20.0" height="20"/><use href="#an-z-suchen-finden" x="178.5" y="4" width="20.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="177.0" y="33.1">Er lässt die</tspan><tspan x="177.0" y="42.7">neunundneunzig auf</tspan><tspan x="177.0" y="52.4">den Bergen und sucht</tspan><tspan x="177.0" y="62.1">das verirrte.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="177.0" y="33.1">Er laat di nüünenüünzg</tspan><tspan x="177.0" y="42.7">uf de Bärge staa und</tspan><tspan x="177.0" y="52.4">suecht s verloffe.</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#an-berg" x="133.9" y="13.4" width="41.6" height="41.6"/><use href="#an-z-suchen-finden" x="178.5" y="13.4" width="41.6" height="41.6"/></g></g></g><g class="dg-cell"><rect x="236.7" y="0.0" width="109.3" height="68.7" rx="4" fill="#FFF4D6" stroke="#3B3226" stroke-width="1.3"/><g class="dg-full"><use href="#an-z-freude" x="281.3" y="8.8" width="20.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="291.3" y="37.9">Er freut sich über</tspan><tspan x="291.3" y="47.6">dieses mehr als über</tspan><tspan x="291.3" y="57.2">die neunundneunzig.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="291.3" y="37.9">Er fröit sich über das</tspan><tspan x="291.3" y="47.6">meh als über di</tspan><tspan x="291.3" y="57.2">nüünenüünzg.</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#an-z-freude" x="264.6" y="7.6" width="53.4" height="53.4"/></g></g></g></g></g></g><polygon class="pn-frame" points="2,2 372,2 372,183.144 2,185.144" fill="none" stroke="#2B211A" stroke-width="2.2" stroke-linejoin="round"/><circle cx="14" cy="14" r="8.5" fill="#FFFDF6" stroke="#2B211A" stroke-width="1.2"/><text class="pn-n" x="14" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B211A">1</text><g transform="translate(94.0 189.144)"><g class="ill-words"><g class="dg-sw"><g class="dg-full"><rect x="12.5" y="1.0" width="161.0" height="28" rx="3" fill="#FFF4D6" stroke="#3B3226" stroke-width="1"/><use href="#an-schaf" x="16.5" y="9.0" width="12.0" height="12"/><use href="#an-z-suchen-finden" x="31.5" y="9.0" width="12.0" height="12"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#3B3226"><tspan x="110.0" y="11.5">dass eines dieser</tspan><tspan x="110.0" y="23.0">Kleinen verloren geht</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#3B3226"><tspan x="110.0" y="11.5">dass eis vo dene</tspan><tspan x="110.0" y="23.0">Chliine verlore gaat</tspan></text></g><g class="dg-nw" display="none"><rect x="12.5" y="1.0" width="161.0" height="28" rx="3" fill="#FFF4D6" stroke="#3B3226" stroke-width="1"/><use href="#an-schaf" x="69.5" y="4.0" width="22.0" height="22"/><use href="#an-z-suchen-finden" x="94.5" y="4.0" width="22.0" height="22"/></g></g></g></g></g></svg><svg class="ill-tile ill-narrow" data-span="1" x="402" y="0" width="194" height="372.232" viewBox="0 0 194 372.232"><g transform="translate(4 4)"><clipPath id="an-cp-mat-018-010-014-1n"><polygon points="2,2 184,2 184,326.232 2,328.232"/></clipPath><g 