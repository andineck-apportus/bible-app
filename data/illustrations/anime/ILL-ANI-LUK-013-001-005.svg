.8" y="46.3" width="17.8" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="96.2" y="75.3">Die Galiläer</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="96.2" y="75.3">D Galiläer</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#6B5E4B"><tspan x="96.2" y="86.0">deren Blut Pilatus mit ihren Opfern</tspan><tspan x="96.2" y="95.0">vermischt hatte</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#6B5E4B"><tspan x="96.2" y="86.0">wo de Pilatus ires Bluet mit irne Opfer</tspan><tspan x="96.2" y="95.0">vermischt hät</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#an-z-toeten-d" x="45.7" y="49.4" width="58.1" height="45.0"/><use href="#an-altar-d" x="106.8" y="49.4" width="40.0" height="45.0"/></g></g></g><g class="dg-cell"><rect x="189.5" y="42.3" width="176.5" height="59.1" rx="4" fill="#EFE6D6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#an-z-umsturz" x="254.8" y="46.3" width="22.9" height="20"/><use href="#an-z-tod" x="280.7" y="46.3" width="20.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="277.8" y="75.3">Die achtzehn</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="277.8" y="75.3">Di achtzää</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#6B5E4B"><tspan x="277.8" y="86.0">auf die der Turm in Siloah stürzte und sie</tspan><tspan x="277.8" y="95.0">tötete</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#6B5E4B"><tspan x="277.8" y="86.0">wo de Turm z Siloah uf si gheit isch und si</tspan><tspan x="277.8" y="95.0">umbracht hät</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#an-z-umsturz-d" x="228.0" y="49.4" width="51.4" height="45.0"/><use href="#an-z-tod" x="282.5" y="49.4" width="45.0" height="45.0"/></g></g></g><g class="dg-cell"><rect x="8.0" y="106.4" width="358.0" height="39.7" rx="4" fill="#FFF4D6" stroke="#3B3226" stroke-width="1.3"/><g class="dg-full"><use href="#an-z-umkehr" x="173.9" y="110.4" width="26.2" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="187.0" y="139.5">Aber wenn ihr nicht umkehrt, werdet ihr alle ebenso umkommen.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="187.0" y="139.5">Aber wänn ir nöd umchered, gönd ir alli gliich zgrund.</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#an-z-umkehr" x="168.8" y="112.3" width="36.5" height="27.9"/></g></g></g></g></g><polygon class="pn-frame" points="2,2 372,2 372,152.084 2,154.084" fill="none" stroke="#2B211A" stroke-width="2.2" stroke-linejoin="round"/><g transform="translate(94.0 158.084)"><g class="ill-words"><g class="dg-sw"><g class="dg-full"><rect x="9.3" y="1.0" width="167.3" height="28" rx="3" fill="#FFF4D6" stroke="#3B3226" stroke-width="1"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#3B3226"><tspan x="93.0" y="12.0">aber wenn ihr nicht umkehrt,</tspan><tspan x="93.0" y="21.8">werdet ihr alle ebenso umkommen</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#3B3226"><tspan x="93.0" y="12.0">aber wänn ir nöd umchered,</tspan><tspan x="93.0" y="21.8">gönd ir al