 stroke-width="0.9"/><g class="dg-full"><use href="#an-muehlstein" x="41.5" y="56.4" width="20.0" height="20"/><use href="#an-tiefe" x="64.5" y="56.4" width="26.1" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="66.0" y="85.5">Wer einen dieser</tspan><tspan x="66.0" y="95.2">Kleinen, die an mich</tspan><tspan x="66.0" y="104.8">glauben, zu Fall bringt:</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="66.0" y="85.5">Wer eine vo dene Chliine,</tspan><tspan x="66.0" y="95.2">wo a mich glaubed, z Fall</tspan><tspan x="66.0" y="104.8">bringt:</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="66.0" y="115.5">Besser wäre ihm, mit einem</tspan><tspan x="66.0" y="124.5">grossen Mühlstein um den</tspan><tspan x="66.0" y="133.4">Hals in der Tiefe des Meeres</tspan><tspan x="66.0" y="142.4">versenkt zu werden.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="66.0" y="115.5">Besser wär ihm, mit eme</tspan><tspan x="66.0" y="124.5">grosse Mülistei um de Hals i</tspan><tspan x="66.0" y="133.4">de Tüüfi vom Meer versänkt</tspan><tspan x="66.0" y="142.4">z wärde.</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#an-muehlstein" x="20.1" y="81.0" width="38.6" height="38.6"/><use href="#an-tiefe-d" x="61.7" y="81.0" width="50.3" height="38.6"/></g></g></g><g class="dg-cell"><rect x="129.0" y="52.4" width="116.0" height="96.4" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#an-z-stolpern" x="158.9" y="56.4" width="33.3" height="20"/><use href="#an-z-gehenna" x="195.1" y="56.4" width="20.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="187.0" y="85.5">Wenn deine Hand oder</tspan><tspan x="187.0" y="95.2">dein Fuss dich zu Fall</tspan><tspan x="187.0" y="104.8">bringt:</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="187.0" y="85.5">Wänn dini Hand oder din</tspan><tspan x="187.0" y="95.2">Fuess dich z Fall bringt:</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="187.0" y="115.5">Besser verstümmelt oder</tspan><tspan x="187.0" y="124.5">lahm in das Leben, als mit</tspan><tspan x="187.0" y="133.4">zwei Händen oder zwei</tspan><tspan x="187.0" y="142.4">Füssen in das ewige Feuer.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="187.0" y="115.5">Besser verchrüpplet oder</tspan><tspan x="187.0" y="124.5">lahm is Läbe, als mit zwei</tspan><tspan x="187.0" y="133.4">Händ oder zwei Füess is</tspan><tspan x="187.0" y="142.4">ewig Füür.</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#an-z-stolpern" x="141.1" y="83.7" width="55.5" height="33.4"/><use href="#an-z-gehenna" x="199.6" y="83.7" width="33.4" height="33.4"/></g></g></g><g class="dg-cell"><rect x="250.0" y="52.4" width="116.0" height="96.4" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#an-z-auge" x="286.5" y="65.8" width="20.0" height="20"/><use href="#an-z-gehenna" x="309.5" y="65.8" width="20.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="308.0" y="94.8">Wenn dein Auge dich zu</tspan><tspan x="308.0" y="104.5">Fall bringt:</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="308.0" y="94.8">Wänn dis Aug dich z Fall</tspan><tspan x="308.0" y="104.5">bringt:</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="308.0" y="115.2">Besser einäugig in das</tspan><tspan x="308.0" y="124.1">Leben, als mit zwei Augen in</tspan><tspan x="308.0" y="133.1">die Hölle des Feuers.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="308.0" y="115.2">Besser mit eim Aug is Läbe,</tspan><tspan x="308.0" y="124.1">als mit zwei Auge i d Höll</tspan><tspan x="308.0" y="133.1">vom Füür.</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#an-z-auge" x="262.1" y="78.1" width="44.4" height="44.4"/><use href="#an-z-gehenna" x="309.5" y="78.1" width="44.4" height="44.4"/></g></g></g></g></g><polygon class="pn-frame" points="2,2 372,2 372,154.844 2,156.844" fill="none" stroke="#2B211A" stroke-width="2.2" stroke-linejoin="round"/><g transform="translate(94.0 160.844)"><g class="ill-words"><g class="dg-sw"><g class="dg-full"><rect x="9.1" y="1.0" width="167.8" height="28" rx="3" fill="#FFF4D6" stroke="#3B3226" stroke-width="1"/><use href="#an-z-stolpern" x="13.1" y="9.0" width="20.0" height="12"/><use href="#an-z-gericht" x="36.1" y="9.0" width="12.0" height="12"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.0" font-weight="700" fill="#3B3226"><tspan x="114.0" y="12.2">wehe dem Menschen, durch</tspan><tspan x="114.0" y="21.4">den der Fallstrick kommt!</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.0" font-weight="700" fill="#3B3226"><tspan x="114.0" y="12.2">wehe em Mänsch, wo de</tspan><tspan x="114.0" y="21.4">Fallstrick dur ihn chunnt!</tspan></text></g><g class="dg-nw" display="none"><rect x="9.1" y="1.0" width="167.8" height="28" rx="3" fill="#