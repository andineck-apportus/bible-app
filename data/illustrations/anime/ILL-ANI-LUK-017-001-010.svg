8" y="67.1">Wenn er umkehrt, vergib ihm – auch</tspan><tspan x="277.8" y="76.7">siebenmal am Tag</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="277.8" y="67.1">Wänn er umchert, vergib ihm – au</tspan><tspan x="277.8" y="76.7">sibemal am Tag</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#an-z-umkehr-d" x="230.6" y="40.5" width="47.6" height="36.4"/><use href="#an-z-vergeben" x="281.2" y="40.5" width="43.6" height="36.4"/></g></g></g><g class="dg-cell"><rect x="8.0" y="88.4" width="176.5" height="59.0" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#an-z-glauben" x="75.5" y="97.2" width="18.4" height="20"/><use href="#an-baum" x="97.0" y="97.2" width="20.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="96.2" y="126.2">«Gib uns mehr Glauben!» – Glauben wie</tspan><tspan x="96.2" y="135.9">ein Senfkorn</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="96.2" y="126.2">«Gib üs meh Glaube!» – Glaube wie es</tspan><tspan x="96.2" y="135.9">Sänfchorn</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#an-z-glauben-d" x="51.6" y="95.4" width="41.4" height="44.9"/><use href="#an-baum" x="96.0" y="95.4" width="44.9" height="44.9"/></g></g></g><g class="dg-cell"><rect x="189.5" y="88.4" width="176.5" height="59.0" rx="4" fill="#FFF4D6" stroke="#3B3226" stroke-width="1.3"/><g class="dg-full"><use href="#an-p-diener" x="259.2" y="92.4" width="14.1" height="20"/><use href="#an-z-demut" x="276.3" y="92.4" width="20.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="277.8" y="121.4">Wir sind unnütze Knechte; wir haben</tspan><tspan x="277.8" y="131.1">getan, was wir zu tun schuldig waren.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="277.8" y="121.4">Mir sind unnützi Chnächt; mir händ</tspan><tspan x="277.8" y="131.1">gmacht, was mir z mache schuldig gsii</tspan><tspan x="277.8" y="140.8">sind.</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#an-p-diener" x="238.0" y="95.4" width="31.6" height="44.9"/><use href="#an-z-demut" x="272.6" y="95.4" width="44.9" height="44.9"/></g></g></g></g></g><polygon class="pn-frame" points="2,2 372,2 372,153.38 2,155.38" fill="none" stroke="#2B211A" stroke-width="2.2" stroke-linejoin="round"/><g transform="translate(94.0 159.38)"><g class="ill-words"><g class="dg-sw"><g class="dg-full"><rect x="6.2" y="1.0" width="173.6" height="16" rx="3" fill="#FFF4D6" stroke="#3B3226" stroke-width="1"/><use href="#an-z-warnen" x="10.2" y="3.0" width="12.0" height="12"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#3B3226"><tspan x="102.5" y="11.2">Gebt acht auf euch selbst!</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#3B3226"><tspan x="102.5" y="11.2">Gänd acht uf eu sälber!</tspan></text></g><g class="dg-nw" display="none"><rect x="6.2" y="1.0" width="173.6" height="16" rx="3" fill="#FFF4D6" stroke="#3B3226" stroke-width="1"/><use href="#an-z-warnen" x="88.0" y="4.0" width="10.0" height="10"/></g></g></g></g></g></svg><svg class="ill-tile ill-narrow" data-span="1" x="402" y="0" width="194" height="235.76" viewBox="0 0 194 235.76"><g transform="translate(4 4)"><clipPath id="an-cp-luk-017-001-010-1n"><polygon points="2,2 184,2 184,201.76 2,203.76"/></clipPath><g clip-path="url(#an-cp-luk-017-001-010-1n)"><polygon points="2,2 184,2 184,201.76 2,203.76" fill="#F6EAD7"/><circle cx="38.0" cy="18.0" r="1