 y="113.8">gwüscht und</tspan><tspan x="232.1" y="123.4">gschmückt</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#an-z-fehlt-d" x="198.4" y="66.9" width="67.4" height="67.4"/></g></g></g><g class="dg-cell"><rect x="278.8" y="61.0" width="87.2" height="97.1" rx="4" fill="#EFE6D6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#an-z-unreiner-geist" x="312.4" y="65" width="20.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="322.4" y="94.1">Sieben andere</tspan><tspan x="322.4" y="103.7">Geister, böser als</tspan><tspan x="322.4" y="113.4">er, wohnen dort</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="322.4" y="94.1">Sibe anderi</tspan><tspan x="322.4" y="103.7">Geischter, böser</tspan><tspan x="322.4" y="113.4">als er, wohned</tspan><tspan x="322.4" y="123.1">dört</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#6B5E4B"><tspan x="322.4" y="133.7">am Ende schlimmer</tspan><tspan x="322.4" y="142.7">als am Anfang</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#6B5E4B"><tspan x="322.4" y="133.7">am Schluss</tspan><tspan x="322.4" y="142.7">schlimmer als am</tspan><tspan x="322.4" y="151.7">Aafang</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#an-z-unreiner-geist-d" x="288.7" y="75.9" width="67.4" height="67.4"/></g></g></g></g></g><polygon class="pn-frame" points="2,2 372,2 372,164.108 2,166.108" fill="none" stroke="#2B211A" stroke-width="2.2" stroke-linejoin="round"/><g transform="translate(94.0 170.108)"><g class="ill-words"><g class="dg-sw"><g class="dg-full"><rect x="13.8" y="1.0" width="158.4" height="16" rx="3" fill="#FFF4D6" stroke="#3B3226" stroke-w