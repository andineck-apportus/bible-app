"><rect x="8.0" y="50.0" width="116.0" height="59.0" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#an-p-menge-gruppe" x="55.2" y="58.8" width="21.6" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="66.0" y="87.9">Es sind einige von denen,</tspan><tspan x="66.0" y="97.6">die hier stehen,</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="66.0" y="87.9">Es git es paar vo dene,</tspan><tspan x="66.0" y="97.6">wo da stönd,</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#an-p-menge-gruppe" x="41.8" y="57.1" width="48.5" height="44.9"/></g></g></g><circle cx="187.0" cy="40.0" r="3" fill="#C08A2A" stroke="#3B3226" stroke-width=".8"/><path d="M187.0 43.0V50.0" stroke="#3B3226" stroke-width=".8"/><g class="dg-cell"><rect x="129.0" y="50.0" width="116.0" height="59.0" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#an-z-tod" x="165.5" y="58.8" width="20.0" height="20"/><use href="#an-z-nicht" x="188.5" y="58.8" width="20.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="187.0" y="87.9">die den Tod nicht</tspan><tspan x="187.0" y="97.6">schmecken werden,</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="187.0" y="87.9">wo de Tod nöd wärded</tspan><tspan x="187.0" y="97.6">schmöcke,</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#an-z-tod" x="141.1" y="57.3" width="44.4" height="44.4"/><use href="#an-z-nicht" x="188.5" y="57.3" width="44.4" height="44.4"/></g></g></g><circle cx="308.0" cy="40.0" r="3" fill="#C08A2A" stroke="#3B3226" stroke-width=".8"/><path d="M308.0 43.0V