<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 382 174.14"><svg class="ill-tile" data-span="2" x="0" y="0" width="382" height="174.14" viewBox="0 0 382 174.14"><g transform="translate(4 4)"><clipPath id="an-cp-mrk-004-021-025-1"><polygon points="2,2 372,2 372,128.14 2,130.14"/></clipPath><g clip-path="url(#an-cp-mrk-004-021-025-1)"><polygon points="2,2 372,2 372,128.14 2,130.14" fill="#F6EAD7"/><circle cx="38.0" cy="18.0" r="11.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#an-p-jesus" x="29.6" y="8.8" width="16.8" height="18.0"/><g class="dg-sw"><rect x="54.0" y="8" width="312.0" height="20.0" rx="7" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1"/><path d="M55.0 15L49.0 18L55.0 21" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1" stroke-linejoin="round"/><path d="M55.2 15.6V20.4" stroke="#FFFFFF" stroke-width="1.4"/><g class="dg-full"><use href="#an-z-hoeren" x="58.0" y="11.0" width="14.0" height="14"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="219.0" y="20.3">Wenn jemand Ohren hat, um zu hören, der höre!</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="219.0" y="20.3">Wänn öpper Ohre hät zum ghööre, söll er lose!</tspan></text></g><g class="dg-nw" display="none"><use href="#an-z-hoeren" x="204.0" y="12.0" width="12.0" height="12"/></g></g><g class="dg-vis" data-visual="grid"><g class="dg-cell"><rect x="8.0" y="34.0" width="176.5" height="88.1" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#an-leuchter" x="86.2" y="38" width="20.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="96.2" y="67.1">Kommt etwa die Lampe, damit sie</tspan><tspan x="96.2" y="76.7">unter den Scheffel gestellt wird?</tspan><tspan x="96.2" y="86.4">Nicht, damit sie auf den Leuchter</tspan><tspan x="96.2" y="96.1">gestellt wird?</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="96.2" y="67.1">Chunnt öppe d Lampe, demit me si</tspan><tspan x="96.2" y="76.7">under de Schäffel stellt? Nöd, demit</tspan><tspan x="96.2" y="86.4">me si uf de Lüüchter stellt?</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="96.2" y="106.7">Denn nichts ist verborgen, ausser um</tspan><tspan x="96.2" y="115.7">offenbar zu werden.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="96.2" y="106.7">Dänn nüüt isch verborge, usser demit s</tspan><tspan x="96.2" y="115.7">offebar wird.</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#an-leuchter" x="61.0" y="42.8" width="70.5" height="70.5"/></g></g></g><g class="dg-cell"><rect x="189.5" y="34.0" width="176.5" height="88.1" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#an-scheffel" x="254.6" y="38.4" width="23.4" height="20"/><use href="#an-z-geben" x="280.9" y="38.4" width="20.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="277.8" y="67.4">Mit welchem Mass ihr messt, wird</tspan><tspan x="277.8" y="77.1">euch gemessen werden, und euch wird</tspan><tspan x="277.8" y="86.8">noch hinzugefügt werden.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="277.8" y="67.4">Mit em Mass, wo er mässed, wird eu</tspan><tspan x="277.8" y="77.1">gmässe, und es wird eu no dezue ggää.</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="277.8" y="97.4">Denn wer hat, dem wird gegeben werden;</tspan><tspan x="277.8" y="106.4">und wer nicht hat, von dem wird auch das,</tspan><tspan x="277.8" y="115.4">was er hat, weggenommen werden.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="277.8" y="97.4">Dänn wer hät, dem wird ggää; und wer nöd</tspan><tspan x="277.8" y="106.4">hät, vo dem wird sogar das, won er hät,</tspan><tspan x="277.8" y="115.4">wäggnoo.</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#an-scheffel-d" x="206.1" y="45.7" width="75.6" height="64.6"/><use href="#an-z-geben" x="284.7" y="45.7" width="64.6" height="64.6"/></g></g></g></g></g><polygon class="pn-frame" points="2,2 372,2 372,128.14 2,130.14" fill="none" stroke="#2B211A" stroke-width="2.2" stroke-linejoin="round"/><g transform="translate(94.0 134.14)"><g class="ill-words"><g class="dg-sw"><g class="dg-full"><rect x="29.9" y="1.0" width="126.2" height="28" rx="3" fill="#FFF4D6" stroke="#3B3226" stroke-width="1"/><use href="#an-z-hoeren" x="33.9" y="9.0" width="12.0" height="12"/><use href="#an-z-warnen" x="48.9" y="9.0" width="12.0" height="12"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#3B3226"><tspan x="110.0" y="11.5">Achtet darauf,</tspan><tspan x="110.0" y="23.0">was ihr hört!</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#3B3226"><tspan x="110.0" y="11.5">Passed uf,</tspan><tspan x="110.0" y="23.0">was er ghöred!</tspan></text></g><g class="dg-nw" display="none"><rect x="29.9" y="1.0" width="126.2" height="28" rx="3" fill="#FFF4D6" stroke="#3B3226" stroke-width="1"/><use href="#an-z-hoeren" x="69.5" y="4.0" width="22.0" height="22"/><use href="#an-z-warnen" x="94.5" y="4.0" width="22.0" height="22"/></g></g></g></g></g></svg><svg class="ill-tile ill-narrow" data-span="1" x="402" y="0" width="194" height="285.096" viewBox="0 0 194 285.096"><g transform="translate(4 4)"><clipPath id="an-cp-mrk-004-021-025-1n"><polygon points="2,2 184,2 184,239.096 2,241.096"/></clipPath><g clip-path="url(#an-cp-mrk-004-021-025-1n)"><polygon points="2,2 184,2 184,239.096 2,241.096" fill="#F6EAD7"/><circle cx="38.0" cy="18.0" r="11.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#an-p-jesus" x="29.6" y="8.8" width="16.8" height="18.0"/><g class="dg-sw"><rect x="54.0" y="8" width="124.0" height="38.4" rx="7" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1"/><path d="M55.0 15L49.0 18L55.0 21" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1" stroke-linejoin="round"/><path d="M55.2 15.6V20.4" stroke="#FFFFFF" stroke-width="1.4"/><g class="dg-full"><use href="#an-z-hoeren" x="58.0" y="20.2" width="14.0" height="14"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="125.0" y="19.4">Wenn jemand Ohren</tspan><tspan x="125.0" y="29.5">hat, um zu hören, der</tspan><tspan x="125.0" y="39.7">höre!</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="125.0" y="19.4">Wänn öpper Ohre hät</tspan><tspan x="125.0" y="29.5">zum ghööre, söll er</tspan><tspan x="125.0" y="39.7">lose!</tspan></text></g><g class="dg-nw" display="none"><use href="#an-z-hoeren" x="100.8" y="12.0" width="30.4" height="30.4"/></g></g><g class="dg-vis" data-visual="grid"><g class="dg-cell"><rect x="8.0" y="52.4" width="82.5" height="180.7" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#an-leuchter" x="39.2" y="69.5" width="20.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="49.2" y="98.6">Kommt etwa die</tspan><tspan x="49.2" y="108.3">Lampe, damit sie</tspan><tspan x="49.2" y="117.9">unter den</tspan><tspan x="49.2" y="127.6">Scheffel</tspan><tspan x="49.2" y="137.3">gestellt wird?</tspan><tspan x="49.2" y="147.0">Nicht, damit sie</tspan><tspan x="49.2" y="156.6">auf den</tspan><tspan x="49.2" y="166.3">Leuchter</tspan><tspan x="49.2" y="176.0">gestellt wird?</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="49.2" y="98.6">Chunnt öppe d</tspan><tspan x="49.2" y="108.3">Lampe, demit me</tspan><tspan x="49.2" y="117.9">si under de</tspan><tspan x="49.2" y="127.6">Schäffel stellt?</tspan><tspan x="49.2" y="137.3">Nöd, demit me si</tspan><tspan x="49.2" y="147.0">uf de Lüüchter</tspan><tspan x="49.2" y="156.6">stellt?</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="49.2" y="186.7">Denn nichts ist</tspan><tspan x="49.2" y="195.6">verborgen, ausser</tspan><tspan x="49.2" y="204.6">um offenbar zu</tspan><tspan x="49.2" y="213.6">werden.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="49.2" y="186.7">Dänn nüüt isch</tspan><tspan x="49.2" y="195.6">verborge, usser</tspan><tspan x="49.2" y="204.6">demit s offebar</tspan><tspan x="49.2" y="213.6">wird.</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#an-leuchter" x="17.6" y="111.1" width="63.3" height="63.3"/></g></g></g><g class="dg-cell"><rect x="95.5" y="52.4" width="82.5" height="180.7" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#an-scheffel" x="113.6" y="56.4" width="23.4" height="20"/><use href="#an-z-geben" x="139.9" y="56.4" width="20.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="136.8" y="85.5">Mit welchem</tspan><tspan x="136.8" y="95.2">Mass ihr messt,</tspan><tspan x="136.8" y="104.8">wird euch</tspan><tspan x="136.8" y="114.5">gemessen</tspan><tspan x="136.8" y="124.2">werden, und</tspan><tspan x="136.8" y="133.9">euch wird noch</tspan><tspan x="136.8" y="143.6">hinzugefügt</tspan><tspan x="136.8" y="153.2">werden.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="136.8" y="85.5">Mit em Mass, wo</tspan><tspan x="136.8" y="95.2">er mässed, wird</tspan><tspan x="136.8" y="104.8">eu gmässe, und</tspan><tspan x="136.8" y="114.5">es wird eu no</tspan><tspan x="136.8" y="124.2">dezue ggää.</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="136.8" y="163.9">Denn wer hat, dem</tspan><tspan x="136.8" y="172.9">wird gegeben</tspan><tspan x="136.8" y="181.8">werden; und wer</tspan><tspan x="136.8" y="190.8">nicht hat, von dem</tspan><tspan x="136.8" y="199.8">wird auch das, was</tspan><tspan x="136.8" y="208.7">er hat,</tspan><tspan x="136.8" y="217.7">weggenommen</tspan><tspan x="136.8" y="226.7">werden.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="136.8" y="163.9">Dänn wer hät, dem</tspan><tspan x="136.8" y="172.9">wird ggää; und wer</tspan><tspan x="136.8" y="181.8">nöd hät, vo dem</tspan><tspan x="136.8" y="190.8">wird sogar das,</tspan><tspan x="136.8" y="199.8">won er hät,</tspan><tspan x="136.8" y="208.7">wäggnoo.</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#an-scheffel" x="105.1" y="128.3" width="32.6" height="27.9"/><use href="#an-z-geben" x="140.7" y="128.3" width="27.9" height="27.9"/></g></g></g></g></g><polygon class="pn-frame" points="2,2 184,2 184,239.096 2,241.096" fill="none" stroke="#2B211A" stroke-width="2.2" stroke-linejoin="round"/><g transform="translate(0.0 245.09599999999998)"><g class="ill-words"><g class="dg-sw"><g class="dg-full"><rect x="29.9" y="1.0" width="126.2" height="28" rx="3" fill="#FFF4D6" stroke="#3B3226" stroke-width="1"/><use href="#an-z-hoeren" x="33.9" y="9.0" width="12.0" height="12"/><use href="#an-z-warnen" x="48.9" y="9.0" width="12.0" height="12"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#3B3226"><tspan x="110.0" y="11.5">Achtet darauf,</tspan><tspan x="110.0" y="23.0">was ihr hört!</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#3B3226"><tspan x="110.0" y="11.5">Passed uf,</tspan><tspan x="110.0" y="23.0">was er ghöred!</tspan></text></g><g class="dg-nw" display="none"><rect x="29.9" y="1.0" width="126.2" height="28" rx="3" fill="#FFF4D6" stroke="#3B3226" stroke-width="1"/><use href="#an-z-hoeren" x="69.5" y="4.0" width="22.0" height="22"/><use href="#an-z-warnen" x="94.5" y="4.0" width="22.0" height="22"/></g></g></g></g></g></svg></svg>
