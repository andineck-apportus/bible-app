<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 382 225.704"><svg class="ill-tile" data-span="2" x="0" y="0" width="382" height="225.704" viewBox="0 0 382 225.704"><g transform="translate(4 4)"><clipPath id="an-cp-jhn-018-028-032-1"><polygon points="2,2 372,2 372,213.704 2,215.704"/></clipPath><g clip-path="url(#an-cp-jhn-018-028-032-1)"><polygon points="2,2 372,2 372,213.704 2,215.704" fill="#F6EAD7"/><g class="dg-sw"><rect x="28.0" y="8" width="338.0" height="20.0" rx="7" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1"/><g class="dg-full"><use href="#an-praetorium" x="32.0" y="11.0" width="14.0" height="14"/><use href="#an-z-nicht" x="49.0" y="11.0" width="14.0" height="14"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="214.5" y="20.3">Sie selbst gingen nicht ins Prätorium hinein</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="214.5" y="20.3">Si sälber sind nöd is Prätorium ine gange</tspan></text></g><g class="dg-nw" display="none"><use href="#an-praetorium" x="183.5" y="12.0" width="12.0" height="12"/><use href="#an-z-nicht" x="198.5" y="12.0" width="12.0" height="12"/></g></g><g class="dg-vis" data-visual="dialogue"><circle cx="19.0" cy="53.8" r="12.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#an-p-pilatus" x="9.8" y="43.7" width="18.5" height="19.8"/><g class="dg-cell"><rect x="36.0" y="34.0" width="330.0" height="39.7" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#an-z-frage" x="191.0" y="38" width="20.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="201.0" y="67.1">«Was für eine Anklage bringt ihr gegen diesen Menschen vor?»</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="201.0" y="67.1">«Was für e Aaklag bringed ir gäge dä Mänsch vor?»</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#an-z-frage" x="187.1" y="39.9" width="27.9" height="27.9"/></g></g></g><path d="M36.5 49.8L31.0 53.8L36.5 57.8" fill="#FFFDF6" stroke="#3B3226" stroke-width=".9" stroke-linejoin="round"/><circle cx="355.0" cy="98.5" r="12.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#an-p-menge-gruppe" x="345.8" y="88.4" width="18.5" height="19.8"/><g class="dg-cell"><rect x="8.0" y="78.7" width="330.0" height="39.7" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#an-z-boeses" x="143.4" y="82.7" width="22.9" height="20"/><use href="#an-z-ausliefern" x="169.3" y="82.7" width="33.3" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="173.0" y="111.7">«Wenn dieser nicht Böses täte, hätten wir ihn dir nicht ausgeliefert.»</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="173.0" y="111.7">«Wänn dä nöd Böses tät, hetted mir en dir nöd usgliferet.»</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#an-z-boeses" x="132.4" y="84.6" width="31.9" height="27.9"/><use href="#an-z-ausliefern" x="167.3" y="84.6" width="46.4" height="27.9"/></g></g></g><path d="M337.5 94.5L343.0 98.5L337.5 102.5" fill="#FFFDF6" stroke="#3B3226" stroke-width=".9" stroke-linejoin="round"/><circle cx="19.0" cy="143.2" r="12.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#an-p-pilatus" x="9.8" y="133.1" width="18.5" height="19.8"/><g class="dg-cell"><rect x="36.0" y="123.4" width="330.0" height="39.7" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#an-z-gericht" x="191.0" y="127.4" width="20.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="201.0" y="156.4">«Nehmt ihr ihn und richtet ihn nach eurem Gesetz!»</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="201.0" y="156.4">«Nämed ir en und richted en nach euem Gsetz!»</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#an-z-gericht" x="187.1" y="129.3" width="27.9" height="27.9"/></g></g></g><path d="M36.5 139.2L31.0 143.2L36.5 147.2" fill="#FFFDF6" stroke="#3B3226" stroke-width=".9" stroke-linejoin="round"/><circle cx="355.0" cy="187.9" r="12.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#an-p-menge-gruppe" x="345.8" y="177.7" width="18.5" height="19.8"/><g class="dg-cell"><rect x="8.0" y="168.0" width="330.0" height="39.7" rx="4" fill="#FFF4D6" stroke="#3B3226" stroke-width="1.3"/><g class="dg-full"><use href="#an-z-toeten" x="148.6" y="172.0" width="25.8" height="20"/><use href="#an-z-nicht" x="177.4" y="172.0" width="20.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="173.0" y="201.1">«Uns ist es nicht erlaubt, jemanden zu töten.»</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="173.0" y="201.1">«Mir dörfed niemer töte.»</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#an-z-toeten" x="139.6" y="173.9" width="36.0" height="27.9"/><use href="#an-z-nicht" x="178.6" y="173.9" width="27.9" height="27.9"/></g></g></g><path d="M337.5 183.9L343.0 187.9L337.5 191.9" fill="#FFFDF6" stroke="#3B3226" stroke-width=".9" stroke-linejoin="round"/></g></g><polygon class="pn-frame" points="2,2 372,2 372,213.704 2,215.704" fill="none" stroke="#2B211A" stroke-width="2.2" stroke-linejoin="round"/>