 y="103.3">aussen zwar schön</tspan><tspan x="308.0" y="113.0">aussehen,</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="308.0" y="84.0">6. Ir sind wie</tspan><tspan x="308.0" y="93.6">wiissgstricheni Greber,</tspan><tspan x="308.0" y="103.3">wo usse zwar schöön</tspan><tspan x="308.0" y="113.0">usgsehnd,</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="308.0" y="123.6">innen aber voll sind von</tspan><tspan x="308.0" y="132.6">Totengebeinen. So erscheint</tspan><tspan x="308.0" y="141.6">ihr aussen gerecht, innen</tspan><tspan x="308.0" y="150.6">aber seid ihr voll Heuchelei.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="308.0" y="123.6">inne aber voll sind vo</tspan><tspan x="308.0" y="132.6">Totechnoche. So gsehnd ir</tspan><tspan x="308.0" y="141.6">usse grächt us, inne aber</tspan><tspan x="308.0" y="150.6">sind ir voll Hüüchelei.</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#an-grab-getuencht-d" x="262.1" y="70.2" width="91.8" height="67.5"/></g></g></g></g></g><polygon class="pn-frame" points="2,2 372,2 372,171.6 2,173.6" fill="none" stroke="#2B211A" stroke-width="2.2" stroke-linejoin="round"/><g transform="translate(94.0 177.59999999999997)"><g class="ill-words"><g class="dg-sw"><g class="dg-full"><rect x="7.9" y="1.0" width="170.2" height="28" rx="3" fill="#FFF4D6" stroke="#3B3226" stroke-width="1"/><use href="#an-z-gerecht" x="11.9" y="9.0" width="12.0" height="12"/><use href="#an-z-erbarmen" x="26.9" y="9.0" width="12.0" height="12"/><use href="#an-z-treue" x="41.9" y="9.0" width="11.1" height="12"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.0" font-weight="700" fill="#3B3226"><tspan x="117.1" y="12.6">das 