<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 382 175"><svg class="ill-tile" data-span="2" x="0" y="0" width="382" height="175" viewBox="0 0 382 175"><g transform="translate(4 4)"><clipPath id="an-cp-jhn-016-001-004-1"><polygon points="2,2 372,2 372,163 2,165"/></clipPath><g clip-path="url(#an-cp-jhn-016-001-004-1)"><polygon points="2,2 372,2 372,163 2,165" fill="#F6EAD7"/><circle cx="38.0" cy="18.0" r="11.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#an-p-jesus" x="29.6" y="8.8" width="16.8" height="18.0"/><g class="dg-sw"><rect x="54.0" y="8" width="312.0" height="28.3" rx="7" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1"/><path d="M55.0 15L49.0 18L55.0 21" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1" stroke-linejoin="round"/><path d="M55.2 15.6V20.4" stroke="#FFFFFF" stroke-width="1.4"/><g class="dg-full"><use href="#an-z-stolpern" x="58.0" y="15.1" width="23.3" height="14"/><use href="#an-z-nicht" x="84.3" y="15.1" width="14.0" height="14"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="232.1" y="19.4">Das habe ich zu euch gesagt, damit ihr nicht zu Fall</tspan><tspan x="232.1" y="29.5">kommt.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="232.1" y="19.4">Das han ich eu gseit, demit ir nöd z Fall chömed.</tspan></text></g><g class="dg-nw" display="none"><use href="#an-z-stolpern" x="181.5" y="12.0" width="33.8" height="20.3"/><use href="#an-z-nicht" x="218.2" y="12.0" width="20.3" height="20.3"/></g></g><g class="dg-vis" data-visual="rings"><rect x="6" y="42.3" width="362.0" height="114.7" rx="10" fill="#FBEFD5" stroke="#3B3226" stroke-width="1.2"/><g class="dg-cell"><rect x="12.0" y="46.3" width="350.0" height="39.7" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#an-z-erinnern" x="177.0" y="50.3" width="20.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="187.0" y="79.3">Damit ihr euch erinnert, dass ich es euch gesagt habe</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="187.0" y="79.3">Demit ir dra dänked, dass ich s eu gseit han</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#an-z-erinnern" x="173.1" y="52.2" width="27.9" height="27.9"/></g></g></g><g transform="translate(10 92.0)"><g class="dg-cell"><rect x="8.0" y="0.0" width="109.3" height="59.0" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#an-z-ausschluss" x="52.7" y="4" width="20.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="62.7" y="33.1">Aus der Synagoge</tspan><tspan x="62.7" y="42.7">werden sie euch</tspan><tspan x="62.7" y="52.4">ausschliessen</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="62.7" y="33.1">Us de Synagoge wärded</tspan><tspan x="62.7" y="42.7">si eu usschlüüsse</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#an-z-ausschluss" x="40.2" y="7.1" width="44.9" height="44.9"/></g></g></g><g class="dg-cell"><rect x="122.3" y="0.0" width="109.3" height="59.0" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#an-z-toeten" x="164.1" y="8.8" width="25.8" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="177.0" y="37.9">Wer euch tötet, wird</tspan><tspan x="177.0" y="47.6">meinen, Gott zu dienen</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="177.0" y="37.9">Wer eu tötet, wird</tspan><tspan x="177.0" y="47.6">meine, er dieni Gott</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#an-z-toeten-d" x="148.0" y="7.1" width="58.0" height="44.9"/></g></g></g><g class="dg-cell"><rect x="236.7" y="0.0" width="109.3" height="59.0" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#an-gott" x="272.8" y="4" width="20.0" height="20"/><use href="#an-p-jesus" x="295.8" y="4" width="14.1" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="291.3" y="33.1">weil sie weder den</tspan><tspan x="291.3" y="42.7">Vater noch mich</tspan><tspan x="291.3" y="52.4">erkannt haben</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="291.3" y="33.1">wil si weder de Vatter</tspan><tspan x="291.3" y="42.7">no mich erchännt händ</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#an-gott" x="251.6" y="7.1" width="44.9" height="44.9"/><use href="#an-p-jesus" x="299.5" y="7.1" width="31.6" height="44.9"/></g></g></g></g></g></g><polygon class="pn-frame" points="2,2 372,2 372,163 2,165" fill="none" stroke="#2B211A" stroke-width="2.2" stroke-linejoin="round"/></g></svg><svg class="ill-tile ill-narrow" data-span="1" x="402" y="0" width="194" height="278.676" viewBox="0 0 194 278.676"><g transform="translate(4 4)"><clipPath id="an-cp-jhn-016-001-004-1n"><polygon points="2,2 184,2 184,266.676 2,268.676"/></clipPath><g clip-path="url(#an-cp-jhn-016-001-004-1n)"><polygon points="2,2 184,2 184,266.676 2,268.676" fill="#F6EAD7"/><circle cx="38.0" cy="18.0" r="11.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#an-p-jesus" x="29.6" y="8.8" width="16.8" height="18.0"/><g class="dg-sw"><rect x="54.0" y="8" width="124.0" height="48.6" 