<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 382 197.024"><svg class="ill-tile" data-span="2" x="0" y="0" width="382" height="197.024" viewBox="0 0 382 197.024"><g transform="translate(4 4)"><clipPath id="an-cp-mat-006-016-018-1"><polygon points="2,2 372,2 372,163.024 2,165.024"/></clipPath><g clip-path="url(#an-cp-mat-006-016-018-1)"><polygon points="2,2 372,2 372,163.024 2,165.024" fill="#F6EAD7"/><circle cx="38.0" cy="15.0" r="11.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#an-p-jesus" x="29.6" y="5.8" width="16.8" height="18.0"/><rect x="54.0" y="4" width="312.0" height="20.0" rx="7" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1"/><path d="M55.0 11L49.0 14L55.0 17" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1" stroke-linejoin="round"/><path d="M55.2 11.6V16.4" stroke="#FFFFFF" stroke-width="1.4"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="210.0" y="16.3">Wenn ihr fastet, macht kein düsteres Gesicht wie die Heuchler!</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="210.0" y="16.3">Wänn ir faschted, mached kei finschters Gsicht wie d Hüüchler!</tspan></text><rect x="8.0" y="30.0" width="176.5" height="15.0" rx="3" fill="#E3D4BA" stroke="#3B3226" stroke-width=".9"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="96.2" y="39.5">die Heuchler</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="96.2" y="39.5">d Hüüchler</tspan></text><rect x="189.5" y="30.0" width="176.5" height="15.0" rx="3" fill="#F2D9A0" stroke="#3B3226" stroke-width=".9"/><text text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="277.8" y="39.5">du aber</tspan></text><g class="dg-cell"><rect x="8.0" y="49.0" width="176.5" height="27.4" rx="4" fill="#EFE6D6" stroke="#3B3226" stroke-width="0.9"/><circle cx="20.0" cy="62.6" r="10.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#an-p-heuchler" x="12.4" y="54.4" width="15.1" height="16.2"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="106.2" y="60.0">Sie machen ihr Gesicht</tspan><tspan x="106.2" y="69.7">unkenntlich</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="106.2" y="60.0">Si mached ires Gsicht unkänntlich</tspan></text></g><g class="dg-cell"><rect x="189.5" y="49.0" width="176.5" height="27.4" rx="4" fill="#FFF4D6" stroke="#3B3226" stroke-width="1.3"/><circle cx="201.5" cy="62.6" r="10.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#an-p-juenger" x="193.9" y="54.4" width="15.1" height="16.2"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="287.8" y="60.0">Salbe deinen Kopf und wasche dein</tspan><tspan x="287.8" y="69.7">Gesicht</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="287.8" y="60.0">Salb diin Chopf und wäsch diis</tspan><tspan x="287.8" y="69.7">Gsicht</tspan></text></g><g class="dg-cell"><rect x="8.0" y="81.3" width="176.5" height="27.4" rx="4" fill="#EFE6D6" stroke="#3B3226" stroke-width="0.9"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="96.2" y="92.4">Die Menschen sollen sehen, dass sie</tspan><tspan x="96.2" y="102.0">fasten</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="96.2" y="92.4">D Lüüt söled gseh, dass si faschted</tspan></text></g><g class="dg-cell"><rect x="189.5" y="81.3" width="176.5" height="27.4" rx="4" fill="#FFF4D6" stroke="#3B3226" stroke-width="1.3"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="277.8" y="92.4">Nicht die Menschen sollen es sehen,</tspan><tspan x="277.8" y="102.0">sondern dein Vater im Verborgenen</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="277.8" y="92.4">Nöd d Lüüt söled s gseh, sondern diin</tspan><tspan x="277.8" y="102.0">Vatter im Verborgne</tspan></text></g><g class="dg-cell"><rect x="8.0" y="113.7" width="176.5" height="45.4" rx="4" fill="#EFE6D6" stroke="#3B3226" stroke-width="0.9"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="96.2" y="138.6">Sie haben ihren Lohn schon erhalten</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="96.2" y="138.6">Si händ ire Loon scho übercho</tspan></text></g><g class="dg-cell"><rect x="189.5" y="113.7" width="176.5" height="45.4" rx="4" fill="#FFF4D6" stroke="#3B3226" stroke-width="1.3"/><use href="#an-gott" x="269.8" y="117.7" width="16.0" height="16"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="277.8" y="142.7">Dein Vater, der ins Verborgene sieht,</tspan><tspan x="277.8" y="152.4">wird es dir vergelten</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="277.8" y="142.7">Diin Vatter, wo is Verborgne gseht,</tspan><tspan x="277.8" y="152.4">wird s dir vergälte</tspan></text></g></g><polygon points="2,2 372,2 372,163.024 2,165.024" fill="none" stroke="#2B211A" stroke-width