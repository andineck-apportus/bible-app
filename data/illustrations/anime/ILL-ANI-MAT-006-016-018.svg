><g class="dg-cell"><rect x="8.0" y="49.0" width="176.5" height="45.4" rx="4" fill="#EFE6D6" stroke="#3B3226" stroke-width="0.9"/><circle cx="20.0" cy="71.6" r="10.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#an-p-heuchler" x="12.4" y="63.4" width="15.1" height="16.2"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="106.2" y="69.0">Sie machen ihr Gesicht</tspan><tspan x="106.2" y="78.7">unkenntlich</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="106.2" y="69.0">Si mached ires Gsicht unkänntlich</tspan></text></g><g class="dg-cell"><rect x="189.5" y="49.0" width="176.5" height="45.4" rx="4" fill="#FFF4D6" stroke="#3B3226" stroke-width="1.3"/><circle cx="201.5" cy="71.6" r="10.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#an-p-juenger" x="193.9" y="63.4" width="15.1" height="16.2"/><use href="#an-oelgefaess" x="271.4" y="53.0" width="12.3" height="16"/><use href="#an-z-waschen" x="286.7" y="53.0" width="17.3" height="16"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="287.8" y="78.0">Salbe deinen Kopf und wasche dein</tspan><tspan x="287.8" y="87.7">Gesicht</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="287.8" y="78.0">Salb diin Chopf und wäsch diis</tspan><tspan x="287.8" y="87.7">Gsicht</tspan></text></g><g class="dg-cell"><rect x="8.0" y="99.3" width="176.5" height="45.4" rx="4" fill="#EFE6D6" stroke="#3B3226" stroke-width="0.9"/><use href="#an-z-sehen" x="72.0" y="103.3" width="26.0" height="16"/><use href="#an-z-fasten" x="101.0" y="103.3" width="19.6" height="16"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="96.2" y="128.4">Die Menschen sollen sehen, dass sie</tspan><tspan x="96.2" y="138.0">fasten</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="96.2" y="128.4">D Lüüt söled gseh, dass si faschted</tspan></text></g><g class="dg-cell"><rect x="189.5" y="99.3" width="176.5" height="45.4" rx="4" fill="#FFF4D6" stroke="#3B3226" stroke-width="1.3"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="277.8" y="119.4">Nicht die Menschen sollen es sehen,</tspan><tspan x="277.8" y="129.0">sondern dein Vater im Verborgenen</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="277.8" y="119.4">Nöd d Lüüt söled s gseh, sondern diin</tspan><tspan x="277.8" y="129.0">Vatter im Verborgne</tspan></text></g><g class="dg-cell"><rect x="8.0" y="149.7" width="176.5" height="45.4" rx="4" fill="#EFE6D6" stroke="#3B3226" stroke-width="0.9"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="96.2" y="174.6">Sie haben ihren Lohn schon erhalten</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="96.2" y="174.6">Si händ ire Loon scho übercho</tspan></text></g><g class="dg-cell"><rect x="189.5" y="149.7" width="176.5" height="45.4" rx="4" fill="#FFF4D6" stroke="#3B3226" stroke-width="1.3"/><use href="#an-gott" x="269.8" y="153.7" width="16.0" height="16"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="277.8" y="178.7">Dein Vater, der ins Verborgene sieht,</tspan><tspan x="277.8" y="188.4">wird es dir vergelten</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="277.8" y="178.7">Diin Vatter, wo is Verborgne gseht,</tspan><tspan x="277.8" y="188.4">wird s dir vergälte</tspan></text></g></g><polygon points="2,2 372,2 372,199.024 2,201.024" fill="none" stroke="#2B211A" stroke-width="2.2" stroke-linejoin="round"/><g transform="translate(94.0 205.024)"><g class="ill-words"><rect x="25.7" y="1.0" width="134.6" height="16" rx="3" fill="#FFF4D6" stroke="#3B3226" stroke-width="1"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#3B3226"><tspan x="93.0" y="11.2">Wenn ihr aber fastet</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#3B3226"><tspan x="93.0" y="11.2">Wänn ir aber faschted</tspan></text></g></g></g></svg><svg class="ill-tile ill-narrow" data-span="1" x="402" y="0" width="194" height="310.876" viewBox="0 0 194 310.876"><g transform="translate(4 4)"><clipPath id="an-cp-mat-006-016-018-1n"><polygon points="2,2 184,2 184,276.876 2,278.876"/></clipPath><g clip-path="url(#an-cp-mat-006-016-018-1n)"><polygon points="2,2 184,2 184,276.876 2,278.876" fill="#F6EAD7"/><circle cx="38.0" cy="15.0" r="11.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#an-p-jesus" x="29.6" y="5.8" width="16.8" height="18.0"/><rect x="54.0" y="4" width="124.0" height="38.4" rx="7" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1"/><path d="M55.0 11L49.0 14L55.0 17" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1" stroke-linejoin="round"/><path d="M55.2 11.6V16.4" stroke="#FFFFFF" stroke-width="1.4"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="116.0" y="15.4">Wenn ihr fastet, macht</tspan><tspan x="116.0" y="25.5">kein düsteres Gesicht</tspan><tspan x="116.0" y="35.7">wie die Heuchler!</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-famil