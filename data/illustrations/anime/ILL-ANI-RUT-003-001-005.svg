g</tspan></text><use href="#an-p-boas" x="19.0" y="65.6" width="14.1" height="20"/><use href="#an-tenne" x="36.0" y="65.6" width="38.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="46.5" y="94.7">Boas worfelt</tspan><tspan x="46.5" y="104.3">heute Nacht</tspan><tspan x="46.5" y="114.0">auf der Tenne.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="46.5" y="94.7">De Boas</tspan><tspan x="46.5" y="104.3">worflet hüt</tspan><tspan x="46.5" y="114.0">znacht uf de</tspan><tspan x="46.5" y="123.7">Tänn.</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#an-p-boas" x="17.2" y="80.3" width="15.1" height="21.4"/><use href="#an-tenne" x="35.2" y="80.3" width="40.7" height="21.4"/></g><g class="nw1"><use href="#an-p-boas" x="17.2" y="63.4" width="15.4" height="21.8"/><use href="#an-tenne" x="35.5" y="63.4" width="41.5" height="21.8"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="46.5" y="107.9">B. w. h. N. a. d.</tspan><tspan x="46.5" y="116.9">T.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="46.5" y="107.9">D. B. w. h. z. u.</tspan><tspan x="46.5" y="116.9">d. T.</tspan></text></g></g></g><g class="dg-cell"><rect x="101.0" y="52.4" width="77.0" height="77.9" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9" stroke-dasharray="3 2"/><g class="dg-full"><text text-anchor="middle" font-family="sans-serif" font-size="6.5" font-weight="700" fill="#8A6A2A"><tspan x="139.5" y="62.0">Schritt 1</tspan></text><use href="#an-z-waschen" x="109.6" y="65.6" width="18.8" height="20"/><use href="#an-tenne" x="131.4" y="65.6" width="38.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="139.5" y="94.7">Wasch dich,</tspan><tspan x="139.5" y="104.3">zieh dich an,</tspan><tspan x="139.5" y="114.0">geh hinab zur</tspan><tspan x="139.5" y="123.7">Tenne!</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="139.5" y="94.7">Wäsch dich, leg</tspan><tspan x="139.5" y="104.3">dich aa, gang</tspan><tspan x="139.5" y="114.0">abe uf d Tänn!</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#an-z-waschen" x="110.2" y="81.2" width="18.4" height="19.6"/><use href="#an-tenne" x="131.6" y="81.2" width="37.3" height="19.6"/></g><g class="nw1"><use href="#an-z-waschen" x="110.2" y="63.4" width="18.8" height="20.1"/><use href="#an-tenne" x="132.0" y="63.4" width="38.2" height="20.1"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="139.5" y="107.9">W. d. z. d. a. g.</tspan><tspan x="139.5" y="116.9">h. z. T.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="139.5" y="107.9">W. d. l. d. a. g. a.</tspan><tspan x="139.5" y="116.9">u. d. T.</tspan></text></g></g></g><g class="dg-cell"><rect x="8.0" y="148.3" width="77.0" height="65.5" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9" stroke-dasharray="3 2"/><g class="dg-full"><text text-anchor="middle" font-family="sans-serif" font-size="6.5" font-weight="700" fill="#8A6A2A"><tspan x="46.5" y="157.9">Schritt 2</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="46.5" y="168.5">Wenn er sich</tspan><tspan x="46.5" y="178.2">hinlegt: Deck</tspan><tspan x="46.5" y="187.9">seine Füsse auf</tspan><tspan x="46.5" y="197.6">und leg dich</tspan><tspan x="46.5" y="207.2">hin!</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="46.5" y="168.5">Wänn er sich</tspan><tspan x="46.5" y="178.2">häreleit: Deck</tspan><tspan x="46.5" y="187.9">sini Füess uf</tspan><tspan x="46.5" y="197.6">und leg dich</tspan><tspan x="46.5" y="207.2">ane!</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="46.5" y="178.5">W. e. s. h. D. s.</tspan><tspan x="46.5" y="188.1">F. a. u. l. d. h.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="46.5" y="178.5">W. e. s. h. D. s.</tspan><tspan x="46.5" y="188.1">F. u. u. l. d. a.</tspan></text></g></g></g><g class="dg-cell"><rect x="101.0" y="148.3" width="77.0" height="65.5" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9" stroke-dasharray="3 2"/><g class="dg-full"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="6.5" font-weight="700" fill="#8A6A2A"><tspan x="139.5" y="167.6">dann</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="6.5" font-weight="700" fill="#8A6A2A"><tspan x="139.5" y="167.6">dänn</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="139.5" y="178.2">Er wird dir</tspan><tspan x="139.5" y="187.9">sagen, was du</tspan><tspan x="139.5" y="197.6">tun sollst.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="139.5" y="178.2">Er wird dir</tspan><tspan x="139.5" y="187.9">säge, was du</tspan><tspan x="139.5" y="197.6">mache söllsch.</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><text class="lw lw-de" text-an