<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 382 154.08"><svg class="ill-tile" data-span="2" x="0" y="0" width="382" height="154.08" viewBox="0 0 382 154.08"><g transform="translate(4 4)"><clipPath id="an-cp-luk-013-018-021-1"><polygon points="2,2 372,2 372,108.08 2,110.08"/></clipPath><g clip-path="url(#an-cp-luk-013-018-021-1)"><polygon points="2,2 372,2 372,108.08 2,110.08" fill="#F6EAD7"/><circle cx="38.0" cy="18.0" r="11.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#an-p-jesus" x="29.6" y="8.8" width="16.8" height="18.0"/><g class="dg-sw"><rect x="54.0" y="8" width="312.0" height="20.0" rx="7" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1"/><path d="M55.0 15L49.0 18L55.0 21" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1" stroke-linejoin="round"/><path d="M55.2 15.6V20.4" stroke="#FFFFFF" stroke-width="1.4"/><g class="dg-full"><use href="#an-z-reich-gottes" x="58.0" y="11.0" width="14.0" height="14"/><use href="#an-z-frage" x="75.0" y="11.0" width="14.0" height="14"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="227.5" y="20.3">Womit soll ich das Reich Gottes vergleichen?</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="227.5" y="20.3">Mit was söll ich s Riich vo Gott vergliiche?</tspan></text></g><g class="dg-nw" display="none"><use href="#an-z-reich-gottes" x="196.5" y="12.0" width="12.0" height="12"/><use href="#an-z-frage" x="211.5" y="12.0" width="12.0" height="12"/></g></g><g class="dg-vis" data-visual="grid"><g class="dg-cell"><rect x="8.0" y="34.0" width="176.5" height="68.1" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#an-senfstaude" x="74.8" y="38" width="20.0" height="20"/><use href="#an-vogel" x="97.8" y="38" width="20.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="96.2" y="67.1">Einem Senfkorn</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="96.2" y="67.1">Eme Sänfchorn</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="96.2" y="77.7">ein Mensch säte es in seinen Garten – es</tspan><tspan x="96.2" y="86.7">wurde zu einem Baum, und die Vögel des</tspan><tspan x="96.2" y="95.6">Himmels nisteten in seinen Zweigen</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="96.2" y="77.7">en Mänsch hät s i sin Garte gsäit – es isch</tspan><tspan x="96.2" y="86.7">en Baum worde, und d Vögel vom Himmel händ</tspan><tspan x="96.2" y="95.6">i sine Äscht gnischtet</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#an-senfstaude" x="41.9" y="41.6" width="52.9" height="52.9"/><use href="#an-vogel" x="97.8" y="41.6" width="52.9" height="52.9"/></g></g></g><g class="dg-cell"><rect x="189.5" y="34.0" width="176.5" height="68.1" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#an-backtrog" x="262.3" y="42.5" width="30.9" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="277.8" y="71.5">Dem Sauerteig</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="277.8" y="71.5">Em Suurteig</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="277.8" y="82.2">eine Frau mischte ihn unter drei Mass Mehl,</tspan><tspan x="277.8" y="91.2">bis das Ganze durchsäuert war</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="277.8" y="82.2">e Frau hät en under drüü Mass Mehl</tspan><tspan x="277.8" y="91.2">gmischt, bis s Ganze dursüüret gsii isch</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#an-backtrog-d" x="236.9" y="41.6" width="81.7" height="52.9"/></g></g></g></g></g><polygon class="pn-frame" points="2,2 372,2 372,108.08 2,110.08" fill="none" stroke="#2B211A" stroke-width="2.2" stroke-linejoin="round"/><g transform="translate(94.0 114.08)"><g class="ill-words"><g class="dg-sw"><g class="dg-full"><rect x="27.1" y="1.0" width="131.8" height="28" rx="3" fill="#FFF4D6" stroke="#3B3226" stroke-width="1"/><use href="#an-z-reich-gottes" x="31.1" y="9.0" width="12.0" height="12"/><use href="#an-z-frage" x="46.1" y="9.0" width="12.0" height="12"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#3B3226"><tspan x="110.0" y="11.5">Wem gleicht das</tspan><tspan x="110.0" y="23.0">Reich Gottes</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#3B3226"><tspan x="110.0" y="11.5">Wem gliicht s</tspan><tspan x="110.0" y="23.0">Riich vo Gott</tspan></text></g><g class="dg-nw" display="none"><rect x="27.1" y="1.0" width="131.8" height="28" rx="3" fill="#FFF4D6" stroke="#3B3226" stroke-width="1"/><use href="#an-z-reich-gottes" x="69.5" y="4.0" width="22.0" height="22"/><use href="#an-z-frage" x="94.5" y="4.0" width="22.0" height="22"/></g></g></g></g></g></svg><svg class="ill-tile ill-narrow" data-span="1" x="402" y="0" width="194" height="208.396" viewBox="0 0 194 208.396"><g transform="translate(4 4)"><clipPath id="an-cp-luk-013-018-021-1n"><polygon points="2,2 184,2 184,162.396 2,164.396"/></clipPath><g clip-path="url(#an-cp-luk-013-018-021-1n)"><polygon points="2,2 184,2 184,162.396 2,164.396" fill="#F6EAD7"/><circle cx="38.0" cy