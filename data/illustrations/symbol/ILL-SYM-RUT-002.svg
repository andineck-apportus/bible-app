amily="sans-serif" font-size="6.5" font-weight="700" fill="#8A6A2A"><tspan x="103.0" y="37.6">D Rut fröget</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="103.0" y="48.2">Warum beachtest du mich?</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="103.0" y="48.2">Werum beachtisch du mich?</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="103.0" y="58.9">Ich bin doch eine Fremde.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="103.0" y="58.9">Ich bi doch e Frömdi.</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-p-rut" x="87.0" y="33.8" width="12.1" height="25.8"/></g><g class="nw1"><use href="#ill-p-rut" x="88.9" y="32.5" width="8.1" height="17.3"/><text text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="93.0" y="58.4">W. b. d. m.</tspan></text></g></g></g><g class="dg-cell"><rect x="8.0" y="83.3" width="170.0" height="78.0" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><circle cx="20.0" cy="122.3" r="10.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#ill-p-boas" x="12.4" y="114.0" width="15.1" height="16.2"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="6.5" font-weight="700" fill="#8A6A2A"><tspan x="103.0" y="92.9">Boas: der Grund</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="6.5" font-weight="700" fill="#8A6A2A"><tspan x="103.0" y="92.9">De Boas: de Grund</tspan></text><use href="#ill-z-treue" x="91.7" y="96.5" width="22.7" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="103.0" y="125.5">Alles, was du an deiner</tspan><tspan x="103.0" y="135.2">Schwiegermutter getan hast</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="103.0" y="125.5">Alles, wo du für dini</tspan><tspan x="103.0" y="135.2">Schwigermueter gmacht häsch</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="103.0" y="145.9">und Vater, Mutter und deine Heimat</tspan><tspan x="103.0" y="154.8">verlassen.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="103.0" y="145.9">und Vatter, Mueter und dini Heimet</tspan><tspan x="103.0" y="154.8">verlaa.</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-z-treue" x="58.1" y="91.5" width="69.8" height="61.6"/></g><g class="nw1"><use href="#ill-z-treue" x="72.6" y="98.8" width="40.8" height="36"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="93.0" y="143.3">A. w. d. a. d. S. g. h.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="93.0" y="143.3">A. w. d. f. d. S. g. h.</tspan></text></g></g></g><g class="dg-cell"><rect x="8.0" y="179.3" width="170.0" height="59.3" rx="4" fill="#FFF4D6" stroke="#3B3226" stroke-width="1.3"/><g class="dg-full"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="6.5" font-weight="700" fill="#8A6A2A"><tspan x="93.0" y="188.9">Boas: der Wunsch</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="6.5" font-weight="700" fill="#8A6A2A"><tspan x="93.0" y="188.9">De Boas: de Wunsch</tspan><