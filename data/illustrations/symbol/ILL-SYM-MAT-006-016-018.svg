<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 186 140"><g transform="translate(0 0)"><clipPath id="ill-cp-1-0-0"><rect width="186" height="140" rx="10"/></clipPath><g clip-path="url(#ill-cp-1-0-0)"><rect width="186" height="140" fill="#F4E7D3"/><rect y="118" width="186" height="22" fill="#E2CDA8"/><circle cx="38.0" cy="18.0" r="11.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#ill-p-jesus" x="29.6" y="8.8" width="16.8" height="18.0"/><g class="dg-sw"><rect x="54.0" y="8" width="312.0" height="20.0" rx="7" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1"/><path d="M55.0 15L49.0 18L55.0 21" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1" stroke-linejoin="round"/><path d="M55.2 15.6V20.4" stroke="#FFFFFF" stroke-width="1.4"/><g class="dg-full"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.3">Wenn ihr fastet, macht kein düsteres Gesicht wie die Heuchler!</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.3">Wänn ir faschted, mached kei finschters Gsicht wie d Hüüchler!</tspan></text></g><g class="dg-nw" display="none"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.0" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.2">W. i. f. m. k. d. G. w. d. H.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.0" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.2">W. i. f. m. k. f. G. w. d. H.</tspan></text></g></g><g class="dg-vis" data-visual="columns"><g class="dg-sw"><rect x="8.0" y="34.0" width="176.5" height="15.0" rx="3" fill="#E3D4BA" stroke="#3B3226" stroke-width=".9"/><g class="dg-full"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="96.2" y="43.5">die Heuchler</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="96.2" y="43.5">d Hüüchler</tspan></text></g><g class="dg-nw" display="none"><text text-anchor="middle" font-family="sans-serif" font-size="6.5" font-weight="700" fill="#3B3226"><tspan x="96.2" y="43.2">d. H.</tspan></text></g></g><g class="dg-sw"><rect x="189.5" y="34.0" width="176.5" height="15.0" rx="3" fill="#F2D9A0" stroke="#3B3226" stroke-width=".9"/><g class="dg-full"><text text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="277.8" y="43.5">du aber</tspan></text></g><g class="dg-nw" display="none"><text text-anchor="middle" font-family="sans-serif" font-size="6.5" font-weight="700" fill="#3B3226"><tspan x="277.8" y="43.2">d. a.</tspan></text></g></g><g class="dg-cell"><rect x="8.0" y="53.0" width="176.5" height="49.4" rx="4" fill="#EFE6D6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><circle cx="20.0" cy="77.6" r="10.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#ill-p-heuchler" x="12.4" y="69.4" width="15.1" height="16.2"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="106.2" y="75.0">Sie machen ihr Gesicht</tspan><tspan x="106.2" y="84.7">unkenntlich</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="106.2" y="75.0">Si mached ires Gsicht unkänntlich</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-p-heuchler" x="87.7" y="59.4" width="17.1" height="36.4"/></g><g class="nw1"><use href="#ill-p-heuchler" x="89.4" y="57.5" width="13.8" height="29.4"/><text text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#6B5E4B"><tspan x="96.2" y="95.4">S. m. i. G. u.</tspan></text></g></g></g><g class="dg-cell"><rect x="189.5" y="53.0" width="176.5" height="49.4" rx="4" fill="#FFF4D6" stroke="#3B3226" stroke-width="1.3"/><g class="dg-full"><circle cx="201.5" cy="77.6" r="10.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#ill-p-juenger" x="193.9" y="69.4" width="15.1" height="16.2"/><use href="#ill-oelgefaess" x="269.2" y="57.0" width="15.4" height="20"/><use href="#ill-z-waschen" x="287.6" y="57.0" width="18.8" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="287.8" y="86.0">Salbe deinen Kopf und wasche dein</tspan><tspan x="287.8" y="95.7">Gesicht</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="287.8" y="86.0">Salb diin Chopf und wäsch diis</tspan><tspan x="287.8" y="95.7">Gsicht</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-oelgefaess" x="245.2" y="59.4" width="28.0" height="36.4"/><use href="#ill-z-waschen" x="276.2" y="59.4" width="34.1" height="36.4"/></g><g class="nw1"><use href="#ill-oelgefaess" x="251.2" y="57.5" width="22.6" height="29.4"/><use href="#ill-z-waschen" x="276.8" y="57.5" width="27.5" height="29.4"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="277.8" y="95.4">S. d. K. u. w. d. G.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="277.8" y="95.4">S. d. C. u. w. d. G.</tspan></text></g></g></g><g class="dg-cell"><rect x="8.0" y="107.3" width="176.5" height="49.4" rx="4" fill="#EFE6D6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#ill-z-sehen" x="66.3" y="111.3" width="32.5" height="20"/><use href="#ill-z-fasten" x="101.8" y="111.3" width="24.4" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="96.2" y="140.4">Die Menschen sollen sehen, dass sie</tspan><tspan x="96.2" y="150.0">fasten</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="96.2" y="140.4">D Lüüt söled gseh, dass si faschted</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-z-sehen" x="42.9" y="113.8" width="59.1" height="36.4"/><use href="#ill-z-fasten" x="105.1" y="113.8" width="44.5" height="36.4"/></g><g class="nw1"><use href="#ill-z-sehen" x="52.9" y="111.8" width="47.7" height="29.4"/><use href="#ill-z-fasten" x="103.7" y="111.8" width="35.9" height="29.4"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#6B5E4B"><tspan x="96.2" y="149.7">D. M. s. s. d. s. f.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#6B5E4B"><tspan x="96.2" y="149.7">D. L. s. g. d. s. f.</tspan></text></g></g></g><g class="dg-cell"><rect x="189.5" y="107.3" width="176.5" height="49.4" rx="4" fill="#FFF4D6" stroke="#3B3226" stroke-width="1.3"/><g class="dg-full"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="277.8" y="129.4">Nicht die Menschen sollen es sehen,</tspan><tspan x="277.8" y="139.0">sondern dein Vater im Verborgenen</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="277.8" y="129.4">Nöd d Lüüt söled s gseh, sondern diin</tspan><tspan x="277.8" y="139.0">Vatter im Verborgne</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="277.8" y="134.2">N. d. M. s. e. s. s. d. V. i. V.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="277.8" y="134.2">N. d. L. s. s. g. s. d. V. i. V.</tspan></text></g></g></g><g class="dg-cell"><rect x="8.0" y="161.7" width="176.5" height="49.4" rx="4" fill="#EFE6D6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#ill-z-lohn-erhalten" x="86.2" y="170.5" width="20.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="96.2" y="199.6">Sie haben ihren Lohn schon erhalten</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="96.2" y="199.6">Si händ ire Loon scho übercho</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-z-lohn-erhalten" x="78.1" y="168.2" width="36.4" height="36.4"/></g><g class="nw1"><use href="#ill-z-lohn-erhalten" x="81.6" y="166.2" width="29.4" height="29.4"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#6B5E4B"><tspan x="96.2" y="204.1">S. h. i. L. s. e.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#6B5E4B"><tspan x="96.2" y="204.1">S. h. i. L. s. ü.</tspan></text></g></g></g><g class="dg-cell"><rect x="189.5" y="161.7" width="176.5" height="49.4" rx="4" fill="#FFF4D6" stroke="#3B3226" stroke-width="1.3"/><g class="dg-full"><use href="#ill-gott" x="255.5" y="165.7" width="20.0" height="20"/><use href="#ill-z-schatz" x="278.5" y="165.7" width="21.4" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="277.8" y="194.7">Dein Vater, der ins Verborgene sieht,</tspan><tspan x="277.8" y="204.4">wird es dir vergelten</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="277.8" y="194.7">Diin Vatter, wo is Verborgne gseht,</tspan><tspan x="277.8" y="204.4">wird s dir vergälte</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-gott" x="238.6" y="168.2" width="36.4" height="36.4"/><use href="#ill-z-schatz" x="278.0" y="168.2" width="39.0" height="36.4"/></g><g class="nw1"><use href="#ill-gott" x="245.8" y="166.2" width="29.4" height="29.4"/><use href="#ill-z-schatz" x="278.2" y="166.2" width="31.5" height="29.4"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="277.8" y="204.1">D. V. d. i. V. s. w. e. d. v.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="277.8" y="204.1">D. V. w. i. V. g. w. s. d. v.</tspan></text></g></g></g></g></g></g></svg>
