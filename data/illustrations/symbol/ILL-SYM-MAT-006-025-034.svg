<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 140"><g transform="translate(0 0)"><clipPath id="ill-cp-1-0-0"><rect width="186" height="140" rx="10"/></clipPath><g clip-path="url(#ill-cp-1-0-0)"><rect width="186" height="140" fill="#F4E7D3"/><rect y="118" width="186" height="22" fill="#E2CDA8"/><circle cx="38.0" cy="18.0" r="11.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#ill-p-jesus" x="29.6" y="8.8" width="16.8" height="18.0"/><g class="dg-sw"><rect x="54.0" y="8" width="312.0" height="28.3" rx="7" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1"/><path d="M55.0 15L49.0 18L55.0 21" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1" stroke-linejoin="round"/><path d="M55.2 15.6V20.4" stroke="#FFFFFF" stroke-width="1.4"/><g class="dg-full"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="210.0" y="19.4">Sorgt euch nicht um euer Leben, was ihr essen, und um euren Leib,</tspan><tspan x="210.0" y="29.5">was ihr anziehen sollt!</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="210.0" y="19.4">Mached eu kei Sorge um eues Läbe, was ir ässed, und um eue Liib,</tspan><tspan x="210.0" y="29.5">was ir aalegged!</tspan></text></g><g class="dg-nw" display="none"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="9.0" font-weight="700" fill="#3B3226"><tspan x="210.0" y="24.6">S. e. n. u. e. L. w. i. e. u. u. e. L. w. i. a. s.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="9.0" font-weight="700" fill="#3B3226"><tspan x="210.0" y="24.6">M. e. k. S. u. e. L. w. i. ä. u. u. e. L. w. i. a.</tspan></text></g></g><g class="dg-vis" data-visual="balance"><path d="M187.0 48.3l-6 -6h12z" fill="#C08A2A" stroke="#3B3226" stroke-width=".8"/><path d="M94.0 45.3L280.0 55.3" stroke="#3B3226" stroke-width="2" stroke-linecap="round"/><path d="M94.0 45.3V53.3" stroke="#3B3226" stroke-width=".9"/><g class="dg-cell"><rect x="8.0" y="53.3" width="172.0" height="59.8" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#ill-vogel" x="79.0" y="57.3" width="30.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="94.0" y="86.3">Die Vögel des Himmels säen nicht und</tspan><tspan x="94.0" y="96.0">ernten nicht</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="94.0" y="86.3">D Vögel am Himel säied nöd und ärnted</tspan><tspan x="94.0" y="96.0">nöd</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="94.0" y="106.7">Euer himmlischer Vater ernährt sie.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="94.0" y="106.7">Eue himmlisch Vatter git ine z ässe.</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-vogel" x="59.8" y="60.4" width="68.4" height="45.6"/></g><g class="nw1"><use href="#ill-vogel" x="67.0" y="59.7" width="54.0" height="36"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="94.0" y="104.3">D. V. d. H. s. n. u. e. n.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="94.0" y="104.3">D. V. a. H. s. n. u. ä. n.</tspan></text></g></g></g><g class="dg-cell"><rect x="8.0" y="116.1" width="172.0" height="59.8" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#ill-lilie" x="88.1" y="120.1" width="11.8" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="94.0" y="149.2">Die Lilien des Feldes mühen sich nicht</tspan><tspan x="94.0" y="158.8">ab</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="94.0" y="149.2">D Lilie uf em Fäld chrampfed nöd</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="94.0" y="169.5">Gott kleidet sie und das Gras des Feldes.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="94.0" y="169.5">Gott leit si und s Gras uf em Fäld aa.</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-lilie" x="80.6" y="123.2" width="26.8" height="45.6"/></g><g class="nw1"><use href="#ill-lilie" x="83.4" y="122.5" width="21.2" height="36"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="94.0" y="167.1">D. L. d. F. m. s. n. a.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="94.0" y="167.1">D. L. u. e. F. c. n.</tspan></text></g></g></g><path d="M280.0 55.3V63.3" stroke="#3B3226" stroke-width=".9"/><g class="dg-cell"><rect x="194.0" y="63.3" width="172.0" height="27.4" rx="4" fill="#FFF4D6" stroke="#3B3226" stroke-width="1.3"/><g class="dg-full"><circle cx="206.0" cy="77.0" r="10.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#ill-p-g-juenger" x="198.4" y="68.7" width="15.1" height="16.2"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="290.0" y="74.3">Seid ihr nicht viel mehr wert als</tspan><tspan x="290.0" y="84.0">sie?</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="290.0" y="74.3">Sind ir nöd vil meh wärt als si?</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-p-g-juenger" x="276.0" y="68.5" width="8.0" height="17.0"/></g><g class="nw1"><use href="#ill-p-g-juenger" x="276.0" y="67.3" width="8.0" height="12"/><text text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="280.0" y="87.8">S. i. n. v. m. w. a. s.</tspan></text></g></g></g><g class="dg-cell"><rect x="194.0" y="93.6" width="172.0" height="49.4" rx="4" fill="#FFF4D6" stroke="#3B3226" stroke-width="1.3"/><g class="dg-full"><use href="#ill-gewand" x="270.0" y="97.6" width="20.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="280.0" y="126.7">Wird er dann nicht viel mehr euch</tspan><tspan x="280.0" y="136.4">kleiden?</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="280.0" y="126.7">Wird er dänn nöd vil meh eu aalegge?</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-gewand" x="261.8" y="100.1" width="36.4" height="36.4"/></g><g class="nw1"><use href="#ill-gewand" x="265.3" y="98.1" width="29.4" height="29.4"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="280.0" y="136.1">W. e. d. n. v. m. e. k.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="280.0" y="136.1">W. e. d. n. v. m. e. a.</tspan></text></g></g></g><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.4" font-weight="700" fill="#3B3226"><tspan x="187.0" y="199.2">Ist nicht das Leben mehr als die Nahrung?</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.4" font-weight="700" fill="#3B3226"><tspan x="187.0" y="199.2">Isch nöd s Läbe meh als s Ässe?</tspan></text></g></g><circle cx="13" cy="13" r="9" fill="#FFFDF6" stroke="#3B3226"/><text x="13" y="17.5" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3B3226">1</text></g><g transform="translate(194 0)"><clipPath id="ill-cp-2-194-0"><rect width="186" height="140" rx="10"/></clipPath><g clip-path="url(#ill-cp-2-194-0)"><rect width="186" height="140" fill="#F4E7D3"/><rect y="118" width="186" height="22" fill="#E2CDA8"/><circle cx="38.0" cy="18.0" r="11.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#ill-p-jesus" x="29.6" y="8.8" width="16.8" height="18.0"/><g class="dg-sw"><rect x="54.0" y="8" width="312.0" height="28.3" rx="7" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1"/><path d="M55.0 15L49.0 18L55.0 21" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1" stroke-linejoin="round"/><path d="M55.2 15.6V20.4" stroke="#FFFFFF" stroke-width="1.4"/><g class="dg-full"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="210.0" y="19.4">Sorgt euch also nicht und sagt nicht: «Was sollen wir essen,</tspan><tspan x="210.0" y="29.5">trinken, anziehen?»</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="210.0" y="19.4">Mached eu also kei Sorge und säged nöd: «Was söled mir ässe,</tspan><tspan x="210.0" y="29.5">trinke, aalegge?»</tspan></text></g><g class="dg-nw" display="none"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="9.0" font-weight="700" fill="#3B3226"><tspan x="210.0" y="24.6">S. e. a. n. u. s. n. W. s. w. e. t. a.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="9.0" font-weight="700" fill="#3B3226"><tspan x="210.0" y="24.6">M. e. a. k. S. u. s. n. W. s. m. ä. t. a.</tspan></text></g></g><g class="dg-vis" data-visual="arrows"><g class="dg-cell"><rect x="8.0" y="42.3" width="98.4" height="88.1" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#ill-gott" x="47.2" y="46.3" width="20.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="57.2" y="75.3">Euer himmlischer</tspan><tspan x="57.2" y="85.0">Vater weiss, dass</tspan><tspan x="57.2" y="94.7">ihr das alles</tspan><tspan x="57.2" y="104.4">braucht</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="57.2" y="75.3">Eue himmlisch</tspan><tspan x="57.2" y="85.0">Vatter weiss, dass</tspan><tspan x="57.2" y="94.7">ir das alles</tspan><tspan x="57.2" y="104.4">bruuched</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="57.2" y="115.0">Danach trachten die</tspan><tspan x="57.2" y="124.0">Heiden.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="57.2" y="115.0">Das sueched d Heide.</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-gott" x="22.0" y="51.1" width="70.5" height="70.5"/></g><g class="nw1"><use href="#ill-gott" x="39.2" y="62.9" width="36.0" height="36"/><text text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="57.2" y="107.4">E. h. V. w. d. i. d. a. b.</tspan></text></g></g></g><g class="dg-cell"><rect x="137.8" y="42.3" width="98.4" height="88.1" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#ill-z-reich-gottes" x="176.3" y="60.9" width="21.4" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="187.0" y="89.9">Sucht zuerst das</tspan><tspan x="187.0" y="99.6">Reich und seine</tspan><tspan x="187.0" y="109.3">Gerechtigkeit</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="187.0" y="89.9">Sueched zerscht s</tspan><tspan x="187.0" y="99.6">Riich und sini</tspan><tspan x="187.0" y="109.3">Grächtigkeit</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-z-reich-gottes" x="149.2" y="51.1" width="75.6" height="70.5"/></g><g class="nw1"><use href="#ill-z-reich-gottes" x="167.7" y="62.9" width="38.6" height="36"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="187.0" y="107.4">S. z. d. R. u. s. G.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="187.0" y="107.4">S. z. s. R. u. s. G.</tspan></text></g></g></g><g class="dg-cell"><rect x="267.6" y="42.3" width="98.4" height="88.1" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#ill-brot" x="288.1" y="65.7" width="34.3" height="20"/><use href="#ill-gewand" x="325.4" y="65.7" width="20.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="316.8" y="94.7">Dies alles wird euch</tspan><tspan x="316.8" y="104.4">dazugegeben</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="316.8" y="94.7">Das alles wird eu</tspan><tspan x="316.8" y="104.4">dezue ggää</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-brot" x="278.4" y="72.4" width="46.7" height="27.2"/><use href="#ill-gewand" x="328.0" y="72.4" width="27.2" height="27.2"/></g><g class="nw1"><use href="#ill-brot" x="278.4" y="62.9" width="47.1" height="27.5"/><use href="#ill-gewand" x="328.5" y="62.9" width="27.5" height="27.5"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="316.8" y="107.4">D. a. w. e. d.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="316.8" y="107.4">D. a. w. e. d. g.</tspan></text></g></g></g><g class="dg-cell"><rect x="8.0" y="148.4" width="358.0" height="28.1" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="187.0" y="159.5">Sorgt euch nicht um den morgigen Tag</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="187.0" y="159.5">Mached eu kei Sorge um de morgig Tag</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="187.0" y="170.1">Es genügt dem Tag seine eigene Plage.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="187.0" y="170.1">Jedem Tag längt sini eiget Plaag.</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="187.0" y="164.7">S. e. n. u. d. m. T.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="187.0" y="164.7">M. e. k. S. u. d. m. T.</tspan></text></g></g></g><g class="dg-link" data-a="107.9,86.4" data-b="136.3,86.4"><path d="M107.9 86.4L136.3 86.4" stroke="#3B3226" stroke-width="1.4" stroke-linecap="round"/><path d="M131.9 88.8L136.3 86.4L131.9 84.0" fill="none" stroke="#3B3226" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></g><g class="dg-label"><rect x="112.2" y="76.8" width="19.9" height="7.8" rx="3.7" fill="#FFF8E8" stroke="#C9B48A" stroke-width=".5"/><text x="122.1" y="82.4" text-anchor="middle" font-family="sans-serif" font-size="6.2" font-weight="700" fill="#8A6A2A">aber</text></g><g class="dg-link" data-a="237.7,86.4" data-b="266.1,86.4"><path d="M237.7 86.4L266.1 86.4" stroke="#3B3226" stroke-width="1.4" stroke-linecap="round"/><path d="M261.7 88.8L266.1 86.4L261.7 84.0" fill="none" stroke="#3B3226" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></g><g class="dg-link" data-a="316.8,131.4" data-b="187.0,146.9"><path d="M316.8 131.4V139.2H187.0V142.9" fill="none" stroke="#3B3226" stroke-width="1.4" stroke-linejoin="round"/><path d="M187.0 141.9L187.0 146.9" stroke="#3B3226" stroke-width="1.4" stroke-linecap="round"/><path d="M184.6 142.5L187.0 146.9L189.4 142.5" fill="none" stroke="#3B3226" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></g><g class="dg-label"><rect x="242.7" y="131.1" width="18.4" height="7.8" rx="3.7" fill="#FFF8E8" stroke="#C9B48A" stroke-width=".5"/><text x="251.9" y="136.7" text-anchor="middle" font-family="sans-serif" font-size="6.2" font-weight="700" fill="#8A6A2A">also</text></g></g></g><circle cx="13" cy="13" r="9" fill="#FFFDF6" stroke="#3B3226"/><text x="13" y="17.5" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3B3226">2</text></g></svg>
