<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 288"><g transform="translate(0 0)"><clipPath id="ill-cp-1-0-0"><rect width="186" height="140" rx="10"/></clipPath><g clip-path="url(#ill-cp-1-0-0)"><rect width="186" height="140" fill="#F4E7D3"/><rect y="118" width="186" height="22" fill="#E2CDA8"/><circle cx="38.0" cy="18.0" r="11.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#ill-p-jesus" x="29.6" y="8.8" width="16.8" height="18.0"/><g class="dg-sw"><rect x="54.0" y="8" width="312.0" height="20.0" rx="7" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1"/><path d="M55.0 15L49.0 18L55.0 21" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1" stroke-linejoin="round"/><path d="M55.2 15.6V20.4" stroke="#FFFFFF" stroke-width="1.4"/><g class="dg-full"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.3">Denn jeder, der bittet, empfängt.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.3">Dänn jede, wo bittet, überchunnt.</tspan></text></g><g class="dg-nw" display="none"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.0" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.2">D. j. d. b. e.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.0" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.2">D. j. w. b. ü.</tspan></text></g></g><g class="dg-vis" data-visual="grid"><g class="dg-cell"><rect x="8.0" y="34.0" width="116.0" height="59.1" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#ill-z-geben" x="51.8" y="38" width="28.3" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="66.0" y="67.1">Bittet</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="66.0" y="67.1">Bitted</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="66.0" y="77.7">→ es wird euch gegeben</tspan><tspan x="66.0" y="86.7">werden</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="66.0" y="77.7">→ es wird eu ggää</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-z-geben" x="34.1" y="41.1" width="63.7" height="45.0"/></g><g class="nw1"><use href="#ill-z-geben" x="40.5" y="40.1" width="51.0" height="36"/><text text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="66.0" y="84.6">B.</tspan></text></g></g></g><g class="dg-cell"><rect x="129.0" y="34.0" width="116.0" height="59.1" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#ill-z-suchen-finden" x="177.0" y="42.5" width="20.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="187.0" y="71.5">Sucht</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="187.0" y="71.5">Sueched</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="187.0" y="82.2">→ ihr werdet finden</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="187.0" y="82.2">→ ir wärded finde</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-z-suchen-finden" x="164.5" y="41.1" width="45.0" height="45.0"/></g><g class="nw1"><use href="#ill-z-suchen-finden" x="169.0" y="40.1" width="36.0" height="36"/><text text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="187.0" y="84.6">S.</tspan></text></g></g></g><g class="dg-cell"><rect x="250.0" y="34.0" width="116.0" height="59.1" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#ill-tuer-offen" x="299.9" y="38" width="16.2" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="308.0" y="67.1">Klopft an</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="308.0" y="67.1">Chlopfed aa</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="308.0" y="77.7">→ es wird euch geöffnet</tspan><tspan x="308.0" y="86.7">werden</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="308.0" y="77.7">→ es wird eu uftaa</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-tuer-offen" x="289.8" y="41.1" width="36.5" height="45.0"/></g><g class="nw1"><use href="#ill-tuer-offen" x="293.4" y="40.1" width="29.2" height="36"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="308.0" y="84.6">K. a.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="308.0" y="84.6">C. a.</tspan></text></g></g></g></g></g><circle cx="13" cy="13" r="9" fill="#FFFDF6" stroke="#3B3226"/><text x="13" y="17.5" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3B3226">1</text></g><g transform="translate(194 0)"><clipPath id="ill-cp-2-194-0"><rect width="186" height="140" rx="10"/></clipPath><g clip-path="url(#ill-cp-2-194-0)"><rect width="186" height="140" fill="#F4E7D3"/><rect y="118" width="186" height="22" fill="#E2CDA8"/><circle cx="38.0" cy="18.0" r="11.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#ill-p-jesus" x="29.6" y="8.8" width="16.8" height="18.0"/><g class="dg-sw"><rect x="54.0" y="8" width="312.0" height="20.0" rx="7" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1"/><path d="M55.0 15L49.0 18L55.0 21" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1" stroke-linejoin="round"/><path d="M55.2 15.6V20.4" stroke="#FFFFFF" stroke-width="1.4"/><g class="dg-full"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.3">Wer gibt seinem Sohn einen Stein, wenn er um Brot bittet?</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.3">Wer git sim Sohn en Stei, wänn er um Broot bittet?</tspan></text></g><g class="dg-nw" display="none"><text text-anchor="middle" font-family="sans-serif" font-size="8.0" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.2">W. g. s. S. e. S. w. e. u. B. b.</tspan></text></g></g><g class="dg-vis" data-visual="balance"><path d="M187.0 40.0l-6 -6h12z" fill="#C08A2A" stroke="#3B3226" stroke-width=".8"/><path d="M94.0 37.0L280.0 47.0" stroke="#3B3226" stroke-width="2" stroke-linecap="round"/><path d="M94.0 37.0V45.0" stroke="#3B3226" stroke-width=".9"/><g class="dg-cell"><rect x="8.0" y="45.0" width="172.0" height="68.8" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><circle cx="20.0" cy="79.4" r="10.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#ill-p-vater" x="12.4" y="71.1" width="15.1" height="16.2"/><use href="#ill-brot" x="66.4" y="49" width="34.3" height="20"/><use href="#ill-fisch" x="103.6" y="49" width="38.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="104.0" y="78.1">Ihr, die ihr böse seid, gebt</tspan><tspan x="104.0" y="87.7">euren Kindern gute Gaben</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="104.0" y="78.1">Ir, wo bös sind, gänd eune Chind</tspan><tspan x="104.0" y="87.7">gueti Gabe</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="104.0" y="98.4">Brot statt Stein, Fisch statt</tspan><tspan x="104.0" y="107.4">Schlange</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="104.0" y="98.4">Broot statt Stei, Fisch statt</tspan><tspan x="104.0" y="107.4">Schlange</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-brot" x="24.3" y="60.4" width="64.7" height="37.7"/><use href="#ill-fisch" x="92.0" y="60.4" width="71.7" height="37.7"/></g><g class="nw1"><use href="#ill-brot" x="27.4" y="55.9" width="61.7" height="36"/><use href="#ill-fisch" x="92.2" y="55.9" width="68.4" height="36"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="94.0" y="100.4">I. d. i. b. s. g. e. K. g. G.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="94.0" y="100.4">I. w. b. s. g. e. C. g. G.</tspan></text></g></g></g><path d="M280.0 47.0V55.0" stroke="#3B3226" stroke-width=".9"/><g class="dg-cell"><rect x="194.0" y="55.0" width="172.0" height="49.4" rx="4" fill="#FFF4D6" stroke="#3B3226" stroke-width="1.3"/><g class="dg-full"><use href="#ill-gott" x="270.0" y="59" width="20.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="280.0" y="88.1">Euer Vater in den Himmeln gibt denen</tspan><tspan x="280.0" y="97.7">Gutes, die ihn bitten</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="280.0" y="88.1">Eue Vatter i de Himel git dene Guets,</tspan><tspan x="280.0" y="97.7">wo en drum bitted</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-gott" x="261.8" y="61.5" width="36.4" height="36.4"/></g><g class="nw1"><use href="#ill-gott" x="265.3" y="59.5" width="29.4" height="29.4"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="280.0" y="97.4">E. V. i. d. H. g. d. G. d. i. b.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="280.0" y="97.4">E. V. i. d. H. g. d. G. w. e. d. b.</tspan></text></g></g></g><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.4" font-weight="700" fill="#3B3226"><tspan x="187.0" y="137.0">Wie viel mehr!</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.4" font-weight="700" fill="#3B3226"><tspan x="187.0" y="137.0">Wie vil meh!</tspan></text></g></g><circle cx="13" cy="13" r="9" fill="#FFFDF6" stroke="#3B3226"/><text x="13" y="17.5" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3B3226">2</text></g><g transform="translate(97 148)"><clipPath id="ill-cp-3-97-148"><rect width="186" height="140" rx="10"/></clipPath><g clip-path="url(#ill-cp-3-97-148)"><rect width="186" height="140" fill="#F4E7D3"/><rect y="118" width="186" height="22" fill="#E2CDA8"/><circle cx="38.0" cy="18.0" r="11.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#ill-p-jesus" x="29.6" y="8.8" width="16.8" height="18.0"/><g class="dg-sw"><rect x="54.0" y="8" width="312.0" height="20.0" rx="7" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1"/><path d="M55.0 15L49.0 18L55.0 21" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1" stroke-linejoin="round"/><path d="M55.2 15.6V20.4" stroke="#FFFFFF" stroke-width="1.4"/><g class="dg-full"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.3">Daraus folgt:</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.3">Drus folgt:</tspan></text></g><g class="dg-nw" display="none"><text text-anchor="middle" font-family="sans-serif" font-size="8.0" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.2">D. f.</tspan></text></g></g><g class="dg-vis" data-visual="arrows"><g class="dg-cell"><rect x="8.0" y="34.0" width="98.4" height="49.4" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="57.2" y="51.2">Was ihr wollt, dass</tspan><tspan x="57.2" y="60.9">euch die Menschen</tspan><tspan x="57.2" y="70.6">tun,</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="57.2" y="51.2">Was ir wänd, dass eu</tspan><tspan x="57.2" y="60.9">d Lüüt tüend,</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="57.2" y="60.9">W. i. w. d. e. d. M. t.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="57.2" y="60.9">W. i. w. d. e. d. L. t.</tspan></text></g></g></g><g class="dg-cell"><rect x="137.8" y="34.0" width="98.4" height="49.4" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="187.0" y="56.1">so tut auch ihr</tspan><tspan x="187.0" y="65.7">ihnen!</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="187.0" y="56.1">eso tüend au ir ine!</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="187.0" y="60.9">s. t. a. i. i.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="187.0" y="60.9">e. t. a. i. i.</tspan></text></g></g></g><g class="dg-cell"><rect x="267.6" y="34.0" width="98.4" height="49.4" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#ill-schriftrolle" x="302.1" y="38" width="29.3" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="316.8" y="67.1">Das ist das Gesetz</tspan><tspan x="316.8" y="76.7">und die Propheten</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="316.8" y="67.1">Das isch s Gsetz und</tspan><tspan x="316.8" y="76.7">d Prophete</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-schriftrolle" x="290.1" y="40.5" width="53.4" height="36.4"/></g><g class="nw1"><use href="#ill-schriftrolle" x="295.2" y="38.5" width="43.1" height="29.4"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="316.8" y="76.4">D. i. d. G. u. d. P.</tspan></text><text class="lw lw-gsw" text-anchor="middle" fo