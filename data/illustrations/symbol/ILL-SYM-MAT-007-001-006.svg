f" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.3">Warum siehst du den Splitter im Auge deines Bruders?</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.3">Wieso gsehsch du de Splitter im Aug vo dim Brueder?</tspan></text></g><g class="dg-nw" display="none"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.0" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.2">W. s. d. d. S. i. A. d. B.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.0" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.2">W. g. d. d. S. i. A. v. d. B.</tspan></text></g></g><g class="dg-vis" data-visual="arrows"><g class="dg-cell"><rect x="8.0" y="34.0" width="98.4" height="59.0" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#ill-z-auge" x="21.7" y="38" width="30.0" height="20"/><use href="#ill-balken" x="54.7" y="38" width="38.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="57.2" y="67.1">Den Balken in deinem</tspan><tspan x="57.2" y="76.7">eigenen Auge</tspan><tspan x="57.2" y="86.4">bemerkst du nicht</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="57.2" y="67.1">De Balke i dim eigete</tspan><tspan x="57.2" y="76.7">Aug merksch du nöd</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-z-auge" x="18.8" y="52.4" width="32.6" height="21.7"/><use href="#ill-balken" x="54.4" y="52.4" width="41.3" height="21.7"/></g><g class="nw1"><use href="#ill-z-auge" x="18.8" y="40.0" width="33.1" height="22.1"/><use href="#ill-balken" x="54.9" y="40.0" width="41.9" height="22.1"/><text class="lw lw-de" text-anchor="middle" font-famil