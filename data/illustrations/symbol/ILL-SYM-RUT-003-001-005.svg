eight="700" fill="#3B3226"><tspan x="46.5" y="168.5">Wenn er sich</tspan><tspan x="46.5" y="178.2">hinlegt: Deck</tspan><tspan x="46.5" y="187.9">seine Füsse auf</tspan><tspan x="46.5" y="197.6">und leg dich</tspan><tspan x="46.5" y="207.2">hin!</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="46.5" y="168.5">Wänn er sich</tspan><tspan x="46.5" y="178.2">häreleit: Deck</tspan><tspan x="46.5" y="187.9">sini Füess uf</tspan><tspan x="46.5" y="197.6">und leg dich</tspan><tspan x="46.5" y="207.2">ane!</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="46.5" y="178.5">W. e. s. h. D. s.</tspan><tspan x="46.5" y="188.1">F. a. u. l. d. h.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="46.5" y="178.5">W. e. s. h. D. s.</tspan><tspan x="46.5" y="188.1">F. u. u. l. d. a.</tspan></text></g></g></g><g class="dg-cell"><rect x="101.0" y="148.3" width="77.0" height="65.5" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9" stroke-dasharray="3 2"/><g class="dg-full"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="6.5" font-weight="700" fill="#8A6A2A"><tspan x="139.5" y="167.6">dann</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="6.5" font-weight="700" fill="#8A6A2A"><tspan x="139.5" y="167.6">dänn</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="139.5" y="178.2">Er wird dir</tspan><tspan x="139.5" y="187.9">sagen, was du</tspan><tspan x="139.5" y="197.6">tun sollst.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" 