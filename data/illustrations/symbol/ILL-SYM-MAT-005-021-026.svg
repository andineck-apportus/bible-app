<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 140"><g transform="translate(0 0)"><clipPath id="ill-cp-1-0-0"><rect width="186" height="140" rx="10"/></clipPath><g clip-path="url(#ill-cp-1-0-0)"><rect width="186" height="140" fill="#F4E7D3"/><rect y="118" width="186" height="22" fill="#E2CDA8"/><circle cx="38.0" cy="18.0" r="11.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#ill-p-jesus" x="29.6" y="8.8" width="16.8" height="18.0"/><g class="dg-sw"><rect x="54.0" y="8" width="312.0" height="20.0" rx="7" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1"/><path d="M55.0 15L49.0 18L55.0 21" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1" stroke-linejoin="round"/><path d="M55.2 15.6V20.4" stroke="#FFFFFF" stroke-width="1.4"/><g class="dg-full"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.3">Ihr habt gehört … Ich aber sage euch …</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.3">Ir händ ghört … Ich aber säg eu …</tspan></text></g><g class="dg-nw" display="none"><text text-anchor="middle" font-family="sans-serif" font-size="8.0" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.2">I. h. g. I. a. s. e.</tspan></text></g></g><g class="dg-vis" data-visual="stairs"><g class="dg-cell"><rect x="8.0" y="61.0" width="87.2" height="78.7" rx="4" fill="#EFE6D6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="6.5" font-weight="700" fill="#8A6A2A"><tspan x="51.6" y="75.4">Ihr habt gehört …</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="6.5" font-weight="700" fill="#8A6A2A"><tspan x="51.6" y="75.4">Ir händ ghört …</tspan></text><use href="#ill-z-toeten" x="25.9" y="79.0" width="25.5" height="20"/><use href="#ill-z-gericht" x="54.3" y="79.0" width="23.1" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="51.6" y="108.1">Du sollst nicht</tspan><tspan x="51.6" y="117.7">töten.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="51.6" y="108.1">Du söllsch nöd</tspan><tspan x="51.6" y="117.7">töte.</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#6B5E4B"><tspan x="51.6" y="128.4">Wer tötet → Gericht</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#6B5E4B"><tspan x="51.6" y="128.4">Wer tötet → Gricht</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-z-toeten" x="17.9" y="86.7" width="33.8" height="26.6"/><use href="#ill-z-gericht" x="54.7" y="86.7" width="30.6" height="26.6"/></g><g class="nw1"><use href="#ill-z-toeten" x="17.9" y="76.8" width="34.2" height="26.8"/><use href="#ill-z-gericht" x="55.1" y="76.8" width="31.0" height="26.8"/><text text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#6B5E4B"><tspan x="51.6" y="121.4">D. s. n. t.</tspan></text></g></g></g><g class="dg-cell"><rect x="98.2" y="52.0" width="87.2" height="78.7" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="6.5" font-weight="700" fill="#8A6A2A"><tspan x="141.9" y="61.6">Ich aber sage euch …</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="6.5" font-weight="700" fill="#8A6A2A"><tspan x="141.9" y="61.6">Ich aber säg eu …</tspan></text><use href="#ill-z-zorn" x="116.8" y="65.2" width="24.0" height="20"/><use href="#ill-z-gericht" x="143.8" y="65.2" width="23.1" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="141.9" y="94.2">Wer seinem</tspan><tspan x="141.9" y="103.9">Bruder zürnt</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="141.9" y="94.2">Wer uf sin</tspan><tspan x="141.9" y="103.9">Brueder wüetig</tspan><tspan x="141.9" y="113.6">isch</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="141.9" y="124.2">→ Gericht</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="141.9" y="124.2">→ Gricht</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-z-zorn" x="108.2" y="77.3" width="32.8" height="27.4"/><use href="#ill-z-gericht" x="144.0" y="77.3" width="31.6" height="27.4"/></g><g class="nw1"><use href="#ill-z-zorn" x="108.2" y="67.8" width="33.2" height="27.6"/><use href="#ill-z-gericht" x="144.4" y="67.8" width="31.9" height="27.6"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="141.9" y="112.4">W. s. B. z.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="141.9" y="112.4">W. u. s. B. w. i.</tspan></text></g></g></g><g class="dg-cell"><rect x="188.5" y="43.0" width="87.2" height="78.7" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#ill-p-g-hoher-rat" x="227.4" y="61.3" width="9.4" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="232.1" y="90.3">Wer «Raka!» sagt</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="232.1" y="90.3">Wer «Raka!» seit</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="232.1" y="101.0">→ Hoher Rat</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="232.1" y="101.0">→ Hoche Raat</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-p-g-hoher-rat" x="217.6" y="51.2" width="29.1" height="62.2"/></g><g class="nw1"><use href="#ill-p-g-hoher-rat" x="223.7" y="58.8" width="16.9" height="36"/><text text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="232.1" y="103.4">W. R. s.</tspan></text></g></g></g><g class="dg-cell"><rect x="278.8" y="34.0" width="87.2" height="78.7" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#ill-z-gehenna" x="309.5" y="47.4" width="25.7" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="322.4" y="76.5">Wer «Du Narr!»</tspan><tspan x="322.4" y="86.2">sagt</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="322.4" y="76.5">Wer «Du Tubel!»</tspan><tspan x="322.4" y="86.2">seit</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="322.4" y="96.8">→ Feuer der Hölle</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="322.4" y="96.8">→ Füür vo de Höll</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-z-gehenna" x="288.7" y="47.1" width="67.4" height="52.4"/></g><g class="nw1"><use href="#ill-z-gehenna" x="299.2" y="49.8" width="46.3" height="36"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="322.4" y="94.4">W. D. N. s.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="322.4" y="94.4">W. D. T. s.</tspan></text></g></g></g></g></g><circle cx="13" cy="13" r="9" fill="#FFFDF6" stroke="#3B3226"/><text x="13" y="17.5" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3B3226">1</text></g><g transform="translate(194 0)"><clipPath id="ill-cp-2-194-0"><rect width="186" height="140" rx="10"/></clipPath><g clip-path="url(#ill-cp-2-194-0)"><rect width="186" height="140" fill="#F4E7D3"/><rect y="118" width="186" height="22" fill="#E2CDA8"/><circle cx="38.0" cy="18.0" r="11.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#ill-p-jesus" x="29.6" y="8.8" width="16.8" height="18.0"/><g class="dg-sw"><rect x="54.0" y="8" width="312.0" height="20.0" rx="7" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1"/><path d="M55.0 15L49.0 18L55.0 21" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1" stroke-linejoin="round"/><path d="M55.2 15.6V20.4" stroke="#FFFFFF" stroke-width="1.4"/><g class="dg-full"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.3">Versöhne dich, einige dich schnell!</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.3">Versöön di, einig di schnäll!</tspan></text></g><g class="dg-nw" display="none"><text text-anchor="middle" font-family="sans-serif" font-size="8.0" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.2">V. d. e. d. s.</tspan></text></g></g><g class="dg-vis" data-visual="grid"><g class="dg-cell"><rect x="8.0" y="34.0" width="176.5" height="77.8" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#ill-altar" x="74.6" y="38" width="17.6" height="20"/><use href="#ill-z-frieden" x="95.2" y="38" width="22.7" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="96.2" y="67.1">Wenn dein Bruder etwas gegen dich</tspan><tspan x="96.2" y="76.7">hat:</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="96.2" y="67.1">Wänn din Brueder öppis gäge dich hät:</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="96.2" y="87.4">Lass deine Gabe vor dem Altar, versöhne</tspan><tspan x="96.2" y="96.4">dich zuerst mit ihm, dann bring die Gabe</tspan><tspan x="96.2" y="105.3">dar.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="96.2" y="87.4">La dis Gschänk vor em Altar staa, versöön</tspan><tspan x="96.2" y="96.4">di zerscht mit im, dänn bring s Gschänk dar.</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-altar" x="32.9" y="42.2" width="54.2" height="61.4"/><use href="#ill-z-frieden" x="90.0" y="42.2" width="69.6" height="61.4"/></g><g class="nw1"><use href="#ill-altar" x="58.5" y="49.4" width="31.8" height="36"/><use href="#ill-z-frieden" x="93.2" y="49.4" width="40.8" height="36"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="96.2" y="93.9">W. d. B. e. g. d. h.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="96.2" y="93.9">W. d. B. ö. g. d. h.</tspan></text></g></g></g><g class="dg-cell"><rect x="189.5" y="34.0" width="176.5" height="77.8" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#ill-z-weg" x="249.2" y="38" width="30.0" height="20"/><use href="#ill-gefaengnis" x="282.2" y="38" width="24.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="277.8" y="67.1">Einige dich schnell mit deinem Gegner,</tspan><tspan x="277.8" y="76.7">solange ihr unterwegs seid,</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="277.8" y="67.1">Einig di schnäll mit dim Gägner, solang</tspan><tspan x="277.8" y="76.7">ir underwägs sind,</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="277.8" y="87.4">sonst kommst du vor den Richter und ins</tspan><tspan x="277.8" y="96.4">Gefängnis, bis du den letzten Rappen</tspan><tspan x="277.8" y="105.3">bezahlt hast.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="277.8" y="87.4">suscht chunnsch vor de Richter und is</tspan><tspan x="277.8" y="96.4">Gfängnis, bis du de letscht Rappe zaalt</tspan><tspan x="277.8" y="105.3">häsch.</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-z-weg" x="206.1" y="46.8" width="77.9" height="51.9"/><use href="#ill-gefaengnis" x="287.0" y="46.8" width="62.3" height="51.9"/></g><g class="nw1"><use href="#ill-z-weg" x="227.7" y="49.4" width="54.0" height="36"/><use href="#ill-gefaengnis" x="284.6" y="49.4" width="43.2" height="36"/><text text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="277.8" y="93.9">E. d. s. m. d. G. s. i. u. s.</tspan></text></g></g></g></g></g><circle cx="13" cy="13" r="9" fill="#FFFDF6" stroke="#3B3226"/><text x="13" y="17.5" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3B3226">2</text></g></svg>
