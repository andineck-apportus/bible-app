an x="79.0" y="34.7">im Glaube sii</tspan></text></g><g class="dg-nw" display="none"><text text-anchor="middle" font-family="sans-serif" font-size="9.0" font-weight="700" fill="#3B3226"><tspan x="79.0" y="29.1">S. s. g. i. G. s.</tspan></text></g></g><use href="#ill-z-glauben" x="129.0" y="16.7" width="18.3" height="20"/></g></g><circle cx="13" cy="13" r="9" fill="#FFFDF6" stroke="#3B3226"/><text x="13" y="17.5" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3B3226">2</text></g><g transform="translate(97 148)"><clipPath id="ill-cp-3-97-148"><rect width="186" height="140" rx="10"/></clipPath><g clip-path="url(#ill-cp-3-97-148)"><rect width="186" height="140" fill="#F4E7D3"/><rect y="118" width="186" height="22" fill="#E2CDA8"/><circle cx="38.0" cy="18.0" r="11.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#ill-p-paulus" x="29.6" y="8.8" width="16.8" height="18.0"/><rect x="54.0" y="8" width="312.0" height="20.0" rx="7" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1"/><path d="M55.0 15L49.0 18L55.0 21" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1" stroke-linejoin="round"/><path d="M55.2 15.6V20.4" stroke="#FFFFFF" stroke-width="1.4"/><g class="dg-sw"><g class="dg-full"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.3">Rein und befleckt, Worte und Werke</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.3">Rein und befleckt, Wort und Wärch</tspan></text></g><g class="dg-nw" display="none"><text text-anchor="middle" font-family="sans-serif" font-size="8.0" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.2">R. u. b. W. u. W.</tspan></text></g></g><g class="dg-vis" data-visual="columns"><g class="dg-cell"><rect x="8.0" y="34.0" width="176.5" height="68.3" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><text text-anchor="middle" font-family="sans-serif" font-size="6.5" font-weight="700" fill="#8A6A2A"><tspan x="96.2" y="53.3">rein</tspan></text><use href="#ill-z-rein" x="86.2" y="56.9" width="20.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="96.2" y="85.9">Für die Reinen ist alles rein.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="96.2" y="85.9">Für die Reine isch alles rein.</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-z-rein" x="69.7" y="41.6" width="53.0" height="53.0"/></g><g class="nw1"><use href="#ill-z-rein" x="78.2" y="44.7" width="36.0" height="36"/><text text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="96.2" y="89.2">F. d. R. i. a. r.</tspan></text></g></g></g><g class="dg-cell"><rect x="189.5" y="34.0" width="176.5" height="68.3" rx="4" fill="#EFE6D6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><text text-anchor="middle" font-family="sans-serif" font-size="6.5" font-weight="700" fill="#8A6A2A"><tspan x="277.8" y="43.6">befleckt</tspan></text><use href="#ill-z-unrein" x="266.8" y="47.2" width="21.8" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="277.8" y="76.2">Für die Befleckten ist nichts rein.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="277.8" y="76.2">Für die Befleckte isch nüt rein.</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#6B5E4B"><tspan x="277.8" y="86.9">Befleckt sind ihr Verstand und ihr</tspan><tspan x="277.8" y="95.9">Gewissen.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#6B5E4B"><tspan x="277.8" y="86.9">Befleckt sind ire Verstand und ires Gwüsse.</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-z-unrein" x="248.8" y="41.6" width="57.9" height="53.0"/></g><g class="nw1"><use href="#ill-z-unrein" x="258.1" y="44.7" width="39.3" height="36"/><text text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#6B5E4B"><tspan x="277.8" y="89.2">F. d. B. i. n. r.</tspan></text></g></g></g><g class="dg-cell"><rect x="8.0" y="107.3" width="176.5" height="59.3" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="6.5" font-weight="700" fill="#8A6A2A"><tspan x="96.2" y="122.1">mit Worten</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="6.5" font-weight="700" fill="#8A6A2A"><tspan x="96.2" y="122.1">mit Wort</tspan></text><use href="#ill-p-g-irrlehrer" x="77.8" y="125.7" width="9.4" height="20"/><use href="#ill-z-sprechen" x="90.2" y="125.7" width="24.4" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="96.2" y="154.7">Sie behaupten, Gott zu kennen.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="96.2" y="154.7">Si säged, si kännted Gott.</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-p-g-irrlehrer" x="56.6" y="114.4" width="21.2" height="45.2"/><use href="#ill-z-sprechen" x="80.7" y="114.4" width="55.2" height="45.2"/></g><g class="nw1"><use href="#ill-p-g-irrlehrer" x="64.3" y="113.5" width="16.9" height="36"/><use href="#ill-z-sprechen" x="84.2" y="113.5" width="44.0" height="36"/><text class="lw lw-de" text-anchor="middle" font-family="sa