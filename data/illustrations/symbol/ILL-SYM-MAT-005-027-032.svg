<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 140"><g transform="translate(0 0)"><clipPath id="ill-cp-1-0-0"><rect width="186" height="140" rx="10"/></clipPath><g clip-path="url(#ill-cp-1-0-0)"><rect width="186" height="140" fill="#F4E7D3"/><rect y="118" width="186" height="22" fill="#E2CDA8"/><circle cx="38.0" cy="18.0" r="11.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#ill-p-jesus" x="29.6" y="8.8" width="16.8" height="18.0"/><rect x="54.0" y="8" width="312.0" height="20.0" rx="7" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1"/><path d="M55.0 15L49.0 18L55.0 21" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1" stroke-linejoin="round"/><path d="M55.2 15.6V20.4" stroke="#FFFFFF" stroke-width="1.4"/><g class="dg-sw"><g class="dg-full"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.3">Ihr habt gehört … Ich aber sage euch …</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.3">Ir händ ghört … Ich aber säg eu …</tspan></text></g><g class="dg-nw" display="none"><text text-anchor="middle" font-family="sans-serif" font-size="8.0" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.2">I. h. g. I. a. s. e.</tspan></text></g></g><g class="dg-vis" data-visual="columns"><rect x="8.0" y="34.0" width="171.5" height="23.9" rx="3" fill="#E3D4BA" stroke="#3B3226" stroke-width=".9"/><g class="dg-sw"><g class="dg-full"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="93.8" y="43.5">Ihr habt gehört … / Es ist gesagt</tspan><tspan x="93.8" y="52.5">worden …</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="93.8" y="43.5">Ir händ ghört … / Es isch gseit worde …</tspan></text></g><g class="dg-nw" display="none"><text text-anchor="middle" font-family="sans-serif" font-size="9.0" font-weight="700" fill="#3B3226"><tspan x="93.8" y="48.4">I. h. g. E. i. g. w.</tspan></text></g></g><rect x="194.5" y="34.0" width="171.5" height="23.9" rx="3" fill="#F2D9A0" stroke="#3B3226" stroke-width=".9"/><g class="dg-sw"><g class="dg-full"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="280.2" y="48.0">Ich aber sage euch …</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="280.2" y="48.0">Ich aber säg eu …</tspan></text></g><g class="dg-nw" display="none"><text text-anchor="middle" font-family="sans-serif" font-size="9.0" font-weight="700" fill="#3B3226"><tspan x="280.2" y="48.4">I. a. s. e.</tspan></text></g></g><g class="dg-cell"><rect x="8.0" y="61.9" width="171.5" height="68.8" rx="4" fill="#EFE6D6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#ill-z-ehe" x="83.0" y="80.5" width="21.4" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="93.8" y="109.5">Du sollst nicht ehebrechen.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="93.8" y="109.5">Du söllsch nöd d Ee breche.</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-z-ehe" x="65.1" y="69.6" width="57.3" height="53.5"/></g><g class="nw1"><use href="#ill-z-ehe" x="74.5" y="72.8" width="38.6" height="36"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#6B5E4B"><tspan x="93.8" y="117.4">D. s. n. e.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#6B5E4B"><tspan x="93.8" y="117.4">D. s. n. d. E. b.</tspan></text></g></g></g><g class="dg-cell"><rect x="194.5" y="61.9" width="171.5" height="68.8" rx="4" fill="#FFF4D6" stroke="#3B3226" stroke-width="1.3"/><g class="dg-full"><use href="#ill-z-auge" x="252.8" y="65.9" width="30.0" height="20"/><use href="#ill-z-herz" x="285.8" y="65.9" width="22.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="280.2" y="95.0">Wer eine Frau ansieht, um sie zu</tspan><tspan x="280.2" y="104.7">begehren,</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="280.2" y="95.0">Wer e Frau aaluegt, für si z begääre,</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="280.2" y="115.3">hat in seinem Herzen schon mit ihr die Ehe</tspan><tspan x="280.2" y="124.3">gebrochen.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="280.2" y="115.3">hät i sim Härz scho mit ire d Ee broche.</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-z-auge" x="210.8" y="70.2" width="78.4" height="52.3"/><use href="#ill-z-herz" x="292.2" y="70.2" width="57.5" height="52.3"/></g><g class="nw1"><use href="#ill-z-auge" x="231.9" y="72.8" width="54.0" height="36"/><use href="#ill-z-herz" x="288.9" y="72.8" width="39.6" height="36"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="280.2" y="117.4">W. e. F. a. u. s. z. b.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="280.2" y="117.4">W. e. F. a. f. s. z. b.</tspan></text></g></g></g><g class="dg-link" data-a="181.0,96.3" data-b="193.0,96.3"><path d="M181.0 96.3L193.0 96.3" stroke="#3B3226" stroke-width="1.4" stroke-linecap="round"/><path d="M188.6 98.7L193.0 96.3L188.6 93.9" fill="none" stroke="#3B3226" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></g><g class="dg-cell"><rect x="8.0" y="135.7" width="171.5" height="78.5" rx="4" fill="#EFE6D6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#ill-z-trennen" x="62.9" y="154.3" width="32.0" height="20"/><use href="#ill-brief" x="97.9" y="154.3" width="26.7" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="93.8" y="183.3">Wer seine Frau entlässt, soll ihr</tspan><tspan x="93.8" y="193.0">einen Scheidebrief geben.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="93.8" y="183.3">Wer sini Frau entlaat, söll ire en</tspan><tspan x="93.8" y="193.0">Scheidigsbrief gää.</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-z-trennen" x="24.3" y="151.7" width="74.2" height="46.4"/><use href="#ill-brief" x="101.4" y="151.7" width="61.8" height="46.4"/></g><g class="nw1"><use href="#ill-z-trennen" x="39.5" y="151.5" width="57.6" height="36"/><use href="#ill-brief" x="100.1" y="151.5" width="48.0" height="36"/><text text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#6B5E4B"><tspan x="93.8" y="196.0">W. s. F. e. s. i. e. S. g.</tspan></text></g></g></g><g class="dg-cell"><rect x="194.5" y="135.7" width="171.5" height="78.5" rx="4" fill="#FFF4D6" stroke="#3B3226" stroke-width="1.3"/><g class="dg-full"><use href="#ill-z-trennen" x="264.2" y="139.7" width="32.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="280.2" y="168.8">Wer seine Frau entlässt, ausser</tspan><tspan x="280.2" y="178.5">wegen Unzucht, macht, dass mit ihr</tspan><tspan x="280.2" y="188.1">die Ehe gebrochen wird;</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="280.2" y="168.8">Wer sini Frau entlaat, ussert wäge</tspan><tspan x="280.2" y="178.5">Unzucht, macht, dass mit ire d Ee</tspan><tspan x="280.2" y="188.1">broche wird;</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="280.2" y="198.8">wer eine Entlassene heiratet, bricht die</tspan><tspan x="280.2" y="207.8">Ehe.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="280.2" y="198.8">wer e Entlasseni hüratet, bricht d Ee.</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-z-trennen" x="230.6" y="144.0" width="99.2" height="62.0"/></g><g class="nw1"><use href="#ill-z-trennen" x="251.4" y="151.5" width="57.6" height="36"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="280.2" y="196.0">W. s. F. e. a. w. U. m. d. m. i. d. E. g. w.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="280.2" y="196.0">W. s. F. e. u. w. U. m. d. m. i. d. E. b. w.</tspan></text></g></g></g><g class="dg-link" data-a="181.0,175.0" data-b="193.0,175.0"><path d="M181.0 175.0L193.0 175.0" stroke="#3B3226" stroke-width="1.4" stroke-linecap="round"/><path d="M188.6 177.4L193.0 175.0L188.6 172.6" fill="none" stroke="#3B3226" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></g></g></g><circle cx="13" cy="13" r="9" fill="#FFFDF6" stroke="#3B3226"/><text x="13" y="17.5" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3B3226">1</text></g><g transform="translate(194 0)"><clipPath id="ill-cp-2-194-0"><rect width="186" height="140" rx="10"/></clipPath><g clip-path="url(#ill-cp-2-194-0)"><rect width="186" height="140" fill="#F4E7D3"/><rect y="118" width="186" height="22" fill="#E2CDA8"/><circle cx="38.0" cy="18.0" r="11.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#ill-p-jesus" x="29.6" y="8.8" width="16.8" height="18.0"/><rect x="54.0" y="8" width="312.0" height="20.0" rx="7" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1"/><path d="M55.0 15L49.0 18L55.0 21" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1" stroke-linejoin="round"/><path d="M55.2 15.6V20.4" stroke="#FFFFFF" stroke-width="1.4"/><g class="dg-sw"><g class="dg-full"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.3">Wenn dich etwas zu Fall bringt:</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.3">Wänn dich öppis z Fall bringt:</tspan></text></g><g class="dg-nw" display="none"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.0" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.2">W. d. e. z. F. b.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.0" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.2">W. d. ö. z. F. b.</tspan></text></g></g><g class="dg-vis" data-visual="grid"><g class="dg-cell"><rect x="8.0" y="34.0" width="116.0" height="77.0" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#ill-z-auge" x="51.0" y="47.0" width="30.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="66.0" y="76.0">Dein rechtes Auge</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="66.0" y="76.0">Dis rächt Aug</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="66.0" y="86.7">→ reiss es heraus und wirf</tspan><tspan x="66.0" y="95.6">es weg!</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="66.0" y="86.7">→ riiss s use und wirf s</tspan><tspan x="66.0" y="95.6">wäg!</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-z-auge" x="20.4" y="42.1" width="91.1" height="60.8"/></g><g class="nw1"><use href="#ill-z-auge" x="39.0" y="49.0" width="54.0" height="36"/><text text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="66.0" y="93.6">D. r. A.</tspan></text></g></g></g><g class="dg-cell"><rect x="129.0" y="34.0" width="116.0" height="77.0" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#ill-z-hand" x="179.0" y="47.0" width="16.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="187.0" y="76.0">Deine rechte Hand</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="187.0" y="76.0">Dini rächt Hand</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="187.0" y="86.7">→ hau sie ab und wirf sie</tspan><tspan x="187.0" y="95.6">weg!</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="187.0" y="86.7">→ hau si ab und wirf si wäg!</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-z-hand" x="162.7" y="42.1" width="48.6" height="60.8"/></g><g class="nw1"><use href="#ill-z-hand" x="172.6" y="49.0" width="28.8" height="36"/><text text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="187.0" y="93.6">D. r. H.</tspan></text></g></g></g><g class="dg-cell"><rect x="250.0" y="34.0" width="116.0" height="77.0" rx="4" fill="#FFF4D6" stroke="#3B3226" stroke-width="1.3"/><g class="dg-full"><use href="#ill-z-gehenna" x="295.1" y="38" width="25.7" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="308.0" y="67.1">denn:</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="308.0" y="67.1">dänn:</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="308.0" y="77.7">Besser geht ein Glied</tspan><tspan x="308.0" y="86.7">verloren, als dass der</tspan><tspan x="308.0" y="95.6">ganze Leib in die Hölle</tspan><tspan x="308.0" y="104.6">kommt.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="308.0" y="77.7">Besser gaat eis Glid</tspan><tspan x="308.0" y="86.7">verlore, als dass de ganz</tspan><tspan x="308.0" y="95.6">Liib i d Höll chunnt.</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-z-gehenna" x="268.9" y="42.1" width="78.1" height="60.8"/></g><g class="nw1"><use href="#ill-z-gehenna" x="284.9" y="49.0" width="46.3" height="36"/><text text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="308.0" y="93.6">d.</tspan></text></g></g></g></g></g><circle cx="13" cy="13" r="9" fill="#FFFDF6" stroke="#3B3226"/><text x="13" y="17.5" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3B3226">2</text></g></svg>
