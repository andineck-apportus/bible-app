ize="8.2" font-weight="700" fill="#6B5E4B"><tspan x="96.2" y="175.4">Regen, Fluten und Winde schlagen an</tspan><tspan x="96.2" y="185.0">das Haus</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="96.2" y="175.4">Räge, Hochwasser und Wind schlönd a s</tspan><tspan x="96.2" y="185.0">Huus</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-z-sturm" x="65.9" y="148.8" width="60.6" height="36.4"/></g><g class="nw1"><use href="#ill-z-sturm" x="71.8" y="146.8" width="49.0" height="29.4"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#6B5E4B"><tspan x="96.2" y="184.7">R. F. u. W. s. a. d. H.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#6B5E4B"><tspan x="96.2" y="184.7">R. H. u. W. s. a. s. H.</tspan></text></g></g></g><g class="dg-cell"><rect x="189.5" y="142.3" width="176.5" height="49.4" rx="4" fill="#FFF4D6" stroke="#3B3226" stroke-width="1.3"/><g class="dg-full"><use href="#ill-z-sturm" x="261.1" y="146.3" width="33.3" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="277.8" y="175.4">Regen, Fluten und Winde prallen gegen</tspan><tspan x="277.8" y="185.0">das Haus</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="277.8" y="175.4">Räge, Hochwasser und Wind pralled</tspan><tspan x="277.8" y="185.0">gäge s Huus</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-z-sturm" x="247.4" y="148.8" width="60.6" height="36.4"/></g><g class="nw1"><use href="#ill-z-sturm" x="253.3" y="146.8" width="49.0" height="29.4"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weigh