<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 186 140"><g transform="translate(0 0)"><clipPath id="ill-cp-1-0-0"><rect width="186" height="140" rx="10"/></clipPath><g clip-path="url(#ill-cp-1-0-0)"><rect width="186" height="140" fill="#F4E7D3"/><rect y="118" width="186" height="22" fill="#E2CDA8"/><circle cx="38.0" cy="18.0" r="11.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#ill-p-jesus" x="29.6" y="8.8" width="16.8" height="18.0"/><g class="dg-sw"><rect x="54.0" y="8" width="312.0" height="28.3" rx="7" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1"/><path d="M55.0 15L49.0 18L55.0 21" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1" stroke-linejoin="round"/><path d="M55.2 15.6V20.4" stroke="#FFFFFF" stroke-width="1.4"/><g class="dg-full"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="210.0" y="19.4">Übt eure Gerechtigkeit nicht vor den Menschen, um gesehen zu</tspan><tspan x="210.0" y="29.5">werden! Sonst habt ihr keinen Lohn beim Vater.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="210.0" y="19.4">Üebed eui Grächtigkeit nöd vor de Lüüt, damit si eu gsehnd!</tspan><tspan x="210.0" y="29.5">Suscht händ ir kei Loon bim Vatter.</tspan></text></g><g class="dg-nw" display="none"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="9.0" font-weight="700" fill="#3B3226"><tspan x="210.0" y="24.6">Ü. e. G. n. v. d. M. u. g. z. w. S. h. i. k. L. b. V.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="9.0" font-weight="700" fill="#3B3226"><tspan x="210.0" y="24.6">Ü. e. G. n. v. d. L. d. s. e. g. S. h. i. k. L. b. V.</tspan></text></g></g><g class="dg-vis" data-visual="columns"><g class="dg-sw"><rect x="8.0" y="42.3" width="176.5" height="15.0" rx="3" fill="#E3D4BA" stroke="#3B3226" stroke-width=".9"/><g class="dg-full"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="96.2" y="51.8">die Heuchler</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="96.2" y="51.8">d Hüüchler</tspan></text></g><g class="dg-nw" display="none"><text text-anchor="middle" font-family="sans-serif" font-size="6.5" font-weight="700" fill="#3B3226"><tspan x="96.2" y="51.5">d. H.</tspan></text></g></g><g class="dg-sw"><rect x="189.5" y="42.3" width="176.5" height="15.0" rx="3" fill="#F2D9A0" stroke="#3B3226" stroke-width=".9"/><g class="dg-full"><text text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="277.8" y="51.8">du aber</tspan></text></g><g class="dg-nw" display="none"><text text-anchor="middle" font-family="sans-serif" font-size="6.5" font-weight="700" fill="#3B3226"><tspan x="277.8" y="51.5">d. a.</tspan></text></g></g><g class="dg-cell"><rect x="8.0" y="61.3" width="176.5" height="49.4" rx="4" fill="#EFE6D6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><circle cx="20.0" cy="85.9" r="10.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#ill-p-heuchler" x="12.4" y="77.7" width="15.1" height="16.2"/><use href="#ill-posaune" x="96.2" y="65.3" width="20.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="106.2" y="94.3">Sie blasen die Posaune vor sich</tspan><tspan x="106.2" y="104.0">her</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="106.2" y="94.3">Si blaased d Posuune vor sich här</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-posaune" x="78.1" y="67.7" width="36.4" height="36.4"/></g><g class="nw1"><use href="#ill-posaune" x="81.6" y="65.8" width="29.4" height="29.4"/><text text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#6B5E4B"><tspan x="96.2" y="103.7">S. b. d. P. v. s. h.</tspan></text></g></g></g><g class="dg-cell"><rect x="189.5" y="61.3" width="176.5" height="49.4" rx="4" fill="#FFF4D6" stroke="#3B3226" stroke-width="1.3"/><g class="dg-full"><circle cx="201.5" cy="85.9" r="10.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#ill-p-juenger" x="193.9" y="77.7" width="15.1" height="16.2"/><use href="#ill-z-hand" x="279.8" y="65.3" width="16.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="287.8" y="94.3">Deine linke Hand soll nicht wissen,</tspan><tspan x="287.8" y="104.0">was die rechte tut</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="287.8" y="94.3">Dini linggi Hand söll nöd wüsse,</tspan><tspan x="287.8" y="104.0">was dini rächti macht</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-z-hand" x="263.2" y="67.7" width="29.1" height="36.4"/></g><g class="nw1"><use href="#ill-z-hand" x="266.0" y="65.8" width="23.5" height="29.4"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="277.8" y="103.7">D. l. H. s. n. w. w. d. r. t.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="277.8" y="103.7">D. l. H. s. n. w. w. d. r. m.</tspan></text></g></g></g><g class="dg-cell"><rect x="8.0" y="115.6" width="176.5" height="39.7" rx="4" fill="#EFE6D6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="96.2" y="132.8">Sie wollen von den Menschen gerühmt</tspan><tspan x="96.2" y="142.5">werden</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="96.2" y="132.8">Si wänd vo de Lüüt grüemt wärde</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="96.2" y="137.7">S. w. v. d. M. g. w.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="96.2" y="137.7">S. w. v. d. L. g. w.</tspan></text></g></g></g><g class="dg-cell"><rect x="189.5" y="115.6" width="176.5" height="39.7" rx="4" fill="#FFF4D6" stroke="#3B3226" stroke-width="1.3"/><g class="dg-full"><use href="#ill-z-almosen" x="266.5" y="119.6" width="22.5" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="277.8" y="148.7">Dein Almosen bleibt im Verborgenen</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="277.8" y="148.7">Diis Almose bliibt im Verborgne</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-z-almosen" x="262.1" y="121.5" width="31.4" height="27.9"/></g><g class="nw1"><use href="#ill-z-almosen" x="266.7" y="120.1" width="22.2" height="19.7"/><text text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="277.8" y="148.4">D. A. b. i. V.</tspan></text></g></g></g><g class="dg-cell"><rect x="8.0" y="160.3" width="176.5" height="49.4" rx="4" fill="#EFE6D6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#ill-z-lohn-erhalten" x="86.2" y="169.1" width="20.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="96.2" y="198.2">Sie haben ihren Lohn schon erhalten</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="96.2" y="198.2">Si händ ire Loon scho übercho</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-z-lohn-erhalten" x="78.1" y="166.8" width="36.4" height="36.4"/></g><g class="nw1"><use href="#ill-z-lohn-erhalten" x="81.6" y="164.8" width="29.4" height="29.4"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#6B5E4B"><tspan x="96.2" y="202.7">S. h. i. L. s. e.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#6B5E4B"><tspan x="96.2" y="202.7">S. h. i. L. s. ü.</tspan></text></g></g></g><g class="dg-cell"><rect x="189.5" y="160.3" width="176.5" height="49.4" rx="4" fill="#FFF4D6" stroke="#3B3226" stroke-width="1.3"/><g class="dg-full"><use href="#ill-gott" x="255.5" y="164.3" width="20.0" height="20"/><use href="#ill-z-schatz" x="278.5" y="164.3" width="21.4" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="277.8" y="193.3">Dein Vater, der ins Verborgene sieht,</tspan><tspan x="277.8" y="203.0">wird es dir vergelten</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="277.8" y="193.3">Diin Vatter, wo is Verborgne gseht,</tspan><tspan x="277.8" y="203.0">wird s dir vergälte</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-gott" x="238.6" y="166.8" width="36.4" height="36.4"/><use href="#ill-z-schatz" x="278.0" y="166.8" width="39.0" height="36.4"/></g><g class="nw1"><use href="#ill-gott" x="245.8" y="164.8" width="29.4" height="29.4"/><use href="#ill-z-schatz" x="278.2" y="164.8" width="31.5" height="29.4"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="277.8" y="202.7">D. V. d. i. V. s. w. e. d. v.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="277.8" y="202.7">D. V. w. i. V. g. w. s. d. v.</tspan></text></g></g></g></g></g></g></svg>
