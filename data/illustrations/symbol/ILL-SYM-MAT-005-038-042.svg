n></text></g><g class="dg-nw" display="none"><text text-anchor="middle" font-family="sans-serif" font-size="9.0" font-weight="700" fill="#3B3226"><tspan x="46.8" y="56.7">I. h. g.</tspan></text></g></g><g class="dg-sw"><rect x="100.5" y="42.3" width="77.5" height="23.9" rx="3" fill="#F2D9A0" stroke="#3B3226" stroke-width=".9"/><g class="dg-full"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="139.2" y="51.8">Ich aber sage</tspan><tspan x="139.2" y="60.8">euch …</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="139.2" y="51.8">Ich aber säg eu …</tspan></text></g><g class="dg-nw" display="none"><text text-anchor="middle" font-family="sans-serif" font-size="9.0" font-weight="700" fill="#3B3226"><tspan x="139.2" y="56.7">I. a. s. e.</tspan></text></g></g><g class="dg-cell"><rect x="8.0" y="70.2" width="77.5" height="59.0" rx="4" fill="#EFE6D6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#ill-z-auge" x="31.8" y="74.2" width="30.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="46.8" y="103.3">Auge um Auge</tspan><tspan x="46.8" y="113.0">und Zahn um</tspan><tspan x="46.8" y="122.6">Zahn.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="46.8" y="103.3">Aug um Aug und</tspan><tspan x="46.8" y="113.0">Zaa um Zaa.</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-z-auge" x="17.2" y="80.1" width="59.1" height="39.4"/></g><g class="nw1"><use href="#ill-z-auge" x="19.8" y="76.3" width="54.0" height="36"/><text text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#6B5E4B"><tspan x="46.8" y="120.8">A. u. A. u. Z. u. Z.</tspan></text></g></g></g><g class="dg-cell"><rect x="100.5" y="70.2" width="77.5" height="59.0" rx="4" fill="#FFF4D6" stroke="#3B3226" stroke-width="1.3"/><g class="dg-full"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="139.2" y="92.3">Ihr sollt dem</tspan><tspan x="139.2" y="102.0">Bösen nicht</tspan><tspan x="139.2" y="111.6">widerstehen.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="139.2" y="92.3">Ir söled em</tspan><tspan x="139.2" y="102.0">Bööse nöd</tspan><tspan x="139.2" y="111.6">widerstaa.</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="139.2" y="102.0">I. s. d. B. n. w.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="139.2" y="102.0">I. s. e. B. n. w.</tspan></text></g></g></g><g class="dg-link" data-a="87.0,99.7" data-b="99.0,99.7"><path d="M87.0 99.7L99.0 99.7" stroke="#3B3226" stroke-width="1.4" stroke-linecap="round"/><path d="M94.6 102.1L99.0 99.7L94.6 97.3" fill="none" stroke="#3B3226" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></g></g></g><circle cx="13" cy="13" r="9" fill="#FFFDF6" stroke="#3B3226"/><text x="13" y="17.5" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3B3226">1</text></g><g transform="translate(194 0)"><clipPath id="ill-cp-2-194-0"><rect width="186" height="140" rx="10"/></clipPath><g clip-path="url(#ill-cp-2-194-0)"><rect width="186" height="140" fill="#F4E7D3"/><rect y="118" width="186" height="22" fill="#E2CDA8"/><circle cx="38.0" cy="18.0" r="11.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#ill-p-jesus" x="29.6" y="8.8" width="16.8" height="18.0"/><g class="dg-sw"><rect x="54.0" y="8" width="312.0" height="20.0" rx="7" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1"/><path d="M55.0 15L49.0 18L55.0 21" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1" stroke-linejoin="round"/><path d="M55.2 15.6V20.4" stroke="#FFFFFF" stroke-width="1.4"/><g class="dg-full"><text text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.3">Sondern:</tspan></text></g><g class="dg-nw" display="none"><text text-anchor="middle" font-family="sans-serif" font-size="8.0" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.2">S.</tspan></text></g></g><g class="dg-vis" data-visual="grid"><g class="dg-cell"><rect x="8.0" y="34.0" width="85.8" height="78.5" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#ill-z-ohrfeige" x="37.8" y="38" width="26.2" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="50.9" y="67.1">Wer dich auf die</tspan><tspan x="50.9" y="76.7">rechte Wange</tspan><tspan x="50.9" y="86.4">schlägt,</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="50.9" y="67.1">Wer dich uf de</tspan><tspan x="50.9" y="76.7">rächt Bagge</tspan><tspan x="50.9" y="86.4">schlaat,</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="50.9" y="97.1">dem halte auch die</tspan><tspan x="50.9" y="106.0">andere hin.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="50.9" y="97.1">däm heb au de ander</tspan><tspan x="50.9" y="106.0">ane.</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-z-ohrfeige" x="17.8" y="48.0" width="66.1" height="50.5"/></g><g class="nw1"><use href="#ill-z-ohrfeige" x="27.3" y="49.7" width="47.1" height="36"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="50.9" y="94.3">W. d. a. d. r. W. s.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="50.9" y="94.3">W. d. u. d. r. B. s.</tspan></text></g></g></g><g class="dg-cell"><rect x="98.8" y="34.0" width="85.8" height="78.5" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#ill-gewand" x="119.5" y="42.8" width="20.0" height="20"/><use href="#ill-obergewand" x="142.5" y="42.8" width="21.2" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="141.6" y="71.9">Wer dein Hemd</tspan><tspan x="141.6" y="81.6">nehmen will,</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="141.6" y="71.9">Wer dis Hemd nää</tspan><tspan x="141.6" y="81.6">will,</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="141.6" y="92.2">dem lass auch den</tspan><tspan x="141.6" y="101.2">Mantel.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="141.6" y="92.2">däm la au de Mantel.</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-gewand" x="108.6" y="57.6" width="30.6" height="30.6"/><use href="#ill-obergewand" x="142.2" y="57.6" width="32.5" height="30.6"/></g><g class="nw1"><use href="#ill-gewand" x="108.6" y="49.7" width="30.8" height="30.8"/><use href="#ill-obergewand" x="142.4" y="49.7" width="32.7" height="30.8"/><text text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="141.6" y="94.3">W. d. H. n. w.</tspan></text></g></g></g><g class="dg-cell"><rect x="189.5" y="34.0" width="85.8" height="78.5" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#ill-meilenstein" x="223.6" y="42.5" width="17.6" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="232.4" y="71.5">Wer dich zwingt,</tspan><tspan x="232.4" y="81.2">eine Meile</tspan><tspan x="232.4" y="90.9">mitzugehen,</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="232.4" y="71.5">Wer dich zwingt,</tspan><tspan x="232.4" y="81.2">ei Meile mitzgaa,</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="232.4" y="101.5">mit dem geh zwei.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="232.4" y="101.5">mit däm gang zwei.</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-meilenstein" x="205.0" y="42.2" width="54.7" height="62.0"/></g><g class="nw1"><use href="#ill-meilenstein" x="216.5" y="49.7" width="31.8" height="36"/><text text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="232.4" y="94.3">W. d. z. e. M. m.</tspan></text></g></g></g><g class="dg-cell"><rect x="280.2" y="34.0" width="85.8" height="78.5" rx="4" fill="#EFE6D6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#ill-z-geben" x="309.0" y="38.4" width="28.3" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="323.1" y="67.4">Gib dem, der dich</tspan><tspan x="323.1" y="77.1">bittet,</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="323.1" y="67.4">Gib däm, wo dich</tspan><tspan x="323.1" y="77.1">bittet,</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#6B5E4B"><tspan x="323.1" y="87.7">und wende dich</tspan><tspan x="323.1" y="96.7">nicht ab von dem,</tspan><tspan x="323.1" y="105.7">der borgen will.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#6B5E4B"><tspan x="323.1" y="87.7">und cheer di nöd ab</tspan><tspan x="323.1" y="96.7">vo däm, wo öppis</tspan><tspan x="323.1" y="105.7">entlehne will.</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-z-geben" x="290.1" y="49.9" width="66.1" height="46.6"/></g><g class="nw1"><use href="#ill-z-geben" x="297.6" y="49.7" width="51.0" height="36"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#6B5E4B"><tspan x="323.1" y="94.3">G. d. d. d. b.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#6B5E4B"><tspan x="323.1" y="94.3">G. d. w. d. b.</tspan></text></g></g></g></g></g><circle cx="13" cy="13" r="9" fill="#FFFDF6" stroke="#3B3226"/><text x="13" y="17.5" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3B3226">2</text></g></svg>
