<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 140"><g transform="translate(0 0)"><clipPath id="ill-cp-1-0-0"><rect width="186" height="140" rx="10"/></clipPath><g clip-path="url(#ill-cp-1-0-0)"><rect width="186" height="140" fill="#F4E7D3"/><rect y="118" width="186" height="22" fill="#E2CDA8"/><circle cx="38.0" cy="18.0" r="11.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#ill-p-jesus" x="29.6" y="8.8" width="16.8" height="18.0"/><rect x="54.0" y="8" width="312.0" height="28.3" rx="7" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1"/><path d="M55.0 15L49.0 18L55.0 21" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1" stroke-linejoin="round"/><path d="M55.2 15.6V20.4" stroke="#FFFFFF" stroke-width="1.4"/><g class="dg-sw"><g class="dg-full"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="210.0" y="19.4">Sie kommen in Schafskleidern zu euch, innen aber sind sie</tspan><tspan x="210.0" y="29.5">reissende Wölfe.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="210.0" y="19.4">Si chömed i Schaafchleider zu eu, inne aber sind s riissendi Wölf.</tspan></text></g><g class="dg-nw" display="none"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="9.0" font-weight="700" fill="#3B3226"><tspan x="210.0" y="24.6">S. k. i. S. z. e. i. a. s. s. r. W.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="9.0" font-weight="700" fill="#3B3226"><tspan x="210.0" y="24.6">S. c. i. S. z. e. i. a. s. s. r. W.</tspan></text></g></g><g class="dg-vis" data-visual="rings"><rect x="6" y="42.3" width="362.0" height="133.6" rx="10" fill="#FBEFD5" stroke="#3B3226" stroke-width="1.2"/><g class="dg-cell"><rect x="12.0" y="46.3" width="350.0" height="48.8" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="6.5" font-weight="700" fill="#8A6A2A"><tspan x="187.0" y="55.9">am Anfang und am Schluss</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="6.5" font-weight="700" fill="#8A6A2A"><tspan x="187.0" y="55.9">am Aafang und am Schluss</tspan></text><use href="#ill-schaf" x="153.9" y="59.5" width="30.9" height="20"/><use href="#ill-wolf" x="187.8" y="59.5" width="32.3" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="187.0" y="88.5">An ihren Früchten werdet ihr sie erkennen</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="187.0" y="88.5">A irne Frücht wärded ir si erchänne</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-schaf" x="128.7" y="52.7" width="55.6" height="35.9"/><use href="#ill-wolf" x="187.2" y="52.7" width="58.1" height="35.9"/></g><g class="nw1"><use href="#ill-schaf" x="139.9" y="50.8" width="44.6" height="28.9"/><use href="#ill-wolf" x="187.5" y="50.8" width="46.6" height="28.9"/><text text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="187.0" y="88.2">A. i. F. w. i. s. e.</tspan></text></g></g></g><g transform="translate(10 101.1)"><g class="dg-cell"><rect x="8.0" y="0.0" width="109.3" height="68.8" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#ill-baum-gut" x="55.8" y="4" width="13.6" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="62.7" y="33.1">Jeder gute Baum</tspan><tspan x="62.7" y="42.7">bringt gute Früchte</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="62.7" y="33.1">Jede guet Baum bringt</tspan><tspan x="62.7" y="42.7">gueti Frücht</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="62.7" y="53.4">Er kann keine schlechten</tspan><tspan x="62.7" y="62.4">Früchte bringen.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="62.7" y="53.4">Er cha kei schlächti</tspan><tspan x="62.7" y="62.4">Frücht bringe.</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-baum-gut" x="44.4" y="7.6" width="36.5" height="53.5"/></g><g class="nw1"><use href="#ill-baum-gut" x="50.4" y="10.9" width="24.5" height="36"/><text text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="62.7" y="55.4">J. g. B. b. g. F.</tspan></text></g></g></g><g class="dg-cell"><rect x="122.3" y="0.0" width="109.3" height="68.8" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#ill-baum-faul" x="170.2" y="4" width="13.6" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="177.0" y="33.1">Der faule Baum bringt</tspan><tspan x="177.0" y="42.7">schlechte Früchte</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="177.0" y="33.1">De fuul Baum bringt</tspan><tspan x="177.0" y="42.7">schlächti Frücht</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="177.0" y="53.4">Er kann keine guten</tspan><tspan x="177.0" y="62.4">Früchte bringen.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="177.0" y="53.4">Er cha kei gueti Frücht</tspan><tspan x="177.0" y="62.4">bringe.</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-baum-faul" x="158.8" y="7.6" width="36.5" height="53.5"/></g><g class="nw1"><use href="#ill-baum-faul" x="164.7" y="10.9" width="24.5" height="36"/><text text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="177.0" y="55.4">D. f. B. b. s. F.</tspan></text></g></g></g><g class="dg-cell"><rect x="236.7" y="0.0" width="109.3" height="68.8" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#ill-axt-wurzel" x="269.7" y="4.0" width="18.9" height="20"/><use href="#ill-feuer" x="291.6" y="4.0" width="21.4" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="291.3" y="33.1">Jeder Baum ohne gute</tspan><tspan x="291.3" y="42.8">Frucht wird umgehauen</tspan><tspan x="291.3" y="52.4">und ins Feuer</tspan><tspan x="291.3" y="62.1">geworfen</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="291.3" y="33.1">Jede Baum ohni gueti</tspan><tspan x="291.3" y="42.8">Frucht wird umghaue</tspan><tspan x="291.3" y="52.4">und is Füür gworfe</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-axt-wurzel" x="248.3" y="13.6" width="39.0" height="41.3"/><use href="#ill-feuer" x="290.2" y="13.6" width="44.2" height="41.3"/></g><g class="nw1"><use href="#ill-axt-wurzel" x="253.5" y="6.4" width="34.0" height="36"/><use href="#ill-feuer" x="290.5" y="6.4" width="38.6" height="36"/><text text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="291.3" y="51.0">J. B. o. g. F. w. u. u. i. F.</tspan><tspan x="291.3" y="59.9">g.</tspan></text></g></g></g></g></g></g><circle cx="13" cy="13" r="9" fill="#FFFDF6" stroke="#3B3226"/><text x="13" y="17.5" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3B3226">1</text></g><g transform="translate(194 0)"><clipPath id="ill-cp-2-194-0"><rect width="186" height="140" rx="10"/></clipPath><g clip-path="url(#ill-cp-2-194-0)"><rect width="186" height="140" fill="#F4E7D3"/><rect y="118" width="186" height="22" fill="#E2CDA8"/><circle cx="38.0" cy="18.0" r="11.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#ill-p-jesus" x="29.6" y="8.8" width="16.8" height="18.0"/><rect x="54.0" y="8" width="312.0" height="28.3" rx="7" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1"/><path d="M55.0 15L49.0 18L55.0 21" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1" stroke-linejoin="round"/><path d="M55.2 15.6V20.4" stroke="#FFFFFF" stroke-width="1.4"/><g class="dg-sw"><g class="dg-full"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="210.0" y="19.4">Ins Reich der Himmel kommt, wer den Willen meines Vaters in den</tspan><tspan x="210.0" y="29.5">Himmeln tut.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="210.0" y="19.4">Is Riich vo de Himel chunnt, wer de Wile vo mim Vatter i de Himel</tspan><tspan x="210.0" y="29.5">tuet.</tspan></text></g><g class="dg-nw" display="none"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="9.0" font-weight="700" fill="#3B3226"><tspan x="210.0" y="24.6">I. R. d. H. k. w. d. W. m. V. i. d. H. t.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="9.0" font-weight="700" fill="#3B3226"><tspan x="210.0" y="24.6">I. R. v. d. H. c. w. d. W. v. m. V. i. d. H. t.</tspan></text></g></g><g class="dg-vis" data-visual="dialogue"><circle cx="19.0" cy="60.6" r="12.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#ill-p-gast2" x="9.8" y="52.0" width="9.2" height="18.2"/><use href="#ill-p-gast" x="19.0" y="52.0" width="9.2" height="18.2"/><use href="#ill-p-menge" x="14.4" y="50.4" width="9.2" height="19.8"/><g class="dg-cell"><rect x="36.0" y="42.3" width="330.0" height="36.5" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="6.5" font-weight="700" fill="#8A6A2A"><tspan x="201.0" y="51.9">An jenem Tag werden viele sagen:</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="6.5" font-weight="700" fill="#8A6A2A"><tspan x="201.0" y="51.9">A dem Tag wärded vil säge:</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="201.0" y="62.5">«Herr, Herr, haben wir nicht in deinem Namen prophezeit, Dämonen</tspan><tspan x="201.0" y="72.2">ausgetrieben und viele Machttaten getan?»</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="201.0" y="62.5">«Herr, Herr, händ mir nöd i dim Name profezeit, Dämone ustribe und vil</tspan><tspan x="201.0" y="72.2">Machttate tue?»</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="201.0" y="62.8">H. H. h. w. n. i. d. N. p. D. a. u. v. M. g.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="201.0" y="62.8">H. H. h. m. n. i. d. N. p. D. u. u. v. M. t.</tspan></text></g></g></g><path d="M36.5 56.6L31.0 60.6L36.5 64.6" fill="#FFFDF6" stroke="#3B3226" stroke-width=".9" stroke-linejoin="round"/><circle cx="355.0" cy="108.2" r="12.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#ill-p-jesus" x="345.8" y="98.1" width="18.5" height="19.8"/><g class="dg-cell"><rect x="8.0" y="83.8" width="330.0" height="48.8" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="6.5" font-weight="700" fill="#8A6A2A"><tspan x="173.0" y="93.4">Dann wird Jesus antworten:</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="6.5" font-weight="700" fill="#8A6A2A"><tspan x="173.0" y="93.4">Dänn wird de Jesus antworte:</tspan></text><use href="#ill-z-ablehnen" x="164.9" y="97.0" width="16.2" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="173.0" y="126.0">«Nie habe ich euch gekannt. Weicht von mir, die ihr Gesetzlosigkeit übt!»</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="173.0" y="126.0">«Nie han ich eu kännt. Gönd weg vo mir, ir, wo Gsetzlosigkeit tüend!»</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-z-ablehnen" x="158.4" y="90.3" width="29.2" height="35.9"/></g><g class="nw1"><use href="#ill-z-ablehnen" x="161.3" y="88.3" width="23.5" height="28.9"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="173.0" y="125.7">N. h. i. e. g. W. v. m. d. i. G. ü.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="173.0" y="125.7">N. h. i. e. k. G. w. v. m. i. w. G. t.</tspan></text></g></g></g><path d="M337.5 104.2L343.0 108.2L337.5 112.2" fill="#FFFDF6" stroke="#3B3226" stroke-width=".9" stroke-linejoin="round"/></g></g><circle cx="13" cy="13" r="9" fill="#FFFDF6" stroke="#3B3226"/><text x="13" y="17.5" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3B3226">2</text></g></svg>
