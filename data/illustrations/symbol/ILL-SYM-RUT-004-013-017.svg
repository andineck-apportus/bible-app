<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 288"><g transform="translate(0 0)"><clipPath id="ill-cp-1-0-0"><rect width="186" height="140" rx="10"/></clipPath><g clip-path="url(#ill-cp-1-0-0)"><rect width="186" height="140" fill="#F4E7D3"/><rect y="118" width="186" height="22" fill="#E2CDA8"/><use href="#ill-gott" x="26" y="3" width="40" height="40"/><use href="#ill-p-boas" x="69.9" y="58" width="28.1" height="60"/><use href="#ill-p-rut" x="109.9" y="58" width="28.1" height="60"/><use href="#ill-z-geburt" x="136" y="63.6" width="22" height="15"/><path d="M60.7 33.4Q105.4 31.1 134.2 65.5" fill="none" stroke="#FFFDF6" stroke-width="4.4" stroke-linecap="round" opacity=".8"/><path d="M60.7 33.4Q105.4 31.1 134.2 65.5" fill="none" stroke="#C08A2A" stroke-width="2" stroke-linecap="round"/><path d="M127.8 62.6L134.2 65.5L132.5 58.7" fill="none" stroke="#C08A2A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g class="ill-name"><rect x="71.0" y="125.5" width="26.0" height="10" rx="5" fill="#FFFDF6" stroke="#3B3226" stroke-width=".7"/><text x="84.0" y="133.0" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="700" fill="#3B3226">Boas</text></g><g class="ill-name"><rect x="113.2" y="125.5" width="21.5" height="10" rx="5" fill="#FFFDF6" stroke="#3B3226" stroke-width=".7"/><text x="124.0" y="133.0" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="700" fill="#3B3226">Rut</text></g></g><circle cx="13" cy="13" r="9" fill="#FFFDF6" stroke="#3B3226"/><text x="13" y="17.5" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3B3226">1</text></g><g transform="translate(194 0)"><clipPath id="ill-cp-2-194-0"><rect width="186" height="140" rx="10"/></clipPath><g clip-path="url(#ill-cp-2-194-0)"><rect width="186" height="140" fill="#F4E7D3"/><rect y="118" width="186" height="22" fill="#E2CDA8"/><circle cx="38.0" cy="18.0" r="11.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#ill-p-g-frauen" x="29.6" y="8.8" width="16.8" height="18.0"/><rect x="54.0" y="8" width="312.0" height="20.0" rx="7" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1"/><path d="M55.0 15L49.0 18L55.0 21" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1" stroke-linejoin="round"/><path d="M55.2 15.6V20.4" stroke="#FFFFFF" stroke-width="1.4"/><g class="dg-sw"><g class="dg-full"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.3">Gepriesen sei JHWH, der dich heute nicht ohne Löser gelassen hat!</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.3">Globt sig JHWH, wo dich hüt nöd ohni Löser glaa hät!</tspan></text></g><g class="dg-nw" display="none"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.0" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.2">G. s. J. d. d. h. n. o. L. g. h.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.0" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.2">G. s. J. w. d. h. n. o. L. g. h.</tspan></text></g></g><g class="dg-vis" data-visual="arrows"><g class="dg-cell"><rect x="8.0" y="34.0" width="171.0" height="68.8" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><circle cx="20.0" cy="68.4" r="10.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#ill-p-rut" x="12.4" y="60.1" width="15.1" height="16.2"/><use href="#ill-z-geburt" x="89.1" y="38" width="28.9" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="103.5" y="67.1">Deine Schwiegertochter, die dich</tspan><tspan x="103.5" y="76.7">liebt, hat ihn geboren</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="103.5" y="67.1">Dini Schwigertochter, wo dich</tspan><tspan x="103.5" y="76.7">gern hät, hät en übercho</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="103.5" y="87.4">Sie ist für dich besser als sieben</tspan><tspan x="103.5" y="96.4">Söhne.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="103.5" y="87.4">Si isch für dich besser als sibe Söhn.</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-z-geburt" x="54.9" y="41.6" width="77.3" height="53.5"/></g><g class="nw1"><use href="#ill-z-geburt" x="67.5" y="44.9" width="52.0" height="36"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="93.5" y="89.4">D. S. d. d. l. h. i. g.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="93.5" y="89.4">D. S. w. d. g. h. h. e. ü.</tspan></text></g></g></g><g class="dg-cell"><rect x="195.0" y="34.0" width="171.0" height="68.8" rx="4" fill="#FFF4D6" stroke="#3B3226" stroke-width="1.3"/><g class="dg-full"><circle cx="207.0" cy="68.4" r="10.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#ill-p-obed" x="199.4" y="60.1" width="15.1" height="16.2"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="290.5" y="60.5">Er wird dir das Leben</tspan><tspan x="290.5" y="70.2">zurückbringen</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="290.5" y="60.5">Er wird dir s Läbe zruggbringe</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="290.5" y="80.9">und dich in deinem Alter versorgen.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="290.5" y="80.9">und dich i dim Alter versorge.</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-p-obed" x="268.0" y="41.6" width="25.1" height="53.5"/></g><g class="nw1"><use href="#ill-p-obed" x="272.1" y="44.9" width="16.9" height="36"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="280.5" y="89.4">E. w. d. d. L. z.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="280.5" y="89.4">E. w. d. s. L. z.</tspan></text></g></g></g><g class="dg-link" data-a="180.5,68.4" data-b="193.5,68.4"><path d="M180.5 68.4L193.5 68.4" stroke="#3B3226" stroke-width="1.4" stroke-linecap="round"/><path d="M189.1 70.8L193.5 68.4L189.1 66.0" fill="none" stroke="#3B3226" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></g></g></g><circle cx="13" cy="13" r="9" fill="#FFFDF6" stroke="#3B3226"/><text x="13" y="17.5" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3B3226">2</text></g><g transform="translate(97 148)"><clipPath id="ill-cp-3-97-148"><rect width="186" height="140" rx="10"/></clipPath><g clip-path="url(#ill-cp-3-97-148)"><rect width="186" height="140" fill="#F4E7D3"/><rect y="118" width="186" height="22" fill="#E2CDA8"/><use href="#ill-p-g-frauen" x="35.9" y="58" width="28.1" height="60"/><path d="M59.0 83.2L70.0 88.2" stroke="#3B3226" stroke-width="2.2" stroke-linecap="round"/><use href="#ill-p-noomi" x="125.9" y="58" width="28.1" height="60"/><use href="#ill-p-obed" x="142.7" y="85.0" width="20" height="20"/><g><path d="M36 9.1H111A8 8 0 0 1 119 17.1V33.1A8 8 0 0 1 111 41.1L54.5 41.1L50 63.1L45.5 41.1H36A8 8 0 0 1 28 33.1V17.1A8