<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 140"><g transform="translate(0 0)"><clipPath id="ill-cp-1-0-0"><rect width="186" height="140" rx="10"/></clipPath><g clip-path="url(#ill-cp-1-0-0)"><rect width="186" height="140" fill="#F4E7D3"/><rect y="118" width="186" height="22" fill="#E2CDA8"/><circle cx="38.0" cy="18.0" r="11.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#ill-p-paulus" x="29.6" y="8.8" width="16.8" height="18.0"/><rect x="54.0" y="8" width="312.0" height="20.0" rx="7" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1"/><path d="M55.0 15L49.0 18L55.0 21" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1" stroke-linejoin="round"/><path d="M55.2 15.6V20.4" stroke="#FFFFFF" stroke-width="1.4"/><g class="dg-sw"><g class="dg-full"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.3">Zum Schluss des Briefes</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.3">Zum Schluss vom Brief</tspan></text></g><g class="dg-nw" display="none"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.0" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.2">Z. S. d. B.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.0" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.2">Z. S. v. B.</tspan></text></g></g><g class="dg-vis" data-visual="outline"><g class="dg-cell"><rect x="8.0" y="34.0" width="176.5" height="86.9" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><circle cx="20.0" cy="77.5" r="10.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#ill-p-titus" x="12.4" y="69.2" width="15.1" height="16.2"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="6.5" font-weight="700" fill="#8A6A2A"><tspan x="106.2" y="43.6">Reisen</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="6.5" font-weight="700" fill="#8A6A2A"><tspan x="106.2" y="43.6">Reise</tspan></text><use href="#ill-z-weg" x="91.2" y="47.2" width="30.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="106.2" y="76.2">Beeile dich, zu mir nach Nikopolis</tspan><tspan x="106.2" y="85.9">zu kommen!</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="106.2" y="76.2">Chumm schnäll zu mir uf Nikopolis!</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="106.2" y="96.6">wenn ich Artemas oder Tychikus</tspan><tspan x="106.2" y="105.5">schicke; dort will ich den Winter</tspan><tspan x="106.2" y="114.5">verbringen</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="106.2" y="96.6">wänn ich de Artemas oder de Tychikus</tspan><tspan x="106.2" y="105.5">schicke; dört wott ich de Winter</tspan><tspan x="106.2" y="114.5">verbringe</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-z-weg" x="44.2" y="42.7" width="104.2" height="69.5"/></g><g class="nw1"><use href="#ill-z-weg" x="69.2" y="54.0" width="54.0" height="36"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="96.2" y="98.5">B. d. z. m. n. N. z. k.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="96.2" y="98.5">C. s. z. m. u. N.</tspan></text></g></g></g><g class="dg-cell"><rect x="189.5" y="34.0" width="176.5" height="86.9" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><circle cx="201.5" cy="77.5" r="10.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#ill-p-apollos" x="193.9" y="69.2" width="15.1" height="16.2"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="6.5" font-weight="700" fill="#8A6A2A"><tspan x="287.8" y="63.6">Ausrüsten</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="6.5" font-weight="700" fill="#8A6A2A"><tspan x="287.8" y="63.6">Usrüschte</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="287.8" y="74.2">Rüste Zenas und Apollos</tspan><tspan x="287.8" y="83.9">sorgfältig für die Reise aus!</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="287.8" y="74.2">Rüscht de Zenas und de Apollos</tspan><tspan x="287.8" y="83.9">sorgfältig für d Reis us!</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="287.8" y="94.5">damit ihnen nichts fehlt</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="287.8" y="94.5">demit ine nüt fäält</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-p-apollos" x="261.5" y="42.7" width="32.6" height="69.5"/></g><g class="nw1"><use href="#ill-p-apollos" x="269.3" y="54.0" width="16.9" height="36"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="277.8" y="98.5">R. Z. u. A. s. f. d. R. a.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="277.8" y="98.5">R. d. Z. u. d. A. s. f. d. R. u.</tspan></text></g></g></g><g class="dg-cell"><rect x="8.0" y="125.9" width="176.5" height="69.0" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="6.5" font-weight="700" fill="#8A6A2A"><tspan x="96.2" y="135.5">Letzte Mahnung</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="6.5" font-weight="700" fill="#8A6A2A"><tspan x="96.2" y="135.5">Letschti Mahnig</tspan></text><use href="#ill-z-gute-werke" x="84.7" y="139.1" width="23.1" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="96.2" y="168.1">Auch die Unseren sollen lernen, sich</tspan><tspan x="96.2" y="177.8">für gute Werke einzusetzen,</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="96.2" y="168.1">Au di Öise söled lerne, sich für gueti</tspan><tspan x="96.2" y="177.8">Wärch iizsetze,</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="96.2" y="188.5">damit sie nicht ohne Frucht sind.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="96.2" y="188.5">demit si nöd ohni Frucht sind.</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-z-gute-werke" x="65.3" y="133.6" width="61.9" height="53.7"/></g><g class="nw1"><use href="#ill-z-gute-werke" x="75.5" y="136.9" width="41.5" height="36"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="96.2" y="181.5">A. d. U. s. l. s. f. g. W. e.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="96.2" y="181.5">A. d. Ö. s. l. s. f. g. W. i.</tspan></text></g></g></g><g class="dg-cell"><rect x="189.5" y="125.9" width="176.5" height="69.0" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><circle cx="201.5" cy="160.4" r="10.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#ill-p-paulus" x="193.9" y="152.1" width="15.1" height="16.2"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="6.5" font-weight="700" fill="#8A6A2A"><tspan x="287.8" y="135.5">Grüsse</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="6.5" font-weight="700" fill="#8A6A2A"><tspan x="287.8" y="135.5">Grüess</tspan></text><use href="#ill-z-gruessen" x="277.8" y="139.1" width="20.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="287.8" y="168.1">Es grüssen dich alle, die bei mir</tspan><tspan x="287.8" y="177.8">sind.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="287.8" y="168.1">Es grüessed dich alli, wo bi mir</tspan><tspan x="287.8" y="177.8">sind.</tspan></text><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="287.8" y="188.5">Grüsse die, die uns im Glauben lieben.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="400" fill="#3B3226"><tspan x="287.8" y="188.5">Grüess die, wo üs im Glaube gern händ.</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-z-gruessen" x="250.9" y="133.6" width="53.7" height="53.7"/></g><g class="nw1"><use href="#ill-z-gruessen" x="259.8" y="136.9" width="36.0" height="36"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="277.8" y="181.5">E. g. d. a. d. b. m. s.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="277.8" y="181.5">E. g. d. a. w. b. m. s.</tspan></text></g></g></g><g class="dg-cell"><rect x="8.0" y="199.9" width="358.0" height="48.8" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="6.5" font-weight="700" fill="#8A6A2A"><tspan x="187.0" y="209.5">Segen</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="6.5" font-weight="700" fill="#8A6A2A"><tspan x="187.0" y="209.5">Säge</tspan></text><use href="#ill-z-gnade" x="176.2" y="213.1" width="21.5" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="187.0" y="242.1">Die Gnade sei mit euch allen.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="187.0" y="242.1">D Gnad sig mit eu allne.</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-z-gnade" x="167.6" y="206.4" width="38.7" height="35.9"/></g><g class="nw1"><use href="#ill-z-gnade" x="171.5" y="204.4" width="31.1" height="28.9"/><text text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="187.0" y="241.8">D. G. s. m. e. a.</tspan></text></g></g></g></g></g><circle cx="13" cy="13" r="9" fill="#FFFDF6" stroke="#3B3226"/><text x="13" y="17.5" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3B3226">1</text></g><g transform="translate(194 0)"><clipPath id="ill-cp-2-194-0"><rect width="186" height="140" rx="10"/></clipPath><g clip-path="url(#ill-cp-2-194-0)"><rect width="186" height="140" fill="#F4E7D3"/><rect y="118" width="186" height="22" fill="#E2CDA8"/><re