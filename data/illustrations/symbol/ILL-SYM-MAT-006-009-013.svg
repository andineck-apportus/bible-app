<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 186 140"><g transform="translate(0 0)"><clipPath id="ill-cp-1-0-0"><rect width="186" height="140" rx="10"/></clipPath><g clip-path="url(#ill-cp-1-0-0)"><rect width="186" height="140" fill="#F4E7D3"/><rect y="118" width="186" height="22" fill="#E2CDA8"/><circle cx="38.0" cy="18.0" r="11.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#ill-p-jesus" x="29.6" y="8.8" width="16.8" height="18.0"/><g class="dg-sw"><rect x="54.0" y="8" width="312.0" height="20.0" rx="7" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1"/><path d="M55.0 15L49.0 18L55.0 21" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1" stroke-linejoin="round"/><path d="M55.2 15.6V20.4" stroke="#FFFFFF" stroke-width="1.4"/><g class="dg-full"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.3">So sollt ihr nun beten: Unser Vater in den Himmeln …</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.3">Eso söled ir also bätte: Öise Vatter i de Himel …</tspan></text></g><g class="dg-nw" display="none"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.0" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.2">S. s. i. n. b. U. V. i. d. H.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.0" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.2">E. s. i. a. b. Ö. V. i. d. H.</tspan></text></g></g><g class="dg-vis" data-visual="levels"><g class="dg-label"><rect x="7.5" y="34.7" width="69.5" height="8.8" rx="4.2" fill="#FFF8E8" stroke="#C9B48A" stroke-width=".5"/><text class="lw lw-de" x="10.0" y="41.0" text-anchor="start" font-family="sans-serif" font-size="7" font-weight="700" fill="#8A6A2A">Bitten mit «dein»</text><text class="lw lw-gsw" x="10.0" y="41.0" text-anchor="start" font-family="sans-serif" font-size="7" font-weight="700" fill="#8A6A2A">Bitte mit «diin»</text></g><g class="dg-cell"><rect x="8.0" y="44.0" width="116.0" height="59.0" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#ill-z-name-gottes" x="54.7" y="52.8" width="22.7" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="66.0" y="81.9">Dein Name werde</tspan><tspan x="66.0" y="91.6">geheiligt</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="66.0" y="81.9">Diin Name söll gheiliget</tspan><tspan x="66.0" y="91.6">wärde</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-z-name-gottes" x="40.6" y="51.1" width="50.9" height="44.9"/></g><g class="nw1"><use href="#ill-z-name-gottes" x="45.6" y="50.0" width="40.8" height="36"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="66.0" y="94.6">D. N. w. g.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="66.0" y="94.6">D. N. s. g. w.</tspan></text></g></g></g><g class="dg-cell"><rect x="129.0" y="44.0" width="116.0" height="59.0" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#ill-z-reich-gottes" x="176.3" y="57.7" width="21.4" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="187.0" y="86.7">Dein Reich komme</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="187.0" y="86.7">Diis Riich söll choo</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-z-reich-gottes" x="162.9" y="51.1" width="48.1" height="44.9"/></g><g class="nw1"><use href="#ill-z-reich-gottes" x="167.7" y="50.0" width="38.6" height="36"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="187.0" y="94.6">D. R. k.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="187.0" y="94.6">D. R. s. c.</tspan></text></g></g></g><g class="dg-cell"><rect x="250.0" y="44.0" width="116.0" height="59.0" rx="4" fill="#FFFDF6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#ill-z-wille-gottes" x="296.0" y="48" width="24.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="308.0" y="77.1">Dein Wille geschehe, wie</tspan><tspan x="308.0" y="86.7">im Himmel, so auch auf</tspan><tspan x="308.0" y="96.4">Erden</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="308.0" y="77.1">Diin Wile söll gschee, wie</tspan><tspan x="308.0" y="86.7">im Himel, eso au uf de</tspan><tspan x="308.0" y="96.4">Ärde</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-z-wille-gottes" x="281.1" y="51.1" width="53.9" height="44.9"/></g><g class="nw1"><use href="#ill-z-wille-gottes" x="289.9" y="48.5" width="36.1" height="30.1"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="308.0" y="87.1">D. W. g. w. i. H. s. a. a. E.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="308.0" y="87.1">D. W. s. g. w. i. H. e. a. u.</tspan><tspan x="308.0" y="96.1">d. Ä.</tspan></text></g></g></g><g class="dg-label"><rect x="7.5" y="111.7" width="67.0" height="8.8" rx="4.2" fill="#FFF8E8" stroke="#C9B48A" stroke-width=".5"/><text class="lw lw-de" x="10.0" y="118.0" text-anchor="start" font-family="sans-serif" font-size="7" font-weight="700" fill="#8A6A2A">Bitten mit «uns»</text><text class="lw lw-gsw" x="10.0" y="118.0" text-anchor="start" font-family="sans-serif" font-size="7" font-weight="700" fill="#8A6A2A">Bitte mit «üs»</text></g><g class="dg-cell"><rect x="8.0" y="121.0" width="116.0" height="68.7" rx="4" fill="#FFF4D6" stroke="#3B3226" stroke-width="1.3"/><g class="dg-full"><use href="#ill-brot" x="48.9" y="134.7" width="34.3" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="66.0" y="163.8">Unser tägliches Brot gib</tspan><tspan x="66.0" y="173.4">uns heute</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="66.0" y="163.8">Öises täglich Broot gib</tspan><tspan x="66.0" y="173.4">üs hüt</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-brot" x="20.2" y="128.7" width="91.6" height="53.4"/></g><g class="nw1"><use href="#ill-brot" x="35.1" y="131.9" width="61.7" height="36"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="66.0" y="176.4">U. t. B. g. u. h.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="66.0" y="176.4">Ö. t. B. g. ü. h.</tspan></text></g></g></g><g class="dg-cell"><rect x="129.0" y="121.0" width="116.0" height="68.7" rx="4" fill="#FFF4D6" stroke="#3B3226" stroke-width="1.3"/><g class="dg-full"><use href="#ill-z-vergeben" x="174.9" y="125.0" width="24.3" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="187.0" y="154.1">Vergib uns unsere</tspan><tspan x="187.0" y="163.8">Schulden, wie auch wir</tspan><tspan x="187.0" y="173.4">unseren Schuldnern</tspan><tspan x="187.0" y="183.1">vergeben haben</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="187.0" y="154.1">Vergib üs öisi Schulde,</tspan><tspan x="187.0" y="163.8">wie au mir öisne</tspan><tspan x="187.0" y="173.4">Schuldner vergää händ</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-z-vergeben" x="154.6" y="128.7" width="64.9" height="53.4"/></g><g class="nw1"><use href="#ill-z-vergeben" x="165.1" y="127.4" width="43.7" height="36"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="187.0" y="171.9">V. u. u. S. w. a. w. u. S. v.</tspan><tspan x="187.0" y="180.9">h.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="187.0" y="171.9">V. ü. ö. S. w. a. m. ö. S. v.</tspan><tspan x="187.0" y="180.9">h.</tspan></text></g></g></g><g class="dg-cell"><rect x="250.0" y="121.0" width="116.0" height="68.7" rx="4" fill="#FFF4D6" stroke="#3B3226" stroke-width="1.3"/><g class="dg-full"><use href="#ill-z-versuchung" x="287.6" y="129.9" width="14.7" height="20"/><use href="#ill-z-boeses" x="305.3" y="129.9" width="23.1" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="308.0" y="158.9">Führe uns nicht in</tspan><tspan x="308.0" y="168.6">Versuchung, sondern</tspan><tspan x="308.0" y="178.3">rette uns vor dem Bösen</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="308.0" y="158.9">Füer üs nöd i d</tspan><tspan x="308.0" y="168.6">Versuechig, sondern</tspan><tspan x="308.0" y="178.3">rett üs vor em Bööse</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-z-versuchung" x="262.1" y="131.8" width="34.5" height="47.1"/><use href="#ill-z-boeses" x="299.6" y="131.8" width="54.3" height="47.1"/></g><g class="nw1"><use href="#ill-z-versuchung" x="272.5" y="127.4" width="26.4" height="36"/><use href="#ill-z-boeses" x="301.9" y="127.4" width="41.5" height="36"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="308.0" y="171.9">F. u. n. i. V. s. r. u. v. d. B.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="308.0" y="171.9">F. ü. n. i. d. V. s. r. ü. v. e.</tspan><tspan x="308.0" y="180.9">B.</tspan></text></g></g></g></g></g></g></svg>
