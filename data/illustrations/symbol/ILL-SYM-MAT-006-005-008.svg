<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 140"><g transform="translate(0 0)"><clipPath id="ill-cp-1-0-0"><rect width="186" height="140" rx="10"/></clipPath><g clip-path="url(#ill-cp-1-0-0)"><rect width="186" height="140" fill="#F4E7D3"/><rect y="118" width="186" height="22" fill="#E2CDA8"/><circle cx="38.0" cy="18.0" r="11.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#ill-p-jesus" x="29.6" y="8.8" width="16.8" height="18.0"/><g class="dg-sw"><rect x="54.0" y="8" width="312.0" height="20.0" rx="7" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1"/><path d="M55.0 15L49.0 18L55.0 21" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1" stroke-linejoin="round"/><path d="M55.2 15.6V20.4" stroke="#FFFFFF" stroke-width="1.4"/><g class="dg-full"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.3">Wenn ihr betet, sollt ihr nicht sein wie die Heuchler!</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.3">Wänn ir bätted, söled ir nöd sii wie d Hüüchler!</tspan></text></g><g class="dg-nw" display="none"><text text-anchor="middle" font-family="sans-serif" font-size="8.0" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.2">W. i. b. s. i. n. s. w. d. H.</tspan></text></g></g><g class="dg-vis" data-visual="columns"><g class="dg-sw"><rect x="8.0" y="34.0" width="176.5" height="15.0" rx="3" fill="#E3D4BA" stroke="#3B3226" stroke-width=".9"/><g class="dg-full"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="96.2" y="43.5">die Heuchler</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="96.2" y="43.5">d Hüüchler</tspan></text></g><g class="dg-nw" display="none"><text text-anchor="middle" font-family="sans-serif" font-size="6.5" font-weight="700" fill="#3B3226"><tspan x="96.2" y="43.2">d. H.</tspan></text></g></g><g class="dg-sw"><rect x="189.5" y="34.0" width="176.5" height="15.0" rx="3" fill="#F2D9A0" stroke="#3B3226" stroke-width=".9"/><g class="dg-full"><text text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="277.8" y="43.5">du aber</tspan></text></g><g class="dg-nw" display="none"><text text-anchor="middle" font-family="sans-serif" font-size="6.5" font-weight="700" fill="#3B3226"><tspan x="277.8" y="43.2">d. a.</tspan></text></g></g><g class="dg-cell"><rect x="8.0" y="53.0" width="176.5" height="59.0" rx="4" fill="#EFE6D6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><circle cx="20.0" cy="82.5" r="10.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#ill-p-heuchler" x="12.4" y="74.2" width="15.1" height="16.2"/><use href="#ill-z-beten" x="97.1" y="57.0" width="18.3" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="106.2" y="86.0">Sie beten an den Strassenecken,</tspan><tspan x="106.2" y="95.7">damit sie sich den Menschen</tspan><tspan x="106.2" y="105.4">zeigen</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="106.2" y="86.0">Si bätted a de Strasseegge, dass</tspan><tspan x="106.2" y="95.7">d Lüüt si gsehnd</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-z-beten" x="75.7" y="60.0" width="41.2" height="44.9"/></g><g class="nw1"><use href="#ill-z-beten" x="79.8" y="59.0" width="33.0" height="36"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#6B5E4B"><tspan x="96.2" y="103.5">S. b. a. d. S. d. s. s. d. M. z.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#6B5E4B"><tspan x="96.2" y="103.5">S. b. a. d. S. d. d. L. s. g.</tspan></text></g></g></g><g class="dg-cell"><rect x="189.5" y="53.0" width="176.5" height="59.0" rx="4" fill="#FFF4D6" stroke="#3B3226" stroke-width="1.3"/><g class="dg-full"><circle cx="201.5" cy="82.5" r="10.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#ill-p-juenger" x="193.9" y="74.2" width="15.1" height="16.2"/><use href="#ill-kammer" x="273.5" y="57.0" width="28.6" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="287.8" y="86.0">Geh in deine Kammer, schliess die</tspan><tspan x="287.8" y="95.7">Tür und bete zu deinem Vater im</tspan><tspan x="287.8" y="105.4">Verborgenen</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="287.8" y="86.0">Gang i dini Chammer, mach d Tür</tspan><tspan x="287.8" y="95.7">zue und bätt zu diim Vatter im</tspan><tspan x="287.8" y="105.4">Verborgne</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-kammer" x="245.7" y="60.0" width="64.1" height="44.9"/></g><g class="nw1"><use href="#ill-kammer" x="252.0" y="59.0" width="51.4" height="36"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="277.8" y="103.5">G. i. d. K. s. d. T. u. b. z. d. V. i. V.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="277.8" y="103.5">G. i. d. C. m. d. T. z. u. b. z. d. V. i. V.</tspan></text></g></g></g><g class="dg-cell"><rect x="8.0" y="117.0" width="176.5" height="49.4" rx="4" fill="#EFE6D6" stroke="#3B3226" stroke-width="0.9"/><g class="dg-full"><use href="#ill-z-lohn-erhalten" x="86.2" y="125.8" width="20.0" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="96.2" y="154.9">Sie haben ihren Lohn schon erhalten</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#6B5E4B"><tspan x="96.2" y="154.9">Si händ ire Loon scho übercho</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-z-lohn-erhalten" x="78.1" y="123.5" width="36.4" height="36.4"/></g><g class="nw1"><use href="#ill-z-lohn-erhalten" x="81.6" y="121.5" width="29.4" height="29.4"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#6B5E4B"><tspan x="96.2" y="159.4">S. h. i. L. s. e.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#6B5E4B"><tspan x="96.2" y="159.4">S. h. i. L. s. ü.</tspan></text></g></g></g><g class="dg-cell"><rect x="189.5" y="117.0" width="176.5" height="49.4" rx="4" fill="#FFF4D6" stroke="#3B3226" stroke-width="1.3"/><g class="dg-full"><use href="#ill-gott" x="255.5" y="121.0" width="20.0" height="20"/><use href="#ill-z-schatz" x="278.5" y="121.0" width="21.4" height="20"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="277.8" y="150.0">Dein Vater, der ins Verborgene sieht,</tspan><tspan x="277.8" y="159.7">wird es dir vergelten</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.2" font-weight="700" fill="#3B3226"><tspan x="277.8" y="150.0">Diin Vatter, wo is Verborgne gseht,</tspan><tspan x="277.8" y="159.7">wird s dir vergälte</tspan></text></g><g class="dg-nw" display="none"><g class="nw0"><use href="#ill-gott" x="238.6" y="123.5" width="36.4" height="36.4"/><use href="#ill-z-schatz" x="278.0" y="123.5" width="39.0" height="36.4"/></g><g class="nw1"><use href="#ill-gott" x="245.8" y="121.5" width="29.4" height="29.4"/><use href="#ill-z-schatz" x="278.2" y="121.5" width="31.5" height="29.4"/><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="277.8" y="159.4">D. V. d. i. V. s. w. e. d. v.</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="7.6" font-weight="700" fill="#3B3226"><tspan x="277.8" y="159.4">D. V. w. i. V. g. w. s. d. v.</tspan></text></g></g></g></g></g><circle cx="13" cy="13" r="9" fill="#FFFDF6" stroke="#3B3226"/><text x="13" y="17.5" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3B3226">1</text></g><g transform="translate(194 0)"><clipPath id="ill-cp-2-194-0"><rect width="186" height="140" rx="10"/></clipPath><g clip-path="url(#ill-cp-2-194-0)"><rect width="186" height="140" fill="#F4E7D3"/><rect y="118" width="186" height="22" fill="#E2CDA8"/><circle cx="38.0" cy="18.0" r="11.0" fill="#FFFDF6" stroke="#3B3226" stroke-width=".8"/><use href="#ill-p-jesus" x="29.6" y="8.8" width="16.8" height="18.0"/><g class="dg-sw"><rect x="54.0" y="8" width="312.0" height="20.0" rx="7" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1"/><path d="M55.0 15L49.0 18L55.0 21" fill="#FFFFFF" stroke="#3B3226" stroke-width="1.1" stroke-linejoin="round"/><path d="M55.2 15.6V20.4" stroke="#FFFFFF" stroke-width="1.4"/><g class="dg-full"><text class="lw lw-de" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.3">Wenn ihr aber betet …</tspan></text><text class="lw lw-gsw" text-anchor="middle" font-family="sans-serif" font-size="8.6" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.3">Wänn ir aber bätted …</tspan></text></g><g class="dg-nw" display="none"><text text-anchor="middle" font-family="sans-serif" font-size="8.0" font-weight="700" fill="#3B3226"><tspan x="210.0" y="20.2">W. i. a. b.</tspan></text></g></g><g class="dg-vis" data-visual="arrows"><g