<title>Markus 3,20–35 · Studienprototyp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: eine Spalte wie eine Editionsseite — oben die Zoomleiter, darunter Text, darunter «Apparat»; Details als Blatt von unten. */
:root {
  --paper: #f4f5f7;
  --sheet: #ffffff;
  --ink: #1b2233;
  --ink-soft: #4d566b;
  --rule: #d9dde5;
  --lapis: #2b4fb8;
  --lapis-soft: #e3e9f8;
  --lvl-breit: #1f7a5a;
  --lvl-mehr: #6c8a1f;
  --lvl-geteilt: #b7791f;
  --lvl-vereinzelt: #b4435a;
  --lvl-keine: #8a8f9c;
  --shadow: 0 -8px 30px rgba(20, 28, 48, .18);
  --f-text: "Gentium Book Plus", "Gentium Plus", "Noto Serif", Georgia, serif;
  --f-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12151d; --sheet: #1a1f2a; --ink: #e6e9f0; --ink-soft: #a3abbd; --rule: #2f3646;
    --lapis: #8fa9f0; --lapis-soft: #243259;
    --lvl-breit: #4cc296; --lvl-mehr: #a9c64a; --lvl-geteilt: #e2a64b; --lvl-vereinzelt: #ec7f95; --lvl-keine: #8d93a3;
    --shadow: 0 -8px 30px rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12151d; --sheet: #1a1f2a; --ink: #e6e9f0; --ink-soft: #a3abbd; --rule: #2f3646;
  --lapis: #8fa9f0; --lapis-soft: #243259;
  --lvl-breit: #4cc296; --lvl-mehr: #a9c64a; --lvl-geteilt: #e2a64b; --lvl-vereinzelt: #ec7f95; --lvl-keine: #8d93a3;
  --shadow: 0 -8px 30px rgba(0, 0, 0, .5); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.5; }
button { font: inherit; color: inherit; }
a { color: var(--lapis); }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 0 96px; }

/* Zoomleiter */
.ladder { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--rule); }
.ladder-inner { max-width: 760px; margin: 0 auto; padding: 10px 16px 8px; display: flex; flex-direction: column; gap: 8px; }
.brand { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.brand b { font-family: var(--f-text); font-size: 19px; font-weight: 700; letter-spacing: .01em; }
.brand small { font-family: var(--f-data); font-size: 11px; color: var(--ink-soft); }
.steps { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.steps::-webkit-scrollbar { display: none; }
.step { flex: 0 0 auto; border: 1px solid var(--rule); background: var(--sheet); border-radius: 999px; padding: 4px 11px; font-size: 13px; cursor: pointer; white-space: nowrap; }
.step[aria-current="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.step[disabled] { opacity: .45; cursor: default; }
.step:not([aria-current="true"]) .lvl { display: none; }
.step .lvl { font-family: var(--f-data); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; opacity: .7; margin-right: 6px; }

h1 { font-family: var(--f-text); font-weight: 700; font-size: 28px; line-height: 1.15; margin: 22px 0 4px; text-wrap: balance; }
h2 { font-family: var(--f-ui); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-soft); margin: 28px 0 10px; }
.lead { color: var(--ink-soft); margin: 0 0 6px; max-width: 62ch; }
.mono { font-family: var(--f-data); }

/* Buch */
.chapters { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 4px; align-items: end; height: 150px; margin-top: 8px; }
.ch { display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; height: 100%; cursor: pointer; border: 0; background: none; padding: 0; }
.ch .bar { border-radius: 3px 3px 0 0; background: var(--rule); width: 100%; display: flex; flex-direction: column-reverse; overflow: hidden; }
.ch .seg { width: 100%; }
.ch .lab { font-family: var(--f-data); font-size: 10px; color: var(--ink-soft); text-align: center; }
.ch.cur .lab { color: var(--lapis); font-weight: 600; }
.ch.cur .bar { outline: 2px solid var(--lapis); outline-offset: 1px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-soft); margin-top: 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-top: 14px; }
.stat { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; }
.stat b { display: block; font-family: var(--f-data); font-size: 20px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--ink-soft); }

/* Abschnitt: Verschachtelung */
.nest { display: flex; flex-direction: column; gap: 0; margin-top: 6px; }
.frame { border: 2px solid var(--ink); border-radius: 12px; padding: 0; overflow: hidden; }
.block { display: block; width: 100%; text-align: left; border: 0; background: var(--sheet); padding: 12px 14px; cursor: pointer; }
.block + .block { border-top: 1px solid var(--rule); }
.block:hover, .block:focus-visible { background: var(--lapis-soft); }
.block .r { font-family: var(--f-data); font-size: 12px; color: var(--lapis); }
.block .t { font-family: var(--f-text); font-size: 17px; display: block; }
.block.inner { background: var(--paper); padding-left: 28px; border-left: 6px solid var(--lapis); }
.block .tag { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); }

.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.cards { display: flex; flex-direction: column; gap: 10px; }
.kind { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .09em; }
.kind.befund { color: var(--lvl-breit); }
.kind.deutung { color: var(--lapis); }
.kind.prinzip { color: var(--lvl-geteilt); }
.kind.anwendung { color: var(--lvl-vereinzelt); }
.card p { margin: 0; max-width: 64ch; }
.caveat { font-size: 13px; color: var(--ink-soft); border-top: 1px dashed var(--rule); padding-top: 6px; }
.chip { display: inline-block; font-family: var(--f-data); font-size: 11px; border: 1px solid var(--rule); border-radius: 999px; padding: 1px 8px; color: var(--ink-soft); margin-right: 4px; }
.arrow { text-align: center; color: var(--ink-soft); font-size: 13px; }

/* Text */
.layers { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; margin: 6px 0 4px; }
.layers button { border: 0; background: var(--sheet); padding: 6px 12px; font-size: 13px; cursor: pointer; }
.layers button + button { border-left: 1px solid var(--rule); }
.layers button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.text { font-family: var(--f-text); font-size: 20px; line-height: 1.75; background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; }
.text.de { font-size: 18px; }
.vn { font-family: var(--f-data); font-size: 11px; color: var(--lapis); vertical-align: super; margin: 0 3px 0 6px; cursor: pointer; border: 0; background: none; padding: 0; }
.w { cursor: pointer; border-radius: 3px; padding: 0 1px; }
.w:hover, .w:focus-visible { background: var(--lapis-soft); outline: none; }
.w.var { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 5px; text-decoration-style: dotted; }
.w.sel { background: var(--lapis-soft); }
.il { display: flex; flex-wrap: wrap; gap: 10px 6px; }
.il .cell { display: flex; flex-direction: column; align-items: flex-start; padding: 4px 6px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; min-width: 0; }
.il .cell:hover, .il .cell:focus-visible { border-color: var(--rule); background: var(--paper); outline: none; }
.il .g { font-family: var(--f-text); font-size: 19px; }
.il .d { font-size: 13px; color: var(--ink); }
.il .e { font-size: 11px; color: var(--ink-soft); }
.il .m { font-family: var(--f-data); font-size: 10px; color: var(--ink-soft); }
.il .vno { flex-basis: 100%; font-family: var(--f-data); font-size: 11px; color: var(--lapis); margin-top: 6px; }

/* Varianten */
.var-list { display: flex; flex-direction: column; gap: 10px; }
.vu { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; }
.vu header { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--ink-soft); }
.rd { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 6px 0; border-top: 1px dashed var(--rule); }
.rd:first-of-type { border-top: 0; }
.rd .gk { font-family: var(--f-text); font-size: 17px; min-width: 0; overflow-wrap: anywhere; }
.rd .eds { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px; }
.ed { font-family: var(--f-data); font-size: 10.5px; border-radius: 4px; padding: 1px 6px; border: 1px solid var(--rule); color: var(--ink-soft); }
.ed.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.meter { display: inline-flex; gap: 2px; }
.meter i { width: 9px; height: 9px; border-radius: 2px; background: var(--rule); }
.lvl-name { font-size: 12px; font-weight: 600; margin-left: 6px; }
.limits { font-size: 12.5px; color: var(--ink-soft); }
.limits summary { cursor: pointer; color: var(--lapis); }
.limits ul { margin: 6px 0 0; padding-left: 18px; }

/* Blatt */
.scrim { position: fixed; inset: 0; background: rgba(10, 14, 24, .35); z-index: 9; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--sheet); border-radius: 16px 16px 0 0; box-shadow: var(--shadow); max-height: 82%; overflow-y: auto; padding: 8px 16px calc(20px + env(safe-area-inset-bottom, 0px)); }
.sheet-inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.grab { width: 40px; height: 4px; border-radius: 2px; background: var(--rule); margin: 4px auto 6px; }
.sheet h3 { font-family: var(--f-text); font-size: 30px; font-weight: 400; margin: 0; }
.sheet .sub { color: var(--ink-soft); font-size: 13px; }
.kv { display: grid; grid-template-columns: 9.5em minmax(0, 1fr); gap: 4px 12px; font-size: 14px; }
.kv dt { color: var(--ink-soft); }
.kv dd { margin: 0; min-width: 0; }
.close { align-self: flex-end; border: 1px solid var(--rule); background: var(--paper); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
.diff { background: var(--paper); border-radius: 8px; padding: 8px 10px; font-size: 13px; }

/* Studienpfad */
.guide { display: flex; flex-direction: column; gap: 8px; counter-reset: s; }
.gstep { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; text-align: left; cursor: pointer; }
.gstep::before { counter-increment: s; content: counter(s); font-family: var(--f-data); font-weight: 500; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--lapis-soft); color: var(--lapis); }
.gstep b { display: block; }
.gstep span { font-size: 13px; color: var(--ink-soft); }
.fab { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 6; background: var(--lapis); color: #fff; border: 0; border-radius: 999px; padding: 11px 18px; font-weight: 600; box-shadow: 0 6px 18px rgba(30, 50, 120, .3); cursor: pointer; }
:root[data-theme="dark"] .fab { color: #10162a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .fab { color: #10162a; } }

footer { margin-top: 40px; font-size: 12px; color: var(--ink-soft); border-top: 1px solid var(--rule); padding-top: 12px; display: flex; flex-direction: column; gap: 6px; }
:focus-visible { outline: 2px solid var(--lapis); outline-offset: 2px; }
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: up .22s ease-out; }
  @keyframes up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
}
@media (max-width: 420px) { .text { font-size: 19px; padding: 12px; } h1 { font-size: 25px; } .chapters { gap: 2px; } }
</style>

<nav class="ladder" aria-label="Zoomstufen">
  <div class="ladder-inner">
    <div class="brand"><b>Markus 3,20–35</b><small id="buildinfo">Prototyp · Datenstand v0.9</small></div>
    <div class="steps" id="steps"></div>
  </div>
</nav>
<main class="wrap" id="main"></main>
<button class="fab" id="fab" type="button">Studieren</button>
<div id="sheetHost"></div>

<script>
const DATA = /*__DATA__*/null;
const LV = { breit: "var(--lvl-breit)", mehrheitlich: "var(--lvl-mehr)", geteilt: "var(--lvl-geteilt)", vereinzelt: "var(--lvl-vereinzelt)", keine: "var(--lvl-keine)" };
const LV_ORDER = ["breit", "mehrheitlich", "geteilt", "vereinzelt"];
const ED_SHORT = { "ED-SBLGNT": "SBLGNT", "ED-WH": "WH", "ED-TREG": "Treg", "ED-NA28": "NA28", "ED-RP": "RP" };
const ED_ALL = Object.keys(ED_SHORT);
const DE = {
  pos: { noun: "Substantiv", verb: "Verb", adj: "Adjektiv", det: "Artikel", pron: "Pronomen", conj: "Konjunktion", prep: "Präposition", adv: "Adverb", ptcl: "Partikel", num: "Zahlwort" },
  person: { first: "1. Person", second: "2. Person", third: "3. Person" },
  number: { singular: "Singular", plural: "Plural" },
  gender: { masculine: "maskulin", feminine: "feminin", neuter: "neutrum" },
  case: { nominative: "Nominativ", genitive: "Genitiv", dative: "Dativ", accusative: "Akkusativ", vocative: "Vokativ" },
  tense: { present: "Präsens", imperfect: "Imperfekt", future: "Futur", aorist: "Aorist", perfect: "Perfekt", pluperfect: "Plusquamperfekt" },
  voice: { active: "Aktiv", middle: "Medium", passive: "Passiv" },
  mood: { indicative: "Indikativ", subjunctive: "Konjunktiv", imperative: "Imperativ", infinitive: "Infinitiv", participle: "Partizip", optative: "Optativ" },
  degree: { comparative: "Komparativ", superlative: "Superlativ" },
  role: { s: "Subjekt", v: "Prädikat", o: "Objekt", o2: "zweites Objekt", io: "indirektes Objekt", adv: "Adverbiale", p: "Prädikativ", vc: "Kopula", aux: "Hilfsverb" },
  subtype: { personal: "Personal-", common: "", demonstrative: "Demonstrativ-", substantive: "", relative: "Relativ-", interrogative: "Interrogativ-", indefinite: "Indefinit-", proper: "Eigenname", possessive: "Possessiv-" },
  conf: { high: "hoch", probable: "wahrscheinlich", possible: "möglich" }
};
const wordsById = Object.fromEntries(DATA.words.map(w => [w.id, w]));
const varByTok = {};
DATA.variants.forEach(u => u.tokens.forEach(t => (varByTok[t] = varByTok[t] || []).push(u)));
const shown = t => t.replace(/[\u2E00-\u2E05]/g, "");  /* Apparatzeichen ⸀–⸅ nur in den Daten, nicht im Lesetext */
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const vrange = r => { const m = r.match(/MRK\.3\.(\d+)(?:-MRK\.3\.(\d+))?/); return [ +m[1], +(m[2] || m[1]) ]; };
const deRef = r => { const [a, b] = vrange(r); return a === b ? `3,${a}` : `3,${a}–${b}`; };

let state = { level: "abschnitt", part: "TU-MRK-003-022-030", verse: 29, layer: "de" };
try { const s = JSON.parse(localStorage.getItem("mk3proto") || "null"); if (s && s.level) state = { ...state, ...s }; } catch (e) {}
const save = () => { try { localStorage.setItem("mk3proto", JSON.stringify(state)); } catch (e) {} };

function unitLevel(u) {
  if (!u.assessment) return null;
  const r1 = u.assessment.find(a => a.reading === "R1");
  return r1 ? r1.level : null;
}
function worstLevelForToken(id) {
  const us = varByTok[id]; if (!us) return null;
  let worst = null;
  us.forEach(u => { const l = unitLevel(u); if (l && (worst === null || LV_ORDER.indexOf(l) > LV_ORDER.indexOf(worst))) worst = l; if (!l && !worst) worst = "keine"; });
  return worst;
}

/* ---------- Zoomleiter ---------- */
function renderSteps() {
  const part = DATA.section.parts.find(p => p.id === state.part);
  const items = [
    ["buch", "Buch", "Markus"],
    ["abschnitt", "Abschnitt", "3,20–35"],
    ["einheit", "Einheit", part ? deRef(part.range) : "–"],
    ["vers", "Vers", `3,${state.verse}`],
  ];
  document.getElementById("steps").innerHTML = items.map(([k, l, t]) =>
    `<button class="step" type="button" data-go="${k}" aria-current="${state.level === k}"><span class="lvl">${l}</span>${esc(t)}</button>`).join("");
}
document.getElementById("steps").addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b) go(b.dataset.go); });

function go(level, opts = {}) {
  Object.assign(state, opts, { level });
  save(); render(); window.scrollTo({ top: 0 });
}

/* ---------- Buch ---------- */
function viewBook() {
  const max = Math.max(...DATA.book.map(c => c.variants));
  const bars = DATA.book.map(c => {
    const h = Math.round(c.variants / max * 100);
    const total = c.variants || 1;
    const segs = LV_ORDER.map(l => `<span class="seg" style="height:${(c.levels[l] || 0) / total * 100}%;background:${LV[l]}"></span>`).join("");
    return `<button type="button" class="ch ${c.chapter === 3 ? "cur" : ""}" data-ch="${c.chapter}" aria-label="Kapitel ${c.chapter}: ${c.tokens} Wörter, ${c.variants} Variantenstellen">
      <span class="bar" style="height:${h}%">${segs}</span><span class="lab">${c.chapter}</span></button>`;
  }).join("");
  const sum = DATA.book.reduce((a, c) => { LV_ORDER.forEach(l => a[l] = (a[l] || 0) + (c.levels[l] || 0)); return a; }, {});
  const nv = DATA.book.reduce((a, c) => a + c.variants, 0);
  return `<h1>Das Markusevangelium</h1>
  <p class="lead">Variantenstellen je Kapitel im griechischen Text der SBLGNT. Die Farbe zeigt, wie viele der fünf verglichenen Editionen den Lesetext stützen.</p>
  <div class="chapters" id="chapters">${bars}</div>
  <div class="legend">${LV_ORDER.map(l => `<span><i style="background:${LV[l]}"></i>${l}</span>`).join("")}</div>
  <div class="stats">
    <div class="stat"><b>${DATA.book_tokens.toLocaleString("de-CH")}</b><span>Wörter (SBLGNT)</span></div>
    <div class="stat"><b>${DATA.book_lemmas.toLocaleString("de-CH")}</b><span>verschiedene Grundformen</span></div>
    <div class="stat"><b>${nv}</b><span>Variantenstellen</span></div>
    <div class="stat"><b>${sum.breit}</b><span>davon Lesetext breit gestützt</span></div>
  </div>
  <h2>Im Prototyp erschlossen</h2>
  <div class="cards"><button type="button" class="block" data-go="abschnitt" style="border:1px solid var(--rule);border-radius:10px">
    <span class="r">3,20–35</span><span class="t">${esc(DATA.section.title)}</span></button></div>`;
}

/* ---------- Abschnitt ---------- */
function card(kind, label, text, extra = "") {
  return `<div class="card"><span class="kind ${kind}">${label}</span><p>${esc(text)}</p>${extra}</div>`;
}
function viewSection() {
  const [a, b, c] = DATA.section.parts;
  const f = DATA.findings.find(x => x.id === "FIND-MRK-0005");
  const i = DATA.interpretations.find(x => x.id === "INT-MRK-0003");
  return `<h1>${esc(DATA.section.title)}</h1>
  <p class="lead">Markus 3,20–35 besteht aus drei Szenen. Die äussere Szene ist um die mittlere herumgelegt.</p>
  <div class="nest"><div class="frame">
    <button type="button" class="block" data-part="${a.id}"><span class="tag">Rahmen · Angehörige</span><span class="t">${esc(a.title)}</span><span class="r">${deRef(a.range)}</span></button>
    <button type="button" class="block inner" data-part="${b.id}"><span class="tag">Mitte · Schriftgelehrte</span><span class="t">${esc(b.title)}</span><span class="r">${deRef(b.range)}</span></button>
    <button type="button" class="block" data-part="${c.id}"><span class="tag">Rahmen · Mutter und Brüder</span><span class="t">${esc(c.title)}</span><span class="r">${deRef(c.range)}</span></button>
  </div></div>
  <h2>Was der Text sagt und was man daraus liest</h2>
  <div class="cards">
    ${card("befund", "Befund", f.claim, f.caveat ? `<div class="caveat">${esc(f.caveat)}</div>` : "")}
    <div class="arrow">wird gedeutet als</div>
    ${card("deutung", `Deutung · ${DE.conf[i.confidence] || i.confidence}`, i.claim,
      `<div class="caveat"><b>Unsicher:</b> ${esc(i.caveat)}</div>${i.counter.map(x => `<div class="caveat"><b>Gegenargument:</b> ${esc(x)}</div>`).join("")}`)}
  </div>`;
}

/* ---------- Einheit ---------- */
function verseWords(v) { return DATA.words.filter(w => w.v === v); }
function greekText(v) {
  return verseWords(v).map(w => {
    const l = worstLevelForToken(w.id);
    const style = l ? ` style="text-decoration-color:${LV[l]}"` : "";
    return `<span class="w ${l ? "var" : ""}" tabindex="0" role="button" data-w="${w.id}"${style}>${esc(shown(w.text))}</span>`;
  }).join(" ");
}
function layerButtons() {
  return `<div class="layers" role="group" aria-label="Textschicht">${[["de", "Deutsch"], ["gr", "Griechisch"], ["il", "Wort für Wort"]]
    .map(([k, l]) => `<button type="button" data-layer="${k}" aria-pressed="${state.layer === k}">${l}</button>`).join("")}</div>`;
}
function interlinear(vs) {
  return `<div class="il">${vs.map(v => `<span class="vno">Vers 3,${v}</span>` + verseWords(v).map(w => {
    const d = DATA.tok_de[w.id];
    const de = d ? (d.target === null ? "·" : (d.first ? d.target : "″")) : "—";
    const l = worstLevelForToken(w.id);
    return `<span class="cell" tabindex="0" role="button" data-w="${w.id}">
      <span class="g" ${l ? `style="text-decoration:underline dotted ${LV[l]};text-decoration-thickness:2px;text-underline-offset:5px"` : ""}>${esc(shown(w.text))}</span>
      <span class="d">${esc(de)}</span><span class="e">${esc(w.mac.gloss_berean || "")}</span><span class="m">${esc(w.mac.morph || "")}</span></span>`;
  }).join("")).join("")}</div>`;
}
function viewUnit() {
  const part = DATA.section.parts.find(p => p.id === state.part);
  const [a, b] = vrange(part.range);
  const vs = []; for (let v = a; v <= b; v++) vs.push(v);
  let body;
  if (state.layer === "de") body = `<div class="text de">${vs.map(v => `<button type="button" class="vn" data-verse="${v}">${v}</button>${esc(DATA.de[v] || "")}`).join(" ")}</div>`;
  else if (state.layer === "gr") body = `<div class="text">${vs.map(v => `<button type="button" class="vn" data-verse="${v}">${v}</button>${greekText(v)}`).join(" ")}</div>`;
  else body = `<div class="text">${interlinear(vs)}</div>`;
  const units = DATA.variants.filter(u => { const [x] = vrange(u.ref); return x >= a && x <= b; });
  const isCore = part.id === "TU-MRK-003-022-030";
  const src = [...new Set(vs.map(v => DATA.de_source[v]))];
  return `<h1>${esc(part.title)}</h1>
  <p class="lead">Markus ${deRef(part.range)}. Gepunktet unterstrichene Wörter haben Varianten; die Farbe zeigt, wie breit der Lesetext gestützt ist. Ein Wort antippen für Details.</p>
  ${layerButtons()}
  ${body}
  <p class="lead" style="font-size:12px;margin-top:8px">Deutsch: eigene Arbeitsübersetzung (KI-Entwurf, ungeprüft${src.some(s => s && s.includes("022-030")) ? "; Wortzuordnung vorhanden" : "; Wortzuordnung folgt"}). Englische Kurzglossen im Wort-für-Wort-Modus aus der Berean Interlinear Bible.</p>
  <h2>Unterschiede in den Editionen · ${units.length}</h2>
  <div class="var-list">${units.map(variantCard).join("") || "<p class='lead'>Keine Variantenstellen.</p>"}</div>
  ${isCore ? chain() : ""}`;
}
function chain() {
  const fs = DATA.findings.filter(f => f.subject === "TU-MRK-003-022-030");
  const is = DATA.interpretations.filter(i => i.subject === "TU-MRK-003-022-030");
  return `<h2>Vom Text zur Anwendung</h2>
  <div class="cards">
    ${fs.map(f => card("befund", `Befund · ${DE.conf[f.confidence] || f.confidence}`, f.claim, f.caveat ? `<div class="caveat">${esc(f.caveat)}</div>` : "")).join("")}
    <div class="arrow">daraus zwei Deutungen</div>
    ${is.map(i => card("deutung", `Deutung · ${DE.conf[i.confidence] || i.confidence}`, i.claim, i.caveat ? `<div class="caveat"><b>Vorbehalt:</b> ${esc(i.caveat)}</div>` : "")).join("")}
    <div class="arrow">daraus abgeleitet</div>
    ${DATA.principles.map(p => card("prinzip", `Prinzip · ${DE.conf[p.confidence] || p.confidence}`, p.text, `<div class="caveat">Offen: Das Prinzip ist stärker formuliert als die Deutung, aus der es abgeleitet ist.</div>`)).join("")}
    <div class="arrow">übertragen auf heute</div>
    ${DATA.applications.map(x => card("anwendung", `Anwendung · ${esc(x.context || "")}`, x.text, `<div class="caveat"><b>Grenze:</b> ${esc(x.limits)}</div>`)).join("")}
  </div>
  <h2>Offene Frage</h2>
  <div class="cards">${DATA.questions.map(q => `<div class="card"><p><b>${esc(q.q)}</b></p><div class="caveat">${esc(q.finding)}</div></div>`).join("")}</div>
  <h2>Parallelstellen</h2>
  <div class="cards">${DATA.relations.map(r => `<div class="card"><p class="mono">${esc(r.to)}</p><span class="sub" style="font-size:13px;color:var(--ink-soft)">${{ parallel_passage: "Parallele Erzählung", parallel_argument: "Paralleles Argument", parallel_saying: "Paralleles Wort" }[r.kind] || r.kind}</span></div>`).join("")}</div>`;
}

/* ---------- Varianten ---------- */
function meter(n, of, lvl) { let s = ""; for (let i = 0; i < of; i++) s += `<i style="${i < n ? `background:${LV[lvl]}` : ""}"></i>`; return `<span class="meter" aria-label="${n} von ${of}">${s}</span>`; }
function variantCard(u) {
  const words = u.tokens.map(t => wordsById[t]?.word).filter(Boolean).join(" ");
  const isEd = u.level === "edition_apparatus";
  const rows = u.readings.map(r => {
    const a = (u.assessment || []).find(x => x.reading === r.id);
    const eds = isEd ? `<div class="eds">${ED_ALL.map(e => `<span class="ed ${(a ? a.editions : r.editions).includes(e) ? "on" : ""}">${ED_SHORT[e]}</span>`).join("")}</div>`
      : `<div class="eds">${r.witnesses.map(x => `<span class="ed on">${esc(x)}</span>`).join("")}</div>`;
    const right = a ? `${meter(a.support, a.of, a.level)}<span class="lvl-name" style="color:${LV[a.level]}">${a.level}</span>` : `<span class="chip">Handschriften (Arbeitsnotiz)</span>`;
    return `<div class="rd"><span class="gk">${esc(r.text)}${r.gloss ? ` <span style="font-family:var(--f-ui);font-size:13px;color:var(--ink-soft)">«${esc(r.gloss)}»</span>` : ""}${r.sblgnt ? ` <span class="chip">Lesetext</span>` : ""}</span><span>${right}</span>${eds}</div>`;
  }).join("");
  return `<div class="vu"><header><span class="mono">${deRef(u.ref)} · ${esc(words)}</span><span>${isEd ? "Editionen" : "Handschriften"}</span></header>${rows}
  ${isEd ? `<details class="limits"><summary>Was diese Bewertung misst</summary><p style="margin:6px 0 0">${esc(DATA.method.question)}</p><ul>${DATA.method.limits.map(l => `<li>${esc(l)}</li>`).join("")}</ul></details>` : `<p class="limits" style="margin:6px 0 0">${esc(u.note || "")}</p>`}</div>`;
}

/* ---------- Vers ---------- */
function viewVerse() {
  const v = state.verse;
  const units = DATA.variants.filter(u => vrange(u.ref)[0] === v);
  const part = DATA.section.parts.find(p => { const [a, b] = vrange(p.range); return v >= a && v <= b; });
  return `<h1>Vers 3,${v}</h1>
  <p class="lead">${esc(part ? part.title : "")}</p>
  <div class="text de">${esc(DATA.de[v] || "")}</div>
  <h2>Wort für Wort</h2>
  <div class="text">${interlinear([v])}</div>
  <div style="display:flex;gap:8px;margin-top:10px">
    ${v > 20 ? `<button type="button" class="step" data-verse="${v - 1}">← 3,${v - 1}</button>` : ""}
    ${v < 35 ? `<button type="button" class="step" data-verse="${v + 1}">3,${v + 1} →</button>` : ""}
  </div>
  <h2>Unterschiede in den Editionen · ${units.length}</h2>
  <div class="var-list">${units.map(variantCard).join("") || "<p class='lead'>In diesem Vers verzeichnet der Apparat keine Unterschiede.</p>"}</div>`;
}

/* ---------- Wort (Blatt) ---------- */
function openWord(id) {
  const w = wordsById[id]; if (!w) return;
  const m = w.mac;
  const morph = ["person", "tense", "voice", "mood", "case", "number", "gender", "degree"].map(k => m[k] && DE[k][m[k]]).filter(Boolean).join(", ");
  const posDe = m.pos === "pron" && m.subtype ? (DE.subtype[m.subtype] + "pronomen") : (m.subtype === "proper" ? "Eigenname" : DE.pos[m.pos] || m.pos);
  const d = DATA.tok_de[id];
  const refs = (m.referent || m.subject_ref || []).map(t => wordsById[t] ? `<span class="w" role="button" tabindex="0" data-w="${t}" style="font-family:var(--f-text);font-size:17px">${esc(wordsById[t].text)}</span> <span class="mono" style="font-size:11px;color:var(--ink-soft)">(3,${wordsById[t].v})</span>` : `<span class="mono">${esc(t)}</span>`).join(", ");
  let diff = "";
  if (w.mgnt) {
    const same = w.mgnt.lemma === m.lemma;
    diff = `<div class="diff"><b>Zweite Annotation (MorphGNT):</b> ${esc(w.mgnt.lemma)} · <span class="mono">${esc(w.mgnt.pos)} ${esc(w.mgnt.parsing)}</span>${same ? "" : " · <b>Grundform weicht ab</b>"}
      ${id === "TOK-SBLGNT-MRK-003-029-019" ? `<div style="margin-top:4px">MorphGNT bestimmt das Wort als Neutrum; bei MACULA nennt der Code <span class="mono">A-GSF</span> Femininum, das Geschlechtsfeld aber Neutrum. Beide Angaben bleiben sichtbar.</div>` : ""}</div>`;
  }
  const us = varByTok[id] || [];
  showSheet(`<button type="button" class="close" data-close>Schliessen</button>
    <div><h3>${esc(shown(w.text))}</h3><div class="sub">Markus 3,${w.v}, Wort ${w.n}</div></div>
    <dl class="kv">
      <dt>Grundform</dt><dd><span style="font-family:var(--f-text);font-size:18px">${esc(m.lemma || "")}</span> <span class="chip">${w.freq}× in Markus</span></dd>
      <dt>Wortart</dt><dd>${esc(posDe || "")}</dd>
      ${morph ? `<dt>Form</dt><dd>${esc(morph)} <span class="mono" style="font-size:11px;color:var(--ink-soft)">${esc(m.morph || "")}</span></dd>` : ""}
      ${m.role ? `<dt>Satzrolle</dt><dd>${esc(DE.role[m.role] || m.role)}</dd>` : ""}
      ${refs ? `<dt>Bezieht sich auf</dt><dd>${refs}</dd>` : ""}
      <dt>Deutsch</dt><dd>${d ? (d.target === null ? "<i>nicht eigens übersetzt</i>" : `«${esc(d.target)}»`) : "<i>Wortzuordnung folgt</i>"}${d && d.note ? `<div class="caveat" style="border:0;padding:0">${esc(d.note)}</div>` : ""}</dd>
      <dt>Glosse (engl.)</dt><dd>${esc(m.gloss_berean || "–")}${m.gloss_cherith_en && m.gloss_cherith_en !== m.gloss_berean ? ` · ${esc(m.gloss_cherith_en)}` : ""}</dd>
    </dl>
    ${diff}
    ${us.length ? `<div><h2 style="margin:6px 0 8px">Unterschiede an dieser Stelle</h2><div class="var-list">${us.map(variantCard).join("")}</div></div>` : ""}
    <p class="sub">Annotation: MACULA Greek (CC BY 4.0). Glossen: Berean Interlinear (gemeinfrei), Cherith Glosses von Andi Wu (CC BY 4.0).</p>`);
}
function showSheet(html) {
  document.getElementById("sheetHost").innerHTML = `<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div class="sheet-inner">${html}</div></div>`;
  document.querySelector(".sheet .close")?.focus();
}
function closeSheet() { document.getElementById("sheetHost").innerHTML = ""; }

/* ---------- Studienpfad ---------- */
function openGuide() {
  const steps = [
    ["Überblick gewinnen", "Den Abschnitt 3,20–35 als Ganzes ansehen: drei Szenen, ineinander gelegt.", () => go("abschnitt")],
    ["Den Text lesen", "Die Mitte 3,22–30 auf Deutsch lesen, dann auf Griechisch.", () => go("einheit", { part: "TU-MRK-003-022-030", layer: "de" })],
    ["Unterschiede prüfen", "Wo weichen die Editionen voneinander ab, und wie breit ist der Lesetext gestützt?", () => go("einheit", { part: "TU-MRK-003-022-030", layer: "gr" })],
    ["Ein Schlüsselwort klären", "βλασφημήσῃ in 3,29: Grundform, Form, Satzrolle, worauf es sich bezieht.", () => { go("vers", { verse: 29 }); setTimeout(() => openWord("TOK-SBLGNT-MRK-003-029-004"), 50); }],
    ["Deutungen vergleichen", "Befunde von Deutungen trennen, Vorbehalte und Gegenargumente lesen.", () => { go("einheit", { part: "TU-MRK-003-022-030", layer: "de" }); setTimeout(() => document.querySelector("h2:nth-of-type(2)")?.scrollIntoView(), 50); }],
    ["Übertragen", "Was folgt daraus heute in der Schweiz, und wo liegen die Grenzen?", () => { go("einheit", { part: "TU-MRK-003-022-030", layer: "de" }); setTimeout(() => [...document.querySelectorAll(".kind.anwendung")].pop()?.scrollIntoView({ block: "center" }), 50); }],
  ];
  window.__guide = steps;
  showSheet(`<button type="button" class="close" data-close>Schliessen</button>
    <div><h3 style="font-size:24px">Studienpfad</h3><div class="sub">Sechs Schritte durch Markus 3,20–35. Jeder Schritt öffnet die passende Ansicht.</div></div>
    <div class="guide">${steps.map((s, i) => `<button type="button" class="gstep" data-gstep="${i}"><div><b>${esc(s[0])}</b><span>${esc(s[1])}</span></div></button>`).join("")}</div>`);
}

/* ---------- Rendern und Ereignisse ---------- */
function render() {
  renderSteps();
  const v = { buch: viewBook, abschnitt: viewSection, einheit: viewUnit, vers: viewVerse }[state.level] || viewSection;
  document.getElementById("main").innerHTML = v() + `<footer>
    <span>Studienprototyp aus den Daten des Projekts bible-app. Kein abgeschlossenes Ergebnis: Übersetzung, Befunde und Deutungen sind KI-Entwürfe ohne fachliche Prüfung.</span>
    <span>Griechischer Text und Apparat: SBL Greek New Testament, © 2010 Society of Biblical Literature und Logos Bible Software, CC BY 4.0. Sprachliche Annotation: MACULA Greek Linguistic Datasets, available at https://github.com/Clear-Bible/macula-greek/ (CC BY 4.0). Zweite Annotation 3,22–30: MorphGNT (J. K. Tauber, CC BY-SA 3.0). Eigene Inhalte: CC0.</span></footer>`;
}
document.addEventListener("click", e => {
  const t = e.target;
  if (t.closest("[data-close]")) return closeSheet();
  const g = t.closest("[data-gstep]"); if (g) { const s = window.__guide[+g.dataset.gstep]; closeSheet(); return s[2](); }
  const w = t.closest("[data-w]"); if (w) return openWord(w.dataset.w);
  const p = t.closest("[data-part]"); if (p) return go("einheit", { part: p.dataset.part });
  const vv = t.closest("[data-verse]"); if (vv) { closeSheet(); return go("vers", { verse: +vv.dataset.verse }); }
  const l = t.closest("[data-layer]"); if (l) { state.layer = l.dataset.layer; save(); return render(); }
  const c = t.closest("[data-ch]"); if (c) { if (+c.dataset.ch === 3) go("abschnitt"); return; }
  const gg = t.closest("#main [data-go]"); if (gg) return go(gg.dataset.go);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeSheet();
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-w]")) { e.preventDefault(); openWord(e.target.dataset.w); }
});
document.getElementById("fab").addEventListener("click", openGuide);
render();
</script>
