* { box-sizing: border-box; }
html, body { height: 100%; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--rule); padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px)); }

.tab svg { width: 22px; height: 22px; }

.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface); border-radius: 22px 22px 0 0; max-height: 86%; overflow-y: auto; padding: 10px 20px calc(24px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -10px 40px rgba(0, 0, 0, .18); }

 nicht einmal Brot essen konnten.", "21": "Und als die Seinen es hörten, gingen sie hinaus, um ihn festzuhalten; denn sie sagten: «Er ist von Sinnen.»", "22": "Und die Schriftgelehrten, die von Jerusalem herabgekommen waren, sagten: «Er hat Beelzebul», und: «Durch den Herrscher der Dämonen treibt er die Dämonen aus.»", "23": "Und er rief sie herbei und sagte in Gleichnissen zu ihnen: «Wie kann Satan Satan austreiben?", "24": "Und wenn ein Reich gegen sich selbst gespalten ist, kann jenes Reich nicht bestehen.", "25": "Und wenn ein Haus gegen sich selbst gespalten ist, wird jenes Haus nicht bestehen können.", "26": "Und wenn der Satan sich gegen sich selbst erhoben hat und gespalten worden ist, kann er nicht bestehen, sondern hat ein Ende.", "27": "Aber niemand kann in das Haus des Starken hineingehen und seinen Hausrat plündern, wenn er nicht zuerst den Starken bindet; und dann wird er sein Haus plündern.", "28": "Amen, ich sage euch: Alles wird den Söhnen der Menschen vergeben werden, die Sünden und die Lästerungen, so viele sie auch lästern mögen.", "29": "Wer aber gegen den Heiligen Geist lästert, hat auf ewig keine Vergebung, sondern ist einer ewigen Sünde schuldig.»", "30": "Denn sie sagten: «Er hat einen unreinen Geist.»", "31": "Und es kommen seine Mutter und seine Brüder, und draussen stehend schickten sie zu ihm und liessen ihn rufen.", "32": "Und eine Menge sass um ihn herum, und sie sagen zu ihm: «Siehe, deine Mutter und deine Brüder sind draussen und suchen dich.»", "33": "Und er antwortet ihnen und sagt: «Wer ist meine Mutter, und wer sind meine Brüder?»", "34": "Und er blickt ringsum auf die, die im Kreis um ihn sitzen, und sagt: «Siehe, meine Mutter und meine Brüder!", "35": "Denn wer den Willen Gottes tut, der ist mein Bruder und meine Schwester und meine Mutter.»"}, "de_source": {"20": "TRANS-MRK-003-020-021-DE-WORKING", "21": "TRANS-MRK-003-020-021-DE-WORKING", "22": "TRANS-MRK-003-022-030-DE-WORKING", "23": "TRANS-MRK-003-022-030-DE-WORKING", "24"   const p = [[x + r, y], [x + w - r, y], [x + w, y + r], [x + w, y + h - r], [x + w - r, y + h], [x + r, y + h], [x, y + h - r], [x, y + r]].map(([a, b]) => [a + rnd(), b + rnd()]);
  return `M${p[0]} L${p[1]} Q${x + w},${y} ${p[2]} L${p[3]} Q${x + w},${y + h} ${p[4]} L${p[5]} Q${x},${y + h} ${p[6]} L${p[7]} Q${x},${y} ${p[0]}`;
}

    <text x="170" y="56" text-anchor="middle" font-family="Hanken Grotesk, sans-serif" font-size="10.5" fill="var(--muted)" letter-spacing=".08em">3,20–21</text>
    <text x="170" y="122" text-anchor="middle" font-family="Newsreader, Georgia, serif" font-size="17" fill="var(--accent)">${SCENE_SHORT[1]}</text>
    <text x="170" y="142" text-anchor="middle" font-family="Hanken Grotesk, sans-serif" font-size="10.5" fill="var(--muted)" letter-spacing=".08em">3,22–30</text>
    <text x="170" y="212" text-anchor="middle" font-family="Newsreader, Georgia, serif" font-size="16" fill="currentColor">${SCENE_SHORT[2]}</text>
    <text x="170" y="230" text-anchor="middle" font-family="Hanken Grotesk, sans-serif" font-size="10.5" fill="var(--muted)" letter-spacing=".08em">3,31–35</text>
  </svg>`;
  const adv = S.advanced ? advancedBook() : "";
  return `<h1>${esc(DATA.section.title)}</h1>
  <p class="intro">${esc(DATA.section.summary)}</p>
  <div class="figure">${svg}</div>
  <div class="scenes">${PARTS.map((p, i) => `<button class="scene" type="button" data-read="${p.id}">
      <span class="n">${i + 1}</span><span class="t">${esc(p.title)}</span><span class="s">${esc(p.summary)}</span><span class="r">Markus ${deRef(p.range)}</span></button>`).join("")}</div>

function advancedBook() {
  const max = Math.max(...DATA.book.map(c => c.variants));
  return `<div style="margin-top:44px"><span class="label">Für Fortgeschrittene</span>
    <p class="intro" style="font-size:16px;margin-top:6px">Stellen im ganzen Markusevangelium, an denen sich die fünf verglichenen griechischen Textausgaben unterscheiden: ${DATA.book.reduce((a, c) => a + c.variants, 0)} insgesamt.</p>
    <div class="chart">${DATA.book.map(c => `<div class="b ${c.chapter === 3 ? "cur" : ""}" style="height:${c.variants / max * 100}%" title="Kapitel ${c.chapter}: ${c.variants}"></div>`).join("")}</div>
    <div class="chart-l">${DATA.book.map(c => `<span>${c.chapter}</span>`).join("")}</div></div>`;
}

/* ---------- Lesen ---------- */
function markVerse(v, text) {
  const alts = altsFor(v);
  if (!S.variants || !alts.length) return esc(text);
  // längste Stelle zuerst markieren; überlappende Stellen teilen sich eine Markierung
  const spans = [];
  alts.slice().sort((a, b) => b.from.length - a.from.length).forEach(a => {
    const i = text.indexOf(a.from); if (i < 0) return;
    const hit = spans.find(s => i < s.end && i + a.from.length > s.start);
    if (hit) { hit.alts.push(a); hit.start = Math.min(hit.start, i); hit.end = Math.max(hit.end, i + a.from.length); }
    else spans.push({ start: i, end: i + a.from.length, alts: [a] });
  });
  spans.sort((a, b) => a.start - b.start);
  let out = "", pos = 0;
  spans.forEach(s => {
    const strong = s.alts.some(a => a.effect === "bedeutsam");
    out += esc(text.slice(pos, s.start)) + `<span class="mark ${strong ? "" : "gering"}" role="button" tabindex="0" data-alt="${v}">${esc(text.slice(s.start, s.end))}</span>`;
    pos = s.end;
  });
  return out + esc(text.slice(pos));
}
function altLines(v) {
  if (!S.variants) return "";
  return altsFor(v).map(a => `<button class="alt" type="button" data-alt="${v}">oder: «${esc(a.to)}»<span>${a.effect === "bedeutsam" ? "andere Lesart" : "kleine Abweichung"}</span></button>`).join("");
}
function viewRead() {
  const total = DATA.alternatives.length, strong = DATA.alternatives.filter(a => a.effect === "bedeutsam").length;
  let body = "";
  if (S.advanced && S.layer !== "de") body = advancedText();
  else body = `<div class="reading">${PARTS.map((p, i) => {
    const [a, b] = vr(p.range); const vs = []; for (let v = a; v <= b; v++) vs.push(v);
    return `<h2>${i + 1} · Markus ${deRef(p.range)}</h2><p class="scene-title">${esc(p.title)}</p>` +
      vs.map(v => `<p><span class="vn">${v}</span>${markVerse(v, DATA.de[v] || "")}</p>${altLines(v)}`).join("") +
      (i < PARTS.length - 1 ? `<svg class="flourish" viewBox="0 0 120 14" aria-hidden="true"><path d="M2 7c18-7 30 7 58 0s40 7 58 0" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>` : "");
  }).join("")}</div>`;
  const hint = S.variants
    ? `<div class="hint"><p>Unterstrichene Stellen lauten in einigen alten Handschriften anders. Antippen zeigt, wie gut jede Lesart bezeugt ist.</p><button class="textbtn" type="button" data-toggle="variants">Abweichungen ausblenden</button></div>`
    : `<div class="hint"><p>An ${total} Stellen dieses Abschnitts lauten alte Handschriften anders, ${strong} davon verändern den Sinn spürbar.</p><button class="textbtn" type="button" data-toggle="variants">Abweichungen anzeigen</button></div>`;
  return `<h1>Lesen</h1>
  ${S.advanced ? `<div class="adv-bar"><div class="seg" role="group" aria-label="Textschicht">${[["de", "Deutsch"], ["gr", "Griechisch"], ["il", "Wort für Wort"]].map(([k, l]) => `<button type="button" data-layer="${k}" aria-pressed="${S.layer === k}">${l}</button>`).join("")}</div></div>` : ""}
  ${body}
  ${S.layer === "de" || !S.advanced ? hint : ""}
  <p class="note-small">Die deutsche Übersetzung ist ein eigener Entwurf nach dem griechischen Text. Sie wurde noch nicht fachlich geprüft.</p>`;
}

/* ---------- Vertiefen ---------- */
function viewDeep() {
  const focus = S.focus;
  const scope = `<div class="scope" role="group" aria-label="Bereich">${[["TU-MRK-003-020-035", "Ganzer Abschnitt"], ["TU-MRK-003-022-030", "Der Streit mit den Gelehrten"]].map(([k, l]) => `<button type="button" data-focus="${k}" aria-pressed="${focus === k}">${l}</button>`).join("")}</div>`;
  const conf = c => ({ high: "gut begründet", probable: "wahrscheinlich", possible: "möglich" }[c] || "");
  const fs = DATA.findings.filter(f => f.subject === (focus === "TU-MRK-003-020-035" ? "TU-MRK-003-020-035" : "TU-MRK-003-022-030"));
  const is = DATA.interpretations.filter(i => i.subject === focus);
  let html = `<h1>Vertiefen</h1><p class="intro">Was steht im Text, wie kann man ihn verstehen, und was kann er heute bedeuten? Diese drei Fragen halten wir auseinander.</p>${scope}`;
  html += `<section class="q"><h2>Was steht da?</h2>${fs.map(f => `<div class="point"><p>${esc(plain(f.claim))}</p>${S.advanced && f.caveat ? `<div class="aside">${esc(f.caveat)}</div>` : ""}</div>`).join("")}</section>`;
  html += `<section class="q"><h2>Wie kann man es verstehen?</h2>${is.length > 1 ? `<p class="intro" style="font-size:16px">Hier gibt es mehr als eine Sichtweise.</p>` : ""}
    ${is.map(i => `<div class="point view"><span class="chip">${conf(i.confidence)}</span><p>${esc(plain(i.claim))}</p>${i.caveat ? `<div class="aside"><b>Nicht sicher:</b> ${esc(plain(i.caveat))}</div>` : ""}${(i.counter || []).map(c => `<div class="aside"><b>Man kann auch anders lesen:</b> ${esc(plain(c))}</div>`).join("")}</div>`).join("")}</section>`;
  if (focus === "TU-MRK-003-022-030") {
    html += `<section class="q"><h2>Was kann es heute bedeuten?</h2>
      ${DATA.applications.map(a => `<div class="point today"><p>${esc(a.text)}</p><div class="aside"><b>Grenze:</b> ${esc(a.limits)}</div></div>`).join("")}
      ${DATA.principles.map(p => `<div class="point today"><span class="chip">abgeleiteter Grundsatz · ${conf(p.confidence)}</span><p>${esc(p.text)}</p><div class="aside">Dieser Grundsatz geht weiter als der Text selbst sagt. Er ist eine Folgerung, kein Befund.</div></div>`).join("")}
    </section>
    <section class="q"><h2>Eine offene Frage</h2>${DATA.questions.map(q => `<div class="point"><p>${esc(q.q)}</p><div class="aside">${esc(q.finding)}</div></div>`).join("")}</section>
    <section class="q"><h2>Ähnliche Stellen</h2><div class="refs">${DATA.relations.map(r => `<span class="ref">${esc(r.to_de)}</span>`).join("")}</div></section>`;
  }
  html += `<p class="note-small">Alle Beobachtungen und Deutungen sind Entwürfe und noch nicht fachlich geprüft.</p>`;
  return html;
}

/* ---------- Fortgeschritten: Urtext ---------- */
function verseWords(v) { return DATA.words.filter(w => w.v === v); }
function advancedText() {
  return PARTS.map((p, i) => {
    const [a, b] = vr(p.range); const vs = []; for (let v = a; v <= b; v++) vs.push(v);
    const units = DATA.variants.filter(u => { const x = vr(u.ref)[0]; return x >= a && x <= b; });
    const text = S.layer === "gr"
      ? `<div class="greek">${vs.map(v => `<span class="vn">${v}</span>` + verseWords(v).map(w => `<span class="w ${varByTok[w.id] ? "v" : ""}" role="button" tabindex="0" data-w="${w.id}">${esc(shown(w.text))}</span>`).join(" ")).join(" ")}</div>`
      : vs.map(v => `<div class="label" style="margin-top:12px">Vers 3,${v}</div><div class="il">${verseWords(v).map(w => { const d = DATA.tok_de[w.id]; const de = d ? (d.target === null ? "·" : (d.first ? d.target : "″")) : (w.mac.gloss_berean || ""); return `<button type="button" class="cell" data-w="${w.id}"><span class="g">${esc(shown(w.text))}</span><span class="d">${esc(de)}</span><span class="m">${esc(w.mac.morph || "")}</span></button>`; }).join("")}</div>`).join("");
    return `<h2 class="label" style="margin:30px 0 8px">${i + 1} · Markus ${deRef(p.range)}</h2>${text}
      <details class="all"><summary>Alle ${units.length} Unterschiede der Textausgaben</summary>${units.map(unitHtml).join("")}</details>`;
  }).join("") + `<p class="note-small">Wort für Wort: deutsche Entsprechung aus der Wortzuordnung (3,22–30), sonst englische Kurzglosse (Berean Interlinear). Griechischer Text: SBLGNT.</p>`;
}
function unitHtml(u) {
  const ed = { "ED-SBLGNT": "SBLGNT", "ED-WH": "WH", "ED-TREG": "Treg", "ED-NA28": "NA28", "ED-RP": "RP" };
  return `<div class="vu"><div class="label" style="font-size:11px">${deRef(u.ref)}</div>${u.readings.map(r => {
    const a = (u.assessment || []).find(x => x.reading === r.id);
    return `<div class="rd"><span class="gk">${esc(r.text)}</span><span class="eds">${a ? a.editions.map(e => ed[e]).join(" · ") + ` (${a.support}/${a.of})` : esc(r.witnesses.join(", "))}</span></div>`;
  }).join("")}</div>`;
}
function openWord(id) {
  const w = wordsById[id]; if (!w) return; const m = w.mac;
  const DE = { person: { first: "1. Person", second: "2. Person", third: "3. Person" }, number: { singular: "Singular", plural: "Plural" }, gender: { masculine: "maskulin", feminine: "feminin", neuter: "neutrum" }, case: { nominative: "Nominativ", genitive: "Genitiv", dative: "Dativ", accusative: "Akkusativ", vocative: "Vokativ" }, tense: { present: "Präsens", imperfect: "Imperfekt", future: "Futur", aorist: "Aorist", perfect: "Perfekt", pluperfect: "Plusquamperfekt" }, voice: { active: "Aktiv", middle: "Medium", passive: "Passiv" }, mood: { indicative: "Indikativ", subjunctive: "Konjunktiv", imperative: "Imperativ", infinitive: "Infinitiv", participle: "Partizip", optative: "Optativ" } };
  const POS = { noun: "Substantiv", verb: "Verb", adj: "Adjektiv", det: "Artikel", pron: "Pronomen", conj: "Konjunktion", prep: "Präposition", adv: "Adverb", ptcl: "Partikel", num: "Zahlwort" };
  const ROLE = { s: "Subjekt", v: "Prädikat", o: "Objekt", o2: "zweites Objekt", io: "indirektes Objekt", adv: "Adverbiale", p: "Prädikativ", vc: "Kopula", aux: "Hilfsverb" };
  const form = ["person", "tense", "voice", "mood", "case", "number", "gender"].map(k => m[k] && DE[k][m[k]]).filter(Boolean).join(", ");
  const d = DATA.tok_de[id];
  const refs = (m.referent || m.subject_ref || []).filter(t => wordsById[t]).map(t => `<button type="button" class="w" data-w="${t}" style="font-family:var(--f-greek);font-size:17px">${esc(shown(wordsById[t].text))}</button> (3,${wordsById[t].v})`).join(", ");
  showSheet(`<button class="close" type="button" data-close>Schliessen</button>
    <h3 style="font-family:var(--f-greek)">${esc(shown(w.text))}</h3><p class="muted">Markus 3,${w.v} · Wort ${w.n}</p>
    <dl class="kv"><dt>Grundform</dt><dd style="font-family:var(--f-greek);font-size:17px">${esc(m.lemma || "")} <span class="muted" style="font-family:var(--f-ui)">· ${w.freq}× in Markus</span></dd>
    <dt>Wortart</dt><dd>${esc(POS[m.pos] || m.pos || "")}</dd>${form ? `<dt>Form</dt><dd>${esc(form)}</dd>` : ""}
    ${m.role ? `<dt>Satzrolle</dt><dd>${esc(ROLE[m.role] || m.role)}</dd>` : ""}${refs ? `<dt>Bezieht sich auf</dt><dd>${refs}</dd>` : ""}
    <dt>Deutsch</dt><dd>${d ? (d.target === null ? "nicht eigens übersetzt" : "«" + esc(d.target) + "»") : "–"}${d && d.note ? `<br><span class="muted">${esc(d.note)}</span>` : ""}</dd>
    <dt>Englisch</dt><dd>${esc(m.gloss_berean || "–")}</dd>
    ${w.mgnt ? `<dt>MorphGNT</dt><dd>${esc(w.mgnt.lemma)} · ${esc(w.mgnt.parsing)}</dd>` : ""}</dl>
    ${(varByTok[id] || []).map(unitHtml).join("")}
    <p class="muted" style="font-size:12px">Annotation: MACULA Greek (CC BY 4.0); Glossen: Berean Interlinear (gemeinfrei).</p>`);
}

/* ---------- Blätter ---------- */
function showSheet(html) {
  document.getElementById("sheetHost").innerHTML = `<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div class="sheet-inner">${html}</div></div>`;
  document.querySelector(".sheet .close")?.focus();
}
const closeSheet = () => (document.getElementById("sheetHost").innerHTML = "");
function openAlt(v) {
  const alts = altsFor(v);
  showSheet(`<button class="close" type="button" data-close>Schliessen</button>
    <h3>Vers 3,${v}: andere Lesarten</h3>
    <p class="muted">Die alten Handschriften dieses Verses stimmen nicht ganz überein. Hier stehen die Möglichkeiten nebeneinander. Niemand entscheidet für dich, welche «richtig» ist.</p>
    ${alts.map(a => `<div class="compare">
      <div class="reading-opt main"><span class="label">Im Lesetext</span><span class="q1">«${esc(a.from)}»</span><span class="support">${dots(a.base_support, a.of)}${a.base_support != null ? supportText(a.base_support, a.of) : "So steht es in den verglichenen Textausgaben."}</span></div>
      <div class="reading-opt other"><span class="label">Andere Lesart</span><span class="q1">«${esc(a.to)}»</span><span class="support">${dots(a.support, a.of)}${supportText(a.support, a.of)}</span></div>
      <p class="muted">${esc(a.note || "")}</p></div>`).join("")}
    <p class="muted" style="font-size:12.5px">Gezählt werden fünf wichtige gedruckte Ausgaben des griechischen Textes. Das zeigt, wie Fachleute die Stelle beurteilen, nicht wie viele Handschriften es gibt.</p>`);
}
function openSettings() {
  const sw = (k, t, s) => `<div class="row"><div class="txt"><b>${t}</b><span>${s}</span></div><button type="button" class="switch" role="switch" aria-checked="${S[k]}" data-toggle="${k}" aria-label="${t}"></button></div>`;
  showSheet(`<button class="close" type="button" data-close>Fertig</button><h3>Darstellung</h3>
    <div>${sw("variants", "Abweichende Lesarten", "Zeigt, wo alte Handschriften anders lauten.")}
    ${sw("advanced", "Urtext und Details", "Für Fortgeschrittene: griechischer Text, Wort für Wort, Grammatik.")}
    <div class="row"><div class="txt"><b>Schriftgrösse</b></div><div class="seg" role="group" aria-label="Schriftgrösse">${[[.92, "A−"], [1, "A"], [1.12, "A+"]].map(([v, l]) => `<button type="button" data-scale="${v}" aria-pressed="${S.scale === v}">${l}</button>`).join("")}</div></div>
    <div class="row"><div class="txt"><b>Farben</b></div><div class="seg" role="group" aria-label="Farben">${[["system", "Auto"], ["light", "Hell"], ["dark", "Dunkel"]].map(([v, l]) => `<button type="button" data-theme-set="${v}" aria-pressed="${S.theme === v}">${l}</button>`).join("")}</div></div></div>`);
}
function openGuide() {
  const steps = [
    ["Überblick", "Drei Szenen, ineinander erzählt. Worum geht es in jeder?", () => go("ueberblick")],
    ["Ganz lesen", "Den Abschnitt in Ruhe von Anfang bis Ende lesen.", () => go("lesen")],
    ["Genau hinsehen", "Wo lauten alte Handschriften anders, und ändert das etwas?", () => { S.variants = true; go("lesen"); }],
    ["Verstehen", "Was steht da, und wie kann man es verstehen?", () => go("vertiefen", { focus: "TU-MRK-003-020-035" })],
    ["Die schwierige Mitte", "Die Warnung in 3,28–29: Was ist gemeint, was bleibt offen?", () => go("vertiefen", { focus: "TU-MRK-003-022-030" })],
    ["Für heute", "Was kann der Text heute bedeuten, und wo sind die Grenzen?", () => { go("vertiefen", { focus: "TU-MRK-003-022-030" }); setTimeout(() => document.querySelector(".point.today")?.scrollIntoView({ block: "center" }), 60); }],
  ];
  window.__steps = steps;
  showSheet(`<button class="close" type="button" data-close>Schliessen</button><h3>Schritt für Schritt</h3>
    <p class="muted">Sechs kurze Schritte durch Markus 3,20–35.</p>
    <div class="guide">${steps.map((s, i) => `<button class="gstep" type="button" data-step="${i}"><span class="n">${i + 1}</span><span><b>${esc(s[0])}</b><span>${esc(s[1])}</span></span></button>`).join("")}</div>`);
}

/* ---------- Ablauf ---------- */
function go(view, opts = {}) { Object.assign(S, opts, { view }); save(); render(); window.scrollTo({ top: 0 }); }
function render() {
  applyPrefs();
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-current", t.dataset.view === S.view ? "page" : "false"));
  const v = { ueberblick: viewOverview, lesen: viewRead, vertiefen: viewDeep }[S.view] || viewOverview;
  document.getElementById("main").innerHTML = v() + `<footer>
    <span>Ein Studienprototyp. Text, Lesarten und Erklärungen stammen aus den offenen Daten des Projekts; Übersetzung und Erklärungen sind Entwürfe.</span>
    <span>Griechischer Text und Lesarten: SBL Greek New Testament, © 2010 Society of Biblical Literature und Logos Bible Software, CC BY 4.0. Sprachdaten: MACULA Greek Linguistic Datasets, available at https://github.com/Clear-Bible/macula-greek/ (CC BY 4.0). Eigene Inhalte: CC0.</span></footer>`;
}
document.addEventListener("click", e => {
  const t = e.target;
  if (t.closest("[data-close]")) return closeSheet();
  const tab = t.closest("[data-view]"); if (tab) return go(tab.dataset.view);
  const st = t.closest("[data-step]"); if (st) { const f = window.__steps[+st.dataset.step]; closeSheet(); return f[2](); }
  if (t.closest("[data-guide]")) return openGuide();
  const tg = t.closest("[data-toggle]"); if (tg) { const k = tg.dataset.toggle; S[k] = !S[k]; if (k === "advanced" && !S.advanced) S.layer = "de"; save(); render(); if (tg.classList.contains("switch")) openSettings(); return; }
  const sc = t.closest("[data-scale]"); if (sc) { S.scale = +sc.dataset.scale; save(); render(); return openSettings(); }
  const th = t.closest("[data-theme-set]"); if (th) { S.theme = th.dataset.themeSet; save(); render(); return openSettings(); }
  const rd = t.closest("[data-read]"); if (rd) { go("lesen"); return; }
  const al = t.closest("[data-alt]"); if (al) return openAlt(+al.dataset.alt);
  const fo = t.closest("[data-focus]"); if (fo) return go("vertiefen", { focus: fo.dataset.focus });
  const ly = t.closest("[data-layer]"); if (ly) { S.layer = ly.dataset.layer; save(); return render(); }
  const w = t.closest("[data-w]"); if (w) return openWord(w.dataset.w);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeSheet();
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-alt],[data-w]")) { e.preventDefault(); e.target.click(); }
});
document.getElementById("settingsBtn").addEventListener("click", openSettings);
render();
</script>
