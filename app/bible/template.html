<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Atmo Bible</title><meta name="description" content="Atmo Bible – open, free, from overview to original"><meta name="application-name" content="Atmo Bible"><meta name="apple-mobile-web-app-title" content="Atmo Bible">
<style>
/* Die ganze Bibel fortlaufend lesen. Ruhige Fläche, Leisten treten beim Lesen zurück; Erklärungen und Hintergrund nur auf Wunsch (Blatt von unten). */
:root{color-scheme:light dark}
html,body{margin:0;height:100%;background:#f7f7f6}
#bible-stream{height:100%}
#bible-stream .app{
  --bg:#f7f7f6;--ink:#1f1f1f;--muted:#6b6b6b;--rule:#dcdcda;--soft:#ececea;--sheet:#ffffff;--scrim:rgba(20,20,20,.28);
  --r:6px;--read:19px;--ui:"Helvetica Neue",Arial,sans-serif;--serif:Georgia,"Iowan Old Style","Times New Roman",serif;
  position:relative;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.45 var(--ui);color-scheme:light}
#bible-stream .app[data-theme=dark]{--bg:#171717;--ink:#ececec;--muted:#a3a3a3;--rule:#343434;--soft:#262626;--sheet:#1f1f1f;--scrim:rgba(0,0,0,.55);color-scheme:dark}
html:has(.app[data-theme=dark]),html:has(.app[data-theme=dark]) body{background:#171717}
#bible-stream .app *{box-sizing:border-box}
#bible-stream .app button{font:inherit;color:inherit;border:0;border-radius:0;background:transparent;padding:0;cursor:pointer;text-align:left}
#bible-stream .app button:disabled{opacity:.3;cursor:default}
#bible-stream .app :is(button,input,[tabindex]):focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#bible-stream .app svg{display:block;width:18px;height:18px;flex:0 0 18px}
#bible-stream .logo{width:24px!important;height:25px!important;flex-basis:24px!important}
#bible-stream .logo-wrap{position:relative;display:block;width:24px;height:25px}
#bible-stream .logo-wrap .logo{position:absolute;inset:0;transition:opacity .25s ease}
#bible-stream .logo-heart{opacity:0}
/* Herz: am Desktop beim Darüberfahren; auf Touch-Geräten beim Antippen kurz (Klasse .pulse, per Skript wieder entfernt), weil :hover dort hängen bleibt */
@media (hover:hover){#bible-stream [data-action=home]:hover .logo-heart{opacity:1}#bible-stream [data-action=home]:hover .logo-base{opacity:0}}
#bible-stream [data-action=home]:is(:focus-visible,.pulse) .logo-heart{opacity:1}
#bible-stream [data-action=home]:is(:focus-visible,.pulse) .logo-base{opacity:0}

/* Leisten */
#bible-stream .bar{position:absolute;left:0;right:0;z-index:4;display:flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:transform .25s ease,opacity .25s ease}
#bible-stream .top{top:0;padding:calc(6px + env(safe-area-inset-top,0px)) 10px 6px;border-bottom:1px solid var(--rule)}
#bible-stream .dock{bottom:0;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--rule);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px}
#bible-stream .immersed .top{transform:translateY(-105%);opacity:0}
#bible-stream .immersed .dock{transform:translateY(105%);opacity:0}
#bible-stream .icon-btn{width:44px;height:44px;display:grid!important;place-items:center;border-radius:var(--r)!important}
#bible-stream .icon-btn:hover,#bible-stream .location:hover,#bible-stream .dock button:hover:not(:disabled){background:var(--soft)}
#bible-stream .app .location{border-radius:var(--r)!important;padding:0 10px!important}
#bible-stream .dock button{border-radius:var(--r)!important}
#bible-stream .location{flex:1;min-width:0;height:44px;display:flex;align-items:center;gap:8px;font-size:14px;white-space:nowrap;overflow:hidden}
#bible-stream .location svg{width:18px;height:18px;flex:none;color:var(--muted)}
#bible-stream .location .loc-text{overflow:hidden;text-overflow:ellipsis}
#bible-stream .row.settings-row>span{flex:1;text-align:left}
#bible-stream .dock button{height:44px;display:flex;align-items:center;gap:8px;font-size:14px;padding:0 10px}
/* Pfad unten: jedes Glied springt direkt auf seine Ebene; rechts die Auswahl der Ebene darunter */
#bible-stream .dock .path{display:flex;align-items:center;min-width:0;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 14px);mask-image:linear-gradient(to right,transparent 0,#000 14px)}
#bible-stream .dock .path::-webkit-scrollbar{display:none}
#bible-stream .dock .path button{flex:none;height:40px;padding:0 8px;font-size:14px;color:var(--muted);max-width:11em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
#bible-stream .dock .path button[aria-current=true]{color:var(--ink);font-weight:600;background:var(--soft)}
#bible-stream .dock .path .sep{flex:none;color:var(--muted);opacity:.6;padding:0 1px}
#bible-stream .dock .pick{gap:4px;font-weight:600;padding:0 10px 0 12px;border:1px solid var(--rule)!important}
#bible-stream .dock .pick svg{width:18px;height:18px}
#bible-stream .dock .pick[hidden]{display:none!important}
#bible-stream .pick-list .row .note{margin-left:6px}

/* Lesefläche */
#bible-stream aside{display:none}
#bible-stream .reader{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:calc(76px + env(safe-area-inset-top,0px)) 22px calc(110px + env(safe-area-inset-bottom,0px))}
#bible-stream .column{max-width:36em;margin:0 auto}
#bible-stream .stream-entry{padding:34px 0 30px;border-top:1px solid var(--rule)}
#bible-stream .stream-entry:first-child{border-top:0;padding-top:8px}
#bible-stream .eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
#bible-stream h2{font:400 28px/1.15 var(--ui);letter-spacing:-.4px;margin:0 0 14px;text-wrap:balance}
#bible-stream .stream-copy{font:400 var(--read)/1.65 var(--serif);margin:0}
#bible-stream .quiet{color:var(--muted)}
#bible-stream .actions{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:20px}
#bible-stream .link{display:inline-flex!important;align-items:center;gap:8px;min-height:40px;font-size:15px;border-bottom:1px solid currentColor!important}
#bible-stream .link.soft{border-bottom-color:var(--rule)!important;color:var(--muted)}
#bible-stream .example{margin-top:18px;display:flex!important;justify-content:space-between;align-items:center;width:100%;padding:14px 0!important;border-top:1px solid var(--rule)!important;border-bottom:1px solid var(--rule)!important}

/* Verse: fliessender Text */
#bible-stream .stream-entry.verse{border:0;padding:0 0 .55em}
#bible-stream .chapter-head{font:400 30px/1.15 var(--ui);letter-spacing:-.4px;margin:30px 0 4px}
#bible-stream .part-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:22px 0 10px}
#bible-stream .part-head h3{font:italic 400 calc(var(--read) * .95)/1.4 var(--serif);color:var(--muted);margin:0}
#bible-stream .part-tools{display:inline-flex;gap:4px;margin:0}
#bible-stream h2+.part-tools{margin:-4px 0 10px}
#bible-stream h2+.entry-tools{margin-top:-4px}
#bible-stream .sheet-tools{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px 10px;border-top:1px solid var(--rule);padding-top:12px;margin-top:8px}
#bible-stream .app .tool{display:inline-flex!important;align-items:center;gap:5px;padding:5px 8px!important;font:500 12px/1 var(--ui);color:var(--muted);border-radius:var(--r)!important}
#bible-stream .tool svg{width:16px;height:16px}
#bible-stream .tool:hover,#bible-stream .tool:active{color:var(--ink);background:var(--soft)}
#bible-stream button.vno.more{display:inline-grid!important;place-items:center;min-width:1.9em;height:1.9em;padding:0 3px!important;margin:0 5px 0 -2px;border:1px solid var(--rule)!important;border-radius:var(--r)!important;vertical-align:.25em;color:var(--ink);font:500 11px/1 var(--ui)}
#bible-stream button.vno.plain{padding:0!important;margin:0 5px 0 0}
#bible-stream button.vno.more:hover,#bible-stream button.vno.more:active{background:var(--soft)}
#bible-stream .dec[role=button]{cursor:pointer}
#bible-stream button.dec{display:inline!important;padding:0!important;font:inherit;color:inherit;background:none;border:0!important;cursor:pointer;text-align:inherit}
#bible-stream .bg-lines{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;margin:0 0 8px 1.6em;color:var(--muted)}
#bible-stream .bg-label svg{width:14px;height:14px;vertical-align:-2px}
#bible-stream .verse-line{font:400 var(--read)/1.75 var(--serif);margin:0}
#bible-stream .app.flow .column{line-height:1.75}
#bible-stream .app.flow .stream-entry.verse,#bible-stream .app.flow .verse-line{display:inline;padding:0}
#bible-stream .app.flow .stream-entry.verse::after{content:' '}
#bible-stream .app.flow .alt-line{display:inline;margin:0 .25em}
#bible-stream .app.flow .bg-lines,#bible-stream .app.flow .bg-label,#bible-stream .app.flow .bg-line{display:inline!important;margin:0 .35em 0 0}
#bible-stream .app.flow .bg-lines{margin-left:.25em}
#bible-stream .app.flow .bg-label svg{display:inline-block!important;vertical-align:-2px;margin-right:.25em}
#bible-stream .app.flow .part-head{margin:22px 0 6px}
#bible-stream .vno{font:500 11px/1 var(--ui);color:var(--muted);vertical-align:.6em;margin-right:4px;font-variant-numeric:tabular-nums}
#bible-stream .sum .stream-copy+.stream-copy,#bible-stream .sum-list+.stream-copy{margin-top:.5em}
#bible-stream .sum-list{font:400 var(--read)/1.5 var(--serif);margin:.4em 0;padding-left:1.2em}
#bible-stream .sum-list li{margin:.15em 0}
#bible-stream .placeholder .stream-copy{color:var(--muted);font-size:calc(var(--read) * .8)}
#bible-stream .more{display:inline-grid!important;place-items:center;width:28px;height:28px;margin-left:4px;vertical-align:-6px;border-radius:var(--r)!important;color:var(--muted)}
#bible-stream .more:hover{background:var(--soft);color:var(--ink)}
#bible-stream .more svg{width:15px;height:15px;flex-basis:15px}
#bible-stream .alt-line{display:block;font:italic 400 calc(var(--read) * .82)/1.5 var(--serif);color:var(--muted);margin:2px 0 8px 1.4em}
#bible-stream .part-end{margin:4px 0 18px}
#bible-stream .app button.ref{display:inline!important;padding:0!important;font:inherit;color:inherit;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:.2em}
#bible-stream .app button.ref:hover{text-decoration-color:var(--ink)}
#bible-stream .xrefs{display:flex;flex-wrap:wrap;gap:6px}
#bible-stream .app button.ref.chip{display:inline-flex!important;align-items:center;padding:7px 11px!important;border:1px solid var(--rule)!important;border-radius:var(--r)!important;font:500 13px/1 var(--ui);text-decoration:none}
#bible-stream .app button.ref.chip:hover{background:var(--soft)}
#bible-stream .jump{position:absolute;left:0;right:0;top:calc(58px + env(safe-area-inset-top,0px));z-index:4;display:flex;justify-content:center;pointer-events:none}
#bible-stream .app .jump-back{pointer-events:auto;display:inline-flex!important;align-items:center;gap:6px;padding:7px 12px 7px 9px!important;border-radius:var(--r)!important;background:var(--ink);color:var(--bg);font:500 13px/1 var(--ui);box-shadow:0 2px 10px rgba(0,0,0,.18)}
#bible-stream .app .jump-back svg{width:15px;height:15px;transform:rotate(-90deg)}
#bible-stream .immersed .jump{opacity:0;pointer-events:none;transition:opacity .2s}
#bible-stream .crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;margin:2px 0 14px;font:500 14px/1.3 var(--ui)}
#bible-stream .app .crumbs button{padding:5px 7px!important;border-radius:var(--r)!important}
#bible-stream .app .crumbs button:hover{background:var(--soft)}
#bible-stream .app .crumbs button[aria-current=true]{background:var(--ink);color:var(--bg)}
#bible-stream .crumbs .sep{color:var(--muted);padding:0 2px}
#bible-stream .nav-block{margin-top:18px}
#bible-stream .sheet .nav-block h4{font:500 12px/1.4 var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
#bible-stream .app .nav-block .open{text-transform:none;letter-spacing:0;font:500 13px/1 var(--ui);color:var(--ink);display:inline-flex!important;align-items:center;gap:2px;padding:6px 4px 6px 8px!important;border-radius:var(--r)!important}
#bible-stream .app .nav-block .open:hover{background:var(--soft)}
#bible-stream .nav-block .open svg{width:15px;height:15px}
#bible-stream .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
#bible-stream .dph-steps{display:flex;align-items:center;gap:8px;margin:6px 0 4px;color:var(--muted);font:500 14px/1 var(--ui)}
#bible-stream .app .dph-steps button{padding:7px 12px!important;border:1px solid var(--rule)!important;border-radius:999px!important;color:var(--ink)}
#bible-stream .app .dph-steps button:hover{background:var(--soft)}
#bible-stream .dph-h{scroll-margin-top:12px}
#bible-stream .dph-aud{margin:4px 0 10px}
#bible-stream .app .chip{padding:8px 12px!important;border:1px solid var(--rule)!important;border-radius:var(--r)!important;font:500 13px/1 var(--ui)}
#bible-stream .app .chip:hover{background:var(--soft)}
#bible-stream .app .chip.cur,#bible-stream .app .grid button.cur{background:var(--ink);color:var(--bg);border-color:var(--ink)!important}
#bible-stream .grid{display:grid;gap:6px}
#bible-stream .grid.nums{grid-template-columns:repeat(auto-fill,minmax(42px,1fr))}
#bible-stream .grid.books{grid-template-columns:repeat(auto-fill,minmax(86px,1fr))}
#bible-stream .app .grid button{position:relative;min-height:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px!important;border:1px solid var(--rule)!important;border-radius:var(--r)!important;font:500 14px/1.1 var(--ui);text-align:center;font-variant-numeric:tabular-nums}
#bible-stream .app .grid button:not(.cur):hover{background:var(--soft)}
#bible-stream .grid.books small{font:400 10.5px/1.15 var(--ui);color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bible-stream .grid button.cur small{color:inherit;opacity:.8}
#bible-stream .grid button.study::after,#bible-stream .nav-legend .dot{content:'';position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55}
#bible-stream .nav-legend{display:flex;align-items:center;gap:6px;margin-top:14px}
#bible-stream .nav-legend .dot{position:static;display:inline-block}
#bible-stream .nav-block .row{margin-bottom:6px}
#bible-stream .gap{margin:0 0 10px;font:400 14px/1.45 var(--ui);color:var(--muted)}
#bible-stream .grc{font-family:var(--serif);font-size:1.05em;letter-spacing:.01em}
#bible-stream .heb{font-family:"SBL Hebrew","Ezra SIL","Noto Serif Hebrew","Taamey Frank CLM","Times New Roman",var(--serif);font-size:1.2em;direction:rtl;unicode-bidi:isolate;line-height:1.6}
#bible-stream .il.he{direction:rtl}
#bible-stream .il.he summary{align-items:flex-end;direction:ltr;text-align:right}
#bible-stream .il.he details>dl,#bible-stream .il.he details>.ref-id,#bible-stream .il.he details>.note{direction:ltr;text-align:left}
#bible-stream .il .m{display:block;font-size:12px;color:var(--muted)}
#bible-stream .dec{text-decoration-line:underline;text-decoration-thickness:1px;text-underline-offset:.22em;text-decoration-color:var(--muted)}
#bible-stream .dec{text-decoration-style:dotted}
#bible-stream .vno-demo{display:inline-grid;place-items:center;min-width:1.9em;height:1.9em;border:1px solid var(--rule);border-radius:var(--r);font:500 11px/1 var(--ui);color:var(--ink)}
#bible-stream .dss-demo{padding:0 7px;border:1px solid var(--rule);border-radius:999px;color:var(--muted);font:500 11px/1.7 var(--ui)}
#bible-stream ol.steps{margin:0 0 8px;padding-left:1.3em;display:grid;gap:8px}
#bible-stream .dec-tag.traditional,#bible-stream .dec-tag.interpretive{color:var(--ink)}
#bible-stream .grc-line{display:inline-flex;align-items:center;flex-wrap:wrap;gap:2px}
#bible-stream .play{display:inline-flex!important;align-items:center;justify-content:center;width:32px;height:32px;margin-left:4px;vertical-align:middle;color:var(--muted);border-radius:var(--r);flex:none}
#bible-stream .play svg{width:18px;height:18px}
#bible-stream .play.playing{color:var(--ink);background:var(--soft)}
#bible-stream .samples{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
#bible-stream .play:hover,#bible-stream .play:active{color:var(--ink);background:var(--soft)}
#bible-stream .tr-inline{font-family:var(--serif);color:var(--muted)}
#bible-stream .terms{display:flex;flex-direction:column;gap:2px;margin:2px 0 0;font-size:14px;color:var(--muted)}
#bible-stream .term{display:inline-flex;align-items:center;flex-wrap:wrap;gap:4px}
#bible-stream .term .lang{font-size:11px;letter-spacing:.06em;text-transform:uppercase}
#bible-stream .term .grc,#bible-stream .term .heb{color:var(--ink);font-family:var(--serif);font-size:16px}
#bible-stream .term .play,#bible-stream .body .play,#bible-stream .note .play{width:26px;height:26px;margin-left:0}
#bible-stream .term .play svg,#bible-stream .body .play svg,#bible-stream .note .play svg{width:15px;height:15px}
#bible-stream .tr{display:block;font:italic 14px/1.45 var(--serif);color:var(--muted);margin:0}
#bible-stream .il .tr{font-size:12.5px}
#bible-stream .il .g{display:inline-flex;align-items:center}
#bible-stream .set .chips{margin-top:0;justify-content:flex-end;max-width:100%}
#bible-stream .grc.small{font-size:15px;color:var(--muted);margin:6px 0 0;line-height:1.5}
#bible-stream .word-table{display:flex;flex-direction:column;gap:10px}
#bible-stream .word-row{display:flex;flex-direction:column;gap:2px;border-left:2px solid var(--rule);padding-left:12px}
#bible-stream .wit-group{border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
#bible-stream .wit-group.main{border-color:var(--ink)}
#bible-stream .wit-group p{margin:0}
#bible-stream .wit summary{display:flex;gap:12px;align-items:baseline;cursor:pointer;list-style:none;padding:6px 0;border-top:1px solid var(--soft)}
#bible-stream .wit summary::-webkit-details-marker{display:none}
#bible-stream .wit .sig{min-width:2.2em;font:500 17px/1 var(--serif);text-align:center}
#bible-stream .wit .sig.long{font:500 11px/1.2 var(--ui);color:var(--muted);max-width:3.4em}
#bible-stream .wit[open] summary{border-bottom:0}
#bible-stream .wit>p{margin:4px 0 4px 3.3em}
#bible-stream .sheet a{color:inherit;text-decoration:underline;text-decoration-color:var(--rule)}
#bible-stream .app .bg-line{display:inline;padding:2px 0;font:400 13px/1.4 var(--ui);color:var(--muted);text-align:left;border-bottom:1px dotted var(--rule)!important}
#bible-stream .bg-topic{font:500 16px/1.35 var(--ui);margin:0}

#bible-stream .load{display:block;margin:24px auto 0;font-size:13px;color:var(--muted)}
#bible-stream .end{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;margin:40px 0 0}

/* Blatt */
#bible-stream .scrim{position:absolute;inset:0;background:var(--scrim);z-index:8}
#bible-stream .sheet{position:absolute;left:0;right:0;bottom:0;z-index:9;max-height:88%;overflow-y:auto;background:var(--sheet);border-top:1px solid var(--rule);padding:8px 22px calc(28px + env(safe-area-inset-bottom,0px))}
#bible-stream .sheet .column{display:flex;flex-direction:column;gap:14px}
/* Griff und Kopf bleiben oben stehen; nach unten wischen schliesst (Hinweis Andi Neck 2026-10-25) */
#bible-stream .grab{position:sticky;top:-8px;z-index:3;margin:-8px -22px 0;padding:12px 0 10px;background:var(--sheet);touch-action:none;cursor:grab}
#bible-stream .grab::after{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--rule);margin:0 auto}
#bible-stream .sheet .grab+.sheet-head{position:sticky;top:19px;z-index:3;background:var(--sheet);margin:-14px -22px 0;padding:6px 22px 8px;touch-action:none;cursor:grab;user-select:none}
#bible-stream .sheet.dragging{transition:none}
#bible-stream .sheet.settle{transition:transform .2s ease}
#bible-stream .sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
#bible-stream .sheet-head h3{font:400 24px/1.2 var(--ui);margin:0}
#bible-stream .app .close{display:inline-flex!important;align-items:center;gap:6px;flex:none;min-height:38px;padding:0 12px 0 9px!important;color:var(--muted);font:500 14px/1 var(--ui);border-radius:var(--r)!important;transition:background .15s,color .15s}
#bible-stream .close svg{width:18px;height:18px}
#bible-stream .close:hover,#bible-stream .close:active{background:var(--soft);color:var(--ink)}
#bible-stream .app .sheet:focus,#bible-stream .app .sheet:focus-visible{outline:none}
#bible-stream .sheet h4{font:400 20px/1.3 var(--serif);margin:12px 0 0}
#bible-stream .sheet p{margin:0}

  let fs=[],is=[];if(n.level===4){const ids=new Set(chapSecs(n).map(s=>s.id));fs=STUDY.findings.filter(x=>ids.has(x.subject)).map(LOC);is=STUDY.interpretations.filter(x=>ids.has(x.subject)).map(LOC);}
  if(fs.length)h+=`<h4>${L?'Was steht da?':'What does it say?'}</h4>`+fs.map(f=>`<div class="point"><p class="body">${rich(f.claim)}</p></div>`).join('');
  if(is.length)h+=`<h4>${L?'Wie kann man es verstehen?':'How can it be understood?'}</h4>`+is.map(i=>`<div class="point"><span class="tag">${CONF[i.confidence]||''}</span><p class="body">${rich(i.claim)}</p>${i.caveat?`<p class="note"><b>${L?'Nicht sicher:':'Uncertain:'}</b> ${rich(i.caveat)}</p>`:''}</div>`).join('');
  if(!c&&!fs.length&&!is.length)h+=`<p class="body">${L?`Für diese Ebene (${ln}) ist noch keine Kernanalyse erarbeitet. Zusammenfassung und Bild stehen auf der Ebene selbst; Erarbeitetes zu einzelnen Abschnitten und Versen findest du dort.`:'Nothing worked out for this level yet.'}</p>`;
  openSheet('study',h+`<p class="note">${L?'Wie wir vorgehen: Menü › «So arbeiten wir».':'How we work: menu › “How we work”.'}</p>`+sheetTools(id,'h'));}
function dphFor(partId){const n0=nodes.get(partId);
  if(!n0.part){if(n0.level===4){const secs=chapSecs(n0),ids=new Set(secs.map(s=>s.id));
      return {bgs:BG.filter(b=>(b.wide&&ids.has(b.section))||ids.has(b.subject)).map(LOC),prs:STUDY.principles.filter(p=>ids.has(p.subject)).map(LOC),aps:STUDY.applications.filter(a=>ids.has(a.subject)).map(LOC)};}
    return {bgs:n0.level<=3?overviewFor(n0):[],prs:[],aps:[]};}
  const part=n0.part,sec=SECTION_OF[partId],subjects=[part.id,sec&&sec.id];
  return {bgs:bgForPart(partId),prs:STUDY.principles.filter(p=>subjects.includes(p.subject)&&inPart(p.ref,part)).map(LOC),aps:STUDY.applications.filter(a=>subjects.includes(a.subject)&&inPart(a.ref,part)).map(LOC)};}
function bgSheet(partId){const n0=nodes.get(partId),part=n0.part,t=T(),L=lang==='de',ln=LEVEL_NAME()[n0.level];refCtx=part?rangeOf(part.range).code:(n0.b!==undefined?DATA[n0.b].code:null);
  const {bgs,prs,aps}=dphFor(partId),auds=[...new Map(aps.filter(a=>a.ctx).map(a=>[a.ctx,a.ctx_label||a.context])).entries()];
  const aud=auds.some(([k])=>k===S.aud)?S.aud:'all',shown=aps.filter(a=>aud==='all'||a.ctx===aud);
  const empty=x=>`<p class="note">${x}</p>`;
  let h=head(t.dph)+`<p class="note">${esc(nodeTitle(n0))} · ${part?esc(refDe(part.range)):ln}</p>`;
  h+=`<nav class="dph-steps" aria-label="${esc(t.dph)}"><button type="button" data-dph="then">${t.dphThen}</button><span aria-hidden="true">→</span><button type="button" data-dph="principle">${t.dphPrinciple}</button><span aria-hidden="true">→</span><button type="button" data-dph="today">${t.dphToday}</button></nav>`;
  h+=`<h4 id="dph-then" class="dph-h">${t.dphThen}</h4><p class="note">${L?'Zeit, Ort und Kultur, als der Text entstand.':'Time, place and culture when the text was written.'}</p>`+(bgs.map(b=>bgNote(b,true)).join('')||empty(L?`Für diese Ebene (${ln}) gibt es noch keinen Hintergrund.`:'No background yet.'));
  h+=`<h4 id="dph-principle" class="dph-h">${t.dphPrinciple}</h4><p class="note">${L?'Was über die Zeit hinaus gilt. Ein Grundsatz geht weiter, als der Text selbst sagt; er ist eine Folgerung, kein Befund.':'What holds beyond that time. A principle goes beyond what the text itself says.'}</p>`+(prs.map(p=>`<div class="point"><span class="tag">${L?'abgeleiteter Grundsatz':'derived principle'} · ${CONF[p.confidence]||''}</span><p class="body">${rich(p.text)}</p>${S.advanced?`<p class="ref-id">${esc(p.id)}</p>`:''}</div>`).join('')||empty(L?`Für diese Ebene (${ln}) ist noch kein Grundsatz erarbeitet.`:'No principle yet.'));
  h+=`<h4 id="dph-today" class="dph-h">${t.dphToday}</h4><p class="note">${L?'Eine mögliche Übertragung in unsere Zeit, je Zielgruppe. Sie ist Anwendung, nicht Bibeltext.':'A possible transfer to our time, per audience. Application, not Bible text.'}</p>`;
  if(auds.length>1||(auds.length===1&&aps.some(a=>!a.ctx)))h+=`<div class="chips dph-aud">`+[['all',t.dphAll],...auds].map(([k,l])=>`<button type="button" class="chip${aud===k?' cur':''}" data-aud="${esc(k)}" data-aud-part="${partId}" aria-pressed="${aud===k}">${esc(l)}</button>`).join('')+`</div>`;
  h+=shown.map(a=>`<div class="point" data-app="${esc(a.id)}"><span class="tag">${esc(a.ctx_label||a.context||'')}${a.confidence?' · '+(CONF[a.confidence]||''):''}</span><p class="body">${rich(a.text)}</p>${a.limits?`<p class="note"><b>${L?'Grenze:':'Limit:'}</b> ${rich(a.limits)}</p>`:''}${S.advanced?`<p class="ref-id">${esc(a.id)}</p>`:''}</div>`).join('')||empty(L?`Für diese Ebene (${ln}) ist noch keine Anwendung erarbeitet.`:'No application yet.');
  openSheet('background',h+`<p class="note">${L?'Alle Hinweise sind Entwürfe und noch nicht fachlich geprüft. Hintergrund ist teils unsicher; Grundsatz und Anwendung sind Folgerungen.':'All notes are drafts, not yet reviewed.'}</p>`+sheetTools(partId,'u'));}
function bgOne(id){const b=LOC(BG.find(x=>x.id===id));openSheet('background',head(b.topic)+bgNote(b,true).replace(`<p class="bg-topic">${esc(b.topic)}</p>`,'')+bgDisclaimer());}

/* ---------- Bildsprache ----------
   Bilder je Zoomstufe und Stil (data/illustrations): Buch «JHN», Kapitel «JHN.2», Abschnitt = Texteinheit. Breite Ansicht:
   Text und Bild nebeneinander; schmal: Umschalter Text | Bild (für alle Einträge gleich, S.view). Bilder sind Deutung. */
function illFor(n){if(!ILL||S.ill==='off'||n.level>5)return null;const code=n.b!==undefined?DATA[n.b].code:null;
  const key=n.level===0?'SUM-BIBLE':n.level===1?(n.id==='ot'?'SUM-OT':'SUM-NT'):n.level===2?'SUM-GROUP-'+String(n.gi+1).padStart(2,'0'):n.level===3?code:n.level===4?code+'.'+n.c:(n.part?n.part.id:null);const it=key&&illItem(key);return it?{...LOC(it),key}:null;}
// Bild im gewählten Stil; fehlt es dort, das Symbolbild (damit keine Ebene leer bleibt)
function illItem(key){const all=ILL.items[key]||{};return all[S.ill]||all.symbol||null;}
// Stil-Umschalter direkt beim Bild, nur wenn es das Bild in mehreren Stilen gibt
const illStyles=(key,cur)=>{const ks=Object.keys(ILL.styles||{}).sort((a,b)=>(a==='symbol'?0:1)-(b==='symbol'?0:1)).filter(k=>(ILL.items[key]||{})[k]);if(ks.length<2)return '';
  return `<span class="ill-styles" role="group" aria-label="${T().illStyle}">${ks.map(k=>`<button type="button" data-ill-style="${k}" data-ill-key="${esc(key)}" aria-pressed="${k===cur}">${esc(lang==='de'?ILL.styles[k].label.de:ILL.styles[k].label.en)}</button>`).join('')}</span>`;};
// Bilder mit nur einem Feld halb breit, damit alle Felder gleich gross erscheinen (höchstens zwei Spalten)
// Bildgrösse nach Kacheln, nicht nach Platz (Hinweis Andi Neck 2026-10-24): jede Kachel höchstens etwa 340 px breit, ein Bild
// mit mehreren Kacheln nebeneinander entsprechend breiter; auf breiten Bildschirmen steht es dann unter dem Text statt daneben.
const illVbW=svg=>{const m=/viewBox="0 0 ([\d.]+) /.exec(svg||'');return m?+m[1]:380;};
// Kacheln (class="ill-tile") einzeln zeigen: auf dem Handy untereinander in voller Breite, sonst bis zwei nebeneinander
const TILE_RE=/<svg class="ill-tile[^"]*"[\s\S]*?<\/svg>/g;
const illTiles=svg=>{const t=String(svg||'').match(TILE_RE);if(!t)return null;return t.map(x=>x.replace(/ x="[^"]*" y="[^"]*" width="[^"]*" height="[^"]*"/,''));};
const illSvg=svg=>{const t=illTiles(svg);return t?`<div class="ill-tiles">${t.join('')}</div>`:svg;};
const illNarrow=svg=>illTiles(svg)?'':` tiles" style="max-width:${Math.round(illVbW(svg)*1.8)}px`;
const illWide=il=>{const t=illTiles(il&&il.svg);return t?(t.filter(x=>!x.includes('ill-narrow')).length>1||t.some(x=>x.includes('data-span="2"'))):illVbW(il&&il.svg)>=300;};
// Bilder ohne Worte (Kapitelebene, Hinweis Andi Neck 2026-10-25): zum Abrufen nach dem Lernen. Die Worte im Bild und die
// Zusammenfassung daneben sind verdeckt; Antippen eines Feldes oder Kästchens zeigt dessen Worte, Antippen des Textes den Text.
const nwBtn=()=>`<button type="button" class="link soft nowords-btn" data-nowords="1" aria-pressed="${!!S.nowords}" title="${lang==='de'?'Bild ohne Worte: Inhalt aus dem Gedächtnis zusammenbringen':'Picture without words: recall the content'}">${lang==='de'?'Ohne Worte':'No words'}</button>`;
const illFigure=(il,nw)=>`<figure class="ill${nw&&S.nowords?' nowords':''}"><div class="ill-img${illNarrow(il.svg)}" role="img" aria-label="${esc(il.alt)}">${illSvg(il.svg)}</div><figcaption><button type="button" class="link soft" data-legend="${esc(il.key)}">${T().legend}</button>${nw?nwBtn():''}${illStyles(il.key,il.style)}</figcaption></figure>`;
// Bilder auf Versebene (Hinweis Andi Neck 2026-10-25: je Abschnitt ein- und ausblendbar, Schalter beim Abschnittstitel; S.vill[Abschnitt]):
// zum ersten Vers eines Feldes das Feld des Abschnittsbilds (mit schmaler Fassung fürs Handy)
const refV=r=>{const a=String(r||'').split('-')[0].split('.');return {c:+a[1],v:+a[2]};};
const villBtn=p=>{if(!ILL||S.ill==='off'||!p.part||!illFor(p))return '';const on=!!(S.vill||{})[p.part.id],L=lang==='de';
  return `<button type="button" class="tool vill-btn" data-vill="${esc(p.part.id)}" aria-pressed="${on}" title="${L?'Bilder bei den Versen dieses Abschnitts':'Pictures at the verses of this section'}">${icon('image')}<span>${on?(L?'Bilder aus':'Hide pictures'):(L?'Bilder':'Pictures')}</span></button>`;};
function verseIll(n){if(!ILL||S.ill==='off')return '';const p=nodes.get(n.parent);if(!p||p.level!==5||!p.part||!(S.vill||{})[p.part.id])return '';const il=illFor(p);if(!il||!il.panels)return '';
  const tiles=illTiles(il.svg);if(!tiles)return '';const groups=[];tiles.forEach(t=>{if(t.includes('ill-narrow')&&groups.length)groups[groups.length-1].push(t);else groups.push([t]);});
  const out=[];il.panels.forEach((pn,i)=>{const r=refV(pn.ref);if(r.c===n.c&&r.v===n.v&&groups[i])out.push(groups[i].join(''));});
  if(!out.length)return '';return `<figure class="ill verse-ill" role="img" aria-label="${esc(il.alt)}"><div class="ill-tiles">${out.join('')}</div><figcaption><button type="button" class="link soft" data-legend="${esc(il.key)}">${T().legend}</button></figcaption></figure>`;}
function legendSheet(key){const it0=illItem(key),st=it0&&ILL.styles[it0.style];if(!st||!it0)return;const it=LOC(it0),t=T(),L=lang==='de';
  const acts=it.actions||it.panels.map(p=>p.action),ORDER=['divine','people','thing','place','action','concept'],grp=l=>l.group||l.kind;
  // Bildhilfe je Feld: Nummer wie im Bild, Kurztitel fett, was man sieht und wofür die Zeichen stehen, Stelle klein dahinter
  const caps=it.captions||[],one=it.panels.length===1;
  const steps=`<ol class="legend-panels${one?' one':''}">${it.panels.map((p,i)=>{const c=caps[i]||acts[i]||p.action,k=c.indexOf(': '),tt=k>0?c.slice(0,k):'',tx=k>0?c.slice(k+2):c;
    return `<li>${one?'':`<span class="lp-n">${p.n}</span>`}<span>${tt?`<b>${esc(tt)}</b> `:''}${rich(tx)}${it.level==='book'?'':` <span class="ref-small">${esc(refAny(p.ref))}</span>`}</span></li>`;}).join('')}</ol>`;
  const figs=(it.depicts||[]).map(id=>({id,lx:(ILL.lexicon||{})[id],r:(st.renderings||{})[id]})).filter(x=>x.lx&&x.r).sort((a,b)=>ORDER.indexOf(grp(a.lx))-ORDER.indexOf(grp(b.lx)));
  openSheet('legend',head(t.legendTitle)+`<div class="ill-img legend-img${illNarrow(it.svg)}">${illSvg(it.svg)}</div>${illStyles(key,it0.style)}`+steps+(figs.length?`<h4>${t.legendFigures}</h4><div class="legend-figs">${figs.map(f=>`<div class="legend-fig"><svg viewBox="${f.r.viewbox}" aria-hidden="true"><use href="#${f.r.symbol}"/></svg><span><b>${esc(L?f.lx.name.de:f.lx.name.en)}</b><span class="sub">${esc(f.lx.legend?(f.lx.legend[S.text]||f.lx.legend.de):f.lx.traits.join(' · '))}</span></span></div>`).join('')}</div>`:'')+(it.note?`<p class="note">${rich(it.note)}</p>`:'')+(it.check?`<p class="note">${t.legendCheck} ${esc(it.check)}</p>`:'')+`<p class="note">${t.legendNote} ${esc(L?st.label.de:st.label.en)}.</p>`);}

/* ---------- Einträge ---------- */
const entryM=id=>{const n=nodes.get(id);return marks(entry(id),n&&n.b!==undefined?DATA[n.b].code:null);};
function entry(id){
  const n=nodes.get(id),t=T();
  if(n.level===6)return verseEntry(n);
  const text=summary(n);
  const deep=n.children.length?`<button type="button" class="link" data-deep="${id}">${t.deeper[n.level]}${icon('arrow-down')}</button>`:'';

  const heading=n.level===5&&n.part?pTitle(n.part):(n.level===5?(lang==='de'?'Verse ':'Verses ')+n.v+'–'+n.last:title(n));
  const copy=text?sumHtml(text):`<p class="stream-copy quiet">${n.level===5?t.noPart:t.noSummary}</p>`;
  const il=illFor(n);
  const tg=il?`<span class="ill-toggle" role="group" aria-label="${t.viewText} / ${t.viewImage}">${['text','image'].map(v=>`<button type="button" data-view="${v}" aria-label="${v==='text'?t.viewText:t.viewImage}" title="${v==='text'?t.viewText:t.viewImage}" aria-pressed="${(S.view==='image'?'image':'text')===v}">${icon(v)}</button>`).join('')}</span>`:'';
  const tl=tools(id);
  const nw=il&&n.level===4;
  const body=il?`<div class="ill-wrap${illWide(il)?' wide':''}${nw&&S.nowords?' nowords':''}"><div class="ill-text">${copy}</div>${illFigure(il,nw)}</div>`:copy;
  return `<article class="stream-entry${il?' has-ill':''}" data-stream="${id}">${eyebrow(n)?`<p class="eyebrow">${esc(eyebrow(n))}</p>`:''}<h2>${esc(heading)}${readBtn(id)}</h2>${tg?`<div class="entry-tools">${tl}${tg}</div>`:tl}${body}<div class="actions">${deep}</div></article>`;
}
function tools(id,which='uh'){const t=T();return `<span class="part-tools">${which.includes('u')?`<button type="button" class="tool" data-study="${id}" aria-label="${t.understand}">${icon('understand')}<span>${t.toolUnderstand}</span></button>`:''}${which.includes('h')?`<button type="button" class="tool" data-background="${id}" aria-label="${t.dph}">${icon('history')}<span>${t.toolHistory}</span></button>`:''}</span>`;}
const sheetTools=(id,which)=>{const n=nodes.get(id);return `<div class="sheet-tools"><span class="note">${LEVEL_NAME()[n.level]}: ${esc(nodeTitle(n))}</span>${tools(id,which)}</div>`;};
function verseEntry(n){
  const t=T(),text=summary(n);let lead='';
  if(n.v===1)lead+=`<h2 class="chapter-head">${esc(bookName(n)+' '+n.c)}${readBtn(n.id)}</h2>`;
  const p=nodes.get(n.parent);if(p.part&&p.v===n.v)lead+=`<div class="part-head"><h3>${esc(pTitle(p.part))}${readBtn(n.id)}</h3>${tools(p.id).replace(/<\/span>$/,villBtn(p)+'</span>')}</div>`;
  if(!text)return `<article class="stream-entry verse placeholder" data-stream="${n.id}">${lead}<p class="verse-line">${DSS[n.canonicalRef]&&DSS[n.canonicalRef].length?`<button type="button" class="vno more" data-more="${n.id}" aria-label="${t.more} ${n.v}">${n.v}</button>`:`<span class="vno">${n.v}</span>`}<span class="stream-copy">${S.flow?'…':t.placeholder}</span></p></article>`;
  const alts=altsFor(n);
  const bgs=bgFor(n);
  const has=worked(n);
  const vno=`<button type="button" class="vno${has?' more':' plain'}" data-more="${n.id}" aria-label="${t.more} ${n.v}">${n.v}</button>`;
  return `<article class="stream-entry verse" data-stream="${n.id}">${lead}${verseIll(n)}<p class="verse-line">${vno}<span class="stream-copy" data-ref="${n.canonicalRef}">${decorate(text,LAYER().decisions[n.canonicalRef],alts,n.id)}</span>${merkMark(n)}</p>${merkCard(n,text)}</article>`;
}
// ---------- Merkverse und Lernen ----------
// Merkverse: Bilder der Ebene «verse» (ILL.merk). Anzeige im Lesetext nach Einstellung S.merk: 'mark' (kleines Zeichen am Vers,
// Karte auf Antippen), 'card' (Karte im Text), 'off'. Lernen: Merkverse eines Kapitels, Buches oder alle, mit mehreren Methoden.
// Lernstand nur auf diesem Gerät (localStorage «bible:learn»; ältere Fassungen: «lesestrom-lernen», wird übernommen): je Vers Kasten (Leitner) und nächste Wiederholung.
const LEARN_KEY='bible:learn',LEARN_OLD='lesestrom-lernen',BOX_DAYS=[0,1,3,7,14,30,60];
let LS={};try{LS=JSON.parse(localStorage.getItem(LEARN_KEY)||localStorage.getItem(LEARN_OLD)||'{}')||{};}catch(e){LS={};}
const lsSave=()=>{try{localStorage.setItem(LEARN_KEY,JSON.stringify(LS));}catch(e){}};
const MERK=()=>(ILL&&ILL.merk)||[];
const isDue=r=>!LS[r]||!LS[r].due||LS[r].due<=Date.now();
const merkCode=r=>r.split('.')[0];
function merkCardHtml(ref,text){const it=illItem(ref);if(!it)return '';const il={...LOC(it),key:ref};
  return `<figure class="merk"><div class="ill-img" role="img" aria-label="${esc(il.alt)}">${illSvg(il.svg)}</div><figcaption class="merk-body"><span class="merk-label">${lang==='de'?'Merkvers':'Memory verse'}</span><p class="merk-text">«${esc(text)}»</p><span class="merk-ref">${esc(refDe(ref))}</span><button type="button" class="link soft" data-legend="${esc(il.key)}">${T().legend}</button></figcaption></figure>`;}
function merkCard(n,text){if(!ILL||S.ill==='off'||(S.merk||'mark')!=='card')return '';return merkCardHtml(n.canonicalRef,text);}
function merkMark(n){if(!ILL||S.ill==='off'||(S.merk||'mark')!=='mark'||!MERK().includes(n.canonicalRef))return '';
  return `<button type="button" class="merk-mark" data-merk="${n.canonicalRef}" aria-label="${lang==='de'?'Merkvers mit Bild':'Memory verse with picture'}" title="${lang==='de'?'Merkvers':'Memory verse'}">${icon('bookmark')}</button>`;}
function merkSheet(ref){withData([merkCode(ref)],()=>{const L_=lang==='de',tx=LAYER().text[ref]||STUDY.layers.de.text[ref]||'';
  openSheet('merk',head(L_?'Merkvers':'Memory verse')+merkCardHtml(ref,tx)+`<button type="button" class="row" data-learn="scope:ch:${ref}">${icon('list')}<span>${L_?'Merkverse dieses Kapitels lernen':'Learn this chapter’s memory verses'}<span class="sub">${L_?'Karteikarten, Anfangsbuchstaben, Lückentext …':'Flashcards, first letters, cloze …'}</span></span>${icon('chevron-right')}</button>`);});}
// Lernsitzung
let LN=null;
const METHODS=[
 ['cards','Karteikarten','Bild und Stelle sehen, den Vers aus dem Gedächtnis sagen, dann aufdecken und ehrlich bewerten. Fällige Karten kommen nach dem Leitner-System wieder (1, 3, 7, 14, 30, 60 Tage).','Flashcards','See picture and reference, recall the verse, reveal and rate yourself. Due cards return by the Leitner system (1, 3, 7, 14, 30, 60 days).'],
 ['letters','Anfangsbuchstaben','Nur der erste Buchstabe jedes Wortes steht da; den Vers dazu laut sagen. Hilft beim wörtlichen Einprägen.','First letters','Only the first letter of each word is shown; say the verse aloud. Helps word-for-word memorising.'],
 ['cloze','Lückentext stufenweise','Erst fehlen wenige Wörter, dann immer mehr, bis der ganze Vers aus dem Gedächtnis kommt. Lücke antippen zeigt das Wort.','Fading cloze','First a few words are missing, then more, until the whole verse comes from memory. Tap a gap to show the word.'],
 ['order','Wörter ordnen','Die Wörter des Verses in die richtige Reihenfolge tippen.','Word order','Tap the words of the verse in the right order.'],
 ['quiz','Wo steht das?','Zum Vers die richtige Stelle wählen – oder zum Bild. Übt die Verbindung von Wortlaut, Bild und Stelle.','Where is it?','Pick the right reference for the verse or the picture. Links wording, picture and reference.']];
const shuffle=(a,seed)=>{a=[...a];let x=seed||1;for(let i=a.length-1;i>0;i--){x=(x*9301+49297)%233280;const j=Math.floor(x/233280*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const hashStr=s=>{let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))%100003;return h;};
const words=t=>t.split(/\s+/).filter(Boolean);
const core=w=>w.replace(/^[«‹(„"'\[]+|[»›)"'.,;:!?\]…–-]+$/g,'');
function scopeRefs(sc){const all=MERK();if(sc.startsWith('ch:')){const [b,c]=sc.slice(3).split('.');return all.filter(r=>r.startsWith(b+'.'+c+'.'));}
  if(sc.startsWith('bk:')){const b=sc.slice(3);return all.filter(r=>merkCode(r)===b);}if(sc==='due')return all.filter(isDue);return all;}
function scopeLabel(sc){const L_=lang==='de';if(sc.startsWith('ch:')){const [b,c]=sc.slice(3).split('.');return refDe(b+'.'+c+'.1').replace(/[,:]1$/,'');}

   Verse mit Kapitel- und Abschnittstitel). Einträge ohne Text werden übersprungen. Pause bricht die Ausgabe ab und setzt
