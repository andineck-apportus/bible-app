<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bibel · Lesestrom</title>
<style>
/* Ein Lesestrom über die ganze Bibel. Ruhige Fläche, Leisten treten beim Lesen zurück; Erklärungen und Hintergrund nur auf Wunsch (Blatt von unten). */
:root{color-scheme:light dark}
html,body{margin:0;height:100%;background:#f7f7f6}
#bible-stream{height:100%}
#bible-stream .app{
  --bg:#f7f7f6;--ink:#1f1f1f;--muted:#6b6b6b;--rule:#dcdcda;--soft:#ececea;--sheet:#ffffff;--scrim:rgba(20,20,20,.28);
  --r:6px;--read:19px;--ui:"Helvetica Neue",Arial,sans-serif;--serif:Georgia,"Iowan Old Style","Times New Roman",serif;
  position:relative;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.45 var(--ui);color-scheme:light}
#bible-stream .app[data-theme=dark]{--bg:#171717;--ink:#ececec;--muted:#a3a3a3;--rule:#343434;--soft:#262626;--sheet:#1f1f1f;--scrim:rgba(0,0,0,.55);color-scheme:dark}
html:has(.app[data-theme=dark]),html:has(.app[data-theme=dark]) body{background:#171717}
#bible-stream .app *{box-sizing:border-box}
#bible-stream .app button{font:inherit;color:inherit;border:0;border-radius:0;background:transparent;padding:0;cursor:pointer;text-align:left}
#bible-stream .app button:disabled{opacity:.3;cursor:default}
#bible-stream .app :is(button,input,[tabindex]):focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#bible-stream .app svg{display:block;width:18px;height:18px;flex:0 0 18px}
#bible-stream .logo{width:24px!important;height:25px!important;flex-basis:24px!important}

/* Leisten */
#bible-stream .bar{position:absolute;left:0;right:0;z-index:4;display:flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:transform .25s ease,opacity .25s ease}
#bible-stream .top{top:0;padding:calc(6px + env(safe-area-inset-top,0px)) 10px 6px;border-bottom:1px solid var(--rule)}
#bible-stream .dock{bottom:0;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--rule);display:grid;grid-template-columns:1fr auto 1fr}
#bible-stream .immersed .top{transform:translateY(-105%);opacity:0}
#bible-stream .immersed .dock{transform:translateY(105%);opacity:0}
#bible-stream .icon-btn{width:44px;height:44px;display:grid!important;place-items:center;border-radius:var(--r)!important}
#bible-stream .icon-btn:hover,#bible-stream .location:hover,#bible-stream .dock button:hover:not(:disabled){background:var(--soft)}
#bible-stream .app .location{border-radius:var(--r)!important;padding:0 10px!important}
#bible-stream .dock button{border-radius:var(--r)!important}
#bible-stream .location{flex:1;min-width:0;height:44px;display:flex;align-items:center;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bible-stream .dock button{height:44px;display:flex;align-items:center;gap:8px;font-size:14px;padding:0 10px}
#bible-stream .dock [data-action=down]{justify-content:flex-end}
#bible-stream .dock .depth{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 14px}

/* Lesefläche */
#bible-stream aside{display:none}
#bible-stream .reader{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:calc(76px + env(safe-area-inset-top,0px)) 22px calc(110px + env(safe-area-inset-bottom,0px))}
#bible-stream .column{max-width:36em;margin:0 auto}
#bible-stream .stream-entry{padding:34px 0 30px;border-top:1px solid var(--rule)}
#bible-stream .stream-entry:first-child{border-top:0;padding-top:8px}
#bible-stream .eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
#bible-stream h2{font:400 28px/1.15 var(--ui);letter-spacing:-.4px;margin:0 0 14px;text-wrap:balance}
#bible-stream .stream-copy{font:400 var(--read)/1.65 var(--serif);margin:0}
#bible-stream .quiet{color:var(--muted)}
#bible-stream .actions{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:20px}
#bible-stream .link{display:inline-flex!important;align-items:center;gap:8px;min-height:40px;font-size:15px;border-bottom:1px solid currentColor!important}
#bible-stream .link.soft{border-bottom-color:var(--rule)!important;color:var(--muted)}
#bible-stream .example{margin-top:18px;display:flex!important;justify-content:space-between;align-items:center;width:100%;padding:14px 0!important;border-top:1px solid var(--rule)!important;border-bottom:1px solid var(--rule)!important}

/* Verse: fliessender Text */
#bible-stream .stream-entry.verse{border:0;padding:0 0 .55em}
#bible-stream .chapter-head{font:400 30px/1.15 var(--ui);letter-spacing:-.4px;margin:30px 0 4px}
#bible-stream .part-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:22px 0 10px}
#bible-stream .part-head h3{font:italic 400 calc(var(--read) * .95)/1.4 var(--serif);color:var(--muted);margin:0}
#bible-stream .part-tools{display:inline-flex;gap:4px;margin:0}
#bible-stream h2+.part-tools{margin:-4px 0 10px}
#bible-stream .sheet-tools{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px 10px;border-top:1px solid var(--rule);padding-top:12px;margin-top:8px}
#bible-stream .app .tool{display:inline-flex!important;align-items:center;gap:5px;padding:5px 8px!important;font:500 12px/1 var(--ui);color:var(--muted);border-radius:var(--r)!important}
#bible-stream .tool svg{width:16px;height:16px}
#bible-stream .tool:hover,#bible-stream .tool:active{color:var(--ink);background:var(--soft)}
#bible-stream button.vno.more{display:inline-grid!important;place-items:center;min-width:1.9em;height:1.9em;padding:0 3px!important;margin:0 5px 0 -2px;border:1px solid var(--rule)!important;border-radius:var(--r)!important;vertical-align:.25em;color:var(--ink);font:500 11px/1 var(--ui)}
#bible-stream button.vno.more:hover,#bible-stream button.vno.more:active{background:var(--soft)}
#bible-stream button.dec{display:inline!important;padding:0!important;font:inherit;color:inherit;background:none;border:0!important;cursor:pointer;text-align:inherit}
#bible-stream .bg-lines{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;margin:0 0 8px 1.6em;color:var(--muted)}
#bible-stream .bg-label svg{width:14px;height:14px;vertical-align:-2px}
#bible-stream .verse-line{font:400 var(--read)/1.75 var(--serif);margin:0}
#bible-stream .app.flow .column{line-height:1.75}
#bible-stream .app.flow .stream-entry.verse,#bible-stream .app.flow .verse-line{display:inline;padding:0}
#bible-stream .app.flow .stream-entry.verse::after{content:' '}
#bible-stream .app.flow .alt-line{display:inline;margin:0 .25em}
#bible-stream .app.flow .bg-lines,#bible-stream .app.flow .bg-label,#bible-stream .app.flow .bg-line{display:inline!important;margin:0 .35em 0 0}
#bible-stream .app.flow .bg-lines{margin-left:.25em}
#bible-stream .app.flow .bg-label svg{display:inline-block!important;vertical-align:-2px;margin-right:.25em}
#bible-stream .app.flow .part-head{margin:22px 0 6px}
#bible-stream .vno{font:500 11px/1 var(--ui);color:var(--muted);vertical-align:.6em;margin-right:4px;font-variant-numeric:tabular-nums}
#bible-stream .placeholder .stream-copy{color:var(--muted);font-size:calc(var(--read) * .8)}
#bible-stream .more{display:inline-grid!important;place-items:center;width:28px;height:28px;margin-left:4px;vertical-align:-6px;border-radius:var(--r)!important;color:var(--muted)}
#bible-stream .more:hover{background:var(--soft);color:var(--ink)}
#bible-stream .more svg{width:15px;height:15px;flex-basis:15px}
#bible-stream .alt-line{display:block;font:italic 400 calc(var(--read) * .82)/1.5 var(--serif);color:var(--muted);margin:2px 0 8px 1.4em}
#bible-stream .part-end{margin:4px 0 18px}
#bible-stream .app button.ref{display:inline!important;padding:0!important;font:inherit;color:inherit;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:.2em}
#bible-stream .app button.ref:hover{text-decoration-color:var(--ink)}
#bible-stream .xrefs{display:flex;flex-wrap:wrap;gap:6px}
#bible-stream .app button.ref.chip{display:inline-flex!important;align-items:center;padding:7px 11px!important;border:1px solid var(--rule)!important;border-radius:var(--r)!important;font:500 13px/1 var(--ui);text-decoration:none}
#bible-stream .app button.ref.chip:hover{background:var(--soft)}
#bible-stream .jump{position:absolute;left:0;right:0;top:calc(58px + env(safe-area-inset-top,0px));z-index:4;display:flex;justify-content:center;pointer-events:none}
#bible-stream .app .jump-back{pointer-events:auto;display:inline-flex!important;align-items:center;gap:6px;padding:7px 12px 7px 9px!important;border-radius:var(--r)!important;background:var(--ink);color:var(--bg);font:500 13px/1 var(--ui);box-shadow:0 2px 10px rgba(0,0,0,.18)}
#bible-stream .app .jump-back svg{width:15px;height:15px;transform:rotate(-90deg)}
#bible-stream .immersed .jump{opacity:0;pointer-events:none;transition:opacity .2s}
#bible-stream .crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;margin:2px 0 14px;font:500 14px/1.3 var(--ui)}
#bible-stream .app .crumbs button{padding:5px 7px!important;border-radius:var(--r)!important}
#bible-stream .app .crumbs button:hover{background:var(--soft)}
#bible-stream .app .crumbs button[aria-current=true]{background:var(--ink);color:var(--bg)}
#bible-stream .crumbs .sep{color:var(--muted);padding:0 2px}
#bible-stream .nav-block{margin-top:18px}
#bible-stream .sheet .nav-block h4{font:500 12px/1.4 var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
#bible-stream .app .nav-block .open{text-transform:none;letter-spacing:0;font:500 13px/1 var(--ui);color:var(--ink);display:inline-flex!important;align-items:center;gap:2px;padding:6px 4px 6px 8px!important;border-radius:var(--r)!important}
#bible-stream .app .nav-block .open:hover{background:var(--soft)}
#bible-stream .nav-block .open svg{width:15px;height:15px}
#bible-stream .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
#bible-stream .app .chip{padding:8px 12px!important;border:1px solid var(--rule)!important;border-radius:var(--r)!important;font:500 13px/1 var(--ui)}
#bible-stream .app .chip:hover{background:var(--soft)}
#bible-stream .app .chip.cur,#bible-stream .app .grid button.cur{background:var(--ink);color:var(--bg);border-color:var(--ink)!important}
#bible-stream .grid{display:grid;gap:6px}
#bible-stream .grid.nums{grid-template-columns:repeat(auto-fill,minmax(42px,1fr))}
#bible-stream .grid.books{grid-template-columns:repeat(auto-fill,minmax(86px,1fr))}
#bible-stream .app .grid button{position:relative;min-height:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px!important;border:1px solid var(--rule)!important;border-radius:var(--r)!important;font:500 14px/1.1 var(--ui);text-align:center;font-variant-numeric:tabular-nums}
#bible-stream .app .grid button:not(.cur):hover{background:var(--soft)}
#bible-stream .grid.books small{font:400 10.5px/1.15 var(--ui);color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bible-stream .grid button.cur small{color:inherit;opacity:.8}
#bible-stream .grid button.study::after,#bible-stream .nav-legend .dot{content:'';position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55}
#bible-stream .nav-legend{display:flex;align-items:center;gap:6px;margin-top:14px}
#bible-stream .nav-legend .dot{position:static;display:inline-block}
#bible-stream .nav-block .row{margin-bottom:6px}
#bible-stream .gap{margin:0 0 10px;font:400 14px/1.45 var(--ui);color:var(--muted)}
#bible-stream .grc{font-family:var(--serif);font-size:1.05em;letter-spacing:.01em}
#bible-stream .dec{text-decoration-line:underline;text-decoration-thickness:1px;text-underline-offset:.22em;text-decoration-color:var(--muted)}
#bible-stream .dec.traditional{text-decoration-style:dotted}
#bible-stream .dec.interpretive{text-decoration-style:dashed}
#bible-stream .dec-tag.traditional,#bible-stream .dec-tag.interpretive{color:var(--ink)}
#bible-stream .grc-line{display:inline-flex;align-items:center;flex-wrap:wrap;gap:2px}
#bible-stream .play{display:inline-flex!important;align-items:center;justify-content:center;width:32px;height:32px;margin-left:4px;vertical-align:middle;color:var(--muted);border-radius:var(--r);flex:none}
#bible-stream .play svg{width:18px;height:18px}
#bible-stream .play:hover,#bible-stream .play:active{color:var(--ink);background:var(--soft)}
#bible-stream .tr-inline{font-family:var(--serif);color:var(--muted)}
#bible-stream .terms{display:flex;flex-direction:column;gap:2px;margin:2px 0 0;font-size:14px;color:var(--muted)}
#bible-stream .term{display:inline-flex;align-items:center;flex-wrap:wrap;gap:4px}
#bible-stream .term .lang{font-size:11px;letter-spacing:.06em;text-transform:uppercase}
#bible-stream .term .grc,#bible-stream .term .heb{color:var(--ink);font-family:var(--serif);font-size:16px}
#bible-stream .term .play,#bible-stream .body .play,#bible-stream .note .play{width:26px;height:26px;margin-left:0}
#bible-stream .term .play svg,#bible-stream .body .play svg,#bible-stream .note .play svg{width:15px;height:15px}
#bible-stream .tr{display:block;font:italic 14px/1.45 var(--serif);color:var(--muted);margin:0}
#bible-stream .il .tr{font-size:12.5px}
#bible-stream .il .g{display:inline-flex;align-items:center}
#bible-stream .set .chips{margin-top:0;justify-content:flex-end;max-width:100%}
#bible-stream .grc.small{font-size:15px;color:var(--muted);margin:6px 0 0;line-height:1.5}
#bible-stream .word-table{display:flex;flex-direction:column;gap:10px}
#bible-stream .word-row{display:flex;flex-direction:column;gap:2px;border-left:2px solid var(--rule);padding-left:12px}
#bible-stream .wit-group{border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
#bible-stream .wit-group.main{border-color:var(--ink)}
#bible-stream .wit-group p{margin:0}
#bible-stream .wit summary{display:flex;gap:12px;align-items:baseline;cursor:pointer;list-style:none;padding:6px 0;border-top:1px solid var(--soft)}
#bible-stream .wit summary::-webkit-details-marker{display:none}
#bible-stream .wit .sig{min-width:2.2em;font:500 17px/1 var(--serif);text-align:center}
#bible-stream .wit .sig.long{font:500 11px/1.2 var(--ui);color:var(--muted);max-width:3.4em}
#bible-stream .wit[open] summary{border-bottom:0}
#bible-stream .wit>p{margin:4px 0 4px 3.3em}
#bible-stream .sheet a{color:inherit;text-decoration:underline;text-decoration-color:var(--rule)}
#bible-stream .app .bg-line{display:inline;padding:2px 0;font:400 13px/1.4 var(--ui);color:var(--muted);text-align:left;border-bottom:1px dotted var(--rule)!important}
#bible-stream .bg-topic{font:500 16px/1.35 var(--ui);margin:0}

#bible-stream .load{display:block;margin:24px auto 0;font-size:13px;color:var(--muted)}
#bible-stream .end{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;margin:40px 0 0}

/* Blatt */
#bible-stream .scrim{position:absolute;inset:0;background:var(--scrim);z-index:8}
#bible-stream .sheet{position:absolute;left:0;right:0;bottom:0;z-index:9;max-height:88%;overflow-y:auto;background:var(--sheet);border-top:1px solid var(--rule);padding:8px 22px calc(28px + env(safe-area-inset-bottom,0px))}
#bible-stream .sheet .column{display:flex;flex-direction:column;gap:14px}
#bible-stream .grab{width:36px;height:4px;background:var(--rule);margin:6px auto 4px}
#bible-stream .sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
#bible-stream .sheet-head h3{font:400 24px/1.2 var(--ui);margin:0}
#bible-stream .app .close{display:inline-flex!important;align-items:center;gap:6px;flex:none;min-height:38px;padding:0 12px 0 9px!important;color:var(--muted);font:500 14px/1 var(--ui);border-radius:var(--r)!important;transition:background .15s,color .15s}
#bible-stream .close svg{width:18px;height:18px}
#bible-stream .close:hover,#bible-stream .close:active{background:var(--soft);color:var(--ink)}
#bible-stream .app .sheet:focus,#bible-stream .app .sheet:focus-visible{outline:none}
#bible-stream .sheet h4{font:400 20px/1.3 var(--serif);margin:12px 0 0}
#bible-stream .sheet p{margin:0}
#bible-stream .sheet .body{font:400 17px/1.6 var(--serif)}
#bible-stream .sheet .note{font-size:14px;color:var(--muted)}
#bible-stream .point{border-left:2px solid var(--rule);padding-left:14px;display:flex;flex-direction:column;gap:6px}
#bible-stream .pair{display:grid;gap:8px}
#bible-stream .reading-card{border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:5px}
#bible-stream .reading-card.main{border-color:var(--ink)}
#bible-stream .tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#bible-stream .dots{display:inline-flex;gap:4px;margin-right:8px;vertical-align:middle}
#bible-stream .dots i{width:8px;height:8px;background:var(--rule)}
#bible-stream .dots i.on{background:var(--ink)}
#bible-stream .il{display:flex;flex-wrap:wrap;gap:12px 14px}
#bible-stream .il details{min-width:0}
#bible-stream .il summary{list-style:none;cursor:pointer;display:flex;flex-direction:column}
#bible-stream .il summary::-webkit-details-marker{display:none}
#bible-stream .il .g{font:400 19px/1.3 var(--serif)}
#bible-stream .il .d{font-size:13px}
#bible-stream .il .e{font-size:11.5px;color:var(--muted)}
#bible-stream .il details[open]{flex-basis:100%;border-left:2px solid var(--rule);padding-left:12px}
#bible-stream .il details[open] summary{margin-bottom:6px}
#bible-stream .kv{display:grid;grid-template-columns:9em minmax(0,1fr);gap:4px 10px;font-size:14px}
#bible-stream .kv dt{color:var(--muted)}#bible-stream .kv dd{margin:0}
#bible-stream .ref-id{font:11px/1.4 ui-monospace,Menlo,monospace;color:var(--muted);overflow-wrap:anywhere}
#bible-stream .row{display:flex!important;justify-content:space-between;align-items:center;width:100%;min-height:50px;border-top:1px solid var(--rule)!important;gap:10px}
#bible-stream .row .sub{display:block;font-size:12.5px;color:var(--muted)}
#bible-stream .row.current{font-weight:600}
#bible-stream .set{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:10px 14px;padding:12px 0;border-top:1px solid var(--rule)}
#bible-stream .set>span:first-child{flex:1 1 200px;min-width:0}
#bible-stream .set .seg,#bible-stream .set .switch,#bible-stream .set .chips{margin-left:auto}
#bible-stream .set .sub{display:block;font-size:13px;color:var(--muted)}
#bible-stream .seg{display:inline-flex;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
#bible-stream .seg button{padding:8px 12px!important;font-size:14px;min-height:38px}
#bible-stream .seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
#bible-stream .switch{width:46px;height:28px;background:var(--rule)!important;position:relative;flex:0 0 auto;border-radius:14px!important}
#bible-stream .switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--sheet);transition:transform .15s}
#bible-stream .switch[aria-checked=true]{background:var(--ink)!important}
#bible-stream .switch[aria-checked=true]::after{transform:translateX(18px)}
#bible-stream input[type=search]{width:100%;font:16px var(--ui);padding:12px;border:1px solid var(--rule);background:var(--bg);color:var(--ink);border-radius:var(--r)}
#bible-stream details.about summary{cursor:pointer;padding:12px 0;border-top:1px solid var(--rule)}
#bible-stream details.about div{display:flex;flex-direction:column;gap:8px;font-size:13.5px;color:var(--muted);padding-bottom:10px}
#bible-stream .live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

@media (min-width:900px){
  #bible-stream aside{display:block;position:absolute;left:0;top:57px;bottom:57px;width:250px;overflow:auto;padding:18px 14px 24px;border-right:1px solid var(--rule)}
  #bible-stream aside .eyebrow{margin:0 10px 8px}
  #bible-stream .app aside button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:8px 10px!important;margin-bottom:2px;font:400 13.5px/1.35 var(--ui);color:var(--muted);border-radius:var(--r)!important}
  #bible-stream .app aside button:hover{background:var(--soft);color:var(--ink)}
  #bible-stream .app aside button[aria-current=true]{background:var(--ink);color:var(--bg)}
  #bible-stream aside button .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55;flex:none}
  #bible-stream .reader{left:230px}

,"source_notice":"Public Domain (eBible.org / CrossWire); UK printing restrictions on translation noted upstream","source_files_date":"2026-09-26","method":"Independently count distinct USFM verse markers per chapter; no translation text copied","chapters":1189,"verses":31102},"versification":"KJV (Testkonfiguration)","authorship_de":"Struktur aus dem Lesetiefe-Prototyp vom 2026-10-11 übernommen; Zahlen unabhängig aus eBible-KJV-USFM nachgezählt (siehe counts_source).","migrated_from":"app/reading-stream/template.html","knowledge":{"asserted_at":"2026-10-11","supersedes":null}};
const SUMS={"SUM-BIBLE":{"text":"Die Bibel versammelt Erzählungen, Gebete, Weisheit, prophetische Stimmen und Briefe. In christlicher Lesart verbindet sie die Geschichte Gottes mit Israel mit dem Leben, dem Tod und der Auferstehung Jesu sowie der Hoffnung auf eine erneuerte Schöpfung.","status":"draft"},"SUM-BOOK-1CH":{"text":"Stammbäume verorten Israel in seiner Geschichte. Die Darstellung Davids konzentriert sich besonders auf Gottesdienst, Leviten und die Vorbereitung des Tempelbaus.","status":"draft"},"SUM-BOOK-1CO":{"text":"Paulus reagiert auf Spaltungen und konkrete Konflikte in Korinth. Liebe, gemeinschaftliche Verantwortung, geistliche Gaben und die Hoffnung auf Auferstehung bilden zentrale Schwerpunkte.","status":"draft"},"SUM-BOOK-1JN":{"text":"Gottes Licht und Liebe werden zum Massstab des gemeinsamen Lebens. Der Brief verbindet das Bekenntnis zu Jesus mit geschwisterlicher Liebe und der Prüfung irreführender Ansprüche.","status":"draft"},"SUM-BOOK-1KI":{"text":"Salomo baut den Tempel; nach seiner Herrschaft zerfällt das Reich. Die Geschichte der Könige und das Wirken Elias stellen die Treue zu Gott in den Mittelpunkt.","status":"draft"},"SUM-BOOK-1PE":{"text":"Menschen in bedrängten Gemeinden werden an ihre Hoffnung und Zugehörigkeit erinnert. Ihr Verhalten soll auch unter Ablehnung von Christus und gegenseitiger Verantwortung geprägt sein.","status":"draft"},"SUM-BOOK-1SA":{"text":"Samuel begleitet den Übergang zur Königsherrschaft. Saul wird König, verliert aber seine Stellung; David tritt hervor und gerät in einen wachsenden Konflikt mit ihm.","status":"draft"},"SUM-BOOK-1TH":{"text":"Paulus stärkt eine junge Gemeinde in Bedrängnis und erinnert an die gemeinsame Beziehung. Heiligung, geschwisterliche Liebe und Hoffnung angesichts des Todes werden miteinander verbunden.","status":"draft"},"SUM-BOOK-1TI":{"text":"Weisungen betreffen Lehre, Gottesdienst und die Verantwortung verschiedener Gruppen in der Gemeinde. Ein glaubwürdiges Leben und der sorgsame Umgang mit Geld erhalten besonderes Gewicht.","status":"draft"},"SUM-BOOK-2CH":{"text":"Von Salomos Tempelbau führt die Erzählung durch die Geschichte der Könige Judas bis zum Exil. Erneuerung des Gottesdienstes und Umkehr werden zu wiederkehrenden Schwerpunkten.","status":"draft"},"SUM-BOOK-2CO":{"text":"Paulus erklärt seinen Dienst und sein Verhältnis zur Gemeinde inmitten von Spannungen. Gottes Kraft in menschlicher Schwachheit, Versöhnung und solidarisches Geben prägen den Brief.","status":"draft"},"SUM-BOOK-2JN":{"text":"Die kurze Schrift verbindet Wahrheit und gegenseitige Liebe. Sie mahnt zur Unterscheidung gegenüber Lehren, die das Bekenntnis zu Christus untergraben.","status":"draft"},"SUM-BOOK-2KI":{"text":"Die Königsgeschichten führen zum Untergang Israels und Judas sowie ins Exil. Propheten wie Elisa begleiten diese Zeit; politische Macht wird an der Verantwortung vor Gott gemessen.","status":"draft"},"SUM-BOOK-2PE":{"text":"Der Brief warnt vor zerstörerischer Lehre und bekräftigt die Erwartung von Gottes kommender Welt. Erkenntnis und Hoffnung sollen mit einem verantwortlichen Leben verbunden bleiben.","status":"draft"},"SUM-BOOK-2SA":{"text":"David wird König über ganz Israel und macht Jerusalem zu seinem Zentrum. Seine Herrschaft umfasst Verheissung und Erfolge, aber auch Schuld, familiäre Gewalt und politische Krisen.","status":"draft"},"SUM-BOOK-2TH":{"text":"Der Brief ermutigt zu Standhaftigkeit und korrigiert Verunsicherung über den Tag des Herrn. Erwartung der Zukunft soll mit verantwortlichem Leben in der Gegenwart verbunden bleiben.","status":"draft"},"SUM-BOOK-2TI":{"text":"Timotheus wird zu Treue, Ausdauer und verantwortlicher Weitergabe der Botschaft ermutigt. Leiden, Schrift und Verkündigung prägen den persönlichen Ton des Briefes.","status":"draft"},"SUM-BOOK-3JN":{"text":"Gastfreundschaft und Unterstützung reisender Glaubensgeschwister werden gewürdigt. Ein Konflikt um Leitung und Anerkennung zeigt zugleich Spannungen innerhalb der Gemeinschaft.","status":"draft"},"SUM-BOOK-ACT":{"text":"Die Botschaft von Jesus breitet sich durch das Wirken des Geistes von Jerusalem bis nach Rom aus. Neue Gemeinschaften entstehen und ringen darum, wie Menschen unterschiedlicher Herkunft dazugehören.","status":"draft"},"SUM-BOOK-AMO":{"text":"Amos kritisiert Ausbeutung, Selbstsicherheit und einen Gottesdienst ohne Gerechtigkeit. Die Gerichtsworte richten sich auch gegen Israel; am Ende steht eine Aussicht auf Wiederherstellung.","status":"draft"},"SUM-BOOK-COL":{"text":"Christus wird als Mittelpunkt von Schöpfung und Versöhnung dargestellt. Der Brief warnt vor konkurrierenden Bindungen und verbindet das neue Leben mit alltäglichem Verhalten.","status":"draft"},"SUM-BOOK-DAN":{"text":"Erzählungen von Treue unter fremden Herrschern stehen neben Visionen über Reiche, Bedrängnis und Gottes Herrschaft. Menschliche Macht erscheint begrenzt; Hoffnung reicht über sie hinaus.","status":"draft"},"SUM-BOOK-DEU":{"text":"Mose blickt auf den bisherigen Weg zurück und legt Gottes Weisungen für das Leben im Land aus. Israel wird aufgerufen, Gott zu lieben und den Bund auch in Zukunft zu bewahren.","status":"draft"},"SUM-BOOK-ECC":{"text":"Der Prediger prüft Arbeit, Genuss, Weisheit und menschliche Leistung angesichts von Vergänglichkeit und Tod. Die Grenzen menschlicher Verfügung stehen neben dem Aufruf, die gegebenen Freuden anzunehmen.","status":"draft"},"SUM-BOOK-EPH":{"text":"Die Einheit von Menschen aus unterschiedlichen Völkern in Christus steht im Zentrum. Daraus folgen Bilder von Gemeinde und konkrete Weisungen für ein erneuertes Zusammenleben.","status":"draft"},"SUM-BOOK-EST":{"text":"Am persischen Königshof gerät die jüdische Bevölkerung in tödliche Gefahr. Ester und Mordechai handeln gegen Hamans Plan; die Rettung wird zum Hintergrund des Purimfestes.","status":"draft"},"SUM-BOOK-EXO":{"text":"Gott befreit Israel aus der Sklaverei in Ägypten. Am Sinai erhält das Volk den Bund und Weisungen für ein gemeinsames Leben; das Heiligtum steht für Gottes Gegenwart in seiner Mitte.","status":"draft"},"SUM-BOOK-EZK":{"text":"Hesekiel spricht zu Menschen im Exil und deutet den Verlust Jerusalems. Visionen von neuer Lebenskraft, einem neuen Herzen und erneuerter Gottesgegenwart öffnen einen Zukunftshorizont.","status":"draft"},"SUM-BOOK-EZR":{"text":"Menschen kehren aus dem Exil zurück und bauen den Tempel wieder auf. Esra lehrt die Tora; die Gemeinschaft ringt um ihre religiöse Identität und ihre Grenzen.","status":"draft"},"SUM-BOOK-GAL":{"text":"Der Brief verteidigt die Freiheit der Glaubenden gegenüber der Forderung nach Beschneidung. Das Leben aus Glauben und Geist soll in tätiger Liebe Gestalt gewinnen.","status":"draft"},"SUM-BOOK-GEN":{"text":"Die Erzählung führt von der Schöpfung und den Anfängen der Menschheit zu Abraham und seiner Familie. Verheissung, Vertrauen und Konflikte prägen den Weg, der mit Josef in Ägypten endet.","status":"draft"},"SUM-BOOK-HAB":{"text":"Habakuk fragt Gott nach Unrecht und nach der Gewalt derer, die es bestrafen sollen. Das Gespräch mündet in eine Haltung des Vertrauens trotz anhaltender Bedrängnis.","status":"draft"},"SUM-BOOK-HAG":{"text":"Haggai fordert die Heimgekehrten auf, den Wiederaufbau des Tempels ernst zu nehmen. Ihre Prioritäten werden hinterfragt und mit Gottes Zusage seiner Gegenwart verbunden.","status":"draft"},"SUM-BOOK-HEB":{"text":"Jesus wird als Hohepriester und Mittler eines neuen Bundes entfaltet. Die Auslegung der Schriften mündet in Ermutigung zu Vertrauen, Ausdauer und gegenseitiger Unterstützung.","status":"draft"},"SUM-BOOK-HOS":{"text":"Hoseas Ehe wird zum Bild für Israels verletzte Beziehung zu Gott. Gericht und die Kritik an Untreue stehen neben Gottes bleibender Zuwendung und dem Ruf zur Umkehr.","status":"draft"},"SUM-BOOK-ISA":{"text":"Gericht über Unrecht und Untreue steht neben der Hoffnung auf Rettung und Erneuerung. Das Buch verbindet die Heiligkeit Gottes mit Trost für sein Volk und einer weiten Zukunftsperspektive.","status":"draft"},"SUM-BOOK-JAS":{"text":"Glaube soll im Handeln sichtbar werden. Der Brief verbindet den Umgang mit Armen, die Macht der Sprache, Weisheit und Geduld zu einer praktischen Mahnung.","status":"draft"},"SUM-BOOK-JDG":{"text":"Auf Abkehr und Bedrängnis folgen immer wieder Rettung und erneutes Scheitern. Die Geschichten der Richter zeigen zugleich eine zunehmende gesellschaftliche und religiöse Zerrüttung.","status":"draft"},"SUM-BOOK-JER":{"text":"Jeremia warnt Juda vor den Folgen seines Handelns und erlebt den Zusammenbruch Jerusalems. Neben Klage und Gericht stehen die Verheissung der Rückkehr und eines neuen Bundes.","status":"draft"},"SUM-BOOK-JHN":{"text":"Zeichen und ausführliche Gespräche erschliessen Jesu Beziehung zum Vater. Sein Tod und seine Auferstehung werden im Horizont von Leben, Liebe, Glauben und bleibender Gemeinschaft erzählt.","status":"draft"},"SUM-BOOK-JOB":{"text":"Hiob verliert Besitz, Familie und Gesundheit. In Klagen und Streitgesprächen wird die einfache Gleichsetzung von Leiden und Schuld hinterfragt; die Begegnung mit Gott verändert die Perspektive.","status":"draft"},"SUM-BOOK-JOL":{"text":"Eine schwere Plage wird zum Anlass für Klage und Umkehr. Die Erwartung des Tages Gottes verbindet sich mit Wiederherstellung und der Verheissung, Gottes Geist werde ausgegossen.","status":"draft"},"SUM-BOOK-JON":{"text":"Jona flieht vor seinem Auftrag nach Ninive und erlebt Gottes Erbarmen selbst. Als die Stadt umkehrt, muss er sich mit einer Barmherzigkeit auseinandersetzen, die seine eigenen Grenzen überschreitet.","status":"draft"},"SUM-BOOK-JOS":{"text":"Unter Josua überschreitet Israel den Jordan, nimmt das Land ein und verteilt es unter die Stämme. Am Ende steht die Aufforderung, Gott treu zu bleiben.","status":"draft"},"SUM-BOOK-JUD":{"text":"Judas warnt vor Menschen, deren Verhalten und Lehre die Gemeinschaft gefährden. Die Lesenden sollen im Glauben bleiben und anderen mit Barmherzigkeit und Unterscheidung begegnen.","status":"draft"},"SUM-BOOK-LAM":{"text":"Die Zerstörung Jerusalems wird in dichterischen Klagen betrauert. Leid, Schuld und die Frage nach Gottes Nähe werden ohne vorschnelle Auflösung ausgesprochen.","status":"draft"},"SUM-BOOK-LEV":{"text":"Opfer, Reinheit und Heiligkeit ordnen das Leben Israels vor Gott. Neben dem Gottesdienst stehen der Umgang mit Mitmenschen, Gerechtigkeit und die Verantwortung für das Land im Mittelpunkt.","status":"draft"},"SUM-BOOK-LUK":{"text":"Lukas betont Gottes Zuwendung zu Armen, Ausgegrenzten und Verlorenen. Jesu Weg nach Jerusalem führt durch Tod und Auferstehung zur Sendung seiner Zeugen.","status":"draft"},"SUM-BOOK-MAL":{"text":"Streitgespräche legen nachlässigen Gottesdienst und beschädigte Beziehungen offen. Der Aufruf zur Treue steht neben der Erwartung eines kommenden Boten und des Tages Gottes.","status":"draft"},"SUM-BOOK-MAT":{"text":"Matthäus erzählt von Jesus im Zusammenhang der Schriften Israels. Seine Lehre vom Himmelreich, sein Tod und seine Auferstehung führen zum Auftrag, Menschen aus allen Völkern zu Jüngern zu machen.","status":"draft"},"SUM-BOOK-MIC":{"text":"Micha prangert Machtmissbrauch, Ausbeutung und falsche Sicherheit an. Gerichtsworte stehen neben Bildern von Frieden, einem kommenden Herrscher und einem Leben in Gerechtigkeit und Demut.","status":"draft"},"SUM-BOOK-MRK":{"text":"Markus schildert Jesu Wirken, seine Vollmacht und den wachsenden Widerstand gegen ihn. Der Weg nach Jerusalem, das Kreuz und die Botschaft vom leeren Grab fordern das Verständnis seiner Identität heraus.","status":"draft"},"SUM-BOOK-NAM":{"text":"Nahum kündigt den Untergang Ninives an. Die Gewalt der assyrischen Macht wird aus der Perspektive ihres bevorstehenden Endes und der Entlastung ihrer Opfer betrachtet.","status":"draft"},"SUM-BOOK-NEH":{"text":"Nehemia organisiert den Wiederaufbau Jerusalems und begegnet äusserem Widerstand sowie innerer Ungerechtigkeit. Das öffentliche Hören der Tora begleitet die Neuordnung der Gemeinschaft.","status":"draft"},"SUM-BOOK-NUM":{"text":"Israel zieht durch die Wüste und erlebt Versorgung, Widerstand und die Folgen fehlenden Vertrauens. Eine neue Generation bereitet sich auf den Einzug in das verheissene Land vor.","status":"draft"},"SUM-BOOK-OBA":{"text":"Edom wird wegen seines Verhaltens gegenüber Juda zur Verantwortung gezogen. Das kurze Buch verbindet den Fall menschlichen Hochmuts mit der Erwartung von Gottes Herrschaft.","status":"draft"},"SUM-BOOK-PHM":{"text":"Paulus bittet Philemon, Onesimus in neuer Weise aufzunehmen. Die Beziehung zwischen den Beteiligten wird unter dem Vorzeichen gemeinsamer Zugehörigkeit zu Christus angesprochen.","status":"draft"},"SUM-BOOK-PHP":{"text":"Freude und Verbundenheit prägen den Brief trotz Gefangenschaft und Unsicherheit. Christi Weg der Erniedrigung und Erhöhung dient als Orientierung für Demut und gemeinsames Handeln.","status":"draft"},"SUM-BOOK-PRO":{"text":"Kurze Weisheitssprüche und längere Lehrreden fragen nach einem gelingenden Leben. Gottesfurcht, gerechtes Handeln, Sprache, Arbeit und Beziehungen werden aus verschiedenen Blickwinkeln betrachtet.","status":"draft"},"SUM-BOOK-PSA":{"text":"Die Psalmen versammeln Gebete und Lieder aus Freude, Angst, Schuld, Dank und Hoffnung. Persönliche Erfahrungen und die Geschichte Israels werden vor Gott ausgesprochen.","status":"draft"},"SUM-BOOK-REV":{"text":"Visionen stellen die bedrängten Gemeinden in den Horizont von Gottes Gericht und Erneuerung. Der Sieg des Lammes führt zur Hoffnung auf eine neue Schöpfung und Gottes Wohnen bei den Menschen.","status":"draft"},"SUM-BOOK-ROM":{"text":"Paulus entfaltet seine Botschaft von Gottes Gerechtigkeit, Glauben und neuem Leben. Die Stellung Israels und das Zusammenleben der Gemeinde gehören zu dieser umfassenden Argumentation.","status":"draft"},"SUM-BOOK-RUT":{"text":"Rut bleibt ihrer Schwiegermutter Noomi in Not und Fremde verbunden. Durch ihre Begegnung mit Boas entstehen Schutz, eine neue Familie und eine Verbindung zur späteren Geschichte Davids.","status":"draft"},"SUM-BOOK-SNG":{"text":"Poetische Stimmen erzählen von Sehnsucht, Schönheit und gegenseitiger Liebe. Begegnung, Suche und Freude an der geliebten Person prägen die Sammlung.","status":"draft"},"SUM-BOOK-TIT":{"text":"Titus erhält Weisungen zur Ordnung der Gemeinden und zur Auswahl verantwortlicher Personen. Gottes Gnade soll sich in besonnenem Verhalten und guten Werken zeigen.","status":"draft"},"SUM-BOOK-ZEC":{"text":"Visionen und prophetische Worte ermutigen zum Wiederaufbau und zur Erneuerung Jerusalems. Hoffnung auf gerechte Herrschaft und Gottes kommende Nähe reicht über die unmittelbare Situation hinaus.","status":"draft"},"SUM-BOOK-ZEP":{"text":"Der Tag Gottes erscheint als Gericht über Juda und die Völker. Zugleich eröffnet sich Hoffnung für eine demütige Gemeinschaft, die Zuflucht bei Gott sucht.","status":"draft"},"SUM-CH-GEN-001":{"text":"Gott schafft die Welt durch sein Wort. Die Erzählung ordnet Licht, Himmel, Land und Leben in eine Abfolge von Tagen und bezeichnet die Schöpfung als gut. Der Mensch wird als Gottes Bild geschaffen.","status":"draft"},"SUM-CH-GEN-002":{"text":"Gottes Ruhe schliesst die Schöpfungserzählung ab. Eine weitere Erzählperspektive führt in den Garten Eden und beschreibt den Menschen, seinen Auftrag und die Beziehung von Mann und Frau.","status":"draft"},"SUM-CH-GEN-003":{"text":"Der Mensch überschreitet Gottes Gebot. Scham, gegenseitige Schuldzuweisung und gestörte Beziehungen treten hervor; die Erzählung endet mit dem Verlassen des Gartens.","status":"draft"},"SUM-CH-LUK-011":{"text":"Jesus lehrt beten: das Vaterunser, ein Gleichnis vom bittenden Freund und die Zusage, dass Gott den Heiligen Geist gibt. Es folgen Streitgespräche über seine Vollmacht und scharfe Worte an Pharisäer und Gesetzeslehrer.","status":"draft"},"SUM-CH-MAT-006":{"text":"Jesus spricht über Almosen, Beten und Fasten: nicht vor Menschen, sondern vor Gott. In der Mitte steht das Vaterunser. Danach geht es um Schätze im Himmel und darum, sich nicht zu sorgen, sondern zuerst Gottes Reich zu suchen.","status":"draft"},"SUM-CH-MRK-003":{"text":"Heilung am Sabbat führt zu Konflikten. Jesus beruft die Zwölf, begegnet dem Vorwurf dämonischer Vollmacht und beschreibt seine Familie vom Tun des Willens Gottes her.","status":"draft"},"SUM-GROUP-01":{"text":"Die Tora führt von den Anfängen der Welt zur Entstehung Israels. Verheissung und Befreiung bilden den Hintergrund der Weisungen für ein gemeinsames Leben vor Gott. Die Erzählung endet vor dem Einzug in das Land.","status":"draft"},"SUM-GROUP-02":{"text":"Diese Bücher erzählen vom Leben Israels im Land, von Königsherrschaft, Zusammenbruch und Rückkehr. Sie fragen nach Treue, Verantwortung und den Folgen politischer und religiöser Entscheidungen.","status":"draft"},"SUM-GROUP-03":{"text":"Gebete, Liebesdichtung und Weisheitsliteratur geben Erfahrungen des Lebens eine Sprache. Freude und Leiden, Gerechtigkeit und Vergänglichkeit werden vor Gott und im menschlichen Alltag bedacht.","status":"draft"},"SUM-GROUP-04":{"text":"Die prophetischen Bücher verbinden die Kritik an Unrecht und Untreue mit Klage und Zukunftshoffnung. Die Krisen Jerusalems und das Exil bilden wichtige geschichtliche Horizonte.","status":"draft"},"SUM-GROUP-05":{"text":"Die zwölf kürzeren Prophetenbücher sprechen in unterschiedlichen Situationen von Gericht und Umkehr. Gottes Treue, soziale Gerechtigkeit und die Hoffnung auf Wiederherstellung verbinden viele ihrer Stimmen.","status":"draft"},"SUM-GROUP-06":{"text":"Vier Evangelien erzählen von Jesus mit unterschiedlichen Schwerpunkten. Sein Wirken und seine Lehre führen zu den Erzählungen von Kreuz und Auferstehung.","status":"draft"},"SUM-GROUP-07":{"text":"Die Apostelgeschichte erzählt, wie sich die Botschaft von Jesus von Jerusalem in die weitere Welt ausbreitet. Begegnungen, Konflikte und das Wirken des Geistes prägen diesen Weg.","status":"draft"},"SUM-GROUP-08":{"text":"Die unter dem Namen des Paulus überlieferten Briefe verbinden die Botschaft von Christus mit konkreten Fragen des Gemeindelebens. Einheit, Freiheit, Hoffnung und tätige Liebe werden in wechselnden Situationen entfaltet.","status":"draft"},"SUM-GROUP-09":{"text":"Diese Briefe und die als Hebräerbrief bezeichnete Schrift sprechen Gemeinden in unterschiedlichen Herausforderungen an. Glauben, Ausdauer, Liebe und die Unterscheidung von Lehren sind wiederkehrende Themen.","status":"draft"},"SUM-GROUP-10":{"text":"Die Offenbarung verwendet Bilder und Visionen, um Bedrängnis und Weltmacht im Horizont von Gottes Herrschaft zu deuten. Am Ende steht die Hoffnung auf eine erneuerte Schöpfung.","status":"draft"},"SUM-NT":{"text":"Das Neue Testament erzählt von Jesus und davon, wie seine Botschaft Menschen und Gemeinschaften verändert. Die Evangelien, die Apostelgeschichte und die Briefe erschliessen Leben, Glauben und Nachfolge aus unterschiedlichen Situationen. Die Offenbarung richtet den Blick auf Gericht, Hoffnung und eine neue Schöpfung.","status":"draft"},"SUM-OT":{"text":"Die Schriften Israels erzählen von Schöpfung, Befreiung, Bund und dem Leben eines Volkes vor Gott. Geschichte, Klage und Weisheit stehen neben prophetischer Kritik und der Hoffnung auf Erneuerung. Ihre unterschiedlichen Stimmen tragen Erfahrungen von Vertrauen, Scheitern, Exil und Neubeginn zusammen.","status":"draft"}};

const INLINE={"l/de/LUK":{"layer":{"text":{"LUK.11.1":"Und es geschah, als er an einem Ort betete: Als er aufgehört hatte, sagte einer seiner Jünger zu ihm: Herr, lehre uns beten, wie auch Johannes seine Jünger gelehrt hat.","LUK.11.2":"Er aber sagte zu ihnen: Wenn ihr betet, sprecht: Vater, dein Name werde geheiligt; dein Reich komme.","LUK.11.3":"Unser tägliches Brot gib uns Tag für Tag.","LUK.11.4":"Und vergib uns unsere Sünden, denn auch wir selbst vergeben jedem, der uns etwas schuldet; und führe uns nicht in Versuchung."},"source":{"LUK.11.1":"TRANS-LUK-011-001-004-DE-WORKING","LUK.11.2":"TRANS-LUK-011-001-004-DE-WORKING","LUK.11.3":"TRANS-LUK-011-001-004-DE-WORKING","LUK.11.4":"TRANS-LUK-011-001-004-DE-WORKING"},"decisions":{"LUK.11.2":[{"target":"sprecht","kind":"literal","grc":"λέγετε","note":"λέγετε, Imperativ."},{"target":"Vater","kind":"literal","grc":"Πάτερ","note":"Kurze Anrede ohne «unser», wie in den ältesten Handschriften."},{"target":"dein Name werde geheiligt","kind":"literal","grc":"ἁγιασθήτω τὸ ὄνομά σου","more_literal":"geheiligt werde dein Name","note":"Wie [[MAT.6.9]]."}],"LUK.11.3":[{"target":"tägliches","kind":"traditional","grc":"τὸν ἐπιούσιον","more_literal":"für den kommenden Tag","other_options":["für den kommenden Tag","zum Leben nötige"],"note":"Wie [[MAT.6.11]]: Das Wort ist unsicher; «täglich» folgt der Tradition."},{"target":"Tag für Tag","kind":"literal","grc":"τὸ καθʼ ἡμέραν","note":"τὸ καθʼ ἡμέραν."}],"LUK.11.4":[{"target":"der uns etwas schuldet","kind":"adapted","grc":"ὀφείλοντι ἡμῖν","more_literal":"jedem, der uns schuldet","note":"«etwas» ist ergänzt."},{"target":"führe uns nicht in Versuchung","kind":"traditional","grc":"μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν","more_literal":"bring uns nicht hinein in Versuchung","other_options":["lass uns nicht in Versuchung geraten (Deutung)"],"note":"Wie [[MAT.6.13]]. «Führe uns durch die Versuchung» gibt den Wortlaut nicht wieder: εἰς heisst «hinein», «durch» wäre διά, und μή verneint die Bitte. Als Deutung (bewahre uns in der Prüfung) ist der Gedanke möglich; siehe «Wie kann man es verstehen?»."}]},"alternatives":[{"ref":"LUK.11.2","from":"Vater, dein Name","to":"Unser Vater im Himmel, dein Name","effect":"bedeutsam","note":"Die kurze Anrede «Vater» ist bei Lukas gut bezeugt; die längere entspricht Matthäus.","variant":"VAR-SBLGNTAPP-LUK-011-002-01","support":1,"base_support":4,"of":5,"basis":"editions"},{"ref":"LUK.11.2","from":"dein Reich komme","to":"dein Reich komme; dein Wille geschehe, wie im Himmel, so auf der Erde","effect":"bedeutsam","note":"Die Bitte um Gottes Willen steht in vielen Handschriften auch bei Lukas.","variant":"VAR-SBLGNTAPP-LUK-011-002-02","support":1,"base_support":4,"of":5,"basis":"editions"},{"ref":"LUK.11.4","from":"führe uns nicht in Versuchung","to":"führe uns nicht in Versuchung, sondern rette uns vor dem Bösen","effect":"bedeutsam","note":"Die letzte Bitte der Matthäusfassung steht in vielen, aber nicht in den ältesten Lukas-Handschriften.","variant":"VAR-SBLGNTAPP-LUK-011-004-01","support":1,"base_support":4,"of":5,"basis":"editions"}],"align":{"TOK-SBLGNT-LUK-011-002-001":{"target":"sagte","kind":"lexical","note":null,"first":true},"TOK-SBLGNT-LUK-011-002-002":{"target":"aber","kind":"lexical","note":null,"first":true},"TOK-SBLGNT-LUK-011-002-003":{"target":"zu ihnen","kind":"lexical","note":null,"first":true},"TOK-SBLGNT-LUK-011-002-004":{"target":"Wenn","kind":"lexical","note":null,"first":true},"TOK-SBLGNT-LUK-011-002-005":{"target":"ihr betet","kind":"lexical","note":null,"first":true},"TOK-SBLGNT-LUK-011-002-006":{"target":"sprecht","kind":"lexical","note":"Imperativ Präsens","first":true},"TOK-SBLGNT-LUK-011-002-007":{"target":"Vater","kind":"lexical","note":"Anrede ohne «unser»","first":true},"TOK-SBLGNT-LUK-011-002-008":{"target":"werde geheiligt","kind":"lexical","note":null,"first":true},"TOK-SBLGNT-LUK-011-002-009":{"target":"Name","kind":"phrase","note":null,"first":true},"TOK-SBLGNT-LUK-011-002-010":{"tar re","kind":"lexical","note":null,"first":true},"TOK-SBLGNT-LUK-011-004-007":{"target":"auch","kind":"lexical","note":null,"first":true},"TOK-SBLGNT-LUK-011-004-008":{"target":"denn","kind":"lexical","note":null,"first":true},"TOK-SBLGNT-LUK-011-004-009":{"target":"wir selbst","kind":"lexical","note":null,"first":true},"TOK-SBLGNT-LUK-011-004-010":{"target":"vergeben","kind":"lexical","note":"Nebenform ἀφίομεν, Gegenwart","first":true},"TOK-SBLGNT-LUK-011-004-011":{"target":"jedem","kind":"lexical","note":null,"first":true},"TOK-SBLGNT-LUK-011-004-012":{"target":"der … etwas schuldet","kind":"lexical","note":"Partizip: «dem, der schuldet»","first":true},"TOK-SBLGNT-LUK-011-004-013":{"target":"uns","kind":"lexical","note":null,"first":true},"TOK-SBLGNT-LUK-011-004-014":{"target":"und","kind":"lexical","note":null,"first":true},"TOK-SBLGNT-LUK-011-004-015":{"target":"nicht","kind":"lexical","note":null,"first":true},"TOK-SBLGNT-LUK-011-004-016":{"target":"führe","kind":"lexical","note":null,"first":true},"TOK-SBLGNT-LUK-011-004-017":{"target":"uns","kind":"lexical","note":null,"first":true},"TOK-SBLGNT-LUK-011-004-018":{"target":"in Versuchung","kind":"phrase","note":null,"first":true},"TOK-SBLGNT-LUK-011-004-019":{"target":"in Versuchung","kind":"phrase","note":null,"first":false}}},"compare":{"LUK.11.2":[{"id":"TRANS-ELB1905-LP","title":"Elberfelder Bibel, unrevidierte Fassung 1905","text":"Er sprach aber zu ihnen: Wenn ihr betet, so sprechet: Vater, geheiligt werde dein Name; dein Reich komme;","lang":"de","notes":[],"license":"gemeinfrei (CrossWire-Modul GerElb1905)"},{"id":"TRANS-LUT1912-LP","title":"Lutherbibel, revidierte Fassung 1912","text":"Und er sprach zu ihnen: Wenn ihr betet, so sprecht: Unser Vater im Himmel, dein Name werde geheiligt. Dein Reich komme. Dein Wille geschehe auf Erden wie im Himmel.","lang":"de","notes":[],"license":"gemeinfrei (Public Domain laut Quelle)"}],"LUK.11.3":[{"id":"TRANS-ELB1905-LP","title":"Elberfelder Bibel, unrevidierte Fassung 1905","text":"unser nötiges Brot gib uns täglich;","lang":"de","notes":[],"license":"gemeinfrei (CrossWire-Modul GerElb1905)"},{"id":"TRANS-LUT1912-LP","title":"Lutherbibel, revidierte Fassung 1912","text":"Gib uns unser täglich Brot immerdar.","lang":"de","notes":[],"license":"gemeinfrei (Public Domain laut Quelle)"}],"LUK.11.4":[{"id":"TRANS-ELB1905-LP","title":"Elberfelder Bibel, unrevidierte Fassung 1905","text":"und vergib uns unsere Sünden, denn auch wir selbst vergeben jedem, der uns schuldig ist; und führe uns nicht in Versuchung.","lang":"de","notes":[],"license":"gemeinfrei (CrossWire-Modul GerElb1905)"},{"id":"TRANS-LUT1912-LP","title":"Lutherbibel, revidierte Fassung 1912","text":"Und vergib uns unsre Sünden, denn auch wir vergeben allen, die uns schuldig sind. Und führe uns nicht in Versuchung, sondern erlöse uns von dem Übel.","lang":"de","notes":["Andere Überlieferung: \"Vater, dein Name werde geheiligt. Dein Reich komme. Gib uns unser täglich Brot immerdar. Und vergib uns unsre Sünden; denn auch wir vergeben allen, die uns schuldig sind. Und führe uns nicht in Versuchung.\""],"license":"gemeinfrei (Public Domain laut Quelle)"}]},"alts":{"VAR-SBLGNTAPP-LUK-011-002-01":{"words":{"R1":[{"grc":"Πάτερ","text":"Vater","note":"kurze Anrede"}],"R2":[{"grc":"Πάτερ ἡμῶν ὁ ἐν τοῖς οὐρανοῖς","text":"Unser Vater in den Himmeln","note":"Anrede wie bei Matthäus"}]},"origin":["Wer das Vaterunser in der Matthäusfassung auswendig kannte und im Gottesdienst betete, glich beim Abschreiben die kürzere Lukasfassung leicht daran an. Viele Textforscher erklären die längere Anrede bei Lukas so.","Die kürzere Anrede entspricht auch dem aramäischen «Abba», mit dem Jesus Gott nach [[MRK.14.36]] anredet."],"related":[]},"VAR-SBLGNTAPP-LUK-011-002-02":{"words":{"R1":[{"grc":"σου","text":"dein (Reich)","note":"ohne weitere Bitte"}],"R2":[{"grc":"γενηθήτω τὸ θέλημά σου ὡς ἐν οὐρανῷ καὶ ἐπὶ τῆς γῆς","text":"dein Wille geschehe, wie im Himmel, so auf der Erde","note":"Bitte wie bei Matthäus"}]},"origin":["Auch hier ist eine Angleichung an die vertraute Matthäusfassung die häufigste Erklärung.","Einige wenige spätere Handschriften und Kirchenväter (berichtet für die Minuskeln 700 und 162 sowie Gregor von Nyssa) haben an dieser Stelle stattdessen eine Bitte um den Heiligen Geist: «Dein Heiliger Geist komme über uns und reinige uns.» Diese Angabe ist hier nicht geprüft; sie zeigt, wie frei das Gebet in manchen Kreisen weitergegeben wurde."],"related":[]},"VAR-SBLGNTAPP-LUK-011-004-01":{"words":{"R1":[{"grc":"πειρασμόν","text":"Versuchung","note":"Ende des Gebets"}],"R2":[{"grc":"ἀλλὰ ῥῦσαι ἡμᾶς ἀπὸ τοῦ πονηροῦ","text":"sondern rette uns vor dem Bösen","note":"Bitte wie bei Matthäus"}]},"origin":["Auch dieser Zusatz lässt sich als Angleichung an Matthäus erklären.","Wer ihn für ursprünglich hält, verweist auf seine weite Verbreitung; dass er gerade in 𝔓75, im Sinaiticus und im Vaticanus fehlt, spricht nach Ansicht vieler Textforscher eher für eine spätere Ergänzung."],"related":[]}},"name":"l/de/LUK","lang":"de"},"l/de/MAT":{"layer":{"text":{"MAT.6.5":"Und wenn ihr betet, sollt ihr nicht sein wie die Heuchler; denn sie lieben es, in den Synagogen und an den Ecken der breiten Strassen zu stehen und zu beten, damit sie sich den Menschen zeigen. Amen, ich sage euch: Sie haben ihren Lohn schon erhalten.","MAT.6.6":"Du aber, wenn du betest, geh in deine Kammer, schliess deine Tür und bete zu deinem Vater, der im Verborgenen ist; und dein Vater, der ins Verborgene sieht, wird es dir vergelten.","MAT.6.7":"Wenn ihr aber betet, plappert nicht wie die Heiden; denn sie meinen, sie würden erhört, wenn sie viele Worte machen.","MAT.6.8":"Seid ihnen also nicht gleich; denn euer Vater weiss, was ihr braucht, bevor ihr ihn bittet.","MAT.6.9":"So sollt ihr nun beten: Unser Vater in den Himmeln, dein Name werde geheiligt;","MAT.6.10":"dein Reich komme; dein Wille geschehe, wie im Himmel, so auch auf Erden.","MAT.6.11":"Unser tägliches Brot gib uns heute.","MAT.6.12":"Und vergib uns unsere Schulden, wie auch wir unseren Schuldnern vergeben haben.","MAT.6.13":"Und führe uns nicht in Versuchung, sondern rette uns vor dem Bösen.","MAT.6.14":"Denn wenn ihr den Menschen ihre Verfehlungen vergebt, wird euer himmlischer Vater auch euch vergeben;","MAT.6.15":"wenn ihr aber den Menschen nicht vergebt, wird euer Vater eure Verfehlungen auch nicht vergeben."},"source":{"MAT.6.5":"TRANS-MAT-006-005-015-DE-WORKING","MAT.6.6":"TRANS-MAT-006-005-015-DE-WORKING","MAT.6.7":"TRANS-MAT-006-005-015-DE-WORKING","MAT.6.8":"TRANS-MAT-006-005-015-DE-WORKING","MAT.6.9":"TRANS-MAT-006-005-015-DE-WORKING","MAT.6.10":"TRANS-MAT-006-005-015-DE-WORKING","MAT.6.11":"TRANS-MAT-006-005-015-DE-WORKING","MAT.6.12":"TRANS-MAT-006-005-015-DE-WORKING","MAT.6.13":"TRANS-MAT-006-005-015-DE-WORKING","MAT.6.14":"TRANS-MAT-006-005-015-DE-WORKING","MAT.6.15":"TRANS-MAT-006-005-015-DE-WORKING"},"decisions":{"MAT.6.9":[{"target":"So sollt ihr nun beten","kind":"adapted","grc":"Οὕτως οὖν προσεύχεσθε ὑμεῖς","more_literal":"So nun betet ihr","note":"Imperativ («betet!») mit «sollt» wiedergegeben; «ihr» ist im Griechischen betont."},{"target":"Unser Vater","kind":"literal","grc":"Πάτερ ἡμῶν","more_literal":"Vater unser","note":"Im Griechischen steht «Vater» zuerst (Πάτερ ἡμῶν). Die vertraute Form «Vater unser» folgt dieser Wortstellung (lateinisch Pater noster); hier ist die heute übliche deutsche Wortstellung gewählt."},{"target":"in den Himmeln","kind":"literal","grc":"ὁ ἐν τοῖς οὐρανοῖς","other_options":["im Himmel"],"note":"Plural wie im Griechischen; viele Übersetzungen schreiben «im Himmel», weil der Plural im Deutschen ungewohnt ist."},{"target":"dein Name werde geheiligt","kind":"literal","grc":"ἁγιασθήτω τὸ ὄνομά σου","more_literal":"geheiligt werde dein Name","note":"Die vertraute Form stellt das Verb wie im Griechischen an den Anfang; inhaltlich gleich."}],"MAT.6.10":[{"target":"so auch auf Erden","kind":"adapted","grc":"καὶ ἐπὶ γῆς","more_literal":"auch auf Erden","note":"«so» ist ergänzt, damit der Vergleich im Deutschen flüssig ist."}],"MAT.6.11":[{"target":"tägliches","kind":"traditional","grc":"τὸν ἐπιούσιον","more_literal":"für den kommenden Tag","other_options":["für den kommenden Tag","zum Leben nötige","überwesentliche"],"note":"Das griechische Wort ist unsicher. «Täglich» folgt der verbreiteten Tradition (lateinisch cotidianum). Ebenso möglich: «für den kommenden Tag», «zum Leben nötige». Siehe Deutungen."}],"MAT.6.12":[{"target":"Schulden","kind":"literal","grc":"τὰ ὀφειλήματα","note":"Wörtlich Geldschulden; die vertraute Gebetsfassung sagt «Schuld» in der Einzahl."},{"target":"vergeben haben","kind":"literal","grc":"ἀφήκαμεν","note":"Vergangenheitsform wie im SBLGNT (ἀφήκαμεν); die vertraute Gebetsfassung sagt «vergeben» (Gegenwart), wie viele spätere Handschriften."},{"target":"Schuldnern","kind":"literal","grc":"τοῖς ὀφειλέταις","note":"Die vertraute Gebetsfassung sagt «Schuldigern», ein älteres Wort für Schuldner."}],"MAT.6.13":[{"target":"führe uns nicht in Versuchung","kind":"traditional","grc":"μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν","more_literal":"bring uns nicht hinein in Versuchung","other_options":["lass uns nicht in Versuchung geraten (Deutung nach aramäischem Hintergrund)","führe uns nicht in die Prüfung"],"note":"Wörtlich nah und zugleich die vertraute Formulierung. «Führe uns durch die Versuchung» gibt den Wortlaut nicht wieder: εἰς heisst «hinein», «durch» wäre διά, und μή verneint die Bitte. Als Deutung (bewahre uns in der Prüfung) ist der Gedanke möglich; siehe «Wie kann man es verstehen?»."},{"target":"Versuchung","kind":"interpretive","grc":"πειρασμόν","other_options":["Prüfung"],"note":"πειρασμός heisst «Versuchung» und «Prüfung»; die Wahl ist eine Deutungsentscheidung."},{"target":"rette","kind":"literal","grc":"ῥῦσαι","other_options":["erlöse","bewahre"],"note":"ῥῦσαι «rette, entreisse»; die vertraute Gebetsfassung sagt «erlöse»."},{"target":"vor dem Bösen","kind":"interpretive","grc":"ἀπὸ τοῦ πονηροῦ","more_literal":"von dem Bösen","other_options":["vor dem Bösen (Person)","von dem Übel"],"note":"Neutrum («das Böse») oder Maskulinum («der Böse») möglich; Luther 1912 schreibt «von dem Übel»."}]},"alternatives":[{"ref":"MAT.6.5","from":"wenn ihr betet, sollt ihr nicht sein wie","to":"wenn du betest, sollst du nicht sein wie","effect":"gering","note":"Einzahl statt Mehrzahl: Angesprochen ist jeder Einzelne, wie in [[MAT.6.6]].","variant":"VAR-SBLGNTAPP-MAT-006-005-01","support":1,"base_support":4,"of":5,"basis":"editions"},{"ref":"MAT.6.6","from":"wird es dir vergelten","to":"wird es dir öffentlich vergelten","effect":"bedeutsam","note":"Mit dem Zusatz steht dem verborgenen Beten ein öffentlicher Lohn gegenüber.","variant":"VAR-SBLGNTAPP-MAT-006-006-01","support":1,"base_support":4,"of":5,"basis":"editions"},{"ref":"MAT.6.8","from":"denn euer Vater weiss","to":"denn Gott, euer Vater, weiss","effect":"gering","note":"Westcott-Hort folgen hier einer Lesart mit «Gott».","variant":"VAR-SBLGNTAPP-MAT-006-008-01","support":1,"base_support":4,"of":5,"basis":"editions"},{"ref":"MAT.6.12","from":"wie auch wir unseren Schuldnern vergeben haben","to":"wie auch wir unseren Schuldnern vergeben","effect":"bedeutsam","note":"Vergangenheit oder Gegenwart: Haben wir schon vergeben, oder vergeben wir (jetzt, immer wieder)?","variant":"VAR-SBLGNTAPP-MAT-006-012-01","support":1,"base_support":4,"of":5,"basis":"editions"},{"ref":"MAT.6.13","from":"rette uns vor dem Bösen","to":"rette uns vor dem Bösen. Denn dein ist das Reich und die Kraft und die Herrlichkeit in Ewigkeit. Amen","effect":"bedeutsam","note":"Der vertraute Lobpreis am Schluss fehlt in den ältesten Handschriften des Matthäusevangeliums.","variant":"VAR-SBLGNTAPP-MAT-006-013-01","support":1,"base_support":4,"of":5,"basis":"editions"},{"ref":"MAT.6.15","from":"den Menschen nicht vergebt","to":"den Menschen ihre Verfehlungen nicht vergebt","effect":"gering","note":"Der Zusatz wiederholt nur, was in [[MAT.6.14]] steht.","variant":"VAR-SBLGNTAPP-MAT-006-015-01","support":3,"base_support":2,"of":5,"basis":"editions"}],"align":{"TOK-SBLGNT-MAT-006-009-001":{"target":"So","kind":"lexical","note":null,"first":true},"TOK-SBLGNT-MAT-006-009-002":{"target":"nun","kind":"lexical","note":null,"first":true},"TOK-SBLGNT-MAT-006-009-003":{"target":"sollt … beten","kind":"lexical","note":"Imperativ Präsens","first":true},"TOK-SBLGNT-MAT-006-009-004":{"target":"ihr","kind":"lexical","note":"betont","first":true},"TOK-SBLGNT-MAT-006-009-005":{"target":"Vater","kind":"lexical","note":"Anrede (Vokativ)","first":true},"TOK-SBLGNT-MAT-006-009-006":{"target":"Unser","kind":"lexical","note":null,"first":true},"TOK-SBLGNT-MAT-006-009-007":{"target":"in den Himmeln","kind":"phrase","note":"wörtlich «der in den Himmeln»; Plural","first":true},"TOK-SBLGNT-MAT-006-009-008":{"target":"in den Himmeln","kind":"phrase","note":"wörtlich «der in den Himmeln»; Plural","first":false},"TOK-SBLGNT-MAT-006-009-009":{"target":"in den Himmeln","kind":"phrase","note":"wörtlich «der in den Himmeln»; Plural","first":false},"TOK-SBLGNT-MAT-006-009-010":{"target":"in den Himmeln","kind":"phrase","note":"wörtlich «der in den Himmeln»; Plural","first":false},"TOK-SBLGNT-MAT-006-009-011":{"target":"werde geheiligt","kind":"lexical","note":"Imperativ Aorist Passiv: Gott selbst ist wohl als Handelnder gedacht","first":true},"TOK-SBLGNT-MAT-006-009-012":{"target":"Name","kind":"phrase","note":null,"first":true},"TOK-SBLGNT-MAT-006-009-013":{"target":"Name","kind":"phrase","note":null,"first":false},"TOK-SBLGNT-MAT-006-009-014":{"target":"dein","kind":"lexical","note":null,"first":true},"TOK-SBLGNT-MAT-006-010-001":{"target":"komme","kind":"lexical","note":"Imperativ Aorist","first":true},"TOK-SBLGNT-MAT-006-010-002":{"target":"Reich","kind":"phrase","note":"βασιλεία auch «Königsherrschaft»","first":true},"TOK-SBLGNT-MAT-006-010-003":{"target":"Reich","kind":"phrase","note":"βασιλεία auch «Königsherrschaft»","first":false},"TOK- LGNT-MAT-006-013-008":{"target":"rette","kind":"lexical","note":"ῥύομαι «retten, bewahren, entreissen»","first":true},"TOK-SBLGNT-MAT-006-013-009":{"target":"uns","kind":"lexical","note":null,"first":true},"TOK-SBLGNT-MAT-006-013-010":{"target":"vor dem Bösen","kind":"phrase","note":"Neutrum («das Böse») oder Maskulinum («der Böse») möglich","first":true},"TOK-SBLGNT-MAT-006-013-011":{"target":"vor dem Bösen","kind":"phrase","note":"Neutrum («das Böse») oder Maskulinum («der Böse») möglich","first":false},"TOK-SBLGNT-MAT-006-013-012":{"target":"vor dem Bösen","kind":"phrase","note":"Neutrum («das Böse») oder Maskulinum («der Böse») möglich","first":false}}},"compare":{"MAT.6.9":[{"id":"TRANS-ELB1905-LP","title":"Elberfelder Bibel, unrevidierte Fassung 1905","text":"Betet ihr nun also: Unser Vater, der du bist in den Himmeln, geheiligt werde dein Name; dein Reich komme;","lang":"de","notes":[],"license":"gemeinfrei (CrossWire-Modul GerElb1905)"},{"id":"TRANS-LUT1912-LP","title":"Lutherbibel, revidierte Fassung 1912","text":"Darum sollt ihr also beten: Unser Vater in dem Himmel! Dein Name werde geheiligt.","lang":"de","notes":[],"license":"gemeinfrei (Public Domain laut Quelle)"}],"MAT.6.10":[{"id":"TRANS-ELB1905-LP","title":"Elberfelder Bibel, unrevidierte Fassung 1905","text":"dein Wille geschehe, wie im Himmel also auch auf Erden.","lang":"de","notes":[],"license":"gemeinfrei (CrossWire-Modul GerElb1905)"},{"id":"TRANS-LUT1912-LP","title":"Lutherbibel, revidierte Fassung 1912","text":"Dein Reich komme. Dein Wille geschehe auf Erden wie im Himmel.","lang":"de","notes":[],"license":"gemeinfrei (Public Domain laut Quelle)"}],"MAT.6.11":[{"id":"TRANS-ELB1905-LP","title":"Elberfelder Bibel, unrevidierte Fassung 1905","text":"Unser nötiges Brot gib uns heute;","lang":"de","notes":[],"license":"gemeinfrei (CrossWire-Modul GerElb1905)"},{"id":"TRANS-LUT1912-LP","title":"Lutherbibel, revidierte Fassung 1912","text":"Unser täglich Brot gib uns heute.","lang":"de","notes":[],"license":"gemeinfrei (Public Domain laut Quelle)"}],"MAT.6.12":[{"id":"TRANS-ELB1905-LP","title":"Elberfelder Bibel, unrevidierte Fassung 1905","text":"und vergib uns unsere Schulden, wie auch wir unseren Schuldnern vergeben;","lang":"de","notes":[],"license":"gemeinfrei (CrossWire-Modul GerElb1905)"},{"id":"TRANS-LUT1912-LP","title":"Lutherbibel, revidierte Fassung 1912","text":"Und vergib uns unsere Schuld, wie wir unseren Schuldigern vergeben.","lang":"de","notes":[],"license":"gemeinfrei (Public Domain laut Quelle)"}],"MAT.6.13":[{"id":"TRANS-ELB1905-LP","title":"Elberfelder Bibel, unrevidierte Fassung 1905","text":"und führe uns nicht in Versuchung, sondern errette uns von dem Bösen.","lang":"de","notes":[],"license":"gemeinfrei (CrossWire-Modul GerElb1905)"},{"id":"TRANS-LUT1912-LP","title":"Lutherbibel, revidierte Fassung 1912","text":"Und führe uns nicht in Versuchung, sondern erlöse uns von dem Übel. Denn dein ist das Reich und die Kraft und die Herrlichkeit in Ewigkeit. Amen.","lang":"de","notes":["Andere Übersetzung: \"erlöse uns von dem Bösen\""],"license":"gemeinfrei (Public Domain laut Quelle)"}]},"alts":{"VAR-SBLGNTAPP-MAT-006-005-01":{"words":{"R1":[{"grc":"προσεύχησθε, οὐκ ἔσεσθε ὡς","text":"ihr betet, ihr sollt nicht sein wie","note":"Mehrzahl"}],"R2":[{"grc":"προσεύχῃ οὐκ ἔσῃ ὥσπερ","text":"du betest, du sollst nicht sein wie","note":"Einzahl"}]},"origin":["Die Einzahl könnte an die Umgebung angeglichen sein: In [[MAT.6.2-MAT.6.4]] und [[MAT.6.6]] wird jeweils «du» angesprochen.","Umgekehrt könnte die Mehrzahl an [[MAT.6.7-MAT.6.9]] angeglichen sein, wo «ihr» angesprochen wird."],"related":[]},"VAR-SBLGNTAPP-MAT-006-006-01":{"words":{"R1":[{"grc":"σοι","text":"dir","note":"ohne Zusatz"}],"R2":[{"grc":"σοι ἐν τῷ φανερῷ","text":"dir im Offenen, öffentlich","note":"Zusatz"}]},"origin":["Der Zusatz bildet ein Gegenstück zu «im Verborgenen» und könnte ergänzt worden sein, um den Gegensatz zu betonen; derselbe Zusatz findet sich in manchen Handschriften auch in [[MAT.6.4]] und [[MAT.6.18]].","Wer den Zusatz für ursprünglich hält, muss erklären, warum er in den ältesten Handschriften fehlt; denkbar ist, dass er wegen des Gedankens an öffentlichen Lohn bewusst weggelassen wurde."],"related":[]},"VAR-SBLGNTAPP-MAT-006-008-01":{"words":{"R1":[{"grc":"ὁ πατὴρ","text":"der Vater","note":"ohne «Gott»"}],"R2":[{"grc":"ὁ θεὸς ὁ πατὴρ","text":"Gott, der Vater","note":"mit «Gott»"}]},"origin":["«Gott» kann als Verdeutlichung hinzugefügt worden sein, wie sie auch in der Liturgie üblich ist.","Umgekehrt kann «Gott» beim Abschreiben ausgefallen sein, weil zwei Wortgruppen gleich mit «ὁ» beginnen."],"related":[]},"VAR-SBLGNTAPP-MAT-006-012-01":{"words":{"R1":[{"grc":"ἀφήκαμεν","text":"wir haben vergeben","note":"Aorist: abgeschlossene Handlung"}],"R2":[{"grc":"ἀφίεμεν","text":"wir vergeben","note":"Gegenwart"}],"other":[{"grc":"ἀφίομεν","text":"wir vergeben","note":"Nebenform der Gegenwart, so auch in [[LUK.11.4]]"}]},"origin":["Die Gegenwart könnte an Lukas ([[LUK.11.4]] «wir vergeben») und an das im Gottesdienst gesprochene Gebet angeglichen sein.","Die Vergangenheitsform kann eine aramäische Ausdrucksweise wiedergeben, die einen gerade jetzt vollzogenen Akt meint («hiermit vergeben wir»); dann ist der Unterschied kleiner, als er im Deutschen aussieht.","Wer die Gegenwart für ursprünglich hält, verweist auf ihre Verbreitung in der Mehrheit der späteren Handschriften."],"related":[]},"VAR-SBLGNTAPP-MAT-006-013-01":{"words":{"R1":[{"grc":"πονηροῦ","text":"(dem) Bösen","note":"Ende des Gebets ohne Lobpreis"}],"R2":[{"grc":"ὅτι σοῦ ἐστιν ἡ βασιλεία καὶ ἡ δύναμις καὶ ἡ δόξα εἰς τοὺς αἰῶνας· ἀμήν","text":"denn dein ist das Reich und die Kraft und die Herrlichkeit in Ewigkeit. Amen","note":"Lobpreis (Doxologie)"}]},"origin":["Jüdische Gebete schlossen oft mit einem Lobpreis; ein Vorbild ist [[1CH.29.11]]. Beim Beten im Gottesdienst wurde das Vaterunser wohl früh mit einem Lobpreis beendet, und dieser gelangte von dort in viele Handschriften.","Die Didache, eine frühchristliche Gemeindeordnung (um 100), gibt das Vaterunser mit dem kürzeren Schluss «denn dein ist die Kraft und die Herrlichkeit in Ewigkeit» wieder. Das zeigt, dass ein Lobpreis sehr früh gebetet wurde, aber in verschiedenen Formen.","Wer den Lobpreis für ursprünglich hält, verweist auf seine Verbreitung in der grossen Mehrheit der Handschriften und im kirchlichen Gebrauch."],"related":[]},"VAR-SBLGNTAPP-MAT-006-015-01":{"words":{"R1":[{"grc":"ἀνθρώποις","text":"den Menschen","note":"ohne Zusatz"}],"R2":[{"grc":"ἀνθρώποις τὰ παραπτώματα αὐτῶν","text":"den Menschen ihre Verfehlungen","note":"Zusatz wie in [[MAT.6.14]]"}]},"origin":["Der Zusatz kann aus [[MAT.6.14]] übernommen sein, um die beiden Sätze gleich zu gestalten.","Ebenso kann er beim Abschreiben ausgefallen sein; die Ausgaben sind hier geteilt."],"related":[]}},"name":"l/de/MAT","lang":"de"},"l/de/MRK":{"layer":{"text":{"MRK.3.20":"Und er kommt in ein Haus; und wieder kommt die Menge zusammen, sodass sie nicht einmal Brot essen konnten.","MRK.3.21":"Und als die Seinen es hörten, gingen sie hinaus, um ihn festzuhalten; denn sie sagten: «Er ist von Sinnen.»","MRK.3.22":"Und die Schriftgelehrten, die von Jerusalem herabgekommen waren, sagten: «Er hat Beelzebul», und: «Durch den Herrscher der Dämonen treibt er die Dämonen aus.»","MRK.3.23":"Und er rief sie herbei und sagte in Gleichnissen zu ihnen: «Wie kann Satan Satan austreiben?","MRK.3.24":"Und wenn ein Reich gegen sich selbst gespalten ist, kann jenes Reich nicht bestehen.","MRK.3.25":"Und wenn ein Haus gegen sich selbst gespalten ist, wird jenes Haus nicht bestehen können.","MRK.3.26":"Und wenn der Satan sich gegen sich selbst erhoben hat und gespalten worden ist, kann er nicht bestehen, sondern hat ein Ende.","MRK.3.27":"Aber niemand kann in das Haus des Starken hineingehen und seinen Hausrat plündern, wenn er nicht zuerst den Starken bindet; und dann wird er sein Haus plündern.","MRK.3.28":"Amen, ich sage euch: Alles wird den Söhnen der Menschen vergeben werden, die Sünden und die Lästerungen, so viele sie auch lästern mögen.","MRK.3.29":"Wer aber gegen den Heiligen Geist lästert, hat auf ewig keine Vergebung, sondern ist einer ewigen Sünde schuldig.»","MRK.3.30":"Denn sie sagten: «Er hat einen unreinen Geist.»","MRK.3.31":"Und es kommen seine Mutter und seine Brüder, und draussen stehend schickten sie zu ihm und liessen ihn rufen.","MRK.3.32":"Und eine Menge sass um ihn herum, und sie sagen zu ihm: «Siehe, deine Mutter und deine Brüder sind draussen und suchen dich.»","MRK.3.33":"Und er antwortet ihnen und sagt: «Wer ist meine Mutter, und wer sind meine Brüder?»","MRK.3.34":"Und er blickt ringsum auf die, die im Kreis um ihn sitzen, und sagt: «Siehe, meine Mutter und meine Brüder!","MRK.3.35":"Denn wer den Willen Gottes tut, der ist mein Bruder und meine Schwester und meine Mutter.»"},"source":{"MRK.3.20":"TRANS-MRK-003-020-021-DE-WORKING","MRK.3.21":"TRANS-MRK-003-020-021-DE-WORKING","MRK.3.22":"TRANS-MRK-003-022-030-DE-WORKING","MRK.3.23":"TRANS-MRK-003-022-030-DE-WORKING","MRK.3.24":"TRANS-MRK-003-022-030-DE-WORKING","MRK.3.25":"TRANS-MRK-003-022-030-DE-WORKING","MRK.3.26":"TRANS-MRK-003-022-030-DE-WORKING","MRK.3.27":"TRANS-MRK-003-022-030-DE-WORKING","MRK.3.28":"TRANS-MRK-003-022-030-DE-WORKING","MRK.3.29":"TRANS-MRK-003-022-030-DE-WORKING","MRK.3.30":"TRANS-MRK-003-022-030-DE-WORKING","MRK.3.31":"TRANS-MRK-003-031-035-DE-WORKING","MRK.3.32":"TRANS-MRK-003-031-035-DE-WORKING","MRK.3.33":"TRANS-MRK-003-031-035-DE-WORKING","MRK.3.34":"TRANS-MRK-003-031-035-DE-WORKING","MRK.3.35":"TRANS-MRK-003-031-035-DE-WORKING"},"alternatives":[{"ref":"MRK.3.20","from":"Und er kommt in ein Haus","to":"Und sie kommen in ein Haus","effect":"bedeutsam","note":"Je nach Lesart kommt Jesus allein oder mit seinen Jüngern ins Haus.","variant":"VAR-SBLGNTAPP-MRK-003-020-01","support":1,"base_support":4,"of":5,"basis":"editions"},{"ref":"MRK.3.25","from":"wird jenes Haus nicht bestehen können","to":"  wer ausdrücklich ins Haus kommt."],"related":[]},"VAR-SBLGNTAPP-MRK-003-025-01":{"words":{"R1":[{"grc":"δυνήσεται","text":"wird können","note":"Zukunft"}],"R2":[{"grc":"δύναται","text":"kann","note":"Gegenwart"}]},"origin":["In [[MRK.3.24]] und [[MRK.3.26]] steht jeweils «kann» in der Gegenwart. Schreiber könnten [[MRK.3.25]] daran angeglichen haben.","Ebenso denkbar ist, dass die Zukunftsform eine stilistische Abwechslung ist, die später geglättet wurde, oder umgekehrt."],"related":[]},"VAR-SBLGNTAPP-MRK-003-026-01":{"words":{"R1":[{"grc":"ἐμερίσθη","text":"wurde gespalten","note":"Aorist: abgeschlossenes Ereignis"}],"R2":[{"grc":"μεμέρισται","text":"ist gespalten","note":"Perfekt: andauernder Zustand"}]},"origin":["Die Parallelstelle [[MAT.12.26]] hat «wurde gespalten» (ἐμερίσθη). Diese Form könnte daher aus Matthäus übernommen sein.","Umgekehrt könnte «ist gespalten» eine sprachliche Glättung sein, weil der Zustand im Satz wichtiger ist als das Ereignis.","Für den Sinn macht der Unterschied wenig aus."],"related":[]},"VAR-SBLGNTAPP-MRK-003-029-01":{"words":{"R1":[{"grc":"ἁμαρτήματος","text":"einer Verfehlung, Sünde","note":"ἁμάρτημα: einzelne Tat; im Neuen Testament selten (im kritischen Text nur [[MRK.3.28-MRK.3.29]]; [[ROM.3.25]]; [[1CO.6.18]]; im byzantinischen Text auch [[MRK.4.12]])"}],"R2":[{"grc":"κρίσεως","text":"eines Gerichts, Urteils","note":"κρίσις: Gericht, Entscheidung"}],"VAR-MRK-003-029-001:R3":[{"grc":"ἁμαρτίας","text":"einer Sünde","note":"ἁμαρτία: das geläufige Wort für Sünde"}]},"origin":["Viele Textforscher halten das seltene «ewige Sünde» (ἁμαρτήματος) für ursprünglich: Schreiber ersetzten den ungewöhnlichen Ausdruck eher durch das geläufigere Wort (ἁμαρτίας) oder durch die leicht verständliche Vorstellung eines ewigen Gerichts (κρίσεως) als umgekehrt.","Wer dem Text der Mehrheit der späteren Handschriften den Vorzug gibt, hält «ewiges Gericht» für ursprünglich; diese Lesart ist in vielen byzantinischen Handschriften verbreitet.","Die dritte Form «ewige Sünde» mit dem häufigen Wort ἁμαρτία steht in mehreren alten Handschriften und liegt sprachlich zwischen den beiden anderen."],"related":["VAR-MRK-003-029-001"]},"VAR-MRK-003-029-002":{"words":{"R1":[{"grc":"ἐστιν","text":"ist","note":"Gegenwart"}],"R2":[{"grc":"ἔσται","text":"wird sein","note":"Zukunft"}]},"origin":["Die Zukunftsform könnte an das vorausgehende «hat keine Vergebung in Ewigkeit» und an den Gedanken eines künftigen Gerichts angelehnt sein.","Ebenso könnte die Gegenwart eine Angleichung an den üblichen Sprachgebrauch sein. Beide Formen stehen in sehr alten Handschriften."],"related":[]},"VAR-SBLGNTAPP-MRK-003-032-03":{"words":{"R1":[{"grc":"σου","text":"ohne Zusatz","note":"Der Satz endet mit «deine Brüder»."}],"R2":[{"grc":"καὶ αἱ ἀδελφαί σου","text":"und deine Schwestern","note":"Zusatz"}]},"origin":["Ein Schreiber kann die Schwestern aus [[MRK.3.35]] («Bruder, Schwester und Mutter») hier ergänzt haben.","Umgekehrt können sie versehentlich ausgefallen sein: Beide Wortgruppen enden auf «σου» (deine). Springt das Auge vom ersten zum zweiten «σου», fällt «und deine Schwestern» weg; das kommt beim Abschreiben häufig vor.","Auch eine bewusste Angleichung an [[MRK.3.31]] und [[MRK.3.34]] sowie an Matthäus und Lukas, die hier keine Schwestern nennen, ist denkbar."],"related":[]}},"name":"l/de/MRK","lang":"de"},"l/gsw/LUK":{"layer":{"text":{"LUK.11.1":"Und es isch gsii, won er amene Ort am Bätte gsii isch: Won er ufghört hät, hät eine vo sine Jünger zu ihm gseit: Herr, leer üs bätte, wie au de Johannes sini Jünger gleert hät.","LUK.11.2":"Er hät zu ine gseit: Wänn ir bätted, säged: Vatter, diin Name söll gheiliget wärde, diis Riich söll choo.","LUK.11.3":"Öises täglich Broot gib üs Taag für Taag.","LUK.11.4":"Und vergib üs öisi Sünde, dänn au mir sälber vergänd jedem, wo üs öppis schuldig isch; und füer üs nöd i d Versuechig."},"source":{"LUK.11.1":"TRANS-LUK-011-001-004-GSW-ZH-WORKING","LUK.11.2":"TRANS-LUK-011-001-004-GSW-ZH-WORKING","LUK.11.3":"TRANS-LUK-011-001-004-GSW-ZH-WORKING","LUK.11.4":"TRANS-LUK-011-001-004-GSW-ZH-WORKING"},"decisions":{"LUK.11.1":[{"target":"Und es isch gsii","kind":"literal","grc":"Καὶ ἐγένετο","note":"Lukanische Erzählformel; in Mundart ungewohnt, aber möglich."}],"LUK.11.2":[{"target":"Vatter","kind":"literal","grc":"Πάτερ","note":"Kurze Anrede ohne «öise», wie in den ältesten Handschriften."}],"LUK.11.3":[{"target":"täglich","kind":"traditional","grc":"τὸν ἐπιούσιον","more_literal":"für de nööchscht Taag","other_options":["für de nööchscht Taag","wo mer zum Läbe bruuched"],"note":"Wie [[MAT.6.11]]."},{"target":"Taag für Taag","kind":"literal","grc":"τὸ καθʼ ἡμέραν"}],"LUK.11.4":[{"target":"wo üs öppis schuldig isch","kind":"adapted","grc":"ὀφείλοντι ἡμῖν","more_literal":"wo üs schuldet","note":"«öppis» ist ergänzt."},{"target":"füer üs nöd i d Versuechig","kind":"traditional","grc":"μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν","more_literal":"bring üs nöd ine i d Versuechig","note":"Wie [[MAT.6.13]]."}]},"alternatives":[{"ref":"LUK.11.2","from":"Vatter, diin Name","to":"Öise Vatter im Himel, diin Name","effect":"bedeutsam","note":"Die längere Anrede entspricht Matthäus.","variant":"VAR-SBLGNTAPP-LUK-011-002-01","support":1,"base_support":4,"of":5,"basis":"editions"},{"ref":"LUK.11.2","from":"diis Riich söll choo","to":"diis Riich söll choo; diin Wile söll gschee, wie im Himel, eso uf de Ärde","effect":"bedeutsam","note":"Die Bitte um Gottes Willen steht in vielen Handschriften auch bei Lukas.","variant":"VAR-SBLGNTAPP-LUK-011-002-02","support":1,"base_support":4,"of":5,"basis":"editions"},{"ref":"LUK.11.4","from":"füer üs nöd i d Versuechig","to":"füer üs nöd i d Versuechig, sondern rett üs vor em Bööse","effect":"bedeutsam","note":"Die letzte Bitte der Matthäusfassung.","variant":"VAR-SBLGNTAPP-LUK-011-004-01","support":1,"base_support":4,"of":5,"basis":"editions"}],"align":{"TOK-SBLGNT-LUK-011-002-001":{"target":"hät … gseit","kind":"lexical","note":null,"first":true},"TOK-SBLGNT-
