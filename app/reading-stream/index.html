,"alts":{"VAR-SBLGNTAPP-LUK-011-002-01":{"words":{"R1":[{"grc":"Πάτερ","text":"Vatter","note":"churzi Aared"}],"R2":[{"grc":"Πάτερ ἡμῶν ὁ ἐν τοῖς οὐρανοῖς","text":"Öise Vatter i de Himel","note":"Aared wie bim Matthäus"}]},"origin":["Wär s Vatterunser i de Matthäusfassig uswändig kännt und im Gottesdienscht bättet hät, hät bim Abschriibe di chürzer Lukasfassig liecht dra aaglichet. Vili Textforscher erkläred di längeri Aared bim Lukas so.","Di chürzer Aared entspricht au em aramäische «Abba», mit däm de Jesus Gott nach [[MRK.14.36]] aaredt."],"related":[]},"VAR-SBLGNTAPP-LUK-011-002-02":{"words":{"R1":[{"grc":"σου","text":"diis (Riich)","note":"ohni wiiteri Bitt"}],"R2":[{"grc":"γενηθήτω τὸ θέλημά σου ὡς ἐν οὐρανῷ καὶ ἐπὶ τῆς γῆς","text":"diin Wile söll gschee, wie im Himel, eso uf de Ärde","note":"Bitt wie bim Matthäus"}]},"origin":["Au da isch e Aagliichig a di vertrouti Matthäusfassig di hüüfigscht Erkläärig.","Es paar wenigi spööteri Handschrifte und Chilevätter (brichtet für d Minuskle 700 und 162 und für de Gregor vo Nyssa) händ a dere Stell stattdesse e Bitt um de Heilig Geischt: «Diin Heilige Geischt söll über üs choo und üs reinige.» Die Aagab isch da nöd prüeft; si zeigt, wie frei s Gebät i mängne Chreis wiitergää worde isch."],"related":[]},"VAR-SBLGNTAPP-LUK-011-004-01":{"words":{"R1":[{"grc":"πειρασμόν","text":"Versuechig","note":"Änd vom Gebät"}],"R2":[{"grc":"ἀλλὰ ῥῦσαι ἡμᾶς ἀπὸ τοῦ πονηροῦ","text":"sondern rett üs vor em Bööse","note":"Bitt wie bim Matthäus"}]},"origin":["Au dä Zuesatz laat sich als Aagliichig a de Matthäus erkläre.","Wär en für ursprünglich haltet, verwiist uf sini wiiti Verbreitig; dass er grad im 𝔓75, im Sinaiticus und im Vaticanus fäält, redt nach Aasicht vo vilne Textforscher eher für e spööteri Ergänzig."],"related":[]}},"i18n":{"FIND-LP-0002":{"claim":"De Lukas hät e chürzeri Fassig: d Aared isch nu «Vatter», ohni d Bitt um Gottes Wile und ohni d Bitt um Rettig vor em Bööse. Statt «Schulde» seit er «Sünde», bhaltet aber im zweite Satzteil s Bild vom Schuldner.","caveat":"Vergliich vo de SBLGNT-Text; i vilne spöötere Handschrifte isch d Lukasfassig a de Matthäus aaglichet (lueg Läsarte)."},"FIND-LP-0006":{"claim":"D churz Lukasfassig (Aared «Vatter», ohni Wilesbitt und ohni «sondern rett üs») staat im 𝔓75 und im Vaticanus; de Sinaiticus hät d churz Aared, aber d Wilesbitt. Alexandrinus, Ephraemi, Bezae und Washingtonianus händ die längere Forme, wo a de Matthäus aaglichet sind.","caveat":"Nach de CNTR-Transkriptione (WREAD-CNTR-LUK-011-001-004); maschinelli Zuordnig, nöd am Faksimile prüeft."},"INT-LP-0007":{"claim":"De Lukas überliferet en elteri, chürzeri Form, wo de Matthäus für de Bruuch i siner Gmeind erwiiteret hät.","caveat":"Weli Fassig nööcher bim Jesus liit, cha me nöd sicher entscheide; vilicht hät de Jesus s Gebät i verschidene Forme gleert.","counter":["De Matthäus chönnt di ursprünglicheri Wortwaal bhalte haa (z. B. «Schulde» statt «Sünde»), während de Lukas für nödjüdischi Läser vereifacht.","Beidi Fassige chönd uf verschideni Gmeindstraditione zruggaa, ohni dass eini vo de andere abhängt."]},"QUESTION-LP-0002":{"q":"Weli Fassig vom Vatterunser staat em Jesus nööcher, und isch es ursprünglich uf Aramäisch bättet worde?","finding":"Beidi Fassige sind nu griechisch überliferet. Rucküebersetzige is Aramäische sind Rekonstruktione."},"BG-LP-0012":{"topic":"De Johannes und sini Jünger","text":"Leerer und iri Schüelerchreis händ eigeni Gebät gha; au vo de Jünger vom Johannes em Töifer wird verzellt, dass si gfaschtet und bättet händ ([[LUK.5.33]]). Es eigets Gebät hät ere Gruppe Zämehalt und es Erkännigszeiche gää."}},"name":"l/gsw/LUK","lang":"gsw"},"l/gsw/MAT":{"layer":{"text":{"MAT.6.5":"Und wänn ir bätted, söled ir nöd sii wie d Hüüchler; die stönd nämli gärn i de Synagoge und a de Egge vo de breite Straasse zum bätte, dass d Lüüt si gseend. Amen, ich säg s eu: Si händ ire Loon scho übercho.","MAT.6.6":"Du aber, wänn du bätisch, gang i dini Chammer, mach d Tür zue und bätt zu diim Vatter, wo im Verborgne isch; und diin Vatter, wo is Verborgne gseet, wird s dir vergälte.","MAT.6.7":"Wänn ir bätted, söled ir nöd plappere wie d Heide; die meined nämli, si wärded erhört, wänn si vil Wort mached.","MAT.6.8":"Mached s also nöd wie sii; eue Vatter weiss nämli, was ir bruuched, bevor ir en drum bitted.","MAT.6.9":"Eso söled ir also bätte: Öise Vatter i de Himel, diin Name söll gheiliget wärde,","MAT.6.10":"diis Riich söll choo, diin Wile söll gschee, wie im Himel, eso au uf de Ärde.","MAT.6.11":"Öises täglich Broot gib üs hüt.","MAT.6.12":"Und vergib üs öisi Schulde, wie au mir öisne Schuldner vergää händ.","MAT.6.13":"Und füer üs nöd i d Versuechig, sondern rett üs vor em Bööse.","MAT.6.14":"Wänn ir nämli de Lüüt iri Fääler vergänd, wird eu eue himmlisch Vatter au vergää;","MAT.6.15":"wänn ir aber de Lüüt nöd vergänd, wird au eue Vatter eui Fääler nöd vergää."},"source":{"MAT.6.5":"TRANS-MAT-006-005-015-GSW-ZH-WORKING","MAT.6.6":"TRANS-MAT-006-005-015-GSW-ZH-WORKING","MAT.6.7":"TRANS-MAT-006-005-015-GSW-ZH-WORKING","MAT.6.8":"TRANS-MAT-006-005-015-GSW-ZH-WORKING","MAT.6.9":"TRANS-MAT-006-005-015-GSW-ZH-WORKING","MAT.6.10":"TRANS-MAT-006-005-015-GSW-ZH-WORKING","MAT.6.11":"TRANS-MAT-006-005-015-GSW-ZH-WORKING","MAT.6.12":"TRANS-MAT-006-005-015-GSW-ZH-WORKING","MAT.6.13":"TRANS-MAT-006-005-015-GSW-ZH-WORKING","MAT.6.14":"TRANS-MAT-006-005-015-GSW-ZH-WORKING","MAT.6.15":"TRANS-MAT-006-005-015-GSW-ZH-WORKING"},"decisions":{"MAT.6.5":[{"target":"Hüüchler","kind":"literal","grc":"ὑποκριταί","note":"ὑποκριτής hiess ursprünglich «Schauspieler»."},{"target":"Si händ ire Loon scho übercho","kind":"literal","grc":"ἀπέχουσι τὸν μισθὸν αὐτῶν","note":"ἀπέχω ist das Wort der Quittung: «vollständig erhalten haben»."}],"MAT.6.6":[{"target":"Chammer","kind":"literal","grc":"ταμεῖόν","note":"Vorrats- oder Innenraum; in Mundart ist «Chammer» das vertraute Wort."}],"MAT.6.7":[{"target":"plappere","kind":"interpretive","grc":"βατταλογήσητε","other_options":["schnädere","vil läär Wort mache"],"note":"βατταλογέω ist sonst kaum belegt; «plappere» ist die übliche Deutung."}],"MAT.6.8":[{"target":"Mached s also nöd wie sii","kind":"adapted","grc":"μὴ οὖν ὁμοιωθῆτε αὐτοῖς","more_literal":"Wärded ine also nöd gliich","note":"«sich gleich machen» ist in Mundart unüblich; umschrieben."}],"MAT.6.9":[{"target":"Öise Vatter","kind":"literal","grc":"Πάτερ ἡμῶν","more_literal":"Vatter öise","note":"Im Griechischen steht «Vater» zuerst; in Mundart steht das Possessiv voran."},{"target":"i de Himel","kind":"literal","grc":"ὁ ἐν τοῖς οὐρανοῖς","note":"Mehrzahl wie im Griechischen; «i de Himel» ist in Mundart Dativ Plural und zugleich natürlich."},{"target":"söll gheiliget wärde","kind":"literal","grc":"ἁγιασθήτω","note":"Passiv-Imperativ; Mundart kennt keinen Imperativ der 3. Person, darum «söll … wärde»."}],"MAT.6.11":[{"target":"täglich","kind":"traditional","grc":"τὸν ἐπιούσιον","more_literal":"für de nööchscht Taag","other_options":["für de nööchscht Taag","wo mer zum Läbe bruuched"],"note":"Das Wort ist unsicher; «täglich» folgt der vertrauten Tradition. Siehe Deutungen bei der hochdeutschen Fassung."}],"MAT.6.12":[{"target":"Schulde","kind":"literal","grc":"τὰ ὀφειλήματα","note":"Wörtlich Geldschulden; aramäisch zugleich Sünde."},{"target":"vergää händ","kind":"literal","grc":"ἀφήκαμεν","note":"Aorist; Mundart hat nur Perfekt."}],"MAT.6.13":[{"target":"füer üs nöd i d Versuechig","kind":"traditional","grc":"μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν","more_literal":"bring üs nöd ine i d Versuechig","other_options":["lass üs nöd i d Versuechig ine choo (Deutung nach aramäischem Hintergrund)"],"note":"Wörtlich nah und zugleich die vertraute Formel."},{"target":"Versuechig","kind":"interpretive","grc":"πειρασμόν","other_options":["Prüefig"],"note":"πειρασμός heisst «Versuchung» und «Prüfung»."},{"target":"rett","kind":"literal","grc":"ῥῦσαι","other_options":["erlös","bewaar"],"note":"ῥῦσαι «rette, entreisse»."},{"target":"vor em Bööse","kind":"interpretive","grc":"ἀπὸ τοῦ πονηροῦ","other_options":["vor em Bööse (Person)","vor em Übel"],"note":"Neutrum oder Maskulinum möglich."}],"MAT.6.14":[{"target":"Fääler","kind":"adapted","grc":"τὰ παραπτώματα","more_literal":"Verfäälige","note":"παράπτωμα «Fehltritt, Verfehlung»; «Fääler» ist das gebräuchliche Mundartwort, etwas schwächer als das Griechische."}]},"alternatives":[{"ref":"MAT.6.5","from":"wänn ir bätted, söled ir nöd sii wie","to":"wänn du bätisch, sollsch du nöd sii wie","effect":"gering","note":"Einzahl statt Mehrzahl, wie in [[MAT.6.6]].","variant":"VAR-SBLGNTAPP-MAT-006-005-01","support":1,"base_support":4,"of":5,"basis":"editions"},{"ref":"MAT.6.6","from":"wird s dir vergälte","to":"wird s dir öffentlich vergälte","effect":"bedeutsam","note":"Mit dem Zusatz steht dem verborgenen Beten ein öffentlicher Lohn gegenüber.","variant":"VAR-SBLGNTAPP-MAT-006-006-01","support":1,"base_support":4,"of":5,"basis":"editions"},{"ref":"MAT.6.8","from":"eue Vatter weiss nämli","to":"Gott, eue Vatter, weiss nämli","effect":"gering","note":"Westcott-Hort folgen einer Lesart mit «Gott».","variant":"VAR-SBLGNTAPP-MAT-006-008-01","support":1,"base_support":4,"of":5,"basis":"editions"},{"ref":"MAT.6.12","from":"wie au mir öisne Schuldner vergää händ","to":"wie au mir öisne Schuldner vergänd","effect":"bedeutsam","note":"Vergangenheit oder Gegenwart.","variant":"VAR-SBLGNTAPP-MAT-006-012-01","support":1,"base_support":4,"of":5,"basis":"editions"},{"ref":"MAT.6.13","from":"rett üs vor em Bööse","to":"rett üs vor em Bööse. Dänn diin isch s Riich und d Chraft und d Herrlichkeit i Ewigkeit. Amen","effect":"bedeutsam","note":"Der vertraute Lobpreis fehlt in den ältesten Handschriften.","variant":"VAR-SBLGNTAPP-MAT-006-013-01","support":1,"base_support":4,"of":5,"basis":"editions"},{"ref":"MAT.6.15","from":"de Lüüt nöd vergänd","to":"de Lüüt iri Fääler nöd vergänd","effect":"gering","note":"Der Zusatz wiederholt [[MAT.6.14]].","variant":"VAR-SBLGNTAPP-MAT-006-015-01","support":3," "first":false},"TOK-SBLGNT-MAT-006-012-006":{"target":"öisi","kind":"lexical","note":null,"first":true},"TOK-SBLGNT-MAT-006-012-007":{"target":"wie","kind":"lexical","note":null,"first":true},"TOK-SBLGNT-MAT-006-012-008":{"target":"au","kind":"lexical","note":null,"first":true},"TOK-SBLGNT-MAT-006-012-009":{"target":"mir","kind":"lexical","note":"betont","first":true},"TOK-SBLGNT-MAT-006-012-010":{"target":"vergää händ","kind":"lexical","note":"Aorist","first":true},"TOK-SBLGNT-MAT-006-012-011":{"target":"Schuldner","kind":"phrase","note":null,"first":true},"TOK-SBLGNT-MAT-006-012-012":{"target":"Schuldner","kind":"phrase","note":null,"first":false},"TOK-SBLGNT-MAT-006-012-013":{"target":"öisne","kind":"lexical","note":null,"first":true},"TOK-SBLGNT-MAT-006-013-001":{"target":"Und","kind":"lexical","note":null,"first":true},"TOK-SBLGNT-MAT-006-013-002":{"target":"nöd","kind":"lexical","note":null,"first":true},"TOK-SBLGNT-MAT-006-013-003":{"target":"füer","kind":"lexical","note":"wörtlich «hineinbringen»","first":true},"TOK-SBLGNT-MAT-006-013-004":{"target":"üs","kind":"lexical","note":null,"first":true},"TOK-SBLGNT-MAT-006-013-005":{"target":"i d Versuechig","kind":"phrase","note":null,"first":true},"TOK-SBLGNT-MAT-006-013-006":{"target":"i d Versuechig","kind":"phrase","note":null,"first":false},"TOK-SBLGNT-MAT-006-013-007":{"target":"sondern","kind":"lexical","note":null,"first":true},"TOK-SBLGNT-MAT-006-013-008":{"target":"rett","kind":"lexical","note":null,"first":true},"TOK-SBLGNT-MAT-006-013-009":{"target":"üs","kind":"lexical","note":null,"first":true},"TOK-SBLGNT-MAT-006-013-010":{"target":"vor em Bööse","kind":"phrase","note":null,"first":true},"TOK-SBLGNT-MAT-006-013-011":{"target":"vor em Bööse","kind":"phrase","note":null,"first":false},"TOK-SBLGNT-MAT-006-013-012":{"target":"vor em Bööse","kind":"phrase","note":null,"first":false}}},"alts":{"VAR-SBLGNTAPP-MAT-006-005-01":{"words":{"R1":[{"grc":"προσεύχησθε, οὐκ ἔσεσθε ὡς","text":"ir bätted, ir söled nöd sii wie","note":"Meerzaal"}],"R2":[{"grc":"προσεύχῃ οὐκ ἔσῃ ὥσπερ","text":"du bätisch, du sollsch nöd sii wie","note":"Einzaal"}]},"origin":["D Einzaal chönnt a d Umgäbig aaglichet sii: I [[MAT.6.2-MAT.6.4]] und [[MAT.6.6]] wird jewiils «du» aagredt.","Umgekeert chönnt d Meerzaal a [[MAT.6.7-MAT.6.9]] aaglichet sii, wo «ir» aagredt wird."],"related":[]},"VAR-SBLGNTAPP-MAT-006-006-01":{"words":{"R1":[{"grc":"σοι","text":"dir","note":"ohni Zuesatz"}],"R2":[{"grc":"σοι ἐν τῷ φανερῷ","text":"dir im Offne, öffentlich","note":"Zuesatz"}]},"origin":["De Zuesatz bildet es Gägestuck zu «im Verborgne» und chönnt ergänzt worde sii, zum de Gägesatz z betone; de gliich Zuesatz findt sich i mängne Handschrifte au i [[MAT.6.4]] und [[MAT.6.18]].","Wär de Zuesatz für ursprünglich haltet, mues erkläre, warum er i de eltischte Handschrifte fäält; dänkbar isch, dass er wäge em Gedanke a en öffentliche Loon bewusst wäggglaa worde isch."],"related":[]},"VAR-SBLGNTAPP-MAT-006-008-01":{"words":{"R1":[{"grc":"ὁ πατὴρ","text":"de Vatter","note":"ohni «Gott»"}],"R2":[{"grc":"ὁ θεὸς ὁ πατὴρ","text":"Gott, de Vatter","note":"mit «Gott»"}]},"origin":["«Gott» cha als Verdüütlichig dezuekoo sii, wie si au i de Liturgie üblich isch.","Umgekeert cha «Gott» bim Abschriibe usgfalle sii, wil zwei Wortgruppe gliich mit «ὁ» aafanged."],"related":[]},"VAR-SBLGNTAPP-MAT-006-012-01":{"words":{"R1":[{"grc":"ἀφήκαμεν","text":"mir händ vergää","note":"Aorist: abgschlosseni Handlig"}],"R2":[{"grc":"ἀφίεμεν","text":"mir vergänd","note":"Gägewart"}],"other":[{"grc":"ἀφίομεν","text":"mir vergänd","note":"Näbeform vo de Gägewart, so au i [[LUK.11.4]]"}]},"origin":["D Gägewart chönnt a de Lukas ([[LUK.11.4]] «mir vergänd») und a s Gebät im Gottesdienscht aaglichet sii.","D Vergangeheitsform cha e aramäischi Usdruckswiis widergää, wo en Akt meint, wo me grad jetzt vollzieht («hiemit vergänd mir»); dänn isch de Underschid chliiner, als er im Tüütsche ussgseet.","Wär d Gägewart für ursprünglich haltet, verwiist uf iri Verbreitig i de Meerheit vo de spöötere Handschrifte."],"related":[]},"VAR-SBLGNTAPP-MAT-006-013-01":{"words":{"R1":[{"grc":"πονηροῦ","text":"(em) Bööse","note":"Änd vom Gebät ohni Lobpriis"}],"R2":[{"grc":"ὅτι σοῦ ἐστιν ἡ βασιλεία καὶ ἡ δύναμις καὶ ἡ δόξα εἰς τοὺς αἰῶνας· ἀμήν","text":"dänn diin isch s Riich und d Chraft und d Herrlichkeit i Ewigkeit. Amen","note":"Lobpriis (Doxologie)"}]},"origin":["Jüdischi Gebät händ oft mit eme Lobpriis ufghört; es Vorbild isch [[1CH.29.11]]. Bim Bätte im Gottesdienscht hät me s Vatterunser wahrschiinli früe mit eme Lobpriis beändet, und dä isch vo dört i vili Handschrifte cho.","D Didache, e früechrischtlichi Gmeindsordnig (um 100), git s Vatterunser mit em chürzere Schluss «dänn diin isch d Chraft und d Herrlichkeit i Ewigkeit» wider. Das zeigt, dass en Lobpriis seer früe bättet worde isch, aber i verschidene Forme.","Wär de Lobpriis für ursprünglich haltet, verwiist uf sini Verbreitig i de groosse Meerheit vo de Handschrifte und im chilchliche Bruuch."],"related":[]},"VAR-SBLGNTAPP-MAT-006-015-01":{"words":{"R1":[{"grc":"ἀνθρώποις","text":"de Lüüt","note":"ohni Zuesatz"}],"R2":[{"grc":"ἀνθρώποις τὰ παραπτώματα αὐτῶν","text":"de Lüüt iri Fääler","note":"Zuesatz wie i [[MAT.6.14]]"}]},"origin":["De Zuesatz cha us [[MAT.6.14]] übernaa sii, zum die zwei Sätz gliich z gstalte.","Gnau so cha er bim Abschriibe usgfalle sii; d Usgabe sind da teilt."],"related":[]}},"i18n":{"FIND-LP-0001":{"claim":"Nach de Aared folged bim Matthäus drüü Bitte mit «diin» (Name, Riich, Wile) und nachhär vier Bitte mit «üs» bzw. «öise» (Broot, Schulde, Versuechig, Rettig).","caveat":"Beobachtig am Wortluut; wie me d Bitte zellt (sächs oder sibe), wird i de Tradition verschide ghandhabt."},"FIND-LP-0003":{"claim":"S griechische Wort, wo me meischtens mit «täglich» übersetzt (ἐπιούσιος), chunnt im Nöie Teschtamänt nu im Vatterunser vor ([[MAT.6.11]]; [[LUK.11.3]]). De Origenes hät im 3. Jaarhundert gmerkt, dass es bi de Grieche süscht nöd bruucht wird.","caveat":"Origenes, Über s Gebät 27,7; spööteri Fund vo einzelne Beleg sind umstritte. Drum isch d Bedüütig unsicher."},"FIND-LP-0004":{"claim":"Vo allne Bitte vom Vatterunser nimmt de Matthäus nu d Bitt um Vergäbig nachhär nomal uf ([[MAT.6.14-MAT.6.15]]).","caveat":"Beobachtig am Wortluut."},"FIND-LP-0005":{"claim":"De Lobpriis «Dänn diin isch s Riich …» fäält bim Matthäus i de eltischte erhaltene Handschrifte (Sinaiticus, Vaticanus, Bezae) und staat im Washingtonianus (4./5. Jh.) und i de Meerheit vo de spöötere Handschrifte.","caveat":"Nach de importierte CNTR-Transkriptione und de maschinelle Zuordnig (WREAD-CNTR-MAT-006-005-015); nöd am Faksimile prüeft."},"INT-LP-0001":{"claim":"«Broot für de nööchscht Taag»: S Wort (ἐπιούσιος) wird vom griechische Usdruck für «de nööchscht Taag» (ἡ ἐπιοῦσα ἡμέρα) abgleitet. Me bittet hüt um s Broot für morn, demit me nöd i Sorg läbe mues. De Hieronymus brichtet, im Hebräerevangelium stöng da «mahar» (für morn).","caveat":"Staat i Spannig zu [[MAT.6.34]] («Sorged nöd für morn»), wänn me s als Vorsorg verstaat.","counter":["D Bitt «gib üs hüt s Broot für morn» cha grad das Vertroue usdrucke, wo [[MAT.6.34]] verlangt: Me leit de nööchscht Taag i Gottes Hand.","D Notiz vom Hieronymus bezieht sich uf es Evangelium, wo nöd erhalte isch, und cha e spööteri Rucküebersetzig sii."],"terms":["meischtens «täglich»","de folgendi Tag","morn"]},"INT-LP-0002":{"claim":"«S Broot, wo me zum Läbe bruucht»: S Wort (ἐπιούσιος) wird vo «für» (ἐπί) und «Daasii, Läbesunterhalt» (οὐσία) abgleitet. Me bittet um das, wo me zum Läbe bruucht, nöd um Überfluss (vgl. [[PRO.30.8]]).","caveat":"Sprachlich isch die Wortbildig ungwöhnli; me wür e chli e anderi Form erwarte (ἐπούσιος).","counter":["D Tradition «täglich» (latiinisch cotidianum) und s lukanische «Taag für Taag» passed guet zu dere Bedüütig."],"terms":["meischtens «täglich»","Daasii, Läbesunderhalt"]},"INT-LP-0003":{"claim":"«S Broot vo de chünftige Wält»: Mängi Chilevätter händ s Wort geischtlich verstande, als Broot vom Gottesriich oder als Abigmaal; de Hieronymus hät im Matthäus mit supersubstantialem («überwäsentlich») übersetzt.","caveat":"Die Düütig liit wiiter wägg vom Alltagsbroot, a das d Zuehörer vom Jesus zerscht dänkt händ.","counter":["D Bitt um s Riich ([[MAT.6.10]]) und d Maalgmeinschafte vom Jesus verbinded Alltagsbroot und s erwartete Feschtmaal; beides mues sich nöd usschlüüsse."],"terms":["meischtens «täglich»","überwäsentlich"]},"INT-LP-0004":{"claim":"«Füer üs nöd i d Versuechig» bittet drum, nöd in e Prüefig ine z choo, wo me de Glaube verlüürt. Vili dänked debii a di groossi Bedrängnis vo de Ändziit, anderi a alltäglichi Versuechige.","caveat":"Öb Gott sälber als dä dänkt isch, wo i d Versuechig füert, isch umstritte; [[JAS.1.13]] seit, Gott versuechi niemert.","counter":["S Griechische isch e Bitt a Gott und setzt vorus, dass au Prüefige i siner Hand liged (vgl. [[GEN.22.1]]). D Bitt widerspricht [[JAS.1.13]] nöd, wänn me «Prüefig» und «Verfüerig zum Bööse» usenand haltet.","Einigi Chile händ d Formulierig i de letschte Ziit gänderet (z. B. Frankriich 2017: «lass üs nöd i d Versuechig ine trätte»; Italie 2020: «überlass üs nöd de Versuechig»), anderi, etwa d tüütschsprachige katholische Bistüemer 2018, händ si bhalte."],"terms":["Versuechig, Prüefig","inebringe"]},"INT-LP-0005":{"claim":"D Bitt um Vergäbig isch bim Matthäus mit de eigene Bereitschaft zum Vergää verknüpft: Wär sälber nöd vergit, verschlüüsst sich de Vergäbig vo Gott ([[MAT.6.14-MAT.6.15]]; vgl. [[MAT.18.23-MAT.18.35]]).","caveat":"Öb s eigene Vergää Bedingig oder Folg vo de empfangene Vergäbig isch, wird verschide gsee.","counter":["Im Gliichnis [[MAT.18.23-MAT.18.35]] gaat d Vergäbig vom Herr vora; s eigene Vergää isch d Antwort druf, nöd e Leischtig.","D Vergangeheitsform «wie mir vergää händ» ([[MAT.6.12]]) cha me als Usdruck vo de Bereitschaft verstaa, nöd als Vorleischtig."],"terms":["vergää, erlaa","Schuld"]},"INT-LP-0006":{"claim":"«Vor em Bööse» meint de Böös als Person (de Tüüfel), wie i [[MAT.13.19]].[[MAT.13.38]].","caveat":"S Griechische laat «s Bööse» (Neutrum) und «de Böös» (Maskulinum) zue; d Chile vom Oschte bätted meischtens «vor em Bööse» im persönliche Sinn, vili weschtlichi Übersetzige neutral.","counter":["«S Bööse» im allgemeine Sinn (Unheil, Bosheit) passt gnau so zum Zämehang und zu jüdische Gebät um Bewaarig vor Böösem."],"terms":["bööse; de Bööse"]},"PRIN-LP-0001":{"text":"Bätte nach de Aaleitig vom Jesus faat mit ere vertrouensvolle Aared vo Gott und mit Gottes Sach aa und bringt dänn di eigene Grundbedürfnis vor: Broot, Vergäbig und Bewaarig. Empfangeni und gschänkti Vergäbig ghööred zäme."},"APP-LP-0001":{"text":"Wär s Vatterunser hüt bättet, cha s langsam bätte und bi einzelne Bitte inehalte: Wo bruuch ich würkli «Broot für hüt»? Wem mues ich no vergää? In eme Land mit Überfluss cha d Broot-Bitt au a die erinnere, wo s Nötige fäält, dänn si heisst «öises» Broot, nöd «miis» Broot.","limits":"Das isch e hüttigi Übertragig, kei Befund am Text. S Vatterunser händ zu siner Ziit Mänsche bättet, für wo s tägliche Broot oft unsicher gsii isch; das laat sich nöd eifach uf hüttigi Läbesverhältnis übertrage."},"QUESTION-LP-0001":{"q":"Was bedüütet ἐπιούσιος gnau: «täglich», «für de nööchscht Taag», «zum Läbe nötig» oder öppis anders?","finding":"S Wort isch usserhalb vom Vatterunser praktisch nöd belait; d Düütige stütze sich uf d Wortbildig, alti Übersetzige und früeji Usleger."},"BG-LP-0001":{"topic":"Zwei Fassige, zwei Läserchreis","text":"De Matthäus stellt s Vatterunser i d Bärgpredigt, zwüsche Aawiisige zu Almose, Bätte und Faschte ([[MAT.6.1-MAT.6.18]]), wie si für d jüdisch Frömmigkeit typisch gsii sind. De Lukas verzellt, dass en Jünger de Jesus drum bittet, wie de Johannes de Töifer sini Jünger s Bätte gleert hät. Beidi händ Jaarzäänt nach em Jesus für verschideni Gmeinde gschribe, wo s Gebät wahrschiinli scho regelmässig bättet händ.","uncertain":"Öb de Jesus s Gebät bi einere oder bi meerere Glägeheite gleert hät, isch offe."},"BG-LP-0002":{"topic":"Bätte im Judetum dozmal","text":"Frommi Jude händ zu feschte Ziite bättet, oft drüümal am Taag (vgl. [[DAN.6.11]]; [[PSA.55.18]]), dezue s Schma Israel. Wär zur Gebätsziit underwägs gsii isch, hät dört bättet, wo n er grad gstande isch. De Jesus kritisiert nöd s Bätte i de Öffentlichkeit a sich, sondern s Bätte, zum gsee wärde.","uncertain":"Wie fescht d Gebätsziite und d Gebätstext zur Ziit vom Jesus scho greglet gsii sind, isch i de Forschig umstritte."},"BG-LP-0003":{"topic":"Hüüchler, Chammer, Heide","text":"S griechische Wort für Hüüchler hät ursprünglich Schauspiler uf de Büni bezeichnet. D «Chammer» isch e Vorrats- oder Inneruum gsii, i eifache Hüüser oft de einzig Ruum ohni Fänschter und mit Tür. I heidnische Gebät hät me d Gottheite mit vilne Näme und Biiname aagrüeft, demit me di richtig Aared troffe hät und erhört worde isch (vgl. [[1KI.18.26]]).","terms":["Schauspiler, Hüüchler","Vorratsruum, Chammer","plappere, läär Wort mache"]},"BG-LP-0004":{"topic":"Gott als Vatter aarede","text":"Au d hebräisch Bible und jüdischi Gebät nänned Gott Vatter ([[ISA.63.16]]; [[ISA.64.7]]; [[SIR.23.1]]). Dass de Jesus Gott ganz direkt mit «Vatter» aaredt, uf Aramäisch «Abba» ([[MRK.14.36]]), und sini Jünger dezue aaleitet, wird oft als bsunders vertrout beschribe. S früeje Chrischtetum hät s aramäische Wort sogar i griechische Brief bhalte ([[ROM.8.15]]; [[GAL.4.6]]).","uncertain":"Di verbreiteti Erkläärig, «Abba» seig d Chindersprach «Papi», gilt hüt als übertribe; s Wort händ au Erwachseni gägenüber irem Vatter bruucht.","terms":["Vatter","Vatter"]},"BG-LP-0005":{"topic":"De Name heilige","text":"De «Name» staat i de Bible für d Person sälber. Nach [[EZK.36.23]] heiliget Gott sin Name, indäm er a siim Volk handlet. Es jüdischs Gebät, s Kaddisch, faat ähnlich aa: «Erhobe und gheiliget wärdi sin groosse Name … er lassi sis Riich choo.»","uncertain":"S Kaddisch isch i siner hüttige Form düütli spööter belait; wie alt sini Chärnsätz sind, isch umstritte.","terms":["Name","heilige","heilig (Name vom Gebät)"]},"BG-LP-0006":{"topic":"S Riich vo Gott","text":"Vili Jude händ erwartet, dass Gott sini Herrschaft sichtbar ufrichtet und Unrächt und frömdi Herrschaft beändet (vgl. [[DAN.2.44]]). Im Galiläa under römischer Oberherrschaft isch das au politisch brisant gsii. «Riich vo Gott» isch s zentrale Thema vo de Verkündigung vom Jesus ([[MRK.1.15]]).","terms":["Chünigsherrschaft, Riich"]},"BG-LP-0007":{"topic":"Broot für de Taag","text":"Vili Mänsche händ vo de Hand i de Mund gläbt: Taglööner händ ire Loon am Aabig übercho und dervo s Ässe für de nööchscht Taag kauft (vgl. [[MAT.20.1-MAT.20.16]]; [[DEU.24.15]]). I de Wüeschti hät Israel s Manna Taag für Taag übercho und hät kei Vorrat dörfe aalegge ([[EXO.16.4]].[[EXO.16.19-EXO.16.20]]).","uncertain":"Was s griechische Wort für «täglich» gnau bedüütet, isch unsicher (lueg Düütige).","terms":["meischtens «täglich»; Bedüütig unsicher","morn"]},"BG-LP-0008":{"topic":"Schulde und Sünde","text":"Im Aramäische, wo de Jesus gredt hät, bezeichnet s gliiche Wort (ḥôbā) e Gäldschuld und e Sünd. Verschuldig isch im Galiläa verbreitet gsii und hät bis zur Schuldchnächtschaft chöne füere. S Gsetz hät en Schuldeerlass i jedem sibte Jaar kännt ([[DEU.15.1-DEU.15.2]]). De Matthäus bhaltet s Bild vo de Schulde, de Lukas seit «Sünde», redt aber im gliiche Värs vom Schuldner.","terms":["Schuld, Sünd","Schuld"]},"BG-LP-0009":{"topic":"Versuechig und Prüefig","text":"S griechische Wort meint beides: Versuechig zum Bööse und Prüefig vo de Tröi. D Bible verzellt vo Prüefige, etwa vom Abraham ([[GEN.22.1]]) oder vo Israel i de Wüeschti ([[DEU.8.2]]). Vili Jude händ vor em Choo vom Riich e Ziit vo groosser Bedrängnis erwartet.","terms":["Versuechig, Prüefig"]},"BG-LP-0010":{"topic":"De Lobpriis am Schluss","text":"Jüdischi Gebät händ oft mit eme Lobpriis vo Gott ufghört; es Vorbild isch s Gebät vom David i [[1CH.29.11]]. D Didache, e früechrischtlichi Gmeindsordnig us de Ziit um 100, git s Vatterunser fascht wie de Matthäus wider, mit em Schluss «dänn diin isch d Chraft und d Herrlichkeit i Ewigkeit», und raatet, es drüümal am Taag z bätte.","uncertain":"D Datierig vo de Didache isch umstritte (meischtens um 100)."},"BG-LP-0011":{"topic":"S Vatterunser uf Amulett","text":"Us em 3. bis 6. Jaarhundert sind meereri chliini Papyrusblätter und e Tonschärbe mit em Vatterunser erhalte, oft als Schutz-Amulett traage. Si zeiged, wie verbreitet s Gebät gsii isch, und dass eifachi Lüüt es nach em Ghöör ufgschribe händ, mit vilne Schriibvariante.","uncertain":"D Iiordnig als Amulett beruet uf em Format und em Fundzämehang; nöd jedes Stuck isch sicher eis."}},"name":"l/gsw/MAT","lang":"gsw"},"l/gsw/MRK":{"layer":{"text":{"MRK.3.20":"Und er chunnt i es Huus; und wider chunnt d Mängi zäme, so dass si nöd emal händ chöne Broot ässe.","MRK.3.21":"Und wo das sini Lüüt ghört händ, sind si usegange, zum en feschthebe; si händ nämli gseit: «Er isch nüme bi Troscht.»","MRK.3.22":"Und d Schriftgleerte, wo vo Jerusalem abe choo sind, händ gseit: «Er hät de Beelzebul», und: «Dur de Herrscher vo de Dämone tribt er d Dämone us.»","MRK.3.23":"Und er hät si zu sich grüeft und i Gliichnis zu ine gseit: «Wie cha de Satan de Satan ustriibe?","MRK.3.24":"Und wänn es Riich gäge sich sälber gspalte isch, cha das Riich nöd bestaa.","MRK.3.25":"Und wänn es Huus gäge sich sälber gspalte isch, wird das Huus nöd chöne bestaa.","MRK.3.26":"Und wänn de Satan gäge sich sälber ufgstande isch und gspalte worde isch, cha er nöd bestaa, sondern hät es Änd.","MRK.3.27":"Aber niemert cha is Huus vom Starche ine gaa und sin Huusraat plündere, wänn er nöd zerscht de Starch bindt; und dänn wird er sis Huus plündere.","MRK.3.28":"Amen, ich säg s eu: Alles wird de Söhn vo de Mänsche vergää, d Sünde und d Läschterige, so vil si au läschtered.","MRK.3.29":"Wär aber gäge de Heilig Geischt läschteret, hät i Ewigkeit kei Vergäbig, sondern isch schuldig a nere ewige Sünd.»","MRK.3.30":"Si händ nämli gseit: «Er hät en unreine Geischt.»","MRK.3.31":"Und sini Mueter und sini Brüeder chömed, und wo si dusse gstande sind, händ si zu ihm gschickt und en la rüefe.","MRK.3.32":"Und e Mängi isch um en ume gsässe, und si säged zu ihm: «Lueg, dini Mueter und dini Brüeder sind dusse und sueched dich.»","MRK.3.33":"Und er git ine zur Antwort: «Wär isch mini Mueter, und wär sind mini Brüeder?»","MRK.3.34":"Und er luegt die aa, wo im Chreis um en ume sitzed, und seit: «Lueg, mini Mueter und mini Brüeder!","MRK.3.35":"Dänn wär de Wile vo Gott tuet, dä isch min Brueder und mini Schwöschter und mini Mueter.»"},"source":{"MRK.3.20":"TRANS-MRK-003-020-035-GSW-ZH-WORKING","MRK.3.21":"TRANS-MRK-003-020-035-GSW-ZH-WORKING","MRK.3.22":"TRANS-MRK-003-020-035-GSW-ZH-WORKING","MRK.3.23":"TRANS-MRK-003-020-035-GSW-ZH-WORKING","MRK.3.24":"TRANS-MRK-003-020-035-GSW-ZH-WORKING","MRK.3.25":"TRANS-MRK-003-020-035-GSW-ZH-WORKING","MRK.3.26":"TRANS-MRK-003-020-035-GSW-ZH-WORKING","MRK.3.27":"TRANS-MRK-003-020-035-GSW-ZH-WORKING","MRK.3.28":"TRANS-MRK-003-020-035-GSW-ZH-WORKING","MRK.3.29":"TRANS-MRK-003-020-035-GSW-ZH-WORKING","MRK.3.30":"TRANS-MRK-003-020-035-GSW-ZH-WORKING","MRK.3.31":"TRANS-MRK-003-020-035-GSW-ZH-WORKING","MRK.3.32":"TRANS-MRK-003-020-035-GSW-ZH-WORKING","MRK.3.33":"TRANS-MRK-003-020-035-GSW-ZH-WORKING","MRK.3.34":"TRANS-MRK-003-020-035-GSW-ZH-WORKING","MRK.3.35":"TRANS-MRK-003-020-035-GSW-ZH-WORKING"},"decisions":{"MRK.3.20":[{"target":"d Mängi","kind":"literal","grc":"ὄχλος","other_options":["d Lüüt"],"note":"ὄχλος «Volksmenge»."}],"MRK.3.21":[{"target":"sini Lüüt","kind":"interpretive","grc":"οἱ παρʼ αὐτοῦ","more_literal":"die vo ihm","other_options":["sini Aaghörige","sini Familie"],"note":"Wörtlich «die von ihm her»; meist die Angehörigen, möglich auch weiter «seine Leute»."},{"target":"zum en feschthebe","kind":"literal","grc":"κρατῆσαι αὐτόν","other_options":["zum en hole"],"note":"κρατέω «ergreifen, festhalten»."},{"target":"Er isch nüme bi Troscht","kind":"adapted","grc":"ἐξέστη","more_literal":"Er isch usser sich","other_options":["Er isch vo Sinne","Er spinnt"],"note":"ἐξίστημι «ausser sich sein»; die Mundart-Wendung trifft den Sinn, ist aber freier als das Hochdeutsche."}],"MRK.3.22":[{"target":"de Herrscher vo de Dämone","kind":"literal","grc":"τῷ ἄρχοντι τῶν δαιμονίων","other_options":["de Oberscht vo de Dämone","de Fürscht vo de Dämone"]}],"MRK.3.23":[{"target":"i Gliichnis","kind":"literal","grc":"ἐν παραβολαῖς","other_options":["i Bilder"],"note":"παραβολή auch «Bildwort, Rätselwort»."}],"MRK.3.25":[{"target":"wird das Huus nöd chöne bestaa","kind":"literal","grc":"οὐ δυνήσεται ἡ οἰκία ἐκείνη σταθῆναι","note":"Futur wie im SBLGNT."}],"MRK.3.26":[{"target":"gspalte worde isch","kind":"literal","grc":"ἐμερίσθη","note":"Aorist als Ereignis."}],"MRK.3.28":[{"target":"de Söhn vo de Mänsche","kind":"literal","grc":"τοῖς υἱοῖς τῶν ἀνθρώπων","other_options":["de Mänsche"],"note":"Hebraisierende Wendung für «die Menschen»; wörtlich belassen."}],"MRK.3.29":[{"target":"hät i Ewigkeit kei Vergäbig","kind":"literal","grc":"οὐκ ἔχει ἄφεσιν εἰς τὸν αἰῶνα","other_options":["hät nie Vergäbig"]},{"target":"isch schuldig a nere ewige Sünd","kind":"literal","grc":"ἔνοχός ἐστιν αἰωνίου ἁμαρτήματος","note":"ἁμάρτημα «Verfehlung, Sünde»; RP liest κρίσεως «Gericht»."}],"MRK.3.31":[{"target":"en la rüefe","kind":"literal","grc":"καλοῦντες αὐτόν","note":"Partizip «ihn rufend» als «ihn rufen lassen»."}],"MRK.3.33":[{"target":"git ine zur Antwort","kind":"adapted","grc":"ἀποκριθεὶς αὐτοῖς λέγει","more_literal":"antwortet ine und seit","note":"Partizip und Verb zusammengezogen."}],"MRK.3.35":[{"target":"de Wile vo Gott","kind":"literal","grc":"τὸ θέλημα τοῦ θεοῦ","note":"Mundart hat keinen Genitiv: «vo Gott»."}]},"alternatives":[{"ref":"MRK.3.20","from":"Und er chunnt i es Huus","to":"Und si chömed i es Huus","effect":"bedeutsam","note":"Jesus allein oder mit seinen Jüngern.","variant":"VAR-SBLGNTAPP-MRK-003-020-01","support":1,"base_support":4,"of":5,"basis":"editions"},{"ref":"MRK.3.25","from":"wird das Huus nöd chöne bestaa","to":"cha das Huus nöd bestaa","effect":"gering","note":"Nur die Zeitform ändert sich.","variant":"VAR-SBLGNTAPP-MRK-003-025-01","support":1,"base_support":4,"of":5,"basis":"editions"},{"ref":"MRK.3.26","from":"gspalte worde isch","to":"gspalte isch","effect":"gering","note":"Ereignis oder Zustand.","variant":"VAR-SBLGNTAPP-MRK-003-026-01","support":2,"base_support":3,"of":5,"basis":"editions"},{"ref":"MRK.3.29","from":"schuldig a nere ewige Sünd","to":"em ewige Gricht verfalle","effect":"bedeutsam","note":"Bleibende Schuld oder Urteil Gottes.","variant":"VAR-SBLGNTAPP-MRK-003-029-01","support":1,"base_support":4,"of":5,"basis":"editions"},{"ref":"MRK.3.29","from":"isch schuldig a nere ewige Sünd","to":"wird schuldig sii a nere ewige Sünd","effect":"gering","note":"Gegenwart oder Zukunft; berichtete Handschriften, ungeprüft.","variant":"VAR-MRK-003-029-002","support":null,"base_support":null,"of":null,"basis":"manuscripts_reported"},{"ref":"MRK.3.32","from":"dini Mueter und dini Brüeder sind dusse","to":"dini Mueter und dini Brüeder und dini Schwöschtere sind dusse","effect":"bedeutsam","note":"Einige Ausgaben nennen auch die Schwestern.","variant":"VAR-SBLGNTAPP-MRK-003-032-03","support":2,"base_support":3,"of":5,"basis":"editions"}]},"alts":{"VAR-SBLGNTAPP-MRK-003-020-01":{"words":{"R1":[{"grc":"ἔρχεται","text":"er chunnt","note":"Einzaal, Gägewart"}],"R2":[{"grc":"ἔρχονται","text":"si chömed","note":"Meerzaal, Gägewart"}]},"origin":["D Meerzaal chönnt entstande sii, wil churz vorhär di zwölf Jünger ufzellt wärded ([[MRK.3.13-MRK.3.19]]): En Schriiber hät a de Jesus mit sine Jünger dänkt.","Umgekeert chönnt d Einzaal e Vereifachig sii, wo de Jesus als Hauptperson i d Mitti stellt.","Im gliiche Värs staat nachhär sowiso «si» i de Meerzaal («so dass si nöd emal händ chöne Broot ässe»); de Underschid betrifft nu, wär usdrückli is Huus chunnt."],"related":[]},"VAR-SBLGNTAPP-MRK-003-025-01":{"words":{"R1":[{"grc":"δυνήσεται","text":"wird chöne","note":"Zuekunft"}],"R2":[{"grc":"δύναται","text":"cha","note":"Gägewart"}]},"origin":["I [[MRK.3.24]] und [[MRK.3.26]] staat jewiils «cha» i de Gägewart. Schriiber chönnted [[MRK.3.25]] dra aaglichet haa.","Gnau so dänkbar isch, dass d Zuekunftsform e stilistischi Abwächslig isch, wo spööter glättet worde isch, oder umgekeert."],"related":[]},"VAR-SBLGNTAPP-MRK-003-026-01":{"words":{"R1":[{"grc":"ἐμερίσθη","text":"isch gspalte worde","note":"Aorist: abgschlossnes Ereignis"}],"R2":[{"grc":"μεμέρισται","text":"isch gspalte","note":"Perfekt: aaduurende Zuestand"}]},"origin":["D Parallelstell [[MAT.12.26]] hät «isch gspalte worde» (ἐμερίσθη). Die Form chönnt drum us em Matthäus übernaa sii.","Umgekeert chönnt «isch gspalte» e sprachlichi Glättig sii, wil de Zuestand im Satz wichtiger isch als s Ereignis.","Für de Sinn macht de Underschid wenig us."],"related":[]},"VAR-SBLGNTAPP-MRK-003-029-01":{"words":{"R1":[{"grc":"ἁμαρτήματος","text":"ere Verfäälig, Sünd","note":"ἁμάρτημα: einzelni Tat; im Nöie Teschtamänt sälte (im kritische Text nu [[MRK.3.28-MRK.3.29]]; [[ROM.3.25]]; [[1CO.6.18]]; im byzantinische Text au [[MRK.4.12]])"}],"R2":[{"grc":"κρίσεως","text":"eme Gricht, Urteil","note":"κρίσις: Gricht, Entscheidig"}],"VAR-MRK-003-029-001:R3":[{"grc":"ἁμαρτίας","text":"ere Sünd","note":"ἁμαρτία: s gläufige Wort für Sünd"}]},"origin":["Vili Textforscher halted s sälte «ewigi Sünd» (ἁμαρτήματος) für ursprünglich: Schriiber händ de ungwöhnlich Usdruck eher dur s gläufigere Wort (ἁμαρτίας) oder dur di liecht verständlich Vorstellig vo eme ewige Gricht (κρίσεως) ersetzt als umgekeert.","Wär em Text vo de Meerheit vo de spöötere Handschrifte de Vorzug git, haltet «ewigs Gricht» für ursprünglich; die Läsart isch i vilne byzantinische Handschrifte verbreitet.","Di dritt Form «ewigi Sünd» mit em hüüfige Wort ἁμαρτία staat i meerere alte Handschrifte und liit sprachlich zwüsche de beide andere."],"related":["VAR-MRK-003-029-001"]},"VAR-MRK-003-029-002":{"words":{"R1":[{"grc":"ἐστιν","text":"isch","note":"Gägewart"}],"R2":[{"grc":"ἔσται","text":"wird sii","note":"Zuekunft"}]},"origin":["D Zuekunftsform chönnt a s vorusgaande «hät i Ewigkeit kei Vergäbig» und a de Gedanke a es chünftigs Gricht aagleent sii.","Gnau so chönnt d Gägewart e Aagliichig a de übliche Sprachgebruuch sii. Beidi Forme stönd i seer alte Handschrifte."],"related":[]},"VAR-SBLGNTAPP-MRK-003-032-03":{"words":{"R1":[{"grc":"σου","text":"ohni Zuesatz","note":"De Satz hört mit «dini Brüeder» uf."}],"R2":[{"grc":"καὶ αἱ ἀδελφαί σου","text":"und dini Schwöschtere","note":"Zuesatz"}]},"origin":["En Schriiber cha d Schwöschtere us [[MRK.3.35]] («Brueder, Schwöschter und Mueter») da ergänzt haa.","Umgekeert chönd si us Versee usgfalle sii: Beidi Wortgruppe höred uf «σου» (dini) uf. Springt s Aug vom erschte zum zweite «σου», fallt «und dini Schwöschtere» wägg; das passiert bim Abschriibe hüüfig.","Au e bewussti Aagliichig a [[MRK.3.31]] und [[MRK.3.34]] und a de Matthäus und de Lukas, wo da kei Schwöschtere nänned, isch dänkbar."],"related":[]}},"i18n":{"FIND-MRK-0001":{"claim":"[[MRK.3.30]] begründet d Warnig vom Jesus demit, dass d Schriftgleerte gseit händ, er heig en unreine Geischt."},"FIND-MRK-0002":{"claim":"D Red verbindt de Beelzebul-Vorwurf mit de Antwort vom Jesus über de Satan und d Läschterig vom Heilige Geischt."},"FIND-MRK-0003":{"claim":"De Schluss vo [[MRK.3.29]] isch i verschidene Läsarte überliferet (Sünd/Gricht).","caveat":"D Variante sind us de bisherige Vorarbet bekannt; d Zuordnig vo de Züüge mues no a de Primärquelle prüeft wärde."},"FIND-MRK-0004":{"claim":"[[MRK.3.22]] nännt de Vorwurf; [[MRK.3.23-MRK.3.27]] enthaltet d Gägenargumänt vom Jesus und [[MRK.3.28-MRK.3.30]] d Warnig samt Begründig."},"FIND-MRK-0005":{"claim":"I [[MRK.3.21]] mached sich d Aaghörige vom Jesus (οἱ παρʼ αὐτοῦ) uf, zum en hole; i [[MRK.3.31]] chömed sini Mueter und sini Brüeder aa. Dezwüsche staat d Usenandersetzig mit de Schriftgleerte us Jerusalem ([[MRK.3.22-MRK.3.30]]).","caveat":"Beobachtig am Wortluut; öb οἱ παρʼ αὐτοῦ die gliiche Lüüt sind wie d Mueter und d Brüeder i [[MRK.3.31]], seit de Text nöd usdrückli."},"INT-MRK-0001":{"claim":"D Warnig bezieht sich im Verzellzämehang druf, dass s befreiende Wirke vom Jesus ere unreine Macht zuegschribe wird.","caveat":"De Text seit nöd usdrückli, dass d Schriftgleerte di göttlich Herkunft sicher erkännt händ."},"INT-MRK-0002":{"claim":"D Warnig cha me stercher als Beschriibig vo ere duurhafte Verhertig läse; d Duurhaftigkeit laat sich aber nöd elei us de Värbform bewiise."},"INT-MRK-0003":{"claim":"De Markus verschachtlet die zwei Szene bewusst: Aaghörigi («er isch nüme bi Troscht», [[MRK.3.21]]) und Schriftgleerti («er hät de Beelzebul», [[MRK.3.22]]) beurteiled de Jesus jede uf sini Art falsch. [[MRK.3.35]] bestimmt d Zueghörigkeit zum Jesus nöi über s Tue vom Wile vo Gott.","caveat":"Öb οἱ παρʼ αὐτοῦ i [[MRK.3.21]] d Familie vom Jesus meint (so di meischte Übersetzige) oder allgemeiner sini Lüüt, isch umstritte; gnau so, wär i [[MRK.3.21]] «si händ gseit» redt (d Aaghörige oder unbestimmt «me»). Je nach Entscheidig wird d Parallele schwächer.","counter":["D Verschachtelig cha au verzellerisch d Ziit überbrugge, bis d Aaghörige aachömed, ohni dass e Vergliich beabsichtigt isch."]},"PRIN-MRK-0001":{"text":"Behauptige über s Wirke vo Gott mues me verantwortigsvoll beurteile; s bewusste Verdrääje vo Guet und Böös isch nöd s Gliiche wie gwöhnliche Zwiifel."},"APP-MRK-0001":{"text":"E behaupteti Geischteswirkig dörf me kritisch prüefe; das isch nöd automatisch Läschterig vom Heilige Geischt.","limits":"Hüttigi religiösi Behauptige cha me nöd eifach so mit em Wirke vom Jesus im Markus gliichsetze."},"QUESTION-MRK-0001":{"q":"Setzt de Vorwurf vo de Schriftgleerte vorus, dass si s Wirke vom Heilige Geischt bewusst als söttigs erkännt händ?","finding":"[[MRK.3.22-MRK.3.30]] belait d Zueschriibig a de Beelzebul, nöd usdrückli s innere Wüsse vo dene, wo reded."},"BG-MRK-0001":{"topic":"Ziit und Ort","text":"D Szene spilt um s Jaar 30 im Galiläa, im Norde vom Land. Dört hät de Herodes Antipas als vo Rom abhängige Fürscht regiert; Jerusalem mit em Tämpel isch im Judäa gläge, wo en römische Statthalter verwaltet hät. D Lüüt im Galiläa händ im Alltag Aramäisch gredt, händ meischtens vo Landwirtschaft, Handwärch und Fischerei gläbt und sind i Dorf und Groossfamilie iibunde gsii.","uncertain":"S gnaue Jaar isch nöd bekannt."},"BG-MRK-0002":{"topic":"Für wän de Markus gschribe hät","text":"De Markus verzellt die Ereignis es paar Jaarzäänt spööter uf Griechisch. Sini Läser händ jüdischi Brüüch offebar nöd alli kännt, dänn er erkläärt si a andere Stell ([[MRK.7.3-MRK.7.4]]). Wär d Szene list, sött also zwei Ziite im Blick haa: d Situation um de Jesus und d Frage vo de erschte chrischtliche Gmeinde, für wo de Markus verzellt.","uncertain":"Ort und Ziitpunkt, wo s gschribe worde isch, sind umstritte."},"BG-MRK-0003":{"topic":"Es volls Huus","text":"Hüüser im Galiläa sind meischtens eifach gsii: es paar Rüüm us Basaltstei um en offne Hof, wo me kochet und gschaffet hät. Scho es paar Dotzed Lüüt händ Huus und Iigang gfüllt. Im Kafarnaum, wo de Jesus nach em Markus gwont hät, sind söttigi Wonhüüser usgrabe worde.","uncertain":"Öb s Huus da im Kafarnaum staat und wem s ghört, seit de Text nöd."},"BG-MRK-0004":{"topic":"Familie und Ruef","text":"D Familie isch dozmal nöd Privatsach gsii, sondern di wichtigscht Läbes- und Schutzgmeinschaft. Was eis Mitglid taa hät, isch uf alli zruggfalle. Wänn öpper für «nüme bi Troscht» ghalte worde isch, isch es d Ufgab vo de Aaghörige gsii, en hei z hole. Verwirrtheit hät me oft mit eme bööse Geischt i Verbindig bracht.","uncertain":"Wär mit «sini Lüüt» gmeint isch, isch umstritte (lueg «Wie cha me s verstaa?»).","terms":["die vo ihm her, sini Aaghörige","er isch nüme bi Troscht"]},"BG-MRK-0005":{"topic":"Schriftgleerti us Jerusalem","text":"Schriftgleerti sind Känner und Leerer vo de heilige Schrifte und vom Gsetz gsii. Jerusalem mit em Tämpel isch s religiöse Zentrum gsii. Bis is Galiläa sind s öppe 120 Kilometer gsii, meereri Taag z Fuess. Dass Schriftgleerti vo dört chömed, zeigt: Was de Jesus macht, beschäftiget me au im Zentrum.","uncertain":"Öb si im Uftrag vo ere Behörde choo sind, isch offe.","terms":["Schriftgleerti"]},"BG-MRK-0006":{"topic":"Beelzebul","text":"De Name erinneret a «Baal-Sebub», en Gott vo de Philischterstadt Ekron ([[2KI.1.2]]). «Baal» heisst «Herr»; «Sebub» bedüütet «Flüüge», was wahrschiinli e spöttisch verdrääjte Name isch. «Sebul» cha «Wonig» oder «erhabeni Wonig» heisse. Zur Ziit vom Jesus hät de Name de Aafüerer vo de bööse Geischter bezeichnet. D Düütig «Herr vom Huus» wür zu de Bilder vom Huus i [[MRK.3.25-MRK.3.27]] passe; au [[MAT.10.25]] spilt mit «Huusherr» und «Beelzebul».","uncertain":"Herkunft und Bedüütig vom Name sind nöd sicher kläärt.","terms":["Beelzebul","Herr vo de Flüüge ([[2KI.1.2]])","Wonig, erhabeni Wonig"]},"BG-MRK-0007":{"topic":"Geischter ustriibe","text":"Dass me böösi Geischter cha ustriibe, hät me dozmal allgemein aagnaa; au anderi jüdischi Heiler händ das gmacht. De jüdisch Gschichtsschriiber Josephus verzellt vo eme Eleazar, wo vor em spöötere Kaiser Vespasian mit Formle, wo me uf de Chünig Salomo zruggfüert hät, en Dämon ustribe hät. D Gägner bestriited im Text au nöd, dass de Jesus Geischter ustribt; si fraged, us welere Macht er s macht. De Vorwurf, de Jesus seig en Zauberer gsii, findt me spööter au bi jüdische und andere Gägner vom Chrischtetum.","terms":["usewärfe, ustriibe"]},"BG-MRK-0008":{"topic":"De Starch binde","text":"S Bild vom Starche, wo me sini Büüti wägnimmt, erinneret a [[ISA.49.24-ISA.49.25]]: Gott sälber nimmt em Starche d Gfangene ab. I jüdische Schrifte vo dere Ziit wärded böösi Mächt «bunde», etwa im Buech Tobit ([[TOB.8.3]]) oder im äthiopische Henochbuech (10,4). Zuehörer händ s Bild drum als Hiiwiis chöne verstaa, dass Gottes Sieg über s Bööse aafaat.","uncertain":"Wie wiit de Jesus und de Markus a die Text dänkt händ, isch e Düütig, kei Befund.","terms":["starch; de Starch","binde"]},"BG-MRK-0009":{"topic":"«Amen» am Aafang","text":"«Amen» heisst «so isch es, es gilt». Im Gottesdienscht isch es d Antwort vo de Gmeind uf es Gebät oder en Säge gsii ([[DEU.27.15-DEU.27.26]]; [[NEH.8.6]]). De Jesus setzt s degäge a de Aafang vo sine Wort. Die ungwöhnlich Redwiis isch i de Evangelie typisch für ihn und understriicht, was folgt.","terms":["so isch es, es gilt","Amen"]},"BG-MRK-0010":{"topic":"Läschterig","text":"Läschterig hät bedüütet, verächtlich gäge Gott oder Heiligs z rede; nach em Gsetz isch d Läschterig vom Gottesname es schwärs Vergää gsii ([[LEV.24.15-LEV.24.16]]). Bekannt isch au d Underscheidig gsii zwüsche Versee und Sünd «mit erhobener Hand», also bewusster Uflenig, für wo s kei Opfer gää hät ([[NUM.15.30-NUM.15.31]]). Vor dem Hintergrund fallt uf, wie wiit de Jesus d Vergäbig fasst: Alli Läschterige vo de Mänsche chönd vergää wärde, mit einere Usnaam.","uncertain":"Öb de Jesus bewusst a Num 15 aaknüpft, isch offe.","terms":["Läschterig"]},"BG-MRK-0011":{"topic":"D Brüeder vom Jesus","text":"De Markus nännt a anderer Stell vier Brüeder, Jakobus, Joses, Judas und Simon, und Schwöschtere ([[MRK.6.3]]). Wie si mit em Jesus verwandt sind, wird i de Chile sit em 4. Jaarhundert verschide verstande: als jüngeri Chind vo de Maria und em Josef, als Chind vom Josef us ere früenere Ehe oder als Cousins. S griechische Wort für «Brueder» cha au wiiteri Verwandti meine. De Josef wird nöd erwäänt; vili vermueted, dass er scho gstorbe gsii isch.","uncertain":"D Verwandtschaftsfrag isch zwüsche de Konfessione umstritte; de Text sälber entscheidet si nöd.","terms":["Brueder, au Verwandte"]},"BG-MRK-0012":{"topic":"Dine sitze, dusse staa","text":"Um en Leerer ume z sitze isch d Haltig vo Schüeler gsii (vgl. [[LUK.10.39]]; [[ACT.22.3]]). En früeje jüdische Spruch raatet: «Setz dich i de Staub vo irne Füess», gmeint sind d Leerer. D Familie degäge staat dusse und laat en rüefe. In ere Kultur, wo d Familie Aaspruch uf iri Mitglider gha hät, isch das e starchi Bitt gsii."},"BG-MRK-0013":{"topic":"E nöii Familie","text":"Wil d Familie Läbesgrundlag, Altersvorsorg und Eer bedüütet hät, isch es uffällig gsii, Mänsche usserhalb vo de Verwandtschaft «Mueter» und «Brüeder» z nänne. Gliichziitig hät s Gebot golte, d Eltere z eere ([[EXO.20.12]]). De Markus chunnt spööter druf zrugg: Wär wäge em Jesus d Familie verlaat, überchunnt e nöii Gmeinschaft ([[MRK.10.29-MRK.10.30]]). Für di erschte Gmeinde, wo mängi wäge irem Glaube mit de eigene Familie broche händ, isch das wichtig gsii.","uncertain":"Wie scharf de Gägesatz zur liibliche Familie gmeint isch, wird verschide beurteilt."}},"name":"l/gsw/MRK","lang":"gsw"},"b/LUK":{"words":[{"id":"TOK-SBLGNT-LUK-011-001-001","ref":"LUK.11.1","n":1,"text":"Καὶ","word":"Καὶ","mac":{"lemma":"καί","pos":"conj","gloss_berean":"And","gloss_cherith_en":"now","morph":"CONJ"},"freq":1468},{"id":"TOK-SBLGNT-LUK-011-001-002","ref":"LUK.11.1","n":2,"text":"ἐγένετο","word":"ἐγένετο","mac":{"lemma":"γίνομαι","pos":"verb","person":"third","number":"singular","tense":"aorist","voice":"middle","mood":"indicative","role":"v","gloss_berean":"it came to pass","gloss_cherith_en":"happened","morph":"V-2ADI-3S"},"freq":129},{"id":"TOK-SBLGNT-LUK-011-001-003","ref":"LUK.11.1","n":3,"text":"ἐν","word":"ἐν","mac":{"lemma":"ἐν","pos":"prep","gloss_berean":"in","gloss_cherith_en":"while","morph":"PREP"},"freq":359},{"id":"TOK-SBLGNT-LUK-011-001-004","ref":"LUK.11.1","n":4,"text":"τῷ","word":"τῷ","mac":{"lemma":"ὁ","pos":"det","number":"singular","gender":"neuter","case":"dative","gloss_berean":"-","gloss_cherith_en":"*","morph":"T-DSN"},"freq":2640},{"id":"TOK-SBLGNT-LUK-011-001-005","ref":"LUK.11.1","n":5,"text":"εἶναι","word":"εἶναι","mac":{"lemma":"εἰμί","pos":"verb","tense":"present","voice":"active","mood":"infinitive","gloss_berean":"being","gloss_cherith_en":"was","m 01","ref":"MAT.6.15","level":"edition_apparatus","readings":[{"id":"R1","text":"ἀνθρώποις","editions":["ED-NA28"],"witnesses":[]},{"id":"R2","text":"+ τὰ παραπτώματα αὐτῶν","editions":["ED-WH","ED-TREG","ED-RP"],"witnesses":[]}],"note":"Vergleich gedruckter Editionen laut SBLGNT-Apparat; keine Handschriftenbelege.","assessment":[{"reading":"R1","support":2,"of":5,"level":"geteilt","editions":["ED-SBLGNT","ED-NA28"]},{"reading":"R2","support":3,"of":5,"level":"mehrheitlich","editions":["ED-WH","ED-TREG","ED-RP"]}]}],"findings":[{"id":"FIND-LP-0001","claim":"Nach der Anrede folgen bei Matthäus drei Bitten mit «dein» (Name, Reich, Wille) und danach vier Bitten mit «uns» bzw. «unser» (Brot, Schulden, Versuchung, Rettung).","kind":"literary_structure","confidence":"high","subject":"TU-MAT-006-009-013","caveat":"Beobachtung am Wortlaut; die Zählung der Bitten (sechs oder sieben) wird in der Tradition unterschiedlich gehandhabt."},{"id":"FIND-LP-0003","claim":"Das griechische Wort, das meist mit «täglich» übersetzt wird (ἐπιούσιος), kommt im Neuen Testament nur im Vaterunser vor ([[MAT.6.11]]; [[LUK.11.3]]). Origenes bemerkte im 3. Jahrhundert, es sei bei den Griechen sonst nicht gebräuchlich.","kind":"lexical","confidence":"high","subject":"TU-MAT-006-009-013","caveat":"Origenes, Über das Gebet 27,7; spätere Funde einzelner Belege sind umstritten. Darum ist die Bedeutung unsicher."},{"id":"FIND-LP-0004","claim":"Von allen Bitten des Vaterunsers greift Matthäus nur die Bitte um Vergebung im Anschluss noch einmal auf ([[MAT.6.14-MAT.6.15]]).","kind":"literary_structure","confidence":"high","subject":"TU-MAT-006-005-015","caveat":"Beobachtung am Wortlaut."},{"id":"FIND-LP-0005","claim":"Der Lobpreis «Denn dein ist das Reich…» fehlt bei Matthäus in den ältesten erhaltenen Handschriften (Sinaiticus, Vaticanus, Bezae) und steht im Washingtonianus (4./5. Jh.) sowie in der Mehrheit der späteren Handschriften.","kind":"textual","confidence":"high","subject":"TU-MAT-006-009-013","caveat":"Nach den importierten CNTR-Transkriptionen und der maschinellen Zuordnung (WREAD-CNTR-MAT-006-005-015); nicht am Faksimile geprüft."}],"interpretations":[{"id":"INT-LP-0001","claim":"«Brot für den kommenden Tag»: Das Wort (ἐπιούσιος) wird vom griechischen Ausdruck für «der folgende Tag» (ἡ ἐπιοῦσα ἡμέρα) abgeleitet. Man bittet heute um das Brot für morgen, damit man nicht in Sorge leben muss. Hieronymus berichtet, im Hebräerevangelium stehe hier «mahar» (für morgen).","confidence":"possible","caveat":"Steht in Spannung zu [[MAT.6.34]] («Sorgt nicht für morgen»), wenn man es als Vorsorge versteht.","counter":["Die Bitte «gib uns heute das Brot für morgen» kann gerade das Vertrauen ausdrücken, das [[MAT.6.34]] verlangt: Man legt den nächsten Tag in Gottes Hand.","Die Notiz des Hieronymus bezieht sich auf ein nicht erhaltenes Evangelium und kann eine spätere Rückübersetzung sein."],"subject":"TU-MAT-006-009-013","terms":[{"lang":"grc","word":"ἐπιούσιος","de":"meist «täglich»"},{"lang":"grc","word":"ἡ ἐπιοῦσα ἡμέρα","de":"der folgende Tag"},{"lang":"heb","word":"מָחָר","translit":"machar","de":"morgen"}]},{"id":"INT-LP-0002","claim":"«Das zum Leben nötige Brot»: Das Wort (ἐπιούσιος) wird von «für» (ἐπί) und «Dasein, Lebensunterhalt» (οὐσία) abgeleitet. Man bittet um das, was man zum Leben braucht, nicht um Überfluss (vgl. [[PRO.30.8]]).","confidence":"possible","caveat":"Sprachlich ist diese Wortbildung ungewöhnlich; man würde eine etwas andere Form erwarten (ἐπούσιος).","counter":["Die Tradition «täglich» (lateinisch cotidianum) und das lukanische «Tag für Tag» passen gut zu dieser Bedeutung."],"subject":"TU-MAT-006-009-013","terms":[{"lang":"grc","word":"ἐπιούσιος","de":"meist «täglich»"},{"lang":"grc","word":"οὐσία","de":"Dasein, Lebensunterhalt"}]},{"id":"INT-LP-0003","claim":"«Das Brot der kommenden Welt»: Manche Kirchenväter verstanden das Wort geistlich, als Brot des Gottesreiches oder als Abendmahl; Hieronymus übersetzte in Matthäus mit supersubstantialem («überwesentlich»).","confidence":"possible","caveat":"Diese Deutung liegt weiter vom Alltagsbrot entfernt, an das die Zuhörer Jesu zuerst gedacht haben dürften.","counter":["Die Bitte um das Reich ([[MAT.6.10]]) und Jesu Mahlgemeinschaften verbinden Alltagsbrot und erwartetes Festmahl; beides muss sich nicht ausschliessen."],"subject":"TU-MAT-006-009-013","terms":[{"lang":"grc","word":"ἐπιούσιος","de":"meist «täglich»"},{"lang":"lat","word":"supersubstantialem","translit":"supersubstantialem","de":"überwesentlich"}]},{"id":"INT-LP-0004","claim":"«Führe uns nicht in Versuchung» bittet darum, nicht in eine Prüfung zu geraten, in der man den Glauben verliert. Viele denken dabei an die grosse Bedrängnis der Endzeit, andere an alltägliche Versuchungen.","confidence":"probable","caveat":"Ob Gott selbst als der gedacht ist, der in Versuchung führt, ist umstritten; [[JAS.1.13]] sagt, Gott versuche niemanden.","counter":["Das Griechische ist eine Bitte an Gott und setzt voraus, dass auch Prüfungen in seiner Hand liegen (vgl. [[GEN.22.1]]). Die Bitte widerspricht [[JAS.1.13]] nicht, wenn man «Prüfung» und «Verführung zum Bösen» unterscheidet.","Einige Kirchen haben die Formulierung in jüngerer Zeit geändert (z. B. Frankreich 2017: «lass uns nicht in Versuchung eintreten»; Italien 2020: «überlass uns nicht der Versuchung»), andere, etwa die deutschsprachigen katholischen Bistümer 2018, haben sie beibehalten."],"subject":"TU-MAT-006-009-013","terms":[{"lang":"grc","word":"πειρασμός","de":"Versuchung, Prüfung"},{"lang":"grc","word":"εἰσφέρω","de":"hineinbringen"}]},{"id":"INT-LP-0005","claim":"Die Bitte um Vergebung ist bei Matthäus mit der eigenen Bereitschaft zu vergeben verknüpft: Wer selbst nicht vergibt, verschliesst sich der Vergebung Gottes ([[MAT.6.14-MAT.6.15]]; vgl. [[MAT.18.23-MAT.18.35]]).","confidence":"probable","caveat":"Ob die eigene Vergebung Bedingung oder Folge der empfangenen Vergebung ist, wird unterschiedlich gesehen.","counter":["Im Gleichnis [[MAT.18.23-MAT.18.35]] geht die Vergebung des Herrn voraus; die eigene Vergebung ist Antwort darauf, nicht Leistung.","Die Vergangenheitsform «wie wir vergeben haben» ([[MAT.6.12]]) kann als Ausdruck der Bereitschaft verstanden werden, nicht als Vorleistung."],"subject":"TU-MAT-006-005-015","terms":[{"lang":"grc","word":"ἀφίημι","de":"vergeben, erlassen"},{"lang":"grc","word":"ὀφείλημα","de":"Schuld"}]},{"id":"INT-LP-0006","claim":"«Vor dem Bösen» meint den Bösen als Person (den Teufel), wie in [[MAT.13.19]].[[MAT.13.38]].","confidence":"possible","caveat":"Das Griechische lässt «das Böse» (Neutrum) und «der Böse» (Maskulinum) zu; die Kirchen des Ostens beten meist «vor dem Bösen» im persönlichen Sinn, viele westliche Übersetzungen neutral.","counter":["«Das Böse» im allgemeinen Sinn (Unheil, Bosheit) passt ebenso zum Zusammenhang und zu jüdischen Gebeten um Bewahrung vor Bösem."],"subject":"TU-MAT-006-009-013","terms":[{"lang":"grc","word":"πονηρός","de":"böse; der Böse"}]}],"principles":[{"id":"PRIN-LP-0001","text":"Beten nach Jesu Anleitung beginnt mit vertrauensvoller Anrede Gottes und mit Gottes Sache und bringt dann die eigenen Grundbedürfnisse vor: Brot, Vergebung und Bewahrung. Empfangene und gewährte Vergebung gehören zusammen.","confidence":"probable","subject":"TU-MAT-006-009-013"}],"applications":[{"id":"APP-LP-0001","text":"Wer das Vaterunser heute betet, kann es langsam beten und bei einzelnen Bitten innehalten: Wo brauche ich wirklich «Brot für heute»? Wem muss ich noch vergeben? In einem Land mit Überfluss kann die Brotbitte auch an die erinnern, denen das Nötige fehlt, denn sie heisst «unser» Brot, nicht «mein» Brot.","limits":"Das ist eine heutige Übertragung, kein Befund am Text. Das Vaterunser wurde in seiner Zeit von Menschen gebetet, für die das tägliche Brot oft unsicher war; das lässt sich nicht einfach auf heutige Lebensverhältnisse übertragen.","subject":"TU-MAT-006-009-013","context":"Deutschsprachige heutige Bibellesende","confidence":"possible"}],"questions":[{"id":"QUESTION-LP-0001","q":"Was bedeutet ἐπιούσιος genau: «täglich», «für den kommenden Tag», «zum Leben nötig» oder etwas anderes?","finding":"Das Wort ist ausserhalb des Vaterunsers praktisch nicht belegt; die Deutungen stützen sich auf Wortbildung, alte Übersetzungen und frühe Ausleger.","subject":"TU-MAT-006-009-013"}],"relations":[{"from":"TU-MAT-006-009-013","from_ref":"MAT.6.9-MAT.6.13","to":"LUK.11.2-LUK.11.4","to_de":"Lk 11,2–4","kind":"parallel_passage","confidence":"high"},{"from":"TU-MAT-006-014-015","from_ref":"MAT.6.14-MAT.6.15","to":"MRK.11.25","to_de":"Mk 11,25","kind":"parallel_saying","confidence":"high"},{"from":"TU-MAT-006-009-013","from_ref":"MAT.6.9-MAT.6.13","to":"MRK.14.36","to_de":"Mk 14,36","kind":"related_prayer","confidence":"probable"},{"from":"TU-MAT-006-009-013","from_ref":"MAT.6.9-MAT.6.13","to":"MAT.26.41","to_de":"Mt 26,41","kind":"related_saying","confidence":"probable"},{"from":"TU-MAT-006-014-015","from_ref":"MAT.6.14-MAT.6.15","to":"MAT.18.21-MAT.18.35","to_de":"Mt 18,21–35","kind":"thematic","confidence":"probable"},{"from":"TU-MAT-006-009-013","from_ref":"MAT.6.9-MAT.6.13","to":"1CH.29.11","to_de":"1 Chr 29,11","kind":"background","confidence":"possible"},{"from":"TU-MAT-006-009-013","from_ref":"MAT.6.9-MAT.6.13","to":"EXO.16.4","to_de":"Ex 16,4","kind":"background","confidence":"possible"}],"bg":[{"id":"BG-LP-0001","topic":"Zwei Fassungen, zwei Leserkreise","text":"Matthäus stellt das Vaterunser in die Bergpredigt, zwischen Anweisungen zu Almosen, Beten und Fasten ([[MAT.6.1-MAT.6.18]]), wie sie für jüdische Frömmigkeit typisch waren. Lukas erzählt, dass ein Jünger Jesus darum bittet, wie Johannes der Täufer seine Jünger beten lehrte. Beide schrieben Jahrzehnte nach Jesus für verschiedene Gemeinden, die das Gebet wohl schon regelmässig beteten.","uncertain":"Ob Jesus das Gebet bei einer oder mehreren Gelegenheiten lehrte, ist offen.","confidence":"probable","subject":"TU-MAT-006-005-015","section":"TU-MAT-006-005-015","wide":true,"chapter":"MAT.6","from":9,"to":13,"ref_de":"Mt 6,9–13","readers":true,"evidence":["Mt 6,1–18","Lk 11,1"],"sources":[],"status":"draft","terms":[]},{"id":"BG-LP-0002","topic":"Beten im Judentum damals","text":"Fromme Juden beteten zu festen Zeiten, oft dreimal am Tag (vgl. [[DAN.6.11]]; [[PSA.55.18]]), dazu das Schma Israel. Wer zur Gebetszeit unterwegs war, betete dort, wo er gerade stand. Jesus kritisiert nicht das Beten in der Öffentlichkeit an sich, sondern das Beten, um gesehen zu werden.","uncertain":"Wie fest die Gebetszeiten und Gebetstexte zur Zeit Jesu schon geregelt waren, ist in der Forschung umstritten.","confidence":"probable","subject":"TU-MAT-006-005-015","section":"TU-MAT-006-005-015","wide":true,"chapter":"MAT.6","from":5,"to":5,"ref_de":"Mt 6,5","readers":false,"evidence":["Dan 6,11","Ps 55,18","Dtn 6,4–9"],"sources":[],"status":"draft","terms":[]},{"id":"BG-LP-0003","topic":"Heuchler, Kammer, Heiden","text":"Das griechische Wort für Heuchler bezeichnete ursprünglich Schauspieler auf der Bühne. Die «Kammer» war ein Vorrats- oder Innenraum, in einfachen Häusern oft der einzige Raum ohne Fenster und mit Tür. In heidnischen Gebeten wurden die Gottheiten mit vielen Namen und Beinamen angerufen, damit man die richtige Anrede traf und erhört wurde (vgl. [[1KI.18.26]]).","uncertain":null,"confidence":"probable","subject":"TU-MAT-006-005-008","section":"TU-MAT-006-005-015","wide":false,"chapter":"MAT.6","from":5,"to":7,"ref_de":"Mt 6,5–7","readers":false,"evidence":["1 Kön 18,26"],"sources":[],"status":"draft","terms":[{"lang":"grc","word":"ὑποκριτής","de":"Schauspieler, Heuchler"},{"lang":"grc","word":"ταμεῖον","de":"Vorratsraum, Kammer"},{"lang":"grc","word":"βατταλογέω","de":"plappern, leere Worte machen"}]},{"id":"BG-LP-0004","topic":"Gott als Vater anreden","text":"Auch die hebräische Bibel und jüdische Gebete nennen Gott Vater ([[ISA.63.16]]; [[ISA.64.7]]; [[SIR.23.1]]). Dass Jesus Gott ganz direkt mit «Vater» anredet, auf Aramäisch «Abba» ([[MRK.14.36]]), und seine Jünger dazu anleitet, wird oft als besonders vertraut beschrieben. Das frühe Christentum hat das aramäische Wort sogar in griechischen Briefen bewahrt ([[ROM.8.15]]; [[GAL.4.6]]).","uncertain":"Die verbreitete Erklärung, «Abba» sei die Kindersprache «Papa», gilt heute als überzogen; das Wort wurde auch von Erwachsenen gegenüber ihrem Vater gebraucht.","confidence":"probable","subject":"TU-MAT-006-009-013","section":"TU-MAT-006-005-015","wide":false,"chapter":"MAT.6","from":9,"to":9,"ref_de":"Mt 6,9","readers":false,"evidence":["Jes 63,16","Mk 14,36","Röm 8,15","Gal 4,6"],"sources":[],"status":"draft","terms":[{"lang":"arc","word":"אַבָּא","translit":"abba","de":"Vater"},{"lang":"grc","word":"πατήρ","de":"Vater"}]},{"id":"BG-LP-0005","topic":"Den Namen heiligen","text":"Der «Name» steht in der Bibel für die Person selbst. Nach [[EZK.36.23]] heiligt Gott seinen Namen, indem er an seinem Volk handelt. Ein jüdisches Gebet, das Kaddisch, beginnt ähnlich: «Erhoben und geheiligt werde sein grosser Name … er lasse sein Reich kommen.»","uncertain":"Das Kaddisch ist in seiner heutigen Form deutlich später belegt; wie alt seine Kernsätze sind, ist umstritten.","confidence":"probable","subject":"TU-MAT-006-009-013","section":"TU-MAT-006-005-015","wide":false,"chapter":"MAT.6","from":9,"to":10,"ref_de":"Mt 6,9–10","readers":false,"evidence":["Ez 36,23"],"sources":[],"status":"draft","terms":[{"lang":"grc","word":"ὄνομα","de":"Name"},{"lang":"grc","word":"ἁγιάζω","de":"heiligen"},{"lang":"arc","word":"קַדִּישׁ","translit":"qaddisch","de":"heilig (Name des Gebets)"}]},{"id":"BG-LP-0006","topic":"Das Reich Gottes","text":"Viele Juden erwarteten, dass Gott seine Herrschaft sichtbar aufrichtet und Unrecht und fremde Herrschaft beendet (vgl. [[DAN.2.44]]). Im Galiläa unter römischer Oberherrschaft war das auch politisch brisant. «Reich Gottes» ist das zentrale Thema der Verkündigung Jesu ([[MRK.1.15]]).","uncertain":null,"confidence":"high","subject":"TU-MAT-006-009-013","section":"TU-MAT-006-005-015","wide":false,"chapter":"MAT.6","from":10,"to":10,"ref_de":"Mt 6,10","readers":false,"evidence":["Dan 2,44","Mk 1,15"],"sources":[],"status":"draft","terms":[{"lang":"grc","word":"βασιλεία","de":"Königsherrschaft, Reich"}]},{"id":"BG-LP-0007","topic":"Brot für den Tag","text":"Viele Menschen lebten von der Hand in den Mund: Tagelöhner erhielten ihren Lohn am Abend und kauften davon das Essen für den nächsten Tag (vgl. [[MAT.20.1-MAT.20.16]]; [[DEU.24.15]]). In der Wüste erhielt Israel das Manna Tag für Tag und durfte keinen Vorrat anlegen ([[EXO.16.4]].[[EXO.16.19-EXO.16.20]]).","uncertain":"Was das griechische Wort für «täglich» genau bedeutet, ist unsicher (siehe Deutungen).","confidence":"probable","subject":"TU-MAT-006-009-013","section":"TU-MAT-006-005-015","wide":false,"chapter":"MAT.6","from":11,"to":11,"ref_de":"Mt 6,11","readers":false,"evidence":["Mt 20,1–16","Dtn 24,15","Ex 16,4"],"sources":["Origenes, Über das Gebet 27,7","Hieronymus, Kommentar zu Matthäus, zu 6,11"],"status":"draft","terms":[{"lang":"grc","word":"ἐπιούσιος","de":"meist «täglich»; Bedeutung unsicher"},{"lang":"heb","word":"מָחָר","translit":"machar","de":"morgen"}]},{"id":"BG-LP-0008","topic":"Schulden und Sünden","text":"Im Aramäischen, das Jesus sprach, bezeichnet dasselbe Wort (ḥôbā) eine Geldschuld und eine Sünde. Verschuldung war in Galiläa verbreitet und konnte bis zur Schuldknechtschaft führen. Das Gesetz kannte einen Schuldenerlass in jedem siebten Jahr ([[DEU.15.1-DEU.15.2]]). Matthäus behält das Bild der Schulden, Lukas sagt «Sünden», spricht aber im selben Vers vom Schuldner.","uncertain":null,"confidence":"probable","subject":"TU-MAT-006-009-013","section":"TU-MAT-006-005-015","wide":false,"chapter":"MAT.6","from":12,"to":12,"ref_de":"Mt 6,12","readers":false,"evidence":["Dtn 15,1–2","Mt 18,23–35","Lk 11,4"],"sources":[],"status":"draft","terms":[{"lang":"arc","word":"חוֹבָא","translit":"ḥôbā","de":"Schuld, Sünde"},{"lang":"grc","word":"ὀφείλημα","de":"Schuld"}]},{"id":"BG-LP-0009","topic":"Versuchung und Prüfung","text":"Das griechische Wort meint beides: Versuchung zum Bösen und Prüfung der Treue. Die Bibel erzählt von Prüfungen, etwa Abrahams ([[GEN.22.1]]) oder Israels in der Wüste ([[DEU.8.2]]). Viele Juden erwarteten vor dem Kommen des Reiches eine Zeit grosser Bedrängnis.","uncertain":null,"confidence":"probable","subject":"TU-MAT-006-009-013","section":"TU-MAT-006-005-015","wide":false,"chapter":"MAT.6","from":13,"to":13,"ref_de":"Mt 6,13","readers":false,"evidence":["Gen 22,1","Dtn 8,2","Jak 1,13","Mt 26,41"],"sources":[],"status":"draft","terms":[{"lang":"grc","word":"πειρασμός","de":"Versuchung, Prüfung"}]},{"id":"BG-LP-0010","topic":"Der Lobpreis am Schluss","text":"Jüdische Gebete endeten oft mit einem Lobpreis Gottes; ein Vorbild ist das Gebet Davids in [[1CH.29.11]]. Die Didache, eine frühchristliche Gemeindeordnung aus der Zeit um 100, gibt das Vaterunser fast wie Matthäus wieder, mit dem Schluss «denn dein ist die Kraft und die Herrlichkeit in Ewigkeit», und rät, es dreimal täglich zu beten.","uncertain":"Die Datierung der Didache ist umstritten (meist um 100).","confidence":"high","subject":"TU-MAT-006-009-013","section":"TU-MAT-006-005-015","wide":false,"chapter":"MAT.6","from":13,"to":13,"ref_de":"Mt 6,13","readers":true,"evidence":["1 Chr 29,11"],"sources":["Didache 8,2–3"],"status":"draft","terms":[]},{"id":"BG-LP-0011","topic":"Vaterunser auf Amuletten","text":"Aus dem 3. bis 6. Jahrhundert sind mehrere kleine Papyrusblätter und eine Tonscherbe mit dem Vaterunser erhalten, oft als Schutz-Amulett getragen. Sie zeigen, wie verbreitet das Gebet war, und dass einfache Leute es nach Gehör aufschrieben, mit vielen Schreibvarianten.","uncertain":"Die Einordnung als Amulett beruht auf Format und Fundzusammenhang; nicht jedes Stück ist sicher eines.","confidence":"high","subject":"TU-MAT-006-009-013","section":"TU-MAT-006-005-015","wide":false,"chapter":"MAT.6","from":9,"to":13,"ref_de":"Mt 6,9–13","readers":true,"evidence":["Mt 6,9–13"],"sources":["P. Antinoopolis 2.54","P. Oxyrhynchus 60.4010","Vaterunser auf Ton aus Megara (Athen, Nationalmuseum)"],"status":"draft","terms":[]}],"xref":{"MAT.6.1":[["MAT.23.5",59],["JHN.12.43",50],["HEB.6.10",31],["MAT.23.28-MAT.23.30",27],["LUK.16.15",20],["GAL.6.12",15],["MAT.6.4-MAT.6.6",15],["EZK.33.31",13],["JHN.5.44",13],["2JN.1.8",12]],"MAT.6.2":[["MAT.6.5",15],["MAT.6.16",10],["2CO.9.6-2CO.9.15",9],["JAS.2.15-JAS.2.16",9],["JHN.5.41",9],["1JN.3.17-1JN.3.19",7],["HEB.13.16",7],["LUK.20.46",7],["JHN.7.18",6],["1PE.4.11",5]],"MAT.6.3":[["JHN.7.4",14],["MAT.9.30",9],["MRK.1.44",4]],"MAT.6.4":[["MAT.6.18",20],["MAT.6.6",17],["JER.17.10",16],["LUK.14.14",11],["PSA.44.21",10],["MAT.25.34-MAT.25.40",8],["JER.23.24",6],["1SA.2.30",5],["LUK.8.17",5],["PSA.139.1-PSA.139.3",4]],"MAT.6.5":[["MAT.6.2",28],["LUK.18.13",26],["LUK.18.10-LUK.18.11",25],["MRK.11.25",21],["ISA.55.6-ISA.55.7",16],["ISA.1.15",13],["JER.29.12",13],["LUK.20.47",10],["MAT.7.7-MAT.7.8",10],["DAN.6.10",9]],"MAT.6.6":[["2KI.4.33",47],["MAT.14.23",41],["ISA.65.24",32],["ACT.9.40",26],["ISA.26.20",26],["PSA.34.15",26],["MAT.6.18",22],["MAT.26.36-MAT.26.39",18],["ACT.10.9",15],["MAT.6.4",15]],"MAT.6.7":[["ECC.5.2-ECC.5.3",40],["ECC.5.7",20],["1KI.18.26-1KI.18.29",13],["MAT.26.44",9],["MAT.6.32",7],["ACT.19.34",4],["MAT.26.42",4],["1KI.8.26-1KI.8.54",3],["DAN.9.18-DAN.9.19",3],["MAT.18.17",2]],"MAT.6.8":[["MAT.6.32",37],["LUK.12.30",32],["PHP.4.6",28],["JHN.16.23-JHN.16.27",27],["PSA.38.9",17],["PSA.69.17-PSA.69.19",15]],"MAT.6.9":[["LUK.11.1-LUK.11.4",56],["REV.4.11",51],["ROM.8.15",34],["EZK.36.23",26],["MAL.1.11",25],["PSA.111.9",25],["ISA.64.8",24],["ISA.57.15",21],["GAL.4.6",19],["ISA.6.3",19]],"MAT.6.10":[["HEB.10.36",47],["JHN.4.34",41],["MAT.26.42",41],["MAT.12.50",38],["1TH.5.18",36],["ROM.12.2",34],["JHN.6.40",33],["COL.1.9",28],["EPH.6.6",26],["PSA.40.8",26]],"MAT.6.11":[["PRO.30.8",40],["LUK.11.3",32],["MAT.4.4",31],["PSA.
