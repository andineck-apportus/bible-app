const BOOK_SUMMARIES=["Die Erzählung führt von der Schöpfung und den Anfängen der Menschheit zu Abraham und seiner Familie. Verheissung, Vertrauen und Konflikte prägen den Weg, der mit Josef in Ägypten endet.", "Gott befreit Israel aus der Sklaverei in Ägypten. Am Sinai erhält das Volk den Bund und Weisungen für ein gemeinsames Leben; das Heiligtum steht für Gottes Gegenwart in seiner Mitte.", "Opfer, Reinheit und Heiligkeit ordnen das Leben Israels vor Gott. Neben dem Gottesdienst stehen der Umgang mit Mitmenschen, Gerechtigkeit und die Verantwortung für das Land im Mittelpunkt.", "Israel zieht durch die Wüste und erlebt Versorgung, Widerstand und die Folgen fehlenden Vertrauens. Eine neue Generation bereitet sich auf den Einzug in das verheissene Land vor.", "Mose blickt auf den bisherigen Weg zurück und legt Gottes Weisungen für das Leben im Land aus. Israel wird aufgerufen, Gott zu lieben und den Bund auch in Zukunft zu bewahren.", "Unter Josua überschreitet Israel den Jordan, nimmt das Land ein und verteilt es unter die Stämme. Am Ende steht die Aufforderung, Gott treu zu bleiben.", "Auf Abkehr und Bedrängnis folgen immer wieder Rettung und erneutes Scheitern. Die Geschichten der Richter zeigen zugleich eine zunehmende gesellschaftliche und religiöse Zerrüttung.", "Rut bleibt ihrer Schwiegermutter Noomi in Not und Fremde verbunden. Durch ihre Begegnung mit Boas entstehen Schutz, eine neue Familie und eine Verbindung zur späteren Geschichte Davids.", "Samuel begleitet den Übergang zur Königsherrschaft. Saul wird König, verliert aber seine Stellung; David tritt hervor und gerät in einen wachsenden Konflikt mit ihm.", "David wird König über ganz Israel und macht Jerusalem zu seinem Zentrum. Seine Herrschaft umfasst Verheissung und Erfolge, aber auch Schuld, familiäre Gewalt und politische Krisen.", "Salomo baut den Tempel; nach seiner Herrschaft zerfällt das Reich. Die Geschichte der Könige und das Wirken Elias stellen die Treue zu Gott in den Mittelpunkt.", "Die Königsgeschichten führen zum Untergang Israels und Judas sowie ins Exil. Propheten wie Elisa begleiten diese Zeit; politische Macht wird an der Verantwortung vor Gott gemessen.", "Stammbäume verorten Israel in seiner Geschichte. Die Darstellung Davids konzentriert sich besonders auf Gottesdienst, Leviten und die Vorbereitung des Tempelbaus.", "Von Salomos Tempelbau führt die Erzählung durch die Geschichte der Könige Judas bis zum Exil. Erneuerung des Gottesdienstes und Umkehr werden zu wiederkehrenden Schwerpunkten.", "Menschen kehren aus dem Exil zurück und bauen den Tempel wieder auf. Esra lehrt die Tora; die Gemeinschaft ringt um ihre religiöse Identität und ihre Grenzen.", "Nehemia organisiert den Wiederaufbau Jerusalems und begegnet äusserem Widerstand sowie innerer Ungerechtigkeit. Das öffentliche Hören der Tora begleitet die Neuordnung der Gemeinschaft.", "Am persischen Königshof gerät die jüdische Bevölkerung in tödliche Gefahr. Ester und Mordechai handeln gegen Hamans Plan; die Rettung wird zum Hintergrund des Purimfestes.", "Hiob verliert Besitz, Familie und Gesundheit. In Klagen und Streitgesprächen wird die einfache Gleichsetzung von Leiden und Schuld hinterfragt; die Begegnung mit Gott verändert die Perspektive.", "Die Psalmen versammeln Gebete und Lieder aus Freude, Angst, Schuld, Dank und Hoffnung. Persönliche Erfahrungen und die Geschichte Israels werden vor Gott ausgesprochen.", "Kurze Weisheitssprüche und längere Lehrreden fragen nach einem gelingenden Leben. Gottesfurcht, gerechtes Handeln, Sprache, Arbeit und Beziehungen werden aus verschiedenen Blickwinkeln betrachtet.", "Der Prediger prüft Arbeit, Genuss, Weisheit und menschliche Leistung angesichts von Vergänglichkeit und Tod. Die Grenzen menschlicher Verfügung stehen neben dem Aufruf, die gegebenen Freuden anzunehmen.", "Poetische Stimmen erzählen von Sehnsucht, Schönheit und gegenseitiger Liebe. Begegnung, Suche und Freude an der geliebten Person prägen die Sammlung.", "Gericht über Unrecht und Untreue steht neben der Hoffnung auf Rettung und Erneuerung. Das Buch verbindet die Heiligkeit Gottes mit Trost für sein Volk und einer weiten Zukunftsperspektive.", "Jeremia warnt Juda vor den Folgen seines Handelns und erlebt den Zusammenbruch Jerusalems. Neben Klage und Gericht stehen die Verheissung der Rückkehr und eines neuen Bundes.", "Die Zerstörung Jerusalems wird in dichterischen Klagen betrauert. Leid, Schuld und die Frage nach Gottes Nähe werden ohne vorschnelle Auflösung ausgesprochen.", "Hesekiel spricht zu Menschen im Exil und deutet den Verlust Jerusalems. Visionen von neuer Lebenskraft, einem neuen Herzen und erneuerter Gottesgegenwart öffnen einen Zukunftshorizont.", "Erzählungen von Treue unter fremden Herrschern stehen neben Visionen über Reiche, Bedrängnis und Gottes Herrschaft. Menschliche Macht erscheint begrenzt; Hoffnung reicht über sie hinaus.", "Hoseas Ehe wird zum Bild für Israels verletzte Beziehung zu Gott. Gericht und die Kritik an Untreue stehen neben Gottes bleibender Zuwendung und dem Ruf zur Umkehr.", "Eine schwere Plage wird zum Anlass für Klage und Umkehr. Die Erwartung des Tages Gottes verbindet sich mit Wiederherstellung und der Verheissung, Gottes Geist werde ausgegossen.", "Amos kritisiert Ausbeutung, Selbstsicherheit und einen Gottesdienst ohne Gerechtigkeit. Die Gerichtsworte richten sich auch gegen Israel; am Ende steht eine Aussicht auf Wiederherstellung.", "Edom wird wegen seines Verhaltens gegenüber Juda zur Verantwortung gezogen. Das kurze Buch verbindet den Fall menschlichen Hochmuts mit der Erwartung von Gottes Herrschaft.", "Jona flieht vor seinem Auftrag nach Ninive und erlebt Gottes Erbarmen selbst. Als die Stadt umkehrt, muss er sich mit einer Barmherzigkeit auseinandersetzen, die seine eigenen Grenzen überschreitet.", "Micha prangert Machtmissbrauch, Ausbeutung und falsche Sicherheit an. Gerichtsworte stehen neben Bildern von Frieden, einem kommenden Herrscher und einem Leben in Gerechtigkeit und Demut.", "Nahum kündigt den Untergang Ninives an. Die Gewalt der assyrischen Macht wird aus der Perspektive ihres bevorstehenden Endes und der Entlastung ihrer Opfer betrachtet.", "Habakuk fragt Gott nach Unrecht und nach der Gewalt derer, die es bestrafen sollen. Das Gespräch mündet in eine Haltung des Vertrauens trotz anhaltender Bedrängnis.", "Der Tag Gottes erscheint als Gericht über Juda und die Völker. Zugleich eröffnet sich Hoffnung für eine demütige Gemeinschaft, die Zuflucht bei Gott sucht.", "Haggai fordert die Heimgekehrten auf, den Wiederaufbau des Tempels ernst zu nehmen. Ihre Prioritäten werden hinterfragt und mit Gottes Zusage seiner Gegenwart verbunden.", "Visionen und prophetische Worte ermutigen zum Wiederaufbau und zur Erneuerung Jerusalems. Hoffnung auf gerechte Herrschaft und Gottes kommende Nähe reicht über die unmittelbare Situation hinaus.", "Streitgespräche legen nachlässigen Gottesdienst und beschädigte Beziehungen offen. Der Aufruf zur Treue steht neben der Erwartung eines kommenden Boten und des Tages Gottes.", "Matthäus erzählt von Jesus im Zusammenhang der Schriften Israels. Seine Lehre vom Himmelreich, sein Tod und seine Auferstehung führen zum Auftrag, Menschen aus allen Völkern zu Jüngern zu machen.", "Markus schildert Jesu Wirken, seine Vollmacht und den wachsenden Widerstand gegen ihn. Der Weg nach Jerusalem, das Kreuz und die Botschaft vom leeren Grab fordern das Verständnis seiner Identität heraus.", "Lukas betont Gottes Zuwendung zu Armen, Ausgegrenzten und Verlorenen. Jesu Weg nach Jerusalem führt durch Tod und Auferstehung zur Sendung seiner Zeugen.", "Zeichen und ausführliche Gespräche erschliessen Jesu Beziehung zum Vater. Sein Tod und seine Auferstehung werden im Horizont von Leben, Liebe, Glauben und bleibender Gemeinschaft erzählt.", "Die Botschaft von Jesus breitet sich durch das Wirken des Geistes von Jerusalem bis nach Rom aus. Neue Gemeinschaften entstehen und ringen darum, wie Menschen unterschiedlicher Herkunft dazugehören.", "Paulus entfaltet seine Botschaft von Gottes Gerechtigkeit, Glauben und neuem Leben. Die Stellung Israels und das Zusammenleben der Gemeinde gehören zu dieser umfassenden Argumentation.", "Paulus reagiert auf Spaltungen und konkrete Konflikte in Korinth. Liebe, gemeinschaftliche Verantwortung, geistliche Gaben und die Hoffnung auf Auferstehung bilden zentrale Schwerpunkte.", "Paulus erklärt seinen Dienst und sein Verhältnis zur Gemeinde inmitten von Spannungen. Gottes Kraft in menschlicher Schwachheit, Versöhnung und solidarisches Geben prägen den Brief.", "Der Brief verteidigt die Freiheit der Glaubenden gegenüber der Forderung nach Beschneidung. Das Leben aus Glauben und Geist soll in tätiger Liebe Gestalt gewinnen.", "Die Einheit von Menschen aus unterschiedlichen Völkern in Christus steht im Zentrum. Daraus folgen Bilder von Gemeinde und konkrete Weisungen für ein erneuertes Zusammenleben.", "Freude und Verbundenheit prägen den Brief trotz Gefangenschaft und Unsicherheit. Christi Weg der Erniedrigung und Erhöhung dient als Orientierung für Demut und gemeinsames Handeln.", "Christus wird als Mittelpunkt von Schöpfung und Versöhnung dargestellt. Der Brief warnt vor konkurrierenden Bindungen und verbindet das neue Leben mit alltäglichem Verhalten.", "Paulus stärkt eine junge Gemeinde in Bedrängnis und erinnert an die gemeinsame Beziehung. Heiligung, geschwisterliche Liebe und Hoffnung angesichts des Todes werden miteinander verbunden.", "Der Brief ermutigt zu Standhaftigkeit und korrigiert Verunsicherung über den Tag des Herrn. Erwartung der Zukunft soll mit verantwortlichem Leben in der Gegenwart verbunden bleiben.", "Weisungen betreffen Lehre, Gottesdienst und die Verantwortung verschiedener Gruppen in der Gemeinde. Ein glaubwürdiges Leben und der sorgsame Umgang mit Geld erhalten besonderes Gewicht.", "Timotheus wird zu Treue, Ausdauer und verantwortlicher Weitergabe der Botschaft ermutigt. Leiden, Schrift und Verkündigung prägen den persönlichen Ton des Briefes.", "Titus erhält Weisungen zur Ordnung der Gemeinden und zur Auswahl verantwortlicher Personen. Gottes Gnade soll sich in besonnenem Verhalten und guten Werken zeigen.", "Paulus bittet Philemon, Onesimus in neuer Weise aufzunehmen. Die Beziehung zwischen den Beteiligten wird unter dem Vorzeichen gemeinsamer Zugehörigkeit zu Christus angesprochen.", "Jesus wird als Hohepriester und Mittler eines neuen Bundes entfaltet. Die Auslegung der Schriften mündet in Ermutigung zu Vertrauen, Ausdauer und gegenseitiger Unterstützung.", "Glaube soll im Handeln sichtbar werden. Der Brief verbindet den Umgang mit Armen, die Macht der Sprache, Weisheit und Geduld zu einer praktischen Mahnung.", "Menschen in bedrängten Gemeinden werden an ihre Hoffnung und Zugehörigkeit erinnert. Ihr Verhalten soll auch unter Ablehnung von Christus und gegenseitiger Verantwortung geprägt sein.", "Der Brief warnt vor zerstörerischer Lehre und bekräftigt die Erwartung von Gottes kommender Welt. Erkenntnis und Hoffnung sollen mit einem verantwortlichen Leben verbunden bleiben.", "Gottes Licht und Liebe werden zum Massstab des gemeinsamen Lebens. Der Brief verbindet das Bekenntnis zu Jesus mit geschwisterlicher Liebe und der Prüfung irreführender Ansprüche.", "Die kurze Schrift verbindet Wahrheit und gegenseitige Liebe. Sie mahnt zur Unterscheidung gegenüber Lehren, die das Bekenntnis zu Christus untergraben.", "Gastfreundschaft und Unterstützung reisender Glaubensgeschwister werden gewürdigt. Ein Konflikt um Leitung und Anerkennung zeigt zugleich Spannungen innerhalb der Gemeinschaft.", "Judas warnt vor Menschen, deren Verhalten und Lehre die Gemeinschaft gefährden. Die Lesenden sollen im Glauben bleiben und anderen mit Barmherzigkeit und Unterscheidung begegnen.", "Visionen stellen die bedrängten Gemeinden in den Horizont von Gottes Gericht und Erneuerung. Der Sieg des Lammes führt zur Hoffnung auf eine neue Schöpfung und Gottes Wohnen bei den Menschen."];

function sequence(){return `<div class="sequence"><button type="button" data-action="prev" ${!sibling(current,-1)?'disabled':''}>${icon('arrow-left')}${T().prev}</button><button type="button" data-action="next" ${!sibling(current,1)?'disabled':''}>${T().next}${icon('arrow-right')}</button></div>`;}
function summary(n){
if(n.level===0)return 'Die Bibel versammelt Erzählungen, Gebete, Weisheit, prophetische Stimmen und Briefe. In christlicher Lesart verbindet sie die Geschichte Gottes mit Israel mit dem Leben, dem Tod und der Auferstehung Jesu sowie der Hoffnung auf eine erneuerte Schöpfung.';
if(n.id==='ot')return 'Die Schriften Israels erzählen von Schöpfung, Befreiung, Bund und dem Leben eines Volkes vor Gott. Geschichte, Klage und Weisheit stehen neben prophetischer Kritik und der Hoffnung auf Erneuerung. Ihre unterschiedlichen Stimmen tragen Erfahrungen von Vertrauen, Scheitern, Exil und Neubeginn zusammen.';
if(n.id==='nt')return 'Das Neue Testament erzählt von Jesus und davon, wie seine Botschaft Menschen und Gemeinschaften verändert. Die Evangelien, die Apostelgeschichte und die Briefe erschliessen Leben, Glauben und Nachfolge aus unterschiedlichen Situationen. Die Offenbarung richtet den Blick auf Gericht, Hoffnung und eine neue Schöpfung.';
if(n.level===2)return ['Die Tora führt von den Anfängen der Welt zur Entstehung Israels. Verheissung und Befreiung bilden den Hintergrund der Weisungen für ein gemeinsames Leben vor Gott. Die Erzählung endet vor dem Einzug in das Land.','Diese Bücher erzählen vom Leben Israels im Land, von Königsherrschaft, Zusammenbruch und Rückkehr. Sie fragen nach Treue, Verantwortung und den Folgen politischer und religiöser Entscheidungen.','Gebete, Liebesdichtung und Weisheitsliteratur geben Erfahrungen des Lebens eine Sprache. Freude und Leiden, Gerechtigkeit und Vergänglichkeit werden vor Gott und im menschlichen Alltag bedacht.','Die prophetischen Bücher verbinden die Kritik an Unrecht und Untreue mit Klage und Zukunftshoffnung. Die Krisen Jerusalems und das Exil bilden wichtige geschichtliche Horizonte.','Die zwölf kürzeren Prophetenbücher sprechen in unterschiedlichen Situationen von Gericht und Umkehr. Gottes Treue, soziale Gerechtigkeit und die Hoffnung auf Wiederherstellung verbinden viele ihrer Stimmen.','Vier Evangelien erzählen von Jesus mit unterschiedlichen Schwerpunkten. Sein Wirken und seine Lehre führen zu den Erzählungen von Kreuz und Auferstehung.','Die Apostelgeschichte erzählt, wie sich die Botschaft von Jesus von Jerusalem in die weitere Welt ausbreitet. Begegnungen, Konflikte und das Wirken des Geistes prägen diesen Weg.','Die unter dem Namen des Paulus überlieferten Briefe verbinden die Botschaft von Christus mit konkreten Fragen des Gemeindelebens. Einheit, Freiheit, Hoffnung und tätige Liebe werden in wechselnden Situationen entfaltet.','Diese Briefe und die als Hebräerbrief bezeichnete Schrift sprechen Gemeinden in unterschiedlichen Herausforderungen an. Glauben, Ausdauer, Liebe und die Unterscheidung von Lehren sind wiederkehrende Themen.','Die Offenbarung verwendet Bilder und Visionen, um Bedrängnis und Weltmacht im Horizont von Gottes Herrschaft zu deuten. Am Ende steht die Hoffnung auf eine erneuerte Schöpfung.'][Number(n.id.slice(1))];
if(n.level===3)return BOOK_SUMMARIES[n.b];
if(n.level===4){const sample={'c0-1':'Gott schafft die Welt durch sein Wort. Die Erzählung ordnet Licht, Himmel, Land und Leben in eine Abfolge von Tagen und bezeichnet die Schöpfung als gut. Der Mensch wird als Gottes Bild geschaffen.','c0-2':'Gottes Ruhe schliesst die Schöpfungserzählung ab. Eine weitere Erzählperspektive führt in den Garten Eden und beschreibt den Menschen, seinen Auftrag und die Beziehung von Mann und Frau.','c0-3':'Der Mensch überschreitet Gottes Gebot. Scham, gegenseitige Schuldzuweisung und gestörte Beziehungen treten hervor; die Erzählung endet mit dem Verlassen des Gartens.','c40-3':'Heilung am Sabbat führt zu Konflikten. Jesus beruft die Zwölf, begegnet dem Vorwurf dämonischer Vollmacht und beschreibt seine Familie vom Tun des Willens Gottes her.'};return sample[n.id]||(lang==='de'?'Die Zusammenfassung dieses Kapitels ist noch nicht ausgearbeitet. Dieser Eintrag hält die vollständige Lesereihenfolge offen.':'This chapter summary has not been written yet. This entry preserves the complete reading sequence.');}
if(n.level===5)return T().disclaimer+' '+(lang==='de'?'Eine inhaltliche Zusammenfassung fehlt hier noch.':'A passage summary is not available yet.');
return T().placeholder;
}
function reading(id){const n=nodes.get(id);return `<article class="stream-entry" data-stream="${id}"><p class="muted">${esc(T().levels[n.level])} · ${n.si+1} ${T().of} ${streams[n.level].length}${n.level>=4?' · '+esc(title(nodes.get(n.parent))):''}</p><h2>${esc(title(n))}</h2><p class="stream-copy">${esc(summary(n))}</p>${n.children.length?`<button type="button" class="deep" data-deep="${id}"><span>${lang==='de'?'Hier vertiefen':'Explore here'}</span>${icon('arrow-down')}</button>`:''}</article>`;}
function streamMarkup(){const ids=streams[nodes.get(current).level];return (readerStart?`<button type="button" class="load load-before" data-action="load-prev">${T().loadPrev}</button>`:'')+ids.slice(readerStart,readerEnd).map(reading).join('')+(readerEnd<ids.length?`<button type="button" class="load load-after" data-action="load-next">${T().loadNext}</button>`:`<p class="muted">${lang==='de'?'Ende dieser Lesefassung':'End of this reading level'}</p>`);}
function loadMore(before=false){const ids=streams[nodes.get(current).level];if(before&&readerStart>0){const old=reader.scrollHeight,start=Math.max(0,readerStart-10);reader.querySelector('.load-before')?.remove();reader.insertAdjacentHTML('afterbegin',(start>0?`<button type="button" class="load load-before" data-action="load-prev">${T().loadPrev}</button>`:'')+ids.slice(start,readerStart).map(reading).join(''));readerStart=start;reader.scrollTop+=reader.scrollHeight-old;}else if(!before&&readerEnd<ids.length){reader.querySelector('.load-after')?.remove();const end=Math.min(readerEnd+10,ids.length);reader.insertAdjacentHTML('beforeend',ids.slice(readerEnd,end).map(reading).join('')+(end<ids.length?`<button type="button" class="load load-after" data-action="load-next">${T().loadNext}</button>`:`<p class="muted">${lang==='de'?'Ende dieser Lesefassung':'End of this reading level'}</p>`));readerEnd=end;}refreshIcons();}
function renderContent(){const n=nodes.get(current);if(restoreStream&&restoreStream.id===current){readerStart=restoreStream.start;readerEnd=restoreStream.end;}else{readerStart=n.si;readerEnd=Math.min(n.si+10,streams[n.level].length);}reader.innerHTML=streamMarkup();}
function saveStream(){if(menu||view!=='content')return;savedStreams.set(nodes.get(current).level,{id:current,start:readerStart,end:readerEnd,offset:reader.scrollTop});}
function renderIndex(){const n=nodes.get(current);const ids=n.level<=3?streams[n.level||1]:nodes.get(n.parent).children;reader.innerHTML=`<div class="index-title"><h2>${lang==='de'?'Inhalt':'Contents'}</h2><button type="button" data-action="resume">${lang==='de'?'Weiterlesen':'Resume'}</button></div><p class="muted">${ids.length} ${T().levels[n.level||1]} · ${T().count}</p>`+ids.map(row).join('');}
function resolveLevel(level){let n=nodes.get(current);while(n.level>level)n=nodes.get(n.parent);while(n.level<level)n=nodes.get(remembered.get(n.id)||n.children[0]);return n.id;}
function picker(key,label,value,options){const id='picker-'+appIndex+'-'+key;return `<div class="picker"><label id="${id}-label" for="${id}">${label}</label><button type="button" class="picker-trigger" id="${id}" data-picker="${key}" aria-expanded="false" aria-controls="${id}-options" aria-labelledby="${id}-label ${id}-value"><span id="${id}-value">${options.find(o=>o[0]===value)[1]}</span>${icon('chevron-down')}</button><div class="picker-options" id="${id}-options" role="group" aria-labelledby="${id}-label" hidden>${options.map(o=>`<button type="button" class="picker-option" data-pick-key="${key}" data-pick-value="${o[0]}" aria-pressed="${o[0]===value}"><span>${o[1]}</span>${o[0]===value?icon('check'):''}</button>`).join('')}</div></div>`;}
function closePickers(focus=false){reader.querySelectorAll('[data-picker][aria-expanded="true"]').forEach(b=>{b.setAttribute('aria-expanded','false');reader.querySelector('#'+b.getAttribute('aria-controls')).hidden=true;if(focus)b.focus();});}
function renderMenu(){const t=T();reader.innerHTML=`<div class="menu"><h2>${t.menu}</h2><label for="find-${appIndex}">${t.search}</label><input id="find-${appIndex}" type="search" placeholder="${t.hint}" value="${esc(query)}" autocomplete="off"><div class="results"></div><p class="muted">${t.searchNote}</p><label>${t.appearance}</label><div class="switch"><button type="button" data-theme-choice="light" aria-pressed="${app.dataset.theme==='light'}">${t.light}</button><button type="button" data-theme-choice="dark" aria-pressed="${app.dataset.theme==='dark'}">${t.dark}</button></div>${picker('language',t.language,lang,[['de','Deutsch'],['en','English']])}${picker('size',t.size,String(parseInt(app.style.getPropertyValue('--read')||18)),[['18',lang==='de'?'Standard · 18 px':'Standard · 18 px'],['20',lang==='de'?'Gross · 20 px':'Large · 20 px'],['23',lang==='de'?'Sehr gross · 23 px':'Extra large · 23 px']])}<button type="button" class="row" data-action="home">${t.home}${icon('home')}</button><p class="muted">${t.scope}<br>${stats.chapters} ${t.chapters} · ${stats.blocks} ${t.blocks} · ${stats.verses.toLocaleString(lang)} ${t.verses}</p></div>`;renderResults();}
function renderResults(){const target=reader.querySelector('.results');if(!target)return;target.innerHTML=query?search(query).map(n=>row(n.id)).join('')||`<p class="muted" role="status">${T().empty}</p>`:'';refreshIcons();}
function render(){chrome();sidebar();if(menu)renderMenu();else if(view==='levels')reader.innerHTML=`<h2>${T().choose}</h2>`+T().levels.map((name,i)=>`<button type="button" class="row" data-level="${i}"><span>${name}<span class="muted">${streams[i].length} ${lang==='de'?'Einträge':'entries'}</span></span>${i===nodes.get(current).level?icon('check'):icon('chevron-right')}</button>`).join('');else if(view==='index')renderIndex();else renderContent();refreshIcons();}
function go(id){if(!id||!nodes.has(id))return;saveStream();for(const child of ancestors(id).slice(1))remembered.set(nodes.get(child).parent,child);current=id;menu=false;view='content';restoreStream=savedStreams.get(nodes.get(id).level);if(restoreStream?.id!==id)restoreStream=null;render();reader.scrollTop=restoreStream?.offset||0;restoreStream=null;app.querySelector('.live').textContent=title(nodes.get(id));}
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.deep){current=b.dataset.deep;const n=nodes.get(current);go(remembered.get(current)||n.children[0]);return;}if(b.dataset.level!==undefined){go(resolveLevel(Number(b.dataset.level)));return;}if(b.dataset.picker){const was=b.getAttribute('aria-expanded')==='true';closePickers();if(!was){b.setAttribute('aria-expanded','true');const panel=reader.querySelector('#'+b.getAttribute('aria-controls'));panel.hidden=false;panel.querySelector('[aria-pressed=true]').focus({preventScroll:true});panel.scrollIntoView?.({block:'nearest'});}return;}if(b.dataset.pickKey){const key=b.dataset.pickKey,pos=reader.scrollTop;if(key==='language')lang=b.dataset.pickValue;else app.style.setProperty('--read',b.dataset.pickValue+'px');render();reader.scrollTop=pos;reader.querySelector('[data-picker="'+key+'"]').focus({preventScroll:true});app.querySelector('.live').textContent=key==='language'?T().language+': '+(lang==='de'?'Deutsch':'English'):T().size+': '+b.dataset.pickValue;return;}closePickers();if(b.dataset.go){go(b.dataset.go);return;}if(b.dataset.themeChoice){app.dataset.theme=b.dataset.themeChoice;reader.querySelectorAll('[data-theme-choice]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.themeChoice===app.dataset.theme)));return;}const action=b.dataset.action,n=nodes.get(current);if(action==='index'){saveStream();menu=false;view='index';render();reader.scrollTop=0;}else if(action==='resume'){go(current);}else if(action==='home')go('all');else if(action==='menu'){if(!menu){saveStream();positions.set(current,reader.scrollTop);}menu=!menu;view='content';restoreStream=savedStreams.get(nodes.get(current).level);render();reader.scrollTop=menu?0:positions.get(current)||0;restoreStream=null;if(menu)reader.querySelector('input').focus();}else if(action==='up')go(n.parent);else if(action==='down')go(remembered.get(current)||n.children[0]);else if(action==='prev'||action==='next')go(sibling(current,action==='prev'?-1:1));else if(action==='levels'){saveStream();if(view==='levels'){go(current);}else{view='levels';render();reader.scrollTop=0;}}else if(action==='load-prev')loadMore(true);else if(action==='load-next')loadMore();});
reader.addEventListener('input',e=>{if(e.target.type==='search'){query=e.target.value;renderResults();}});
reader.addEventListener('change',e=>{if(e.target.dataset.setting==='language'){lang=e.target.value;render();}else if(e.target.dataset.setting==='size')app.style.setProperty('--read',e.target.value+'px');});
app.addEventListener('keydown',e=>{const panel=e.target.closest('.picker-options');if(panel&&['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();const opts=[...panel.querySelectorAll('button')],i=opts.indexOf(e.target),next=e.key==='Home'?0:e.key==='End'?opts.length-1:(i+(e.key==='ArrowDown'?1:-1)+opts.length)%opts.length;opts[next].focus();return;}if(e.key==='Escape'&&reader.querySelector('[data-picker][aria-expanded=true]')){e.preventDefault();closePickers(true);return;}if(e.key==='Escape'&&menu){go(current);app.querySelector('.menu-toggle').focus();}});
app.addEventListener('focusout',e=>{const p=e.target.closest('.picker');if(p&&p.isConnected&&e.relatedTarget&&!p.contains(e.relatedTarget)){const trigger=p.querySelector('[data-picker]');trigger.setAttribute('aria-expanded','false');p.querySelector('.picker-options').hidden=true;}});
app.addEventListener('pointerdown',e=>{if(!e.target.closest('.picker'))closePickers();});
let busy=false;reader.addEventListener('scroll',()=>{if(menu||view!=='content'||busy)return;busy=true;const top=reader.getBoundingClientRect().top;const active=[...reader.querySelectorAll('[data-stream]')].find(el=>el.getBoundingClientRect().bottom>top+45);if(active&&active.dataset.stream!==current){current=active.dataset.stream;for(const child of ancestors(current).slice(1))remembered.set(nodes.get(child).parent,child);chrome();refreshIcons();sidebar();aside.querySelectorAll('[data-go]').forEach(b=>b.setAttribute('aria-current',String(b.dataset.go===current)));}if(reader.scrollTop+reader.clientHeight>reader.scrollHeight-100)loadMore();else if(reader.scrollTop<12&&readerStart>0)loadMore(true);busy=false;},{passive:true});
render();
});
if(globalThis.__BIBLE_TEST__)globalThis.__BIBLE_TEST__({nodes,verses,stats,search,sibling,ancestors,streams,BOOK_SUMMARIES});
})();
</script>
</div>
