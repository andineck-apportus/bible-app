ns":["ED-SBLGNT","ED-RP"]},{"reading":"R2","support":3,"of":5,"level":"mehrheitlich","editions":["ED-WH","ED-TREG","ED-NA28"]}]},{"id":"VAR-SBLGNTAPP-MRK-003-033-03","ref":"MRK.3.33","level":"edition_apparatus","readings":[{"id":"R1","text":"μου","editions":["ED-TREG","ED-NA28","ED-RP"],"witnesses":[]},{"id":"R2","text":"–","editions":["ED-WH"],"witnesses":[]}],"note":"Vergleich gedruckter Editionen laut SBLGNT-Apparat; keine Handschriftenbelege.","assessment":[{"reading":"R1","support":4,"of":5,"level":"breit","editions":["ED-SBLGNT","ED-TREG","ED-NA28","ED-RP"]},{"reading":"R2","support":1,"of":5,"level":"vereinzelt","editions":["ED-WH"]}]},{"id":"VAR-SBLGNTAPP-MRK-003-034-01","ref":"MRK.3.34","level":"edition_apparatus","readings":[{"id":"R1","text":"τοὺς περὶ αὐτὸν κύκλῳ","editions":["ED-WH","ED-TREG","ED-NA28"],"witnesses":[]},{"id":"R2","text":"κύκλῳ τοὺς περὶ αὐτὸν","editions":["ED-RP"],"witnesses":[]}],"note":"Vergleich gedruckter Editionen laut SBLGNT-Apparat; keine Handschriftenbelege.","assessment":[{"reading":"R1","support":4,"of":5,"level":"breit","editions":["ED-SBLGNT","ED-WH","ED-TREG","ED-NA28"]},{"reading":"R2","support":1,"of":5,"level":"vereinzelt","editions":["ED-RP"]}]},{"id":"VAR-SBLGNTAPP-MRK-003-035-01","ref":"MRK.3.35","level":"edition_apparatus","readings":[{"id":"R1","text":"γὰρ","editions":["ED-TREG","ED-NA28","ED-RP"],"witnesses":[]},{"id":"R2","text":"–","editions":["ED-WH"],"witnesses":[]}],"note":"Vergleich gedruckter Editionen laut SBLGNT-Apparat; keine Handschriftenbelege.","assessment":[{"reading":"R1","support":4,"of":5,"level":"breit","editions":["ED-SBLGNT","ED-TREG","ED-NA28","ED-RP"]},{"reading":"R2","support":1,"of":5,"level":"vereinzelt","editions":["ED-WH"]}]},{"id":"VAR-SBLGNTAPP-MRK-003-035-02","ref":"MRK.3.35","level":"edition_apparatus","readings":[{"id":"R1","text":"ἀδελφὴ","editions":["ED-WH","ED-TREG","ED-NA28"],"witnesses":[]},{"id":"R2","text":"+ μου","editions":["ED-RP"],"witnesses":[]}],"note":"Vergleich gedruckter Editionen laut SBLGNT-Apparat; keine Handschriftenbelege.","assessment":[{"reading":"R1","support":4,"of":5,"level":"breit","editions":["ED-SBLGNT","ED-WH","ED-TREG","ED-NA28"]},{"reading":"R2","support":1,"of":5,"level":"vereinzelt","editions":["ED-RP"]}]}],"findings":[{"id":"FIND-MRK-0001","claim":"[[MRK.3.30]] begründet Jesu Warnung damit, dass die Schriftgelehrten sagten, er habe einen unreinen Geist.","kind":"textual_observation","confidence":"high","subject":"TU-MRK-003-022-030","caveat":null},{"id":"FIND-MRK-0002","claim":"Die Rede verbindet den Beelzebul-Vorwurf mit Jesu Antwort über Satan und die Lästerung des Heiligen Geistes.","kind":"literary_observation","confidence":"high","subject":"TU-MRK-003-022-030","caveat":null},{"id":"FIND-MRK-0003","claim":"Die Schlussformulierung von [[MRK.3.29]] wird in unterschiedlichen Lesarten überliefert (Sünde/Gericht).","kind":"text_critical","confidence":"probable","subject":"TU-MRK-003-022-030","caveat":"Varianten sind aus der bisherigen Vorarbeit bekannt; Zeugen-Zuordnungen müssen noch anhand der Primärquellen geprüft werden."},{"id":"FIND-MRK-0004","claim":"[[MRK.3.22]] nennt den Vorwurf; [[MRK.3.23-MRK.3.27]] enthält Jesu Gegenargumente und [[MRK.3.28-MRK.3.30]] die Warnung samt Begründung.","kind":"literary_structure","confidence":"high","subject":"TU-MRK-003-022-030","caveat":null},{"id":"FIND-MRK-0005","claim":"In [[MRK.3.21]] brechen Jesu Angehörige (οἱ παρʼ αὐτοῦ) auf, um ihn zu holen; in [[MRK.3.31]] kommen seine Mutter und seine Brüder an. Dazwischen steht die Auseinandersetzung mit den Schriftgelehrten aus Jerusalem ([[MRK.3.22-MRK.3.30]]).","kind":"literary_structure","confidence":"high","subject":"TU-MRK-003-020-035","caveat":"Beobachtung am Wortlaut; ob οἱ παρʼ αὐτοῦ dieselben Personen wie Mutter und Brüder in [[MRK.3.31]] sind, sagt der Text nicht ausdrücklich."}],"interpretations":[{"id":"INT-MRK-0001","claim":"Die Warnung bezieht sich im Erzählkontext auf die Zuschreibung von Jesu befreiendem Wirken an eine unreine Macht.","confidence":"probable","caveat":"Der Text sagt nicht ausdrücklich, dass die Schriftgelehrten die göttliche Herkunft sicher erkannt hatten.","counter":[],"subject":"TU-MRK-003-022-030","terms":[]},{"id":"INT-MRK-0002","claim":"Die Warnung kann stärker als Beschreibung einer dauerhaften Verhärtung gelesen werden; Dauerhaftigkeit ist jedoch nicht allein aus der Verbform beweisbar.","confidence":"possible","caveat":null,"counter":[],"subject":"TU-MRK-003-022-030","terms":[]},{"id":"INT-MRK-0003","claim":"Markus verschachtelt die beiden Szenen bewusst: Angehörige («er ist von Sinnen», [[MRK.3.21]]) und Schriftgelehrte («er hat Beelzebul», [[MRK.3.22]]) beurteilen Jesus je auf ihre Weise falsch. [[MRK.3.35]] bestimmt Zugehörigkeit zu Jesus neu über das Tun des Willens Gottes.","confidence":"probable","caveat":"Ob οἱ παρʼ αὐτοῦ in [[MRK.3.21]] Jesu Familie meint (so die meisten Übersetzungen) oder allgemeiner seine Leute, ist umstritten; ebenso, wer in [[MRK.3.21]] «sie sagten» spricht (die Angehörigen oder unbestimmt «man»). Je nach Entscheidung fällt die Parallele schwächer aus.","counter":["Die Verschachtelung kann auch erzählerisch die Zeit überbrücken, bis die Angehörigen ankommen, ohne dass ein Vergleich beabsichtigt ist."],"subject":"TU-MRK-003-020-035","terms":[]}],"principles":[{"id":"PRIN-MRK-0001","text":"Behauptungen über Gottes Wirken sind verantwortungsvoll zu beurteilen; die bewusste Verkehrung von Gut und Böse ist nicht mit gewöhnlichem Zweifel gleichzusetzen.","confidence":"possible","subject":"TU-MRK-003-022-030"}],"applications":[{"id":"APP-MRK-0001","text":"Eine behauptete Geisteswirkung darf kritisch geprüft werden; das ist nicht automatisch Lästerung des Heiligen Geistes.","limits":"Heutige religiöse Behauptungen sind nicht ohne Weiteres mit Jesu Wirken in Markus gleichzusetzen.","subject":"TU-MRK-003-022-030","context":"Deutschsprachige heutige Bibellesende","confidence":"probable"}],"questions":[{"id":"QUESTION-MRK-0001","q":"Setzt der Vorwurf der Schriftgelehrten voraus, dass sie die Wirkung des Heiligen Geistes bewusst als solche erkannt hatten?","finding":"[[MRK.3.22-MRK.3.30]] belegt die Zuschreibung an Beelzebul, nicht ausdrücklich das innere Wissen der Sprecher.","subject":"TU-MRK-003-022-030"}],"relations":[{"from":"TU-MRK-003-022-030","from_ref":"MRK.3.22-MRK.3.30","to":"MAT.12.22-MAT.12.32","to_de":"Mt 12,22–32","kind":"parallel_passage","confidence":"high"},{"from":"TU-MRK-003-022-030","from_ref":"MRK.3.22-MRK.3.30","to":"LUK.11.14-LUK.11.23","to_de":"Lk 11,14–23","kind":"parallel_argument","confidence":"probable"},{"from":"TU-MRK-003-022-030","from_ref":"MRK.3.22-MRK.3.30","to":"LUK.12.8-LUK.12.10","to_de":"Lk 12,8–10","kind":"parallel_saying","confidence":"high"}],"bg":[{"id":"BG-MRK-0001","topic":"Zeit und Ort","text":"Die Szene spielt um das Jahr 30 in Galiläa, im Norden des Landes. Dort regierte Herodes Antipas als von Rom abhängiger Fürst; Jerusalem mit dem Tempel lag in Judäa, das ein römischer Statthalter verwaltete. Die Menschen in Galiläa sprachen im Alltag Aramäisch, lebten meist von Landwirtschaft, Handwerk und Fischerei und waren in Dorf und Grossfamilie eingebunden.","uncertain":"Das genaue Jahr ist nicht bekannt.","confidence":"high","subject":"TU-MRK-003-020-035","section":"TU-MRK-003-020-035","wide":true,"chapter":"MRK.3","from":20,"to":35,"ref_de":"Mk 3,20–35","readers":false,"evidence":["Lk 3,1","Mk 1,14"],"sources":[],"status":"draft","terms":[]},{"id":"BG-MRK-0002","topic":"Für wen Markus schrieb","text":"Markus erzählt diese Ereignisse einige Jahrzehnte später auf Griechisch. Seine Leser kannten jüdische Bräuche offenbar nicht alle, denn er erklärt sie an anderer Stelle ([[MRK.7.3-MRK.7.4]]). Wer die Szene liest, sollte also zwei Zeiten im Blick haben: die Situation um Jesus und die Fragen der ersten christlichen Gemeinden, für die Markus erzählt.","uncertain":"Ort und Zeitpunkt der Abfassung sind umstritten.","confidence":"probable","subject":"TU-MRK-003-020-035","section":"TU-MRK-003-020-035","wide":true,"chapter":"MRK.3","from":20,"to":35,"ref_de":"Mk 3,20–35","readers":true,"evidence":["Mk 7,3–4"],"sources":[],"status":"draft","terms":[]},{"id":"BG-MRK-0003","topic":"Ein volles Haus","text":"Häuser in Galiläa waren meist einfach: wenige Räume aus Basaltstein um einen offenen Hof, in dem gekocht und gearbeitet wurde. Schon wenige Dutzend Menschen füllten Haus und Eingang. In Kafarnaum, wo Jesus nach Markus wohnte, wurden solche Wohnhäuser ausgegraben.","uncertain":"Ob das Haus hier in Kafarnaum steht und wem es gehört, sagt der Text nicht.","confidence":"probable","subject":"TU-MRK-003-020-021","section":"TU-MRK-003-020-035","wide":false,"chapter":"MRK.3","from":20,"to":20,"ref_de":"Mk 3,20","readers":false,"evidence":["Mk 1,29","Mk 2,1–2"],"sources":["Ausgrabungen in Kafarnaum (Wohnviertel am See, sogenannte Insula sacra)"],"status":"draft","terms":[]},{"id":"BG-MRK-0004","topic":"Familie und Ruf","text":"Die Familie war damals nicht Privatsache, sondern die wichtigste Lebens- und Schutzgemeinschaft. Was ein Mitglied tat, fiel auf alle zurück. Wenn jemand für «von Sinnen» gehalten wurde, war es Aufgabe der Angehörigen, ihn nach Hause zu holen. Verwirrtheit wurde oft mit einem bösen Geist in Verbindung gebracht.","uncertain":"Wer mit «die Seinen» gemeint ist, ist umstritten (siehe «Wie kann man es verstehen?»).","confidence":"probable","subject":"TU-MRK-003-020-021","section":"TU-MRK-003-020-035","wide":false,"chapter":"MRK.3","from":21,"to":21,"ref_de":"Mk 3,21","readers":false,"evidence":["Joh 10,20","Mk 6,3–4"],"sources":[],"status":"draft","terms":[{"lang":"grc","word":"οἱ παρʼ αὐτοῦ","de":"die von ihm her, seine Angehörigen"},{"lang":"grc","word":"ἐξέστη","de":"er ist von Sinnen"}]},{"id":"BG-MRK-0005","topic":"Schriftgelehrte aus Jerusalem","text":"Schriftgelehrte waren Kenner und Lehrer der heiligen Schriften und des Gesetzes. Jerusalem mit dem Tempel war das religiöse Zentrum. Bis Galiläa waren es etwa 120 Kilometer, mehrere Tage zu Fuss. Dass Schriftgelehrte von dort kommen, zeigt: Was Jesus tut, beschäftigt man auch im Zentrum.","uncertain":"Ob sie im Auftrag einer Behörde kamen, ist offen.","confidence":"probable","subject":"TU-MRK-003-022-030","section":"TU-MRK-003-020-035","wide":false,"chapter":"MRK.3","from":22,"to":22,"ref_de":"Mk 3,22","readers":false,"evidence":["Mk 7,1"],"sources":[],"status":"draft","terms":[{"lang":"grc","word":"γραμματεῖς","de":"Schriftgelehrte"}]},{"id":"BG-MRK-0006","topic":"Beelzebul","text":"Der Name erinnert an «Baal-Sebub», einen Gott der Philisterstadt Ekron ([[2KI.1.2]]). «Baal» heisst «Herr»; «Sebub» bedeutet «Fliegen», was wohl ein spöttisch verdrehter Name ist. «Sebul» kann «Wohnung» oder «erhabene Wohnung» heissen. Zur Zeit Jesu bezeichnete der Name den Anführer der bösen Geister. Die Deutung «Herr des Hauses» würde zu den Bildern vom Haus in [[MRK.3.25-MRK.3.27]] passen; auch [[MAT.10.25]] spielt mit «Hausherr» und «Beelzebul».","uncertain":"Herkunft und Bedeutung des Namens sind nicht sicher geklärt.","confidence":"possible","subject":"TU-MRK-003-022-030","section":"TU-MRK-003-020-035","wide":false,"chapter":"MRK.3","from":22,"to":22,"ref_de":"Mk 3,22","readers":false,"evidence":["2 Kön 1,2","1 Kön 8,13","Mt 10,25"],"sources":[],"status":"draft","terms":[{"lang":"grc","word":"Βεελζεβούλ","de":"Beelzebul"},{"lang":"heb","word":"בַּעַל זְבוּב","translit":"baʿal zevuv","de":"Herr der Fliegen ([[2KI.1.2]])"},{"lang":"heb","word":"זְבוּל","translit":"zevul","de":"Wohnung, erhabene Wohnung"}]},{"id":"BG-MRK-0007","topic":"Geister austreiben","text":"Dass böse Geister ausgetrieben werden können, war damals allgemein angenommen; auch andere jüdische Heiler taten das. Der jüdische Geschichtsschreiber Josephus erzählt von einem Eleazar, der vor dem späteren Kaiser Vespasian mit Formeln, die man auf König Salomo zurückführte, einen Dämon austrieb. Die Gegner bestreiten im Text auch nicht, dass Jesus Geister austreibt; sie fragen, aus welcher Macht er es tut. Der Vorwurf, Jesus sei ein Zauberer gewesen, findet sich später auch bei jüdischen und anderen Gegnern des Christentums.","uncertain":null,"confidence":"high","subject":"TU-MRK-003-022-030","section":"TU-MRK-003-020-035","wide":false,"chapter":"MRK.3","from":22,"to":23,"ref_de":"Mk 3,22–23","readers":false,"evidence":["Mt 12,27","Apg 19,13–14","Tob 8,2–3"],"sources":["Josephus, Jüdische Altertümer 8,45–49","Justin, Dialog mit Tryphon 69,7","Babylonischer Talmud, Sanhedrin 43a"],"status":"draft","terms":[{"lang":"grc","word":"ἐκβάλλω","de":"hinauswerfen, austreiben"}]},{"id":"BG-MRK-0008","topic":"Den Starken binden","text":"Das Bild vom Starken, dem man seine Beute wegnimmt, erinnert an [[ISA.49.24-ISA.49.25]]: Gott selbst nimmt dem Starken die Gefangenen ab. In jüdischen Schriften der Zeit werden böse Mächte «gebunden», etwa im Buch Tobit ([[TOB.8.3]]) oder im äthiopischen Henochbuch (10,4). Zuhörer konnten das Bild daher als Hinweis verstehen, dass Gottes Sieg über das Böse beginnt.","uncertain":"Wie weit Jesus und Markus an diese Texte dachten, ist eine Deutung, kein Befund.","confidence":"probable","subject":"TU-MRK-003-022-030","section":"TU-MRK-003-020-035","wide":false,"chapter":"MRK.3","from":27,"to":27,"ref_de":"Mk 3,27","readers":false,"evidence":["Jes 49,24–25","Tob 8,3"],"sources":["1. Henoch (äthiopisches Henochbuch) 10,4"],"status":"draft","terms":[{"lang":"grc","word":"ἰσχυρός","de":"stark; der Starke"},{"lang":"grc","word":"δέω","de":"binden"}]},{"id":"BG-MRK-0009","topic":"«Amen» am Anfang","text":"«Amen» heisst «so ist es, es gilt». Im Gottesdienst war es die Antwort der Gemeinde auf ein Gebet oder einen Segen ([[DEU.27.15-DEU.27.26]]; [[NEH.8.6]]). Jesus setzt es dagegen an den Anfang seiner Worte. Diese ungewöhnliche Redeweise ist in den Evangelien typisch für ihn und unterstreicht das Folgende.","uncertain":null,"confidence":"high","subject":"TU-MRK-003-022-030","section":"TU-MRK-003-020-035","wide":false,"chapter":"MRK.3","from":28,"to":28,"ref_de":"Mk 3,28","readers":false,"evidence":["Dtn 27,15–26","Neh 8,6"],"sources":[],"status":"draft","terms":[{"lang":"heb","word":"אָמֵן","translit":"amen","de":"so ist es, es gilt"},{"lang":"grc","word":"ἀμήν","de":"Amen"}]},{"id":"BG-MRK-0010","topic":"Lästerung","text":"Lästerung bedeutete, verächtlich gegen Gott oder Heiliges zu reden; nach dem Gesetz war Lästerung des Gottesnamens ein schweres Vergehen ([[LEV.24.15-LEV.24.16]]). Bekannt war auch die Unterscheidung zwischen Versehen und Sünde «mit erhobener Hand», also bewusster Auflehnung, für die es kein Opfer gab ([[NUM.15.30-NUM.15.31]]). Vor diesem Hintergrund fällt auf, wie weit Jesus die Vergebung fasst: Alle Lästerungen der Menschen können vergeben werden, mit einer Ausnahme.","uncertain":"Ob Jesus bewusst an Num 15 anknüpft, ist offen.","confidence":"probable","subject":"TU-MRK-003-022-030","section":"TU-MRK-003-020-035","wide":false,"chapter":"MRK.3","from":28,"to":29,"ref_de":"Mk 3,28–29","readers":false,"evidence":["Lev 24,15–16","Num 15,30–31"],"sources":[],"status":"draft","terms":[{"lang":"grc","word":"βλασφημία","de":"Lästerung"}]},{"id":"BG-MRK-0011","topic":"Die Brüder Jesu","text":"Markus nennt an anderer Stelle vier Brüder, Jakobus, Joses, Judas und Simon, sowie Schwestern ([[MRK.6.3]]). Wie sie mit Jesus verwandt sind, wird in den Kirchen seit dem 4. Jahrhundert unterschiedlich verstanden: als jüngere Kinder von Maria und Josef, als Kinder Josefs aus einer früheren Ehe oder als Cousins. Das griechische Wort für «Bruder» kann auch weitere Verwandte meinen. Josef wird nicht erwähnt; viele vermuten, dass er schon gestorben war.","uncertain":"Die Verwandtschaftsfrage ist zwischen Konfessionen umstritten; der Text selbst entscheidet sie nicht.","confidence":"high","subject":"TU-MRK-003-031-035","section":"TU-MRK-003-020-035","wide":false,"chapter":"MRK.3","from":31,"to":31,"ref_de":"Mk 3,31","readers":false,"evidence":["Mk 6,3","Gal 1,19"],"sources":[],"status":"draft","terms":[{"lang":"grc","word":"ἀδελφός","de":"Bruder, auch Verwandter"}]},{"id":"BG-MRK-0012","topic":"Drinnen sitzen, draussen stehen","text":"Um einen Lehrer herum zu sitzen war die Haltung von Schülern (vgl. [[LUK.10.39]]; [[ACT.22.3]]). Ein früher jüdischer Spruch rät: «Setze dich in den Staub ihrer Füsse», gemeint sind die Lehrer. Die Familie dagegen steht draussen und lässt ihn rufen. In einer Kultur, in der die Familie Anspruch auf ihre Mitglieder hatte, war das eine starke Bitte.","uncertain":null,"confidence":"probable","subject":"TU-MRK-003-031-035","section":"TU-MRK-003-020-035","wide":false,"chapter":"MRK.3","from":31,"to":32,"ref_de":"Mk 3,31–32","readers":false,"evidence":["Lk 10,39","Apg 22,3"],"sources":["Mischna, Sprüche der Väter (Avot) 1,4"],"status":"draft","terms":[]},{"id":"BG-MRK-0013","topic":"Eine neue Familie","text":"Weil die Familie Lebensgrundlage, Altersvorsorge und Ehre bedeutete, war es auffällig, Menschen ausserhalb der Verwandtschaft «Mutter» und «Brüder» zu nennen. Zugleich galt das Gebot, die Eltern zu ehren ([[EXO.20.12]]). Markus kommt später darauf zurück: Wer um Jesu willen Familie verlässt, erhält eine neue Gemeinschaft ([[MRK.10.29-MRK.10.30]]). Für die ersten Gemeinden, in denen manche wegen ihres Glaubens mit der eigenen Familie brachen, war das wichtig.","uncertain":"Wie scharf der Gegensatz zur leiblichen Familie gemeint ist, wird unterschiedlich beurteilt.","confidence":"probable","subject":"TU-MRK-003-031-035","section":"TU-MRK-003-020-035","wide":false,"chapter":"MRK.3","from":33,"to":35,"ref_de":"Mk 3,33–35","readers":false,"evidence":["Ex 20,12","Mk 10,29–30"],"sources":[],"status":"draft","terms":[]}],"xref":{"MRK.3.1":[["LUK.6.6-LUK.6.11",18],["MAT.12.9-MAT.12.14",18],["MRK.1.21",8]],"MRK.3.2":[["PSA.37.32",7],["LUK.14.1",6],["LUK.6.7",6],["LUK.20.20",5],["LUK.11.53-LUK.11.54",4],["DAN.6.4",3],["JHN.9.16",3],["MAT.12.10",3],["ISA.29.20-ISA.29.21",2],["JER.20.10",2]],"MRK.3.3":[["PHP.1.28-PHP.1.30",3],["1CO.15.5 ported":[]}]},"VAR-SBLGNTAPP-MRK-003-025-01":{"ref":"MRK.3.25","readings":[{"id":"R1","text":"δυνήσεται","editions":["ED-WH","ED-TREG","ED-NA28"],"reported":[]},{"id":"R2","text":"δύναται","editions":["ED-RP"],"reported":[]}]},"VAR-SBLGNTAPP-MRK-003-026-01":{"ref":"MRK.3.26","readings":[{"id":"R1","text":"ἐμερίσθη","editions":["ED-WH","ED-NA28"],"reported":[]},{"id":"R2","text":"μεμέρισται","editions":["ED-TREG","ED-RP"],"reported":[]}]},"VAR-SBLGNTAPP-MRK-003-029-01":{"ref":"MRK.3.29","readings":[{"id":"R1","text":"ἁμαρτήματος","editions":["ED-WH","ED-TREG","ED-NA28"],"reported":[]},{"id":"R2","text":"κρίσεως","editions":["ED-RP"],"reported":[]}]},"VAR-SBLGNTAPP-MRK-003-032-03":{"ref":"MRK.3.32","readings":[{"id":"R1","text":"σου","editions":["ED-WH","ED-TREG"],"reported":[]},{"id":"R2","text":"+ καὶ αἱ ἀδελφαί σου","editions":["ED-RP","ED-NA28"],"reported":[]}]}},"name":"b/MRK","book":"MRK"},"l/gsw/common":{"i18n":{"SUM-BIBLE":{"text":"D Bible versammlet Verzellige, Gebät, Wiisheit, prophetischi Stimme und Brief. I chrischtlicher Läsart verbindt si d Gschicht vo Gott mit Israel mit em Läbe, em Tod und de Uferstehig vom Jesus und mit de Hoffnig uf e ernöiereti Schöpfig."},"SUM-BOOK-1CH":{"text":"Stammtafle und d Gschicht vom David, mit em Blick uf de Tämpel und de Gottesdienscht."},"SUM-BOOK-1CO":{"text":"De Paulus antwortet uf Striit und Frage i Korinth: Einheit, Sexualität, Götzeopferfleisch, Abigmaal, Geischtesgaabe, Liebi und Uferstehig."},"SUM-BOOK-1JN":{"text":"Gott isch Liecht und Liebi: Im Liecht läbe, d Sünd bekänne, enand liebe, de Glaube a de Jesus als Chrischtus feschthalte."},"SUM-BOOK-1KI":{"text":"De Salomo baut de Tämpel, s Riich teilt sich, und de Prophet Elija stellt sich gäge de Baalskult."},"SUM-BOOK-1PE":{"text":"Hoffnig und Duurehalte für bedrängti Chrischte: als Frömdi i de Wält heilig läbe, Liide wie Chrischtus."},"SUM-BOOK-1SA":{"text":"Vom Samuel über de Saul zum David: Wie Israel en Chünig überchunnt und wie Gott de David erwäält."},"SUM-BOOK-1TH":{"text":"De Paulus dankt für de Glaube vo de Thessalonicher, ermuetiget zum heilige Läbe und trööschtet wäge de Verstorbne und de Widerkunft."},"SUM-BOOK-1TI":{"text":"Aawiisige für de Timotheus: Leer bewaare, Gmeindsordnig, Ämter, Umgang mit Riichtum."},"SUM-BOOK-2CH":{"text":"Vom Salomo bis zum Exil: d Chünig vo Juda, de Tämpel und d Hoffnig uf d Ruckkeer."},"SUM-BOOK-2CO":{"text":"De Paulus verteidigt sin Dienscht, redt vo Trooscht im Leide, vo de Kollekte und vo siner Schwachheit, i dere Gottes Chraft wirkt."},"SUM-BOOK-2JN":{"text":"E churze Brief: I de Liebi und i de Waarheit bliibe, Irrleerer nöd ufnää."},"SUM-BOOK-2KI":{"text":"Elischa wirkt, d Chünig vo Israel und Juda fale meischtens ab, s Nordriich und spööter Jerusalem gönd under."},"SUM-BOOK-2PE":{"text":"Warnig vor Irrleerer und Spötter; d Wiederkunft chunnt gwüss, drum heilig läbe und wachse i de Gnad."},"SUM-BOOK-2SA":{"text":"De David regiert über ganz Israel: Erfolg, Schuld mit de Batseba, Familiestriit und d Verheissig vo eme ewige Chünigshuus."},"SUM-BOOK-2TH":{"text":"Duurehalte i de Verfolgig, Warnig vor Irrtum über de Taag vom Herr, Mahnig zum ornigliche Läbe."},"SUM-BOOK-2TI":{"text":"De letscht Brief vom Paulus: Tröi bliibe, Liide erträge, d Schrift bruuche, de Lauf vollände."},"SUM-BOOK-3JN":{"text":"De Johannes lobt de Gaius für sini Gaschtfründschaft und tadlet de Diotrephes."},"SUM-BOOK-ACT":{"text":"Vo Pfingschte bis zum Paulus z Rom: Wie de Heilig Geischt d Gmeind verbreitet, mit Petrus, Stephanus, Philippus und Paulus."},"SUM-BOOK-AMO":{"text":"De Amos klagt Unrächt und falschi Sicherheit aa: Gott wott Rächt und Grächtigkeit, nöd Opfer ohni Härz."},"SUM-BOOK-COL":{"text":"Chrischtus staat über allem; d Gmeind söll sich nöd vo frömde Leere verwirre laa und es nöis Läbe füere."},"SUM-BOOK-DAN":{"text":"De Daniel bliibt am Chünigshof tröi; Visione vo Riiche, wo vergönd, und vo Gottes Herrschaft, wo bliibt."},"SUM-BOOK-DEU":{"text":"De Mose hält Abschiedsrede: Er erinneret a de Wäg, wiederholt s Gsetz und stellt s Volk vor d Waal zwüsche Säge und Fluech."},"SUM-BOOK-ECC":{"text":"De Prediger fröögt, was im Läbe bliibt, und findt: Alles isch flüchtig, aber me söll Gottes Gaabe mit Freud aanää."},"SUM-BOOK-EPH":{"text":"Gottes Plan, alles i Chrischtus z vereine; d Gmeind als Liib vo Chrischtus; es Läbe i Liebi, Familie und geischtlichem Kampf."},"SUM-BOOK-EST":{"text":"D Ester rettet als Chünigin im Persischriich iris Volk vor em Aaschlag vom Haman; s Purimfescht erinneret dra."},"SUM-BOOK-EXO":{"text":"Israel wird us de Sklaverei in Ägypte befreit, zieht dur s Meer, überchunnt am Sinai d Gebot und baut s Heiligtum."},"SUM-BOOK-EZK":{"text":"De Ezechiel gseet im Exil Visione: Gricht über Jerusalem, Gottes Herrlichkeit, Hoffnig für di dürre Bei und en nöie Tämpel."},"SUM-BOOK-EZR":{"text":"Di Ruckkeer us em Exil, de Nöibau vom Tämpel und d Ernöierig vom Volk under em Esra."},"SUM-BOOK-GAL":{"text":"De Paulus streitet für d Freiheit im Glaube: Nöd s Gsetz, sondern s Vertroue uf Chrischtus macht grächt; de Geischt bringt Frucht."},"SUM-BOOK-GEN":{"text":"Vom Aafang vo de Wält bis zu de Familie vom Jakob in Ägypte: Schöpfig, Sündefall, Sintfluet, Abraham, Isaak, Jakob und Josef."},"SUM-BOOK-HAB":{"text":"De Habakuk fröögt, warum Gott s Unrächt zuelaat, und leert: De Grächt läbt us Glaube."},"SUM-BOOK-HAG":{"text":"De Haggai ermuetiget s Volk, de Tämpel wider ufzboue."},"SUM-BOOK-HEB":{"text":"Chrischtus isch grösser als Ängel, Mose und Prieschtertum; de nöi Bund; Glaubenszüüge und d Mahnig, duurezhalte."},"SUM-BOOK-HOS":{"text":"De Hosea zeigt mit siner eigene Ehe Gottes Liebi zu eme untröie Volk und rüeft zur Umkeer."},"SUM-BOOK-ISA":{"text":"De Jesaja warnt Juda, kündt Gricht und Trooscht aa und redt vom Chnächt vo Gott und vo ere nöie Schöpfig."},"SUM-BOOK-JAS":{"text":"Glaube zeigt sich im Tue: Prüefige, Hööre und Tue, Umgang mit de Zunge, mit Arme und Riiche, Geduld und Gebät."},"SUM-BOOK-JDG":{"text":"I de Ziit vo de Richter wächsled Abfall, Bedrängnis, Hilferuef und Rettig dur Füerer wie Debora, Gideon und Simson."},"SUM-BOOK-JER":{"text":"De Jeremia liidet under siner Botschaft: Er kündt de Undergang vo Jerusalem aa und verheisst en nöie Bund."},"SUM-BOOK-JHN":{"text":"De Johannes zeigt de Jesus als s Wort vo Gott, wo Mänsch worde isch: Zeiche, Red über Liecht, Läbe und Liebi, und d Stund vo de Verherrlichig am Chrüüz."},"SUM-BOOK-JOB":{"text":"De Hiob verlüürt alles, ringt mit sine Fründ und mit Gott um d Frag nach em Leide und überchunnt Antwort us em Sturm."},"SUM-BOOK-JOL":{"text":"Nach ere Heuschreckeplag rüeft de Joel zur Umkeer und verheisst, dass Gott sin Geischt uf alli usgüsst."},"SUM-BOOK-JON":{"text":"De Jona flüchtet vor em Uftrag, landet im Fisch und erläbt, dass Gott au Ninive gnädig isch."},"SUM-BOOK-JOS":{"text":"Under em Josua überquert Israel de Jordan, nimmt s Land ii und teilt s under d Stämm uf."},"SUM-BOOK-JUD":{"text":"E scharfi Warnig vor Lüüt, wo d Gnad missbruuched, und d Ermuetigung, im Glaube feschtzhalte."},"SUM-BOOK-LAM":{"text":"Föif Chlagelieder über s zerstörte Jerusalem: Trauer, Schuldbekänntnis und e Spur vo Hoffnig."},"SUM-BOOK-LEV":{"text":"Weisige für Opfer, Prieschter, Reinheit und Feschttag: Wie es Volk vor eme heilige Gott läbt."},"SUM-BOOK-LUK":{"text":"De Lukas verzellt sorgfältig vom Jesus, wo sich de Arme, de Fraue und de Usgstossne zuewändet; vili Gliichnis und d Freud über Gottes Barmherzigkeit prääged das Evangelium."},"SUM-BOOK-MAL":{"text":"De Maleachi mahnt Prieschter und Volk zur Tröi und verheisst de Bott vor em Taag vom Herr."},"SUM-BOOK-MAT":{"text":"De Matthäus verzellt vom Jesus im Zämehang mit de Schrifte vo Israel. Sini Leer vom Himelriich, sin Tod und sini Uferstehig füered zum Uftrag, Mänsche us allne Völker zu Jünger z mache."},"SUM-BOOK-MIC":{"text":"De Micha kritisiert d Mächtige und verheisst en Herrscher us Betlehem; Gott verlangt Rächt, Güeti und Demuet."},"SUM-BOOK-MRK":{"text":"De Markus verzellt chnapp und dirääkt vom Jesus: Heilige, Striitgspröch, de Wäg nach Jerusalem und s Chrüüz. Wär de Jesus isch, zeigt sich für d Läser erscht ganz under em Chrüüz."},"SUM-BOOK-NAM":{"text":"De Nahum kündt de Undergang vo Ninive aa: Gott duldet Gwalt nöd für immer."},"SUM-BOOK-NEH":{"text":"De Nehemia baut d Muur vo Jerusalem wider uf und ordnet s Läbe vo de Gmeinschaft nach em Gsetz."},"SUM-BOOK-NUM":{"text":"Israel wird zellt und zieht dur d Wüeschti; Murre, Uflenig und Gottes Fürsorg prääged de Wäg bis vor s verheissene Land."},"SUM-BOOK-OBA":{"text":"De Obadja kündt s Gricht über Edom aa, wil s a Juda nöd gholfe hät."},"SUM-BOOK-PHM":{"text":"De Paulus bittet de Philemon, de entloffe Sklav Onesimus als Brueder ufznää."},"SUM-BOOK-PHP":{"text":"En Brief voll Freud us em Gfängnis: Chrischtus als Vorbild vo de Demuet, Warnig vor falscher Sicherheit, Dank für d Hilf."},"SUM-BOOK-PRO":{"text":"Sprüch und Leere für es kluegs und grächts Läbe; d Furcht vor Gott isch de Aafang vo de Wiisheit."},"SUM-BOOK-PSA":{"text":"150 Gebät und Lieder: Lob, Chlag, Dank, Vertroue und Wut, für de einzel Mänsch und für s ganze Volk."},"SUM-BOOK-REV":{"text":"Visione vom Johannes uf Patmos: Brief a sibe Gmeinde, Gricht über d Mächt vo de Wält, de Sieg vom Lamm und s nöie Jerusalem."},"SUM-BOOK-ROM":{"text":"De Paulus entfaltet s Evangelium: Alli sind schuldig, alli wärded us Glaube grächt gsproche; es nöis Läbe im Geischt, Israel und d Gmeind."},"SUM-BOOK-RUT":{"text":"D Ruth, e Moabiterin, hält zu irer Schwigermueter Noomi und wird dur de Boas zur Urgroossmueter vom David."},"SUM-BOOK-SNG":{"text":"Liebeslieder zwüsche zwei Liebende: Seensucht, Nööchi und Freud a de Liebi."},"SUM-BOOK-TIT":{"text":"Aawiisige für de Titus uf Kreta: Elteschti iisetze, gsundi Leer, guets Läbe us de Gnad."},"SUM-BOOK-ZEC":{"text":"De Sacharja gseet Nachtvisione und redt vom chünftige Chünig, wo uf eme Esel chunnt."},"SUM-BOOK-ZEP":{"text":"De Zefanja warnt vor em Taag vom Herr und verheisst de Bliibende Freud und Ernöierig."},"SUM-CH-GEN-001":{"text":"Gott erschafft i sibe Taag Himel und Ärde, Liecht, Land, Pflanze, Tier und de Mänsch als sis Abbild; am sibte Taag rueet er."},"SUM-CH-GEN-002":{"text":"De Mänsch im Garte Eden: Gott setzt en als Gärtner ii, git em s Gebot wäge em Baum und schafft em d Frau als Gägenüber."},"SUM-CH-GEN-003":{"text":"D Schlange verfüert de Mänsch, er isst vom verbotne Baum; Scham, Schuld und d Vertriibig us em Garte folged, aber Gott sorgt wiiter für d Mänsche."},"SUM-CH-LUK-011":{"text":"De Jesus leert bätte: s Vatterunser, es Gliichnis vom bittende Fründ und d Zuesag, dass Gott de Heilig Geischt git. Es folged Striitgspröch über sini Vollmacht und scharfi Wort a Pharisäer und Gsetzesleerer."},"SUM-CH-MAT-006":{"text":"De Jesus redt über Almose, Bätte und Faschte: nöd vor de Lüüt, sondern vor Gott. I de Mitti staat s Vatterunser. Nachhär gaat s um Schätz im Himel und drum, sich nöd z sorge, sondern zerscht Gottes Riich z sueche."},"SUM-CH-MRK-003":{"text":"Heilig am Sabbat füert zu Konflikt. De Jesus berüeft di Zwölf, begägnet em Vorwurf, er wirki mit dämonischer Vollmacht, und beschriibt sini Familie vom Tue vom Gotteswile her."},"SUM-GROUP-01":{"text":"Di föif Büecher vom Mose: Schöpfig, Erzvätter, Uszug us Ägypte, Bund am Sinai und d Weisige für s Läbe als Gottes Volk, bis a d Gränze vom verheissene Land."},"SUM-GROUP-02":{"text":"D Gschichtsbüecher verzelled vo de Landnaam, de Richter, de Chünig, vom Exil und vo de Ruckkeer. Si zeiged, wie s Volk mit Gott und sine Gebot umgaat, und frööged nach Tröi und Schuld."},"SUM-GROUP-03":{"text":"Poesie und Wiisheit: Hiob ringt mit em Leide, d Psalme bätted i allne Laage, d Sprüch sammled Läbenswiisheit, de Prediger fröögt nach em Sinn, s Hoheslied singt vo de Liebi."},"SUM-GROUP-04":{"text":"Di groosse Prophete Jesaja, Jeremia, Ezechiel und Daniel (mit de Chlagelieder) reded i Kriise vo Gricht und Hoffnig: Si warne, trööschte und zeiged Gottes Plan über d Völker."},"SUM-GROUP-05":{"text":"Zwölf chürzeri Prophetebüecher, vo Hosea bis Maleachi: Rüef zur Umkeer, Gricht über Unrächt, Hoffnig uf Ernöierig und de Taag vom Herr."},"SUM-GROUP-06":{"text":"Vier Verzellige vom Jesus: Matthäus, Markus, Lukas und Johannes. Jedi zeigt sis Wirke, sini Wort, sin Tod und sini Uferstehig us em eigene Blickwinkel und für eigeni Läser."},"SUM-GROUP-07":{"text":"D Apostelgschicht verzellt, wie d Botschaft vom Jesus vo Jerusalem über Samaria bis Rom chunnt: Pfingschte, di erschti Gmeind, Petrus und Paulus."},"SUM-GROUP-08":{"text":"Brief vom Paulus a Gmeinde und Mitarbeiter: Si erkläred de Glaube, löösed Striit, ermuetiged und zeiged, wie Chrischte zäme läbe söled."},"SUM-GROUP-09":{"text":"Wiiteri Brief, vom Hebräerbrief bis zum Judasbrief: Duurehalte im Glaube, Glaube und Werk, Liebi, Warnig vor Irrleerer und Hoffnig i de Bedrängnis."},"SUM-GROUP-10":{"text":"D Offebarig vom Johannes: Bilder vo Gricht und Rettig, Trooscht für verfolgti Gmeinde und d Hoffnig uf de nöie Himel und di nöii Ärde."},"SUM-NT":{"text":"S Nöie Teschtamänt verzellt vom Läbe, Stärbe und de Uferstehig vom Jesus, vo de erschte Gmeinde und vo de Hoffnig uf d Vollendig. Vier Evangelie, d Apostelgschicht, Brief und d Offebarig lueged das us verschidene Blickwinkel aa."},"SUM-OT":{"text":"D Schrifte vo Israel verzelled vo Schöpfig, Befreiig, Bund und em Läbe vo eme Volk vor Gott. Gschicht, Chlag und Wiisheit stönd näbe prophetischer Kritik und de Hoffnig uf Ernöierig. Iri underschidliche Stimme träged Erfaarige vo Vertroue, Schiitere, Exil und Nöiaafang zäme."},"TU-MAT-006-005-015":{"title":"Vom Bätte","summary":"De Jesus warnt dervor, zum Schiin oder mit vil Wort z bätte. Er git sine Jünger s Vatterunser und betont nachhär, dass Vergäbig übercho und Vergäbig schänke zämeghööred."},"TU-MAT-006-005-008":{"title":"Nöd zum Schiin und nöd mit vil Wort","summary":"Bätte söll nöd dezue diene, dass me vor andere guet daastaat. Gott kännt d Bedürfnis scho, bevor me bittet."},"TU-MAT-006-009-013":{"title":"S Vatterunser","summary":"Es Gebät mit sibe Bitte: drüü gönd um Gottes Name, Riich und Wile, vier um das, wo d Mänsche bruuched: Broot, Vergäbig, Bewaarig und Rettig."},"TU-MAT-006-014-015":{"title":"Vergää und Vergäbig übercho","summary":"De Jesus nimmt d Bitt um Vergäbig uf: Wär andere vergit, däm vergit au Gott."},"TU-MRK-003-020-035":{"title":"Aaghörigi und Schriftgleerti urteiled über de Jesus","summary":"Zwei Gruppe urteiled über de Jesus: sini eigeni Familie und Gleerti us Jerusalem. De Markus verzellt beidi Gschichte inenand."},"TU-MRK-003-020-021":{"title":"D Aaghörige vom Jesus mached sich uf, zum en hole","summary":"De Jesus isch vo so vil Lüüt umringt, dass er nöd emal zum Ässe chunnt. Sini Aaghörige wänd en zrugghole, wil si meined, er seig nüme bi Troscht."},"TU-MRK-003-022-030":{"title":"De Striit um de Beelzebul","summary":"Gleerti us Jerusalem behaupted, de Jesus triibi d Dämone mit Hilf vom Tüüfel us. De Jesus zeigt mit Bilder, warum das nöd ufgaat, und warnt ärnschthaft dervor, s Wirke vo Gott em Bööse zuezschriibe."},"TU-MRK-003-031-035":{"title":"D Mueter und d Brüeder vom Jesus; wär zu siner Familie ghört","summary":"D Mueter und d Brüeder vom Jesus stönd dusse und lönd en rüefe. De Jesus seit: Wär tuet, was Gott will, ghört zu minere Familie."},"TU-LUK-011-001-004":{"title":"Herr, leer üs bätte","summary":"En Jünger bittet de Jesus, si bätte z leere. De Jesus antwortet mit ere churze Fassig vom Vatterunser mit föif Bitte."}},"name":"l/gsw/common","lang":"gsw"}};

    h+=`<div class="nav-block"><h4><span>${L?'Kapitel':'Chapter'}</span>${nav.c?`<button type="button" class="open" data-go="c${nav.b}-${nav.c}">${esc(L?DATA[nav.b].de:DATA[nav.b].en)} ${nav.c} ${t.open}${icon('chevron-right')}</button>`:''}</h4><div class="grid nums">${bn.children.map(cid=>{const cn=nodes.get(cid);return `<button type="button" class="${nav.c===cn.c?'cur':''}${workedCh(code,cn.c)?' study':''}" data-nav="c:${cn.c}">${cn.c}</button>`;}).join('')}</div></div>`;}
  if(nav.b!=null&&nav.c){const cn=nodes.get(`c${nav.b}-${nav.c}`),parts=cn.children.map(id=>nodes.get(id)).filter(x=>x.part),vs=cn.children.flatMap(sid=>nodes.get(sid).children);
    h+=`<div class="nav-block"><h4><span>${L?'Vers':'Verse'}</span></h4>${parts.map(x=>`<button type="button" class="row" data-go="${x.id}"><span>${esc(pTitle(x.part))} <span class="note">${x.v}–${x.last}</span></span>${icon('chevron-right')}</button>`).join('')}<div class="grid nums">${vs.map(vid=>{const v=nodes.get(vid);return `<button type="button" class="${current===vid?'cur':''}${isPilotVerse(v)?' study':''}" data-go="${vid}">${v.v}</button>`;}).join('')}</div></div>`;}
  h+=`<p class="note nav-legend"><span class="dot"></span> ${L?'ausgearbeitet':'worked out'}</p>`;
  openSheet('nav',h);renderResults();
}
function levelsSheet(){const n=nodes.get(current);openSheet('levels',head(T().levelsTitle)+T().levels.map((name,i)=>`<button type="button" class="row ${i===n.level?'current':''}" data-level="${i}"><span>${name}</span>${icon('chevron-right')}</button>`).join(''));}

/* ---------- Ereignisse ---------- */
app.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-close]');
  if(!b){if(e.target.closest('.reader'))app.classList.toggle('immersed');return;}
  if(b.dataset.dec!==undefined){const c=b.closest('[data-ref]');if(c){decisionSheet(c.dataset.ref,Number(b.dataset.dec));return;}}
  if(b.dataset.speak!==undefined){e.preventDefault();e.stopPropagation();speak(b.dataset.speak,b.dataset.speakLang,b.dataset.speakTr);return;}
  if(b.hasAttribute('data-close')){closeSheet();return;}
  if(b.dataset.deep){const n=nodes.get(b.dataset.deep);current=b.dataset.deep;go(remembered.get(current)||n.children[0]);return;}
  if(b.dataset.refGo){goRef(b.dataset.refGo);return;}
  if(b.dataset.nav){const [k,v]=b.dataset.nav.split(':');if(k==='t'){nav={t:v,g:null,b:null,c:null};}else if(k==='g'){nav.g=Number(v);nav.b=null;nav.c=null;}else if(k==='b'){nav.b=Number(v);nav.c=null;}else if(k==='c'){nav.c=Number(v);}
    const old=host.querySelector('.sheet'),y=old?old.scrollTop:0;navSheet();const sh=host.querySelector('.sheet');if(sh&&sh.scrollTo)sh.scrollTo(0,y);const last=host.querySelector('.nav-block:last-of-type');if(last&&last.scrollIntoView)last.scrollIntoView({block:'nearest'});return;}
  if(b.dataset.go){go(b.dataset.go);return;}
  if(b.dataset.level!==undefined){go(resolveLevel(Number(b.dataset.level)));return;}
  if(b.dataset.source){sourceSheet(b.dataset.source,b.dataset.verse);const sh=host.querySelector('.sheet');if(sh&&sh.scrollTo)sh.scrollTo(0,0);return;}
  if(b.dataset.more){verseSheet(b.dataset.more);return;}
  if(b.dataset.study){studySheet(b.dataset.study);return;}
  if(b.dataset.background){bgSheet(b.dataset.background);return;}
  if(b.dataset.bg){bgOne(b.dataset.bg);return;}
  if(b.dataset.set){const k=b.dataset.set,v=b.dataset.value;if(k==='lang')lang=v;else if(k==='voice')S.voice={...(S.voice||{}),[pronLang('el')]:v};else S[k]=(k==='read'||k==='rate')?Number(v):v;save();rerenderKeep();reopenMenu();return;}
  if(b.dataset.toggle){S[b.dataset.toggle]=!S[b.dataset.toggle];save();rerenderKeep();reopenMenu();return;}
  const a=b.dataset.action,n=nodes.get(current);
  if(a==='home')go('all');else if(a==='menu'){if(sheet==='menu')closeSheet();else menuSheet();}
  else if(a==='index')navSheet(true);else if(a==='back'){const tgt=jumpFrom;jumpFrom=null;go(tgt);}else if(a==='levels')levelsSheet();
  else if(a==='up')go(n.parent);else if(a==='down')go(remembered.get(current)||n.children[0]);
  else if(a==='load-next')loadMore();else if(a==='load-prev')loadMore(true);
});
app.addEventListener('input',e=>{if(e.target.type==='search'){query=e.target.value;renderResults();}});
app.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet){closeSheet();reader.focus({preventScroll:true});}});
let busy=false,lastTop=0;
reader.addEventListener('scroll',()=>{if(busy)return;busy=true;
  const y=reader.scrollTop;if(y>80&&y-lastTop>6)app.classList.add('immersed');else if(lastTop-y>6||y<40)app.classList.remove('immersed');lastTop=y;
  const top=reader.getBoundingClientRect().top+70;const active=[...reader.querySelectorAll('[data-stream]')].find(el=>el.getBoundingClientRect().bottom>top);
  if(active&&active.dataset.stream!==current){current=active.dataset.stream;for(const child of ancestors(current).slice(1))remembered.set(nodes.get(child).parent,child);chrome();aside.querySelectorAll('[data-go]').forEach(x=>x.setAttribute('aria-current',String(x.dataset.go===current)));}
  if(reader.scrollTop+reader.clientHeight>reader.scrollHeight-300)loadMore();else if(reader.scrollTop<30&&readerStart>0)loadMore(true);
  busy=false;},{passive:true});
// Weiterlesen ohne Knopf: Sobald «Weiterlesen» in die Nähe des sichtbaren Bereichs kommt, wird nachgeladen – auch wenn
// der Inhalt kürzer als der Bildschirm ist (dann gibt es kein Scroll-Ereignis). Über den Anfang bzw. das Ende hinaus
// ziehen (Mausrad, Wischen) lädt ebenfalls nach. Der Knopf bleibt als Rückfall für Tastatur und Vorlesehilfen.
const nearEnd=('IntersectionObserver' in globalThis)?new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting))requestAnimationFrame(()=>loadMore());},{root:reader,rootMargin:'0px 0px 600px 0px'}):null;
const watchEnd=()=>{if(!nearEnd)return;nearEnd.disconnect();const b=reader.querySelector('.load-after');if(b)nearEnd.observe(b);};
new MutationObserver(watchEnd).observe(reader,{childList:true,subtree:false});
reader.addEventListener('wheel',e=>{if(e.deltaY>0&&reader.scrollTop+reader.clientHeight>=reader.scrollHeight-2)loadMore();else if(e.deltaY<0&&reader.scrollTop<=0&&readerStart>0)loadMore(true);},{passive:true});
let touchY=null;
reader.addEventListener('touchstart',e=>{touchY=e.touches[0].clientY;},{passive:true});
reader.addEventListener('touchmove',e=>{if(touchY===null)return;const dy=e.touches[0].clientY-touchY;
  if(dy<-40&&reader.scrollTop+reader.clientHeight>=reader.scrollHeight-2){touchY=null;loadMore();}
  else if(dy>40&&reader.scrollTop<=0&&readerStart>0){touchY=null;loadMore(true);}},{passive:true});
reader.addEventListener('touchend',()=>{touchY=null;},{passive:true});
render();
});
if(globalThis.__BIBLE_TEST__)globalThis.__BIBLE_TEST__({nodes,verses,stats,search,sibling,ancestors,streams,BOOK_SUMMARIES,STUDY,BG,translit});
})();
