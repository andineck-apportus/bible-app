<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bibel · Lesestrom</title>
<style>
/* Ein Lesestrom über die ganze Bibel. Ruhige Fläche, Leisten treten beim Lesen zurück; Erklärungen und Hintergrund nur auf Wunsch (Blatt von unten). */
:root{color-scheme:light dark}
html,body{margin:0;height:100%;background:#f7f7f6}
#bible-stream{height:100%}
#bible-stream .app{
  --bg:#f7f7f6;--ink:#1f1f1f;--muted:#6b6b6b;--rule:#dcdcda;--soft:#ececea;--sheet:#ffffff;--scrim:rgba(20,20,20,.28);
  --read:19px;--ui:"Helvetica Neue",Arial,sans-serif;--serif:Georgia,"Iowan Old Style","Times New Roman",serif;
  position:relative;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.45 var(--ui);color-scheme:light}
#bible-stream .app[data-theme=dark]{--bg:#171717;--ink:#ececec;--muted:#a3a3a3;--rule:#343434;--soft:#262626;--sheet:#1f1f1f;--scrim:rgba(0,0,0,.55);color-scheme:dark}
html:has(.app[data-theme=dark]),html:has(.app[data-theme=dark]) body{background:#171717}
#bible-stream .app *{box-sizing:border-box}
#bible-stream .app button{font:inherit;color:inherit;border:0;border-radius:0;background:transparent;padding:0;cursor:pointer;text-align:left}
#bible-stream .app button:disabled{opacity:.3;cursor:default}
#bible-stream .app :is(button,input,[tabindex]):focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#bible-stream .app svg{display:block;width:18px;height:18px;flex:0 0 18px}
#bible-stream .logo{width:24px!important;height:25px!important;flex-basis:24px!important}

/* Leisten */
#bible-stream .bar{position:absolute;left:0;right:0;z-index:4;display:flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:transform .25s ease,opacity .25s ease}
#bible-stream .top{top:0;padding:calc(6px + env(safe-area-inset-top,0px)) 10px 6px;border-bottom:1px solid var(--rule)}
#bible-stream .dock{bottom:0;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--rule);display:grid;grid-template-columns:1fr auto 1fr}
#bible-stream .immersed .top{transform:translateY(-105%);opacity:0}
#bible-stream .immersed .dock{transform:translateY(105%);opacity:0}
#bible-stream .icon-btn{width:44px;height:44px;display:grid!important;place-items:center}
#bible-stream .location{flex:1;min-width:0;height:44px;display:flex;align-items:center;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bible-stream .dock button{height:44px;display:flex;align-items:center;gap:8px;font-size:14px;padding:0 10px}
#bible-stream .dock [data-action=down]{justify-content:flex-end}
#bible-stream .dock .depth{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 14px}

/* Lesefläche */
#bible-stream aside{display:none}
#bible-stream .reader{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:calc(76px + env(safe-area-inset-top,0px)) 22px calc(110px + env(safe-area-inset-bottom,0px))}
#bible-stream .column{max-width:36em;margin:0 auto}
#bible-stream .stream-entry{padding:34px 0 30px;border-top:1px solid var(--rule)}
#bible-stream .stream-entry:first-child{border-top:0;padding-top:8px}
#bible-stream .eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
#bible-stream h2{font:400 28px/1.15 var(--ui);letter-spacing:-.4px;margin:0 0 14px;text-wrap:balance}
#bible-stream .stream-copy{font:400 var(--read)/1.65 var(--serif);margin:0}
#bible-stream .quiet{color:var(--muted)}
#bible-stream .actions{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:20px}
#bible-stream .link{display:inline-flex!important;align-items:center;gap:8px;min-height:40px;font-size:15px;border-bottom:1px solid currentColor!important}
#bible-stream .link.soft{border-bottom-color:var(--rule)!important;color:var(--muted)}
#bible-stream .example{margin-top:18px;display:flex!important;justify-content:space-between;align-items:center;width:100%;padding:14px 0!important;border-top:1px solid var(--rule)!important;border-bottom:1px solid var(--rule)!important}

/* Verse: fliessender Text */
#bible-stream .stream-entry.verse{border:0;padding:0 0 .55em}
#bible-stream .chapter-head{font:400 30px/1.15 var(--ui);letter-spacing:-.4px;margin:30px 0 4px}
#bible-stream .part-head{font:italic 400 calc(var(--read) * .95)/1.4 var(--serif);color:var(--muted);margin:22px 0 10px}
#bible-stream .verse-line{font:400 var(--read)/1.75 var(--serif);margin:0}
#bible-stream .vno{font:500 11px/1 var(--ui);color:var(--muted);vertical-align:.6em;margin-right:4px;font-variant-numeric:tabular-nums}
#bible-stream .placeholder .stream-copy{color:var(--muted);font-size:calc(var(--read) * .8)}
#bible-stream .more{display:inline-grid!important;place-items:center;width:28px;height:28px;margin-left:4px;vertical-align:-6px;border-radius:50%!important;color:var(--muted)}
#bible-stream .more:hover{background:var(--soft);color:var(--ink)}
#bible-stream .more svg{width:15px;height:15px;flex-basis:15px}
#bible-stream .alt-line{display:block;font:italic 400 calc(var(--read) * .82)/1.5 var(--serif);color:var(--muted);margin:2px 0 8px 1.4em}
#bible-stream .part-end{margin:4px 0 18px}

#bible-stream .load{display:block;margin:24px auto 0;font-size:13px;color:var(--muted)}
#bible-stream .end{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;margin:40px 0 0}

/* Blatt */
#bible-stream .scrim{position:absolute;inset:0;background:var(--scrim);z-index:8}
#bible-stream .sheet{position:absolute;left:0;right:0;bottom:0;z-index:9;max-height:88%;overflow-y:auto;background:var(--sheet);border-top:1px solid var(--rule);padding:8px 22px calc(28px + env(safe-area-inset-bottom,0px))}
#bible-stream .sheet .column{display:flex;flex-direction:column;gap:14px}
#bible-stream .grab{width:36px;height:4px;background:var(--rule);margin:6px auto 4px}
#bible-stream .sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
#bible-stream .sheet-head h3{font:400 24px/1.2 var(--ui);margin:0}
#bible-stream .close{min-height:40px;padding:0 4px!important;color:var(--muted);font-size:14px}
#bible-stream .sheet h4{font:400 20px/1.3 var(--serif);margin:12px 0 0}
#bible-stream .sheet p{margin:0}
#bible-stream .sheet .body{font:400 17px/1.6 var(--serif)}
#bible-stream .sheet .note{font-size:14px;color:var(--muted)}
#bible-stream .point{border-left:2px solid var(--rule);padding-left:14px;display:flex;flex-direction:column;gap:6px}
#bible-stream .pair{display:grid;gap:8px}
#bible-stream .reading-card{border:1px solid var(--rule);padding:12px 14px;display:flex;flex-direction:column;gap:5px}
#bible-stream .reading-card.main{border-color:var(--ink)}
#bible-stream .tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#bible-stream .dots{display:inline-flex;gap:4px;margin-right:8px;vertical-align:middle}
#bible-stream .dots i{width:8px;height:8px;background:var(--rule)}
#bible-stream .dots i.on{background:var(--ink)}
#bible-stream .il{display:flex;flex-wrap:wrap;gap:12px 14px}
#bible-stream .il details{min-width:0}
#bible-stream .il summary{list-style:none;cursor:pointer;display:flex;flex-direction:column}
#bible-stream .il summary::-webkit-details-marker{display:none}
#bible-stream .il .g{font:400 19px/1.3 var(--serif)}
#bible-stream .il .d{font-size:13px}
#bible-stream .il .e{font-size:11.5px;color:var(--muted)}
#bible-stream .il details[open]{flex-basis:100%;border-left:2px solid var(--rule);padding-left:12px}
#bible-stream .il details[open] summary{margin-bottom:6px}
#bible-stream .kv{display:grid;grid-template-columns:9em minmax(0,1fr);gap:4px 10px;font-size:14px}
#bible-stream .kv dt{color:var(--muted)}#bible-stream .kv dd{margin:0}
#bible-stream .ref-id{font:11px/1.4 ui-monospace,Menlo,monospace;color:var(--muted);overflow-wrap:anywhere}
#bible-stream .row{display:flex!important;justify-content:space-between;align-items:center;width:100%;min-height:50px;border-top:1px solid var(--rule)!important;gap:10px}
#bible-stream .row .sub{display:block;font-size:12.5px;color:var(--muted)}
#bible-stream .row.current{font-weight:600}
#bible-stream .set{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--rule)}
#bible-stream .set .sub{display:block;font-size:13px;color:var(--muted)}
#bible-stream .seg{display:inline-flex;border:1px solid var(--rule)}
#bible-stream .seg button{padding:8px 12px!important;font-size:14px;min-height:38px}
#bible-stream .seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
#bible-stream .switch{width:46px;height:28px;background:var(--rule)!important;position:relative;flex:0 0 auto;border-radius:14px!important}
#bible-stream .switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--sheet);transition:transform .15s}
#bible-stream .switch[aria-checked=true]{background:var(--ink)!important}
#bible-stream .switch[aria-checked=true]::after{transform:translateX(18px)}
#bible-stream input[type=search]{width:100%;font:16px var(--ui);padding:12px;border:1px solid var(--rule);background:var(--bg);color:var(--ink);border-radius:0}
#bible-stream details.about summary{cursor:pointer;padding:12px 0;border-top:1px solid var(--rule)}
#bible-stream details.about div{display:flex;flex-direction:column;gap:8px;font-size:13.5px;color:var(--muted);padding-bottom:10px}
#bible-stream .live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

@media (min-width:900px){
  #bible-stream aside{display:block;position:absolute;left:0;top:57px;bottom:57px;width:230px;overflow:auto;padding:16px 8px;border-right:1px solid var(--rule)}
  #bible-stream aside button{display:block;width:100%;padding:7px 10px;font-size:13px;color:var(--muted)}
  #bible-stream aside button[aria-current=true]{color:var(--ink);box-shadow:inset 2px 0 var(--ink)}
  #bible-stream .reader{left:230px}
  #bible-stream .immersed aside{opacity:.25}
}
@media (prefers-reduced-motion:reduce){#bible-stream .bar{transition:none}}
</style></head><body>

en können.","26":"Und wenn der Satan sich gegen sich selbst erhoben hat und gespalten worden ist, kann er nicht bestehen, sondern hat ein Ende.","27":"Aber niemand kann in das Haus des Starken hineingehen und seinen Hausrat plündern, wenn er nicht zuerst den Starken bindet; und dann wird er sein Haus plündern.","28":"Amen, ich sage euch: Alles wird den Söhnen der Menschen vergeben werden, die Sünden und die Lästerungen, so viele sie auch lästern mögen.","29":"Wer aber gegen den Heiligen Geist lästert, hat auf ewig keine Vergebung, sondern ist einer ewigen Sünde schuldig.»","30":"Denn sie sagten: «Er hat einen unreinen Geist.»","31":"Und es kommen seine Mutter und seine Brüder, und draussen stehend schickten sie zu ihm und liessen ihn rufen.","32":"Und eine Menge sass um ihn herum, und sie sagen zu ihm: «Siehe, deine Mutter und deine Brüder sind draussen und suchen dich.»","33":"Und er antwortet ihnen und sagt: «Wer ist meine Mutter, und wer sind meine Brüder?»","34":"Und er blickt ringsum auf die, die im Kreis um ihn sitzen, und sagt: «Siehe, meine Mutter und meine Brüder!","35":"Denn wer den Willen Gottes tut, der ist mein Bruder und meine Schwester und meine Mutter.»"},"de_source":{"20":"TRANS-MRK-003-020-021-DE-WORKING","21":"TRANS-MRK-003-020-021-DE-WORKING","22":"TRANS-MRK-003-022-030-DE-WORKING","23":"TRANS-MRK-003-022-030-DE-WORKING","24":"TRANS-MRK-003-022-030-DE-WORKING","25":"TRANS-MRK-003-022-030-DE-WORKING","26":"TRANS-MRK-003-022-030-DE-WORKING","27":"TRANS-MRK-003-022-030-DE-WORKING","28":"TRANS-MRK-003-022-030-DE-WORKING","29":"TRANS-MRK-003-022-030-DE-WORKING","30":"TRANS-MRK-003-022-030-DE-WORKING","31":"TRANS-MRK-003-031-035-DE-WORKING","32":"TRANS-MRK-003-031-035-DE-WORKING","33":"TRANS-MRK-003-031-035-DE-WORKING","34":"TRANS-MRK-003-031-035-DE-WORKING","35":"TRANS-MRK-003-031-035-DE-WORKING"},"tok_de":{"TOK-SBLGNT-MRK-003-022-001":{"target":"Und","kind":"lexical","note":null,"first":true,"group":["TOK-SBLGNT-MRK-003-022-001"]},"TOK-SBLGNT-MRK-003 ,"subject":"TU-MRK-003-020-035","caveat":"Beobachtung am Wortlaut; ob οἱ παρʼ αὐτοῦ dieselben Personen wie Mutter und Brüder in 3,31 sind, sagt der Text nicht ausdrücklich."}],"interpretations":[{"id":"INT-MRK-0001","claim":"Die Warnung bezieht sich im Erzählkontext auf die Zuschreibung von Jesu befreiendem Wirken an eine unreine Macht.","confidence":"probable","caveat":"Der Text sagt nicht ausdrücklich, dass die Schriftgelehrten die göttliche Herkunft sicher erkannt hatten.","counter":[],"based_on":["FIND-MRK-0001","FIND-MRK-0002"],"subject":"TU-MRK-003-022-030"},{"id":"INT-MRK-0002","claim":"Die Warnung kann stärker als Beschreibung einer dauerhaften Verhärtung gelesen werden; Dauerhaftigkeit ist jedoch nicht allein aus der Verbform beweisbar.","confidence":"possible","caveat":null,"counter":[],"based_on":["FIND-MRK-0001"],"subject":"TU-MRK-003-022-030"},{"id":"INT-MRK-0003","claim":"Markus verschachtelt die beiden Szenen bewusst: Angehörige («er ist von Sinnen», 3,21) und Schriftgelehrte («er hat Beelzebul», 3,22) beurteilen Jesus je auf ihre Weise falsch. 3,35 bestimmt Zugehörigkeit zu Jesus neu über das Tun des Willens Gottes.","confidence":"probable","caveat":"Ob οἱ παρʼ αὐτοῦ in 3,21 Jesu Familie meint (so die meisten Übersetzungen) oder allgemeiner seine Leute, ist umstritten; ebenso, wer in 3,21 «sie sagten» spricht (die Angehörigen oder unbestimmt «man»). Je nach Entscheidung fällt die Parallele schwächer aus.","counter":["Die Verschachtelung kann auch erzählerisch die Zeit überbrücken, bis die Angehörigen ankommen, ohne dass ein Vergleich beabsichtigt ist."],"based_on":["FIND-MRK-0005"],"subject":"TU-MRK-003-020-035"}],"principles":[{"id":"PRIN-MRK-0001","text":"Behauptungen über Gottes Wirken sind verantwortungsvoll zu beurteilen; die bewusste Verkehrung von Gut und Böse ist nicht mit gewöhnlichem Zweifel gleichzusetzen.","confidence":"possible","derived_from":["INT-MRK-0001"]}],"applications":[{"id":"APP-MRK-0001","text":"Eine behauptete Geisteswirkung darf kritisch geprüft werden; das ist nicht automatisch Lästerung des Heiligen Geistes.","limits":"Heutige religiöse Behauptungen sind nicht ohne Weiteres mit Jesu Wirken in Markus gleichzusetzen.","principle":"PRIN-MRK-0001","context":"Deutschsprachige heutige Bibellesende","confidence":"probable"}],"relations":[{"to":"MAT.12.22-MAT.12.32","to_de":"Mt 12,22–32","kind":"parallel_passage","confidence":"high"},{"to":"LUK.11.14-LUK.11.23","to_de":"Lk 11,14–23","kind":"parallel_argument","confidence":"probable"},{"to":"LUK.12.8-LUK.12.10","to_de":"Lk 12,8–10","kind":"parallel_saying","confidence":"high"}],"questions":[{"q":"Setzt der Vorwurf der Schriftgelehrten voraus, dass sie die Wirkung des Heiligen Geistes bewusst als solche erkannt hatten?","finding":"Mk 3,22–30 belegt die Zuschreibung an Beelzebul, nicht ausdrücklich das innere Wissen der Sprecher."}],"method":{"name":"Übereinstimmung der Editionen","question":"Wie viele der verglichenen gedruckten Editionen haben eine Lesart in ihrem Text?","limits":["Misst den Konsens von Herausgebern, nicht die Bezeugung in Handschriften.","Die Editionen sind keine unabhängigen Zeugen: WH, Tregelles, NA28 und SBLGNT beruhen weitgehend auf denselben frühen Handschriften; RP steht für den byzantinischen Mehrheitstext. «4 gegen 1» bedeutet daher oft «kritische Editionen gegen Mehrheitstext».","Ältere Editionen (WH 1881, Tregelles 1857–1879) kannten viele heute bekannte Papyri nicht.","Die Angaben zu den Editionen stammen aus dem SBLGNT-Apparat und wurden nicht an den Editionen selbst geprüft.","Siglen ohne eigenen Editionsdatensatz (z. B. NIV, Greeven, Randlesarten WHmarg) werden nicht mitgezählt."]},"editions":{"ED-NA28":{"title":"Novum Testamentum Graece, 28. Auflage","year":2012},"ED-RP":{"title":"The New Testament in the Original Greek: Byzantine Textform","year":2005},"ED-SBLGNT":{"title":"SBL Greek New Testament","year":null},"ED-TREG":{"title":"The Greek New Testament","year":"1857–1879"},"ED-WH":{"title":"The New Testament in the Original Greek","year":1881}}};

const SUMS={"SUM-BIBLE":{"text":"Die Bibel versammelt Erzählungen, Gebete, Weisheit, prophetische Stimmen und Briefe. In christlicher Lesart verbindet sie die Geschichte Gottes mit Israel mit dem Leben, dem Tod und der Auferstehung Jesu sowie der Hoffnung auf eine erneuerte Schöpfung.","status":"draft"},"SUM-BOOK-1CH":{"text":"Stammbäume verorten Israel in seiner Geschichte. Die Darstellung Davids konzentriert sich besonders auf Gottesdienst, Leviten und die Vorbereitung des Tempelbaus.","status":"draft"},"SUM-BOOK-1CO":{"text":"Paulus reagiert auf Spaltungen und konkrete Konflikte in Korinth. Liebe, gemeinschaftliche Verantwortung, geistliche Gaben und die Hoffnung auf Auferstehung bilden zentrale Schwerpunkte.","status":"draft"},"SUM-BOOK-1JN":{"text":"Gottes Licht und Liebe werden zum Massstab des gemeinsamen Lebens. Der Brief verbindet das Bekenntnis zu Jesus mit geschwisterlicher Liebe und der Prüfung irreführender Ansprüche.","status":"draft"},"SUM-BOOK-1KI":{"text":"Salomo baut den Tempel; nach seiner Herrschaft zerfällt das Reich. Die Geschichte der Könige und das Wirken Elias stellen die Treue zu Gott in den Mittelpunkt.","status":"draft"},"SUM-BOOK-1PE":{"text":"Menschen in bedrängten Gemeinden werden an ihre Hoffnung und Zugehörigkeit erinnert. Ihr Verhalten soll auch unter Ablehnung von Christus und gegenseitiger Verantwortung geprägt sein.","status":"draft"},"SUM-BOOK-1SA":{"text":"Samuel begleitet den Übergang zur Königsherrschaft. Saul wird König, verliert aber seine Stellung; David tritt hervor und gerät in einen wachsenden Konflikt mit ihm.","status":"draft"},"SUM-BOOK-1TH":{"text":"Paulus stärkt eine junge Gemeinde in Bedrängnis und erinnert an die gemeinsame Beziehung. Heiligung, geschwisterliche Liebe und Hoffnung angesichts des Todes werden miteinander verbunden.","status":"draft"},"SUM-BOOK-1TI":{"text":"Weisungen betreffen Lehre, Gottesdienst und die Verantwortung verschiedener Gruppen in der Gemeinde. Ein glaubwürdiges Leben und der sorgsame Umgang mit Geld erhalten besonderes Gewicht.","status":"draft"},"SUM-BOOK-2CH":{"text":"Von Salomos Tempelbau führt die Erzählung durch die Geschichte der Könige Judas bis zum Exil. Erneuerung des Gottesdienstes und Umkehr werden zu wiederkehrenden Schwerpunkten.","status":"draft"},"SUM-BOOK-2CO":{"text":"Paulus erklärt seinen Dienst und sein Verhältnis zur Gemeinde inmitten von Spannungen. Gottes Kraft in menschlicher Schwachheit, Versöhnung und solidarisches Geben prägen den Brief.","status":"draft"},"SUM-BOOK-2JN":{"text":"Die kurze Schrift verbindet Wahrheit und gegenseitige Liebe. Sie mahnt zur Unterscheidung gegenüber Lehren, die das Bekenntnis zu Christus untergraben.","status":"draft"},"SUM-BOOK-2KI":{"text":"Die Königsgeschichten führen zum Untergang Israels und Judas sowie ins Exil. Propheten wie Elisa begleiten diese Zeit; politische Macht wird an der Verantwortung vor Gott gemessen.","status":"draft"},"SUM-BOOK-2PE":{"text":"Der Brief warnt vor zerstörerischer Lehre und bekräftigt die Erwartung von Gottes kommender Welt. Erkenntnis und Hoffnung sollen mit einem verantwortlichen Leben verbunden bleiben.","status":"draft"},"SUM-BOOK-2SA":{"text":"David wird König über ganz Israel und macht Jerusalem zu seinem Zentrum. Seine Herrschaft umfasst Verheissung und Erfolge, aber auch Schuld, familiäre Gewalt und politische Krisen.","status":"draft"},"SUM-BOOK-2TH":{"text":"Der Brief ermutigt zu Standhaftigkeit und korrigiert Verunsicherung über den Tag des Herrn. Erwartung der Zukunft soll mit verantwortlichem Leben in der Gegenwart verbunden bleiben.","status":"draft"},"SUM-BOOK-2TI":{"text":"Timotheus wird zu Treue, Ausdauer und verantwortlicher Weitergabe der Botschaft ermutigt. Leiden, Schrift und Verkündigung prägen den persönlichen Ton des Briefes.","status":"draft"},"SUM-BOOK-3JN":{"text":"Gastfreundschaft und Unterstützung reisender Glaubensgeschwister werden gewürdigt. Ein Konflikt um Leitung und Anerkennung zeigt zugleich Spannungen innerhalb der Gemeinschaft.","status":"draft"},"SUM-BOOK-ACT":{"text":"Die Botschaft von Jesus breitet sich durch das Wirken des Geistes von Jerusalem bis nach Rom aus. Neue Gemeinschaften entstehen und ringen darum, wie Menschen unterschiedlicher Herkunft dazugehören.","status":"draft"},"SUM-BOOK-AMO":{"text":"Amos kritisiert Ausbeutung, Selbstsicherheit und einen Gottesdienst ohne Gerechtigkeit. Die Gerichtsworte richten sich auch gegen Israel; am Ende steht eine Aussicht auf Wiederherstellung.","status":"draft"},"SUM-BOOK-COL":{"text":"Christus wird als Mittelpunkt von Schöpfung und Versöhnung dargestellt. Der Brief warnt vor konkurrierenden Bindungen und verbindet das neue Leben mit alltäglichem Verhalten.","status":"draft"},"SUM-BOOK-DAN":{"text":"Erzählungen von Treue unter fremden Herrschern stehen neben Visionen über Reiche, Bedrängnis und Gottes Herrschaft. Menschliche Macht erscheint begrenzt; Hoffnung reicht über sie hinaus.","status":"draft"},"SUM-BOOK-DEU":{"text":"Mose blickt auf den bisherigen Weg zurück und legt Gottes Weisungen für das Leben im Land aus. Israel wird aufgerufen, Gott zu lieben und den Bund auch in Zukunft zu bewahren.","status":"draft"},"SUM-BOOK-ECC":{"text":"Der Prediger prüft Arbeit, Genuss, Weisheit und menschliche Leistung angesichts von Vergänglichkeit und Tod. Die Grenzen menschlicher Verfügung stehen neben dem Aufruf, die gegebenen Freuden anzunehmen.","status":"draft"},"SUM-BOOK-EPH":{"text":"Die Einheit von Menschen aus unterschiedlichen Völkern in Christus steht im Zentrum. Daraus folgen Bilder von Gemeinde und konkrete Weisungen für ein erneuertes Zusammenleben.","status":"draft"},"SUM-BOOK-EST":{"text":"Am persischen Königshof gerät die jüdische Bevölkerung in tödliche Gefahr. Ester und Mordechai handeln gegen Hamans Plan; die Rettung wird zum Hintergrund des Purimfestes.","status":"draft"},"SUM-BOOK-EXO":{"text":"Gott befreit Israel aus der Sklaverei in Ägypten. Am Sinai erhält das Volk den Bund und Weisungen für ein gemeinsames Leben; das Heiligtum steht für Gottes Gegenwart in seiner Mitte.","status":"draft"},"SUM-BOOK-EZK":{"text":"Hesekiel spricht zu Menschen im Exil und deutet den Verlust Jerusalems. Visionen von neuer Lebenskraft, einem neuen Herzen und erneuerter Gottesgegenwart öffnen einen Zukunftshorizont.","status":"draft"},"SUM-BOOK-EZR":{"text":"Menschen kehren aus dem Exil zurück und bauen den Tempel wieder auf. Esra lehrt die Tora; die Gemeinschaft ringt um ihre religiöse Identität und ihre Grenzen.","status":"draft"},"SUM-BOOK-GAL":{"text":"Der Brief verteidigt die Freiheit der Glaubenden gegenüber der Forderung nach Beschneidung. Das Leben aus Glauben und Geist soll in tätiger Liebe Gestalt gewinnen.","status":"draft"},"SUM-BOOK-GEN":{"text":"Die Erzählung führt von der Schöpfung und den Anfängen der Menschheit zu Abraham und seiner Familie. Verheissung, Vertrauen und Konflikte prägen den Weg, der mit Josef in Ägypten endet.","status":"draft"},"SUM-BOOK-HAB":{"text":"Habakuk fragt Gott nach Unrecht und nach der Gewalt derer, die es bestrafen sollen. Das Gespräch mündet in eine Haltung des Vertrauens trotz anhaltender Bedrängnis.","status":"draft"},"SUM-BOOK-HAG":{"text":"Haggai fordert die Heimgekehrten auf, den Wiederaufbau des Tempels ernst zu nehmen. Ihre Prioritäten werden hinterfragt und mit Gottes Zusage seiner Gegenwart verbunden.","status":"draft"},"SUM-BOOK-HEB":{"text":"Jesus wird als Hohepriester und Mittler eines neuen Bundes entfaltet. Die Auslegung der Schriften mündet in Ermutigung zu Vertrauen, Ausdauer und gegenseitiger Unterstützung.","status":"draft"},"SUM-BOOK-HOS":{"text":"Hoseas Ehe wird zum Bild für Israels verletzte Beziehung zu Gott. Gericht und die Kritik an Untreue stehen neben Gottes bleibender Zuwendung und dem Ruf zur Umkehr.","status":"draft"},"SUM-BOOK-ISA":{"text":"Gericht über Unrecht und Untreue steht neben der Hoffnung auf Rettung und Erneuerung. Das Buch verbindet die Heiligkeit Gottes mit Trost für sein Volk und einer weiten Zukunftsperspektive.","status":"draft"},"SUM-BOOK-JAS":{"text":"Glaube soll im Handeln sichtbar werden. Der Brief verbindet den Umgang mit Armen, die Macht der Sprache, Weisheit und Geduld zu einer praktischen Mahnung.","status":"draft"},"SUM-BOOK-JDG":{"text":"Auf Abkehr und Bedrängnis folgen immer wieder Rettung und erneutes Scheitern. Die Geschichten der Richter zeigen zugleich eine zunehmende gesellschaftliche und religiöse Zerrüttung.","status":"draft"},"SUM-BOOK-JER":{"text":"Jeremia warnt Juda vor den Folgen seines Handelns und erlebt den Zusammenbruch Jerusalems. Neben Klage und Gericht stehen die Verheissung der Rückkehr und eines neuen Bundes.","status":"draft"},"SUM-BOOK-JHN":{"text":"Zeichen und ausführliche Gespräche erschliessen Jesu Beziehung zum Vater. Sein Tod und seine Auferstehung werden im Horizont von Leben, Liebe, Glauben und bleibender Gemeinschaft erzählt.","status":"draft"},"SUM-BOOK-JOB":{"text":"Hiob verliert Besitz, Familie und Gesundheit. In Klagen und Streitgesprächen wird die einfache Gleichsetzung von Leiden und Schuld hinterfragt; die Begegnung mit Gott verändert die Perspektive.","status":"draft"},"SUM-BOOK-JOL":{"text":"Eine schwere Plage wird zum Anlass für Klage und Umkehr. Die Erwartung des Tages Gottes verbindet sich mit Wiederherstellung und der Verheissung, Gottes Geist werde ausgegossen.","status":"draft"},"SUM-BOOK-JON":{"text":"Jona flieht vor seinem Auftrag nach Ninive und erlebt Gottes Erbarmen selbst. Als die Stadt umkehrt, muss er sich mit einer Barmherzigkeit auseinandersetzen, die seine eigenen Grenzen überschreitet.","status":"draft"},"SUM-BOOK-JOS":{"text":"Unter Josua überschreitet Israel den Jordan, nimmt das Land ein und verteilt es unter die Stämme. Am Ende steht die Aufforderung, Gott treu zu bleiben.","status":"draft"},"SUM-BOOK-JUD":{"text":"Judas warnt vor Menschen, deren Verhalten und Lehre die Gemeinschaft gefährden. Die Lesenden sollen im Glauben bleiben und anderen mit Barmherzigkeit und Unterscheidung begegnen.","status":"draft"},"SUM-BOOK-LAM":{"text":"Die Zerstörung Jerusalems wird in dichterischen Klagen betrauert. Leid, Schuld und die Frage nach Gottes Nähe werden ohne vorschnelle Auflösung ausgesprochen.","status":"draft"},"SUM-BOOK-LEV":{"text":"Opfer, Reinheit und Heiligkeit ordnen das Leben Israels vor Gott. Neben dem Gottesdienst stehen der Umgang mit Mitmenschen, Gerechtigkeit und die Verantwortung für das Land im Mittelpunkt.","status":"draft"},"SUM-BOOK-LUK":{"text":"Lukas betont Gottes Zuwendung zu Armen, Ausgegrenzten und Verlorenen. Jesu Weg nach Jerusalem führt durch Tod und Auferstehung zur Sendung seiner Zeugen.","status":"draft"},"SUM-BOOK-MAL":{"text":"Streitgespräche legen nachlässigen Gottesdienst und beschädigte Beziehungen offen. Der Aufruf zur Treue steht neben der Erwartung eines kommenden Boten und des Tages Gottes.","status":"draft"},"SUM-BOOK-MAT":{"text":"Matthäus erzählt von Jesus im Zusammenhang der Schriften Israels. Seine Lehre vom Himmelreich, sein Tod und seine Auferstehung führen zum Auftrag, Menschen aus allen Völkern zu Jüngern zu machen.","status":"draft"},"SUM-BOOK-MIC":{"text":"Micha prangert Machtmissbrauch, Ausbeutung und falsche Sicherheit an. Gerichtsworte stehen neben Bildern von Frieden, einem kommenden Herrscher und einem Leben in Gerechtigkeit und Demut.","status":"draft"},"SUM-BOOK-MRK":{"text":"Markus schildert Jesu Wirken, seine Vollmacht und den wachsenden Widerstand gegen ihn. Der Weg nach Jerusalem, das Kreuz und die Botschaft vom leeren Grab fordern das Verständnis seiner Identität heraus.","status":"draft"},"SUM-BOOK-NAM":{"text":"Nahum kündigt den Untergang Ninives an. Die Gewalt der assyrischen Macht wird aus der Perspektive ihres bevorstehenden Endes und der Entlastung ihrer Opfer betrachtet.","status":"draft"},"SUM-BOOK-NEH":{"text":"Nehemia organisiert den Wiederaufbau Jerusalems und begegnet äusserem Widerstand sowie innerer Ungerechtigkeit. Das öffentliche Hören der Tora begleitet die Neuordnung der Gemeinschaft.","status":"draft"},"SUM-BOOK-NUM":{"text":"Israel zieht durch die Wüste und erlebt Versorgung, Widerstand und die Folgen fehlenden Vertrauens. Eine neue Generation bereitet sich auf den Einzug in das verheissene Land vor.","status":"draft"},"SUM-BOOK-OBA":{"text":"Edom wird wegen seines Verhaltens gegenüber Juda zur Verantwortung gezogen. Das kurze Buch verbindet den Fall menschlichen Hochmuts mit der Erwartung von Gottes Herrschaft.","status":"draft"},"SUM-BOOK-PHM":{"text":"Paulus bittet Philemon, Onesimus in neuer Weise aufzunehmen. Die Beziehung zwischen den Beteiligten wird unter dem Vorzeichen gemeinsamer Zugehörigkeit zu Christus angesprochen.","status":"draft"},"SUM-BOOK-PHP":{"text":"Freude und Verbundenheit prägen den Brief trotz Gefangenschaft und Unsicherheit. Christi Weg der Erniedrigung und Erhöhung dient als Orientierung für Demut und gemeinsames Handeln.","status":"draft"},"SUM-BOOK-PRO":{"text":"Kurze Weisheitssprüche und längere Lehrreden fragen nach einem gelingenden Leben. Gottesfurcht, gerechtes Handeln, Sprache, Arbeit und Beziehungen werden aus verschiedenen Blickwinkeln betrachtet.","status":"draft"},"SUM-BOOK-PSA":{"text":"Die Psalmen versammeln Gebete und Lieder aus Freude, Angst, Schuld, Dank und Hoffnung. Persönliche Erfahrungen und die Geschichte Israels werden vor Gott ausgesprochen.","status":"draft"},"SUM-BOOK-REV":{"text":"Visionen stellen die bedrängten Gemeinden in den Horizont von Gottes Gericht und Erneuerung. Der Sieg des Lammes führt zur Hoffnung auf eine neue Schöpfung und Gottes Wohnen bei den Menschen.","status":"draft"},"SUM-BOOK-ROM":{"text":"Paulus entfaltet seine Botschaft von Gottes Gerechtigkeit, Glauben und neuem Leben. Die Stellung Israels und das Zusammenleben der Gemeinde gehören zu dieser umfassenden Argumentation.","status":"draft"},"SUM-BOOK-RUT":{"text":"Rut bleibt ihrer Schwiegermutter Noomi in Not und Fremde verbunden. Durch ihre Begegnung mit Boas entstehen Schutz, eine neue Familie und eine Verbindung zur späteren Geschichte Davids.","status":"draft"},"SUM-BOOK-SNG":{"text":"Poetische Stimmen erzählen von Sehnsucht, Schönheit und gegenseitiger Liebe. Begegnung, Suche und Freude an der geliebten Person prägen die Sammlung.","status":"draft"},"SUM-BOOK-TIT":{"text":"Titus erhält Weisungen zur Ordnung der Gemeinden und zur Auswahl verantwortlicher Personen. Gottes Gnade soll sich in besonnenem Verhalten und guten Werken zeigen.","status":"draft"},"SUM-BOOK-ZEC":{"text":"Visionen und prophetische Worte ermutigen zum Wiederaufbau und zur Erneuerung Jerusalems. Hoffnung auf gerechte Herrschaft und Gottes kommende Nähe reicht über die unmittelbare Situation hinaus.","status":"draft"},"SUM-BOOK-ZEP":{"text":"Der Tag Gottes erscheint als Gericht über Juda und die Völker. Zugleich eröffnet sich Hoffnung für eine demütige Gemeinschaft, die Zuflucht bei Gott sucht.","status":"draft"},"SUM-CH-GEN-001":{"text":"Gott schafft die Welt durch sein Wort. Die Erzählung ordnet Licht, Himmel, Land und Leben in eine Abfolge von Tagen und bezeichnet die Schöpfung als gut. Der Mensch wird als Gottes Bild geschaffen.","status":"draft"},"SUM-CH-GEN-002":{"text":"Gottes Ruhe schliesst die Schöpfungserzählung ab. Eine weitere Erzählperspektive führt in den Garten Eden und beschreibt den Menschen, seinen Auftrag und die Beziehung von Mann und Frau.","status":"draft"},"SUM-CH-GEN-003":{"text":"Der Mensch überschreitet Gottes Gebot. Scham, gegenseitige Schuldzuweisung und gestörte Beziehungen treten hervor; die Erzählung endet mit dem Verlassen des Gartens.","status":"draft"},"SUM-CH-MRK-003":{"text":"Heilung am Sabbat führt zu Konflikten. Jesus beruft die Zwölf, begegnet dem Vorwurf dämonischer Vollmacht und beschreibt seine Familie vom Tun des Willens Gottes her.","status":"draft"},"SUM-GROUP-01":{"text":"Die Tora führt von den Anfängen der Welt zur Entstehung Israels. Verheissung und Befreiung bilden den Hintergrund der Weisungen für ein gemeinsames Leben vor Gott. Die Erzählung endet vor dem Einzug in das Land.","status":"draft"},"SUM-GROUP-02":{"text":"Diese Bücher erzählen vom Leben Israels im Land, von Königsherrschaft, Zusammenbruch und Rückkehr. Sie fragen nach Treue, Verantwortung und den Folgen politischer und religiöser Entscheidungen.","status":"draft"},"SUM-GROUP-03":{"text":"Gebete, Liebesdichtung und Weisheitsliteratur geben Erfahrungen des Lebens eine Sprache. Freude und Leiden, Gerechtigkeit und Vergänglichkeit werden vor Gott und im menschlichen Alltag bedacht.","status":"draft"},"SUM-GROUP-04":{"text":"Die prophetischen Bücher verbinden die Kritik an Unrecht und Untreue mit Klage und Zukunftshoffnung. Die Krisen Jerusalems und das Exil bilden wichtige geschichtliche Horizonte.","status":"draft"},"SUM-GROUP-05":{"text":"Die zwölf kürzeren Prophetenbücher sprechen in unterschiedlichen Situationen von Gericht und Umkehr. Gottes Treue, soziale Gerechtigkeit und die Hoffnung auf Wiederherstellung verbinden viele ihrer Stimmen.","status":"draft"},"SUM-GROUP-06":{"text":"Vier Evangelien erzählen von Jesus mit unterschiedlichen Schwerpunkten. Sein Wirken und seine Lehre führen zu den Erzählungen von Kreuz und Auferstehung.","status":"draft"},"SUM-GROUP-07":{"text":"Die Apostelgeschichte erzählt, wie sich die Botschaft von Jesus von Jerusalem in die weitere Welt ausbreitet. Begegnungen, Konflikte und das Wirken des Geistes prägen diesen Weg.","status":"draft"},"SUM-GROUP-08":{"text":"Die unter dem Namen des Paulus überlieferten Briefe verbinden die Botschaft von Christus mit konkreten Fragen des Gemeindelebens. Einheit, Freiheit, Hoffnung und tätige Liebe werden in wechselnden Situationen entfaltet.","status":"draft"},"SUM-GROUP-09":{"text":"Diese Briefe und die als Hebräerbrief bezeichnete Schrift sprechen Gemeinden in unterschiedlichen Herausforderungen an. Glauben, Ausdauer, Liebe und die Unterscheidung von Lehren sind wiederkehrende Themen.","status":"draft"},"SUM-GROUP-10":{"text":"Die Offenbarung verwendet Bilder und Visionen, um Bedrängnis und Weltmacht im Horizont von Gottes Herrschaft zu deuten. Am Ende steht die Hoffnung auf eine erneuerte Schöpfung.","status":"draft"},"SUM-NT":{"text":"Das Neue Testament erzählt von Jesus und davon, wie seine Botschaft Menschen und Gemeinschaften verändert. Die Evangelien, die Apostelgeschichte und die Briefe erschliessen Leben, Glauben und Nachfolge aus unterschiedlichen Situationen. Die Offenbarung richtet den Blick auf Gericht, Hoffnung und eine neue Schöpfung.","status":"draft"},"SUM-OT":{"text":"Die Schriften Israels erzählen von Schöpfung, Befreiung, Bund und dem Leben eines Volkes vor Gott. Geschichte, Klage und Weisheit stehen neben prophetischer Kritik und der Hoffnung auf Erneuerung. Ihre unterschiedlichen Stimmen tragen Erfahrungen von Vertrauen, Scheitern, Exil und Neubeginn zusammen.","status":"draft"}};

function search(q){q=q.trim();if(!q)return[];const match=q.match(/^(.+?)\s*(\d+)(?:\s*[:,]\s*(\d+))?$/);if(match){const name=norm(match[1]),c=Number(match[2]),v=match[3]?Number(match[3]):null;const candidates=DATA.map((b,i)=>({b,i})).filter(({b})=>[b.de,b.en,b.abbr,...b.alias].some(s=>norm(s)===name));return candidates.map(({i})=>nodes.get(v?`v${i}-${c}-${v}`:`c${i}-${c}`)).filter(Boolean);}const needle=norm(q);return DATA.map((b,i)=>({b,i})).filter(({b})=>[b.de,b.en,b.abbr,...b.alias].some(s=>norm(s).includes(needle))).map(({i})=>nodes.get('b'+i));}

const T=()=>ui[lang];
const bookName=n=>DATA[n.b][lang];
const sep=()=>lang==='de'?',':':';
function title(n){if(n.level<3)return n[lang];if(n.level===3)return bookName(n);if(n.level===4)return bookName(n)+' '+n.c;if(n.level===5)return bookName(n)+' '+n.c+sep()+n.v+'–'+n.last;return bookName(n)+' '+n.c+sep()+n.v;}
const refDe=r=>{const m=r.match(/^MRK\.3\.(\d+)(?:-MRK\.3\.(\d+))?$/);return m?(lang==='de'?'Markus 3,':'Mark 3:')+m[1]+(m[2]?'–'+m[2]:''):r;};
function summary(n){
  if(n.part)return n.part.summary;
  if(n.level===6)return n.b===MRK&&n.c===3&&MARKUS.de[n.v]?MARKUS.de[n.v]:null;
  if(n.level===0)return SUMS['SUM-BIBLE']?.text;
  if(n.level===1)return SUMS[n.id==='ot'?'SUM-OT':'SUM-NT']?.text;
  if(n.level===2)return SUMS['SUM-GROUP-'+String(n.gi+1).padStart(2,'0')]?.text;
  if(n.level===3)return BOOK_SUMMARIES[n.b];
  if(n.level===4)return SUMS['SUM-CH-'+DATA[n.b].code+'-'+String(n.c).padStart(3,'0')]?.text||null;
  return null;
}
function eyebrow(n){if(n.level===0)return '';const p=nodes.get(n.parent);if(n.level===5)return n.part?refDe(n.part.range):title(p);return title(p);}
const isPilotVerse=n=>n.level===6&&n.b===MRK&&n.c===3&&MARKUS.de[n.v];
const altsFor=v=>MARKUS.alternatives.filter(a=>a.verse===v);
const greekRun=/[\u0370-\u03ff\u1f00-\u1fff][\u0370-\u03ff\u1f00-\u1fff\s\u02bc\u2019]*[\u0370-\u03ff\u1f00-\u1fff]/g;
const plain=t=>S.advanced?String(t??''):String(t??'').replace(greekParen,'').replace(greekRun,()=>lang==='de'?'der griechische Ausdruck':'the Greek phrase');

/* ---------- Einträge ---------- */
function entry(id){
  const n=nodes.get(id),t=T();
  if(n.level===6)return verseEntry(n);
  const text=summary(n);
  const deep=n.children.length?`<button type="button" class="link" data-deep="${id}">${t.deeper[n.level]}${icon('arrow-down')}</button>`:'';
  const study=n.part?`<button type="button" class="link soft" data-study="${id}">${t.understand}</button>`:'';
  const example=(n.id==='b'+MRK||n.id===`c${MRK}-3`)?`<button type="button" class="example" data-go="${MARKUS.section.parts[0].id}"><span>${t.example}</span>${icon('chevron-right')}</button>`:'';
  const heading=n.level===5&&n.part?n.part.title:(n.level===5?(lang==='de'?'Verse ':'Verses ')+n.v+'–'+n.last:title(n));
  const copy=text?`<p class="stream-copy">${esc(text)}</p>`:`<p class="stream-copy quiet">${n.level===5?t.noPart:t.noSummary}</p>`;
  return `<article class="stream-entry" data-stream="${id}">${eyebrow(n)?`<p class="eyebrow">${esc(eyebrow(n))}</p>`:''}<h2>${esc(heading)}</h2>${copy}${example}<div class="actions">${deep}${study}</div></article>`;
}
function verseEntry(n){
  const t=T(),text=summary(n);let lead='';
  if(n.v===1)lead+=`<h2 class="chapter-head">${esc(bookName(n)+' '+n.c)}</h2>`;
  const p=nodes.get(n.parent);if(p.part&&p.v===n.v)lead+=`<h3 class="part-head">${esc(p.part.title)}</h3>`;
  if(!text)return `<article class="stream-entry verse placeholder" data-stream="${n.id}">${lead}<p class="verse-line"><span class="vno">${n.v}</span><span class="stream-copy">${t.placeholder}</span></p></article>`;
  const alts=altsFor(n.v);
  const more=(alts.length||S.advanced)?`<button type="button" class="more" data-more="${n.id}" aria-label="${t.more} ${n.v}">${icon('plus')}</button>`:'';
  const inline=S.inline?alts.map(a=>`<span class="alt-line" data-alternative="${esc(a.variant)}">${lang==='de'?'oder':'or'}: «${esc(a.to)}»</span>`).join(''):'';
  const end=p.part&&p.last===n.v?`<div class="part-end"><button type="button" class="link soft" data-study="${p.id}">${t.understand}</button></div>`:'';
  return `<article class="stream-entry verse" data-stream="${n.id}">${lead}<p class="verse-line"><span class="vno">${n.v}</span><span class="stream-copy">${esc(text)}</span>${more}</p>${inline}${end}</article>`;
}
function streamMarkup(){const ids=streams[nodes.get(current).level];const t=T();return `<div class="column">${readerStart?`<button type="button" class="load load-before" data-action="load-prev">${t.loadPrev}</button>`:''}${ids.slice(readerStart,readerEnd).map(entry).join('')}${readerEnd<ids.length?`<button type="button" class="load load-after" data-action="load-next">${t.loadNext}</button>`:`<p class="end">${t.end}</p>`}</div>`;}
function loadMore(before=false){
  const ids=streams[nodes.get(current).level],col=reader.querySelector('.column'),t=T();if(!col)return;
  if(before&&readerStart>0){const old=reader.scrollHeight,start=Math.max(0,readerStart-10);col.querySelector('.load-before')?.remove();col.insertAdjacentHTML('afterbegin',(start>0?`<button type="button" class="load load-before" data-action="load-prev">${t.loadPrev}</button>`:'')+ids.slice(start,readerStart).map(entry).join(''));readerStart=start;reader.scrollTop+=reader.scrollHeight-old;}
  else if(!before&&readerEnd<ids.length){col.querySelector('.load-after')?.remove();const end=Math.min(readerEnd+10,ids.length);col.insertAdjacentHTML('beforeend',ids.slice(readerEnd,end).map(entry).join('')+(end<ids.length?`<button type="button" class="load load-after" data-action="load-next">${t.loadNext}</button>`:`<p class="end">${t.end}</p>`));readerEnd=end;}
}

/* ---------- Leisten ---------- */
function chrome(){
  const n=nodes.get(current),t=T();app.lang=lang;
  app.querySelector('.location').textContent=title(n);
  app.querySelector('.location').setAttribute('aria-label',t.contents+': '+title(n));
  app.querySelector('[data-action=home]').setAttribute('aria-label',t.home);
  app.querySelector('[data-action=menu]').innerHTML=icon('menu');app.querySelector('[data-action=menu]').setAttribute('aria-label',t.menu);
  app.querySelector('[data-action=up]').innerHTML=icon('arrow-up')+'<span>'+t.up+'</span>';
  app.querySelector('[data-action=down]').innerHTML='<span>'+t.down+'</span>'+icon('arrow-down');
  app.querySelector('.depth').textContent=t.levels[n.level];
  app.querySelector('[data-action=up]').disabled=!n.parent;app.querySelector('[data-action=down]').disabled=!n.children.length;
  reader.setAttribute('aria-label',T().bible);
}
function sidebar(){const n=nodes.get(current),ids=n.level<=3?streams[n.level||1]:nodes.get(n.parent).children;aside.innerHTML=ids.slice(0,200).map(id=>`<button type="button" data-go="${id}" aria-current="${id===current}">${esc(nodes.get(id).level===5&&nodes.get(id).part?nodes.get(id).part.title:title(nodes.get(id)))}</button>`).join('');}
function render(){applyPrefs();chrome();sidebar();const n=nodes.get(current);const r=savedStreams.get(n.level);if(r&&r.id===current){readerStart=r.start;readerEnd=r.end;}else{readerStart=n.si;readerEnd=Math.min(n.si+10,streams[n.level].length);}reader.innerHTML=streamMarkup();}
function saveStream(){savedStreams.set(nodes.get(current).level,{id:current,start:readerStart,end:readerEnd,offset:reader.scrollTop});}
function go(id){if(!id||!nodes.has(id))return;saveStream();for(const child of ancestors(id).slice(1))remembered.set(nodes.get(child).parent,child);current=id;closeSheet();const r=savedStreams.get(nodes.get(id).level);render();reader.scrollTop=r&&r.id===id?r.offset:0;app.classList.remove('immersed');app.querySelector('.live').textContent=title(nodes.get(id));}
function resolveLevel(level){let n=nodes.get(current);while(n.level>level)n=nodes.get(n.parent);while(n.level<level)n=nodes.get(remembered.get(n.id)||n.children[0]);return n.id;}

/* ---------- Blätter ---------- */
function openSheet(kind,html){sheet=kind;host.innerHTML=`<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-modal="true"><div class="column"><div class="grab"></div>${html}</div></div>`;host.querySelector('.close')?.focus({preventScroll:true});}
function closeSheet(){sheet=null;host.innerHTML='';}
const head=(title,close)=>`<div class="sheet-head"><h3>${esc(title)}</h3><button type="button" class="close" data-close>${close||T().close}</button></div>`;
const dots=(n,of)=>n==null?'':`<span class="dots" aria-hidden="true">${Array.from({length:of},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('')}</span>`;
const support=(n,of)=>n==null?(lang==='de'?'Einige alte Handschriften lesen so; diese Angabe ist noch nicht geprüft.':'Reported in some old manuscripts; not yet verified.'):(lang==='de'?`Steht in ${n} von ${of} wichtigen Textausgaben.`:`Found in ${n} of ${of} major editions.`);

function verseSheet(id){
  const n=nodes.get(id),t=T(),alts=altsFor(n.v);
  let h=head(title(n))+`<p class="body">${esc(MARKUS.de[n.v])}</p>`;
  if(alts.length){
    h+=`<h4>${lang==='de'?'Andere Lesarten':'Other readings'}</h4><p class="note">${lang==='de'?'Die alten Handschriften stimmen hier nicht ganz überein. Die Möglichkeiten stehen nebeneinander; niemand entscheidet für dich, welche «richtig» ist.':'Old manuscripts differ here. The options stand side by side.'}</p>`;
    h+=alts.map(a=>`<div class="pair" data-alternative="${esc(a.variant)}"><div class="reading-card main"><span class="tag">${lang==='de'?'Im Lesetext':'In the text'}</span><span class="body">«${esc(a.from)}»</span><span class="note">${dots(a.base_support,a.of)}${a.base_support!=null?support(a.base_support,a.of):(lang==='de'?'So steht es in den verglichenen Textausgaben.':'As in the compared editions.')}</span></div><div class="reading-card"><span class="tag">${lang==='de'?'Andere Lesart':'Other reading'}</span><span class="body">«${esc(a.to)}»</span><span class="note">${dots(a.support,a.of)}${support(a.support,a.of)}</span></div><p class="note">${esc(a.note||'')}</p></div>`).join('');
  }
  if(S.advanced){
    const words=MARKUS.words.filter(w=>w.v===n.v),vars=MARKUS.variants.filter(v=>v.ref===n.canonicalRef);
    h+=`<h4>${lang==='de'?'Griechisch Wort für Wort':'Greek word by word'}</h4><div class="il">${words.map(w=>{const m=w.mac,d=MARKUS.tok_de[w.id];const de=d?(d.target===null?'·':(d.first?d.target:'″')):(m.gloss_berean||'');const form=['person','tense','voice','mood','case','number','gender'].map(k=>m[k]&&GR[k][m[k]]).filter(Boolean).join(', ');
      return `<details><summary><span class="g">${esc(w.text.replace(/[⸀-⸅]/g,''))}</span><span class="d">${esc(de)}</span><span class="e">${esc(m.gloss_berean||'')}</span></summary><dl class="kv"><dt>Grundform</dt><dd>${esc(m.lemma||'')} · ${w.freq}× in Markus</dd><dt>Wortart</dt><dd>${esc(POS[m.pos]||m.pos||'')}</dd>${form?`<dt>Form</dt><dd>${esc(form)}</dd>`:''}${m.role?`<dt>Satzrolle</dt><dd>${esc(ROLE[m.role]||m.role)}</dd>`:''}${d&&d.note?`<dt>Hinweis</dt><dd>${esc(d.note)}</dd>`:''}${w.mgnt?`<dt>MorphGNT</dt><dd>${esc(w.mgnt.lemma)} · ${esc(w.mgnt.parsing)}</dd>`:''}</dl><p class="ref-id">${esc(w.id)}</p></details>`;}).join('')}</div>`;
    if(vars.length)h+=`<h4>${lang==='de'?'Vergleich der Textausgaben':'Edition comparison'}</h4><p class="note">${lang==='de'?'Vergleich gedruckter Textausgaben laut SBLGNT-Apparat. Keine Handschriftenzählung.':'Comparison of printed editions (SBLGNT apparatus). Not a manuscript count.'}</p>`+vars.map(v=>`<div class="point">${v.readings.map(r=>{const a=(v.assessment||[]).find(x=>x.reading===r.id);return `<p><span class="body">${esc(r.text)}</span> <span class="note">${a?esc(a.editions.map(e=>ED[e]).join(', '))+` (${a.support}/${a.of})`:esc((r.witnesses||[]).join(', ')+(lang==='de'?' · berichtet, ungeprüft':' · reported, unverified'))}</span></p>`;}).join('')}<p class="ref-id">${esc(v.id)}</p></div>`).join('');
    h+=sourcesBlock()+`<p class="ref-id">${esc(MARKUS.de_source[n.v])}</p>`;
  }else{
    h+=`<p class="note">${lang==='de'?'Griechischer Text, Grammatik und Quellen: im Menü «Urtext und Details» einschalten.':'Greek text, grammar and sources: turn on “Original text and details” in the menu.'}</p>`;
  }
  const p=nodes.get(n.parent);if(p.part)h+=`<button type="button" class="link soft" data-study="${p.id}">${t.understand}</button>`;
  openSheet('verse',h);
}
function sourcesBlock(){return `<h4>${lang==='de'?'Quellen':'Sources'}</h4><p class="note">Griechischer Text und Apparat: SBL Greek New Testament, © 2010 Society of Biblical Literature und Logos Bible Software, CC BY 4.0. Sprachdaten: MACULA Greek Linguistic Datasets, available at https://github.com/Clear-Bible/macula-greek/ (CC BY 4.0); Glossen: Berean Interlinear (gemeinfrei), Cherith Glosses von Andi Wu, © 2023 Cherith Analytics (CC BY 4.0). Zweite Annotation 3,22–30: MorphGNT 6.12, J. K. Tauber (CC BY-SA 3.0). Übersetzung und Erklärungen: eigene Entwürfe (CC0), fachlich ungeprüft.</p><p class="note">${esc(MARKUS.method.name)}: ${esc(MARKUS.method.limits.join(' '))}</p>`;}
function studySheet(partId){
  const part=nodes.get(partId).part,subjects=[part.id,MARKUS.section.id],L=lang==='de';
  const fs=MARKUS.findings.filter(x=>subjects.includes(x.subject)),is=MARKUS.interpretations.filter(x=>subjects.includes(x.subject));
  let h=head(part.title)+`<p class="note">${esc(refDe(part.range))}</p>`;
  h+=`<h4>${L?'Was steht da?':'What does it say?'}</h4>`+fs.map(f=>`<div class="point"><p class="body">${esc(plain(f.claim))}</p>${S.advanced&&f.caveat?`<p class="note">${esc(f.caveat)}</p>`:''}${S.advanced?`<p class="ref-id">${esc(f.id)}</p>`:''}</div>`).join('');
  h+=`<h4>${L?'Wie kann man es verstehen?':'How can it be understood?'}</h4>`+(is.length>1?`<p class="note">${L?'Hier gibt es mehr als eine Sichtweise.':'There is more than one view.'}</p>`:'')+is.map(i=>`<div class="point"><span class="tag">${CONF[i.confidence]||''}</span><p class="body">${esc(plain(i.claim))}</p>${i.caveat?`<p class="note"><b>${L?'Nicht sicher:':'Uncertain:'}</b> ${esc(plain(i.caveat))}</p>`:''}${(i.counter||[]).map(c=>`<p class="note"><b>${L?'Man kann auch anders lesen:':'Another reading:'}</b> ${esc(plain(c))}</p>`).join('')}${S.advanced?`<p class="ref-id">${esc(i.id)}</p>`:''}</div>`).join('');
  if(part.id==='TU-MRK-003-022-030'){
    h+=`<h4>${L?'Was kann es heute bedeuten?':'What might it mean today?'}</h4>`+MARKUS.applications.map(a=>`<div class="point"><p class="body">${esc(a.text)}</p><p class="note"><b>${L?'Grenze:':'Limit:'}</b> ${esc(a.limits)}</p></div>`).join('')+MARKUS.principles.map(p=>`<div class="point"><span class="tag">${L?'abgeleiteter Grundsatz':'derived principle'} · ${CONF[p.confidence]||''}</span><p class="body">${esc(p.text)}</p><p class="note">${L?'Dieser Grundsatz geht weiter, als der Text selbst sagt. Er ist eine Folgerung, kein Befund.':'This principle goes beyond what the text itself says.'}</p></div>`).join('');
    h+=`<h4>${L?'Eine offene Frage':'An open question'}</h4>`+MARKUS.questions.map(q=>`<div class="point"><p class="body">${esc(q.q)}</p><p class="note">${esc(q.finding)}</p></div>`).join('');
    h+=`<h4>${L?'Ähnliche Stellen':'Related passages'}</h4><p class="body">${MARKUS.relations.map(r=>esc(r.to_de)).join(' · ')}</p>`;
  }
  h+=`<p class="note">${L?'Alle Beobachtungen und Deutungen sind Entwürfe und noch nicht fachlich geprüft.':'All notes are drafts, not yet reviewed.'}</p>`;
  openSheet('study',h);
}
function menuSheet(){
  const t=T(),seg=(key,opts,val)=>`<div class="seg" role="group">${opts.map(([v,l])=>`<button type="button" data-set="${key}" data-value="${v}" aria-pressed="${String(val)===String(v)}">${l}</button>`).join('')}</div>`;
  const sw=(key,label,sub)=>`<div class="set"><span>${label}<span class="sub">${sub}</span></span><button type="button" class="switch" role="switch" aria-checked="${S[key]}" data-toggle="${key}" aria-label="${label}"></button></div>`;
  openSheet('menu',head(t.menu,t.done)+`<label for="find-${appIndex}" class="note">${t.search}</label><input id="find-${appIndex}" type="search" placeholder="${t.hint}" value="${esc(query)}" autocomplete="off"><div class="results"></div>
  <button type="button" class="row" data-go="${MARKUS.section.parts[0].id}"><span>${t.example}</span>${icon('chevron-right')}</button>
  <button type="button" class="row" data-go="all"><span>${t.home}</span>${icon('chevron-right')}</button>
  <div class="set"><span>${t.colors}</span>${seg('theme',[['auto',t.auto],['light',t.light],['dark',t.dark]],S.theme)}</div>
  <div class="set"><span>${t.size}</span>${seg('read',[[17,'A−'],[19,'A'],[22,'A+']],S.read)}</div>
  <div class="set"><span>${t.language}</span>${seg('lang',[['de','Deutsch'],['en','English']],lang)}</div>
  ${sw('inline',t.inline,t.inlineSub)}${sw('advanced',t.advanced,t.advancedSub)}
  <details class="about"><summary>${t.about}</summary><div>
   <p>${lang==='de'?'Ein Prototyp. Zusammenfassungen, Übersetzung und Erklärungen sind KI-Entwürfe und noch nicht fachlich geprüft. Ausgearbeitet ist bisher Markus 3,20–35; an anderen Stellen fehlt der Bibeltext noch.':'A prototype. Summaries, translation and notes are AI drafts, not yet reviewed. Only Mark 3:20–35 is worked out so far.'}</p>
   <p>${lang==='de'?'Bücher, Kapitel und Verszählung folgen vorläufig dem protestantischen Kanon mit 66 Büchern und der Zählung der King-James-Bibel (Testkonfiguration). Abschnitte ausserhalb von Markus 3 umfassen der Einfachheit halber je bis zu fünf Verse.':'Books and verse numbering follow the 66-book Protestant canon with KJV numbering for now.'}</p>
   <p>${stats.books} ${lang==='de'?'Bücher':'books'} · ${stats.chapters.toLocaleString(lang)} ${lang==='de'?'Kapitel':'chapters'} · ${stats.verses.toLocaleString(lang)} ${t.verses}</p>
   ${sourcesBlock()}</div></details>`);
  renderResults();
}
function renderResults(){const box=host.querySelector('.results');if(!box)return;box.innerHTML=query?search(query).map(n=>`<button type="button" class="row" data-go="${n.id}"><span>${esc(title(n))}</span>${icon('chevron-right')}</button>`).join('')||`<p class="note" role="status">${T().empty}</p>`:'';}
function indexSheet(){const n=nodes.get(current),ids=n.level<=3?streams[n.level||1]:nodes.get(n.parent).children;openSheet('index',head(T().contents)+ids.slice(0,400).map(id=>{const x=nodes.get(id);const label=x.level===5&&x.part?x.part.title:title(x);return `<button type="button" class="row ${id===current?'current':''}" data-go="${id}"><span>${esc(label)}</span>${icon('chevron-right')}</button>`;}).join(''));}
function levelsSheet(){const n=nodes.get(current);openSheet('levels',head(T().levelsTitle)+T().levels.map((name,i)=>`<button type="button" class="row ${i===n.level?'current':''}" data-level="${i}"><span>${name}</span>${icon('chevron-right')}</button>`).join(''));}

/* ---------- Ereignisse ---------- */
app.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-close]');
  if(!b){if(e.target.closest('.reader'))app.classList.toggle('immersed');return;}
  if(b.hasAttribute('data-close')){closeSheet();return;}
  if(b.dataset.deep){const n=nodes.get(b.dataset.deep);current=b.dataset.deep;go(remembered.get(current)||n.children[0]);return;}
  if(b.dataset.go){go(b.dataset.go);return;}
  if(b.dataset.level!==undefined){go(resolveLevel(Number(b.dataset.level)));return;}
  if(b.dataset.more){verseSheet(b.dataset.more);return;}
  if(b.dataset.study){studySheet(b.dataset.study);return;}
  if(b.dataset.set){const k=b.dataset.set,v=b.dataset.value;if(k==='lang')lang=v;else S[k]=k==='read'?Number(v):v;save();const pos=reader.scrollTop;render();reader.scrollTop=pos;menuSheet();return;}
  if(b.dataset.toggle){S[b.dataset.toggle]=!S[b.dataset.toggle];save();const pos=reader.scrollTop;render();reader.scrollTop=pos;menuSheet();return;}
  const a=b.dataset.action,n=nodes.get(current);
  if(a==='home')go('all');else if(a==='menu'){if(sheet==='menu')closeSheet();else menuSheet();}
  else if(a==='index')indexSheet();else if(a==='levels')levelsSheet();
  else if(a==='up')go(n.parent);else if(a==='down')go(remembered.get(current)||n.children[0]);
  else if(a==='load-next')loadMore();else if(a==='load-prev')loadMore(true);
});
app.addEventListener('input',e=>{if(e.target.type==='search'){query=e.target.value;renderResults();}});
app.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet){closeSheet();reader.focus({preventScroll:true});}});
let busy=false,lastTop=0;
reader.addEventListener('scroll',()=>{if(busy)return;busy=true;
  const y=reader.scrollTop;if(y>80&&y-lastTop>6)app.classList.add('immersed');else if(lastTop-y>6||y<40)app.classList.remove('immersed');lastTop=y;
  const top=reader.getBoundingClientRect().top+70;const active=[...reader.querySelectorAll('[data-stream]')].find(el=>el.getBoundingClientRect().bottom>top);
  if(active&&active.dataset.stream!==current){current=active.dataset.stream;for(const child of ancestors(current).slice(1))remembered.set(nodes.get(child).parent,child);chrome();aside.querySelectorAll('[data-go]').forEach(x=>x.setAttribute('aria-current',String(x.dataset.go===current)));}
  if(reader.scrollTop+reader.clientHeight>reader.scrollHeight-300)loadMore();else if(reader.scrollTop<30&&readerStart>0)loadMore(true);
  busy=false;},{passive:true});
