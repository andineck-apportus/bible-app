<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bibel · Lesestrom</title>
<style>
/* Ein Lesestrom über die ganze Bibel. Ruhige Fläche, Leisten treten beim Lesen zurück; Erklärungen und Hintergrund nur auf Wunsch (Blatt von unten). */
:root{color-scheme:light dark}
html,body{margin:0;height:100%;background:#f7f7f6}
#bible-stream{height:100%}
#bible-stream .app{
  --bg:#f7f7f6;--ink:#1f1f1f;--muted:#6b6b6b;--rule:#dcdcda;--soft:#ececea;--sheet:#ffffff;--scrim:rgba(20,20,20,.28);
  --read:19px;--ui:"Helvetica Neue",Arial,sans-serif;--serif:Georgia,"Iowan Old Style","Times New Roman",serif;
  position:relative;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.45 var(--ui);color-scheme:light}
#bible-stream .app[data-theme=dark]{--bg:#171717;--ink:#ececec;--muted:#a3a3a3;--rule:#343434;--soft:#262626;--sheet:#1f1f1f;--scrim:rgba(0,0,0,.55);color-scheme:dark}
html:has(.app[data-theme=dark]),html:has(.app[data-theme=dark]) body{background:#171717}
#bible-stream .app *{box-sizing:border-box}
#bible-stream .app button{font:inherit;color:inherit;border:0;border-radius:0;background:transparent;padding:0;cursor:pointer;text-align:left}
#bible-stream .app button:disabled{opacity:.3;cursor:default}
#bible-stream .app :is(button,input,[tabindex]):focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#bible-stream .app svg{display:block;width:18px;height:18px;flex:0 0 18px}
#bible-stream .logo{width:24px!important;height:25px!important;flex-basis:24px!important}

/* Leisten */
#bible-stream .bar{position:absolute;left:0;right:0;z-index:4;display:flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:transform .25s ease,opacity .25s ease}
#bible-stream .top{top:0;padding:calc(6px + env(safe-area-inset-top,0px)) 10px 6px;border-bottom:1px solid var(--rule)}
#bible-stream .dock{bottom:0;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--rule);display:grid;grid-template-columns:1fr auto 1fr}
#bible-stream .immersed .top{transform:translateY(-105%);opacity:0}
#bible-stream .immersed .dock{transform:translateY(105%);opacity:0}
#bible-stream .icon-btn{width:44px;height:44px;display:grid!important;place-items:center}
#bible-stream .location{flex:1;min-width:0;height:44px;display:flex;align-items:center;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bible-stream .dock button{height:44px;display:flex;align-items:center;gap:8px;font-size:14px;padding:0 10px}
#bible-stream .dock [data-action=down]{justify-content:flex-end}
#bible-stream .dock .depth{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 14px}

/* Lesefläche */
#bible-stream aside{display:none}
#bible-stream .reader{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:calc(76px + env(safe-area-inset-top,0px)) 22px calc(110px + env(safe-area-inset-bottom,0px))}
#bible-stream .column{max-width:36em;margin:0 auto}
#bible-stream .stream-entry{padding:34px 0 30px;border-top:1px solid var(--rule)}
#bible-stream .stream-entry:first-child{border-top:0;padding-top:8px}
#bible-stream .eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
#bible-stream h2{font:400 28px/1.15 var(--ui);letter-spacing:-.4px;margin:0 0 14px;text-wrap:balance}
#bible-stream .stream-copy{font:400 var(--read)/1.65 var(--serif);margin:0}
#bible-stream .quiet{color:var(--muted)}
#bible-stream .actions{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:20px}
#bible-stream .link{display:inline-flex!important;align-items:center;gap:8px;min-height:40px;font-size:15px;border-bottom:1px solid currentColor!important}
#bible-stream .link.soft{border-bottom-color:var(--rule)!important;color:var(--muted)}
#bible-stream .example{margin-top:18px;display:flex!important;justify-content:space-between;align-items:center;width:100%;padding:14px 0!important;border-top:1px solid var(--rule)!important;border-bottom:1px solid var(--rule)!important}

/* Verse: fliessender Text */
#bible-stream .stream-entry.verse{border:0;padding:0 0 .55em}
#bible-stream .chapter-head{font:400 30px/1.15 var(--ui);letter-spacing:-.4px;margin:30px 0 4px}
#bible-stream .part-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:22px 0 10px}
#bible-stream .part-head h3{font:italic 400 calc(var(--read) * .95)/1.4 var(--serif);color:var(--muted);margin:0}
#bible-stream .part-tools{display:inline-flex;gap:4px;margin:0}
#bible-stream h2+.part-tools{margin:-4px 0 10px}
#bible-stream .sheet-tools{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px 10px;border-top:1px solid var(--rule);padding-top:12px;margin-top:8px}
#bible-stream .app .tool{display:inline-flex!important;align-items:center;gap:5px;padding:5px 8px!important;font:500 12px/1 var(--ui);color:var(--muted);border-radius:999px!important}
#bible-stream .tool svg{width:16px;height:16px}
#bible-stream .tool:hover,#bible-stream .tool:active{color:var(--ink);background:var(--soft)}
#bible-stream button.vno.more{display:inline-grid!important;place-items:center;min-width:1.9em;height:1.9em;padding:0 3px!important;margin:0 5px 0 -2px;border:1px solid var(--rule)!important;border-radius:999px!important;vertical-align:.25em;color:var(--ink);font:500 11px/1 var(--ui)}
#bible-stream button.vno.more:hover,#bible-stream button.vno.more:active{background:var(--soft)}
#bible-stream button.dec{display:inline!important;padding:0!important;font:inherit;color:inherit;background:none;border:0!important;cursor:pointer;text-align:inherit}
#bible-stream .bg-lines{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;margin:0 0 8px 1.6em;color:var(--muted)}
#bible-stream .bg-label svg{width:14px;height:14px;vertical-align:-2px}
#bible-stream .verse-line{font:400 var(--read)/1.75 var(--serif);margin:0}
#bible-stream .app.flow .column{line-height:1.75}
#bible-stream .app.flow .stream-entry.verse,#bible-stream .app.flow .verse-line{display:inline;padding:0}
#bible-stream .app.flow .stream-entry.verse::after{content:' '}
#bible-stream .app.flow .alt-line{display:inline;margin:0 .25em}
#bible-stream .app.flow .bg-lines,#bible-stream .app.flow .bg-label,#bible-stream .app.flow .bg-line{display:inline!important;margin:0 .35em 0 0}
#bible-stream .app.flow .bg-lines{margin-left:.25em}
#bible-stream .app.flow .bg-label svg{display:inline-block!important;vertical-align:-2px;margin-right:.25em}
#bible-stream .app.flow .part-head{margin:22px 0 6px}
#bible-stream .vno{font:500 11px/1 var(--ui);color:var(--muted);vertical-align:.6em;margin-right:4px;font-variant-numeric:tabular-nums}
#bible-stream .placeholder .stream-copy{color:var(--muted);font-size:calc(var(--read) * .8)}
#bible-stream .more{display:inline-grid!important;place-items:center;width:28px;height:28px;margin-left:4px;vertical-align:-6px;border-radius:50%!important;color:var(--muted)}
#bible-stream .more:hover{background:var(--soft);color:var(--ink)}
#bible-stream .more svg{width:15px;height:15px;flex-basis:15px}
#bible-stream .alt-line{display:block;font:italic 400 calc(var(--read) * .82)/1.5 var(--serif);color:var(--muted);margin:2px 0 8px 1.4em}
#bible-stream .part-end{margin:4px 0 18px}
#bible-stream .grc{font-family:var(--serif);font-size:1.05em;letter-spacing:.01em}
#bible-stream .dec{text-decoration-line:underline;text-decoration-thickness:1px;text-underline-offset:.22em;text-decoration-color:var(--muted)}
#bible-stream .dec.traditional{text-decoration-style:dotted}
#bible-stream .dec.interpretive{text-decoration-style:dashed}
#bible-stream .dec-tag.traditional,#bible-stream .dec-tag.interpretive{color:var(--ink)}
#bible-stream .grc-line{display:inline-flex;align-items:center;flex-wrap:wrap;gap:2px}
#bible-stream .play{display:inline-flex!important;align-items:center;justify-content:center;width:32px;height:32px;margin-left:4px;vertical-align:middle;color:var(--muted);border-radius:50%;flex:none}
#bible-stream .play svg{width:18px;height:18px}
#bible-stream .play:hover,#bible-stream .play:active{color:var(--ink);background:var(--soft)}
#bible-stream .tr-inline{font-family:var(--serif);color:var(--muted)}
#bible-stream .terms{display:flex;flex-direction:column;gap:2px;margin:2px 0 0;font-size:14px;color:var(--muted)}
#bible-stream .term{display:inline-flex;align-items:center;flex-wrap:wrap;gap:4px}
#bible-stream .term .lang{font-size:11px;letter-spacing:.06em;text-transform:uppercase}
#bible-stream .term .grc,#bible-stream .term .heb{color:var(--ink);font-family:var(--serif);font-size:16px}
#bible-stream .term .play,#bible-stream .body .play,#bible-stream .note .play{width:26px;height:26px;margin-left:0}
#bible-stream .term .play svg,#bible-stream .body .play svg,#bible-stream .note .play svg{width:15px;height:15px}
#bible-stream .tr{display:block;font:italic 14px/1.45 var(--serif);color:var(--muted);margin:0}
#bible-stream .il .tr{font-size:12.5px}
#bible-stream .il .g{display:inline-flex;align-items:center}
#bible-stream .set.stack{flex-direction:column;align-items:stretch;gap:8px}
#bible-stream .seg.wrap{flex-wrap:wrap}
#bible-stream .grc.small{font-size:15px;color:var(--muted);margin:6px 0 0;line-height:1.5}
#bible-stream .word-table{display:flex;flex-direction:column;gap:10px}
#bible-stream .word-row{display:flex;flex-direction:column;gap:2px;border-left:2px solid var(--rule);padding-left:12px}
#bible-stream .wit-group{border:1px solid var(--rule);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
#bible-stream .wit-group.main{border-color:var(--ink)}
#bible-stream .wit-group p{margin:0}
#bible-stream .wit summary{display:flex;gap:12px;align-items:baseline;cursor:pointer;list-style:none;padding:6px 0;border-top:1px solid var(--soft)}
#bible-stream .wit summary::-webkit-details-marker{display:none}
#bible-stream .wit .sig{min-width:2.2em;font:500 17px/1 var(--serif);text-align:center}
#bible-stream .wit .sig.long{font:500 11px/1.2 var(--ui);color:var(--muted);max-width:3.4em}
#bible-stream .wit[open] summary{border-bottom:0}
#bible-stream .wit>p{margin:4px 0 4px 3.3em}
#bible-stream .sheet a{color:inherit;text-decoration:underline;text-decoration-color:var(--rule)}
#bible-stream .app .bg-line{display:inline;padding:2px 0;font:400 13px/1.4 var(--ui);color:var(--muted);text-align:left;border-bottom:1px dotted var(--rule)!important}
#bible-stream .bg-topic{font:500 16px/1.35 var(--ui);margin:0}

#bible-stream .load{display:block;margin:24px auto 0;font-size:13px;color:var(--muted)}
#bible-stream .end{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;margin:40px 0 0}

/* Blatt */
#bible-stream .scrim{position:absolute;inset:0;background:var(--scrim);z-index:8}
#bible-stream .sheet{position:absolute;left:0;right:0;bottom:0;z-index:9;max-height:88%;overflow-y:auto;background:var(--sheet);border-top:1px solid var(--rule);padding:8px 22px calc(28px + env(safe-area-inset-bottom,0px))}
#bible-stream .sheet .column{display:flex;flex-direction:column;gap:14px}
#bible-stream .grab{width:36px;height:4px;background:var(--rule);margin:6px auto 4px}
#bible-stream .sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
#bible-stream .sheet-head h3{font:400 24px/1.2 var(--ui);margin:0}
#bible-stream .app .close{display:inline-flex!important;align-items:center;gap:6px;flex:none;min-height:38px;padding:0 12px 0 9px!important;color:var(--muted);font:500 14px/1 var(--ui);border-radius:999px!important;transition:background .15s,color .15s}
#bible-stream .close svg{width:18px;height:18px}
#bible-stream .close:hover,#bible-stream .close:active{background:var(--soft);color:var(--ink)}
#bible-stream .app .sheet:focus,#bible-stream .app .sheet:focus-visible{outline:none}
#bible-stream .sheet h4{font:400 20px/1.3 var(--serif);margin:12px 0 0}
#bible-stream .sheet p{margin:0}
#bible-stream .sheet .body{font:400 17px/1.6 var(--serif)}
#bible-stream .sheet .note{font-size:14px;color:var(--muted)}
#bible-stream .point{border-left:2px solid var(--rule);padding-left:14px;display:flex;flex-direction:column;gap:6px}
#bible-stream .pair{display:grid;gap:8px}
#bible-stream .reading-card{border:1px solid var(--rule);padding:12px 14px;display:flex;flex-direction:column;gap:5px}
#bible-stream .reading-card.main{border-color:var(--ink)}
#bible-stream .tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#bible-stream .dots{display:inline-flex;gap:4px;margin-right:8px;vertical-align:middle}
#bible-stream .dots i{width:8px;height:8px;background:var(--rule)}
#bible-stream .dots i.on{background:var(--ink)}
#bible-stream .il{display:flex;flex-wrap:wrap;gap:12px 14px}
#bible-stream .il details{min-width:0}
#bible-stream .il summary{list-style:none;cursor:pointer;display:flex;flex-direction:column}
#bible-stream .il summary::-webkit-details-marker{display:none}
#bible-stream .il .g{font:400 19px/1.3 var(--serif)}
#bible-stream .il .d{font-size:13px}
#bible-stream .il .e{font-size:11.5px;color:var(--muted)}
#bible-stream .il details[open]{flex-basis:100%;border-left:2px solid var(--rule);padding-left:12px}
#bible-stream .il details[open] summary{margin-bottom:6px}
#bible-stream .kv{display:grid;grid-template-columns:9em minmax(0,1fr);gap:4px 10px;font-size:14px}
#bible-stream .kv dt{color:var(--muted)}#bible-stream .kv dd{margin:0}
#bible-stream .ref-id{font:11px/1.4 ui-monospace,Menlo,monospace;color:var(--muted);overflow-wrap:anywhere}
#bible-stream .row{display:flex!important;justify-content:space-between;align-items:center;width:100%;min-height:50px;border-top:1px solid var(--rule)!important;gap:10px}
#bible-stream .row .sub{display:block;font-size:12.5px;color:var(--muted)}
#bible-stream .row.current{font-weight:600}
#bible-stream .set{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--rule)}
#bible-stream .set .sub{display:block;font-size:13px;color:var(--muted)}
#bible-stream .seg{display:inline-flex;border:1px solid var(--rule)}
#bible-stream .seg button{padding:8px 12px!important;font-size:14px;min-height:38px}
#bible-stream .seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
#bible-stream .switch{width:46px;height:28px;background:var(--rule)!important;position:relative;flex:0 0 auto;border-radius:14px!important}
#bible-stream .switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--sheet);transition:transform .15s}
#bible-stream .switch[aria-checked=true]{background:var(--ink)!important}
#bible-stream .switch[aria-checked=true]::after{transform:translateX(18px)}
#bible-stream input[type=search]{width:100%;font:16px var(--ui);padding:12px;border:1px solid var(--rule);background:var(--bg);color:var(--ink);border-radius:0}
#bible-stream details.about summary{cursor:pointer;padding:12px 0;border-top:1px solid var(--rule)}
#bible-stream details.about div{display:flex;flex-direction:column;gap:8px;font-size:13.5px;color:var(--muted);padding-bottom:10px}
#bible-stream .live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

@media (min-width:900px){
  #bible-stream aside{display:block;position:absolute;left:0;top:57px;bottom:57px;width:230px;overflow:auto;padding:16px 8px;border-right:1px solid var(--rule)}
  #bible-stream aside button{display:block;width:100%;padding:7px 10px;font-size:13px;color:var(--muted)}
  #bible-stream aside button[aria-current=true]{color:var(--ink);box-shadow:inset 2px 0 var(--ink)}
  #bible-stream .reader{left:230px}
  #bible-stream .immersed aside{opacity:.25}
}
@media (prefers-reduced-motion:reduce){#bible-stream .bar{transition:none}}
</style></head><body>

  return `<div class="point bg-note" data-bg-note="${esc(b.id)}"><span class="tag">${withRef?esc(b.ref_de)+' · ':''}${esc(CONF[b.confidence]||'')}${b.readers?(L?' · Zeit des Markus':' · time of Mark'):''}</span><p class="bg-topic">${esc(b.topic)}</p><p class="body">${rich(b.text)}</p>${termsLine(b.terms)}${b.uncertain?`<p class="note"><b>${L?'Nicht sicher:':'Uncertain:'}</b> ${rich(b.uncertain)}</p>`:''}${b.evidence.length||b.sources.length?`<p class="note">${L?'Vergleiche':'Compare'}: ${esc([...b.evidence,...b.sources].join(' · '))}</p>`:''}${S.advanced?`<p class="ref-id">${esc(b.id)}</p>`:''}</div>`;}
const bgDisclaimer=()=>`<p class="note">${lang==='de'?'Hintergrund beschreibt Zeit, Ort und Kultur damals. Er erklärt den Text nicht allein, und ein Teil davon ist unsicher. Alle Hinweise sind Entwürfe und noch nicht fachlich geprüft.':'Background describes time, place and culture then. Drafts, not yet reviewed.'}</p>`;
function bgSheet(partId){const part=nodes.get(partId).part;openSheet('background',head(T().background)+`<p class="note">${esc(part.title)} · ${esc(refDe(part.range))}</p>`+bgForPart(partId).map(b=>bgNote(b,true)).join('')+bgDisclaimer()+sheetTools(partId,'u'));}
function bgOne(id){const b=BG.find(x=>x.id===id);openSheet('background',head(b.topic)+bgNote(b,true).replace(`<p class="bg-topic">${esc(b.topic)}</p>`,'')+bgDisclaimer());}

/* ---------- Einträge ---------- */
function entry(id){
  const n=nodes.get(id),t=T();
  if(n.level===6)return verseEntry(n);
  const text=summary(n);
  const deep=n.children.length?`<button type="button" class="link" data-deep="${id}">${t.deeper[n.level]}${icon('arrow-down')}</button>`:'';

  const ex=(n.level===3||n.level===4)?STUDY.sections.filter(sec=>{const g=rangeOf(sec.range);return DATA[n.b].code===g.code&&(n.level===3||n.c===g.c);}):[];
  const example=ex.map(sec=>`<button type="button" class="example" data-go="${sec.parts[0].id}"><span>${t.example}: ${esc(refDe(sec.range))} · ${esc(sec.title)}</span>${icon('chevron-right')}</button>`).join('');
  const heading=n.level===5&&n.part?n.part.title:(n.level===5?(lang==='de'?'Verse ':'Verses ')+n.v+'–'+n.last:title(n));
  const copy=text?`<p class="stream-copy">${esc(text)}</p>`:`<p class="stream-copy quiet">${n.level===5?t.noPart:t.noSummary}</p>`;
  return `<article class="stream-entry" data-stream="${id}">${eyebrow(n)?`<p class="eyebrow">${esc(eyebrow(n))}</p>`:''}<h2>${esc(heading)}</h2>${n.part?tools(id):''}${copy}${example}<div class="actions">${deep}</div></article>`;
}
function tools(id,which='uh'){const t=T();return `<span class="part-tools">${which.includes('u')?`<button type="button" class="tool" data-study="${id}" aria-label="${t.understand}">${icon('understand')}<span>${t.toolUnderstand}</span></button>`:''}${which.includes('h')?`<button type="button" class="tool" data-background="${id}" aria-label="${t.background}">${icon('history')}<span>${t.toolHistory}</span></button>`:''}</span>`;}
const sheetTools=(id,which)=>`<div class="sheet-tools"><span class="note">${lang==='de'?'Abschnitt':'Passage'}: ${esc(nodes.get(id).part?nodes.get(id).part.title:'')}</span>${tools(id,which)}</div>`;
function verseEntry(n){
  const t=T(),text=summary(n);let lead='';
  if(n.v===1)lead+=`<h2 class="chapter-head">${esc(bookName(n)+' '+n.c)}</h2>`;
  const p=nodes.get(n.parent);if(p.part&&p.v===n.v)lead+=`<div class="part-head"><h3>${esc(p.part.title)}</h3>${tools(p.id)}</div>`;
  if(!text)return `<article class="stream-entry verse placeholder" data-stream="${n.id}">${lead}<p class="verse-line"><span class="vno">${n.v}</span><span class="stream-copy">${t.placeholder}</span></p></article>`;
  const alts=altsFor(n);
  const bgs=bgFor(n);
  const has=alts.length||bgs.length||S.advanced||STUDY.decisions[n.canonicalRef]||STUDY.compare[n.canonicalRef];
  const vno=has?`<button type="button" class="vno more" data-more="${n.id}" aria-label="${t.more} ${n.v}">${n.v}</button>`:`<span class="vno">${n.v}</span>`;
  const inline=S.inline?alts.map(a=>`<span class="alt-line" data-alternative="${esc(a.variant)}">${lang==='de'?'oder':'or'}: «${esc(a.to)}»</span>`).join(''):'';
  const bgList=S.bgInline?bgs.filter(b=>b.from===n.v):[];
  const bgLine=bgList.length?`<div class="bg-lines"><span class="bg-label">${icon('history')}</span>${bgList.map(b=>`<button type="button" class="bg-line" data-bg="${esc(b.id)}">${esc(b.topic)}</button>`).join('')}</div>`:'';
  return `<article class="stream-entry verse" data-stream="${n.id}">${lead}<p class="verse-line">${vno}<span class="stream-copy" data-ref="${n.canonicalRef}">${S.advanced?decorate(text,STUDY.decisions[n.canonicalRef]):esc(text)}</span></p>${inline}${bgLine}</article>`;
}
function streamMarkup(){const ids=streams[nodes.get(current).level];const t=T();return `<div class="column">${readerStart?`<button type="button" class="load load-before" data-action="load-prev">${t.loadPrev}</button>`:''}${ids.slice(readerStart,readerEnd).map(entry).join('')}${readerEnd<ids.length?`<button type="button" class="load load-after" data-action="load-next">${t.loadNext}</button>`:`<p class="end">${t.end}</p>`}</div>`;}
function loadMore(before=false){
  const ids=streams[nodes.get(current).level],col=reader.querySelector('.column'),t=T();if(!col)return;
  if(before&&readerStart>0){const old=reader.scrollHeight,start=Math.max(0,readerStart-10);col.querySelector('.load-before')?.remove();col.insertAdjacentHTML('afterbegin',(start>0?`<button type="button" class="load load-before" data-action="load-prev">${t.loadPrev}</button>`:'')+ids.slice(start,readerStart).map(entry).join(''));readerStart=start;reader.scrollTop+=reader.scrollHeight-old;}
  else if(!before&&readerEnd<ids.length){col.querySelector('.load-after')?.remove();const end=Math.min(readerEnd+10,ids.length);col.insertAdjacentHTML('beforeend',ids.slice(readerEnd,end).map(entry).join('')+(end<ids.length?`<button type="button" class="load load-after" data-action="load-next">${t.loadNext}</button>`:`<p class="end">${t.end}</p>`));readerEnd=end;}
}

/* ---------- Leisten ---------- */
function chrome(){
  const n=nodes.get(current),t=T();app.lang=lang;
  app.querySelector('.location').textContent=title(n);
  app.querySelector('.location').setAttribute('aria-label',t.contents+': '+title(n));
  app.querySelector('[data-action=home]').setAttribute('aria-label',t.home);
  app.querySelector('[data-action=menu]').innerHTML=icon('menu');app.querySelector('[data-action=menu]').setAttribute('aria-label',t.menu);
  app.querySelector('[data-action=up]').innerHTML=icon('arrow-up')+'<span>'+t.up+'</span>';
  app.querySelector('[data-action=down]').innerHTML='<span>'+t.down+'</span>'+icon('arrow-down');
  app.querySelector('.depth').textContent=t.levels[n.level];
  app.querySelector('[data-action=up]').disabled=!n.parent;app.querySelector('[data-action=down]').disabled=!n.children.length;
  reader.setAttribute('aria-label',T().bible);
}
function sidebar(){const n=nodes.get(current),ids=n.level<=3?streams[n.level||1]:nodes.get(n.parent).children;aside.innerHTML=ids.slice(0,200).map(id=>`<button type="button" data-go="${id}" aria-current="${id===current}">${esc(nodes.get(id).level===5&&nodes.get(id).part?nodes.get(id).part.title:title(nodes.get(id)))}</button>`).join('');}
function render(){applyPrefs();chrome();sidebar();const n=nodes.get(current);const r=savedStreams.get(n.level);if(r&&r.id===current){readerStart=r.start;readerEnd=r.end;}else{readerStart=n.si;readerEnd=Math.min(n.si+10,streams[n.level].length);}reader.innerHTML=streamMarkup();}
function rerenderKeep(){
  // Gleiche geladene Einträge neu zeichnen und den obersten sichtbaren Eintrag an derselben Stelle halten
  const top=reader.getBoundingClientRect().top;const els=[...reader.querySelectorAll('[data-stream]')];
  const anchor=els.find(el=>el.getBoundingClientRect().top>=top-1)||els.find(el=>el.getBoundingClientRect().bottom>top+1);const id=anchor&&anchor.dataset.stream,off=anchor?anchor.getBoundingClientRect().top-top:0,pos=reader.scrollTop;
  applyPrefs();chrome();sidebar();reader.innerHTML=streamMarkup();
  const again=id&&reader.querySelector(`[data-stream="${id}"]`);
  if(again&&again.getBoundingClientRect().height)reader.scrollTop+=again.getBoundingClientRect().top-top-off;else reader.scrollTop=pos;
}
function reopenMenu(){const old=host.querySelector('.sheet'),y=old?old.scrollTop:0;menuSheet();const nw=host.querySelector('.sheet');if(nw)nw.scrollTop=y;}
function saveStream(){savedStreams.set(nodes.get(current).level,{id:current,start:readerStart,end:readerEnd,offset:reader.scrollTop});}
function go(id){if(!id||!nodes.has(id))return;saveStream();for(const child of ancestors(id).slice(1))remembered.set(nodes.get(child).parent,child);current=id;closeSheet();const r=savedStreams.get(nodes.get(id).level);render();reader.scrollTop=r&&r.id===id?r.offset:0;app.classList.remove('immersed');app.querySelector('.live').textContent=title(nodes.get(id));}
function resolveLevel(level){let n=nodes.get(current);while(n.level>level)n=nodes.get(n.parent);while(n.level<level)n=nodes.get(remembered.get(n.id)||n.children[0]);return n.id;}

/* ---------- Blätter ---------- */
function openSheet(kind,html){sheet=kind;host.innerHTML=`<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-modal="true" tabindex="-1"><div class="column"><div class="grab"></div>${html}</div></div>`;host.querySelector('.sheet')?.focus({preventScroll:true});}
function closeSheet(){sheet=null;host.innerHTML='';}
const head=(title,close)=>`<div class="sheet-head"><h3>${esc(title)}</h3><button type="button" class="close" data-close aria-label="${close||T().close}">${icon(close?'check':'x')}<span>${close||T().close}</span></button></div>`;
const dots=(n,of)=>n==null?'':`<span class="dots" aria-hidden="true">${Array.from({length:of},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('')}</span>`;
const support=(n,of)=>n==null?(lang==='de'?'Einige alte Handschriften lesen so; diese Angabe ist noch nicht geprüft.':'Reported in some old manuscripts; not yet verified.'):(lang==='de'?`Steht in ${n} von ${of} wichtigen Textausgaben.`:`Found in ${n} of ${of} major editions.`);

function verseSheet(id){
  const n=nodes.get(id),t=T(),alts=altsFor(n);
  let h=head(title(n))+`<p class="body">${esc(STUDY.de[n.canonicalRef])}</p>`;
  h+=decisionsBlock(n);
  const bgs=bgFor(n);
  if(bgs.length)h+=`<h4>${t.then}</h4>`+bgs.map(b=>bgNote(b,false)).join('');
  if(alts.length){
    h+=`<h4>${lang==='de'?'Andere Lesarten':'Other readings'}</h4><p class="note">${lang==='de'?'Die alten Handschriften stimmen hier nicht ganz überein. Die Möglichkeiten stehen nebeneinander; niemand entscheidet für dich, welche «richtig» ist.':'Old manuscripts differ here. The options stand side by side.'}</p>`;
    h+=alts.map(a=>`<div class="pair" data-alternative="${esc(a.variant)}"><div class="reading-card main"><span class="tag">${lang==='de'?'Im Lesetext':'In the text'}</span><span class="body">«${esc(a.from)}»</span><span class="note">${dots(a.base_support,a.of)}${a.base_support!=null?support(a.base_support,a.of):(lang==='de'?'So steht es in den verglichenen Textausgaben.':'As in the compared editions.')}</span></div><div class="reading-card"><span class="tag">${lang==='de'?'Andere Lesart':'Other reading'}</span><span class="body">«${esc(a.to)}»</span><span class="note">${dots(a.support,a.of)}${support(a.support,a.of)}</span></div><p class="note">${esc(a.note||'')}</p><button type="button" class="link" data-source="${esc(a.variant)}" data-verse="${n.id}">${t.toSource}${icon('arrow-down')}</button></div>`).join('');
  }
  if(S.advanced){
    const words=STUDY.words.filter(w=>w.ref===n.canonicalRef),vars=STUDY.variants.filter(v=>v.ref===n.canonicalRef);
    h+=`<h4>${lang==='de'?'Griechisch Wort für Wort':'Greek word by word'}</h4><p class="note">${lang==='de'?'Ganzer Vers':'Whole verse'} ${play(words.map(w=>w.text.replace(/[⸀-⸅]/g,'')).join(' '))}</p><div class="il">${words.map(w=>{const m=w.mac,d=STUDY.tok_de[w.id];const de=d?(d.target===null?'·':(d.first?d.target:'″')):(m.gloss_berean||'');const form=['person','tense','voice','mood','case','number','gender'].map(k=>m[k]&&GR[k][m[k]]).filter(Boolean).join(', ');
      const gw=w.text.replace(/[⸀-⸅]/g,'');return `<details><summary><span class="g">${esc(gw)}${play(gw)}</span>${tr(gw)}<span class="d">${esc(de)}</span><span class="e">${esc(m.gloss_berean||'')}</span></summary><dl class="kv"><dt>Grundform</dt><dd>${esc(m.lemma||'')} · ${w.freq}× in ${esc(DATA[n.b].de)}</dd><dt>Wortart</dt><dd>${esc(POS[m.pos]||m.pos||'')}</dd>${form?`<dt>Form</dt><dd>${esc(form)}</dd>`:''}${m.role?`<dt>Satzrolle</dt><dd>${esc(ROLE[m.role]||m.role)}</dd>`:''}${d&&d.note?`<dt>Hinweis</dt><dd>${esc(d.note)}</dd>`:''}${w.mgnt?`<dt>MorphGNT</dt><dd>${esc(w.mgnt.lemma)} · ${esc(w.mgnt.parsing)}</dd>`:''}</dl><p class="ref-id">${esc(w.id)}</p></details>`;}).join('')}</div>`;
    if(vars.length)h+=`<h4>${lang==='de'?'Vergleich der Textausgaben':'Edition comparison'}</h4><p class="note">${lang==='de'?'Vergleich gedruckter Textausgaben laut SBLGNT-Apparat. Keine Handschriftenzählung.':'Comparison of printed editions (SBLGNT apparatus). Not a manuscript count.'}</p>`+vars.map(v=>`<div class="point">${v.readings.map(r=>{const a=(v.assessment||[]).find(x=>x.reading===r.id);return `<p><span class="body">${esc(r.text)}</span> <span class="note">${a?esc(a.editions.map(e=>ED[e]).join(', '))+` (${a.support}/${a.of})`:esc((r.witnesses||[]).join(', ')+(lang==='de'?' · berichtet, ungeprüft':' · reported, unverified'))}</span></p>`;}).join('')}<p class="ref-id">${esc(v.id)}</p></div>`).join('');
    h+=sourcesBlock()+`<p class="ref-id">${esc(STUDY.de_source[n.canonicalRef])}</p>`;
  }else{
    h+=`<p class="note">${lang==='de'?'Griechischer Text, Grammatik und Quellen: im Menü «Urtext und Details» einschalten.':'Greek text, grammar and sources: turn on “Original text and details” in the menu.'}</p>`;
  }
  const p=nodes.get(n.parent);if(p.part)h+=sheetTools(p.id,'uh');
  openSheet('verse',h);
}
const gnorm=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f\u02bc\u2019']/g,'').toLowerCase().replace(/ς/g,'σ');
function sourceSheet(vid,verseId){
  const L=lang==='de',n=nodes.get(verseId),a=altsFor(n).find(x=>x.variant===vid),ex=SRC.alts[vid]||{words:{},origin:[],related:[]};
  const mv=(ex.related&&ex.related[0])||vid,mvar=SRC.variants[mv]||SRC.variants[vid],evar=SRC.variants[vid];
  const allWords=Object.entries(ex.words||{});
  const wordFor=text=>{const t=gnorm(text);const hit=allWords.find(([k,ws])=>ws.some(w=>w.grc!=='—'&&t.includes(gnorm(w.grc))));return hit?hit[1]:null;};
  const labelFor=r=>{const ws=(mv===vid&&ex.words[r.id])||wordFor(r.text);if(r.text.trim()==='–'||r.text.trim()==='-')return L?'ohne diese Wörter':'without these words';return ws?ws.map(w=>`«${w.de}»`).join(' '):'';};
  const isMain=r=>r.id==='R1'&&mv===vid?true:(mv!==vid?gnorm(r.text).includes(gnorm(evar.readings[0].text)):r.id==='R1');
  let h=head(title(n)+' · '+(L?'bis zur Quelle':'to the source'));
  h+=`<p class="note">${L?'Hier siehst du, welche alten Handschriften und welche gedruckten Ausgaben welchen Wortlaut haben, was die Wörter bedeuten und wie der Unterschied entstanden sein könnte. Es wird nichts als richtig entschieden.':'Which manuscripts and editions read what, what the words mean, and how the difference may have arisen.'}</p>`;
  h+=`<h4>${L?'Was ist anders?':'What differs?'}</h4><div class="pair"><div class="reading-card main"><span class="tag">${L?'Im Lesetext':'In the text'}</span><span class="body">«${esc(a.from)}»</span></div><div class="reading-card"><span class="tag">${L?'Andere Lesart':'Other reading'}</span><span class="body">«${esc(a.to)}»</span></div></div><p class="note">${esc(a.note||'')}</p>`;
  if(allWords.length){h+=`<h4>${L?'Die Wörter im Griechischen':'The Greek words'}</h4><p class="note">${L?'Wörtlich übersetzt; so lässt sich der Unterschied ohne Griechischkenntnisse nachvollziehen.':'Literal translation.'}</p><div class="word-table">`+allWords.map(([k,ws])=>ws.map(w=>`<div class="word-row">${grcLine(w.grc)}<span class="body">${esc(w.de)}</span><span class="note">${esc(w.note_de||'')}</span></div>`).join('')).join('')+`</div>`;}
  // Handschriften
  const rows=(SRC.readings[mv]||[]).filter(e=>SRC.witnesses[e.source]);
  if(rows.length){
    h+=`<h4>${L?'Was die alten Handschriften lesen':'What the old manuscripts read'}</h4><p class="note">${L?'Die alten Textzeugen, die hier ausgewertet sind: grosse Bibelhandschriften und, wo vorhanden, Papyri und Amulette. Aufklappen zeigt ihren Wortlaut in griechischen Kleinbuchstaben ohne Akzente, wie in der Transkription.':'The old witnesses evaluated here: major manuscripts and, where available, papyri and amulets.'}</p>`;
    const groups=[...mvar.readings.map(r=>({key:r.id,title:labelFor(r),grc:r.text,main:isMain(r)})),{key:'other',title:(L?'liest anders':'reads differently')+((ex.words&&ex.words.other)?(L?', z. B. ':', e.g. ')+ex.words.other.map(w=>w.grc+' «'+w.de+'»').join(', '):'')},{key:'unclear',title:L?'nicht eindeutig zuzuordnen':'unclear'},{key:'lacuna',title:L?'Stelle nicht erhalten':'not preserved'}];
    for(const g of groups){const es=rows.filter(e=>e.result===g.key);if(!es.length)continue;
      h+=`<div class="wit-group ${g.main?'main':''}"><span class="tag">${g.main?(L?'Wie im Lesetext':'As in the text'):(g.key.startsWith('R')?(L?'Andere Lesart':'Other reading'):'')}</span>${g.grc?`<div>${grcLine(g.grc)}<p class="body">${esc(g.title)}</p></div>`:`<p class="body">${esc(g.title)}</p>`}<p class="note">${es.length} ${L?(es.length===1?'Textzeuge':'Textzeugen'):'witnesses'}</p>`+es.map(e=>{const w=SRC.witnesses[e.source];const hand=e.hand==='corr'?(L?' · korrigierte Fassung':' · corrected'):(rows.some(x=>x.source===e.source&&x.hand==='corr')?(L?' · ursprüngliche Fassung':' · original hand'):'');
        return `<details class="wit"><summary><span class="sig${String(w.symbol).length>3?' long':''}">${esc(w.symbol)}</span><span><b>${esc(w.name_de)}</b><span class="note"> · ${esc(w.date_de)}${hand}</span></span></summary>${e.witness_text?`<p class="grc small">${esc(e.witness_text.replace(/[~+=%^]/g,''))}${play(e.witness_text)}</p>${S.translit?`<p class="tr">${esc(translit(e.witness_text))}</p>`:''}`:''}${e.damaged?`<p class="note">${L?'Die Stelle ist beschädigt; einzelne Buchstaben fehlen.':'Damaged.'}</p>`:''}${e.supplied?`<p class="note">${L?'Teile des Wortlauts sind unsicher oder ergänzt.':'Partly supplied.'}</p>`:''}${e.note_de?`<p class="note">${esc(e.note_de)}</p>`:''}<p class="note">${esc(w.about_de||'')} ${esc(w.material_de||'')}. ${esc(w.location_de||'')}.</p><p class="note">${(w.facsimile||[]).map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener">${L?'Digitale Abbildung':'Images'}</a>`).join(' · ')}${w.catalog_url?`${(w.facsimile||[]).length?' · ':''}<a href="${esc(w.catalog_url)}" target="_blank" rel="noopener">${L?'Katalog (NTVMR)':'Catalogue (NTVMR)'}</a>`:''}</p>${S.advanced?`<p class="ref-id">GA ${esc(w.gregory_aland)} · ${esc(e.source)}</p>`:''}</details>`;}).join('')+`</div>`;}
    const rep=mvar.readings.filter(r=>r.reported&&r.reported.length);
    if(rep.length){const sym=x=>(x.match(/\(([^)]+)\)/)||[])[1];const diff=[];
      for(const r of rep)for(const w of r.reported){const sy=sym(w);const hit=rows.find(e=>e.hand==='first'&&SRC.witnesses[e.source].symbol===sy);if(hit&&hit.result!==r.id)diff.push(w);}
      h+=`<p class="note">${L?'Frühere Arbeitsnotiz in diesem Projekt (berichtet, ungeprüft):':'Earlier working note (reported, unverified):'} ${esc(rep.map(r=>r.text+': '+r.reported.join(', ')).join(' · '))}.</p>`+(diff.length?`<p class="note"><b>${L?'Abweichung:':'Discrepancy:'}</b> ${L?`Bei ${esc(diff.join(', '))} stimmt die Arbeitsnotiz nicht mit der Transkription überein. Offener Prüfpunkt am Faksimile.`:esc(diff.join(', '))}</p>`:'');}
  }
  // Ausgaben
  if(evar){
    const edRows=(SRC.readings[vid]||[]).filter(e=>SRC.editions[e.source]);
    h+=`<h4>${L?'Was die gedruckten Ausgaben haben':'What printed editions read'}</h4><p class="note">${L?'Gedruckte Ausgaben sind Rekonstruktionen von Fachleuten aus vielen Handschriften. Sie sind keine unabhängigen Zeugen.':'Printed editions are scholarly reconstructions, not independent witnesses.'}</p>`;
    h+=evar.readings.map(r=>{const eds=[...(r.id==='R1'?['ED-SBLGNT']:[]),...r.editions];const extra=edRows.filter(e=>e.result===r.id&&!eds.includes(e.source)&&['ED-ST','ED-KJTR','ED-SR'].includes(e.source)).map(e=>e.source);
      return `<div class="wit-group ${r.id==='R1'?'main':''}"><div>${grcLine(r.text)}<p class="body">${esc(labelFor(r))}</p></div>`+[...eds,...extra].map(id=>{const e=SRC.editions[id]||{title:id};return `<details class="wit"><summary><span class="sig">${esc(EDS[id]||id.replace('ED-',''))}</span><span><b>${esc(e.title)}</b>${e.year?`<span class="note"> · ${esc(e.year)}</span>`:''}</span></summary><p class="note">${esc(e.about||'')}</p></details>`;}).join('')+`</div>`;}).join('');
    const rp=edRows.find(e=>e.source==='ED-RP');const rpApp=evar.readings.find(r=>r.editions.includes('ED-RP'));
    if(rp&&rpApp&&rp.result.startsWith('R')&&rp.result!==rpApp.id)h+=`<p class="note"><b>${L?'Unterschied zwischen den Quellen:':'Sources differ:'}</b> ${L?`Laut SBLGNT-Apparat liest Robinson-Pierpont «${esc(rpApp.text)}», die elektronische Fassung beim CNTR aber «${esc(rp.witness_text)}». Möglicherweise sind verschiedene Auflagen gemeint; nicht geklärt.`:'The SBLGNT apparatus and the CNTR text of RP differ here.'}</p>`;
  }
  // Entstehung
  if(ex.origin&&ex.origin.length)h+=`<h4>${L?'Wie kann der Unterschied entstanden sein?':'How might the difference have arisen?'}</h4><p class="note">${L?'Mögliche Erklärungen aus der Textforschung. Sie stehen nebeneinander; keine ist entschieden.':'Possible explanations; none decided.'}</p>`+ex.origin.map(o=>`<div class="point"><p class="body">${rich(o)}</p></div>`).join('');
  // Sicherheit
  if(rows.length){const main=rows.filter(e=>e.hand==='first'&&mvar.readings.some(r=>r.id===e.result&&isMain(r))).length,tot=new Set(rows.filter(e=>e.result!=='lacuna').map(e=>e.source)).size;
    h+=`<h4>${L?'Wie sicher ist das?':'How certain?'}</h4><div class="point"><p class="body">${a.base_support!=null?(L?'Lesetext: ':'Text: ')+esc(support(a.base_support,a.of))+' ':''}${L?`Von ${tot} alten Textzeugen, in denen die Stelle erhalten ist, haben ${main} den Wortlaut des Lesetexts (Erstschrift).`:`${main} of ${tot} old witnesses have the wording of the text.`}</p><p class="note">${L?'Beide Zahlen zählen nur, sie gewichten nicht. Die Auswahl ist klein; Amulette geben das Gebet oft frei und nach Gehör wieder; spätere Handschriften, alte Übersetzungen (lateinisch, syrisch, koptisch) und Zitate der Kirchenväter fehlen noch. Die Zuordnung der Handschriften ist maschinell und nicht am Original geprüft.':'Counts only; small selection; machine collation.'}</p></div>`;}
  h+=`<p class="note">${esc(SRC.attribution)}</p><button type="button" class="link soft" data-more="${n.id}">${L?'Zurück zum Vers':'Back to the verse'}</button>`;
  openSheet('source',h);
}
function sourcesBlock(){return `<h4>${lang==='de'?'Quellen':'Sources'}</h4><p class="note">Griechischer Text und Apparat: SBL Greek New Testament, © 2010 Society of Biblical Literature und Logos Bible Software, CC BY 4.0. Sprachdaten: MACULA Greek Linguistic Datasets, available at https://github.com/Clear-Bible/macula-greek/ (CC BY 4.0); Glossen: Berean Interlinear (gemeinfrei), Cherith Glosses von Andi Wu, © 2023 Cherith Analytics (CC BY 4.0). Zweite Annotation Mk 3,22–30: MorphGNT 6.12, J. K. Tauber (CC BY-SA 3.0). Übersetzung und Erklärungen: eigene Entwürfe (CC0), fachlich ungeprüft.</p><p class="note">${esc(STUDY.method.name)}: ${esc(STUDY.method.limits.join(' '))}</p>`;}
function studySheet(partId){
  const part=nodes.get(partId).part,sec=SECTION_OF[partId],subjects=[part.id,sec.id],L=lang==='de';
  const fs=STUDY.findings.filter(x=>subjects.includes(x.subject)),is=STUDY.interpretations.filter(x=>subjects.includes(x.subject));
  let h=head(part.title)+`<p class="note">${esc(refDe(part.range))}</p>`;
  h+=`<h4>${L?'Was steht da?':'What does it say?'}</h4>`+fs.map(f=>`<div class="point"><p class="body">${rich((f.claim))}</p>${S.advanced&&f.caveat?`<p class="note">${esc(f.caveat)}</p>`:''}${S.advanced?`<p class="ref-id">${esc(f.id)}</p>`:''}</div>`).join('');
  h+=`<h4>${L?'Wie kann man es verstehen?':'How can it be understood?'}</h4>`+(is.length>1?`<p class="note">${L?'Hier gibt es mehr als eine Sichtweise.':'There is more than one view.'}</p>`:'')+is.map(i=>`<div class="point"><span class="tag">${CONF[i.confidence]||''}</span><p class="body">${rich((i.claim))}</p>${termsLine(i.terms)}${i.caveat?`<p class="note"><b>${L?'Nicht sicher:':'Uncertain:'}</b> ${rich((i.caveat))}</p>`:''}${(i.counter||[]).map(c=>`<p class="note"><b>${L?'Man kann auch anders lesen:':'Another reading:'}</b> ${rich((c))}</p>`).join('')}${S.advanced?`<p class="ref-id">${esc(i.id)}</p>`:''}</div>`).join('');
  const aps=STUDY.applications.filter(a=>subjects.includes(a.subject)),prs=STUDY.principles.filter(p=>subjects.includes(p.subject)),qs=STUDY.questions.filter(q=>subjects.includes(q.subject)),rls=STUDY.relations.filter(r=>subjects.includes(r.from));
  if(aps.length||prs.length)h+=`<h4>${L?'Was kann es heute bedeuten?':'What might it mean today?'}</h4>`+aps.map(a=>`<div class="point"><p class="body">${esc(a.text)}</p><p class="note"><b>${L?'Grenze:':'Limit:'}</b> ${esc(a.limits)}</p></div>`).join('')+prs.map(p=>`<div class="point"><span class="tag">${L?'abgeleiteter Grundsatz':'derived principle'} · ${CONF[p.confidence]||''}</span><p class="body">${esc(p.text)}</p><p class="note">${L?'Dieser Grundsatz geht weiter, als der Text selbst sagt. Er ist eine Folgerung, kein Befund.':'This principle goes beyond what the text itself says.'}</p></div>`).join('');
  if(qs.length)h+=`<h4>${L?(qs.length>1?'Offene Fragen':'Eine offene Frage'):'Open questions'}</h4>`+qs.map(q=>`<div class="point"><p class="body">${esc(q.q)}</p><p class="note">${esc(q.finding)}</p></div>`).join('');
  if(rls.length)h+=`<h4>${L?'Ähnliche Stellen':'Related passages'}</h4><p class="body">${[...new Set(rls.map(r=>r.to_de))].map(esc).join(' · ')}</p>`;
  h+=`<p class="note">${L?'Alle Beobachtungen und Deutungen sind Entwürfe und noch nicht fachlich geprüft.':'All notes are drafts, not yet reviewed.'}</p>`+sheetTools(partId,'h');
  openSheet('study',h);
}
function menuSheet(){
  const t=T(),seg=(key,opts,val)=>`<div class="seg" role="group">${opts.map(([v,l])=>`<button type="button" data-set="${key}" data-value="${v}" aria-pressed="${String(val)===String(v)}">${l}</button>`).join('')}</div>`;
  const sw=(key,label,sub)=>`<div class="set"><span>${label}<span class="sub">${sub}</span></span><button type="button" class="switch" role="switch" aria-checked="${S[key]}" data-toggle="${key}" aria-label="${label}"></button></div>`;
  openSheet('menu',head(t.menu,t.done)+`<label for="find-${appIndex}" class="note">${t.search}</label><input id="find-${appIndex}" type="search" placeholder="${t.hint}" value="${esc(query)}" autocomplete="off"><div class="results"></div>
  <p class="note">${t.examples}</p>${STUDY.sections.map(sec=>`<button type="button" class="row" data-go="${sec.parts[0].id}"><span>${esc(refDe(sec.range))} · ${esc(sec.title)}</span>${icon('chevron-right')}</button>`).join('')}
  <button type="button" class="row" data-go="all"><span>${t.home}</span>${icon('chevron-right')}</button>
  <div class="set"><span>${t.colors}</span>${seg('theme',[['auto',t.auto],['light',t.light],['dark',t.dark]],S.theme)}</div>
  <div class="set"><span>${t.size}</span>${seg('read',[[17,'A−'],[19,'A'],[22,'A+']],S.read)}</div>
  <div class="set"><span>${t.language}</span>${seg('lang',[['de','Deutsch'],['en','English']],lang)}</div>
  ${sw('flow',t.flow,t.flowSub)}${sw('inline',t.inline,t.inlineSub)}${sw('bgInline',t.bgInline,t.bgInlineSub)}${sw('advanced',t.advanced,t.advancedSub)}${sw('translit',t.translit,t.translitSub)}
  <div class="set stack"><span>${t.pron}<span class="sub">${t.pronSub}</span></span>${seg('pron',[['modern',t.pronModern],['school',t.pronSchool]],S.pron)}</div>
  ${(()=>{const lg=pronLang('el'),vs=voicesFor(lg),cur=(S.voice||{})[lg]||'';return `<div class="set stack"><span>${t.voice}</span>${vs.length?`<div class="seg wrap" role="group">${[['',t.voiceAuto],...vs.map(v=>[v.name,v.name.replace(/\s*\(.*\)$/,'')])].map(([v,l])=>`<button type="button" data-set="voice" data-value="${esc(v)}" aria-pressed="${cur===v}">${esc(l)}</button>`).join('')}</div>`:`<span class="sub">${t.noVoice}</span>`}</div>`;})()}
  <div class="set"><span>${t.rate}</span>${seg('rate',[[0.7,t.slow],[0.85,t.normal]],S.rate)}</div>
  <div class="set"><span>${t.sample}</span><span class="grc-line"><span class="grc">Πάτερ ἡμῶν</span>${play('Πάτερ ἡμῶν ὁ ἐν τοῖς οὐρανοῖς')}</span></div>
  <details class="about"><summary>${t.about}</summary><div>
   <p>${lang==='de'?'Ein Prototyp. Zusammenfassungen, Übersetzung und Erklärungen sind KI-Entwürfe und noch nicht fachlich geprüft. Ausgearbeitet sind bisher '+STUDY.sections.map(x=>refDe(x.range)).join(', ')+'; an anderen Stellen fehlt der Bibeltext noch.':'A prototype. Summaries, translation and notes are AI drafts, not yet reviewed. Worked out so far: '+STUDY.sections.map(x=>refDe(x.range)).join(', ')+'.'}</p>
   <p>${lang==='de'?'Bücher, Kapitel und Verszählung folgen vorläufig dem protestantischen Kanon mit 66 Büchern und der Zählung der King-James-Bibel (Testkonfiguration). Abschnitte ausserhalb der ausgearbeiteten Stellen umfassen der Einfachheit halber je bis zu fünf Verse.':'Books and verse numbering follow the 66-book Protestant canon with KJV numbering for now.'}</p>
   <p>${stats.books} ${lang==='de'?'Bücher':'books'} · ${stats.chapters.toLocaleString(lang)} ${lang==='de'?'Kapitel':'chapters'} · ${stats.verses.toLocaleString(lang)} ${t.verses}</p>
   ${sourcesBlock()}</div></details>`);
  renderResults();
}
function renderResults(){const box=host.querySelector('.results');if(!box)return;box.innerHTML=query?search(query).map(n=>`<button type="button" class="row" data-go="${n.id}"><span>${esc(title(n))}</span>${icon('chevron-right')}</button>`).join('')||`<p class="note" role="status">${T().empty}</p>`:'';}
function indexSheet(){const n=nodes.get(current),ids=n.level<=3?streams[n.level||1]:nodes.get(n.parent).children;openSheet('index',head(T().contents)+ids.slice(0,400).map(id=>{const x=nodes.get(id);const label=x.level===5&&x.part?x.part.title:title(x);return `<button type="button" class="row ${id===current?'current':''}" data-go="${id}"><span>${esc(label)}</span>${icon('chevron-right')}</button>`;}).join(''));}
function levelsSheet(){const n=nodes.get(current);openSheet('levels',head(T().levelsTitle)+T().levels.map((name,i)=>`<button type="button" class="row ${i===n.level?'current':''}" data-level="${i}"><span>${name}</span>${icon('chevron-right')}</button>`).join(''));}

/* ---------- Ereignisse ---------- */
app.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-close]');
  if(!b){if(e.target.closest('.reader'))app.classList.toggle('immersed');return;}
  if(b.dataset.dec!==undefined){const c=b.closest('[data-ref]');if(c){decisionSheet(c.dataset.ref,Number(b.dataset.dec));return;}}
  if(b.dataset.speak!==undefined){e.preventDefault();e.stopPropagation();speak(b.dataset.speak,b.dataset.speakLang,b.dataset.speakTr);return;}
  if(b.hasAttribute('data-close')){closeSheet();return;}
  if(b.dataset.deep){const n=nodes.get(b.dataset.deep);current=b.dataset.deep;go(remembered.get(current)||n.children[0]);return;}
  if(b.dataset.go){go(b.dataset.go);return;}
  if(b.dataset.level!==undefined){go(resolveLevel(Number(b.dataset.level)));return;}
  if(b.dataset.source){sourceSheet(b.dataset.source,b.dataset.verse);const sh=host.querySelector('.sheet');if(sh&&sh.scrollTo)sh.scrollTo(0,0);return;}
  if(b.dataset.more){verseSheet(b.dataset.more);return;}
  if(b.dataset.study){studySheet(b.dataset.study);return;}
  if(b.dataset.background){bgSheet(b.dataset.background);return;}
  if(b.dataset.bg){bgOne(b.dataset.bg);return;}
  if(b.dataset.set){const k=b.dataset.set,v=b.dataset.value;if(k==='lang')lang=v;else if(k==='voice')S.voice={...(S.voice||{}),[pronLang('el')]:v};else S[k]=(k==='read'||k==='rate')?Number(v):v;save();rerenderKeep();reopenMenu();return;}
  if(b.dataset.toggle){S[b.dataset.toggle]=!S[b.dataset.toggle];save();rerenderKeep();reopenMenu();return;}
  const a=b.dataset.action,n=nodes.get(current);
  if(a==='home')go('all');else if(a==='menu'){if(sheet==='menu')closeSheet();else menuSheet();}
  else if(a==='index')indexSheet();else if(a==='levels')levelsSheet();
  else if(a==='up')go(n.parent);else if(a==='down')go(remembered.get(current)||n.children[0]);
  else if(a==='load-next')loadMore();else if(a==='load-prev')loadMore(true);
});
app.addEventListener('input',e=>{if(e.target.type==='search'){query=e.target.value;renderResults();}});
app.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet){closeSheet();reader.focus({preventScroll:true});}});
let busy=false,lastTop=0;
reader.addEventListener('scroll',()=>{if(busy)return;busy=true;
  const y=reader.scrollTop;if(y>80&&y-lastTop>6)app.classList.add('immersed');else if(lastTop-y>6||y<40)app.classList.remove('immersed');lastTop=y;
  const top=reader.getBoundingClientRect().top+70;const active=[...reader.querySelectorAll('[data-stream]')].find(el=>el.getBoundingClientRect().bottom>top);
  if(active&&active.dataset.stream!==current){current=active.dataset.stream;for(const child of ancestors(current).slice(1))remembered.set(nodes.get(child).parent,child);chrome();aside.querySelectorAll('[data-go]').forEach(x=>x.setAttribute('aria-current',String(x.dataset.go===current)));}
  if(reader.scrollTop+reader.clientHeight>reader.scrollHeight-300)loadMore();else if(reader.scrollTop<30&&readerStart>0)loadMore(true);
  busy=false;},{passive:true});
render();
});
if(globalThis.__BIBLE_TEST__)globalThis.__BIBLE_TEST__({nodes,verses,stats,search,sibling,ancestors,streams,BOOK_SUMMARIES,STUDY,BG,translit});
})();
</script>
