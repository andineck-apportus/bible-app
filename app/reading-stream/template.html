<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bibel · Lesestrom</title>
<style>
/* Ein Lesestrom über die ganze Bibel. Ruhige Fläche, Leisten treten beim Lesen zurück; Erklärungen und Hintergrund nur auf Wunsch (Blatt von unten). */
:root{color-scheme:light dark}
html,body{margin:0;height:100%;background:#f7f7f6}
#bible-stream{height:100%}
#bible-stream .app{
  --bg:#f7f7f6;--ink:#1f1f1f;--muted:#6b6b6b;--rule:#dcdcda;--soft:#ececea;--sheet:#ffffff;--scrim:rgba(20,20,20,.28);
  --r:6px;--read:19px;--ui:"Helvetica Neue",Arial,sans-serif;--serif:Georgia,"Iowan Old Style","Times New Roman",serif;
  position:relative;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.45 var(--ui);color-scheme:light}
#bible-stream .app[data-theme=dark]{--bg:#171717;--ink:#ececec;--muted:#a3a3a3;--rule:#343434;--soft:#262626;--sheet:#1f1f1f;--scrim:rgba(0,0,0,.55);color-scheme:dark}
html:has(.app[data-theme=dark]),html:has(.app[data-theme=dark]) body{background:#171717}
#bible-stream .app *{box-sizing:border-box}
#bible-stream .app button{font:inherit;color:inherit;border:0;border-radius:0;background:transparent;padding:0;cursor:pointer;text-align:left}
#bible-stream .app button:disabled{opacity:.3;cursor:default}
#bible-stream .app :is(button,input,[tabindex]):focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#bible-stream .app svg{display:block;width:18px;height:18px;flex:0 0 18px}
#bible-stream .logo{width:24px!important;height:25px!important;flex-basis:24px!important}

/* Leisten */
#bible-stream .bar{position:absolute;left:0;right:0;z-index:4;display:flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:transform .25s ease,opacity .25s ease}
#bible-stream .top{top:0;padding:calc(6px + env(safe-area-inset-top,0px)) 10px 6px;border-bottom:1px solid var(--rule)}
#bible-stream .dock{bottom:0;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--rule);display:grid;grid-template-columns:1fr auto 1fr}
#bible-stream .immersed .top{transform:translateY(-105%);opacity:0}
#bible-stream .immersed .dock{transform:translateY(105%);opacity:0}
#bible-stream .icon-btn{width:44px;height:44px;display:grid!important;place-items:center;border-radius:var(--r)!important}
#bible-stream .icon-btn:hover,#bible-stream .location:hover,#bible-stream .dock button:hover:not(:disabled){background:var(--soft)}
#bible-stream .app .location{border-radius:var(--r)!important;padding:0 10px!important}
#bible-stream .dock button{border-radius:var(--r)!important}
#bible-stream .location{flex:1;min-width:0;height:44px;display:flex;align-items:center;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bible-stream .dock button{height:44px;display:flex;align-items:center;gap:8px;font-size:14px;padding:0 10px}
#bible-stream .dock [data-action=down]{justify-content:flex-end}
#bible-stream .dock .depth{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 14px}

/* Lesefläche */
#bible-stream aside{display:none}
#bible-stream .reader{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:calc(76px + env(safe-area-inset-top,0px)) 22px calc(110px + env(safe-area-inset-bottom,0px))}
#bible-stream .column{max-width:36em;margin:0 auto}
#bible-stream .stream-entry{padding:34px 0 30px;border-top:1px solid var(--rule)}
#bible-stream .stream-entry:first-child{border-top:0;padding-top:8px}
#bible-stream .eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
#bible-stream h2{font:400 28px/1.15 var(--ui);letter-spacing:-.4px;margin:0 0 14px;text-wrap:balance}
#bible-stream .stream-copy{font:400 var(--read)/1.65 var(--serif);margin:0}
#bible-stream .quiet{color:var(--muted)}
#bible-stream .actions{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:20px}
#bible-stream .link{display:inline-flex!important;align-items:center;gap:8px;min-height:40px;font-size:15px;border-bottom:1px solid currentColor!important}
#bible-stream .link.soft{border-bottom-color:var(--rule)!important;color:var(--muted)}
#bible-stream .example{margin-top:18px;display:flex!important;justify-content:space-between;align-items:center;width:100%;padding:14px 0!important;border-top:1px solid var(--rule)!important;border-bottom:1px solid var(--rule)!important}

/* Verse: fliessender Text */
#bible-stream .stream-entry.verse{border:0;padding:0 0 .55em}
#bible-stream .chapter-head{font:400 30px/1.15 var(--ui);letter-spacing:-.4px;margin:30px 0 4px}
#bible-stream .part-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:22px 0 10px}
#bible-stream .part-head h3{font:italic 400 calc(var(--read) * .95)/1.4 var(--serif);color:var(--muted);margin:0}
#bible-stream .part-tools{display:inline-flex;gap:4px;margin:0}
#bible-stream h2+.part-tools{margin:-4px 0 10px}
#bible-stream .sheet-tools{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px 10px;border-top:1px solid var(--rule);padding-top:12px;margin-top:8px}
#bible-stream .app .tool{display:inline-flex!important;align-items:center;gap:5px;padding:5px 8px!important;font:500 12px/1 var(--ui);color:var(--muted);border-radius:var(--r)!important}
#bible-stream .tool svg{width:16px;height:16px}
#bible-stream .tool:hover,#bible-stream .tool:active{color:var(--ink);background:var(--soft)}
#bible-stream button.vno.more{display:inline-grid!important;place-items:center;min-width:1.9em;height:1.9em;padding:0 3px!important;margin:0 5px 0 -2px;border:1px solid var(--rule)!important;border-radius:var(--r)!important;vertical-align:.25em;color:var(--ink);font:500 11px/1 var(--ui)}
#bible-stream button.vno.more:hover,#bible-stream button.vno.more:active{background:var(--soft)}
#bible-stream .dec[role=button]{cursor:pointer}
#bible-stream button.dec{display:inline!important;padding:0!important;font:inherit;color:inherit;background:none;border:0!important;cursor:pointer;text-align:inherit}
#bible-stream .bg-lines{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;margin:0 0 8px 1.6em;color:var(--muted)}
#bible-stream .bg-label svg{width:14px;height:14px;vertical-align:-2px}
#bible-stream .verse-line{font:400 var(--read)/1.75 var(--serif);margin:0}
#bible-stream .app.flow .column{line-height:1.75}
#bible-stream .app.flow .stream-entry.verse,#bible-stream .app.flow .verse-line{display:inline;padding:0}
#bible-stream .app.flow .stream-entry.verse::after{content:' '}
#bible-stream .app.flow .alt-line{display:inline;margin:0 .25em}
#bible-stream .app.flow .bg-lines,#bible-stream .app.flow .bg-label,#bible-stream .app.flow .bg-line{display:inline!important;margin:0 .35em 0 0}
#bible-stream .app.flow .bg-lines{margin-left:.25em}
#bible-stream .app.flow .bg-label svg{display:inline-block!important;vertical-align:-2px;margin-right:.25em}
#bible-stream .app.flow .part-head{margin:22px 0 6px}
#bible-stream .vno{font:500 11px/1 var(--ui);color:var(--muted);vertical-align:.6em;margin-right:4px;font-variant-numeric:tabular-nums}
#bible-stream .placeholder .stream-copy{color:var(--muted);font-size:calc(var(--read) * .8)}
#bible-stream .more{display:inline-grid!important;place-items:center;width:28px;height:28px;margin-left:4px;vertical-align:-6px;border-radius:var(--r)!important;color:var(--muted)}
#bible-stream .more:hover{background:var(--soft);color:var(--ink)}
#bible-stream .more svg{width:15px;height:15px;flex-basis:15px}
#bible-stream .alt-line{display:block;font:italic 400 calc(var(--read) * .82)/1.5 var(--serif);color:var(--muted);margin:2px 0 8px 1.4em}
#bible-stream .part-end{margin:4px 0 18px}
#bible-stream .app button.ref{display:inline!important;padding:0!important;font:inherit;color:inherit;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:.2em}
#bible-stream .app button.ref:hover{text-decoration-color:var(--ink)}
#bible-stream .xrefs{display:flex;flex-wrap:wrap;gap:6px}
#bible-stream .app button.ref.chip{display:inline-flex!important;align-items:center;padding:7px 11px!important;border:1px solid var(--rule)!important;border-radius:var(--r)!important;font:500 13px/1 var(--ui);text-decoration:none}
#bible-stream .app button.ref.chip:hover{background:var(--soft)}
#bible-stream .jump{position:absolute;left:0;right:0;top:calc(58px + env(safe-area-inset-top,0px));z-index:4;display:flex;justify-content:center;pointer-events:none}
#bible-stream .app .jump-back{pointer-events:auto;display:inline-flex!important;align-items:center;gap:6px;padding:7px 12px 7px 9px!important;border-radius:var(--r)!important;background:var(--ink);color:var(--bg);font:500 13px/1 var(--ui);box-shadow:0 2px 10px rgba(0,0,0,.18)}
#bible-stream .app .jump-back svg{width:15px;height:15px;transform:rotate(-90deg)}
#bible-stream .immersed .jump{opacity:0;pointer-events:none;transition:opacity .2s}
#bible-stream .crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;margin:2px 0 14px;font:500 14px/1.3 var(--ui)}
#bible-stream .app .crumbs button{padding:5px 7px!important;border-radius:var(--r)!important}
#bible-stream .app .crumbs button:hover{background:var(--soft)}
#bible-stream .app .crumbs button[aria-current=true]{background:var(--ink);color:var(--bg)}
#bible-stream .crumbs .sep{color:var(--muted);padding:0 2px}
#bible-stream .nav-block{margin-top:18px}
#bible-stream .sheet .nav-block h4{font:500 12px/1.4 var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
#bible-stream .app .nav-block .open{text-transform:none;letter-spacing:0;font:500 13px/1 var(--ui);color:var(--ink);display:inline-flex!important;align-items:center;gap:2px;padding:6px 4px 6px 8px!important;border-radius:var(--r)!important}
#bible-stream .app .nav-block .open:hover{background:var(--soft)}
#bible-stream .nav-block .open svg{width:15px;height:15px}
#bible-stream .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
#bible-stream .app .chip{padding:8px 12px!important;border:1px solid var(--rule)!important;border-radius:var(--r)!important;font:500 13px/1 var(--ui)}
#bible-stream .app .chip:hover{background:var(--soft)}
#bible-stream .app .chip.cur,#bible-stream .app .grid button.cur{background:var(--ink);color:var(--bg);border-color:var(--ink)!important}
#bible-stream .grid{display:grid;gap:6px}
#bible-stream .grid.nums{grid-template-columns:repeat(auto-fill,minmax(42px,1fr))}
#bible-stream .grid.books{grid-template-columns:repeat(auto-fill,minmax(86px,1fr))}
#bible-stream .app .grid button{position:relative;min-height:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px!important;border:1px solid var(--rule)!important;border-radius:var(--r)!important;font:500 14px/1.1 var(--ui);text-align:center;font-variant-numeric:tabular-nums}
#bible-stream .app .grid button:not(.cur):hover{background:var(--soft)}
#bible-stream .grid.books small{font:400 10.5px/1.15 var(--ui);color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bible-stream .grid button.cur small{color:inherit;opacity:.8}
#bible-stream .grid button.study::after,#bible-stream .nav-legend .dot{content:'';position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55}
#bible-stream .nav-legend{display:flex;align-items:center;gap:6px;margin-top:14px}
#bible-stream .nav-legend .dot{position:static;display:inline-block}
#bible-stream .nav-block .row{margin-bottom:6px}
#bible-stream .gap{margin:0 0 10px;font:400 14px/1.45 var(--ui);color:var(--muted)}
#bible-stream .grc{font-family:var(--serif);font-size:1.05em;letter-spacing:.01em}
#bible-stream .heb{font-family:"SBL Hebrew","Ezra SIL","Noto Serif Hebrew","Taamey Frank CLM","Times New Roman",var(--serif);font-size:1.2em;direction:rtl;unicode-bidi:isolate;line-height:1.6}
#bible-stream .il.he{direction:rtl}
#bible-stream .il.he summary{align-items:flex-end;direction:ltr;text-align:right}
#bible-stream .il.he details>dl,#bible-stream .il.he details>.ref-id{direction:ltr;text-align:left}
#bible-stream .il .m{display:block;font-size:12px;color:var(--muted)}
#bible-stream .dec{text-decoration-line:underline;text-decoration-thickness:1px;text-underline-offset:.22em;text-decoration-color:var(--muted)}
#bible-stream .dec.traditional{text-decoration-style:dotted}
#bible-stream .dec.interpretive{text-decoration-style:dashed}
#bible-stream .dec-tag.traditional,#bible-stream .dec-tag.interpretive{color:var(--ink)}
#bible-stream .grc-line{display:inline-flex;align-items:center;flex-wrap:wrap;gap:2px}
#bible-stream .play{display:inline-flex!important;align-items:center;justify-content:center;width:32px;height:32px;margin-left:4px;vertical-align:middle;color:var(--muted);border-radius:var(--r);flex:none}
#bible-stream .play svg{width:18px;height:18px}
#bible-stream .play:hover,#bible-stream .play:active{color:var(--ink);background:var(--soft)}
#bible-stream .tr-inline{font-family:var(--serif);color:var(--muted)}
#bible-stream .terms{display:flex;flex-direction:column;gap:2px;margin:2px 0 0;font-size:14px;color:var(--muted)}
#bible-stream .term{display:inline-flex;align-items:center;flex-wrap:wrap;gap:4px}
#bible-stream .term .lang{font-size:11px;letter-spacing:.06em;text-transform:uppercase}
#bible-stream .term .grc,#bible-stream .term .heb{color:var(--ink);font-family:var(--serif);font-size:16px}
#bible-stream .term .play,#bible-stream .body .play,#bible-stream .note .play{width:26px;height:26px;margin-left:0}
#bible-stream .term .play svg,#bible-stream .body .play svg,#bible-stream .note .play svg{width:15px;height:15px}
#bible-stream .tr{display:block;font:italic 14px/1.45 var(--serif);color:var(--muted);margin:0}
#bible-stream .il .tr{font-size:12.5px}
#bible-stream .il .g{display:inline-flex;align-items:center}
#bible-stream .set .chips{margin-top:0;justify-content:flex-end;max-width:100%}
#bible-stream .grc.small{font-size:15px;color:var(--muted);margin:6px 0 0;line-height:1.5}
#bible-stream .word-table{display:flex;flex-direction:column;gap:10px}
#bible-stream .word-row{display:flex;flex-direction:column;gap:2px;border-left:2px solid var(--rule);padding-left:12px}
#bible-stream .wit-group{border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
#bible-stream .wit-group.main{border-color:var(--ink)}
#bible-stream .wit-group p{margin:0}
#bible-stream .wit summary{display:flex;gap:12px;align-items:baseline;cursor:pointer;list-style:none;padding:6px 0;border-top:1px solid var(--soft)}
#bible-stream .wit summary::-webkit-details-marker{display:none}
#bible-stream .wit .sig{min-width:2.2em;font:500 17px/1 var(--serif);text-align:center}
#bible-stream .wit .sig.long{font:500 11px/1.2 var(--ui);color:var(--muted);max-width:3.4em}
#bible-stream .wit[open] summary{border-bottom:0}
#bible-stream .wit>p{margin:4px 0 4px 3.3em}
#bible-stream .sheet a{color:inherit;text-decoration:underline;text-decoration-color:var(--rule)}
#bible-stream .app .bg-line{display:inline;padding:2px 0;font:400 13px/1.4 var(--ui);color:var(--muted);text-align:left;border-bottom:1px dotted var(--rule)!important}
#bible-stream .bg-topic{font:500 16px/1.35 var(--ui);margin:0}

#bible-stream .load{display:block;margin:24px auto 0;font-size:13px;color:var(--muted)}
#bible-stream .end{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;margin:40px 0 0}

/* Blatt */
#bible-stream .scrim{position:absolute;inset:0;background:var(--scrim);z-index:8}
#bible-stream .sheet{position:absolute;left:0;right:0;bottom:0;z-index:9;max-height:88%;overflow-y:auto;background:var(--sheet);border-top:1px solid var(--rule);padding:8px 22px calc(28px + env(safe-area-inset-bottom,0px))}
#bible-stream .sheet .column{display:flex;flex-direction:column;gap:14px}
#bible-stream .grab{width:36px;height:4px;background:var(--rule);margin:6px auto 4px}
#bible-stream .sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
#bible-stream .sheet-head h3{font:400 24px/1.2 var(--ui);margin:0}
#bible-stream .app .close{display:inline-flex!important;align-items:center;gap:6px;flex:none;min-height:38px;padding:0 12px 0 9px!important;color:var(--muted);font:500 14px/1 var(--ui);border-radius:var(--r)!important;transition:background .15s,color .15s}
#bible-stream .close svg{width:18px;height:18px}
#bible-stream .close:hover,#bible-stream .close:active{background:var(--soft);color:var(--ink)}
#bible-stream .app .sheet:focus,#bible-stream .app .sheet:focus-visible{outline:none}
#bible-stream .sheet h4{font:400 20px/1.3 var(--serif);margin:12px 0 0}
#bible-stream .sheet p{margin:0}
#bible-stream .sheet .body{font:400 17px/1.6 var(--serif)}
#bible-stream .sheet .note{font-size:14px;color:var(--muted)}
#bible-stream .point{border-left:2px solid var(--rule);padding-left:14px;display:flex;flex-direction:column;gap:6px}
#bible-stream .pair{display:grid;gap:8px}
#bible-stream .reading-card{border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:5px}
#bible-stream .reading-card.main{border-color:var(--ink)}
#bible-stream .tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#bible-stream .dots{display:inline-flex;gap:4px;margin-right:8px;vertical-align:middle}
#bible-stream .dots i{width:8px;height:8px;background:var(--rule)}
#bible-stream .dots i.on{background:var(--ink)}
#bible-stream .il{display:flex;flex-wrap:wrap;gap:12px 14px}
#bible-stream .il details{min-width:0}
#bible-stream .il summary{list-style:none;cursor:pointer;display:flex;flex-direction:column}
#bible-stream .il summary::-webkit-details-marker{display:none}
#bible-stream .il .g{font:400 19px/1.3 var(--serif)}
#bible-stream .il .d{font-size:13px}
#bible-stream .il .e{font-size:11.5px;color:var(--muted)}
#bible-stream .il details[open]{flex-basis:100%;border-left:2px solid var(--rule);padding-left:12px}
#bible-stream .il details[open] summary{margin-bottom:6px}
#bible-stream .kv{display:grid;grid-template-columns:9em minmax(0,1fr);gap:4px 10px;font-size:14px}
#bible-stream .kv dt{color:var(--muted)}#bible-stream .kv dd{margin:0}
#bible-stream .ref-id{font:11px/1.4 ui-monospace,Menlo,monospace;color:var(--muted);overflow-wrap:anywhere}
#bible-stream .row{display:flex!important;justify-content:space-between;align-items:center;width:100%;min-height:50px;border-top:1px solid var(--rule)!important;gap:10px}
#bible-stream .row .sub{display:block;font-size:12.5px;color:var(--muted)}
#bible-stream .row.current{font-weight:600}
#bible-stream .dss{margin:0 0 12px;padding:0 0 0 10px;border-left:2px solid var(--rule)}
#bible-stream .dss-name{margin:0 0 4px;font:500 14px/1.35 var(--ui)} #bible-stream .dss-name .sub{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
#bible-stream .dss-text{margin:0 0 6px;font-size:calc(var(--read) * 1.05);line-height:1.9}
#bible-stream .dw.reconstructed{color:var(--muted)} #bible-stream .dw.differs,#bible-stream .dw.extra{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:.3em}
#bible-stream .dw.spelling{text-decoration:underline dotted;text-underline-offset:.3em}

#bible-stream .app{--r-free:#2e7a4b;--r-sa:#2b7d7a;--r-nc:#2f5fa8;--r-ask:#9a6a00;--r-prot:#b03a2e}
#bible-stream .app[data-theme=dark]{--r-free:#6cc58f;--r-sa:#62c4bf;--r-nc:#8cb0ef;--r-ask:#e2b552;--r-prot:#ef8a7e}
#bible-stream .src-legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 16px;margin:0 0 12px}
#bible-stream .src-key{display:flex;gap:10px;align-items:flex-start;font:500 14px/1.35 var(--ui)}
#bible-stream .src-key .sub{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
#bible-stream .rights-sw{flex:none;width:12px;height:12px;border-radius:3px;margin-top:3px}
#bible-stream .r-free{--rc:var(--r-free)} #bible-stream .r-sa{--rc:var(--r-sa)} #bible-stream .r-nc{--rc:var(--r-nc)} #bible-stream .r-ask{--rc:var(--r-ask)} #bible-stream .r-prot{--rc:var(--r-prot)}
#bible-stream .rights-sw{background:var(--rc)}

const AREAS_DE={at:'Altes Testament (hebräisch)',lxx:'Septuaginta',nt:'Neues Testament (griechisch)',versions:'Alte Übersetzungen, Kirchenväter',all:'Übergreifend'};
const LAYERS_DE={manuscripts:'Handschriften',editions:'Editionen',language_data:'Sprachdaten',lexica:'Lexika',context:'Kontext',translations:'Übersetzungen',aux:'Hilfsdaten'};
function sourcesMapSheet(){
  const t=T(),f=S.srcFilter||'all',cat=CATALOG||[];
  const keep=s=>f==='all'||(f==='used'&&s.use==='used')||(f==='free'&&(s.rights==='free'||s.rights==='sa'))||(f==='nc'&&s.rights==='nc')||(f==='closed'&&(s.rights==='ask'||s.rights==='prot'));
  const n=k=>cat.filter(s=>s.use===k).length;
  const chip=(k,l)=>`<button type="button" class="chip${f===k?' cur':''}" data-src-filter="${k}" aria-pressed="${f===k}">${l}</button>`;
  const legend=Object.entries(RIGHTS).map(([k,[l,d]])=>`<div class="src-key"><i class="rights-sw r-${k}"></i><span>${l}<span class="sub">${d}</span></span></div>`).join('');
  const groups=Object.entries(AREAS_DE).map(([ak,al])=>{const items=cat.filter(s=>s.area===ak&&keep(s));if(!items.length)return'';
    return `<h4>${al}</h4>`+items.map(s=>`<details class="src-item r-${s.rights}"><summary><span class="src-use u-${s.use}" aria-hidden="true"></span><span class="src-name">${esc(s.title)}<span class="sub">${esc(LAYERS_DE[s.layer]||'')} · ${esc(s.license)} · ${USES[s.use]}</span></span></summary><p>${esc(s.why)}</p>${s.url?`<p class="note"><a class="link" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.url.replace(/^https?:\/\//,''))}</a></p>`:''}</details>`).join('');}).join('');
  openSheet('sources-map',head(t.sourcesMap)+`<p class="note">${cat.length} Quellen · ${n('used')} verwendet · ${n('cited')} zitiert · ${n('nc_planned')} für die nicht kommerzielle Schicht vorgesehen. Der Lesetext ist immer eine eigene Übersetzung aus dem Urtext.</p>
  <div class="src-legend">${legend}</div>
  <div class="src-uses"><span><span class="src-use u-used"></span>verwendet</span><span><span class="src-use u-cited"></span>nur zitiert</span><span><span class="src-use u-nc_planned"></span>vorgesehen</span><span><span class="src-use u-not_used"></span>nicht verwendet</span></div>
  <div class="chips" role="group">${chip('all','Alle')}${chip('used','Verwendet')}${chip('free','Frei')}${chip('nc','Nicht kommerziell')}${chip('closed','Anfrage, geschützt')}</div>
  ${groups||`<p class="note">${t.empty}</p>`}
  <p class="note">Antippen zeigt, wofür wir eine Quelle nutzen oder weshalb (noch) nicht. Lizenzangaben nach den Anbietern, vor jedem Import neu geprüft; keine Rechtsberatung.</p>`);
}
function menuSheet(){
  const t=T(),seg=(key,opts,val)=>`<div class="seg" role="group">${opts.map(([v,l])=>`<button type="button" data-set="${key}" data-value="${v}" aria-pressed="${String(val)===String(v)}">${l}</button>`).join('')}</div>`;
  const sw=(key,label,sub)=>`<div class="set"><span>${label}<span class="sub">${sub}</span></span><button type="button" class="switch" role="switch" aria-checked="${S[key]}" data-toggle="${key}" aria-label="${label}"></button></div>`;
  openSheet('menu',head(t.menu,t.done)+`<label for="find-${appIndex}" class="note">${t.search}</label><input id="find-${appIndex}" type="search" placeholder="${t.hint}" value="${esc(query)}" autocomplete="off"><div class="results"></div>
  <p class="note">${t.examples}</p>${STUDY.sections.map(sec=>`<button type="button" class="row" data-go="${sec.parts[0].id}"><span>${esc(refDe(sec.range))} · ${esc(pTitle(sec))}</span>${icon('chevron-right')}</button>`).join('')}
  <button type="button" class="row" data-go="all"><span>${t.home}</span>${icon('chevron-right')}</button>
  ${STUDY.layer_order.length>1?`<div class="set"><span>${t.readText}<span class="sub">${t.readTextSub}</span></span>${seg('text',STUDY.layer_order.map(k=>[k,STUDY.layers[k].label]),S.text)}</div>`:''}
  <div class="set"><span>${t.colors}</span>${seg('theme',[['auto',t.auto],['light',t.light],['dark',t.dark]],S.theme)}</div>
  <div class="set"><span>${t.size}</span>${seg('read',[[17,'A−'],[19,'A'],[22,'A+']],S.read)}</div>
  <div class="set"><span>${t.language}</span>${seg('lang',[['de','Deutsch'],['en','English']],lang)}</div>
  ${sw('flow',t.flow,t.flowSub)}${sw('inline',t.inline,t.inlineSub)}${sw('bgInline',t.bgInline,t.bgInlineSub)}${sw('advanced',t.advanced,t.advancedSub)}${sw('translit',t.translit,t.translitSub)}
  <div class="set"><span>${t.pron}<span class="sub">${t.pronSub}</span></span>${seg('pron',[['modern',t.pronModern],['school',t.pronSchool]],S.pron)}</div>
  ${(()=>{const lg=pronLang('el'),vs=voicesFor(lg),cur=(S.voice||{})[lg]||'';return `<div class="set"><span>${t.voice}${vs.length?'':`<span class="sub">${t.noVoice}</span>`}</span>${vs.length?`<div class="chips" role="group">${[['',t.voiceAuto],...vs.map(v=>[v.name,v.name.replace(/\s*\(.*\)$/,'')])].map(([v,l])=>`<button type="button" class="chip${cur===v?' cur':''}" data-set="voice" data-value="${esc(v)}" aria-pressed="${cur===v}">${esc(l)}</button>`).join('')}</div>`:''}</div>`;})()}
  <div class="set"><span>${t.rate}</span>${seg('rate',[[0.7,t.slow],[0.85,t.normal]],S.rate)}</div>
  <div class="set"><span>${t.sample}</span><span class="grc-line"><span class="grc">Πάτερ ἡμῶν</span>${play('Πάτερ ἡμῶν ὁ ἐν τοῖς οὐρανοῖς')}</span></div>
  <button type="button" class="row" data-sources-map><span>${t.sourcesMap}<span class="sub">${t.sourcesMapSub}</span></span>${icon('chevron-right')}</button>
  <details class="about"><summary>${t.about}</summary><div>
   <p>${lang==='de'?'Ein Prototyp. Zusammenfassungen, Übersetzung und Erklärungen sind KI-Entwürfe und noch nicht fachlich geprüft. Ausgearbeitet sind bisher '+STUDY.sections.map(x=>refDe(x.range)).join(', ')+'; an anderen Stellen fehlt der Bibeltext noch.':'A prototype. Summaries, translation and notes are AI drafts, not yet reviewed. Worked out so far: '+STUDY.sections.map(x=>refDe(x.range)).join(', ')+'.'}</p>
   <p>${lang==='de'?'Bücher, Kapitel und Verszählung folgen vorläufig dem protestantischen Kanon mit 66 Büchern und der Zählung der King-James-Bibel (Testkonfiguration). Abschnitte ausserhalb der ausgearbeiteten Stellen umfassen der Einfachheit halber je bis zu fünf Verse.':'Books and verse numbering follow the 66-book Protestant canon with KJV numbering for now.'}</p>
   <p>${stats.books} ${lang==='de'?'Bücher':'books'} · ${stats.chapters.toLocaleString(lang)} ${lang==='de'?'Kapitel':'chapters'} · ${stats.verses.toLocaleString(lang)} ${t.verses}</p>
   ${sourcesBlock()}</div></details>`);
  renderResults();
}
function renderResults(){const box=host.querySelector('.results');if(!box)return;box.innerHTML=query?search(query).map(n=>`<button type="button" class="row" data-go="${n.id}"><span>${esc(title(n))}</span>${icon('chevron-right')}</button>`).join('')||`<p class="note" role="status">${T().empty}</p>`:'';}
let nav=null;
function navFrom(id){const st={t:'nt',g:null,b:null,c:null};for(const x of ancestors(id)){const n=nodes.get(x);if(n.level===1)st.t=n.id;if(n.level===2)st.g=n.gi;if(n.level===3)st.b=n.b;if(n.level===4)st.c=n.c;}return st;}
function navSheet(reset){
  if(reset||!nav)nav=navFrom(current);const t=T(),L=lang==='de';
  const name=n=>n.level===0?t.bible:n.level===5&&n.part?pTitle(n.part):n.level===4?(L?'Kapitel ':'Chapter ')+n.c:n.level===6?(L?'Vers ':'Verse ')+n.v:n.level===5?(L?'Verse ':'Verses ')+n.v+'–'+n.last:(L?n.de:n.en);
  const crumbs=ancestors(current).map(id=>`<button type="button" data-go="${id}" ${id===current?'aria-current="true"':''}>${esc(name(nodes.get(id)))}</button>`).join('<span class="sep">›</span>');
  const workedBook=code=>STUDY.sections.some(sec=>rangeOf(sec.range).code===code),workedCh=(code,c)=>STUDY.sections.some(sec=>{const g=rangeOf(sec.range);return g.code===code&&g.c===c;});
  let h=head(t.contents)+`<p class="note">${t.here}</p><div class="crumbs">${crumbs}</div>`;
  h+=`<label for="find-nav-${appIndex}" class="note">${t.search}</label><input id="find-nav-${appIndex}" type="search" placeholder="${t.hint}" value="${esc(query)}" autocomplete="off"><div class="results"></div>`;
  h+=`<div class="nav-block"><div class="seg" role="group">${['ot','nt'].map(x=>`<button type="button" data-nav="t:${x}" aria-pressed="${nav.t===x}">${esc(L?nodes.get(x).de:nodes.get(x).en)}</button>`).join('')}</div>
   <div class="chips">${nodes.get(nav.t).children.map(gid=>{const g=nodes.get(gid);return `<button type="button" class="chip${nav.g===g.gi?' cur':''}" data-nav="g:${g.gi}">${esc(L?g.de:g.en)}</button>`;}).join('')}</div></div>`;
  if(nav.g!=null){const gn=nodes.get('g'+nav.g);
    h+=`<div class="nav-block"><h4><span>${L?'Buch':'Book'}</span>${nav.b!=null?`<button type="button" class="open" data-go="b${nav.b}">${esc(L?DATA[nav.b].de:DATA[nav.b].en)} ${t.open}${icon('chevron-right')}</button>`:''}</h4><div class="grid books">${gn.children.map(bid=>{const bn=nodes.get(bid),d=DATA[bn.b];return `<button type="button" class="${nav.b===bn.b?'cur':''}${workedBook(d.code)?' study':''}" data-nav="b:${bn.b}" aria-label="${esc(L?d.de:d.en)}"><b>${esc(L?(SHORT[d.code]||d.abbr):d.abbr)}</b><small>${esc(L?d.de:d.en)}</small></button>`;}).join('')}</div></div>`;}
  if(nav.b!=null){const bn=nodes.get('b'+nav.b),code=DATA[nav.b].code;
    h+=`<div class="nav-block"><h4><span>${L?'Kapitel':'Chapter'}</span>${nav.c?`<button type="button" class="open" data-go="c${nav.b}-${nav.c}">${esc(L?DATA[nav.b].de:DATA[nav.b].en)} ${nav.c} ${t.open}${icon('chevron-right')}</button>`:''}</h4><div class="grid nums">${bn.children.map(cid=>{const cn=nodes.get(cid);return `<button type="button" class="${nav.c===cn.c?'cur':''}${workedCh(code,cn.c)?' study':''}" data-nav="c:${cn.c}">${cn.c}</button>`;}).join('')}</div></div>`;}
  if(nav.b!=null&&nav.c){const cn=nodes.get(`c${nav.b}-${nav.c}`),parts=cn.children.map(id=>nodes.get(id)).filter(x=>x.part),vs=cn.children.flatMap(sid=>nodes.get(sid).children);
    h+=`<div class="nav-block"><h4><span>${L?'Vers':'Verse'}</span></h4>${parts.map(x=>`<button type="button" class="row" data-go="${x.id}"><span>${esc(pTitle(x.part))} <span class="note">${x.v}–${x.last}</span></span>${icon('chevron-right')}</button>`).join('')}<div class="grid nums">${vs.map(vid=>{const v=nodes.get(vid);return `<button type="button" class="${current===vid?'cur':''}${isPilotVerse(v)?' study':''}" data-go="${vid}">${v.v}</button>`;}).join('')}</div></div>`;}
  h+=`<p class="note nav-legend"><span class="dot"></span> ${L?'ausgearbeitet':'worked out'}</p>`;
  openSheet('nav',h);renderResults();
}
function levelsSheet(){const n=nodes.get(current);openSheet('levels',head(T().levelsTitle)+T().levels.map((name,i)=>`<button type="button" class="row ${i===n.level?'current':''}" data-level="${i}"><span>${name}</span>${icon('chevron-right')}</button>`).join(''));}

/* ---------- Ereignisse ---------- */
app.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-close],[role=button]');
  if(!b){if(e.target.closest('.reader'))app.classList.toggle('immersed');return;}
  if(b.dataset.dec!==undefined){const c=b.closest('[data-ref]');if(c){decisionSheet(c.dataset.ref,Number(b.dataset.dec));return;}}
  if(b.dataset.speak!==undefined){e.preventDefault();e.stopPropagation();speak(b.dataset.speak,b.dataset.speakLang,b.dataset.speakTr);return;}
  if(b.hasAttribute('data-close')){closeSheet();return;}
  if(b.dataset.deep){const n=nodes.get(b.dataset.deep);current=b.dataset.deep;go(remembered.get(current)||n.children[0]);return;}
  if(b.dataset.refGo){goRef(b.dataset.refGo);return;}
  if(b.dataset.nav){const [k,v]=b.dataset.nav.split(':');if(k==='t'){nav={t:v,g:null,b:null,c:null};}else if(k==='g'){nav.g=Number(v);nav.b=null;nav.c=null;}else if(k==='b'){nav.b=Number(v);nav.c=null;}else if(k==='c'){nav.c=Number(v);}
    const old=host.querySelector('.sheet'),y=old?old.scrollTop:0;navSheet();const sh=host.querySelector('.sheet');if(sh&&sh.scrollTo)sh.scrollTo(0,y);const last=host.querySelector('.nav-block:last-of-type');if(last&&last.scrollIntoView)last.scrollIntoView({block:'nearest'});return;}
  if(b.dataset.go){go(b.dataset.go);return;}
  if(b.dataset.level!==undefined){go(resolveLevel(Number(b.dataset.level)));return;}
  if(b.dataset.source){sourceSheet(b.dataset.source,b.dataset.verse);const sh=host.querySelector('.sheet');if(sh&&sh.scrollTo)sh.scrollTo(0,0);return;}
  if(b.dataset.more){verseSheet(b.dataset.more);return;}
  if(b.dataset.study){studySheet(b.dataset.study);return;}
  if(b.dataset.background){bgSheet(b.dataset.background);return;}
  if(b.dataset.overview){overviewSheet(b.dataset.overview);return;}
  if(b.hasAttribute('data-sources-map')){sourcesMapSheet();return;}
  if(b.dataset.srcFilter){S.srcFilter=b.dataset.srcFilter;sourcesMapSheet();return;}
  if(b.dataset.bg){bgOne(b.dataset.bg);return;}
  if(b.dataset.set){const k=b.dataset.set,v=b.dataset.value;if(k==='lang')lang=v;else if(k==='voice')S.voice={...(S.voice||{}),[pronLang('el')]:v};else S[k]=(k==='read'||k==='rate')?Number(v):v;save();rerenderKeep();reopenMenu();return;}
  if(b.dataset.toggle){S[b.dataset.toggle]=!S[b.dataset.toggle];save();rerenderKeep();reopenMenu();return;}
  const a=b.dataset.action,n=nodes.get(current);
  if(a==='home')go('all');else if(a==='menu'){if(sheet==='menu')closeSheet();else menuSheet();}
  else if(a==='index')navSheet(true);else if(a==='back'){const tgt=jumpFrom;jumpFrom=null;go(tgt);}else if(a==='levels')levelsSheet();
  else if(a==='up')go(n.parent);else if(a==='down')go(remembered.get(current)||n.children[0]);
  else if(a==='load-next')loadMore();else if(a==='load-prev')loadMore(true);
});
app.addEventListener('input',e=>{if(e.target.type==='search'){query=e.target.value;renderResults();}});
app.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet){closeSheet();reader.focus({preventScroll:true});}
  // Markierte Übersetzungsentscheidungen sind Textstellen (span), damit lange Markierungen normal umbrechen; per Tastatur bedienbar
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role=button].dec')){e.preventDefault();e.target.click();}});
let busy=false,lastTop=0;
reader.addEventListener('scroll',()=>{if(busy)return;busy=true;
  const y=reader.scrollTop;if(y>80&&y-lastTop>6)app.classList.add('immersed');else if(lastTop-y>6||y<40)app.classList.remove('immersed');lastTop=y;
  const top=reader.getBoundingClientRect().top+70;const active=[...reader.querySelectorAll('[data-stream]')].find(el=>el.getBoundingClientRect().bottom>top);
  if(active&&active.dataset.stream!==current){current=active.dataset.stream;for(const child of ancestors(current).slice(1))remembered.set(nodes.get(child).parent,child);chrome();aside.querySelectorAll('[data-go]').forEach(x=>x.setAttribute('aria-current',String(x.dataset.go===current)));}
  if(reader.scrollTop+reader.clientHeight>reader.scrollHeight-300)loadMore();else if(reader.scrollTop<30&&readerStart>0)loadMore(true);
  busy=false;},{passive:true});
// Weiterlesen ohne Knopf: Sobald «Weiterlesen» in die Nähe des sichtbaren Bereichs kommt, wird nachgeladen – auch wenn
// der Inhalt kürzer als der Bildschirm ist (dann gibt es kein Scroll-Ereignis). Über den Anfang bzw. das Ende hinaus
// ziehen (Mausrad, Wischen) lädt ebenfalls nach. Der Knopf bleibt als Rückfall für Tastatur und Vorlesehilfen.
const nearEnd=('IntersectionObserver' in globalThis)?new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting))requestAnimationFrame(()=>loadMore());},{root:reader,rootMargin:'0px 0px 600px 0px'}):null;
const watchEnd=()=>{if(!nearEnd)return;nearEnd.disconnect();const b=reader.querySelector('.load-after');if(b)nearEnd.observe(b);};
new MutationObserver(watchEnd).observe(reader,{childList:true,subtree:false});
reader.addEventListener('wheel',e=>{if(e.deltaY>0&&reader.scrollTop+reader.clientHeight>=reader.scrollHeight-2)loadMore();else if(e.deltaY<0&&reader.scrollTop<=0&&readerStart>0)loadMore(true);},{passive:true});
let touchY=null;
reader.addEventListener('touchstart',e=>{touchY=e.touches[0].clientY;},{passive:true});
reader.addEventListener('touchmove',e=>{if(touchY===null)return;const dy=e.touches[0].clientY-touchY;
  if(dy<-40&&reader.scrollTop+reader.clientHeight>=reader.scrollHeight-2){touchY=null;loadMore();}
  else if(dy>40&&reader.scrollTop<=0&&readerStart>0){touchY=null;loadMore(true);}},{passive:true});
reader.addEventListener('touchend',()=>{touchY=null;},{passive:true});
render();
});
if(globalThis.__BIBLE_TEST__)globalThis.__BIBLE_TEST__({nodes,verses,stats,search,sibling,ancestors,streams,BOOK_SUMMARIES,STUDY,BG,translit});
})();
